  <script>
    // EMBEDDED MASTER DATA (21 Modules, 440 MCQs, 28 Comparisons, Formulas, 26 Mock Tests, Glossary)
    const APP_DATA = {"modules": [{"id": "MOD-A", "code": "A", "title": "Module A: Introduction to Computer Organization and Architecture", "shortTitle": "A. COA Introduction", "navGroup": "mod-arch-basics", "targetQuestions": 10, "subtopics": ["Meaning of Computer Organization", "Meaning of Computer Architecture", "Difference between Computer Organization and Computer Architecture", "Functional units of a computer", "Input unit", "Output unit", "Memory unit", "Arithmetic Logic Unit (ALU)", "Control Unit (CU)", "Central Processing Unit (CPU)", "Stored-program concept", "Von Neumann architecture", "Harvard architecture", "Modified Harvard architecture", "Von Neumann bottleneck", "Computer system hierarchy", "Basic computer block diagram", "Computer performance fundamentals", "Evolution of computer architecture"], "intro": "Computer Organization and Architecture (COA) forms the foundational bridge between software programs and digital hardware circuits. In DSSSB TGT/PGT, KVS, and NVS Computer Science examinations, questions from this module frequently test the conceptual boundary between programmer-visible attributes (Architecture) and hardware implementation details (Organization), the roles of functional units, and the structural contrast between Von Neumann and Harvard architectures.", "definitions": [{"term": "Computer Architecture", "def": "The conceptual design and fundamental operational structure of a computer system as seen by the assembly/machine language programmer (e.g., instruction set, number of bits used for data types, I/O mechanisms, and addressing modes)."}, {"term": "Computer Organization", "def": "The operational units and their interconnections that realize the architectural specifications (e.g., control signals, interfaces between computer and peripherals, memory technology used, and hardware adders/multipliers)."}, {"term": "Stored-Program Concept", "def": "Introduced by John von Neumann (1945) for the EDVAC design; it states that both program instructions and data are stored in the same read-write electronic main memory in binary format."}, {"term": "Von Neumann Bottleneck", "def": "The throughput limitation caused by a single shared system bus between the CPU and main memory for both instruction fetches and data transfers, preventing simultaneous instruction fetch and data access."}, {"term": "Harvard Architecture", "def": "A computer architecture with physically separate storage and separate signal pathways (buses) for instructions and data, enabling concurrent instruction fetch and data read/write."}], "explanation": "\n<h4>1. Architecture vs. Organization (The Classic Exam Distinction)</h4>\n<p>According to William Stallings and M. Morris Mano, <strong>Computer Architecture</strong> refers to those attributes of a system visible to a programmer (or compiler writer) that have a direct impact on the logical execution of a program. Examples include the Instruction Set Architecture (ISA), register count, addressing modes, and data representation widths. Conversely, <strong>Computer Organization</strong> refers to the operational hardware units and their interconnections that implement the architecture. For instance, whether a processor has a multiply instruction is an <em>architectural</em> decision; whether that instruction is implemented by a dedicated hardware multiplier unit or by repeated invocation of the addition unit is an <em>organizational</em> decision.</p>\n\n<h4>2. Five Functional Units of a Digital Computer</h4>\n<ul>\n  <li><strong>Input Unit:</strong> Accepts coded information from human operators or electromechanical devices (keyboards, scanners, sensors) and converts it into binary data understandable by the CPU (verified in <a href=\"https://www.utpaper.in/question/how-does-an-output-unit-interface-with-the-cpu-3330\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 12 Sep 2025 Shift 3 Q69</a>).</li>\n  <li><strong>Memory Unit:</strong> Stores programs and data. Divided into Primary/Main Memory (fast semiconductor RAM accessed directly by CPU words/addresses) and Secondary/Auxiliary Storage (magnetic/flash storage for large archival capacity).</li>\n  <li><strong>Arithmetic Logic Unit (ALU):</strong> Contains combinational logic circuits (adders, shifters, comparators, logic gates) that execute arithmetic (+, \u2212, \u00d7, \u00f7) and bitwise logical (AND, OR, NOT, XOR) operations (verified in <a href=\"https://www.utpaper.in/question/which-of-the-following-part-of-the-cpu-has-the-necessary-electronic-circuitry-to-2012\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 7 Feb 2024 Shift 2 Q118</a>).</li>\n  <li><strong>Control Unit (CU):</strong> The nerve center that coordinates all units by generating timing and control signals, managing the Fetch-Decode-Execute cycle (<a href=\"https://www.utpaper.in/question/which-cycle-is-primarily-managed-by-the-control-unit-3135\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 12 Sep 2025 Shift 1 Q74</a>).</li>\n  <li><strong>Output Unit:</strong> Counterpart of the input unit; converts internal binary results into human-readable visuals, printouts, or audio signals.</li>\n</ul>\n\n<h4>3. Von Neumann, Harvard, and Modified Harvard Architectures</h4>\n<p>In the <strong>Von Neumann (IAS) architecture</strong>, a single main memory holds both instructions and data, connected to the CPU via a single system bus (Address, Data, and Control buses). Because instructions and data share the same bus, the CPU cannot fetch the next instruction while reading/writing data in memory\u2014a limitation coined by John Backus in 1977 as the <strong>Von Neumann Bottleneck</strong>. In contrast, the <strong>Harvard Architecture</strong> uses physically distinct Instruction Memory and Data Memory with independent buses, allowing simultaneous instruction fetch and data access (1-cycle pipelined execution common in DSPs and microcontrollers like PIC and AVR). Modern desktop/mobile CPUs (x86-64, ARM Cortex-A) implement a <strong>Modified Harvard Architecture</strong>: they have a unified main memory (RAM) and L2/L3 cache, but split L1 Cache into an <strong>L1 Instruction Cache (I-Cache)</strong> and an <strong>L1 Data Cache (D-Cache)</strong> with separate internal buses to feed the pipeline concurrently.</p>\n\n<h4>4. Evolution of Computer Generations & System Hierarchy</h4>\n<ul>\n  <li><strong>1st Gen (1946\u20131959):</strong> Vacuum tubes (ENIAC, EDVAC, UNIVAC-I); machine/assembly language; magnetic drums.</li>\n  <li><strong>2nd Gen (1959\u20131965):</strong> Transistors (IBM 7090, CDC 1604); magnetic core memory; high-level languages (FORTRAN, COBOL); batch OS.</li>\n  <li><strong>3rd Gen (1965\u20131971):</strong> Integrated Circuits (SSI/MSI) (IBM System/360, PDP-8); microprogramming, cache memory, multiprogramming, family concept (same architecture across different organizations).</li>\n  <li><strong>4th Gen (1971\u20131980s):</strong> LSI/VLSI microprocessors (Intel 4004, 8085, 8086); semiconductor RAM; personal computers.</li>\n  <li><strong>5th Gen (Present):</strong> ULSI, multicore, superscalar, GPU/NPU parallel processing, quantum/neuromorphic frontiers.</li>\n</ul>\n", "classifications": ["By Architecture Paradigm: Von Neumann (Shared Bus/Memory), Pure Harvard (Separate Memories & Buses), Modified Harvard (Split L1 I/D Cache + Unified Main Memory).", "By System Abstraction Hierarchy (Top to Bottom): Level 6 Problem-Oriented Language -> Level 5 Assembly Language -> Level 4 Operating System Machine -> Level 3 ISA (Instruction Set Architecture) -> Level 2 Microarchitecture/Control -> Level 1 Digital Logic Gates -> Level 0 Device/Transistor Physics."], "diagramSvg": "<svg viewBox=\"0 0 760 240\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"190\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Von Neumann Architecture (Shared Bus)</text>\n  <rect x=\"20\" y=\"50\" width=\"130\" height=\"150\" rx=\"8\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"85\" y=\"75\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">CPU</text>\n  <rect x=\"32\" y=\"90\" width=\"106\" height=\"30\" rx=\"4\" fill=\"#0f172a\" stroke=\"#64748b\"/>\n  <text x=\"85\" y=\"110\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Control Unit (CU)</text>\n  <rect x=\"32\" y=\"128\" width=\"106\" height=\"30\" rx=\"4\" fill=\"#0f172a\" stroke=\"#64748b\"/>\n  <text x=\"85\" y=\"148\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">ALU</text>\n  <rect x=\"32\" y=\"164\" width=\"106\" height=\"26\" rx=\"4\" fill=\"#0f172a\" stroke=\"#64748b\"/>\n  <text x=\"85\" y=\"181\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">Registers (PC, IR)</text>\n  <line x1=\"150\" y1=\"110\" x2=\"230\" y2=\"110\" stroke=\"#f43f5e\" stroke-width=\"3\"/>\n  <line x1=\"150\" y1=\"140\" x2=\"230\" y2=\"140\" stroke=\"#38bdf8\" stroke-width=\"3\"/>\n  <text x=\"190\" y=\"102\" fill=\"#fda4af\" font-size=\"10\" text-anchor=\"middle\">Single Bus</text>\n  <text x=\"190\" y=\"158\" fill=\"#94a3b8\" font-size=\"9\" text-anchor=\"middle\">(Bottleneck)</text>\n  <rect x=\"230\" y=\"60\" width=\"130\" height=\"130\" rx=\"8\" fill=\"#1e293b\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <text x=\"295\" y=\"90\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Unified Memory</text>\n  <text x=\"295\" y=\"118\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"middle\">Instructions</text>\n  <text x=\"295\" y=\"138\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"middle\">+ Data</text>\n  <text x=\"295\" y=\"165\" fill=\"#fda4af\" font-size=\"10\" text-anchor=\"middle\">Same Address Space</text>\n\n  <line x1=\"385\" y1=\"15\" x2=\"385\" y2=\"225\" stroke=\"#475569\" stroke-dasharray=\"4,4\" stroke-width=\"2\"/>\n\n  <text x=\"575\" y=\"24\" fill=\"#10b981\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Harvard Architecture (Separate Buses)</text>\n  <rect x=\"405\" y=\"80\" width=\"110\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"460\" y=\"115\" fill=\"#f8fafc\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Instruction</text>\n  <text x=\"460\" y=\"132\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Memory</text>\n  <line x1=\"515\" y1=\"125\" x2=\"545\" y2=\"125\" stroke=\"#38bdf8\" stroke-width=\"3\"/>\n  <rect x=\"545\" y=\"60\" width=\"85\" height=\"130\" rx=\"8\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"587\" y=\"115\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">CPU</text>\n  <text x=\"587\" y=\"135\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">CU + ALU</text>\n  <line x1=\"630\" y1=\"125\" x2=\"655\" y2=\"125\" stroke=\"#eab308\" stroke-width=\"3\"/>\n  <rect x=\"655\" y=\"80\" width=\"90\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#eab308\" stroke-width=\"2\"/>\n  <text x=\"700\" y=\"115\" fill=\"#f8fafc\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Data</text>\n  <text x=\"700\" y=\"132\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">Memory</text>\n</svg>", "workedExamples": [{"title": "Identifying Architectural vs. Organizational Changes", "problem": "IBM System/360 Models 30 and 75 can run the exact same binary machine code programs without recompilation, yet Model 75 has a 64-bit memory bus and hardwired control while Model 30 has an 8-bit bus and microprogrammed control. How are these two models related?", "steps": ["Step 1: Recall that binary compatibility depends on the Instruction Set Architecture (ISA).", "Step 2: Because both models execute the same machine code, they share the same Computer Architecture.", "Step 3: Because their internal bus widths (64-bit vs 8-bit) and control unit designs differ, they have different Computer Organizations."], "answer": "Same Computer Architecture, Different Computer Organization."}, {"title": "Cycle Time Comparison: Von Neumann vs. Harvard", "problem": "Suppose an instruction stream contains 100 instructions, and 40% of them are LOAD/STORE instructions that also access a data operand in memory. If each memory access takes 1 bus cycle, how many bus cycles are required for memory accesses in a pure single-bus Von Neumann machine versus a dual-bus Harvard machine?", "steps": ["Step 1: Every instruction requires 1 instruction fetch from memory = 100 instruction fetches.", "Step 2: 40% of 100 = 40 instructions also require 1 data memory access.", "Step 3: In a single-bus Von Neumann machine, instruction fetch and data access cannot overlap: Total bus cycles = 100 + 40 = 140 cycles.", "Step 4: In a pipelined dual-bus Harvard machine, the 40 data memory accesses occur on the Data Bus simultaneously with subsequent instruction fetches on the Instruction Bus: Total bus cycles = 100 cycles."], "answer": "Von Neumann: 140 bus cycles; Harvard: 100 bus cycles (28.57% reduction in memory bus cycles)."}], "realWorld": "The Intel Core i7/i9 and Apple M-series chips use a Modified Harvard Architecture: main DDR5 RAM is unified (stored-program flexibility so OS loaders can load compiled programs as data and then jump to execute them), while L1 Cache is split into a 32KB/64KB L1 Instruction Cache and L1 Data Cache. Microcontrollers like Microchip PIC16/AVR ATmega328P (Arduino Uno) use a pure Harvard architecture with Flash ROM for instructions and SRAM for data.", "differences": "Computer Architecture defines 'WHAT' the computer does functionally at the machine-code interface (ISA, data types, addressing modes), whereas Computer Organization defines 'HOW' hardware components are interconnected and controlled to achieve that functionality (signals, memory technology, adder circuitry).", "formulas": ["Execution Time (T_exec) = Instruction Count (IC) \u00d7 Cycles Per Instruction (CPI) \u00d7 Clock Cycle Time (T_clk)", "System Bus Lines = Address Bus Lines + Data Bus Lines + Control Bus Lines"], "examTraps": ["TRAP 1: Thinking RAM is inside the internal architecture of the CPU. In DSSSB TGT CS (12 Sep 2025 Shift 3 Q90), RAM was tested as the component that is NOT part of the internal CPU architecture (only ALU, CU, and Registers are inside the CPU core).", "TRAP 2: Assuming Harvard architecture cannot have differing word widths. In fact, a major advantage of Harvard architecture is that Instruction Memory (e.g., 14-bit or 16-bit in PIC) and Data Memory (e.g., 8-bit) can have completely different word sizes and address widths!", "TRAP 3: Confusing ENIAC with EDVAC. ENIAC (1946) was initially programmed via plugboards/switches; EDVAC and the IAS machine were designed around the stored-program concept."], "factsToMemorize": ["Intel 4004 (1971) was the world's first commercial 4-bit microprocessor; Intel 8085 is an 8-bit microprocessor with a 16-bit address bus (64 KB memory).", "The IAS computer (Institute for Advanced Study, Princeton) had 1000 words \u00d7 40 bits of memory and registers AC, MQ, MBR, IBR, PC, IR, MAR.", "In the IAS machine, two 20-bit instructions (8-bit opcode + 12-bit address) were packed into a single 40-bit memory word; the right-hand instruction was buffered in the Instruction Buffer Register (IBR)."], "pyqInsights": "DSSSB TGT CS 2025 & 2024 heavily tested fundamental CPU boundaries (e.g., RAM not inside CPU, ALU performing binary addition/shifts but NOT memory addressing, CU managing the Instruction Cycle, and Output Unit converting binary to human-readable form).", "quickRevision": "Architecture = Programmer-visible ISA ('What'); Organization = Hardware implementation ('How'). CPU = ALU + CU + Registers. Von Neumann = 1 shared memory + 1 shared bus (Von Neumann Bottleneck). Harvard = Separate Instruction & Data memories/buses (concurrent fetch + data access). Modified Harvard = Split L1 I-Cache/D-Cache + Unified L2/L3/RAM."}, {"id": "MOD-B", "code": "B", "title": "Module B: Data Representation and Number Systems", "shortTitle": "B. Data Representation", "navGroup": "mod-data-rep", "targetQuestions": 25, "subtopics": ["Binary, Decimal, Octal, and Hexadecimal number systems", "Base conversion", "Binary addition, subtraction, multiplication, division", "1's complement and 2's complement", "Signed magnitude representation", "Sign extension", "Overflow and underflow", "Fixed-point representation", "Floating-point representation", "IEEE 754 floating-point standard (Single & Double precision)", "Biased exponent, Normalized & Denormalized numbers", "BCD (8421), Excess-3, and Gray code", "ASCII, Unicode, EBCDIC", "Parity bit, Error detection, Hamming code fundamentals"], "intro": "Data Representation and Number Systems is one of the highest-weightage numerical modules in DSSSB TGT/PGT, KVS, and NVS exams. Every shift in DSSSB TGT CS 2025 included questions on 2's complement representation, signed 8-bit ranges, base conversions, IEEE 754 biased exponents, or Hamming/BCD codes.", "definitions": [{"term": "Radix (Base r)", "def": "The number of unique digits used in a positional number system (e.g., r=2 for Binary {0,1}, r=8 for Octal {0..7}, r=16 for Hexadecimal {0..9, A..F})."}, {"term": "r's Complement (2's Complement)", "def": "For an n-digit number N in base r, the r's complement is r^n - N (for N != 0). In binary, 2's complement = 1's complement + 1."}, {"term": "(r-1)'s Complement (1's Complement)", "def": "For an n-digit number N in base r, it is (r^n - 1) - N. In binary, obtained by inverting every bit (0 -> 1 and 1 -> 0)."}, {"term": "Sign Extension", "def": "Increasing the bit-width of a signed 2's complement number while preserving its value and sign by replicating the Most Significant Bit (MSB / sign bit) into all newly added left positions."}, {"term": "IEEE 754 Standard", "def": "The universal standard for floating-point representation using three fields: Sign (S), Biased Exponent (E = e + Bias), and Fractional Mantissa/Significand (M), representing (-1)^S \u00d7 (1.M)_2 \u00d7 2^(E - Bias)."}], "explanation": "\n<h4>1. Signed Integer Representations & Ranges (For n Bits)</h4>\n<ul>\n  <li><strong>Signed-Magnitude:</strong> MSB is sign bit (<code>0</code> = +, <code>1</code> = \u2212), remaining <code>n \u2212 1</code> bits hold magnitude. Range: <code>\u2212(2^(n\u22121) \u2212 1)</code> to <code>+(2^(n\u22121) \u2212 1)</code>. For 8 bits: <code>\u2212127</code> to <code>+127</code>. Has <strong>two representations for zero</strong>: <code>+0 (00000000)</code> and <code>\u22120 (10000000)</code>.</li>\n  <li><strong>1's Complement:</strong> Negative number is formed by bitwise inversion of positive number. Range: <code>\u2212(2^(n\u22121) \u2212 1)</code> to <code>+(2^(n\u22121) \u2212 1)</code>. For 8 bits: <code>\u2212127</code> to <code>+127</code>. Also has <strong>two representations for zero</strong>: <code>+0 (00000000)</code> and <code>\u22120 (11111111)</code>. Addition requires <strong>end-around carry</strong>.</li>\n  <li><strong>2's Complement:</strong> Negative number is 1's complement + 1. Range: <code>\u22122^(n\u22121)</code> to <code>+(2^(n\u22121) \u2212 1)</code>. For 8 bits: <code>\u2212128</code> to <code>+127</code>. Has a <strong>unique representation for zero</strong> (<code>00000000</code>), and the asymmetric pattern <code>1000...000</code> represents <code>\u22122^(n\u22121)</code> (e.g., <code>10000000_2 = \u2212128</code> in 8-bit).</li>\n</ul>\n\n<h4>2. Overflow Rules in 2's Complement Arithmetic</h4>\n<p>Overflow occurs when the algebraic result of adding two n-bit signed numbers falls outside the representable range <code>[\u22122^(n\u22121), +(2^(n\u22121) \u2212 1)]</code>. Two equivalent hardware detection tests:</p>\n<ol>\n  <li><strong>Sign Rule:</strong> Overflow can ONLY occur when adding two numbers of the <strong>same sign</strong> (Positive + Positive gives Negative, or Negative + Negative gives Positive). Adding two numbers of opposite signs can <em>never</em> overflow.</li>\n  <li><strong>Carry XOR Rule:</strong> <code>V = C_(n\u22121) \u2295 C_n</code>, where <code>C_(n\u22121)</code> is the carry into the sign bit (MSB) and <code>C_n</code> is the carry out of the sign bit. If they differ, overflow occurred!</li>\n</ol>\n\n<h4>3. IEEE 754 Floating-Point Standard</h4>\n<ul>\n  <li><strong>Single Precision (32-bit):</strong> 1 Sign bit (<code>S</code>) + 8 Biased Exponent bits (<code>E</code>, Bias = <code>2^(8\u22121) \u2212 1 = 127</code>) + 23 Fraction/Mantissa bits (<code>M</code>). Implicit leading bit <code>1.M</code> gives 24 bits of significand precision (~7 decimal digits).</li>\n  <li><strong>Double Precision (64-bit):</strong> 1 Sign bit (<code>S</code>) + 11 Biased Exponent bits (<code>E</code>, Bias = <code>2^(11\u22121) \u2212 1 = 1023</code>) + 52 Fraction/Mantissa bits (<code>M</code>). Implicit leading bit gives 53 bits of precision (~15\u201317 decimal digits).</li>\n  <li><strong>Special IEEE 754 Values (Single Precision):</strong>\n    <ul>\n      <li><code>E = 0, M = 0</code>: Exact Zero (<code>\u00b10.0</code>).</li>\n      <li><code>E = 0, M \u2260 0</code>: <strong>Denormalized (Subnormal) number</strong> = <code>(\u22121)^S \u00d7 (0.M)_2 \u00d7 2^(\u2212126)</code> (handles gradual underflow).</li>\n      <li><code>1 \u2264 E \u2264 254</code>: <strong>Normalized number</strong> = <code>(\u22121)^S \u00d7 (1.M)_2 \u00d7 2^(E \u2212 127)</code>.</li>\n      <li><code>E = 255 (all 1s), M = 0</code>: Infinity (<code>\u00b1\u221e</code>).</li>\n      <li><code>E = 255 (all 1s), M \u2260 0</code>: <strong>NaN</strong> (Not a Number, e.g., 0/0 or \u221a\u22121).</li>\n    </ul>\n  </li>\n</ul>\n\n<h4>4. Binary Codes & Hamming Error Correction</h4>\n<ul>\n  <li><strong>BCD (8421 Code):</strong> Weighted code representing each decimal digit (0\u20139) with 4 bits. Invalid patterns: <code>1010 (10)</code> through <code>1111 (15)</code>. In BCD addition, if a 4-bit sum exceeds 9 or generates a carry, add <code>6 (0110_2)</code> to correct it.</li>\n  <li><strong>Excess-3 Code:</strong> Unweighted, <strong>self-complementing</strong> code obtained by adding <code>3 (0011_2)</code> to each BCD digit (9's complement is found simply by inverting bits).</li>\n  <li><strong>Gray Code (Reflected Binary Code):</strong> Unweighted, cyclic unit-distance code where successive values differ in <strong>only 1 bit position</strong>. Binary-to-Gray: <code>G_n = B_n</code>, <code>G_i = B_(i+1) \u2295 B_i</code>. Used in rotary encoders and K-maps.</li>\n  <li><strong>Hamming Code:</strong> For <code>m</code> data bits, the number of parity/redundant bits <code>r</code> placed at powers of 2 (positions 1, 2, 4, 8, ...) must satisfy <strong><code>2^r \u2265 m + r + 1</code></strong> for single-bit error correction (minimum Hamming distance <code>d_min = 3</code>). To detect <code>d</code> errors, <code>d_min = d + 1</code>; to correct <code>t</code> errors, <code>d_min = 2t + 1</code>.</li>\n</ul>\n", "classifications": ["Weighted Codes: Binary, 8421 BCD, 2421 Code (also self-complementing).", "Non-Weighted Codes: Excess-3 (self-complementing), Gray Code (unit-distance / minimum error code).", "Alphanumeric Codes: ASCII (7-bit = 128 chars; Extended ASCII = 8-bit = 256 chars), EBCDIC (8-bit IBM mainframe code), Unicode (UTF-8, UTF-16, UTF-32)."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">IEEE 754 Single Precision (32-Bit) Floating-Point Format</text>\n  <rect x=\"30\" y=\"45\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#7f1d1d\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"55\" y=\"68\" fill=\"#fef2f2\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">S (1b)</text>\n  <text x=\"55\" y=\"85\" fill=\"#fca5a5\" font-size=\"10\" text-anchor=\"middle\">Bit 31</text>\n\n  <rect x=\"85\" y=\"45\" width=\"190\" height=\"50\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"180\" y=\"68\" fill=\"#eff6ff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Biased Exponent E (8 bits)</text>\n  <text x=\"180\" y=\"85\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">Bits 30 .. 23 (Bias = +127)</text>\n\n  <rect x=\"280\" y=\"45\" width=\"450\" height=\"50\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"505\" y=\"68\" fill=\"#ecfdf5\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Fraction / Mantissa M (23 bits)</text>\n  <text x=\"505\" y=\"85\" fill=\"#6ee7b7\" font-size=\"10\" text-anchor=\"middle\">Bits 22 .. 0 (Implicit Leading 1.M for Normalized)</text>\n\n  <rect x=\"30\" y=\"115\" width=\"700\" height=\"55\" rx=\"6\" fill=\"#1e293b\" stroke=\"#475569\"/>\n  <text x=\"380\" y=\"138\" fill=\"#fde047\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">Value = (\u22121)^S \u00d7 (1.M)\u2082 \u00d7 2^(E \u2212 127)</text>\n  <text x=\"380\" y=\"158\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"middle\">Example: \u221212.5\u2081\u2080 = \u22121100.1\u2082 = \u22121.1001\u2082 \u00d7 2\u00b3 \u2192 S = 1, E = 3 + 127 = 130 (10000010\u2082), M = 10010000000000000000000\u2082</text>\n</svg>", "workedExamples": [{"title": "8-Bit 2's Complement of \u22128 (Verified DSSSB TGT CS 13 Sep 2025 Shift 3 Q36)", "problem": "In a signed 8-bit system, how is \u22128 represented in 2's complement?", "steps": ["Step 1: Write +8 in 8-bit binary: 0000 1000.", "Step 2: Take 1's complement (invert all bits): 1111 0111.", "Step 3: Add 1 to LSB: 1111 0111 + 1 = 1111 1000.", "Shortcut Verification: Copy from right up to the first '1' (1000), and invert all bits to its left (0000 -> 1111) => 11111000."], "answer": "11111000 (Verified in DSSSB TGT CS 13 Sep 2025 Shift 3 Q36)"}, {"title": "IEEE 754 Single Precision Hex Encoding", "problem": "Convert the decimal number \u221213.625 into IEEE 754 single-precision hexadecimal format.", "steps": ["Step 1: Since the number is negative, Sign bit S = 1.", "Step 2: Convert magnitude 13.625 to binary: 13 = 1101_2, and 0.625 = 0.5 + 0.125 = .101_2. Thus 13.625_10 = 1101.101_2.", "Step 3: Normalize the binary significand: 1101.101_2 = 1.101101_2 \u00d7 2^3.", "Step 4: Compute Biased Exponent E = True Exponent (3) + Bias (127) = 130 = 10000010_2.", "Step 5: Drop the implicit leading 1 to get the 23-bit Mantissa M = 10110100000000000000000.", "Step 6: Group all 32 bits (S | E | M): 1 10000010 10110100000000000000000 = 1100 0001 0101 1010 0000 0000 0000 0000_2 = 0xC15A0000."], "answer": "0xC15A0000"}, {"title": "Hamming Code Redundant Bit Calculation", "problem": "How many minimum parity (redundant) bits are required to protect a 16-bit data word against single-bit errors using Hamming code?", "steps": ["Step 1: Use Hamming inequality 2^r \u2265 m + r + 1, where m = 16.", "Step 2: Test r = 4: 2^4 = 16 < 16 + 4 + 1 (21) -> Insufficient.", "Step 3: Test r = 5: 2^5 = 32 \u2265 16 + 5 + 1 (22) -> Satisfied!"], "answer": "r = 5 parity bits (total codeword length = 16 + 5 = 21 bits)."}], "realWorld": "All modern CPUs (x86-64, ARM64, RISC-V) use 2's complement for signed integers (`int8_t`, `int32_t`, `int64_t`) because the exact same hardware adder circuit adds both unsigned and signed numbers without special sign-bit logic. GPUs and CPUs implement IEEE 754-2008 hardware FPU pipelines for `float` (32-bit) and `double` (64-bit).", "differences": "1's complement vs 2's complement: 1's complement has two zeros (+0 and -0) and requires end-around carry addition; 2's complement has a single zero, an extra negative value (-2^(n-1)), and discards carry-out during addition.", "formulas": ["n-bit 2's Complement Range: \u22122^(n\u22121) to +(2^(n\u22121) \u2212 1)", "n-bit 1's Complement & Signed-Magnitude Range: \u2212(2^(n\u22121) \u2212 1) to +(2^(n\u22121) \u2212 1)", "IEEE 754 Bias for k exponent bits: Bias = 2^(k\u22121) \u2212 1 (127 for k=8; 1023 for k=11)", "Hamming Code Inequality: 2^r \u2265 m + r + 1"], "examTraps": ["TRAP 1: Forgetting to pad to n bits before taking 2's complement! In DSSSB TGT CS 13 Sep 2025 Shift 3 Q36, option (A) was '1000' (4-bit) and option (C) was '10001000' (Sign-Magnitude), whereas the 8-bit 2's complement of \u22128 is '11111000'.", "TRAP 2: Thinking carry out of the MSB (C_n = 1) means signed overflow. For example, (\u22121) + (\u22121) in 4-bit 2's complement is 1111 + 1111 = (1)1110 (\u22122), which has C_4 = 1 and C_3 = 1, so V = 1 \u2295 1 = 0 (NO overflow!).", "TRAP 3: In Sign Extension of a negative 2's complement number (e.g., 4-bit 1101 = \u22123 to 8-bit), filling left bits with 0s instead of 1s. Sign extension of 1101 to 8 bits is 11111101."], "factsToMemorize": ["2's complement of 0000 is 0000; 2's complement of 1000 (the minimum negative number \u22122^(n-1)) is itself (1000), which causes overflow when negated!", "Self-complementing codes: 2421 code, Excess-3 code, and 84-2-1 code (the sum of weights in any weighted self-complementing code is always 9).", "To convert n-bit Gray code G to Binary B: B_n = G_n, and B_i = B_(i+1) \u2295 G_i."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 1 Q24 directly asked for the 2's complement of 1100 (Ans: 0100), and 13 Sep 2025 Shift 3 Q36 asked for \u22128 in signed 8-bit 2's complement (Ans: 11111000).", "quickRevision": "8-bit 2's comp range: -128 to +127. Overflow V = C_in(MSB) XOR C_out(MSB). IEEE 754 Single: 1S + 8E (Bias 127) + 23M; Double: 1S + 11E (Bias 1023) + 52M. BCD addition adds 0110 (6) if nibble > 9. Excess-3 is unweighted & self-complementing. Gray code changes 1 bit per step. Hamming code: 2^r >= m + r + 1."}, {"id": "MOD-C", "code": "C", "title": "Module C: Computer Arithmetic and ALU", "shortTitle": "C. Arithmetic & ALU", "navGroup": "mod-arithmetic", "targetQuestions": 25, "subtopics": ["Arithmetic Logic Unit (ALU)", "Arithmetic, Logical, and Shift operations", "Arithmetic shift, Logical shift, Circular shift", "Half adder, Full adder, Half subtractor, Full subtractor", "Parallel adder / Ripple carry adder", "Carry look-ahead adder (CLA)", "Carry propagation & Carry generation", "Carry save adder fundamentals", "Booth's multiplication algorithm", "Array multiplier", "Restoring and Non-restoring division algorithms", "Floating-point arithmetic", "Arithmetic overflow", "Status flags: Zero (Z), Carry (C), Sign (S), Overflow (V)"], "intro": "Module C explores how the Arithmetic Logic Unit (ALU) executes addition, subtraction, multiplication, division, and shifts in hardware, and how status flags record the outcome. Competitive exams regularly test Carry Look-Ahead (CLA) equations, Booth's recoding pairs, arithmetic vs. logical right shifts, and status flag combinations.", "definitions": [{"term": "Carry Propagate (P_i) & Generate (G_i)", "def": "In a Carry Look-Ahead Adder, G_i = A_i \u00b7 B_i generates a carry regardless of input carry, while P_i = A_i \u2295 B_i propagates an incoming carry C_i to C_(i+1) = G_i + P_i \u00b7 C_i."}, {"term": "Booth's Algorithm", "def": "A signed 2's complement multiplication algorithm that inspects adjacent multiplier bit pairs (Q_0, Q_-1) to add, subtract, or skip the multiplicand followed by an Arithmetic Shift Right (ashr)."}, {"term": "Arithmetic Shift Right (ASHR)", "def": "Shifts all bits right by 1 position while preserving the MSB sign bit (R[n-1] remains unchanged), effectively dividing a signed 2's complement number by 2 (floor division)."}, {"term": "Status Flags (PSW)", "def": "Flip-flops in the Status/Flag Register set by the ALU after an operation: Zero (Z=1 if result is 0), Sign (S=MSB of result), Carry (C=1 on unsigned carry/borrow out), Overflow (V=1 on signed 2's complement overflow)."}], "explanation": "\n<h4>1. Combinational Adder & Subtractor Circuits</h4>\n<ul>\n  <li><strong>Half Adder (2 inputs A, B):</strong> <code>Sum = A \u2295 B</code>, <code>Carry = A \u00b7 B</code>.</li>\n  <li><strong>Full Adder (3 inputs A, B, C_in):</strong> <code>Sum = A \u2295 B \u2295 C_in</code>, <code>C_out = A\u00b7B + B\u00b7C_in + A\u00b7C_in = A\u00b7B + C_in\u00b7(A \u2295 B)</code>. Built using 2 Half Adders + 1 OR gate.</li>\n  <li><strong>Half Subtractor:</strong> <code>Diff = A \u2295 B</code>, <code>Borrow = A' \u00b7 B</code>.</li>\n  <li><strong>n-Bit Ripple Carry Adder (RCA):</strong> Cascades <code>n</code> Full Adders. Worst-case delay is linear: <code>2n</code> gate delays because carry ripples through all stages.</li>\n  <li><strong>Carry Look-Ahead Adder (CLA):</strong> Eliminates ripple delay by precomputing carries in parallel using <code>G_i = A_i \u00b7 B_i</code> and <code>P_i = A_i \u2295 B_i</code>:\n    <ul>\n      <li><code>C_1 = G_0 + P_0 C_0</code></li>\n      <li><code>C_2 = G_1 + P_1 G_0 + P_1 P_0 C_0</code></li>\n      <li><code>C_3 = G_2 + P_2 G_1 + P_2 P_1 G_0 + P_2 P_1 P_0 C_0</code></li>\n    </ul>\n    All carries are generated in just <strong>2 gate levels (AND-OR)</strong> after P and G are formed!</li>\n  <li><strong>Carry Save Adder (CSA):</strong> Used when adding 3 or more operands (e.g., partial products in multipliers); saves carries into a separate vector instead of propagating them immediately, using a single final CPA (Carry Propagate Adder) at the end.</li>\n</ul>\n\n<h4>2. Shift Operations (Logical vs. Arithmetic vs. Circular)</h4>\n<ul>\n  <li><strong>Logical Shift Left (shl) / Right (shr):</strong> Shifts bits and inserts <code>0</code> into the vacated extreme bit. Used for unsigned numbers.</li>\n  <li><strong>Arithmetic Shift Right (ashr):</strong> Preserves the sign bit! <code>R[n-1] \u2190 R[n-1]</code>, <code>R[n-2..0] \u2190 R[n-1..1]</code>. Divides signed 2's complement number by 2 (verified in <a href=\"https://www.utpaper.in/question/a-register-contains-a-3-s-complement-number-10100-if-it-is-divided-by-2-find-the-1679\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 25 Jun 2023 Shift 2 Q185</a>).</li>\n  <li><strong>Arithmetic Shift Left (ashl):</strong> Inserts <code>0</code> at LSB (same bit movement as logical shift left), multiplying by 2; however, if the sign bit changes (<code>R[n-1] \u2260 R[n-2]</code> before shift), signed overflow occurs.</li>\n  <li><strong>Circular Shift (Rotate ROR / ROL):</strong> Bit shifted out of one end is fed directly into the other end (no bits lost).</li>\n</ul>\n\n<h4>3. Booth's Multiplication & Division Algorithms</h4>\n<p>In <strong>Booth's Algorithm</strong> for multiplying signed 2's complement numbers (Multiplicand in <code>BR</code>, Multiplier in <code>QR</code>, Accumulator <code>AC = 0</code>, extra bit <code>Q_-1 = 0</code>, Step Counter <code>SC = n</code>), inspect <code>(Q_0, Q_-1)</code> in each of the <code>n</code> cycles:</p>\n<ul>\n  <li><code>00</code> or <code>11</code>: No arithmetic action; only perform <code>ashr(AC, QR, Q_-1)</code>.</li>\n  <li><code>01</code> (end of a string of 1s): <code>AC \u2190 AC + BR</code>, then <code>ashr(AC, QR, Q_-1)</code>.</li>\n  <li><code>10</code> (start of a string of 1s): <code>AC \u2190 AC \u2212 BR</code> (i.e., <code>AC + BR' + 1</code>), then <code>ashr(AC, QR, Q_-1)</code>.</li>\n</ul>\n<p><strong>Worst-case multiplier for Booth's algorithm:</strong> Alternating <code>01010101...</code> (causes maximum additions/subtractions). <strong>Best-case multiplier:</strong> Continuous blocks of 0s or 1s like <code>00000000</code> or <code>11111111</code>.</p>\n<p>In <strong>Restoring Division</strong> (unsigned), after shifting left <code>(A, Q)</code> and computing <code>A \u2190 A \u2212 M</code>, if <code>A < 0</code> (MSB of A is 1), we set <code>Q_0 = 0</code> and <strong>restore</strong> <code>A \u2190 A + M</code>. In <strong>Non-Restoring Division</strong>, we skip the restoration step when <code>A < 0</code> and instead add <code>M</code> after shifting in the next cycle, reducing the number of ALU operations.</p>\n", "classifications": ["Adders by Speed (Slowest to Fastest): Serial Adder (1 Full Adder, n clock cycles) < Ripple Carry Adder (n Full Adders, 2n gate delays) < Carry Select / Carry Skip Adder < Carry Look-Ahead Adder (CLA).", "Multipliers: Sequential Shift-and-Add Multiplier, Booth's Signed Multiplier, Robertson's Multiplier, Combinational Array / Wallace Tree Multiplier."], "diagramSvg": "<svg viewBox=\"0 0 760 200\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">ALU Architecture &amp; Status Flags Generation</text>\n  <rect x=\"40\" y=\"55\" width=\"120\" height=\"45\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"82\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Operand A (n-bit)</text>\n  <rect x=\"40\" y=\"120\" width=\"120\" height=\"45\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"147\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Operand B (n-bit)</text>\n\n  <line x1=\"160\" y1=\"77\" x2=\"250\" y2=\"90\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <line x1=\"160\" y1=\"142\" x2=\"250\" y2=\"130\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n\n  <polygon points=\"250,45 410,75 410,145 250,175 250,120 275,110 250,100\" fill=\"#0f766e\" stroke=\"#2dd4bf\" stroke-width=\"2\"/>\n  <text x=\"335\" y=\"105\" fill=\"#f8fafc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">ALU Core</text>\n  <text x=\"335\" y=\"123\" fill=\"#99f6e4\" font-size=\"10\" text-anchor=\"middle\">Add/Sub/Logic/Shift</text>\n\n  <line x1=\"410\" y1=\"95\" x2=\"520\" y2=\"95\" stroke=\"#34d399\" stroke-width=\"3\"/>\n  <rect x=\"520\" y=\"70\" width=\"180\" height=\"45\" rx=\"6\" fill=\"#1e293b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"610\" y=\"97\" fill=\"#ecfdf5\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Result F (n-bit)</text>\n\n  <line x1=\"410\" y1=\"130\" x2=\"520\" y2=\"150\" stroke=\"#fde047\" stroke-width=\"2\"/>\n  <rect x=\"520\" y=\"130\" width=\"210\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#eab308\" stroke-width=\"2\"/>\n  <text x=\"625\" y=\"150\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Status Register (Flags)</text>\n  <text x=\"625\" y=\"168\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Z (Zero) | S (Sign) | C (Carry) | V (Overflow)</text>\n</svg>", "workedExamples": [{"title": "Booth's Algorithm Pair Inspection Count", "problem": "For the 8-bit 2's complement multiplier Q = 10011100, how many additions and subtractions of the multiplicand M will Booth's algorithm perform?", "steps": ["Step 1: Append Q_-1 = 0 to the right of Q: 1 0 0 1 1 1 0 0 | 0.", "Step 2: Scan adjacent pairs (Q_i, Q_(i-1)) from right to left:", "Pair 1: (0,0) -> No op", "Pair 2: (0,0) -> No op", "Pair 3: (1,0) -> Subtract M (1st subtraction)", "Pair 4: (1,1) -> No op", "Pair 5: (1,1) -> No op", "Pair 6: (0,1) -> Add M (1st addition)", "Pair 7: (0,0) -> No op", "Pair 8: (1,0) -> Subtract M (2nd subtraction)"], "answer": "1 Addition and 2 Subtractions (Total 3 arithmetic operations)."}, {"title": "Status Flags After 8-Bit Subtraction", "problem": "An 8-bit ALU computes A \u2212 B where A = 01110000 (+112) and B = 10110000 (\u221280 in 2's complement). Find the 8-bit result and status flags Z, S, C, V.", "steps": ["Step 1: Compute 2's complement of B (10110000): 01001111 + 1 = 01010000 (+80).", "Step 2: Add A + (\u2212B): 01110000 + 01010000 = 11000000.", "Step 3: Evaluate flags: Result = 11000000 \u2260 0 -> Z = 0. MSB = 1 -> S = 1.", "Step 4: Carry into MSB C_7 = 1 (since bit 6 had 1+1=10), Carry out of MSB C_8 = 0. Thus C = 0 and Overflow V = C_7 \u2295 C_8 = 1 \u2295 0 = 1 (since +112 \u2212 (\u221280) = +192 > +127)."], "answer": "Result = 11000000, Z = 0, S = 1, C = 0, V = 1."}], "realWorld": "Hardware dividers in modern CPUs use SRT division (a high-radix extension of non-restoring division) or Newton-Raphson convergence; famously, the 1994 Intel Pentium FDIV bug was caused by 5 missing entries in a Programmable Logic Array lookup table for a Radix-4 SRT divider.", "differences": "Ripple Carry Adder vs. Carry Look-Ahead Adder: RCA computes carries sequentially (O(n) time, O(n) hardware), whereas CLA computes carries in parallel using Generate/Propagate logic (O(1) 2-level carry logic per group, higher hardware fan-in).", "formulas": ["Full Adder: Sum = A \u2295 B \u2295 C_in ; C_out = AB + C_in(A \u2295 B)", "CLA Equations: G_i = A_i \u00b7 B_i ; P_i = A_i \u2295 B_i ; C_(i+1) = G_i + P_i \u00b7 C_i", "n \u00d7 n Array Multiplier requires: n^2 AND gates, n Half Adders, and n(n \u2212 2) Full Adders"], "examTraps": ["TRAP 1: Thinking ALU performs memory addressing. In DSSSB TGT CS 12 Sep 2025 Shift 2 Q78, 'Memory addressing' was the exact correct answer for what the ALU does NOT perform.", "TRAP 2: Confusing Logical Shift Right (shr) with Arithmetic Shift Right (ashr) on negative numbers. For 11000000 (\u221264), shr gives 01100000 (+96, wrong sign!), whereas ashr gives 11100000 (\u221232).", "TRAP 3: In floating-point addition, failing to align the smaller exponent to the larger exponent. Always shift the mantissa of the number with the SMALLER exponent to the right!"], "factsToMemorize": ["XOR gate is a programmable inverter (controlled complementer): A \u2295 0 = A (for addition) and A \u2295 1 = A' (for 2's complement subtraction when C_0 = 1).", "For signed relational comparison A \u2265 B (after computing A \u2212 B), the condition is (S \u2295 V) = 0.", "Restoring division of an n-bit number takes between n and 2n ALU add/subtract operations; Non-restoring division takes n + 1 operations."], "pyqInsights": "DSSSB TGT CS 2025 & 2024 repeatedly tested which operations the ALU performs (binary addition, shifts, XOR truth table, logical comparisons) versus what it does not (memory addressing).", "quickRevision": "Adder-Subtractor uses XOR gates with Mode M (M=0 Add, M=1 Sub via 2's comp). CLA uses G_i = A_i B_i, P_i = A_i XOR B_i. Booth's pairs: 00/11 -> ashr only; 01 -> Add M & ashr; 10 -> Sub M & ashr. ASHR preserves MSB sign bit. Flags: Z (Zero), S (MSB), C (Carry out), V (C_in_MSB XOR C_out_MSB)."}, {"id": "MOD-D", "code": "D", "title": "Module D: Register Transfer and Micro-operations", "shortTitle": "D. RTL & Micro-ops", "navGroup": "mod-cpu-org", "targetQuestions": 15, "subtopics": ["Register Transfer Language (RTL)", "Register transfer", "Common bus system", "Bus transfer & Memory transfer", "Arithmetic micro-operations", "Logic micro-operations", "Shift micro-operations", "Register organization", "Control functions & Conditional transfer", "Register transfer notation", "Micro-operation sequencing", "Control word", "Common bus architecture"], "intro": "Register Transfer Language (RTL) is the symbolic notation used to describe the internal hardware organization of digital computers and the elementary micro-operations executed on data stored in registers during a single clock pulse.", "definitions": [{"term": "Micro-operation", "def": "An elementary operation performed during one clock pulse on the binary information stored in one or more registers (verified in KVS PGT CS and DSSSB TGT CS 2021)."}, {"term": "Register Transfer Language (RTL)", "def": "A symbolic notation for describing micro-operation transfers among registers (e.g., R2 \u2190 R1) and the control conditions governing them (e.g., P: R2 \u2190 R1)."}, {"term": "Common Bus System", "def": "A shared communication pathway constructed using either Multiplexers (MUXes) or Three-State (Tri-State) Buffers to transfer words between multiple registers without dedicated point-to-point wiring."}], "explanation": "\n<h4>1. Register Transfer Notation & Conditional Control</h4>\n<ul>\n  <li><strong>Basic Transfer:</strong> <code>R2 \u2190 R1</code> copies the contents of source register R1 into destination register R2 on the next clock edge; R1's contents remain unchanged.</li>\n  <li><strong>Conditional Transfer:</strong> <code>P: R2 \u2190 R1</code> executes only if control signal <code>P = 1</code> at the active clock transition.</li>\n  <li><strong>Simultaneous Swap:</strong> <code>T: R1 \u2190 R2, R2 \u2190 R1</code> exchanges R1 and R2 in the same clock pulse using edge-triggered master-slave/D flip-flops!</li>\n  <li><strong>Memory Transfer in RTL:</strong> Memory read is written as <code>DR \u2190 M[AR]</code>; Memory write is written as <code>M[AR] \u2190 R1</code>, where <code>AR</code> is the Address Register.</li>\n</ul>\n\n<h4>2. Common Bus System Construction (Classic Numerical Topic)</h4>\n<p>Suppose a CPU has <strong><code>k</code> registers</strong>, each of <strong><code>n</code> bits</strong>. To build a Common Bus System using multiplexers:</p>\n<ul>\n  <li><strong>Number of Multiplexers needed</strong> = <code>n</code> (one MUX per bit position of the bus).</li>\n  <li><strong>Size of each Multiplexer</strong> = <code>k \u00d7 1</code> (one input from each of the <code>k</code> registers).</li>\n  <li><strong>Number of Selection Lines</strong> = <code>\u2308log\u2082(k)\u2309</code>.</li>\n  <li>Alternatively, a bus can be built using <strong>Tri-State Buffers</strong> (three states: Logic 0, Logic 1, and High-Impedance <code>Hi-Z</code> open circuit) controlled by a binary decoder.</li>\n</ul>\n\n<h4>3. The Four Categories of Micro-Operations</h4>\n<ol>\n  <li><strong>Register Transfer Micro-operations:</strong> Transfer binary data unchanged from one register to another (<code>R2 \u2190 R1</code>).</li>\n  <li><strong>Arithmetic Micro-operations:</strong> Add (<code>R3 \u2190 R1 + R2</code>), Subtract via 2's complement (<code>R3 \u2190 R1 + R2' + 1</code>, tested in <a href=\"https://testbook.com/question-answer/what-is-the-meaning-of-this-arithmetic-micro-opera--611a326a5836b0fbd61c3d7a\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 2021</a>), Increment (<code>R1 \u2190 R1 + 1</code>), Decrement (<code>R1 \u2190 R1 \u2212 1</code>), 1's Complement (<code>R1 \u2190 R1'</code>).</li>\n  <li><strong>Logic Micro-operations:</strong> Bitwise operations on register pairs (<code>\u2227</code> AND, <code>\u2228</code> OR, <code>\u2295</code> XOR). With 2 binary variables, there are <code>2^(2^2) = 16</code> possible logic micro-operations. Hardware applications:\n    <ul>\n      <li><strong>Selective-Set:</strong> <code>A \u2190 A \u2228 B</code> (sets bits in A where B has 1s).</li>\n      <li><strong>Selective-Complement:</strong> <code>A \u2190 A \u2295 B</code> (inverts bits in A where B has 1s).</li>\n      <li><strong>Selective-Clear:</strong> <code>A \u2190 A \u2227 B'</code> (clears bits in A where B has 1s).</li>\n      <li><strong>Mask (Clear):</strong> <code>A \u2190 A \u2227 B</code> (clears bits in A where B has 0s).</li>\n    </ul>\n  </li>\n  <li><strong>Shift Micro-operations:</strong> Logical shift (<code>shl, shr</code>), Circular shift (<code>cil, cir</code>), Arithmetic shift (<code>ashl, ashr</code>).</li>\n</ol>\n", "classifications": ["Four Micro-operation Categories (Morris Mano): (1) Register Transfer, (2) Arithmetic, (3) Logic, (4) Shift (tested directly in DSSSB TGT CS 2021).", "Bus Implementation Techniques: Multiplexer-based Common Bus vs. Three-State Buffer + Decoder Bus."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Common Bus System for k Registers (n bits each) Using Multiplexers</text>\n  <rect x=\"30\" y=\"50\" width=\"110\" height=\"32\" rx=\"4\" fill=\"#1e293b\" stroke=\"#60a5fa\"/><text x=\"85\" y=\"70\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Register R0 (n-bit)</text>\n  <rect x=\"30\" y=\"92\" width=\"110\" height=\"32\" rx=\"4\" fill=\"#1e293b\" stroke=\"#60a5fa\"/><text x=\"85\" y=\"112\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Register R1 (n-bit)</text>\n  <rect x=\"30\" y=\"134\" width=\"110\" height=\"32\" rx=\"4\" fill=\"#1e293b\" stroke=\"#60a5fa\"/><text x=\"85\" y=\"154\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Register R(k-1)</text>\n\n  <line x1=\"140\" y1=\"66\" x2=\"260\" y2=\"75\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"108\" x2=\"260\" y2=\"108\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <line x1=\"140\" y1=\"150\" x2=\"260\" y2=\"140\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n  <rect x=\"260\" y=\"50\" width=\"180\" height=\"115\" rx=\"8\" fill=\"#0f766e\" stroke=\"#2dd4bf\" stroke-width=\"2\"/>\n  <text x=\"350\" y=\"85\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">n Multiplexers</text>\n  <text x=\"350\" y=\"108\" fill=\"#99f6e4\" font-size=\"11\" text-anchor=\"middle\">Each MUX Size: k \u00d7 1</text>\n  <text x=\"350\" y=\"130\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">Select Lines: log\u2082(k)</text>\n\n  <line x1=\"440\" y1=\"108\" x2=\"540\" y2=\"108\" stroke=\"#34d399\" stroke-width=\"4\"/>\n  <rect x=\"540\" y=\"75\" width=\"190\" height=\"65\" rx=\"6\" fill=\"#1e293b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"635\" y=\"103\" fill=\"#ecfdf5\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">n-Line Common Bus</text>\n  <text x=\"635\" y=\"123\" fill=\"#6ee7b7\" font-size=\"10\" text-anchor=\"middle\">Connects to all Register Inputs</text>\n</svg>", "workedExamples": [{"title": "Common Bus Multiplexer Calculation", "problem": "A digital computer has a common bus system for 16 registers of 32 bits each. The bus is constructed with multiplexers. (a) How many selection inputs are there in each multiplexer? (b) What size of multiplexers are needed? (c) How many multiplexers are there in the bus?", "steps": ["Step 1: Number of registers k = 16; number of bits per register n = 32.", "Step 2: (a) Selection inputs = log_2(k) = log_2(16) = 4 selection lines.", "Step 3: (b) Size of each multiplexer = k \u00d7 1 = 16 \u00d7 1.", "Step 4: (c) Number of multiplexers = number of bits per register n = 32 multiplexers."], "answer": "(a) 4 selection lines, (b) 16 \u00d7 1 MUXes, (c) 32 multiplexers."}, {"title": "Selective-Clear vs. Mask Logic Micro-operation", "problem": "Let Register A = 10101101 and Register B = 00001111. Compute the result in A after (a) Selective-Clear and (b) Mask operation.", "steps": ["Step 1: Selective-Clear is A \u2190 A \u2227 B'. Since B = 00001111, B' = 11110000.", "Step 2: A \u2227 B' = 10101101 \u2227 11110000 = 10100000 (the lower 4 bits where B had 1s are cleared!).", "Step 3: Mask is A \u2190 A \u2227 B = 10101101 \u2227 00001111 = 00001101 (the upper 4 bits where B had 0s are cleared!)."], "answer": "(a) Selective-Clear: 10100000; (b) Mask: 00001101."}], "realWorld": "Tri-state buffers are universally used on system and memory buses so multiple chips (RAM modules, I/O controllers) can share the same physical PCB traces without short-circuiting each other.", "differences": "Selective-Clear (A <- A AND B') clears bits in A where B=1, whereas Mask (A <- A AND B) clears bits in A where B=0.", "formulas": ["Common Bus for k registers of n bits: Needs n multiplexers, each of size k \u00d7 1, with log\u2082(k) select lines.", "Number of possible binary logic functions of 2 variables = 2^(2^2) = 16."], "examTraps": ["TRAP 1: Mixing up the number of MUXes (n) and the size of each MUX (k \u00d7 1). Always remember: 1 MUX per BIT (n), and 1 MUX input per REGISTER (k)!", "TRAP 2: Confusing arithmetic minus (\u2212) with RTL arrow (\u2190) or bitwise OR (\u2228) with addition (+). In RTL, `P + Q: R1 \u2190 R2 + R3` uses `+` on the left for Boolean OR of control signals and `+` on the right for binary addition!"], "factsToMemorize": ["`R3 \u2190 R1 + R2' + 1` means subtraction `R3 \u2190 R1 \u2212 R2` using 2's complement (verified DSSSB TGT CS 2021 PYQ).", "A three-state buffer has two inputs (Data input and Control input) and one output that can be 0, 1, or High-Impedance (Z)."], "pyqInsights": "Both KVS PGT CS and DSSSB TGT CS 2021 tested the definition of micro-operations, the 4 types of micro-operations, and the RTL expression `R3 \u2190 R1 + R2' + 1`.", "quickRevision": "RTL describes register transfers during 1 clock pulse. Common Bus (k regs, n bits) = n MUXes of size k\u00d71 with log\u2082(k) select lines. 4 Micro-op types: Register Transfer, Arithmetic, Logic, Shift. Logic ops: Selective-Set (A OR B), Selective-Complement (A XOR B), Selective-Clear (A AND B'), Mask (A AND B)."}, {"id": "MOD-E", "code": "E", "title": "Module E: Basic Computer Organization", "shortTitle": "E. Basic Computer", "navGroup": "mod-arch-basics", "targetQuestions": 20, "subtopics": ["Basic computer structure", "Instruction Register (IR)", "Program Counter (PC)", "Address Register (AR / MAR)", "Data Register (DR / MDR)", "Accumulator (AC)", "Temporary Register (TR)", "Input Register (INPR) & Output Register (OUTR)", "Stack Pointer (SP) & Status Register", "Common bus system (16-bit Mano computer)", "Instruction cycle: Fetch, Decode, Indirect, Execute, Interrupt cycles", "Timing and control", "Instruction decoding", "Memory-reference, Register-reference, and Input-Output instructions"], "intro": "M. Morris Mano's 16-bit Basic Computer (with 4096 \u00d7 16 memory) is the gold-standard model used by DSSSB, KVS, and NVS question setters to test CPU register sizes, common bus connections, instruction cycle phases, and instruction format decoding.", "definitions": [{"term": "Program Counter (PC)", "def": "A 12-bit register (in Mano's 4K computer) that holds the memory address of the NEXT instruction to be fetched and executed (verified in DSSSB PGT CS 11 Jul 2021 Q1)."}, {"term": "Instruction Register (IR)", "def": "A 16-bit register required by the Control Unit that holds the instruction code currently being decoded and executed (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q133)."}, {"term": "Memory Address Register (MAR / AR)", "def": "A 12-bit register that holds the address for main memory read/write operations; connected directly to the memory address bus."}, {"term": "Memory Data Register (MDR / DR)", "def": "A 16-bit register that holds the operand/data read from or waiting to be written to main memory."}, {"term": "Accumulator (AC)", "def": "The primary 16-bit processor register that supplies one operand to the ALU and stores the result of arithmetic/logic operations."}], "explanation": "\n<h4>1. Registers of the Basic Computer (4096 \u00d7 16 RAM)</h4>\n<p>Because memory has <code>4096 = 2^12</code> words of <code>16 bits</code> each, any register holding a <strong>memory address</strong> is <strong>12 bits</strong> wide, any register holding a <strong>memory word/instruction</strong> is <strong>16 bits</strong> wide, and character I/O registers are <strong>8 bits</strong> wide:</p>\n<ul>\n  <li><strong>AR (Address Register):</strong> 12 bits \u2014 Holds memory address.</li>\n  <li><strong>PC (Program Counter):</strong> 12 bits \u2014 Holds address of next instruction.</li>\n  <li><strong>DR (Data Register):</strong> 16 bits \u2014 Holds memory operand.</li>\n  <li><strong>AC (Accumulator):</strong> 16 bits \u2014 Processor register for ALU results.</li>\n  <li><strong>IR (Instruction Register):</strong> 16 bits \u2014 Holds current instruction code.</li>\n  <li><strong>TR (Temporary Register):</strong> 16 bits \u2014 Holds temporary data during execution.</li>\n  <li><strong>INPR (Input Register):</strong> 8 bits \u2014 Holds input character from keyboard.</li>\n  <li><strong>OUTR (Output Register):</strong> 8 bits \u2014 Holds output character for printer/display.</li>\n</ul>\n\n<h4>2. The Instruction Cycle (Fetch \u2192 Decode \u2192 [Indirect] \u2192 Execute)</h4>\n<p>Managed by the Control Unit using Sequence Counter (SC) timing signals <code>T0, T1, T2, T3...</code> (verified in <a href=\"https://www.utpaper.in/question/select-the-incorrect-option-among-the-phases-of-the-cpu-instruction-cycle-3147\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 12 Sep 2025 Shift 1 Q86</a> &amp; <a href=\"https://www.utpaper.in/question/which-cycle-is-primarily-managed-by-the-control-unit-3135\" target=\"_blank\" rel=\"noopener\">Q74</a>):</p>\n<ul>\n  <li><strong>Fetch Phase (T0, T1):</strong>\n    <ul>\n      <li><code>T0: AR \u2190 PC</code> (Place address of next instruction into AR)</li>\n      <li><code>T1: IR \u2190 M[AR], PC \u2190 PC + 1</code> (Fetch instruction into IR and increment PC)</li>\n    </ul>\n  </li>\n  <li><strong>Decode Phase (T2):</strong>\n    <ul>\n      <li><code>T2: D0..D7 \u2190 Decode IR(12\u201314), AR \u2190 IR(0\u201311), I \u2190 IR(15)</code></li>\n    </ul>\n  </li>\n  <li><strong>Type Determination (T3):</strong>\n    <ul>\n      <li>If <code>D7 = 0</code> (Opcodes <code>000</code> to <code>110</code>): <strong>Memory-Reference Instruction</strong>. If <code>I = 1</code> (Indirect), execute <code>D7' I T3: AR \u2190 M[AR]</code> to fetch the effective address; if <code>I = 0</code> (Direct), nothing needed at T3.</li>\n      <li>If <code>D7 = 1</code> and <code>I = 0</code> (<code>IR(15..12) = 0111 = 7xxx_16</code>): <strong>Register-Reference Instruction</strong> (e.g., <code>CLA</code>, <code>CMA</code>, <code>INC</code>, <code>HLT</code>), executed at <code>T3</code>!</li>\n      <li>If <code>D7 = 1</code> and <code>I = 1</code> (<code>IR(15..12) = 1111 = Fxxx_16</code>): <strong>Input-Output Instruction</strong> (e.g., <code>INP</code>, <code>OUT</code>, <code>ION</code>, <code>IOF</code>), executed at <code>T3</code>!</li>\n    </ul>\n  </li>\n</ul>\n", "classifications": ["Memory-Reference Instructions (D0\u2013D6): AND (000), ADD (001), LDA (010), STA (011), BUN (100), BSA (101 - Branch and Save Return Address), ISZ (110 - Increment and Skip if Zero).", "Register-Reference Instructions (D7 I' T3, 7xxx Hex): CLA (7800), CLE (7400), CMA (7200), CIR (7080), CIL (7040), INC (7020), HLT (7001).", "Input-Output Instructions (D7 I T3, Fxxx Hex): INP (F800), OUT (F400), SKI (F200), SKO (F100), ION (F080), IOF (F040)."], "diagramSvg": "<svg viewBox=\"0 0 760 200\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Basic Computer Instruction Cycle Flow (Fetch \u2192 Decode \u2192 Execute)</text>\n  <rect x=\"20\" y=\"55\" width=\"150\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"95\" y=\"80\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">1. FETCH (T0, T1)</text>\n  <text x=\"95\" y=\"102\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">T0: AR \u2190 PC</text>\n  <text x=\"95\" y=\"122\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">T1: IR \u2190 M[AR]</text>\n  <text x=\"95\" y=\"138\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">PC \u2190 PC + 1</text>\n\n  <line x1=\"170\" y1=\"100\" x2=\"205\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n  <rect x=\"205\" y=\"55\" width=\"165\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n  <text x=\"287\" y=\"80\" fill=\"#c084fc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">2. DECODE (T2)</text>\n  <text x=\"287\" y=\"102\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Decode IR(12\u201314)</text>\n  <text x=\"287\" y=\"122\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">AR \u2190 IR(0\u201311)</text>\n  <text x=\"287\" y=\"138\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">I \u2190 IR(15)</text>\n\n  <line x1=\"370\" y1=\"100\" x2=\"405\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n  <rect x=\"405\" y=\"55\" width=\"155\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#eab308\" stroke-width=\"2\"/>\n  <text x=\"482\" y=\"80\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">3. INDIRECT (T3)</text>\n  <text x=\"482\" y=\"102\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">If D7=0 &amp; I=1:</text>\n  <text x=\"482\" y=\"122\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">AR \u2190 M[AR]</text>\n  <text x=\"482\" y=\"138\" fill=\"#94a3b8\" font-size=\"10\" text-anchor=\"middle\">(Reg/IO execute at T3)</text>\n\n  <line x1=\"560\" y1=\"100\" x2=\"595\" y2=\"100\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n\n  <rect x=\"595\" y=\"55\" width=\"145\" height=\"90\" rx=\"8\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"667\" y=\"80\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">4. EXECUTE (T4..)</text>\n  <text x=\"667\" y=\"102\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Perform Mem-Ref Op</text>\n  <text x=\"667\" y=\"122\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">(AND, ADD, LDA,</text>\n  <text x=\"667\" y=\"138\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">STA, BUN, BSA, ISZ)</text>\n</svg>", "workedExamples": [{"title": "Register Bit-Width Calculation for Custom Memory Size", "problem": "A computer has a memory unit of 64K \u00d7 32. Find the required bit sizes of PC, AR, DR, IR, and AC.", "steps": ["Step 1: Memory capacity = 64K \u00d7 32 = 2^16 words of 32 bits each.", "Step 2: Address registers (PC and AR) must address 2^16 locations -> 16 bits each.", "Step 3: Word/Instruction/Data registers (DR, IR, AC) must hold 1 memory word -> 32 bits each."], "answer": "PC = 16 bits, AR = 16 bits, DR = 32 bits, IR = 32 bits, AC = 32 bits."}], "realWorld": "In Mano's Basic Computer, subroutine calls use the `BSA` (Branch and Save Return Address) instruction, which stores the return address (`PC`) into the first word of the subroutine `M[AR]` and branches to `AR + 1`, whereas modern x86/ARM CPUs push the return address onto a RAM stack pointed to by `SP` or save it in a Link Register (`LR`).", "differences": "PC vs IR: The Program Counter (PC) holds the memory address of the NEXT instruction to be fetched, whereas the Instruction Register (IR) holds the binary code of the CURRENT instruction being decoded and executed.", "formulas": ["For 2^k \u00d7 m Memory: Size(PC) = Size(AR/MAR) = k bits; Size(IR) = Size(DR/MDR) = Size(AC) = m bits."], "examTraps": ["TRAP 1: Selecting 'Encode' as a phase of the CPU Instruction Cycle. In DSSSB TGT CS 12 Sep 2025 Shift 1 Q86, 'Encode' was tested as the INCORRECT option among Fetch, Decode, Execute, and Encode.", "TRAP 2: Confusing MAR and MDR with PC and IR. PC feeds MAR during instruction fetch (`MAR \u2190 PC`), and memory outputs the instruction through MDR to IR (`MDR \u2190 M[MAR], IR \u2190 MDR`)."], "factsToMemorize": ["Only 1 bit (Bit 15 = I bit) is required in the basic computer instruction format to distinguish between Direct (I=0) and Indirect (I=1) addressing (verified DSSSB TGT CS 2021 PYQ).", "During the Interrupt Cycle (`R=1`), the return address (`PC`) is stored at memory location `0` (`M[0] \u2190 TR`), and `PC` is set to `1` (`PC \u2190 1`)."], "pyqInsights": "DSSSB TGT CS 2025 & 2024 and DSSSB PGT CS 2021 tested the exact roles of PC, IR, MAR/MDR, the 1-bit Indirect flag I, and the phases of the Instruction Cycle.", "quickRevision": "For 2^k \u00d7 m RAM: PC & AR = k bits; IR, DR, AC, TR = m bits. Fetch: T0 (AR<-PC), T1 (IR<-M[AR], PC<-PC+1). Decode: T2. Instruction Cycle Phases: Fetch -> Decode -> [Indirect] -> Execute -> [Interrupt] (NEVER 'Encode')."}, {"id": "MOD-F", "code": "F", "title": "Module F: Instruction Set Architecture (ISA)", "shortTitle": "F. ISA & Formats", "navGroup": "mod-isa-addr", "targetQuestions": 25, "subtopics": ["Instruction Set Architecture (ISA)", "Instruction formats", "Zero-, One-, Two-, and Three-address instructions", "Opcode, Operand, and Address fields", "Instruction length (Fixed vs Variable)", "Instruction encoding & Expanding Opcode technique", "Data transfer, Arithmetic, Logical, and Control transfer instructions", "Conditional and Unconditional branch", "Subroutine call and return", "Stack instructions (PUSH / POP)", "Machine instruction execution & sequencing"], "intro": "Instruction Set Architecture (ISA) defines the format of machine instructions, how many explicit operand addresses they specify (0, 1, 2, or 3 addresses), and how opcodes are encoded. Expanding Opcode numerical problems and expression evaluation counts across 0/1/2/3-address machines are staple PGT/TGT questions.", "definitions": [{"term": "Opcode (Operation Code)", "def": "The group of bits in an instruction that specifies the operation to be performed (e.g., ADD, SUB, LOAD, BRANCH). k opcode bits support up to 2^k distinct operations."}, {"term": "Three-Address Instruction", "def": "Format `ADD R1, R2, R3` (`R1 \u2190 R2 + R3`). Preserves both source operands, requires the fewest instructions per expression, but needs the longest binary instruction word."}, {"term": "Two-Address Instruction", "def": "Format `ADD R1, R2` (`R1 \u2190 R1 + R2`). Overwrites one source operand unless a `MOV` instruction is used."}, {"term": "One-Address Instruction", "def": "Format `ADD X` (`AC \u2190 AC + M[X]`). Uses an implicit Accumulator (AC) register for one source and the destination."}, {"term": "Zero-Address Instruction", "def": "Format `ADD` (`TOS \u2190 TOS + Second_On_Stack`). Used in Stack-organized CPUs where operands are implicitly popped from the top of the stack; only `PUSH X` and `POP X` specify an address."}], "explanation": "\n<h4>1. Comparing 3-, 2-, 1-, and 0-Address Programs for <code>X = (A + B) \u00d7 (C + D)</code></h4>\n<ul>\n  <li><strong>Three-Address (4 instructions):</strong> <code>ADD R1, A, B</code>; <code>ADD R2, C, D</code>; <code>MUL X, R1, R2</code>. (Actually 3 instructions!)</li>\n  <li><strong>Two-Address (6 instructions):</strong> <code>MOV R1, A</code>; <code>ADD R1, B</code>; <code>MOV R2, C</code>; <code>ADD R2, D</code>; <code>MUL R1, R2</code>; <code>MOV X, R1</code>.</li>\n  <li><strong>One-Address / Accumulator (7 instructions):</strong> <code>LOAD A</code>; <code>ADD B</code>; <code>STORE T</code>; <code>LOAD C</code>; <code>ADD D</code>; <code>MUL T</code>; <code>STORE X</code>.</li>\n  <li><strong>Zero-Address / Stack (8 instructions):</strong> <code>PUSH A</code>; <code>PUSH B</code>; <code>ADD</code>; <code>PUSH C</code>; <code>PUSH D</code>; <code>ADD</code>; <code>MUL</code>; <code>POP X</code> (uses Reverse Polish / Postfix order: <code>AB+CD+*</code>!).</li>\n</ul>\n\n<h4>2. Expanding Opcode Technique (Crucial Numerical Formula)</h4>\n<p>In a fixed-length instruction of <strong><code>L</code> bits</strong> where each address field uses <strong><code>a</code> bits</strong>:</p>\n<ul>\n  <li>Each 2-address instruction consumes <code>2^a \u00d7 2^a = 2^(2a)</code> bit patterns.</li>\n  <li>Each 1-address instruction consumes <code>2^a</code> bit patterns.</li>\n  <li>Each 0-address instruction consumes <code>1</code> bit pattern.</li>\n  <li><strong>Fundamental Conservation Formula:</strong> If there are <code>N\u2082</code> two-address, <code>N\u2081</code> one-address, and <code>N\u2080</code> zero-address instructions in an <code>L</code>-bit instruction format, then:<br/>\n  <code>N\u2082 \u00d7 2^(2a) + N\u2081 \u00d7 2^a + N\u2080 \u2264 2^L</code>.</li>\n</ul>\n", "classifications": ["Instruction Categories: (1) Data Transfer (MOV, LOAD, STORE, XCHG, IN, OUT, PUSH, POP), (2) Data Manipulation (Arithmetic: ADD, SUB, INC; Logical/Bit: AND, OR, XOR, SHL, ROR), (3) Program Control (BR/JMP, BZ, BNZ, CALL, RET, CMP, TEST)."], "diagramSvg": "<svg viewBox=\"0 0 760 210\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Instruction Formats (3-, 2-, 1-, and 0-Address)</text>\n  <rect x=\"30\" y=\"38\" width=\"120\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"90\" y=\"58\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Opcode</text>\n  <rect x=\"150\" y=\"38\" width=\"180\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"240\" y=\"58\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Dest / Src1 (R1)</text>\n  <rect x=\"330\" y=\"38\" width=\"180\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"420\" y=\"58\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Src2 (R2)</text>\n  <rect x=\"510\" y=\"38\" width=\"180\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"600\" y=\"58\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Src3 (R3)</text>\n  <text x=\"725\" y=\"58\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">3-Addr</text>\n\n  <rect x=\"30\" y=\"80\" width=\"120\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"90\" y=\"100\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Opcode</text>\n  <rect x=\"150\" y=\"80\" width=\"220\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"260\" y=\"100\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Dest &amp; Src1 (R1)</text>\n  <rect x=\"370\" y=\"80\" width=\"220\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"480\" y=\"100\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Src2 (R2 / Mem)</text>\n  <text x=\"635\" y=\"100\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">2-Addr</text>\n\n  <rect x=\"30\" y=\"122\" width=\"120\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"90\" y=\"142\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Opcode</text>\n  <rect x=\"150\" y=\"122\" width=\"280\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"290\" y=\"142\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Address X (Implicit Accumulator AC)</text>\n  <text x=\"475\" y=\"142\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">1-Addr</text>\n\n  <rect x=\"30\" y=\"164\" width=\"180\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"120\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Opcode Only (Implicit TOS)</text>\n  <text x=\"255\" y=\"184\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">0-Addr (Stack)</text>\n</svg>", "workedExamples": [{"title": "Expanding Opcode Maximum 0-Address Instructions", "problem": "A 16-bit instruction format uses 6-bit address fields. If there are 5 two-address instructions and 180 one-address instructions, what is the maximum number of zero-address instructions that can be formulated?", "steps": ["Step 1: Total possible 16-bit patterns = 2^16 = 65,536. Each address field is a = 6 bits.", "Step 2: Patterns used by 5 two-address instructions = 5 \u00d7 2^(6+6) = 5 \u00d7 4096 = 20,480.", "Step 3: Patterns used by 180 one-address instructions = 180 \u00d7 2^6 = 180 \u00d7 64 = 11,520.", "Step 4: Remaining patterns for zero-address instructions = 65,536 \u2212 (20,480 + 11,520) = 65,536 \u2212 32,000 = 33,536."], "answer": "33,536 zero-address instructions."}], "realWorld": "The Java Virtual Machine (JVM) and WebAssembly use a Zero-Address (Stack) ISA (`iload`, `iadd`, `imul`), early microprocessors like Intel 8085/6502 used One-Address (Accumulator) instructions, x86 uses Two-Address instructions (`ADD EAX, EBX`), and ARM/MIPS/RISC-V use Three-Address register-to-register instructions (`ADD X0, X1, X2`).", "differences": "CALL/RET vs JMP: A Jump (JMP) permanently changes PC without saving the return address, whereas a Subroutine Call (CALL) pushes/saves the current PC (address of the next instruction) onto the stack or Link Register before branching so RET can restore PC.", "formulas": ["Expanding Opcode Formula: \u2211 (N_k \u00d7 2^(k \u00d7 a)) = 2^L, where L = instruction length and a = bits per address field."], "examTraps": ["TRAP 1: Thinking Zero-Address machines never use addresses at all. Even in a stack machine, `PUSH X` and `POP X` must specify the memory address `X` (1-address format)!", "TRAP 2: When CALL executes at address `2000` and the CALL instruction itself is `3 bytes` long, what address is pushed onto the stack? Always the address of the NEXT instruction (`2003`), NOT `2000`!"], "factsToMemorize": ["Zero-address stack evaluation uses Reverse Polish Notation (RPN / Postfix), which eliminates parentheses.", "Compare (`CMP A, B`) and Test (`TEST A, B`) instructions perform subtraction (`A \u2212 B`) and bitwise AND (`A \u2227 B`) respectively to update Status Flags WITHOUT modifying destination operand `A`!"], "pyqInsights": "Expanding opcode calculations and identifying which instruction type uses an implied Accumulator vs Top-of-Stack are frequent in KVS/NVS PGT and DSSSB exams.", "quickRevision": "3-Address: R1 <- R2 op R3 (RISC, short programs, long instructions). 2-Address: R1 <- R1 op R2 (x86). 1-Address: AC <- AC op M[X] (Accumulator). 0-Address: TOS <- TOS op SOS (Stack, RPN). Expanding Opcode: N2*2^(2a) + N1*2^a + N0 <= 2^L."}, {"id": "MOD-G", "code": "G", "title": "Module G: Addressing Modes", "shortTitle": "G. Addressing Modes", "navGroup": "mod-isa-addr", "targetQuestions": 25, "subtopics": ["Immediate addressing", "Direct (Absolute) addressing", "Indirect addressing", "Register addressing", "Register indirect addressing", "Indexed addressing", "Base register addressing", "Relative / PC-relative addressing", "Auto-increment and Auto-decrement addressing", "Implied (Implicit) addressing", "Stack addressing", "Displacement addressing", "Effective Address (EA) calculations & Exam traps"], "intro": "Addressing Modes specify the rule for interpreting or modifying the address field of an instruction before the operand is actually referenced. This is one of the most heavily tested topics in DSSSB TGT/PGT Computer Science (tested in DSSSB TGT CS 12 Sep 2025 Shift 2 Q74 and 7 Feb 2024 Shift 2 Q127).", "definitions": [{"term": "Effective Address (EA)", "def": "The actual memory address (or register identifier) where the operand resides, computed by the CPU during the instruction execution/decode phase."}, {"term": "Immediate Addressing", "def": "The instruction's operand field contains the actual constant data value itself rather than an address (e.g., `MOV R1, #50`). Zero memory accesses required during execution!"}, {"term": "Direct Addressing", "def": "The address field of the instruction contains the actual effective address of the operand in main memory (`EA = A`, `Operand = M[A]`) (verified in DSSSB TGT CS 12 Sep 2025 Shift 2 Q74)."}, {"term": "Register Indirect Addressing", "def": "The instruction specifies a CPU register whose contents give the effective address of the operand in memory (`EA = R`, `Operand = M[R]`) (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q127)."}], "explanation": "\n<h4>1. Complete Table of 12 Addressing Modes, Effective Addresses & Memory Refs</h4>\n<ul>\n  <li><strong>1. Implied / Implicit Mode:</strong> Operand is specified implicitly in the opcode definition (e.g., <code>CMA</code> complements AC, <code>CLC</code> clears Carry flag, <code>RET</code>). <em>EA = None; Memory Accesses = 0 (or 1 for stack).</em></li>\n  <li><strong>2. Immediate Mode:</strong> Operand value is inside the instruction (<code>Operand = A</code>). Used to initialize registers with constants. <em>EA = None; Memory Accesses = 0 (after fetch).</em></li>\n  <li><strong>3. Register Mode:</strong> Operand is inside CPU register <code>R</code> (<code>Operand = R</code>). Very fast, short address field (<code>log\u2082(k)</code> bits). <em>EA = R; Memory Accesses = 0.</em></li>\n  <li><strong>4. Register Indirect Mode:</strong> CPU register <code>R</code> holds the memory address of the operand (<code>EA = (R)</code>, <code>Operand = M[(R)]</code>). Used for pointers in C/C++ (<code>*ptr</code>). <em>Memory Accesses = 1.</em></li>\n  <li><strong>5. Auto-Increment / Auto-Decrement Mode:</strong> Same as Register Indirect, except register <code>R</code> is automatically incremented (after access: <code>(R)+</code>) or decremented (before access: <code>\u2212(R)</code>) by the operand size <code>d</code>. Used for stepping through arrays and stacks. <em>Memory Accesses = 1.</em></li>\n  <li><strong>6. Direct (Absolute) Mode:</strong> Instruction address field <code>A</code> points directly to memory (<code>EA = A</code>, <code>Operand = M[A]</code>). Used for global/static variables. <em>Memory Accesses = 1.</em></li>\n  <li><strong>7. Indirect Mode:</strong> Instruction address field <code>A</code> points to a memory word that holds the effective address (<code>EA = M[A]</code>, <code>Operand = M[M[A]]</code>). <em>Memory Accesses = 2.</em></li>\n  <li><strong>8. Relative (PC-Relative) Mode:</strong> <code>EA = PC + A</code> (where <code>PC</code> has already been incremented to point to the next instruction!). Used for position-independent conditional branch instructions. <em>Memory Accesses = 1.</em></li>\n  <li><strong>9. Indexed Mode:</strong> <code>EA = A + XR</code> (where <code>A</code> is the base array start address in the instruction and <code>XR</code> holds the element index offset). Ideal for array indexing <code>A[i]</code>. <em>Memory Accesses = 1.</em></li>\n  <li><strong>10. Base-Register Mode:</strong> <code>EA = BR + A</code> (where Base Register <code>BR</code> holds a base memory address and <code>A</code> is a short displacement). Ideal for <strong>program relocation</strong> in multiprogramming OS!</li>\n  <li><strong>11. Stack Mode:</strong> Operand is implicitly at the Top of Stack pointed to by <code>SP</code> (<code>EA = SP</code>).</li>\n</ul>\n", "classifications": ["Zero-Memory-Access Modes (during Execute phase): Immediate, Register, Implied.", "One-Memory-Access Modes: Direct, Register Indirect, Auto-Increment/Decrement, PC-Relativ
