o produce an n-bit quotient, what condition causes a 'Divide Overflow'?", "options": {"A": "When the upper half of the dividend A is strictly less than the divisor M (A < M)", "B": "When the upper half of the dividend A is greater than or equal to the divisor M (A \u2265 M)", "C": "Whenever the remainder is non-zero", "D": "Whenever the dividend is an odd number"}, "correctAnswer": "B", "explanation": "Since the quotient register Q has only n bits (max value < 2^n), we require Dividend / Divisor < 2^n \u2192 (2^n \u00b7 A + Q) / M < 2^n \u2192 A < M. If A \u2265 M (which includes M = 0!), the quotient cannot fit in n bits and a Divide-Overflow flip-flop (DVF) is set.", "moduleCode": "C", "module": "Computer Arithmetic and ALU", "topic": "Division Algorithms", "subtopic": "Division Overflow Condition", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-C-022", "question": "When performing an Arithmetic Shift Left (ASHL) on an n-bit signed 2's complement register R to multiply by 2, how does the hardware detect that signed overflow has occurred?", "options": {"A": "If the LSB before the shift was 1", "B": "If the sign bit before the shift (R[n\u22121]) differs from the bit about to be shifted into the sign position (R[n\u22122]), i.e., V = R[n\u22121] \u2295 R[n\u22122]", "C": "If all bits in the register are 0", "D": "Arithmetic Shift Left can never cause overflow"}, "correctAnswer": "B", "explanation": "Multiplying a signed number by 2 changes its sign (overflows) if and only if the new MSB (formerly R[n\u22122]) differs from the original sign bit R[n\u22121]. Thus V = R[n\u22121] \u2295 R[n\u22122].", "moduleCode": "C", "module": "Computer Arithmetic and ALU", "topic": "Shift Operations", "subtopic": "Arithmetic Shift Left Overflow", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-C-023", "question": "In a decimal arithmetic unit, how many 4-bit binary adders are required to construct a single-digit (1-decade) 8421 BCD Adder?", "options": {"A": "1 four-bit binary adder", "B": "2 four-bit binary adders (one for initial nibble addition, one to conditionally add 0110) plus combinational carry-detection gates", "C": "4 four-bit binary adders", "D": "8 four-bit binary adders"}, "correctAnswer": "B", "explanation": "A 1-decade BCD adder uses one 4-bit binary adder to add the two BCD digits + input carry, combinational gates (`C = K + Z\u2088Z\u2084 + Z\u2088Z\u2082`) to detect if the sum > 9, and a second 4-bit binary adder to add `0110` (6) when `C = 1`.", "moduleCode": "C", "module": "Computer Arithmetic and ALU", "topic": "BCD Arithmetic", "subtopic": "9's Complement Subtraction", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-C-024", "question": "Which of the following correctly describes the operations performed on the Sign bits (S\u2081, S\u2082), Biased Exponents (E\u2081, E\u2082), and Significands (1.M\u2081, 1.M\u2082) when multiplying two IEEE 754 single-precision numbers?", "options": {"A": "S = S\u2081 \u2295 S\u2082 ; E = E\u2081 + E\u2082 \u2212 127 ; Significand = (1.M\u2081) \u00d7 (1.M\u2082) followed by normalization", "B": "S = S\u2081 \u00b7 S\u2082 ; E = E\u2081 \u00d7 E\u2082 ; Significand = (1.M\u2081) + (1.M\u2082)", "C": "S = S\u2081 \u2295 S\u2082 ; E = E\u2081 + E\u2082 + 127 ; Significand = (1.M\u2081) \u00d7 (1.M\u2082)", "D": "S = S\u2081 + S\u2082 ; E = E\u2081 \u2212 E\u2082 ; Significand = (1.M\u2081) / (1.M\u2082)"}, "correctAnswer": "A", "explanation": "When multiplying two biased exponents E\u2081 = e\u2081 + 127 and E\u2082 = e\u2082 + 127, their sum is e\u2081 + e\u2082 + 254 (double-biased!). Subtracting 127 once restores the single bias: E_result = E\u2081 + E\u2082 \u2212 127. Signs are XORed, and significands are multiplied.", "moduleCode": "C", "module": "Computer Arithmetic and ALU", "topic": "Floating-Point Arithmetic", "subtopic": "Floating-Point Multiplication Steps", "difficulty": "Easy", "questionType": "Sequence/Order", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-C-025", "question": "In Intel 8085 / x86 processors, the Parity Flag (PF) is set to 1 if the result of an ALU operation has an even number of 1s. If an 8-bit ALU operation produces 0x3C (00111100\u2082), what are the states of PF and ZF?", "options": {"A": "PF = 1, ZF = 0", "B": "PF = 0, ZF = 0", "C": "PF = 1, ZF = 1", "D": "PF = 0, ZF = 1"}, "correctAnswer": "A", "explanation": "0x3C = 00111100\u2082 contains four 1s (an even number), so Parity Flag PF = 1. Since the result is non-zero, Zero Flag ZF = 0.", "moduleCode": "C", "module": "Computer Arithmetic and ALU", "topic": "Status Flags", "subtopic": "Parity Flag (PF)", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-001", "question": "The elementary operation executed on data stored in registers during one clock pulse is called:", "options": {"A": "Macro-operation", "B": "Micro-operation", "C": "System call", "D": "Compiler directive"}, "correctAnswer": "B", "explanation": "A micro-operation is an elementary hardware operation performed on the binary data stored in one or more registers during a single clock pulse (e.g., shift, count, clear, add, or load).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Micro-operations", "subtopic": "Definition of Micro-operation", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/the-operation-executed-on-data-stored-in-registers--5f3e9bd8332c6475c5541a63", "numericalCategory": null}, {"id": "COA-D-002", "question": "What is the meaning of the following arithmetic micro-operation in Register Transfer Language (RTL)?\nR3 \u2190 R1 + R2' + 1", "options": {"A": "R3 receives the sum of R1, R2, and 1", "B": "R3 receives the content of R1 minus the content of R2 (subtraction via 2's complement)", "C": "R3 receives the 1's complement of (R1 + R2)", "D": "R3 receives the bitwise OR of R1 and R2 incremented by 1"}, "correctAnswer": "B", "explanation": "In RTL, R2' represents the 1's complement of register R2, so R2' + 1 is the 2's complement of R2. Therefore, R3 \u2190 R1 + R2' + 1 computes the subtraction R3 \u2190 R1 \u2212 R2.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Arithmetic Micro-operations", "subtopic": "2's Complement Subtraction RTL", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/what-is-the-meaning-of-this-arithmetic-micro-opera--611a326a5836b0fbd61c3d7a", "numericalCategory": null}, {"id": "COA-D-003", "question": "Into how many fundamental categories are the micro-operations encountered in digital computers classified?", "options": {"A": "2 (Arithmetic and Logic)", "B": "4 (Register transfer, Arithmetic, Logic, and Shift)", "C": "6", "D": "8"}, "correctAnswer": "B", "explanation": "In digital computer organization (M. Morris Mano), micro-operations are classified into 4 fundamental categories: (1) Register transfer micro-operations, (2) Arithmetic micro-operations, (3) Logic micro-operations, and (4) Shift micro-operations.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Micro-operations", "subtopic": "Categories of Micro-operations", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/by-how-many-different-ways-micro-operation-encount--611a33b2706ea1b2e086d0d7", "numericalCategory": null}, {"id": "COA-D-004", "question": "A CPU has 8 registers, each of 16 bits, connected to a Common Bus System constructed using multiplexers. How many multiplexers are required, what is the size of each multiplexer, and how many selection inputs does each have?", "options": {"A": "8 multiplexers of size 16 \u00d7 1 with 4 select lines", "B": "16 multiplexers of size 8 \u00d7 1 with 3 select lines", "C": "16 multiplexers of size 16 \u00d7 1 with 4 select lines", "D": "8 multiplexers of size 8 \u00d7 1 with 3 select lines"}, "correctAnswer": "B", "explanation": "For k = 8 registers of n = 16 bits: Number of MUXes = n = 16 (one per bit line of the bus); Size of each MUX = k \u00d7 1 = 8 \u00d7 1; Number of selection lines = log\u2082(k) = log\u2082(8) = 3.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Common Bus System", "subtopic": "Multiplexer Bus Sizing", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-D-005", "question": "What are the three output states of a Three-State (Tri-State) Buffer used to construct a common bus system?", "options": {"A": "Positive, Negative, and Ground", "B": "Logic 0, Logic 1, and High-Impedance (Hi-Z / Open Circuit)", "C": "Fetch, Decode, and Execute", "D": "Read, Write, and Reset"}, "correctAnswer": "B", "explanation": "A tri-state buffer has two regular logic states (0 and 1) when enabled, and a third High-Impedance (Hi-Z) state when disabled, which electrically disconnects the gate from the shared bus wire.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Common Bus System", "subtopic": "Three-State Bus Buffers", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-006", "question": "Under what hardware condition can the simultaneous register swap `T: R1 \u2190 R2, R2 \u2190 R1` execute correctly within a single clock pulse?", "options": {"A": "Only if R1 and R2 are built from unclocked SR latches", "B": "When the registers are constructed using edge-triggered (or master-slave) flip-flops", "C": "It is physically impossible without using a third temporary register R3", "D": "Only when the clock frequency is zero"}, "correctAnswer": "B", "explanation": "Edge-triggered (or master-slave) flip-flops sample their inputs right before the clock edge and update their outputs right after the clock edge, allowing `R1 \u2190 R2` and `R2 \u2190 R1` to occur concurrently in the same clock pulse.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Register Transfer Notation", "subtopic": "Simultaneous Register Exchange", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-007", "question": "Register A holds 11011010 and Register B holds 00001111. What is the value in Register A after executing a 'Selective-Clear' micro-operation using B as the control mask?", "options": {"A": "11010000", "B": "00001010", "C": "11011111", "D": "11010101"}, "correctAnswer": "A", "explanation": "Selective-Clear clears to 0 those bits in A where the corresponding bit in B is 1 (RTL: `A \u2190 A \u2227 B'`). Since B = 00001111, B' = 11110000, so `11011010 \u2227 11110000 = 11010000`.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Logic Micro-operations", "subtopic": "Selective-Clear Operation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-008", "question": "Which bitwise logic micro-operation implements the 'Selective-Complement' operation (inverting bits in Register A wherever Register B has a 1, while leaving bits in A unchanged where B has a 0)?", "options": {"A": "A \u2190 A \u2227 B", "B": "A \u2190 A \u2228 B", "C": "A \u2190 A \u2295 B", "D": "A \u2190 A \u2227 B'"}, "correctAnswer": "C", "explanation": "Since X \u2295 1 = X' and X \u2295 0 = X, the XOR micro-operation `A \u2190 A \u2295 B` selectively complements every bit in A where B has a 1.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Logic Micro-operations", "subtopic": "Selective-Complement Operation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-009", "question": "Which logic micro-operation clears all bits in Accumulator AC to 0 in a single clock cycle without needing a second operand register initialized to zero?", "options": {"A": "AC \u2190 AC \u2228 AC", "B": "AC \u2190 AC \u2295 AC", "C": "AC \u2190 AC \u2227 AC", "D": "AC \u2190 AC'"}, "correctAnswer": "B", "explanation": "Since any bit XORed with itself is 0 (`X \u2295 X = 0`), executing `AC \u2190 AC \u2295 AC` (or `XOR EAX, EAX` in x86 assembly) clears a register to all zeros in 1 cycle!", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Logic Micro-operations", "subtopic": "Mask vs Clear", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-010", "question": "If AR is the Address Register and DR is the Data Register, which RTL statements correctly represent a Memory Read operation followed by a Memory Write operation?", "options": {"A": "Read: AR \u2190 M[DR] ; Write: M[DR] \u2190 AR", "B": "Read: DR \u2190 M[AR] ; Write: M[AR] \u2190 DR", "C": "Read: M[AR] \u2190 DR ; Write: DR \u2190 M[AR]", "D": "Read: DR \u2190 AR ; Write: AR \u2190 DR"}, "correctAnswer": "B", "explanation": "Memory is indexed by the Address Register `M[AR]`. Reading memory transfers `M[AR]` into `DR` (`DR \u2190 M[AR]`), and writing memory transfers `DR` into `M[AR]` (`M[AR] \u2190 DR`).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Memory Transfer", "subtopic": "Memory Read and Write RTL", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-011", "question": "How many distinct logic micro-operations can be formulated for two binary register variables X and Y?", "options": {"A": "4", "B": "8", "C": "16", "D": "32"}, "correctAnswer": "C", "explanation": "For n = 2 binary variables, the truth table has 2^2 = 4 rows, and there are 2^(2^n) = 2^4 = 16 distinct Boolean functions (from Clear 0 to Transfer, AND, OR, XOR, NAND, NOR, XNOR, and Preset 1).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Logic Micro-operations", "subtopic": "Number of 2-Variable Logic Functions", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-012", "question": "In Morris Mano's 4-bit Arithmetic Circuit using Full Adders and 4\u00d71 Multiplexers controlled by selection inputs (S\u2081, S\u2080) and input carry C_in, if S\u2081=0, S\u2080=1 selects B' (1's complement of B) into the Full Adders, what micro-operation is performed when S\u2081=0, S\u2080=1, and C_in=0?", "options": {"A": "F = A + B", "B": "F = A + B' (Subtract with borrow / 1's complement addition)", "C": "F = A + B' + 1 (2's complement subtraction A \u2212 B)", "D": "F = A \u2212 1 (Decrement A)"}, "correctAnswer": "B", "explanation": "Since the multiplexer passes Y = B' and C_in = 0, the Full Adders compute F = A + B' + 0 = A + B'. Setting C_in = 1 gives F = A + B' + 1 (2's complement subtraction).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Arithmetic Micro-operations", "subtopic": "4-Bit Binary Adder-Subtractor Table", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-013", "question": "A 4-bit combinational shifter uses 2 \u00d7 1 multiplexers to shift a 4-bit word either Left (S = 1) or Right (S = 0) in a single propagation delay. How many 2 \u00d7 1 multiplexers are required?", "options": {"A": "2", "B": "4", "C": "8", "D": "16"}, "correctAnswer": "B", "explanation": "An n-bit 1-position left/right combinational shifter requires exactly n = 4 multiplexers of size 2 \u00d7 1 (one MUX per output bit H\u2080..H\u2083).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Shift Micro-operations", "subtopic": "Bidirectional Combinational Shifter", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-014", "question": "In the Register Transfer Language statement `x'y T\u2081: R2 \u2190 R1 + 1`, what does the prefix `x'y T\u2081:` specify?", "options": {"A": "The destination register address", "B": "A Boolean control condition that must equal 1 (x=0, y=1, and timing signal T\u2081=1) for the increment transfer to execute", "C": "The opcode of an assembly instruction", "D": "An unconditional branch target"}, "correctAnswer": "B", "explanation": "In RTL, the expression before the colon (`x'y T\u2081:`) is the Boolean control function that gates the load/increment enable of the register on the clock edge.", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Control Functions", "subtopic": "Conditional RTL Meaning", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-D-015", "question": "What is a 'Barrel Shifter' in a modern 32-bit ALU?", "options": {"A": "A sequential shift register that takes k clock cycles to shift by k bits", "B": "A purely combinational multiplexer network (typically log\u2082(n) stages of 2\u00d71 MUXes) that shifts or rotates an n-bit word by ANY number of bit positions (0 to n\u22121) in a single clock cycle", "C": "A magnetic drum memory buffer", "D": "A circuit that converts serial UART data to parallel"}, "correctAnswer": "B", "explanation": "A Barrel Shifter uses log\u2082(n) stages of multiplexers (e.g., 5 stages shifting by 16, 8, 4, 2, 1 bits for a 32-bit word) to shift/rotate by any amount in 1 clock cycle (O(log n) gate delay).", "moduleCode": "D", "module": "Register Transfer and Micro-operations", "topic": "Shift Micro-operations", "subtopic": "Barrel Shifter", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-001", "question": "Select the INCORRECT option among the phases of the CPU Instruction Cycle:", "options": {"A": "Fetch", "B": "Encode", "C": "Decode", "D": "Execute"}, "correctAnswer": "B", "explanation": "The standard phases of the CPU instruction cycle are Fetch, Decode, Execute (and Store/Write-back or Interrupt check). 'Encode' is NOT a phase of the CPU instruction cycle.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Instruction Cycle", "subtopic": "Phases of CPU Instruction Cycle", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 1 (9:00 AM)", "sourceReference": "https://www.utpaper.in/question/select-the-incorrect-option-among-the-phases-of-the-cpu-instruction-cycle-3147", "numericalCategory": null}, {"id": "COA-E-002", "question": "Which cycle is primarily managed by the Control Unit?", "options": {"A": "I/O cycle", "B": "Memory refresh cycle", "C": "Instruction cycle (Fetch-Decode-Execute cycle)", "D": "Arithmetic cycle"}, "correctAnswer": "C", "explanation": "The Control Unit (CU) primarily manages the Instruction Cycle (Fetch-Decode-Execute), generating the timing and control signals that fetch instructions via PC/IR, decode opcodes, and coordinate execution.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Timing and Control", "subtopic": "Control Unit Managed Cycle", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 1 (9:00 AM)", "sourceReference": "https://www.utpaper.in/question/which-cycle-is-primarily-managed-by-the-control-unit-3135", "numericalCategory": null}, {"id": "COA-E-003", "question": "In CPU, which of the following type of register is required by the control unit and contains the instruction currently being executed?", "options": {"A": "Instruction register (IR)", "B": "Memory data register (MDR)", "C": "Program counter (PC)", "D": "Address register (AR)"}, "correctAnswer": "A", "explanation": "During the Fetch phase, the instruction at the address in PC is read from memory into the Instruction Register (IR). The Control Unit then reads and decodes the IR to execute the current instruction.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "CPU Registers", "subtopic": "Instruction Register Role", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2024", "shift": "7 Feb 2024, Shift 2 (12:30 PM)", "sourceReference": "https://www.utpaper.in/question/in-cpu-which-of-the-following-type-of-register-is-required-by-the-control-unit-a-2027", "numericalCategory": null}, {"id": "COA-E-004", "question": "What is the primary function of the Program Counter (PC) register in a computer processor?", "options": {"A": "To count the total number of programs stored on the hard disk", "B": "To hold the memory address of the next instruction to be fetched and executed", "C": "To store the final arithmetic result of the ALU", "D": "To count the number of page faults during execution"}, "correctAnswer": "B", "explanation": "The Program Counter (PC) holds the memory address of the next instruction to be fetched from main memory and is automatically incremented during the Fetch cycle.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "CPU Registers", "subtopic": "Program Counter Function", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/what-is-the-function-ofs-the-program-counter-register-3951", "numericalCategory": null}, {"id": "COA-E-005", "question": "In the basic computer instruction format, how many bits are required to distinguish between a direct address and an indirect address?", "options": {"A": "1 bit", "B": "2 bits", "C": "3 bits", "D": "4 bits"}, "correctAnswer": "A", "explanation": "Only 1 mode bit (Bit 15, denoted as I) is required to distinguish between Direct addressing (I = 0) and Indirect addressing (I = 1).", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Instruction Formats", "subtopic": "Direct vs Indirect Bit", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/how-many-bits-are-required-to-distinguish-between--611a331a90818f4fef631e68", "numericalCategory": null}, {"id": "COA-E-006", "question": "In M. Morris Mano's Basic Computer with a main memory of 4096 \u00d7 16 bits, which of the following gives the exact bit widths of registers PC, AR, IR, AC, and OUTR?", "options": {"A": "PC: 16, AR: 16, IR: 16, AC: 16, OUTR: 8", "B": "PC: 12, AR: 12, IR: 16, AC: 16, OUTR: 8", "C": "PC: 12, AR: 16, IR: 12, AC: 16, OUTR: 16", "D": "PC: 16, AR: 12, IR: 16, AC: 12, OUTR: 8"}, "correctAnswer": "B", "explanation": "Since memory has 4096 = 2^12 words, address registers PC and AR are 12 bits wide. Word registers IR, DR, AC, and TR are 16 bits wide. Character I/O registers INPR and OUTR are 8 bits wide.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "CPU Registers", "subtopic": "Basic Computer Register Sizes", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-007", "question": "Which sequence of Register Transfer statements accurately describes the Fetch and Decode phases (T\u2080, T\u2081, T\u2082) of the Basic Computer?", "options": {"A": "T\u2080: IR \u2190 M[PC] ; T\u2081: PC \u2190 PC + 1 ; T\u2082: AR \u2190 IR(0\u201311)", "B": "T\u2080: AR \u2190 PC ; T\u2081: IR \u2190 M[AR], PC \u2190 PC + 1 ; T\u2082: D\u2080..D\u2087 \u2190 Decode IR(12\u201314), AR \u2190 IR(0\u201311), I \u2190 IR(15)", "C": "T\u2080: PC \u2190 AR ; T\u2081: DR \u2190 M[AR] ; T\u2082: IR \u2190 DR", "D": "T\u2080: AR \u2190 IR(0\u201311) ; T\u2081: PC \u2190 PC + 1 ; T\u2082: IR \u2190 M[AR]"}, "correctAnswer": "B", "explanation": "Because only AR is connected to the memory address inputs in the Basic Computer bus, PC must first be transferred to AR at T\u2080 (`AR \u2190 PC`). Then at T\u2081, `IR \u2190 M[AR]` and `PC \u2190 PC + 1` occur simultaneously, followed by decoding at T\u2082.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Instruction Cycle", "subtopic": "Fetch Micro-operations", "difficulty": "Moderate", "questionType": "Sequence/Order", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-008", "question": "In the 16-bit Basic Computer instruction format (Bit 15 = I, Bits 14..12 = Opcode, Bits 11..0 = Address/Operation), how does the Control Unit identify an Input-Output instruction versus a Register-Reference instruction?", "options": {"A": "Opcode = 111 (D\u2087=1) with I=0 is Register-Reference (7xxx\u2081\u2086); Opcode = 111 (D\u2087=1) with I=1 is Input-Output (Fxxx\u2081\u2086)", "B": "Opcode = 000 with I=0 is Register-Reference; Opcode = 000 with I=1 is Input-Output", "C": "Bit 15 = 1 always means Input-Output regardless of opcode", "D": "Opcode = 110 is Register-Reference; Opcode = 111 is Input-Output"}, "correctAnswer": "A", "explanation": "When bits 14..12 are 111 (decoder output D\u2087 = 1), the instruction is non-memory-reference: if I = 0 (bits 15..12 = 0111 = 7_hex), it is a Register-Reference instruction; if I = 1 (bits 15..12 = 1111 = F_hex), it is an Input-Output instruction.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Instruction Decoding", "subtopic": "Register-Reference vs I/O Identification", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-009", "question": "How does the Basic Computer's `BSA` (Branch and Save Return Address, opcode D\u2085) instruction support subroutines without a hardware Stack Pointer?", "options": {"A": "It pushes PC onto the Accumulator AC and jumps to AR", "B": "At T\u2084 it stores the return address (PC) into memory word M[AR] and increments AR (AR \u2190 AR + 1); at T\u2085 it transfers AR to PC (PC \u2190 AR)", "C": "It disables interrupts and halts the Sequence Counter", "D": "It saves PC into the Instruction Register IR"}, "correctAnswer": "B", "explanation": "BSA executes `D\u2085T\u2084: M[AR] \u2190 PC, AR \u2190 AR + 1` followed by `D\u2085T\u2085: PC \u2190 AR, SC \u2190 0`. The first word of the subroutine `M[AR]` holds the saved return address, and execution begins at `AR + 1`. Returning uses an indirect branch `BUN I AR`!", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Memory-Reference Instructions", "subtopic": "BSA (Branch and Save Return Address)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-010", "question": "During the execution of the `ISZ` (Increment and Skip if Zero, opcode D\u2086) memory-reference instruction, why must the memory word first be read into `DR` (`D\u2086T\u2084: DR \u2190 M[AR]`) before being incremented (`D\u2086T\u2085: DR \u2190 DR + 1`) and written back (`D\u2086T\u2086: M[AR] \u2190 DR`)?", "options": {"A": "Because main memory RAM chips do not contain internal incrementer combinational logic; only processor registers like DR can be incremented", "B": "Because AR cannot hold a 12-bit address during T\u2085", "C": "Because PC is locked during T\u2084", "D": "Because AC must be cleared first"}, "correctAnswer": "A", "explanation": "Main memory (RAM) is purely a storage array and cannot increment a stored word internally. Therefore, `M[AR]` is read into `DR`, incremented inside `DR`, tested for zero (`if (DR = 0) then (PC \u2190 PC + 1)`), and written back to `M[AR]`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Memory-Reference Instructions", "subtopic": "ISZ (Increment and Skip if Zero)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-011", "question": "When the Interrupt flip-flop `R = 1` in the Basic Computer, what sequence of micro-operations occurs during `RT\u2080, RT\u2081, RT\u2082`?", "options": {"A": "RT\u2080: AR \u2190 0, TR \u2190 PC ; RT\u2081: M[AR] \u2190 TR, PC \u2190 0 ; RT\u2082: PC \u2190 PC + 1, IEN \u2190 0, R \u2190 0, SC \u2190 0", "B": "RT\u2080: PC \u2190 0 ; RT\u2081: IR \u2190 M[0] ; RT\u2082: IEN \u2190 1", "C": "RT\u2080: AC \u2190 PC ; RT\u2081: M[1] \u2190 AC ; RT\u2082: PC \u2190 0", "D": "RT\u2080: DR \u2190 PC ; RT\u2081: OUTR \u2190 DR ; RT\u2082: HLT"}, "correctAnswer": "A", "explanation": "During the Basic Computer Interrupt Cycle (`R=1`), the return address `PC` is saved into memory location `0` (`M[0] \u2190 TR`), `PC` is cleared and incremented to `1` (`PC \u2190 1`), and `IEN` and `R` are cleared to `0`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Interrupt Cycle", "subtopic": "Basic Computer Interrupt Handling", "difficulty": "Moderate", "questionType": "Sequence/Order", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-012", "question": "In the Basic Computer's 16-bit Common Bus System (controlled by 3 select lines S\u2082S\u2081S\u2080), 7 components (AR, PC, DR, AC, IR, TR, and Memory M[AR]) can place data onto the bus. Which register is connected ONLY to the ALU and can NEVER be loaded directly from the common bus?", "options": {"A": "Data Register (DR)", "B": "Accumulator (AC)", "C": "Address Register (AR)", "D": "Program Counter (PC)"}, "correctAnswer": "B", "explanation": "In Mano's Basic Computer, the inputs to the Accumulator (AC) come strictly from the Adder & Logic (ALU) circuit (which receives DR, INPR, and AC). To load AC from memory (`LDA`), data goes `M[AR] \u2192 DR \u2192 ALU \u2192 AC`!", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Common Bus System", "subtopic": "16-Bit Bus Multiplexer Inputs", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-013", "question": "Suppose the 16-bit Accumulator `AC` initially contains `0xFF05`. What is the hexadecimal content of `AC` after executing the three Register-Reference instructions `CMA` (7200\u2081\u2086), `INC` (7020\u2081\u2086), and `CLA` (7800\u2081\u2086) in that exact order?", "options": {"A": "0x00FA", "B": "0x00FB", "C": "0x0000", "D": "0xFF06"}, "correctAnswer": "C", "explanation": "Read carefully! `CMA` complements AC to `0x00FA`; `INC` increments AC to `0x00FB` (the 2's complement of `0xFF05`); and the third instruction `CLA` (Clear Accumulator) clears `AC` to `0x0000`! (Without `CLA`, `CMA` + `INC` forms the 2's complement `0x00FB`).", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Register-Reference Instructions", "subtopic": "CLA, CMA, INC Execution", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-014", "question": "In the Basic Computer's I/O configuration, what is the purpose of the 1-bit flags `FGI` (Input Flag) and `FGO` (Output Flag)?", "options": {"A": "They indicate signed overflow and carry in the ALU", "B": "They act as synchronization status flip-flops (`FGI=1` when INPR has a new input character; `FGO=1` when OUTR is ready to accept a new output character)", "C": "They select between direct and indirect addressing", "D": "They control the clock frequency"}, "correctAnswer": "B", "explanation": "`FGI` is set to 1 when the keyboard places an 8-bit character into `INPR` and cleared to 0 when the CPU executes `INP`. `FGO` is 1 when the printer is ready and cleared to 0 when the CPU loads `OUTR` via `OUT`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Input-Output Instructions", "subtopic": "FGI and FGO Flags", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-015", "question": "At the end of every instruction's execution phase in the Basic Computer, the control unit asserts the micro-operation `SC \u2190 0` (clearing the 4-bit Sequence Counter). What does `SC \u2190 0` cause on the next clock pulse?", "options": {"A": "It halts the computer permanently", "B": "It resets the timing decoder to generate timing signal `T\u2080`, starting the Fetch cycle of the next instruction", "C": "It clears the Program Counter `PC` to 0", "D": "It erases main memory"}, "correctAnswer": "B", "explanation": "Clearing the 4-bit Sequence Counter (`SC \u2190 0`) makes the 4\u00d716 timing decoder assert `T\u2080` on the next clock transition, which begins the Fetch cycle (`T\u2080: AR \u2190 PC`) of the next instruction.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Timing and Control", "subtopic": "Sequence Counter (SC) Clear", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-016", "question": "Which pair of CPU registers acts as the direct bridge between the internal processor datapath and the external system bus (Address Bus and Data Bus)?", "options": {"A": "PC and IR", "B": "MAR (Memory Address Register) and MDR (Memory Data/Buffer Register)", "C": "AC and Status Register", "D": "SP and Base Register"}, "correctAnswer": "B", "explanation": "MAR drives the external Address Bus, while MDR interfaces bidirectionally with the external Data Bus.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "CPU Registers", "subtopic": "MAR and MDR Interface", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-017", "question": "In the Basic Computer, why does `LDA` (Load to AC) require two execution clock cycles (`T\u2084: DR \u2190 M[AR]`, `T\u2085: AC \u2190 DR, SC \u2190 0`), whereas `STA` (Store AC) completes in a single execution clock cycle (`T\u2084: M[AR] \u2190 AC, SC \u2190 0`)?", "options": {"A": "Because AC can drive the Common Bus directly to write into M[AR], but AC cannot receive data directly from the Common Bus (it must pass through DR and the ALU)", "B": "Because memory writes are twice as fast as memory reads", "C": "Because STA does not use the Address Register AR", "D": "Because LDA does not use the Common Bus"}, "correctAnswer": "A", "explanation": "AC's output is connected directly to the Common Bus (`S\u2082S\u2081S\u2080 = 100`), so `M[AR] \u2190 AC` takes 1 cycle (`T\u2084`). However, AC's input comes only from the ALU, which takes its input from `DR`, requiring `T\u2084: DR \u2190 M[AR]` and `T\u2085: AC \u2190 DR`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Memory-Reference Instructions", "subtopic": "LDA vs STA", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-018", "question": "A computer has a main memory of 1M \u00d7 32 bits (where 1M = 2\u00b2\u2070 words) and an instruction format with a 12-bit opcode and a single 20-bit address field. What are the required bit sizes of MAR, MDR, PC, and IR?", "options": {"A": "MAR: 20, MDR: 32, PC: 20, IR: 32", "B": "MAR: 32, MDR: 20, PC: 32, IR: 20", "C": "MAR: 20, MDR: 20, PC: 32, IR: 32", "D": "MAR: 12, MDR: 32, PC: 20, IR: 20"}, "correctAnswer": "A", "explanation": "1M = 2\u00b2\u2070 words \u2192 Address registers MAR and PC require 20 bits. Each word/instruction is 32 bits \u2192 Data/Instruction registers MDR and IR require 32 bits.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "CPU Registers", "subtopic": "Register Sizing for 1M \u00d7 32 Memory", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-019", "question": "If a Memory-Reference instruction (`D\u2087 = 0`) has its mode bit set to `I = 1` (Indirect addressing), what micro-operation is executed during clock cycle `T\u2083`?", "options": {"A": "AR \u2190 PC", "B": "AR \u2190 M[AR]", "C": "DR \u2190 M[AR]", "D": "AC \u2190 DR"}, "correctAnswer": "B", "explanation": "When `D\u2087' I T\u2083 = 1`, the CPU is in the Indirect Cycle and fetches the effective address from memory into `AR` via `AR \u2190 M[AR]`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Instruction Cycle", "subtopic": "Indirect Cycle Execution", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-E-020", "question": "In the Basic Computer, the 1-bit Extended Accumulator flip-flop `E` holds `1` and the 16-bit `AC` holds `0x8001` (`1000 0000 0000 0001\u2082`). After executing `CIL` (Circulate Left `E` and `AC`), what are the new values of `E` and `AC`?", "options": {"A": "E = 1, AC = 0x0003", "B": "E = 0, AC = 0x0003", "C": "E = 1, AC = 0x0002", "D": "E = 1, AC = 0xC000"}, "correctAnswer": "A", "explanation": "`CIL` performs a 17-bit circular left shift across `(E, AC)`: `E \u2190 AC(15)`, `AC(15..1) \u2190 AC(14..0)`, and `AC(0) \u2190 E`. Since `AC(15) = 1`, new `E = 1`; shifting `8001\u2081\u2086` left and inserting old `E = 1` into `AC(0)` gives `0003\u2081\u2086`.", "moduleCode": "E", "module": "Basic Computer Organization", "topic": "Register-Reference Instructions", "subtopic": "Circular Shift with E (CIL / CIR)", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-001", "question": "Zero-address instructions are designed for which type of CPU organization, and how are operands accessed?", "options": {"A": "General Register Organization; operands are specified by 4-bit fields", "B": "Stack-Organized CPU; operands are implicitly popped from the top of the stack (TOS)", "C": "Single Accumulator CPU; operands are stored in DMA registers", "D": "DMA Controller; operands are fetched from ROM"}, "correctAnswer": "B", "explanation": "Zero-address arithmetic/logic instructions (e.g., `ADD`, `MUL`) contain only an opcode and operate implicitly on the top two elements of a Stack (`TOS` and `SOS`). Only `PUSH X` and `POP X` include an address field.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Types", "subtopic": "Zero-Address Instructions", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-002", "question": "A processor has 16-bit instructions and 4-bit register address fields. If the ISA defines 14 three-address instructions and 31 two-address instructions, what is the maximum number of one-address instructions that can be supported?", "options": {"A": "16", "B": "32", "C": "64", "D": "128"}, "correctAnswer": "A", "explanation": "Total 16-bit encodings = 2\u00b9\u2076 = 65,536. Each address field is a = 4 bits. 14 three-address instructions use 14 \u00d7 2\u00b9\u00b2 = 57,344 patterns; remaining = 2 \u00d7 2\u00b9\u00b2 = 8,192. 31 two-address instructions use 31 \u00d7 2\u2078 = 7,936 patterns; remaining = 8,192 \u2212 7,936 = 256 patterns. Each 1-address instruction uses 2\u2074 = 16 patterns \u2192 Max 1-address instructions = 256 / 16 = 16!", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Encoding", "subtopic": "Expanding Opcode Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-F-003", "question": "A computer has 32-bit instructions and 12-bit address fields. If there are 250 two-address instructions, how many one-address instructions can be formulated?", "options": {"A": "6,144", "B": "24,576", "C": "4,096", "D": "1,024"}, "correctAnswer": "B", "explanation": "In a 32-bit instruction with two 12-bit addresses (24 bits), the base opcode field is 32 \u2212 24 = 8 bits (2\u2078 = 256 combinations). Since 250 combinations are used by 2-address instructions, 256 \u2212 250 = 6 combinations remain unused. Each unused combination expands across the second 12-bit address field: 6 \u00d7 2\u00b9\u00b2 = 6 \u00d7 4096 = 24,576 one-address instructions!", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Encoding", "subtopic": "Expanding Opcode Zero-Address", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Adapted PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-F-004", "question": "What is the minimum number of One-Address (Single Accumulator) instructions required to evaluate the arithmetic expression `X = (A + B) \u00d7 (C + D)` without overwriting A, B, C, or D in memory?", "options": {"A": "4", "B": "5", "C": "7", "D": "9"}, "correctAnswer": "C", "explanation": "We need 7 one-address instructions: (1) `LOAD A`, (2) `ADD B`, (3) `STORE T`, (4) `LOAD C`, (5) `ADD D`, (6) `MUL T`, (7) `STORE X` (or compute C+D first, store in T, load A, add B, mul T, store X = still 7 instructions).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Formats", "subtopic": "One-Address Accumulator Evaluation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-005", "question": "What is the Reverse Polish Notation (Postfix) expression used by a Zero-Address Stack computer to evaluate `A * B + C * D`?", "options": {"A": "A B * C D * +", "B": "A B + C D * *", "C": "* A B + * C D", "D": "A B C D * + *"}, "correctAnswer": "A", "explanation": "In Postfix (RPN), `A * B` becomes `A B *`, `C * D` becomes `C D *`, and their sum becomes `A B * C D * +`. Executed on a stack via: `PUSH A, PUSH B, MUL, PUSH C, PUSH D, MUL, ADD`.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Stack Instructions", "subtopic": "Reverse Polish Notation (RPN)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2019", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-006", "question": "A stack-organized CPU evaluates the Reverse Polish Notation expression `3 4 * 2 5 + + 4 * 2 /`. What is the final value left at the Top of Stack (TOS)?", "options": {"A": "19", "B": "38", "C": "24", "D": "42"}, "correctAnswer": "B", "explanation": "Step-by-step: `3 4 *` = 12; `2 5 +` = 7; `12 7 +` = 19; `19 4 *` = 76; `76 2 /` = 38.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Stack Instructions", "subtopic": "RPN Stack Evaluation Value", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-007", "question": "A processor has 64 distinct registers and uses a fixed 32-bit instruction format. For a 3-register instruction (`OP R_dest, R_src1, R_src2`) that also includes an 8-bit immediate shift amount, how many bits remain for the Opcode field, and how many maximum opcodes of this format are possible?", "options": {"A": "6 bits (64 opcodes)", "B": "8 bits (256 opcodes)", "C": "10 bits (1024 opcodes)", "D": "14 bits (16,384 opcodes)"}, "correctAnswer": "A", "explanation": "Each of the 3 register fields requires log\u2082(64) = 6 bits \u2192 3 \u00d7 6 = 18 bits. Adding the 8-bit immediate field gives 18 + 8 = 26 bits. Remaining Opcode bits = 32 \u2212 26 = 6 bits, supporting 2\u2076 = 64 opcodes.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Formats", "subtopic": "Opcode & Register Field Bit Split", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-F-008", "question": "A 3-byte `CALL 0x5000` instruction is stored in memory starting at address `0x2040`. The Stack Pointer `SP` initially holds `0xFFFE` and the stack grows downward (by 2 bytes per 16-bit push). Immediately after `CALL 0x5000` executes, what are the values of `PC`, `SP`, and the 16-bit return address pushed onto the stack?", "options": {"A": "PC = 0x5000, SP = 0xFFFC, Saved Return Address = 0x2043", "B": "PC = 0x5000, SP = 0xFFFC, Saved Return Address = 0x2040", "C": "PC = 0x2043, SP = 0xFFFF, Saved Return Address = 0x5000", "D": "PC = 0x5000, SP = 0x10000, Saved Return Address = 0x2043"}, "correctAnswer": "A", "explanation": "Fetching the 3-byte `CALL` instruction at `0x2040..0x2042` increments `PC` to `0x2043` (address of the next instruction). `CALL` decrements `SP` by 2 (`0xFFFE \u2212 2 = 0xFFFC`), pushes return address `0x2043` onto the stack, and loads `PC = 0x5000`.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "Subroutine Call Stack Operation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-F-009", "question": "How do the program control instructions `CMP A, B` (Compare) and `TEST A, B` differ from the data manipulation instructions `SUB A, B` and `AND A, B`?", "options": {"A": "CMP and TEST do not update the Status Flags", "B": "CMP performs (A \u2212 B) and TEST performs (A \u2227 B) to update the Status Flags (Z, S, C, V), but NEITHER modifies the destination operand A", "C": "CMP adds A and B whereas SUB subtracts them", "D": "TEST complements A whereas AND clears A"}, "correctAnswer": "B", "explanation": "`CMP A, B` computes `A \u2212 B` and updates flags without writing the difference to `A`. Similarly, `TEST A, B` computes bitwise `A \u2227 B` and updates flags without overwriting `A`.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "CMP vs SUB and TEST vs AND", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-010", "question": "Match the unsigned conditional branch instruction (after `CMP A, B`) with the Status Flag condition it tests:\n1. BE / BZ (Branch if Equal)             P. C == 0 and Z == 0\n2. BNE / BNZ (Branch if Not Equal)       Q. Z == 1\n3. BHI / JA (Branch if Higher, A > B)    R. C == 1 (Borrow = 1)\n4. BLO / JB (Branch if Lower, A < B)     S. Z == 0", "options": {"A": "1-Q, 2-S, 3-P, 4-R", "B": "1-S, 2-Q, 3-R, 4-P", "C": "1-Q, 2-P, 3-S, 4-R", "D": "1-R, 2-S, 3-P, 4-Q"}, "correctAnswer": "A", "explanation": "Equal means `A \u2212 B == 0` (`Z == 1`, Q); Not Equal means `Z == 0` (S); Unsigned Higher (`A > B`) means no borrow (`C == 0`) AND non-zero (`Z == 0`, P); Unsigned Lower (`A < B`) means borrow occurred (`C == 1`, R).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "Conditional Branch Flags", "difficulty": "Moderate", "questionType": "Match-the-Following", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-011", "question": "Which of the following is a machine instruction executed by the CPU rather than an assembler pseudo-instruction (directive) like `ORG`, `EQU`, `END`, or `DB`?", "options": {"A": "ORG", "B": "EQU", "C": "MOV / ADD", "D": "END"}, "correctAnswer": "C", "explanation": "Assembler directives (`ORG`, `EQU`, `DB`, `DW`, `END`) are instructions to the assembler during translation and generate no executable machine opcode, whereas `MOV` and `ADD` are executable CPU machine instructions.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Categories", "subtopic": "Assembler Directive vs Machine Instruction", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "13 Sep 2025, Shift 3 (5:00 PM)", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-is-not-an-assembler-directive-3430", "numericalCategory": null}, {"id": "COA-F-012", "question": "A 32-bit integer `0x12345678` is stored at byte address `0x1000` in a byte-addressable Little-Endian processor (such as Intel x86). What byte value is stored at memory address `0x1000` and at `0x1003`?", "options": {"A": "M[0x1000] = 0x78, M[0x1003] = 0x12", "B": "M[0x1000] = 0x12, M[0x1003] = 0x78", "C": "M[0x1000] = 0x34, M[0x1003] = 0x56", "D": "M[0x1000] = 0x56, M[0x1003] = 0x34"}, "correctAnswer": "A", "explanation": "In Little-Endian byte ordering, the Least Significant Byte (`0x78`) is stored at the lowest byte address (`0x1000`), followed by `0x56` (`0x1001`), `0x34` (`0x1002`), and the Most Significant Byte `0x12` at `0x1003`. (Big-Endian stores `0x12` at `0x1000`).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Data Transfer", "subtopic": "Big-Endian vs Little-Endian", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-013", "question": "In a Two-Address instruction `SUB R1, R2` (`R1 \u2190 R1 \u2212 R2`), why do compilers frequently need to insert extra `MOV` (Copy) instructions before arithmetic operations?", "options": {"A": "Because two-address instructions cannot access CPU registers", "B": "Because one of the source operands (R1) also serves as the destination and gets overwritten", "C": "Because the ALU can only add and never subtract", "D": "Because two-address instructions cannot use immediate constants"}, "correctAnswer": "B", "explanation": "In a two-address instruction `OP Dest/Src1, Src2`, the first operand is overwritten by the result. If the original value of `R1` is needed later in the program, the compiler must first copy it to another register via `MOV`.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Formats", "subtopic": "Two-Address Instruction Property", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-014", "question": "If a hardware stack in main memory grows toward higher memory addresses (ascending stack) and `SP` points to the current Top of Stack item, which pair of micro-operations correctly executes `POP DR`?", "options": {"A": "DR \u2190 M[SP], followed by SP \u2190 SP \u2212 1", "B": "SP \u2190 SP + 1, followed by DR \u2190 M[SP]", "C": "M[SP] \u2190 DR, followed by SP \u2190 SP \u2212 1", "D": "SP \u2190 SP \u2212 1, followed by DR \u2190 M[SP]"}, "correctAnswer": "A", "explanation": "Since `SP` points directly to the current Top-of-Stack word in an ascending stack, `POP DR` first reads the top word (`DR \u2190 M[SP]`) and then decrements the Stack Pointer (`SP \u2190 SP \u2212 1`).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Data Transfer", "subtopic": "Load and Store vs Push and Pop", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-015", "question": "Suppose an instruction word is 4 bytes and each data operand in memory is 4 bytes. To execute a single operation `A = B + C` where A, B, C are in memory, a 3-Address Memory-to-Memory instruction `ADD A, B, C` is 16 bytes long. How many total bytes (instruction + data) are transferred over the memory bus?", "options": {"A": "16 bytes", "B": "20 bytes", "C": "28 bytes", "D": "32 bytes"}, "correctAnswer": "C", "explanation": "Instruction fetch = 16 bytes. Data reads (B and C) = 4 + 4 = 8 bytes. Data write (A) = 4 bytes. Total memory traffic = 16 + 8 + 4 = 28 bytes.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Formats", "subtopic": "Memory Traffic in 1-Address vs 3-Address", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-016", "question": "Why can a subroutine call instruction that stores the return address inside a single fixed register or at the first memory word of the subroutine (like `BSA` in Mano's Basic Computer) NOT directly support recursive function calls?", "options": {"A": "Because a second recursive call to the same subroutine overwrites the previously saved return address; recursion requires a LIFO Stack", "B": "Because recursive functions do not use a Program Counter", "C": "Because the ALU cannot add inside a recursive function", "D": "Because recursion requires a Harvard architecture"}, "correctAnswer": "A", "explanation": "If a subroutine calls itself recursively, storing the new return address in the same fixed location overwrites the caller's return address. A Last-In-First-Out (LIFO) Stack pushes a fresh activation record and return address for every recursive invocation.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "Subroutine Recursion Requirement", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-017", "question": "Which coding principle from information theory inspires assigning shorter opcodes to frequently executed instructions and longer opcodes (via expanding opcodes) to rarely executed instructions in variable-length CISC ISAs?", "options": {"A": "Hamming Encoding", "B": "Huffman Encoding", "C": "Gray Encoding", "D": "Manchester Encoding"}, "correctAnswer": "B", "explanation": "Just like Huffman coding assigns shorter bit strings to high-frequency symbols, variable-length instruction encoding assigns short 1-byte opcodes (e.g., `PUSH`, `POP`, `NOP`, `INC` in x86) to frequent instructions to minimize average program size.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Encoding", "subtopic": "Fixed vs Variable Opcode Length", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-018", "question": "Why is a Register-Memory instruction format (such as `ADD R1, [2050]`, which specifies one CPU register and one main memory address) sometimes referred to as a '1.5-Address' instruction?", "options": {"A": "Because the register field requires far fewer bits (e.g., 3\u20135 bits) than a full main memory address field (e.g., 16\u201332 bits)", "B": "Because it executes in 1.5 clock cycles", "C": "Because it only reads half a byte from memory", "D": "Because half of the opcode is stored in RAM"}, "correctAnswer": "A", "explanation": "A register identifier uses only 3 to 5 bits whereas a memory address uses 16 to 32+ bits, so a instruction with 1 memory address and 1 register field is much shorter than a true 2-memory-address instruction.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Formats", "subtopic": "1.5-Address Instruction Architecture", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-019", "question": "When a conditional skip instruction (such as `ISZ` or `SKI` in the Basic Computer) finds its condition satisfied, how does it skip the next sequential instruction?", "options": {"A": "By clearing the Instruction Register IR", "B": "By incrementing the Program Counter `PC` an extra time (`PC \u2190 PC + 1`) during the Execute phase", "C": "By resetting the Sequence Counter SC to 15", "D": "By halting the clock for 1 cycle"}, "correctAnswer": "B", "explanation": "Since `PC` was already incremented once during Fetch (`T\u2081: PC \u2190 PC + 1`) to point to the next instruction `I_(k+1)`, incrementing `PC` a second time during Execute (`PC \u2190 PC + 1`) advances `PC` to `I_(k+2)`, skipping `I_(k+1)` (assuming fixed 1-word instructions).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "Skip Instructions", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-020", "question": "Which instruction and mask will clear the lower 4 bits (bits 3..0) of an 8-bit register `R1` to 0 while leaving the upper 4 bits (bits 7..4) unchanged?", "options": {"A": "AND R1, #0xF0", "B": "OR R1, #0x0F", "C": "XOR R1, #0xF0", "D": "AND R1, #0x0F"}, "correctAnswer": "A", "explanation": "Bitwise AND with `0xF0` (`11110000\u2082`) preserves the upper 4 bits (`X \u2227 1 = X`) and clears the lower 4 bits (`X \u2227 0 = 0`).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Data Manipulation", "subtopic": "Bit Clear and Bit Test Instructions", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-021", "question": "In a processor with 32-bit (4-byte) instructions and byte-addressable memory, how is the Program Counter `PC` updated during normal straight-line instruction sequencing?", "options": {"A": "PC \u2190 PC + 1", "B": "PC \u2190 PC + 2", "C": "PC \u2190 PC + 4", "D": "PC \u2190 PC + 32"}, "correctAnswer": "C", "explanation": "In byte-addressable memory, each 32-bit instruction occupies 4 consecutive byte addresses, so straight-line sequencing increments `PC` by 4 (`PC \u2190 PC + 4`).", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Sequencing", "subtopic": "Straight-Line Sequencing vs Branching", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-022", "question": "Attempting to execute a `POP` instruction when the stack is completely empty (`EMTY = 1`) causes which condition?", "options": {"A": "Stack Overflow", "B": "Stack Underflow", "C": "Page Fault", "D": "Cache Miss"}, "correctAnswer": "B", "explanation": "Pushing onto a full stack causes **Stack Overflow**, whereas popping from an empty stack causes **Stack Underflow**.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Stack Instructions", "subtopic": "Stack Underflow & Overflow", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-023", "question": "A machine has 32 registers, 64 distinct opcodes, and uses a 32-bit three-operand Register-Register instruction format (`Opcode | Rd | Rs1 | Rs2 | Unused`). How many bits are left unused in this instruction format?", "options": {"A": "7 bits", "B": "11 bits", "C": "13 bits", "D": "16 bits"}, "correctAnswer": "B", "explanation": "64 opcodes require log\u2082(64) = 6 bits. Each of the 3 register fields (Rd, Rs1, Rs2) requires log\u2082(32) = 5 bits \u2192 3 \u00d7 5 = 15 bits. Total used = 6 + 15 = 21 bits. Unused bits = 32 \u2212 21 = 11 bits.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Instruction Encoding", "subtopic": "Fixed Instruction Bit Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-F-024", "question": "How many temporary registers or XOR operations are needed at minimum to swap two registers `R1` and `R2` in assembly without using an extra third register or memory location?", "options": {"A": "3 XOR instructions: `R1 \u2190 R1 \u2295 R2`, `R2 \u2190 R1 \u2295 R2`, `R1 \u2190 R1 \u2295 R2`", "B": "1 AND instruction and 1 OR instruction", "C": "2 ADD instructions", "D": "It is mathematically impossible without a third register"}, "correctAnswer": "A", "explanation": "The classic 3-XOR swap (`R1 ^= R2; R2 ^= R1; R1 ^= R2;`) exchanges the contents of `R1` and `R2` in place without any temporary register or risk of arithmetic overflow.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Data Transfer", "subtopic": "Exchange (XCHG) Instruction", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-F-025", "question": "Which instruction is explicitly placed in a user program to request a privileged Operating System service (System Call)?", "options": {"A": "NOP (No Operation)", "B": "SWI / INT / TRAP / SYSCALL (Software Interrupt)", "C": "CLI (Clear Interrupts)", "D": "HLT (Halt)"}, "correctAnswer": "B", "explanation": "A user process invokes OS kernel services by executing a synchronous software interrupt/trap instruction (`INT n`, `SWI`, `SVC`, or `SYSCALL`), which switches the CPU from User Mode to Kernel/Supervisor Mode.", "moduleCode": "F", "module": "Instruction Set Architecture", "topic": "Control Transfer", "subtopic": "Software Interrupt / Trap Instruction", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-001", "question": "Which addressing mode uses the actual address of the data in the instruction?", "options": {"A": "Indirect addressing", "B": "Immediate addressing", "C": "Direct addressing", "D": "Register addressing"}, "correctAnswer": "C", "explanation": "In Direct (Absolute) addressing mode, the address field of the instruction contains the actual effective address of the operand in main memory (`EA = A`, `Operand = M[A]`).", "moduleCode": "G", "module": "Addressing Modes", "topic": "Direct Addressing", "subtopic": "Actual Address in Instruction", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 2 (1:00 PM)", "sourceReference": "https://www.utpaper.in/question/which-addressing-mode-uses-the-actual-address-of-the-data-in-the-instruction-3235", "numericalCategory": null}, {"id": "COA-G-002", "question": "In which of the following type of addressing mode, the instruction specifies a register in the CPU whose contents give the address of the operand in memory?", "options": {"A": "Register indirect mode", "B": "Indirect address mode", "C": "Implied mode", "D": "Immediate mode"}, "correctAnswer": "A", "explanation": "In Register Indirect addressing mode (`EA = R`, `Operand = M[R]`), the instruction specifies a CPU register whose contents hold the effective memory address of the operand.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Register Indirect Addressing", "subtopic": "Register Holding Memory Address", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2024", "shift": "7 Feb 2024, Shift 2 (12:30 PM)", "sourceReference": "https://www.utpaper.in/question/in-which-of-the-following-type-of-addressing-mode-the-instruction-specifies-a-re-2021", "numericalCategory": null}, {"id": "COA-G-003", "question": "Which addressing mode is most suitable for initializing a register to a constant value (such as `MOV R1, #100`), and how many memory accesses does it require during the Execute phase?", "options": {"A": "Direct addressing; 1 memory access", "B": "Immediate addressing; 0 memory accesses", "C": "Indirect addressing; 2 memory accesses", "D": "Indexed addressing; 1 memory access"}, "correctAnswer": "B", "explanation": "In Immediate addressing, the constant operand (`100`) is part of the fetched instruction itself, so 0 additional memory accesses are needed during execution.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Immediate Addressing", "subtopic": "Constant Initialization", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-004", "question": "A 2-word (4-byte) branch instruction is located at byte address `1000` in a byte-addressable memory. Its signed displacement field contains `\u221224`. Using PC-Relative addressing mode, what is the branch target Effective Address (EA)?", "options": {"A": "976", "B": "980", "C": "1024", "D": "1028"}, "correctAnswer": "B", "explanation": "Step 1: Fetching the 4-byte instruction at address 1000 increments PC to `PC_next = 1000 + 4 = 1004`. Step 2: `EA = PC_next + Offset = 1004 + (\u221224) = 980`!", "moduleCode": "G", "module": "Addressing Modes", "topic": "PC-Relative Addressing", "subtopic": "Effective Address Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-005", "question": "An array of 32-bit (4-byte) integers starts at base address `0x4000` in byte-addressable memory. If the base address `0x4000` is in the instruction address field and Index Register `XR` holds the byte offset for index `i = 10`, what is the Effective Address of `A[10]`?", "options": {"A": "0x400A", "B": "0x4028", "C": "0x4010", "D": "0x4040"}, "correctAnswer": "B", "explanation": "Each 32-bit integer occupies 4 bytes, so index `i = 10` has a byte offset of `10 \u00d7 4 = 40` decimal = `0x28` hex. Thus `EA = 0x4000 + 0x28 = 0x4028`.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Indexed Addressing", "subtopic": "Array Element Access", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-006", "question": "An instruction is stored at location 300 with its address field at location 301 containing the value 400. Register R1 contains 200. Memory contents: M[400] = 700, M[600] = 800, M[702] = 900, M[200] = 500. What is the Effective Address (EA) if the addressing mode is (i) Direct, (ii) Relative (PC-Relative), and (iii) Indexed (with R1 as index register)?", "options": {"A": "(i) 400, (ii) 702, (iii) 600", "B": "(i) 400, (ii) 700, (iii) 600", "C": "(i) 700, (ii) 702, (iii) 800", "D": "(i) 301, (ii) 701, (iii) 200"}, "correctAnswer": "A", "explanation": "Since the 2-word instruction occupies 300 and 301, incremented PC = 302 and A = 400. (i) Direct EA = A = 400; (ii) Relative EA = PC + A = 302 + 400 = 702; (iii) Indexed EA = A + R1 = 400 + 200 = 600.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Effective Address Calculation", "subtopic": "Multi-Mode Numerical Trace", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-007", "question": "Which addressing mode facilitates dynamic 'program relocation' in multiprogramming operating systems (allowing an entire program to be moved to a new region of physical memory by updating just a single CPU register)?", "options": {"A": "Immediate addressing mode", "B": "Base-register addressing mode", "C": "Direct (Absolute) addressing mode", "D": "Implied addressing mode"}, "correctAnswer": "B", "explanation": "In Base-register addressing (`EA = Base_Register + Displacement`), instructions hold only relative displacements while the OS loads the program's starting physical address into the privileged Base Register.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Base-Register Addressing", "subtopic": "Program Relocation", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-008", "question": "Instructions such as `CMA` (Complement Accumulator), `CLC` (Clear Carry), and `RET` (Return from Subroutine) require no explicit address field because the operand location is fixed by the opcode definition. Which addressing mode do they use?", "options": {"A": "Immediate addressing mode", "B": "Implied (Implicit) addressing mode", "C": "Relative addressing mode", "D": "Direct addressing mode"}, "correctAnswer": "B", "explanation": "Implied (or Implicit) addressing mode specifies the operand implicitly in the definition of the instruction opcode itself.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Implied Addressing", "subtopic": "Implicit Operands", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-009", "question": "Register `R2` initially contains `1000`. In a byte-addressable processor where each word is 4 bytes, an instruction loads a 4-byte word using Auto-Increment mode `(R2)+`, followed by another instruction that loads a 4-byte word using Auto-Decrement mode `\u2212(R2)`. What Effective Addresses are accessed by the first and second instructions?", "options": {"A": "First EA = 1000 (then R2 becomes 1004); Second EA = 1000 (R2 decremented back to 1000 first)", "B": "First EA = 1004; Second EA = 1000", "C": "First EA = 1000; Second EA = 1004", "D": "First EA = 1001; Second EA = 999"}, "correctAnswer": "A", "explanation": "Post-Auto-Increment `(R2)+` uses current `R2 = 1000` as the EA first, then increments `R2` by word size 4 to `1004`. Pre-Auto-Decrement `\u2212(R2)` decrements `R2` by 4 first (`1004 \u2212 4 = 1000`), then uses `1000` as the EA!", "moduleCode": "G", "module": "Addressing Modes", "topic": "Auto-Increment & Auto-Decrement", "subtopic": "Pointer Stepping & Stack Push/Pop", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-010", "question": "How many memory accesses are required in total (including the 1-word instruction fetch) to execute a `LOAD` instruction that uses Memory Indirect addressing (`LOAD @X`)?", "options": {"A": "1 memory access", "B": "2 memory accesses", "C": "3 memory accesses (1 for instruction fetch, 1 to fetch effective address M[X], and 1 to fetch operand M[M[X]])", "D": "0 memory accesses"}, "correctAnswer": "C", "explanation": "Total memory references = 1 (Fetch instruction) + 2 (Indirect execution: read pointer at M[X], then read operand at M[M[X]]) = 3 memory accesses.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Memory Indirect Addressing", "subtopic": "Memory Reference Count", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-011", "question": "Match each high-level programming construct with its corresponding hardware addressing mode:\n1. Pointers (`*ptr`)                     P. Indexed addressing\n2. Array indexing (`arr[i]`)             Q. Immediate addressing\n3. Constants (`x = 50`)                  R. Register Indirect addressing\n4. Local variables on activation stack   S. Base-Pointer / Frame-Pointer Offset addressing", "options": {"A": "1-R, 2-P, 3-Q, 4-S", "B": "1-P, 2-R, 3-Q, 4-S", "C": "1-R, 2-Q, 3-P, 4-S", "D": "1-S, 2-P, 3-R, 4-Q"}, "correctAnswer": "A", "explanation": "Pointers use Register Indirect (R); Arrays use Indexed (P); Constants use Immediate (Q); Local variables in stack frames use Base/Frame-Pointer (`EBP/RBP + offset`) displacement addressing (S).", "moduleCode": "G", "module": "Addressing Modes", "topic": "Addressing Mode Applications", "subtopic": "Match Mode with High-Level Construct", "difficulty": "Moderate", "questionType": "Match-the-Following", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-012", "question": "A 16-bit branch instruction Located at word address `500` (in a word-addressable memory where each instruction is 1 word) has an 8-bit signed 2's complement offset field for PC-Relative branching. What are the lowest and highest word addresses to which this instruction can branch?", "options": {"A": "373 to 628", "B": "372 to 627", "C": "373 to 627", "D": "500 to 755"}, "correctAnswer": "A", "explanation": "Step 1: After fetching the 1-word instruction at 500, `PC_next = 500 + 1 = 501`. Step 2: An 8-bit signed 2's complement offset ranges from `\u2212128` to `+127`. Step 3: Lowest target = `501 \u2212 128 = 373`; Highest target = `501 + 127 = 628`!", "moduleCode": "G", "module": "Addressing Modes", "topic": "PC-Relative Addressing", "subtopic": "Branch Range Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-013", "question": "Which two advantages make Register Addressing (`ADD R1, R2`) the fastest addressing mode for variable operands?", "options": {"A": "It requires only a few bits (e.g., 3\u20135 bits) in the instruction to specify a register, and it requires ZERO main memory accesses during execution", "B": "It allows addressing 4 GB of RAM directly", "C": "It automatically pushes operands onto the hard disk", "D": "It requires two memory accesses"}, "correctAnswer": "A", "explanation": "Because registers reside inside the CPU core, accessing them takes 0 memory bus cycles, and k registers require only `log\u2082(k)` instruction bits.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Register Addressing", "subtopic": "Advantage of Register Addressing", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-014", "question": "In William Stallings' classification, 'Displacement Addressing' (`EA = A + (R)`) encompasses which three specific addressing modes depending on which register `R` is used?", "options": {"A": "Immediate, Direct, and Indirect", "B": "Relative (PC-Relative), Base-Register, and Indexed addressing", "C": "Stack, Implied, and Register addressing", "D": "Auto-increment, Auto-decrement, and Immediate"}, "correctAnswer": "B", "explanation": "Displacement addressing computes `EA = A + (R)`. When `R = PC`, it is Relative addressing; when `R = Base Register (BR)`, it is Base-Register addressing; when `R = Index Register (XR)`, it is Indexed addressing.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Displacement Addressing", "subtopic": "Three Variants of Displacement Mode", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-015", "question": "Given instruction address field `A = 100`, Index Register `XR = 20`, and memory c
