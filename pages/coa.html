e, Indexed, Base-Register.", "Two-Memory-Access Modes: Memory Indirect Addressing."], "diagramSvg": "<svg viewBox=\"0 0 760 200\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Direct vs. Indirect vs. Register Indirect Addressing Modes</text>\n  <rect x=\"20\" y=\"45\" width=\"225\" height=\"140\" rx=\"8\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"132\" y=\"68\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Direct Addressing (1 Mem Ref)</text>\n  <text x=\"132\" y=\"92\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Instruction: [ Opcode | 500 ]</text>\n  <text x=\"132\" y=\"118\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">EA = 500</text>\n  <text x=\"132\" y=\"145\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">Operand = M[500]</text>\n  <text x=\"132\" y=\"168\" fill=\"#94a3b8\" font-size=\"10\" text-anchor=\"middle\">(DSSSB TGT CS 12 Sep 2025 Shift 2)</text>\n\n  <rect x=\"267\" y=\"45\" width=\"225\" height=\"140\" rx=\"8\" fill=\"#1e293b\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"68\" fill=\"#fda4af\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Memory Indirect (2 Mem Refs)</text>\n  <text x=\"380\" y=\"92\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Instruction: [ Opcode | @500 ]</text>\n  <text x=\"380\" y=\"118\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">EA = M[500] = 800</text>\n  <text x=\"380\" y=\"145\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">Operand = M[M[500]] = M[800]</text>\n  <text x=\"380\" y=\"168\" fill=\"#94a3b8\" font-size=\"10\" text-anchor=\"middle\">Two sequential RAM reads</text>\n\n  <rect x=\"515\" y=\"45\" width=\"225\" height=\"140\" rx=\"8\" fill=\"#1e293b\" stroke=\"#10b981\" stroke-width=\"2\"/>\n  <text x=\"627\" y=\"68\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Register Indirect (1 Mem Ref)</text>\n  <text x=\"627\" y=\"92\" fill=\"#f8fafc\" font-size=\"11\" text-anchor=\"middle\">Instruction: [ Opcode | (R1) ]</text>\n  <text x=\"627\" y=\"118\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">EA = Contents of R1 = 800</text>\n  <text x=\"627\" y=\"145\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">Operand = M[800]</text>\n  <text x=\"627\" y=\"168\" fill=\"#94a3b8\" font-size=\"10\" text-anchor=\"middle\">(DSSSB TGT CS 7 Feb 2024 Shift 2)</text>\n</svg>", "workedExamples": [{"title": "Master Effective Address (EA) Calculation Problem", "problem": "A 2-word instruction is stored at memory address 200 and 201, with its address field at location 201 containing the value 500. Processor register R1 contains 400, and Index Register XR contains 100. Memory contents: M[500] = 800, M[600] = 900, M[702] = 350, M[400] = 700. Find the Effective Address (EA) and Operand for: (a) Direct, (b) Immediate, (c) Relative, (d) Register Indirect, (e) Indexed, (f) Indirect.", "steps": ["Step 1: Since the 2-word instruction occupies addresses 200 and 201, after Fetch the Program Counter is PC = 200 + 2 = 202. The address field is A = 500.", "Step 2: (a) Direct Addressing: EA = A = 500; Operand = M[500] = 800.", "Step 3: (b) Immediate Addressing: EA = 201 (the address field location itself); Operand = 500.", "Step 4: (c) Relative (PC-Relative) Addressing: EA = PC + A = 202 + 500 = 702; Operand = M[702] = 350.", "Step 5: (d) Register Indirect (using R1): EA = R1 = 400; Operand = M[400] = 700.", "Step 6: (e) Indexed Addressing: EA = A + XR = 500 + 100 = 600; Operand = M[600] = 900.", "Step 7: (f) Indirect Addressing: EA = M[A] = M[500] = 800; Operand = M[800]."], "answer": "(a) EA=500, Op=800; (b) Op=500; (c) EA=702, Op=350; (d) EA=400, Op=700; (e) EA=600, Op=900; (f) EA=800."}], "realWorld": "Compilers map C/C++ language constructs directly to hardware addressing modes: `#define` constants \u2192 Immediate mode; `register int i` \u2192 Register mode; static/global variables \u2192 Direct/PC-Relative mode; pointers `*p` \u2192 Register Indirect mode; array loops `*p++` \u2192 Auto-Increment mode; struct fields `p->field` \u2192 Base-Displacement mode.", "differences": "Base-Register vs. Indexed Mode: Both compute EA = Register + Address_Field, but in Indexed mode the instruction holds a full memory base address and the Index Register holds a variable offset (for arrays), whereas in Base-Register mode the Base Register holds the full base address (protected by OS for relocation) and the instruction holds a small displacement.", "formulas": ["PC-Relative EA = (Address of Current Instruction + Instruction Length) + Signed Offset", "Indexed EA = Address_Field + Index_Register (XR)", "Base-Register EA = Base_Register (BR) + Displacement"], "examTraps": ["TRAP 1: Using the current instruction's starting address instead of the incremented PC when computing PC-Relative branch targets! Always add the instruction length to PC first (`PC_next = PC_current + Length`), then add the offset.", "TRAP 2: Confusing Register Indirect (1 memory access, pointer is in a CPU register) with Memory Indirect (2 memory accesses, pointer is in main memory)."], "factsToMemorize": ["Best addressing mode for array processing: Indexed addressing mode.", "Best addressing mode for program relocation at runtime: Base-Register addressing mode.", "Best addressing mode for position-independent code and short branches: PC-Relative addressing mode.", "Best addressing mode for implementing pointers: Register Indirect addressing mode."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 2 Q74 asked which addressing mode uses the actual address of the data in the instruction (Ans: Direct addressing), and 7 Feb 2024 Shift 2 Q127 asked which mode specifies a CPU register whose contents give the operand's address in memory (Ans: Register indirect mode).", "quickRevision": "Immediate: Op=A (constants). Direct: EA=A (globals). Indirect: EA=M[A] (2 mem accesses). Register: Op=R. Register Indirect: EA=R (pointers). Auto-Inc/Dec: loops/stacks. PC-Relative: EA = PC_next + A (branches). Indexed: EA = A + XR (arrays). Base-Reg: EA = BR + A (relocation)."}, {"id": "MOD-H", "code": "H", "title": "Module H: CPU Organization and Processor Design", "shortTitle": "H. CPU Organization", "navGroup": "mod-cpu-org", "targetQuestions": 20, "subtopics": ["CPU architecture", "General register organization", "Accumulator-based, Stack-based, and General-Purpose Register (GPR) organization", "Register file & ALU organization", "Control word (14-bit Mano control word)", "Internal CPU buses & Data path", "Instruction execution", "CPU clock, Clock cycle, Clock rate, CPI, MIPS, CPU performance", "Instruction throughput & Latency", "Superscalar processor, Multicore processors, Multithreading fundamentals"], "intro": "Module H examines how the internal registers, buses, decoders, and ALU of a CPU are organized into a datapath controlled by a binary Control Word, and how processor organizations (Stack, Accumulator, Register-Memory, Register-Register) impact instruction execution.", "definitions": [{"term": "Control Word", "def": "A binary string of control variables (e.g., 14 bits `SELA | SELB | SELD | OPR` in Mano's 7-register CPU) that specifies a complete micro-operation across the register file and ALU in 1 clock cycle."}, {"term": "Superscalar Processor", "def": "A processor containing multiple parallel execution pipelines that can fetch, decode, and issue MORE THAN ONE instruction per clock cycle (`IPC > 1`, so `CPI < 1`)."}, {"term": "Simultaneous Multithreading (SMT / Hyper-Threading)", "def": "Allows multiple hardware threads to issue instructions to a superscalar processor's execution units in the same clock cycle, improving functional unit utilization."}], "explanation": "\n<h4>1. Three Classic CPU Organizations</h4>\n<ul>\n  <li><strong>1. Single Accumulator Organization:</strong> All ALU operations implicitly use the Accumulator register (e.g., <code>ADD X \u2192 AC \u2190 AC + M[X]</code>). Simple instruction format, but high memory traffic for saving intermediate results.</li>\n  <li><strong>2. General Register Organization (GPR):</strong> Uses a fast Register File (8, 16, 32, or 64 general-purpose registers). Further divided into:\n    <ul>\n      <li><em>Register-Memory (CISC, e.g., x86):</em> One operand can be in memory and one in a register.</li>\n      <li><em>Register-Register / Load-Store (RISC, e.g., ARM, MIPS, RISC-V):</em> All ALU operations take operands strictly from registers; only <code>LOAD</code> and <code>STORE</code> access memory.</li>\n    </ul>\n  </li>\n  <li><strong>3. Stack Organization:</strong> Operands are pushed/popped from a hardware or memory stack using Stack Pointer (<code>SP</code>). Arithmetic instructions are 0-address and operate on the Top two elements of the stack.</li>\n</ul>\n\n<h4>2. Mano's 14-Bit Control Word for a 7-Register CPU</h4>\n<p>In a CPU with 7 registers (<code>R1..R7</code>, plus `000` for constant/external input) connected via two <code>8 \u00d7 1</code> MUXes (`MUX A` and `MUX B`) to an ALU, and a `3 \u00d7 8` Decoder (`SELD`) to load the destination register:</p>\n<ul>\n  <li><strong>SELA (3 bits):</strong> Selects source register for ALU Input Bus A.</li>\n  <li><strong>SELB (3 bits):</strong> Selects source register for ALU Input Bus B.</li>\n  <li><strong>SELD (3 bits):</strong> Decodes destination register to receive ALU Output Bus (<code>000</code> = None, when output only goes to external bus).</li>\n  <li><strong>OPR (5 bits):</strong> Selects the ALU and Shifter operation (32 possible operations).</li>\n  <li><strong>Total Control Word Size:</strong> <code>3 + 3 + 3 + 5 = 14 bits</code>. Generally, for <code>k</code> registers and <code>m</code> ALU operations, Control Word = <code>3 \u00d7 \u2308log\u2082(k)\u2309 + \u2308log\u2082(m)\u2309</code> bits!</li>\n</ul>\n", "classifications": ["ISA Datapath Classes: Stack Architecture, Accumulator Architecture, Register-Memory Architecture, Register-Register (Load-Store) Architecture.", "Processor Issue Capabilities: Scalar (1 instruction/cycle max), Superscalar (multiple instructions/cycle dynamically scheduled), VLIW (Very Long Instruction Word \u2014 multiple operations packed by the compiler)."], "diagramSvg": "<svg viewBox=\"0 0 760 185\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">14-Bit CPU Control Word Format (R1 \u2190 R2 \u2212 R3)</text>\n  <rect x=\"60\" y=\"45\" width=\"140\" height=\"55\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"130\" y=\"68\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">SELA (3 bits)</text>\n  <text x=\"130\" y=\"88\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">010 (Selects R2)</text>\n\n  <rect x=\"210\" y=\"45\" width=\"140\" height=\"55\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"68\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">SELB (3 bits)</text>\n  <text x=\"280\" y=\"88\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">011 (Selects R3)</text>\n\n  <rect x=\"360\" y=\"45\" width=\"140\" height=\"55\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"430\" y=\"68\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">SELD (3 bits)</text>\n  <text x=\"430\" y=\"88\" fill=\"#6ee7b7\" font-size=\"11\" text-anchor=\"middle\">001 (Loads R1)</text>\n\n  <rect x=\"510\" y=\"45\" width=\"190\" height=\"55\" rx=\"6\" fill=\"#7c2d12\" stroke=\"#fb923c\" stroke-width=\"2\"/>\n  <text x=\"605\" y=\"68\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">OPR (5 bits)</text>\n  <text x=\"605\" y=\"88\" fill=\"#fdba74\" font-size=\"11\" text-anchor=\"middle\">00101 (ALU Subtract)</text>\n\n  <text x=\"380\" y=\"135\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Formula for k Registers &amp; m ALU Operations (2 Source + 1 Dest): Bits = 3\u00b7\u2308log\u2082(k)\u2309 + \u2308log\u2082(m)\u2309</text>\n  <text x=\"380\" y=\"158\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"middle\">Example: 16 Registers (4 bits each) &amp; 32 ALU ops (5 bits) \u2192 Control Word = 4 + 4 + 4 + 5 = 17 bits</text>\n</svg>", "workedExamples": [{"title": "Control Word Bit-Width Calculation", "problem": "A processor has 32 general-purpose registers and an ALU capable of performing 64 distinct operations. In a 3-register instruction datapath (2 source buses, 1 destination bus), how many bits are required in the Control Word?", "steps": ["Step 1: Bits to select Source Register A = log_2(32) = 5 bits.", "Step 2: Bits to select Source Register B = log_2(32) = 5 bits.", "Step 3: Bits to select Destination Register D = log_2(32) = 5 bits.", "Step 4: Bits to select ALU Operation = log_2(64) = 6 bits.", "Step 5: Total Control Word length = 5 + 5 + 5 + 6 = 21 bits."], "answer": "21 bits."}], "realWorld": "Hardware register files in RISC-V (32 registers `x0..x31` where `x0` is hardwired to 0) use dual read ports (controlled by `rs1` and `rs2` fields) and a single write port (`rd`) enabled by `RegWrite`.", "differences": "Register-Register (Load-Store) vs Register-Memory CPU: Load-Store CPUs restrict memory access to LOAD and STORE instructions (simplifying pipelining), whereas Register-Memory CPUs allow one arithmetic operand to come directly from memory.", "formulas": ["Control Word Length = 2 \u00d7 \u2308log\u2082(N_src_regs)\u2309 + \u2308log\u2082(N_dest_regs)\u2309 + \u2308log\u2082(N_ALU_ops)\u2309", "Clock Cycle Time (T_clk) = 1 / Clock Frequency (f)"], "examTraps": ["TRAP 1: Forgetting that in a Memory Stack where SP grows downward (toward lower addresses), `PUSH` decrements `SP` first (`SP \u2190 SP \u2212 1; M[SP] \u2190 DR`), whereas in Mano's ascending stack `PUSH` increments `SP` first (`SP \u2190 SP + 1; M[SP] \u2190 DR`). Always check whether the question specifies an ascending or descending stack!"], "factsToMemorize": ["In a 64-register hardware stack, the Stack Pointer (SP) has 6 bits (`2^6 = 64`), plus `FULL` and `EMTY` 1-bit flip-flops.", "In Mano's 14-bit Control Word, setting `SELD = 000` sends the ALU output to the external data bus without modifying any internal CPU register."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 3 Q90 and 12 Sep 2025 Shift 2 Q85 tested the internal components of the CPU (ALU, CU, Registers) and its role as the 'brain' of the computer.", "quickRevision": "3 CPU Organizations: Single Accumulator, General Register (GPR), Stack. Control Word = SELA + SELB + SELD + OPR (3*log2(k) + log2(m) bits). Superscalar achieves IPC > 1 (CPI < 1) via multiple parallel execution pipelines."}, {"id": "MOD-I", "code": "I", "title": "Module I: Control Unit Design", "shortTitle": "I. Control Unit", "navGroup": "mod-control-unit", "targetQuestions": 20, "subtopics": ["Control unit fundamentals & functions", "Hardwired control unit", "Microprogrammed control unit", "Control memory (Control ROM)", "Microinstructions, Microprograms, and Microcode", "Microprogram sequencing", "Horizontal vs Vertical microprogramming", "Microinstruction formats", "Control Address Register (CAR) & Microprogram Counter (\u00b5PC)", "Control Data/Buffer Register (CDR/CBR)", "Wilkes' Control Unit design", "RISC vs CISC control design", "Hardwired vs Microprogrammed control"], "intro": "The Control Unit (CU) generates the sequence of control signals that orchestrate micro-operations across the datapath. Module I covers Hardwired vs. Microprogrammed Control Units and Horizontal vs. Vertical Microinstruction formats\u2014including numerical calculations of microinstruction width!", "definitions": [{"term": "Hardwired Control Unit", "def": "Implements control logic using fixed combinational gates, decoders, flip-flops, and a sequence counter (state machine). Very fast (1 cycle), used in RISC CPUs, but difficult to modify."}, {"term": "Microprogrammed Control Unit", "def": "Invented by Maurice Wilkes (1951); stores control signals as binary microinstructions inside a fast read-only Control Memory (Control ROM) (verified in DSSSB TGT CS 12 Sep 2025 Shift 2 Q73)."}, {"term": "Horizontal Microprogramming", "def": "Uses unencoded control fields (1 bit per control line): wide microinstruction word, high parallelism, zero decoding delay."}, {"term": "Vertical Microprogramming", "def": "Uses encoded control fields of `\u2308log\u2082(N + 1)\u2309` bits per mutually exclusive group that are decoded by external `k \u00d7 2^k` decoders: narrow microinstruction word, requires decoder delay."}], "explanation": "\n<h4>1. Hardwired vs. Microprogrammed Control Unit</h4>\n<ul>\n  <li><strong>Hardwired Control:</strong> Inputs (IR opcode bits, Status Flags, Clock, Sequence Counter timing signals <code>T0..Tn</code>) feed directly into a combinational Boolean logic matrix that asserts control lines. Fastest execution speed; standard in RISC processors.</li>\n  <li><strong>Microprogrammed Control:</strong> Every machine instruction in <code>IR</code> maps to a <strong>microprogram routine</strong> stored in <strong>Control Memory (ROM)</strong>. The <strong>Control Address Register (CAR / \u00b5PC)</strong> holds the address of the next microinstruction, and the <strong>Control Data/Buffer Register (CDR / CBR)</strong> holds the microinstruction currently being executed (verified in <a href=\"https://www.utpaper.in/question/in-designing-a-microprogrammed-control-unit-what-is-stored-in-the-control-memory-3234\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 12 Sep 2025 Shift 2 Q73</a>). Standard in CISC processors.</li>\n</ul>\n\n<h4>2. Horizontal vs. Vertical Microinstruction Width Calculations</h4>\n<p>Suppose a CPU has <code>C</code> total control signals:</p>\n<ul>\n  <li><strong>Pure Horizontal Format:</strong> Assigns 1 dedicated bit to each of the <code>C</code> control signals \u2192 Control field = <code>C</code> bits. Maximum parallelism (any combination of signals can be asserted simultaneously).</li>\n  <li><strong>Vertical (Group-Encoded) Format:</strong> Divides signals into mutually exclusive functional groups <code>G_1, G_2, ..., G_m</code> where at most 1 signal in each group is active at a time. If group <code>G_i</code> has <code>N_i</code> signals, we must include <strong>1 extra pattern for 'No-Operation (NOP)'</strong>, so group <code>G_i</code> requires:<br/>\n  <code>Bits(G_i) = \u2308log\u2082(N_i + 1)\u2309</code> bits!</li>\n</ul>\n", "classifications": ["Control Unit Paradigms: Hardwired (Finite State Machine / PLA) vs. Microprogrammed (Control Memory ROM / Writable Control Store WCS for Dynamic Microprogramming).", "Microinstruction Encoding: Horizontal (Unencoded, Wide, Fast, High Parallelism) vs. Vertical (Encoded, Narrow, Requires External Decoders) vs. Nanoprogramming (Two-level Control Store: Micro-ROM + Nano-ROM, used in Motorola 68000)."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Microprogrammed Control Unit Organization (Wilkes Architecture)</text>\n  <rect x=\"25\" y=\"65\" width=\"140\" height=\"70\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"95\" y=\"95\" fill=\"#f8fafc\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Next-Address</text>\n  <text x=\"95\" y=\"113\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">Generator (Sequencer)</text>\n\n  <line x1=\"165\" y1=\"100\" x2=\"210\" y2=\"100\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n\n  <rect x=\"210\" y=\"65\" width=\"140\" height=\"70\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fde047\" stroke-width=\"2\"/>\n  <text x=\"280\" y=\"95\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Control Address</text>\n  <text x=\"280\" y=\"113\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">Register (CAR / \u00b5PC)</text>\n\n  <line x1=\"350\" y1=\"100\" x2=\"395\" y2=\"100\" stroke=\"#fde047\" stroke-width=\"2\"/>\n\n  <rect x=\"395\" y=\"55\" width=\"160\" height=\"90\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"475\" y=\"88\" fill=\"#ecfdf5\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Control Memory</text>\n  <text x=\"475\" y=\"106\" fill=\"#6ee7b7\" font-size=\"11\" text-anchor=\"middle\">(Control ROM)</text>\n  <text x=\"475\" y=\"124\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">Holds Microinstructions</text>\n\n  <line x1=\"555\" y1=\"100\" x2=\"595\" y2=\"100\" stroke=\"#34d399\" stroke-width=\"2\"/>\n\n  <rect x=\"595\" y=\"65\" width=\"145\" height=\"70\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <text x=\"667\" y=\"95\" fill=\"#fda4af\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Control Data Reg</text>\n  <text x=\"667\" y=\"113\" fill=\"#f8fafc\" font-size=\"10\" text-anchor=\"middle\">(CDR / Pipeline Reg)</text>\n\n  <path d=\"M 667 135 L 667 168 L 95 168 L 95 135\" fill=\"none\" stroke=\"#94a3b8\" stroke-dasharray=\"4,4\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"162\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Next Micro-Address Field Feedback (Branch / Sequential)</text>\n</svg>", "workedExamples": [{"title": "Vertical vs. Horizontal Microinstruction Width", "problem": "A processor has 40 distinct control signals. In a vertical microprogrammed design, these 40 signals are partitioned into 5 mutually exclusive groups containing 7, 15, 3, 7, and 8 signals respectively. If Control Memory has 512 words and each microinstruction includes a branch condition field (4 conditions) and a next-address field, calculate the microinstruction width for (a) Horizontal and (b) Vertical formats.", "steps": ["Step 1: Address bits for 512-word Control Memory = log_2(512) = 9 bits. Condition bits for 4 conditions = log_2(4) = 2 bits.", "Step 2: (a) Horizontal Format uses 40 unencoded control bits + 2 condition bits + 9 address bits = 51 bits.", "Step 3: (b) Vertical Format encodes each group with +1 for NOP: Group 1 (7+1=8 -> 3 bits), Group 2 (15+1=16 -> 4 bits), Group 3 (3+1=4 -> 2 bits), Group 4 (7+1=8 -> 3 bits), Group 5 (8+1=9 -> \u2308log_2(9)\u2309 = 4 bits).", "Step 4: Total encoded control bits = 3 + 4 + 2 + 3 + 4 = 16 bits. Total Vertical Microinstruction Width = 16 + 2 + 9 = 27 bits (saves 24 bits per word!)."], "answer": "(a) Horizontal = 51 bits; (b) Vertical = 27 bits."}], "realWorld": "Modern Intel/AMD x86-64 CPUs use a hybrid approach: simple/frequent instructions are decoded directly by hardwired decoders into RISC-like micro-operations (`\u00b5ops`), while complex instructions (like `CPUID`, `ENTER`, string repeats) trap into a Microcode ROM sequencer.", "differences": "Hardwired vs. Microprogrammed Control: Hardwired uses fixed logic gates (fast, inflexible, RISC), whereas Microprogrammed uses Control Memory ROM storing microinstructions (slower due to ROM access, flexible/modifiable, CISC).", "formulas": ["Encoded Group Bits = \u2308log\u2082(Number of Signals in Group + 1 for NOP)\u2309", "Control Memory Capacity = 2^(Address Bits in CAR) \u00d7 Microinstruction Width"], "examTraps": ["TRAP 1: Forgetting to add `+1` for the No-Operation (NOP) state when encoding a group of mutually exclusive control signals! If a group has 7 signals, `7 + 1 = 8`, which requires `log\u2082(8) = 3` bits; if a group has 8 signals, `8 + 1 = 9`, which requires `\u2308log\u2082(9)\u2309 = 4` bits!", "TRAP 2: Confusing Control Memory with Main Memory. Control Memory (ROM) is inside the Control Unit and holds microinstructions; Main Memory (RAM) is outside the CPU and holds user programs and data."], "factsToMemorize": ["Maurice Wilkes introduced the concept of Microprogramming in 1951.", "In a Ring Counter timing generator with `n` states (`T0..T(n-1)`), a decoder is not needed; if a `k`-bit Sequence Counter (`SC`) is used with a `k \u00d7 2^k` decoder, it generates `2^k` timing signals."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 2 Q73 directly asked: 'In designing a microprogrammed control unit, what is stored in the control memory?' (Answer: Microinstructions that define control signals).", "quickRevision": "Hardwired = Logic Gates + Flip-Flops (Fast, RISC). Microprogrammed = Control Memory ROM + CAR + CDR (Flexible, CISC). Horizontal = 1 bit/signal (wide, no decoder, high parallelism). Vertical = encoded groups ceil(log2(N+1)) bits (narrow, requires decoder)."}, {"id": "MOD-J", "code": "J", "title": "Module J: Pipelining and Performance", "shortTitle": "J. Pipelining", "navGroup": "mod-pipelining", "targetQuestions": 30, "subtopics": ["Pipeline concept: Instruction & Arithmetic pipelining", "5-stage RISC pipeline: Fetch (IF), Decode (ID), Execute (EX), Memory (MEM), Write Back (WB)", "Pipeline throughput, speedup, efficiency, and latency", "Pipeline hazards: Structural, Data (RAW, WAR, WAW), and Control (Branch) hazards", "Data forwarding / Operand forwarding (Bypassing)", "Pipeline stalls and bubbles", "Branch prediction & Delayed branching", "Pipeline scheduling, Superscalar processing, Instruction-Level Parallelism (ILP)", "Pipeline performance numerical calculations"], "intro": "Pipelining overlaps the execution of multiple instructions like an industrial assembly line. Module J has a target of 30 MCQs because pipeline execution time, speedup, CPI with stalls, and hazard classification (Structural, Data RAW/WAR/WAW, Control) are core numerical and conceptual staples in TGT/PGT CS exams.", "definitions": [{"term": "Instruction Pipelining", "def": "Decomposing instruction execution into k sequential stages separated by inter-stage pipeline registers (latches) so k instructions execute concurrently in different stages."}, {"term": "Structural Hazard", "def": "Occurs when two instructions in different pipeline stages attempt to use the same hardware resource in the same clock cycle (e.g., unified memory accessed by both IF and MEM stages)."}, {"term": "Data Hazard (RAW / WAR / WAW)", "def": "Occurs when an instruction depends on the data result of a previous instruction still in the pipeline. RAW (Read-After-Write) is a true dependency; WAR (Anti-dependency) and WAW (Output dependency) are name dependencies."}, {"term": "Control (Branch) Hazard", "def": "Occurs when a branch instruction changes the Program Counter (PC), invalidating instructions already fetched into the pipeline after the branch."}, {"term": "Operand Forwarding (Bypassing)", "def": "Hardware feedback paths that route ALU results directly from the EX/MEM or MEM/WB pipeline registers back to the ALU inputs, eliminating most RAW stalls."}], "explanation": "\n<h4>1. K-Stage Pipeline Timing & Speedup Formulas</h4>\n<p>Consider a <strong><code>k</code>-stage pipeline</strong> with clock cycle time <strong><code>\u03c4 = max(\u03c4_i) + d</code></strong> (where <code>\u03c4_i</code> is stage delay and <code>d</code> is latch delay) executing <strong><code>n</code> tasks (instructions)</strong>:</p>\n<ul>\n  <li><strong>Total Pipelined Execution Time (<code>T_pipe</code>):</strong><br/>\n    The first instruction takes <code>k</code> cycles to fill the pipeline, and the remaining <code>(n \u2212 1)</code> instructions complete at 1 instruction per cycle:<br/>\n    <strong><code>T_pipe = [k + (n \u2212 1)] \u00d7 \u03c4</code></strong></li>\n  <li><strong>Non-Pipelined Execution Time (<code>T_non-pipe</code>):</strong><br/>\n    <strong><code>T_non-pipe = n \u00d7 T_n</code></strong> (where <code>T_n = \u2211 \u03c4_i</code>, or <code>n \u00d7 k \u00d7 \u03c4</code> if stages are balanced).</li>\n  <li><strong>Pipeline Speedup (<code>S</code>):</strong><br/>\n    <strong><code>S = T_non-pipe / T_pipe = (n \u00d7 k \u00d7 \u03c4_non) / ([k + n \u2212 1] \u00d7 \u03c4_pipe)</code></strong>.<br/>\n    As <code>n \u2192 \u221e</code> (ideal balanced pipeline with zero latch overhead), <strong>Maximum Ideal Speedup <code>S_max = k</code></strong> (number of pipeline stages)!</li>\n  <li><strong>CPI with Stalls:</strong><br/>\n    In an ideal pipeline, steady-state <code>CPI_ideal = 1</code>. With stalls:<br/>\n    <strong><code>CPI_actual = 1 + Average Stalls per Instruction</code></strong>.<br/>\n    With branch frequency <code>f_b</code> and branch penalty <code>P</code> cycles: <strong><code>CPI = 1 + f_b \u00d7 P</code></strong>.</li>\n</ul>\n\n<h4>2. Detailed Hazard Analysis & Resolution</h4>\n<ul>\n  <li><strong>Structural Hazard Resolution:</strong> Duplicate hardware resources (e.g., use a Modified Harvard split L1 I-Cache and L1 D-Cache so IF and MEM never collide!).</li>\n  <li><strong>Data Hazard Types:</strong>\n    <ul>\n      <li><strong>RAW (Read After Write \u2014 True Data Dependency):</strong> <code>I1: ADD R1, R2, R3</code> followed by <code>I2: SUB R4, R1, R5</code>. <code>I2</code> reads <code>R1</code> before <code>I1</code> writes it in WB. Solved by <strong>Operand Forwarding (EX\u2192EX bypass)</strong>! Note: A <strong>Load-Use Hazard</strong> (<code>I1: LW R1, 0(R2)</code> followed immediately by <code>I2: ADD R3, R1, R4</code>) still requires <strong>1 stall cycle (bubble)</strong> even with forwarding because memory data is only available after the MEM stage!</li>\n      <li><strong>WAR (Write After Read \u2014 Anti-Dependency) &amp; WAW (Write After Write \u2014 Output Dependency):</strong> Cannot occur in a simple in-order 5-stage pipeline because all reads happen in ID and all writes happen in WB; they occur in <strong>Out-of-Order (OoO)</strong> pipelines and are completely eliminated by <strong>Register Renaming</strong> (Tomasulo's Algorithm).</li>\n    </ul>\n  </li>\n  <li><strong>Control Hazard Resolution:</strong> (1) Stall/Flush pipeline, (2) Predict Branch Not Taken / Taken (Static), (3) Dynamic Branch Prediction (1-bit/2-bit saturating counter Branch History Table + Branch Target Buffer BTB), (4) <strong>Delayed Branching</strong> (compiler fills the branch delay slot after the branch with a useful independent instruction that always executes!).</li>\n</ul>\n", "classifications": ["Pipeline Types (Handler's Classification): Arithmetic Pipeline (floating-point adder/multiplier stages) vs. Instruction Pipeline (IF, ID, EX, MEM, WB) vs. Processor Pipeline.", "Data Dependencies: True Data Dependency (RAW / Flow), Anti-Dependency (WAR), Output Dependency (WAW)."], "diagramSvg": "<svg viewBox=\"0 0 760 215\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">5-Stage RISC Pipeline Space-Time Diagram (k=5, n=4 \u2192 k+n-1 = 8 Cycles)</text>\n  <g font-size=\"11\" fill=\"#cbd5e1\" text-anchor=\"middle\">\n    <text x=\"155\" y=\"45\">CC1</text><text x=\"225\" y=\"45\">CC2</text><text x=\"295\" y=\"45\">CC3</text><text x=\"365\" y=\"45\">CC4</text>\n    <text x=\"435\" y=\"45\">CC5</text><text x=\"505\" y=\"45\">CC6</text><text x=\"575\" y=\"45\">CC7</text><text x=\"645\" y=\"45\">CC8</text>\n  </g>\n  <text x=\"65\" y=\"75\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\">Instr I1</text>\n  <rect x=\"125\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"155\" y=\"73\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">IF</text>\n  <rect x=\"195\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#581c87\" stroke=\"#c084fc\"/><text x=\"225\" y=\"73\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">ID</text>\n  <rect x=\"265\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"295\" y=\"73\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">EX</text>\n  <rect x=\"335\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"365\" y=\"73\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">MEM</text>\n  <rect x=\"405\" y=\"55\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#831843\" stroke=\"#f472b6\"/><text x=\"435\" y=\"73\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">WB</text>\n\n  <text x=\"65\" y=\"112\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\">Instr I2</text>\n  <rect x=\"195\" y=\"92\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"225\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">IF</text>\n  <rect x=\"265\" y=\"92\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#581c87\" stroke=\"#c084fc\"/><text x=\"295\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">ID</text>\n  <rect x=\"335\" y=\"92\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"365\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">EX</text>\n  <rect x=\"405\" y=\"92\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"435\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">MEM</text>\n  <rect x=\"475\" y=\"92\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#831843\" stroke=\"#f472b6\"/><text x=\"505\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">WB</text>\n\n  <text x=\"65\" y=\"149\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\">Instr I3</text>\n  <rect x=\"265\" y=\"129\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"295\" y=\"147\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">IF</text>\n  <rect x=\"335\" y=\"129\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#581c87\" stroke=\"#c084fc\"/><text x=\"365\" y=\"147\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">ID</text>\n  <rect x=\"405\" y=\"129\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"435\" y=\"147\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">EX</text>\n  <rect x=\"475\" y=\"129\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"505\" y=\"147\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">MEM</text>\n  <rect x=\"545\" y=\"129\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#831843\" stroke=\"#f472b6\"/><text x=\"575\" y=\"147\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">WB</text>\n\n  <text x=\"65\" y=\"186\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\">Instr I4</text>\n  <rect x=\"335\" y=\"166\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"365\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">IF</text>\n  <rect x=\"405\" y=\"166\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#581c87\" stroke=\"#c084fc\"/><text x=\"435\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">ID</text>\n  <rect x=\"475\" y=\"166\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"505\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">EX</text>\n  <rect x=\"545\" y=\"166\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"575\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">MEM</text>\n  <rect x=\"615\" y=\"166\" width=\"60\" height=\"28\" rx=\"4\" fill=\"#831843\" stroke=\"#f472b6\"/><text x=\"645\" y=\"184\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">WB</text>\n</svg>", "workedExamples": [{"title": "Pipeline Cycle Time, Execution Time & Speedup", "problem": "A 4-stage pipeline has stage delays of 15 ns, 20 ns, 25 ns, and 10 ns, and each inter-stage latch has a delay of 5 ns. A non-pipelined processor executes the same instruction in the sum of stage delays (70 ns). Calculate (a) the pipeline clock cycle time, (b) time to execute 100 instructions, and (c) actual speedup for 100 instructions.", "steps": ["Step 1: (a) Pipeline clock cycle time \u03c4 = max(15, 20, 25, 10) + latch_delay(5) = 25 + 5 = 30 ns.", "Step 2: (b) Total cycles for n = 100 instructions in k = 4 stages = k + n \u2212 1 = 4 + 100 \u2212 1 = 103 cycles. Time T_pipe = 103 \u00d7 30 ns = 3,090 ns.", "Step 3: (c) Non-pipelined time for 100 instructions = 100 \u00d7 70 ns = 7,000 ns. Speedup S = 7,000 / 3,090 \u2248 2.265."], "answer": "(a) \u03c4 = 30 ns; (b) T_pipe = 3,090 ns; (c) Speedup = 2.265."}, {"title": "Pipeline Speedup with Branch Penalty", "problem": "A 5-stage pipeline has a clock cycle of 1 ns. 20% of instructions are conditional branches, and 60% of conditional branches are taken, each incurring a 2-cycle stall penalty. What is the effective CPI and instruction throughput (in MIPS)?", "steps": ["Step 1: Average branch stalls per instruction = P(branch) \u00d7 P(taken) \u00d7 Penalty = 0.20 \u00d7 0.60 \u00d7 2 = 0.24 cycles.", "Step 2: Effective CPI = 1 + 0.24 = 1.24 cycles/instruction.", "Step 3: Clock Rate = 1 / 1 ns = 1 GHz = 1000 MHz. Throughput (MIPS) = Clock Rate (MHz) / CPI = 1000 / 1.24 \u2248 806.45 MIPS."], "answer": "Effective CPI = 1.24; Throughput = 806.45 MIPS."}], "realWorld": "A 2-bit saturating counter branch predictor (states: Strongly Not Taken `00`, Weakly Not Taken `01`, Weakly Taken `10`, Strongly Taken `11`) only changes its prediction when a branch misses TWICE in a row\u2014preventing a loop branch from mispredicting twice per loop execution!", "differences": "Latency vs. Throughput in Pipelining: Pipelining does NOT decrease the execution latency of a single isolated instruction (in fact, latch delays slightly increase single-instruction latency from `\u2211\u03c4_i` to `k \u00d7 \u03c4`), but it dramatically increases **Instruction Throughput** by up to `k` times!", "formulas": ["Pipeline Clock Period: \u03c4 = max(\u03c4\u2081, \u03c4\u2082, ..., \u03c4_k) + \u03c4_latch", "Total Pipeline Cycles for n instructions (no stalls): Cycles = k + n \u2212 1", "Speedup S = T_non-pipe / T_pipe ; Ideal Asymptotic Speedup (n \u2192 \u221e) = T_non-pipe / \u03c4 (or k if balanced)", "Pipeline Efficiency \u03b7 = Speedup / k ; Throughput H = n / [(k + n \u2212 1) \u00d7 \u03c4]"], "examTraps": ["TRAP 1: Claiming pipelining reduces individual instruction execution time (latency). Always remember: Pipelining increases **throughput**, NOT individual instruction latency!", "TRAP 2: Counting `k` inter-stage latches when no final output latch is specified, or forgetting that `\u03c4` is determined by the **slowest** stage (`max(\u03c4_i)`), not the average stage delay!"], "factsToMemorize": ["RAW = True dependency (solved by forwarding); WAR = Anti-dependency (solved by register renaming); WAW = Output dependency (solved by register renaming).", "A 2-bit branch predictor changes its prediction only after 2 consecutive mispredictions."], "pyqInsights": "Pipeline cycle count `k + n - 1`, slowest stage bottleneck `max(\u03c4_i)`, and identifying Structural vs Data vs Control hazards are top recurring questions across KVS, NVS, and DSSSB.", "quickRevision": "5 Stages: IF, ID, EX, MEM, WB. Clock period = max(stage_delay) + latch_delay. Cycles for n instr = k + n - 1. Pipelining improves THROUGHPUT, not single-instruction latency. Hazards: Structural (hardware conflict), Data (RAW/WAR/WAW), Control (branches)."}, {"id": "MOD-K", "code": "K", "title": "Module K: Memory Organization", "shortTitle": "K. Memory Org", "navGroup": "mod-memory-org", "targetQuestions": 25, "subtopics": ["Memory hierarchy", "Memory access time, Memory cycle time, Memory bandwidth", "Primary vs Secondary memory", "Semiconductor memory: RAM (SRAM vs DRAM)", "ROM, PROM, EPROM, EEPROM, Flash memory", "Main memory, Auxiliary memory, Associative / Content-Addressable Memory (CAM)", "Interleaved memory, Memory modules, Memory banks", "Chip expansion (Horizontal & Vertical decoding) and Memory capacity calculations"], "intro": "Memory Organization bridges register-speed storage and high-capacity secondary storage. DSSSB TGT/PGT exams consistently test memory chip expansion (`(M \u00d7 N)` target memory built from `(m \u00d7 n)` chips), address/data line counts (`2K \u00d7 16` requires 11 address lines and 16 data lines), ROM erasure methods (UV light for EPROM), and SRAM vs DRAM characteristics.", "definitions": [{"term": "SRAM (Static RAM)", "def": "Stores each bit in a bistable flip-flop latch (typically 6 CMOS transistors). Retains data as long as power is supplied (no periodic refresh needed), very fast (~1\u20135 ns), expensive, low density\u2014used for CPU Cache Memory."}, {"term": "DRAM (Dynamic RAM)", "def": "Stores each bit as electric charge on a tiny capacitor plus 1 access transistor (1T1C cell). Charge leaks within milliseconds, requiring periodic refresh cycles and destructive read restoration; high density, lower cost\u2014used for Main Memory."}, {"term": "Associative Memory (CAM)", "def": "Content-Addressable Memory accessed simultaneously in parallel by data CONTENT rather than by physical address (used in Fully Associative Cache tags and TLBs)."}, {"term": "Memory Cycle Time", "def": "The minimum time required between the start of two successive main memory accesses (`t_cycle \u2265 t_access`; in DRAM, `t_cycle = t_access + t_restore` because reads are destructive)."}], "explanation": "\n<h4>1. Address & Data Lines for a <code>2^k \u00d7 m</code> Memory Unit</h4>\n<ul>\n  <li><strong>Number of Address Lines</strong> = <code>k = log\u2082(Number of Words)</code>.</li>\n  <li><strong>Number of Data Lines (Input/Output)</strong> = <code>m = Bits per Word</code>.</li>\n  <li><em>Verified PYQ Example (<a href=\"https://www.utpaper.in/question/how-many-address-lines-and-input-output-data-lines-are-needed-in-2k-16-memory-un-3785\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 7 Aug 2021 Shift 3 Q27</a>):</em> A <code>2K \u00d7 16</code> memory has <code>2K = 2 \u00d7 2^10 = 2^11</code> words of <code>16</code> bits \u2192 <strong>11 address lines</strong> and <strong>16 I/O data lines</strong>.</li>\n</ul>\n\n<h4>2. Memory Chip Expansion Formulas (Constructing <code>M \u00d7 N</code> Memory from <code>m \u00d7 n</code> Chips)</h4>\n<ul>\n  <li><strong>Total Number of Chips Required</strong> = <code>(M / m) \u00d7 (N / n)</code>.</li>\n  <li><strong>Number of Chips per Row (Word-Width Expansion)</strong> = <code>N / n</code>.</li>\n  <li><strong>Number of Chip Rows / Banks (Address-Capacity Expansion)</strong> = <code>M / m</code>.</li>\n  <li><strong>Decoder Size Required for Chip Select (CS)</strong> = <code>k \u00d7 (M / m)</code>, where <code>k = log\u2082(M / m)</code> high-order address lines!</li>\n</ul>\n\n<h4>3. Read-Only Memory (ROM) Family</h4>\n<ul>\n  <li><strong>Mask ROM:</strong> Programmed permanently at the semiconductor factory during fabrication.</li>\n  <li><strong>PROM (Programmable ROM):</strong> One-Time Programmable (OTP) by user by blowing nichrome/polysilicon fuses.</li>\n  <li><strong>EPROM (Erasable PROM):</strong> Erased by exposing the quartz window on the chip to <strong>Ultraviolet (UV) light</strong> for 15\u201320 minutes (erases the entire chip at once) (verified in <a href=\"https://www.utpaper.in/question/select-an-appropriate-rom-type-from-the-options-where-data-can-be-erased-or-dest-3148\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 12 Sep 2025 Shift 1 Q87</a>).</li>\n  <li><strong>EEPROM (Electrically Erasable PROM):</strong> Erased electrically in-circuit <strong>byte-by-byte</strong> via Fowler-Nordheim tunneling.</li>\n  <li><strong>Flash Memory:</strong> High-density derivative of EEPROM that erases electrically <strong>block-by-block / sector-by-sector</strong> (used in SSDs, USB drives, BIOS/UEFI).</li>\n</ul>\n", "classifications": ["By Volatility: Volatile (Registers, SRAM, DRAM) vs. Non-Volatile (ROM, PROM, EPROM, EEPROM, Flash, Magnetic Disk, Optical Disk, NVRAM/FRAM/MRAM).", "By Access Method (verified in UTpaper Q4564): (1) Sequential Access (Magnetic Tape), (2) Direct Access (Magnetic Hard Disk), (3) Random Access (RAM, ROM), (4) Associative Access (CAM, TLB, Cache Tag Array)."], "diagramSvg": "<svg viewBox=\"0 0 760 205\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Memory Hierarchy Pyramid (Speed &amp; Cost/Bit vs. Capacity &amp; Access Time)</text>\n  <polygon points=\"380,35 450,65 310,65\" fill=\"#7f1d1d\" stroke=\"#f87171\"/><text x=\"380\" y=\"57\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\">CPU Registers (&lt;1 ns)</text>\n  <polygon points=\"310,68 450,68 495,98 265,98\" fill=\"#9a3412\" stroke=\"#fb923c\"/><text x=\"380\" y=\"88\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">L1 / L2 / L3 Cache (SRAM, 1\u201315 ns)</text>\n  <polygon points=\"265,101 495,101 545,135 215,135\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"380\" y=\"122\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Main Memory (DRAM, 50\u201380 ns, GBs)</text>\n  <polygon points=\"215,138 545,138 600,170 160,170\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"380\" y=\"158\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Solid-State Drive (NAND Flash SSD, 20\u2013100 \u00b5s, TBs)</text>\n  <polygon points=\"160,173 600,173 655,200 105,200\" fill=\"#334155\" stroke=\"#94a3b8\"/><text x=\"380\" y=\"191\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Magnetic Disk / Archival Tape (HDD 5\u201310 ms, Multi-TBs)</text>\n  <text x=\"70\" y=\"85\" fill=\"#fde047\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">\u25b2 Faster</text>\n  <text x=\"70\" y=\"102\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">\u25b2 Higher Cost/Bit</text>\n  <text x=\"690\" y=\"150\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">\u25bc Larger Capacity</text>\n  <text x=\"690\" y=\"167\" fill=\"#38bdf8\" font-size=\"10\" text-anchor=\"middle\">\u25bc Longer Access Time</text>\n</svg>", "workedExamples": [{"title": "Memory Chip Expansion & Decoder Size", "problem": "How many 128 \u00d7 8 RAM chips are needed to provide a memory capacity of 2048 bytes (2048 \u00d7 8)? How many address lines must be decoded for Chip Select, and what size decoder is needed?", "steps": ["Step 1: Target memory = 2048 \u00d7 8; Chip size = 128 \u00d7 8.", "Step 2: Number of chips = (2048 / 128) \u00d7 (8 / 8) = 16 \u00d7 1 = 16 chips.", "Step 3: Total address lines for 2048 words = log_2(2048) = 11 lines. Address lines connected directly to each 128-word chip = log_2(128) = 7 lines.", "Step 4: Remaining high-order address lines for Chip Select = 11 \u2212 7 = 4 lines, requiring a 4 \u00d7 16 decoder!"], "answer": "16 chips; 4 high-order address lines decoded using a 4 \u00d7 16 decoder."}], "realWorld": "Multi-channel DDR4/DDR5 RAM uses Low-Order Memory Interleaving across banks so consecutive words in a cache line burst reside in different banks and can be accessed in overlapping cycles.", "differences": "SRAM vs DRAM: SRAM uses 6T flip-flops (fast, no refresh, expensive, used in Cache), whereas DRAM uses 1T1C capacitor cells (slower, requires periodic refresh every 64 ms, dense/cheap, used in Main RAM).", "formulas": ["Number of (m \u00d7 n) chips for (M \u00d7 N) memory = (M / m) \u00d7 (N / n)", "Address lines for 2^k words = k ; Decoder for B = (M / m) banks = log\u2082(B) \u00d7 B"], "examTraps": ["TRAP 1: Forgetting whether target capacity is given in BYTES or BITS! E.g., '64 KB memory using 16K \u00d7 1-bit chips' means `(64K \u00d7 8) / (16K \u00d7 1) = 4 \u00d7 8 = 32` chips!", "TRAP 2: Confusing EPROM (erased by UV light, chip-level) with EEPROM (erased electrically, byte-level) and Flash (erased electrically, block-level)."], "factsToMemorize": ["Memory Units Descending Order (verified in DSSSB PGT CS 11 Jul 2021 Q5): Yottabyte (2^80) > Zettabyte (2^70) > Exabyte (2^60) > Petabyte (2^50) > Terabyte (2^40) > Gigabyte (2^30) > Megabyte (2^20) > Kilobyte (2^10).", "Associative Memory (CAM) with `m` words of `n` bits uses an `n`-bit Argument Register (A), `n`-bit Key/Mask Register (K), and `m`-bit Match Register (M)."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 1 Q87 tested EPROM (UV erasure), 13 Sep 2025 Shift 3 Q75 tested high-order address lines for chip select decoding, 7 Aug 2021 Shift 3 Q27 tested 2K\u00d716 address/data lines, and DSSSB PGT CS 11 Jul 2021 Q5 tested memory unit order.", "quickRevision": "2^k \u00d7 m memory -> k address lines, m data lines. Chip count = (M/m)*(N/n). High-order address lines feed Chip Select decoder. SRAM = 6T flip-flop (Cache, no refresh). DRAM = 1T1C capacitor (Main RAM, needs refresh). EPROM = UV erased; EEPROM = electrically byte-erased; Flash = electrically block-erased."}, {"id": "MOD-L", "code": "L", "title": "Module L: Cache Memory", "shortTitle": "L. Cache Memory", "navGroup": "mod-cache", "targetQuestions": 35, "subtopics": ["Cache memory fundamentals, Cache hit & miss, Hit ratio & Miss ratio", "Hit time, Miss penalty, Average Memory Access Time (AMAT)", "Cache mapping techniques: Direct, Fully associative, k-way Set-associative", "Cache address format: Tag, Index (Line/Set), Block/Word/Byte offset", "Cache replacement algorithms: FIFO, LRU, LFU, Random", "Cache write policies: Write-through, Write-back, Write allocate, No-write allocate", "Cache coherence fundamentals", "Multilevel cache (L1, L2, L3)", "Unified and Split caches"], "intro": "Cache Memory is the single highest-weightage topic in Computer Organization and Architecture (35 target MCQs). Placed between the fast CPU and slower Main Memory (DRAM), cache exploits Temporal and Spatial Locality of Reference. Every competitive CS exam tests Tag/Index/Offset bit splits, AMAT calculations, Direct/Set-Associative mapping, and Write-Through vs. Write-Back policies.", "definitions": [{"term": "Hit Ratio (h) & Miss Ratio (1 \u2212 h)", "def": "Hit Ratio h = Hits / (Hits + Misses) is the fraction of memory references found in the cache. Miss Ratio m = 1 \u2212 h."}, {"term": "Average Memory Access Time (AMAT)", "def": "AMAT = T_hit + (1 \u2212 h) \u00d7 T_miss_penalty (for sequential lookup) or h \u00d7 T_cache + (1 \u2212 h) \u00d7 T_main (when T_main includes cache check)."}, {"term": "Direct Mapping", "def": "Each main memory block j can map to ONLY ONE specific cache line: `Line = j mod N_lines`. Simple hardware (1 comparator), zero replacement policy needed, but suffers from high conflict/thrashing misses."}, {"term": "Fully Associative Mapping", "def": "Any main memory block can be placed in ANY cache line. Address has only `[ Tag | Offset ]` (Index bits = 0). Zero conflict misses, but requires N_lines parallel comparators."}, {"term": "k-Way Set-Associative Mapping", "def": "Divides N_lines into `S = N_lines / k` sets of `k` lines each. Block `j` maps to `Set = j mod S` and can occupy any of the `k` lines in that set (uses `k` comparators)."}], "explanation": "\n<h4>1. Complete Address Bit-Field Formulas (Byte-Addressable Memory)</h4>\n<p>Given Main Memory Size = <strong><code>2^m</code> bytes</strong>, Cache Size = <strong><code>C</code> bytes</strong>, Block (Line) Size = <strong><code>B = 2^b</code> bytes</strong>, and Number of Cache Lines = <strong><code>L = C / B = 2^l</code></strong>:</p>\n<ul>\n  <li><strong>Byte / Block Offset Bits (<code>b</code>):</strong> <code>b = log\u2082(B)</code> (identical across all three mapping techniques!).</li>\n  <li><strong>1. Direct Mapping:</strong>\n    <ul>\n      <li><strong>Line Index Bits (<code>l</code>):</strong> <code>l = log\u2082(L) = log\u2082(Cache Size / Block Size)</code>.</li>\n      <li><strong>Tag Bits:</strong> <code>Tag = m \u2212 l \u2212 b = log\u2082(Main Memory Size / Cache Size)</code>.</li>\n      <li><strong>Total Tag Directory Storage:</strong> <code>L \u00d7 (Tag + Valid_Bit)</code> bits.</li>\n    </ul>\n  </li>\n  <li><strong>2. Fully Associative Mapping:</strong>\n    <ul>\n      <li><strong>Index Bits:</strong> <code>0</code>.</li>\n      <li><strong>Tag Bits:</strong> <code>Tag = m \u2212 b = log\u2082(Main Memory Blocks)</code>.</li>\n    </ul>\n  </li>\n  <li><strong>3. k-Way Set-Associative Mapping (<code>k = 2^a</code>):</strong>\n    <ul>\n      <li><strong>Number of Sets (<code>S</code>):</strong> <code>S = L / k = 2^(l \u2212 a)</code>.</li>\n      <li><strong>Set Index Bits (<code>s</code>):</strong> <code>s = log\u2082(S) = l \u2212 log\u2082(k)</code>.</li>\n      <li><strong>Tag Bits:</strong> <code>Tag = m \u2212 s \u2212 b = Tag_direct + log\u2082(k)</code>.</li>\n    </ul>\n  </li>\n</ul>\n\n<h4>2. Cache Write Policies & Replacement Algorithms</h4>\n<ul>\n  <li><strong>Write-Through:</strong> Every CPU write updates BOTH the cache and main memory immediately. Memory stays consistent, no dirty bit needed, but generates high memory bus traffic (mitigated by a Write Buffer).Usually paired with <strong>No-Write-Allocate (Write-Around)</strong> on a write miss.</li>\n  <li><strong>Write-Back (Copy-Back):</strong> CPU writes update ONLY the cache line and set a <strong>1-bit Dirty (Modified) status bit</strong>. Main memory is updated ONLY when the dirty block is evicted/replaced. Minimizes memory bus traffic; usually paired with <strong>Write-Allocate (Fetch-on-Write)</strong> on a write miss.</li>\n  <li><strong>Replacement Algorithms (for Associative &amp; Set-Associative):</strong> <strong>LRU (Least Recently Used)</strong> replaces the block unused for the longest time (best hit rate due to temporal locality; requires <code>log\u2082(k)</code> counter bits per line in a k-way set); <strong>FIFO</strong> replaces the oldest loaded block; <strong>LFU</strong> replaces the block with the fewest references; <strong>Random</strong> picks a line at random.</li>\n</ul>\n", "classifications": ["Cache Misses (The 3 Cs \u2014 Hill's Taxonomy): (1) Compulsory / Cold-Start Misses (first access to a block; reduced by larger block size), (2) Capacity Misses (cache is too small to hold working set; reduced by larger cache size), (3) Conflict / Collision Misses (multiple blocks map to the same line/set; reduced by higher associativity k).", "Multilevel Cache Hierarchy: L1 Cache (Smallest, 32\u201364 KB, Split I-Cache & D-Cache, ~1\u20132 ns, optimized for lowest Hit Time), L2 Cache (256 KB\u20132 MB per core, ~4\u20138 ns), L3 Cache / LLC (Shared across all cores, 8\u201364 MB, ~15\u201330 ns, optimized for lowest Miss Rate)."], "diagramSvg": "<svg viewBox=\"0 0 760 215\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Physical Address Bit Splitting Across the 3 Cache Mapping Techniques (m-bit Address)</text>\n  <text x=\"90\" y=\"58\" fill=\"#93c5fd\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Direct Mapping</text>\n  <rect x=\"175\" y=\"40\" width=\"200\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"275\" y=\"60\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Tag (m \u2212 l \u2212 b bits)</text>\n  <rect x=\"375\" y=\"40\" width=\"180\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"465\" y=\"60\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Line Index (l = log\u2082L bits)</text>\n  <rect x=\"555\" y=\"40\" width=\"175\" height=\"32\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"642\" y=\"60\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Block Offset (b = log\u2082B)</text>\n\n  <text x=\"90\" y=\"108\" fill=\"#34d399\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">k-Way Set-Assoc</text>\n  <rect x=\"175\" y=\"90\" width=\"245\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"297\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Tag (m \u2212 s \u2212 b bits)</text>\n  <rect x=\"420\" y=\"90\" width=\"135\" height=\"32\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"487\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Set Index (s = log\u2082S)</text>\n  <rect x=\"555\" y=\"90\" width=\"175\" height=\"32\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"642\" y=\"110\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Block Offset (b = log\u2082B)</text>\n\n  <text x=\"90\" y=\"158\" fill=\"#f472b6\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Fully Associative</text>\n  <rect x=\"175\" y=\"140\" width=\"380\" height=\"32\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"365\" y=\"160\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Tag (m \u2212 b bits, No Index Field!)</text>\n  <rect x=\"555\" y=\"140\" width=\"175\" height=\"32\" fill=\"#7c2d12\" stroke=\"#fb923c\"/><text x=\"642\" y=\"160\" fill=\"#fff\" font-size=\"11\" text-anchor=\"middle\">Block Offset (b = log\u2082B)</text>\n\n  <text x=\"380\" y=\"196\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">Rule: Moving from Direct \u2192 k-Way Set-Associative increases Tag by log\u2082(k) bits and decreases Index by log\u2082(k) bits!</text>\n</svg>", "workedExamples": [{"title": "Tag, Index, and Offset Bits for Direct, 4-Way, and Fully Associative Cache", "problem": "A computer has 64 MB (2^26 bytes) of byte-addressable main memory and a 64 KB (2^16 bytes) cache with a block size of 32 bytes (2^5 bytes). Find the (Tag, Index, Offset) bit sizes for: (a) Direct Mapping, (b) 4-Way Set-Associative Mapping, and (c) Fully Associative Mapping.", "steps": ["Step 1: Main Memory Address = m = 26 bits. Block Offset b = log_2(32) = 5 bits. Total Cache Lines L = 2^16 / 2^5 = 2^11 = 2048 lines.", "Step 2: (a) Direct Mapping: Line Index l = log_2(2^11) = 11 bits; Tag = 26 \u2212 11 \u2212 5 = 10 bits -> (10, 11, 5).", "Step 3: (b) 4-Way Set-Associative (k = 4 = 2^2): Number of Sets S = 2^11 / 2^2 = 2^9 = 512 sets -> Set Index s = 9 bits; Tag = 26 \u2212 9 \u2212 5 = 12 bits -> (12, 9, 5).", "Step 4: (c) Fully Associative: Index = 0 bits; Tag = 26 \u2212 5 = 21 bits -> (21, 0, 5)."], "answer": "(a) Direct: (10, 11, 5); (b) 4-Way Set-Assoc: (12, 9, 5); (c) Fully Assoc: (21, 0, 5)."}, {"title": "Two-Level (L1 + L2) Cache AMAT Calculation", "problem": "A processor has an L1 cache with hit time 2 ns and hit ratio 90%, an L2 cache with access time 10 ns and local hit ratio 80%, and main memory with access penalty 100 ns. Calculate the Average Memory Access Time (AMAT).", "steps": ["Step 1: Use multilevel formula: AMAT = T_L1 + (1 \u2212 h_L1) \u00d7 [T_L2 + (1 \u2212 h_L2) \u00d7 T_Mem].", "Step 2: Substitute values: AMAT = 2 + (1 \u2212 0.90) \u00d7 [10 + (1 \u2212 0.80) \u00d7 100].", "Step 3: AMAT = 2 + 0.10 \u00d7 [10 + 0.20 \u00d7 100] = 2 + 0.10 \u00d7 [10 + 20] = 2 + 3 = 5 ns."], "answer": "AMAT = 5 ns."}], "realWorld": "An Intel Core i9 has a 32 KB 8-way set-associative L1 Data Cache, 48 KB 12-way L1 Instruction Cache, 2 MB 16-way L2 Cache per core, and 36 MB shared L3 cache using Write-Back with MESIF cache coherence.", "differences": "Write-Through vs. Write-Back: Write-Through writes to both Cache and RAM on every store (no dirty bit, high bus traffic), while Write-Back writes only to Cache and sets a Dirty Bit, writing to RAM only upon block eviction (low bus traffic).", "formulas": ["AMAT (1-Level) = T_hit + Miss_Rate \u00d7 Miss_Penalty (or h\u00b7T_c + (1\u2212h)\u00b7(T_c + T_m) for sequential access)", "AMAT (2-Level) = T_L1 + Miss_Rate_L1 \u00d7 (T_L2 + Miss_Rate_L2 \u00d7 Miss_Penalty_Mem)", "Direct Mapping: Tag = log\u2082(M / C), Index = log\u2082(C / B), Offset = log\u2082(B)", "k-Way Set-Associative: Sets S = (C / B) / k, Set Index = log\u2082(S), Tag = m \u2212 Set_Index \u2212 Offset"], "examTraps": ["TRAP 1: Not checking whether the problem states Simultaneous/Parallel Cache+RAM access (`AMAT = h\u00b7T_c + (1\u2212h)\u00b7T_m`) vs. Sequential/Hierarchical access (`AMAT = T_c + (1\u2212h)\u00b7T_m`). Always read whether `T_m` is the 'Miss Penalty' (extra time after miss) or total time!", "TRAP 2: Forgetting that Write-Back requires 1 extra Dirty Bit per cache line in the tag directory (`Tag_Directory_Bits = L \u00d7 (Tag_Bits + 1 Valid_Bit + 1 Dirty_Bit)`)."], "factsToMemorize": ["1-Way Set-Associative mapping is identical to Direct Mapping; N-Way Set-Associative mapping (where N = total lines) is identical to Fully Associative Mapping!", "Split L1 Cache (separate I-Cache and D-Cache) eliminates structural hazards in pipelined CPUs."], "pyqInsights": "KVS PGT CS, NVS PGT CS, and DSSSB TGT CS 2023/2025 all tested cache placement (SRAM between CPU and RAM), hit ratio / AMAT, associative mapping, and cache miss vs page fault.", "quickRevision": "Cache = fast SRAM between CPU & RAM. Locality: Temporal (reuse soon) & Spatial (nearby addresses). Direct: Line = Block mod L. k-Way: Set = Block mod S. Fully Assoc: Any line (Index=0). Write-Through (updates RAM immediately) vs Write-Back (uses Dirty Bit, updates RAM on eviction)."}, {"id": "MOD-M", "code": "M", "title": "Module M: Virtual Memory", "shortTitle": "M. Virtual Memory", "navGroup": "mod-virtual-mem", "targetQuestions": 25, "subtopics": ["Virtual memory fundamentals (Purpose tested in DSSSB TGT CS 12 Sep 2025 Shift 1 Q65)", "Logical (Virtual) address vs Physical address & MMU Address translation", "Paging: Page, Frame, Page Table, Page Table Entry (PTE), Page Offset", "Page fault & Page replacement (FIFO, Optimal, LRU, Belady's Anomaly)", "Translation Lookaside Buffer (TLB) & Effective Access Time (EAT)", "Multilevel (Hierarchical) and Inverted Page Tables", "Segmentation & Paging vs Segmentation", "Memory protection", "Demand paging, Thrashing, Locality of reference, Working Set model"], "intro": "Virtual Memory decouples the logical address space seen by a process from the physical RAM installed on the machine, allowing programs larger than physical RAM to execute by keeping only active pages in RAM and storing the rest on disk (verified in DSSSB TGT CS 12 Sep 2025 Shift 1 Q65).", "definitions": [{"term": "Logical (Virtual) Address", "def": "An address generated by the CPU during program execution, consisting of `[ Page Number (p) | Page Offset (d) ]`."}, {"term": "Physical Address", "def": "The actual address placed on the main memory (RAM) address bus after MMU translation, consisting of `[ Frame Number (f) | Page Offset (d) ]`."}, {"term": "Page & Frame", "def": "Virtual address space is divided into fixed-size blocks called Pages; Physical RAM is divided into fixed-size blocks of the EXACT SAME SIZE called Frames (`Page Size = Frame Size`, verified in DSSSB PGT CS 11 Jul 2021 Q29)."}, {"term": "Translation Lookaside Buffer (TLB)", "def": "A small, ultra-fast hardware associative cache inside the MMU that caches recent `Virtual Page Number \u2192 Physical Frame Number` translations."}, {"term": "Page Fault", "def": "A synchronous hardware trap raised by the MMU when a referenced page's Valid/Present bit in the Page Table Entry is `0` (page is not currently in RAM) (verified in DSSSB TGT CS 24 Jun 2023 Shift 3 Q118)."}, {"term": "Thrashing", "def": "A pathological state where a system spends more time paging (swapping pages between RAM and disk) than executing CPU instructions because total working set exceeds physical frames."}], "explanation": "\n<h4>1. Paging Address Translation Mathematics</h4>\n<p>Given Virtual Address Space = <strong><code>2^v</code> bytes</strong>, Physical Address Space = <strong><code>2^p</code> bytes</strong>, and Page Size = Frame Size = <strong><code>2^d</code> bytes</strong>:</p>\n<ul>\n  <li><strong>Page Offset Bits (<code>d</code>):</strong> <code>d = log\u2082(Page Size)</code> (remains UNCHANGED during translation from virtual to physical address!).</li>\n  <li><strong>Number of Virtual Pages:</strong> <code>N_pages = 2^(v \u2212 d)</code> \u2192 Virtual Page Number uses <code>(v \u2212 d)</code> bits.</li>\n  <li><strong>Number of Physical Frames:</strong> <code>N_frames = 2^(p \u2212 d)</code> \u2192 Physical Frame Number uses <code>(p \u2212 d)</code> bits.</li>\n  <li><strong>Single-Level Page Table Size:</strong> <code>N_pages \u00d7 PTE_Size = 2^(v \u2212 d) \u00d7 PTE_Size</code> bytes (one Page Table per process!).</li>\n  <li><strong>Inverted Page Table:</strong> Has exactly <strong>1 entry per Physical Frame (`N_frames` entries total for the entire system)</strong>, indexed by Frame Number and storing `(PID, Virtual Page Number)`. Saves massive RAM in 64-bit systems!</li>\n</ul>\n\n<h4>2. Effective Access Time (EAT) with TLB and Page Faults</h4>\n<ul>\n  <li><strong>With TLB Hit Ratio <code>\u03b1</code>, TLB Access Time <code>t_TLB</code>, and Main Memory Access Time <code>t_m</code> (1-level page table, no page faults):</strong>\n    <ul>\n      <li>On a <strong>TLB Hit (fraction <code>\u03b1</code>):</strong> 1 TLB lookup + 1 RAM operand access = <code>t_TLB + t_m</code>.</li>\n      <li>On a <strong>TLB Miss (fraction <code>1 \u2212 \u03b1</code>):</strong> 1 TLB lookup + 1 RAM Page Table lookup + 1 RAM operand access = <code>t_TLB + 2 \u00d7 t_m</code>.</li>\n      <li><strong><code>EAT = \u03b1(t_TLB + t_m) + (1 \u2212 \u03b1)(t_TLB + 2t_m) = t_TLB + (2 \u2212 \u03b1)t_m</code></strong>.</li>\n    </ul>\n  </li>\n  <li><strong>With Demand Paging Page Fault Rate <code>p</code> and Page Fault Service Time <code>S_pf</code>:</strong><br/>\n    <strong><code>EAT = (1 \u2212 p) \u00d7 t_m + p \u00d7 S_pf</code></strong>.</li>\n</ul>\n", "classifications": ["Page Replacement Algorithms: FIFO (suffers from Belady's Anomaly), Optimal / MIN (Belady's algorithm \u2014 replaces page not needed for longest future time; lowest fault rate, non-implementable benchmark), LRU (stack algorithm \u2014 immune to Belady's Anomaly), Clock / Second-Chance (uses 1 Reference Bit).", "Memory Management Schemes: Contiguous (Fixed/Variable Partitioning) vs. Non-Contiguous (Paging: fixed size, internal fragmentation in last page only; Segmentation: variable logical segments, external fragmentation; Segmented Paging)."], "diagramSvg": "<svg viewBox=\"0 0 760 205\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Virtual Memory Paging &amp; TLB Address Translation</text>\n  <rect x=\"20\" y=\"45\" width=\"210\" height=\"45\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"125\" y=\"64\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Virtual Address (CPU)</text>\n  <text x=\"125\" y=\"81\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">[ Page p (v\u2212d) | Offset d ]</text>\n\n  <line x1=\"230\" y1=\"67\" x2=\"290\" y2=\"67\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n\n  <rect x=\"290\" y=\"40\" width=\"180\" height=\"55\" rx=\"6\" fill=\"#581c87\" stroke=\"#c084fc\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"62\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">TLB (Associative Cache)</text>\n  <text x=\"380\" y=\"80\" fill=\"#e9d5ff\" font-size=\"10\" text-anchor=\"middle\">Hit (\u03b1): t_TLB + t_m</text>\n\n  <line x1=\"380\" y1=\"95\" x2=\"380\" y2=\"128\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <text x=\"435\" y=\"116\" fill=\"#fda4af\" font-size=\"10\" text-anchor=\"middle\">TLB Miss (1\u2212\u03b1)</text>\n\n  <rect x=\"290\" y=\"128\" width=\"180\" height=\"58\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"150\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Page Table in RAM</text>\n  <text x=\"380\" y=\"168\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">Valid=1 \u2192 Frame f | Valid=0 \u2192 Trap</text>\n\n  <line x1=\"470\" y1=\"67\" x2=\"535\" y2=\"95\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <line x1=\"470\" y1=\"155\" x2=\"535\" y2=\"115\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n\n  <rect x=\"535\" y=\"80\" width=\"205\" height=\"50\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"637\" y=\"101\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Physical Address (RAM)</text>\n  <text x=\"637\" y=\"119\" fill=\"#6ee7b7\" font-size=\"11\" text-anchor=\"middle\">[ Frame f (p\u2212d) | Offset d ]</text>\n</svg>", "workedExamples": [{"title": "Effective Access Time (EAT) with TLB", "problem": "A paging system has a TLB lookup time of 10 ns, main memory access time of 100 ns, and a TLB hit ratio of 85%. Assuming a single-level page table in main memory and zero page faults, calculate the Effective Access Time (EAT).", "steps": ["Step 1: On TLB Hit (0.85): Time = t_TLB + t_m = 10 + 100 = 110 ns.", "Step 2: On TLB Miss (0.15): Time = t_TLB + 2 \u00d7 t_m = 10 + 200 = 210 ns.", "Step 3: EAT = 0.85 \u00d7 110 + 0.15 \u00d7 210 = 93.5 + 31.5 = 125 ns."], "answer": "EAT = 125 ns."}, {"title": "Virtual-to-Physical Address Translation", "problem": "A system uses 16-bit logical addresses, 4 KB (4096 bytes) pages, and 32 KB physical memory. If Page Table maps Page 0\u2192Frame 5, Page 1\u2192Frame 2, Page 2\u2192Frame 7, Page 3\u2192Frame 1, what is the physical address corresponding to logical address 9000 (decimal)?", "steps": ["Step 1: Page Size = 4096 bytes. Divide logical address 9000 by 4096:", "Step 2: Page Number p = \u230a9000 / 4096\u230b = 2; Page Offset d = 9000 mod 4096 = 9000 \u2212 8192 = 808.", "Step 3: Look up Page 2 in Page Table -> Frame f = 7.", "Step 4: Physical Address = f \u00d7 4096 + d = 7 \u00d7 4096 + 808 = 28,672 + 808 = 29,480."], "answer": "Physical Address = 29,480 (Page 2 -> Frame 7, Offset 808)."}], "realWorld": "x86-64 CPUs use 48-bit virtual addresses with 4-level paging (`PML4 \u2192 PDPT \u2192 PD \u2192 PT`) and 4 KB standard pages (or 2 MB / 1 GB Huge Pages to reduce TLB misses).", "differences": "Paging vs. Segmentation: Paging divides memory into fixed-size hardware pages invisible to the programmer (suffers only from internal fragmentation in the last page), whereas Segmentation divides programs into variable-length logical units visible to the programmer (`Code`, `Data`, `Stack` via `[Segment s | Offset d]`, suffering from external fragmentation).", "formulas": ["Page Number p = \u230aLogical Address / Page Size\u230b ; Offset d = Logical Address mod Page Size", "Physical Address = (Frame Number f \u00d7 Page Size) + Offset d", "EAT (k-level page table, sequential TLB): EAT = \u03b1(t_TLB + t_m) + (1 \u2212 \u03b1)(t_TLB + (k + 1)t_m)"], "examTraps": ["TRAP 1: Thinking Paging suffers from External Fragmentation! Paging has **ZERO external fragmentation** (only up to `Page_Size \u2212 1` bytes of internal fragmentation in the final page of a process).", "TRAP 2: Forgetting that with a `k`-level hierarchical page table, a TLB miss requires `k` page table accesses in RAM PLUS `1` access for the actual operand = `k + 1` RAM accesses!"], "factsToMemorize": ["Main purpose of Virtual Memory: To extend apparent physical memory using secondary disk storage so programs larger than RAM can run (verified DSSSB TGT CS 12 Sep 2025 Shift 1 Q65).", "Page Size is ALWAYS equal to Frame Size (verified DSSSB PGT CS 11 Jul 2021 Q29).", "Denning's Working Set Model (`W(t, \u0394)`) prevents thrashing by tracking the set of unique pages referenced in the last `\u0394` memory references."], "pyqInsights": "DSSSB TGT CS 12 Sep 2025 Shift 1 Q65 tested the main purpose of virtual memory; 24 Jun 2023 Shift 3 Q118 tested page fault meaning; 1 Aug 2021 Shift 1 & 3 and DSSSB PGT CS 11 Jul 2021 Q23 tested page replacement frame traces.", "quickRevision": "Virtual Addr = (Page p, Offset d) -> Physical Addr = (Frame f, Offset d). Page Size == Frame Size. Paging = fixed-size, internal fragmentation only. Segmentation = variable-size logical units, external fragmentation. TLB = associative MMU cache; EAT = t_TLB + (2 - alpha)*t_m (for 1-level PT)."}, {"id": "MOD-N", "code": "N", "title": "Module N: Input/Output Organization", "shortTitle": "N. I/O Organization", "navGroup": "mod-io-org", "targetQuestions": 25, "subtopics": ["I/O interface & I/O modules", "Peripheral devices & I/O controllers", "Programmed I/O (Polling / Busy waiting)", "Interrupt-driven I/O", "Direct Memory Access (DMA) & DMA controller", "DMA transfer modes: Burst mode vs Cycle stealing vs Transparent mode", "I/O channels and I/O processors (IOP)", "Memory-mapped I/O vs Isolated (I/O-mapped) I/O", "Synchronous vs Asynchronous data transfer (Strobe & Handshaking)"], "intro": "Module N covers how the CPU communicates with slower electromechanical or electronic peripherals via I/O Interfaces, how address spaces are mapped (Memory-Mapped vs. Isolated I/O), and the three fundamental data transfer modes: Programmed I/O, Interrupt-Driven I/O, and Direct Memory Access (DMA).", "definitions": [{"term": "I/O Interface Unit", "def": "Hardware circuitry sitting between the CPU system bus and peripheral devices that resolves differences in operating speed, signal levels, data codes/formats, and synchronization (verified in DSSSB PGT CS 11 Jul 2021 Q2)."}, {"term": "Programmed I/O", "def": "Data transfer controlled entirely by CPU software instructions; the CPU stays in a busy-wait polling loop repeatedly reading the device Status Register until the Ready flag is set."}, {"term": "Interrupt-Driven I/O", "def": "The CPU issues an I/O command and continues executing other work; when the peripheral is ready, it asserts an Interrupt Request (INTR) line to the CPU."}, {"term": "Direct Memory Access (DMA)", "def": "High-speed I/O technique where a dedicated DMA Controller takes control of the memory bus (`Bus Request BR` \u2192 `Bus Grant BG = 1`) and transfers data blocks directly between I/O devices and Main Memory without involving the CPU for each word (verified in KVS PGT CS and DSSSB TGT CS 7 Feb 2024 Shift 2 Q138)."}], "explanation": "\n<h4>1. Four I/O Interface Commands (Verified DSSSB PGT CS 11 Jul 2021 Q3)</h4>\n<ol>\n  <li><strong>Control Command:</strong> Activates the peripheral and tells it what action to take (e.g., rewind tape, seek track).</li>\n  <li><strong>Status Command:</strong> Tests various status conditions in the interface and peripheral (e.g., Busy, Ready, Error).</li>\n  <li><strong>Data Output Command:</strong> Causes the interface to latch data from the CPU data bus and transmit it to the peripheral.</li>\n  <li><strong>Data Input Command:</strong> Opposite of data output; the interface receives an item of data from the peripheral and places it into its buffer register so the CPU can read it onto the data bus (<a href=\"https://www.utpaper.in/question/what-is-the-function-of-data-input-command-in-i-o-command-3953\" target=\"_blank\" rel=\"noopener\">DSSSB PGT CS 11 Jul 2021 Q3</a>).</li>\n</ol>\n\n<h4>2. Memory-Mapped I/O vs. Isolated (Port-Mapped) I/O</h4>\n<ul>\n  <li><strong>Memory-Mapped I/O:</strong> Memory locations and I/O device registers share a <strong>single common address space</strong>. Uses standard memory instructions (`LOAD`, `STORE`, `ADD`) and only two control lines (`Memory Read`, `Memory Write`), but reduces available RAM address space (verified in <a href=\"https://www.utpaper.in/question/what-is-the-primary-role-of-the-memory-mapped-i-o-technique-in-a-microcontroller-893\" target=\"_blank\" rel=\"noopener\">UTpaper Q893</a>).</li>\n  <li><strong>Isolated I/O (I/O-Mapped I/O):</strong> Uses a <strong>separate I/O address space</strong> from memory, requiring dedicated instructions (`IN`, `OUT`) and separate control lines (`I/O Read`, `I/O Write` vs `Mem Read`, `Mem Write`). Full memory address space remains available for RAM.</li>\n</ul>\n\n<h4>3. Direct Memory Access (DMA) Controller & Transfer Modes</h4>\n<ul>\n  <li><strong>Three Internal Registers of a DMA Controller:</strong> (1) <strong>Address Register</strong> (holds starting RAM address, increments after each transfer), (2) <strong>Word Count Register</strong> (holds number of words remaining, decrements after each transfer), (3) <strong>Control / Status Register</strong>.</li>\n  <li><strong>Bus Request (BR) &amp; Bus Grant (BG) Handshake (Verified <a href=\"https://www.utpaper.in/question/when-bus-grant-bg-1-in-direct-memory-access-dma-transfer-then-what-function-read-3954\" target=\"_blank\" rel=\"noopener\">DSSSB PGT CS 11 Jul 2021 Q4</a>):</strong>\n    <ul>\n      <li>When <strong><code>BG = 0</code></strong>: The CPU is bus master; the DMA controller's <code>Read</code> and <code>Write</code> lines act as <strong>inputs</strong> so the CPU can initialize the DMA registers.</li>\n      <li>When <strong><code>BG = 1</code></strong>: The CPU tri-states (high-impedance) its address, data, and read/write lines; the DMA controller becomes bus master, and its <strong><code>Read</code> and <code>Write</code> lines act as OUTPUT lines</strong> to drive main memory!</li>\n    </ul>\n  </li>\n  <li><strong>DMA Transfer Modes:</strong>\n    <ul>\n      <li><strong>Burst Mode (Block Transfer):</strong> DMA controller holds the system bus continuously until an entire block of words is transferred (fastest for high-speed magnetic disks; verified in <a href=\"https://www.utpaper.in/question/in-direct-memory-access-dma-a-block-sequence-consisting-of-a-number-of-memory-wo-2032\" target=\"_blank\" rel=\"noopener\">DSSSB TGT CS 7 Feb 2024 Shift 2 Q138</a>).</li>\n      <li><strong>Cycle Stealing:</strong> DMA controller steals <strong>one memory cycle at a time</strong> to transfer a single word, then immediately returns bus control to the CPU.</li>\n      <li><strong>Transparent (Hidden) DMA:</strong> DMA transfers data only when the CPU is performing internal register/cache operations and is not using the system bus (zero CPU slowdown).</li>\n    </ul>\n  </li>\n</ul>\n", "classifications": ["Data Transfer Modes: (1) Programmed I/O (CPU busy-waits), (2) Interrupt-Initiated I/O (CPU interrupted per word/byte), (3) DMA (Hardware controller transfers blocks directly to RAM), (4) I/O Processor / Channel (IOP executes its own I/O channel programs in memory).", "Asynchronous Transfer Synchronization: Single-Control Strobe Method vs. Two-Control Handshaking Method (`Data Valid` + `Data Accepted` \u2014 highest reliability)."], "diagramSvg": "<svg viewBox=\"0 0 760 195\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Direct Memory Access (DMA) Bus Handshake (BR / BG Signals)</text>\n  <rect x=\"30\" y=\"55\" width=\"170\" height=\"110\" rx=\"8\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"115\" y=\"85\" fill=\"#f8fafc\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">CPU</text>\n  <text x=\"115\" y=\"108\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">When BG = 1:</text>\n  <text x=\"115\" y=\"125\" fill=\"#fda4af\" font-size=\"10\" text-anchor=\"middle\">Buses go High-Impedance</text>\n  <text x=\"115\" y=\"145\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">(CPU runs from Cache/Regs)</text>\n\n  <line x1=\"200\" y1=\"85\" x2=\"310\" y2=\"85\" stroke=\"#fde047\" stroke-width=\"2\"/>\n  <text x=\"255\" y=\"77\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">\u25c4 Bus Request (BR)</text>\n  <line x1=\"200\" y1=\"120\" x2=\"310\" y2=\"120\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"255\" y=\"112\" fill=\"#34d399\" font-size=\"10\" text-anchor=\"middle\">Bus Grant (BG=1) \u25ba</text>\n\n  <rect x=\"310\" y=\"50\" wi
