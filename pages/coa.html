 of active Working Sets exceeds total physical frames `\u2211 WSS_i > M`), what should the Operating System's Medium-Term Scheduler do?", "options": {"A": "Increase the degree of multiprogramming by starting more processes", "B": "Decrease the degree of multiprogramming by suspending/swapping out one or more processes so the remaining processes receive enough frames to hold their Working Sets", "C": "Replace the CPU with a faster clock", "D": "Reduce the size of the TLB"}, "correctAnswer": "B", "explanation": "During thrashing, the CPU is idle waiting for disk I/O. Increasing multiprogramming makes thrashing worse! The OS must reduce the degree of multiprogramming (or use Working Set / Page-Fault Frequency allocation) so each active process has enough frames.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Thrashing", "subtopic": "Cause and Cure of Thrashing", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-018", "question": "In a Page Table Entry (PTE), what are the distinct roles of the 'Reference (Accessed) Bit' and the 'Dirty (Modified) Bit'?", "options": {"A": "The Reference Bit is set by hardware on any Read or Write to approximate LRU (Clock algorithm); the Dirty Bit is set by hardware only on a Write so the OS knows whether an evicted page must be written back to swap space on disk", "B": "Both bits are set only when a Page Fault occurs", "C": "The Reference Bit indicates kernel mode", "D": "The Dirty Bit indicates a parity error"}, "correctAnswer": "A", "explanation": "The Clock (Second-Chance) page replacement algorithm scans the Reference Bit (`R`), while the Dirty Bit (`M`) avoids unnecessary disk writes when evicting clean pages.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Table Entry (PTE)", "subtopic": "Reference Bit vs Dirty Bit in PTE", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-019", "question": "Why do modern TLBs tag each entry with an 8-to-16-bit 'ASID' (Address Space Identifier / Process ID) alongside the Virtual Page Number?", "options": {"A": "So the OS does NOT have to flush the entire TLB on every process context switch!", "B": "To encrypt main memory", "C": "To replace the Page Offset", "D": "To double the page size"}, "correctAnswer": "A", "explanation": "Without ASIDs, switching from Process A to Process B requires flushing the entire TLB (causing cold-start TLB misses) because both processes use the same virtual page numbers (`0, 1, 2...`). Tagging TLB entries with `ASID` lets entries from multiple processes coexist safely.", "moduleCode": "M", "module": "Virtual Memory", "topic": "TLB Management", "subtopic": "ASID (Address Space Identifier) in TLB", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-020", "question": "How does choosing a LARGER Page Size (e.g., 2 MB Huge Pages instead of 4 KB standard pages) affect (i) Page Table size, (ii) TLB reach/hit rate, and (iii) Internal Fragmentation?", "options": {"A": "(i) Decreases Page Table size, (ii) Increases TLB reach and TLB hit rate, (iii) Increases Internal Fragmentation", "B": "(i) Increases Page Table size, (ii) Decreases TLB hit rate, (iii) Decreases Internal Fragmentation", "C": "All three decrease", "D": "All three increase"}, "correctAnswer": "A", "explanation": "Larger pages mean fewer total pages (smaller Page Table, each TLB entry covers 2 MB instead of 4 KB \u2192 much higher TLB hit rate), at the cost of more wasted space in the last page of small allocations (higher internal fragmentation).", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Size Trade-Off", "subtopic": "Small vs Large Page Size", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-021", "question": "For a 3-frame memory (initially empty) and the page reference string `7, 0, 1, 2, 0, 3, 0, 4, 2, 3`, how many Page Faults occur under Belady's Optimal (MIN) page replacement policy?", "options": {"A": "5 page faults", "B": "6 page faults", "C": "7 page faults", "D": "8 page faults"}, "correctAnswer": "B", "explanation": "Trace Optimal in 3 frames: `7`(F:[7]), `0`(F:[7,0]), `1`(F:[7,0,1]), `2`(F, replaces 7 since 0 & 1 are used sooner:[2,0,1]), `0`(Hit), `3`(F, replaces 1:[2,0,3]), `0`(Hit), `4`(F, replaces 0 since 2 & 3 are used next:[2,4,3]), `2`(Hit), `3`(Hit). Total = 6 page faults!", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Replacement", "subtopic": "Optimal (MIN) Page Replacement", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-022", "question": "A free memory list contains three memory holes of sizes `6 KB, 15 KB, and 12 KB` (in that order). If a process requests a `10 KB` block, which hole is allocated under (i) First-Fit, (ii) Best-Fit, and (iii) Worst-Fit?", "options": {"A": "(i) First-Fit: 15 KB, (ii) Best-Fit: 12 KB, (iii) Worst-Fit: 15 KB", "B": "(i) First-Fit: 6 KB, (ii) Best-Fit: 12 KB, (iii) Worst-Fit: 15 KB", "C": "(i) First-Fit: 12 KB, (ii) Best-Fit: 15 KB, (iii) Worst-Fit: 12 KB", "D": "(i) First-Fit: 15 KB, (ii) Best-Fit: 15 KB, (iii) Worst-Fit: 12 KB"}, "correctAnswer": "A", "explanation": "6 KB is too small for 10 KB. First-Fit picks the first hole \u2265 10 KB (15 KB). Best-Fit picks the smallest sufficient hole (12 KB, leaving 2 KB). Worst-Fit picks the largest hole (15 KB, leaving 5 KB).", "moduleCode": "M", "module": "Virtual Memory", "topic": "Dynamic Partitioning", "subtopic": "First-Fit, Best-Fit, Worst-Fit", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/a-free-list-contains-three-memory-areas-of-sizes-6-kb-15-kb-and-12-kb-the-next-t-3972", "numericalCategory": "Virtual Memory"}, {"id": "COA-M-023", "question": "Which CPU control register holds the physical memory starting address of the currently running process's Page Table (such as `CR3` in x86)?", "options": {"A": "Page Table Base Register (PTBR)", "B": "Instruction Register (IR)", "C": "Program Counter (PC)", "D": "Stack Pointer (SP)"}, "correctAnswer": "A", "explanation": "The Page Table Base Register (`PTBR`, called `CR3` in x86 or `satp` in RISC-V) points to the physical base address of the current process's Page Table in RAM.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Table Hardware", "subtopic": "Page Table Base Register (PTBR)", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-024", "question": "How does 'Copy-on-Write (COW)' paging optimize process creation (`fork()`) in Unix/Linux?", "options": {"A": "Parent and child processes initially share the exact same physical frames marked Read-Only in their Page Tables; a new physical frame copy is allocated ONLY when either process attempts to write to a shared page (triggering a protection fault)", "B": "It copies all 4 GB of RAM to disk during fork()", "C": "It disables virtual memory", "D": "It deletes the parent process"}, "correctAnswer": "A", "explanation": "Copy-on-Write avoids copying memory frames on `fork()`, duplicating only the specific pages that are subsequently modified.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Copy-on-Write (COW)", "subtopic": "Fork Optimization with Paging", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-025", "question": "A processor uses a 3-Level Hierarchical Page Table in main memory (`t_m = 100 ns`) and a TLB (`t_TLB = 10 ns`) with a 95% hit ratio. How many total main memory accesses occur on a single TLB miss (assuming no L1/L2 page-walk cache and 0 page faults), and what is the Effective Access Time (EAT)?", "options": {"A": "4 RAM accesses on a TLB miss (3 for Page Table levels + 1 for data); EAT = 125 ns", "B": "3 RAM accesses on a TLB miss; EAT = 120 ns", "C": "2 RAM accesses on a TLB miss; EAT = 115 ns", "D": "1 RAM access on a TLB miss; EAT = 110 ns"}, "correctAnswer": "A", "explanation": "With a k = 3 level page table, a TLB miss requires k + 1 = 3 + 1 = 4 RAM accesses (`400 ns` + `10 ns` TLB = `410 ns`). On a TLB hit (95%), it takes `10 + 100 = 110 ns`. `EAT = 0.95(110) + 0.05(410) = 104.5 + 20.5 = 125 ns`.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Multilevel Paging EAT", "subtopic": "3-Level Page Table TLB Miss Accesses", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-N-001", "question": "Which component of the computer is used to resolve the operational differences (in speed, signal levels, and data formats) between the Central Processing Unit (CPU) and peripheral devices?", "options": {"A": "Arithmetic Logic Unit (ALU)", "B": "I/O Interface unit", "C": "Control Memory", "D": "Program Counter"}, "correctAnswer": "B", "explanation": "An I/O Interface unit sits between the CPU system bus and peripheral devices, resolving differences in operating speed, signal levels, data codes/formats, and timing synchronization.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Interface", "subtopic": "Resolving CPU and Peripheral Differences", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/which-component-of-the-computer-is-used-to-resolve-the-difference-between-cpu-an-3952", "numericalCategory": null}, {"id": "COA-N-002", "question": "What is the primary function of a 'Data Input Command' among the four types of commands (Control, Status, Data Output, Data Input) received by an I/O Interface?", "options": {"A": "It tests the status conditions in the interface and peripheral", "B": "It causes the interface to receive an item of data from the peripheral and place it in its buffer register for the CPU to read", "C": "It causes the interface to transfer data from the bus to the peripheral", "D": "It rewinds a magnetic tape"}, "correctAnswer": "B", "explanation": "A Data Input command is the opposite of a Data Output command: the interface receives an item of data from the peripheral and places it in its buffer register so the processor can read it over the data bus.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Commands", "subtopic": "Data Input Command Function", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/what-is-the-function-of-data-input-command-in-i-o-command-3953", "numericalCategory": null}, {"id": "COA-N-003", "question": "When Bus Grant (`BG`) = 1 in a Direct Memory Access (DMA) transfer, what function do the `Read` and `Write` control lines of the DMA controller perform?", "options": {"A": "Read line and write line act as input lines allowing the CPU to communicate with internal DMA registers", "B": "Read line acts as an input line and write line acts as an output line from DMA", "C": "Read line acts as an output line and write line acts as an input line from DMA controller", "D": "Read line and write line act as output lines from the DMA controller to specify memory read or write operations"}, "correctAnswer": "D", "explanation": "When `BG = 0`, the CPU is bus master and `Read`/`Write` are inputs to the DMA controller. When `BG = 1`, the CPU tri-states its buses and the DMA controller becomes bus master, so both `Read` and `Write` lines act as OUTPUT lines from the DMA controller to drive main memory!", "moduleCode": "N", "module": "I/O Organization", "topic": "Direct Memory Access (DMA)", "subtopic": "DMA Bus Grant (BG = 1) Read/Write Lines", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/when-bus-grant-bg-1-in-direct-memory-access-dma-transfer-then-what-function-read-3954", "numericalCategory": null}, {"id": "COA-N-004", "question": "In Direct Memory Access (DMA) ________, a block sequence consisting of a number of memory words is transferred in a continuous block while the DMA controller holds the memory bus.", "options": {"A": "Polling mode", "B": "Burst transfer", "C": "Programmed I/O", "D": "Daisy chaining"}, "correctAnswer": "B", "explanation": "In DMA Burst Transfer mode, a complete block of memory words is transferred in a continuous burst while the DMA controller retains mastership of the memory bus (needed for fast devices like magnetic disks).", "moduleCode": "N", "module": "I/O Organization", "topic": "Direct Memory Access (DMA)", "subtopic": "DMA Burst Transfer Mode", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2024", "shift": "7 Feb 2024, Shift 2 (12:30 PM)", "sourceReference": "https://www.utpaper.in/question/in-direct-memory-access-dma-a-block-sequence-consisting-of-a-number-of-memory-wo-2032", "numericalCategory": null}, {"id": "COA-N-005", "question": "An interface that provides I/O transfer of data directly to and from the memory unit and the peripheral, bypassing the CPU during the transfer, is known as:", "options": {"A": "Programmed I/O", "B": "DMA (Direct Memory Access)", "C": "ALU", "D": "Serial Polling"}, "correctAnswer": "B", "explanation": "Direct Memory Access (DMA) uses an external DMA Controller to generate memory addresses and control signals, transferring data directly between I/O peripherals and main memory without passing through CPU registers.", "moduleCode": "N", "module": "I/O Organization", "topic": "Direct Memory Access (DMA)", "subtopic": "DMA Interface Definition", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/an-interface-that-provides-io-transfer-of-data-di--5f56428950f4a04aa4ce3de0", "numericalCategory": null}, {"id": "COA-N-006", "question": "What is the primary characteristic of the Memory-Mapped I/O technique in a processor or microcontroller?", "options": {"A": "I/O device registers share the same address space as main memory, so the CPU accesses I/O ports using standard memory read/write instructions (`LOAD`, `STORE`, `MOV`) with no special I/O instructions needed", "B": "It requires dedicated `IN` and `OUT` instructions and separate `IOR`/`IOW` control lines", "C": "It prohibits the use of interrupts", "D": "It doubles the physical size of RAM"}, "correctAnswer": "A", "explanation": "In Memory-Mapped I/O, device control/data registers are assigned addresses in the main memory address space and are manipulated using ordinary memory reference instructions.", "moduleCode": "N", "module": "I/O Organization", "topic": "Memory-Mapped vs Isolated I/O", "subtopic": "Memory-Mapped I/O Role", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "Shift not verified", "sourceReference": "https://www.utpaper.in/question/what-is-the-primary-role-of-the-memory-mapped-i-o-technique-in-a-microcontroller-893", "numericalCategory": null}, {"id": "COA-N-007", "question": "How does 'Isolated I/O' (Port-Mapped I/O, as used in Intel 8085/x86 `IN` and `OUT` instructions) differ from 'Memory-Mapped I/O'?", "options": {"A": "Isolated I/O uses a separate I/O address space, dedicated `IN`/`OUT` instructions, and distinct `I/O Read` and `I/O Write` control lines so the full memory address space remains available for RAM", "B": "Isolated I/O cannot use an address bus", "C": "Memory-Mapped I/O requires special `IN` and `OUT` instructions", "D": "Isolated I/O disconnects the ALU"}, "correctAnswer": "A", "explanation": "Isolated I/O keeps the I/O port address space separate from the RAM address space by asserting distinct control lines (`IOR`/`IOW` vs `MemR`/`MemW`).", "moduleCode": "N", "module": "I/O Organization", "topic": "Memory-Mapped vs Isolated I/O", "subtopic": "Isolated (Port-Mapped) I/O Characteristics", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-008", "question": "How does 'Cycle Stealing' DMA mode differ from 'Burst Mode' DMA?", "options": {"A": "In Cycle Stealing, the DMA controller transfers ONE word at a time by stealing a single memory bus cycle from the CPU and then immediately releasing the bus; in Burst Mode, the DMA controller holds the bus for the entire multi-word block", "B": "Cycle Stealing transfers 100 MB before releasing the bus", "C": "Cycle Stealing requires no Address Register", "D": "Burst Mode is slower than Programmed I/O"}, "correctAnswer": "A", "explanation": "Cycle Stealing interleaves DMA single-word transfers with CPU bus accesses, reducing maximum CPU stall latency at the cost of slightly slower total I/O block transfer.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Transfer Modes", "subtopic": "Cycle Stealing vs Burst Mode", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-009", "question": "A DMA controller transfers characters from a high-speed device to main memory at a rate of 9,600 bytes/sec using Cycle Stealing (1 byte per stolen cycle). If the CPU fetches and executes instructions at a rate of 1 million memory accesses per second (1 access every 1 \u00b5s), by what percentage is the CPU slowed down due to DMA?", "options": {"A": "0.96%", "B": "9.6%", "C": "0.096%", "D": "96%"}, "correctAnswer": "A", "explanation": "DMA steals 9,600 memory cycles per second out of the 1,000,000 memory cycles available per second: Percentage slowdown = `(9,600 / 1,000,000) \u00d7 100% = 0.96%`.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Calculations", "subtopic": "DMA Cycle Stealing CPU Slowdown Numerical", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-N-010", "question": "Which three main internal registers in a DMA Controller must the CPU initialize before starting a DMA block transfer?", "options": {"A": "Address Register (starting memory address), Word Count Register (number of words to transfer), and Control/Status Register (transfer direction & mode)", "B": "Program Counter, Instruction Register, and Stack Pointer", "C": "Accumulator, Flag Register, and TLB", "D": "Segment Register, Page Register, and Index Register"}, "correctAnswer": "A", "explanation": "To initiate DMA, the CPU writes the starting RAM address into the DMA Address Register, the block length into the Word Count Register, and the Read/Write command into the Control Register.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Controller", "subtopic": "Internal Registers of a DMA Controller", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-011", "question": "What is the fundamental disadvantage of the single-wire 'Strobe Control' asynchronous transfer method that is solved by the two-wire 'Handshaking' method?", "options": {"A": "In Strobe control, the source unit has no way of knowing whether the destination unit has actually received the data (or vice versa); Handshaking adds a second reply control wire (`Data Valid` + `Data Accepted`) to confirm receipt", "B": "Strobe requires 64 control wires", "C": "Handshaking requires a shared 5 GHz clock", "D": "Strobe can only transfer 0s"}, "correctAnswer": "A", "explanation": "Handshaking uses two control lines in opposite directions (`Data Valid` from sender and `Data Accepted` from receiver), making it completely self-timed and reliable across devices of any speed.", "moduleCode": "N", "module": "I/O Organization", "topic": "Asynchronous Data Transfer", "subtopic": "Strobe vs Handshaking", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-012", "question": "What is the primary disadvantage of 'Programmed I/O' (Polling / Busy-Waiting)?", "options": {"A": "It requires an expensive DMA controller chip", "B": "The CPU wastes 100% of its instruction cycles staying in a tight status-checking loop while waiting for a slow I/O device to become ready", "C": "It corrupts main memory", "D": "It cannot read from a keyboard"}, "correctAnswer": "B", "explanation": "Because the CPU is millions of times faster than mechanical/human I/O devices, busy-wait polling ties up the processor checking the Ready flag instead of executing useful programs.", "moduleCode": "N", "module": "I/O Organization", "topic": "Programmed I/O", "subtopic": "Busy-Wait Polling Disadvantage", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-013", "question": "When the CPU asserts `Bus Grant (BG = 1)` in response to a DMA Controller's `Bus Request (BR = 1)`, into what electrical state does the CPU place its Address Bus, Data Bus, and Read/Write lines?", "options": {"A": "Logic 1 (+5V)", "B": "Logic 0 (Ground)", "C": "High-Impedance (Hi-Z / Tri-State) open-circuit state", "D": "Short-circuit state"}, "correctAnswer": "C", "explanation": "Placing the CPU's bus drivers into the High-Impedance (Hi-Z) tri-state electrically disconnects the CPU from the system bus so the DMA controller can drive the Address, Data, and Read/Write lines without bus contention.", "moduleCode": "N", "module": "I/O Organization", "topic": "CPU Bus State in DMA", "subtopic": "High-Impedance (Tri-State) Bus Lines", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-014", "question": "How does an 'I/O Processor (IOP)' or 'I/O Channel' (as in IBM mainframes) advance beyond a standard DMA Controller?", "options": {"A": "An IOP is a specialized processor that can fetch and execute its own sequence of I/O instructions (Channel Programs / CCWs) directly from main memory, handling data formatting, error recovery, and multi-block transfers without CPU intervention", "B": "An IOP is slower than Programmed I/O", "C": "An IOP cannot access main memory", "D": "An IOP is a software compiler"}, "correctAnswer": "A", "explanation": "While a DMA controller transfers a single contiguous block per CPU setup, an IOP executes complete channel programs in memory independently of the host CPU.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Processors", "subtopic": "I/O Channel / IOP", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-015", "question": "In mainframe I/O organization, what is the difference between a 'Selector Channel' and a 'Multiplexer Channel'?", "options": {"A": "A Selector Channel is dedicated to one high-speed device at a time (burst mode), whereas a Byte-Multiplexer Channel interleaves byte transfers from multiple slow/medium-speed devices simultaneously", "B": "A Selector Channel connects only keyboards", "C": "A Multiplexer Channel cannot use DMA", "D": "They are identical"}, "correctAnswer": "A", "explanation": "Selector channels handle high-speed disk/tape bursts one path at a time; Multiplexer channels multiplex many slow/medium devices concurrently.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Channels", "subtopic": "Selector vs Multiplexer Channel", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-016", "question": "An asynchronous serial link (UART) transmits 8-bit ASCII characters with 1 Start bit, 1 Even Parity bit, and 2 Stop bits at a baud rate of 9,600 bits/sec (bps). How many 8-bit ASCII characters are transmitted per second?", "options": {"A": "1,200 characters/sec", "B": "800 characters/sec", "C": "960 characters/sec", "D": "480 characters/sec"}, "correctAnswer": "B", "explanation": "Total bits per character frame = 1 (Start) + 8 (Data) + 1 (Parity) + 2 (Stop) = 12 bits/character. Character rate = `9,600 bps / 12 bits/char = 800 characters/sec`.", "moduleCode": "N", "module": "I/O Organization", "topic": "Serial vs Parallel Communication", "subtopic": "UART Asynchronous Framing", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-N-017", "question": "A program reads a 4 KB (4,096-byte) disk block into memory (1 byte per transfer). In Interrupt-Driven I/O, servicing each interrupt takes 50 clock cycles. In DMA, initializing the DMA controller takes 100 cycles and handling the single completion interrupt takes 50 cycles. How many CPU clock cycles are spent on I/O overhead in (i) Interrupt-Driven I/O versus (ii) DMA?", "options": {"A": "(i) 204,800 cycles vs (ii) 150 cycles", "B": "(i) 4,096 cycles vs (ii) 150 cycles", "C": "(i) 204,800 cycles vs (ii) 4,096 cycles", "D": "(i) 50 cycles vs (ii) 150 cycles"}, "correctAnswer": "A", "explanation": "(i) Interrupt-Driven I/O interrupts once per byte: `4,096 \u00d7 50 = 204,800` CPU cycles! (ii) DMA interrupts only once at the end of the entire 4 KB block: `100 (setup) + 50 (completion ISR) = 150` CPU cycles (over 1,365\u00d7 less CPU overhead!).", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Transfer Time", "subtopic": "CPU Overhead Comparison: Interrupt I/O vs DMA", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-N-018", "question": "What cache coherence hazard arises when a DMA controller writes new data from a disk directly into Main Memory (DRAM) while the CPU's L1/L2 Cache already holds a cached copy of that memory block?", "options": {"A": "The CPU cache copy becomes STALE (outdated); conversely, if the CPU cache is Write-Back and holds dirty data not yet written to RAM, a DMA read from RAM to disk will read stale memory data!", "B": "The ALU clock stops", "C": "The Page Table is deleted", "D": "No hazard can ever occur between DMA and Cache"}, "correctAnswer": "A", "explanation": "To prevent DMA cache incoherence, the OS either flushes/invalidates the affected cache lines before DMA, routes DMA through a coherent system interconnect (I/O cache snooping), or uses uncached bounce buffers.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Cache Coherence", "subtopic": "Stale Data Hazard with DMA and Cache", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-019", "question": "The classic Intel 8255 Programmable Peripheral Interface (PPI) chip provides how many 8-bit parallel I/O ports (`Port A, Port B, Port C`) and how many total I/O pins?", "options": {"A": "Three 8-bit ports (`Port A, Port B, Port C`) providing 24 I/O pins", "B": "Two 8-bit ports providing 16 I/O pins", "C": "Four 16-bit ports providing 64 I/O pins", "D": "One 8-bit port"}, "correctAnswer": "A", "explanation": "Intel 8255 has three 8-bit ports (Port A, Port B, and Port C\u2014which can be split into two 4-bit nibbles `C_upper` and `C_lower` for handshake signals), totaling 24 I/O pins operating in Mode 0 (Basic I/O), Mode 1 (Strobed I/O), or Mode 2 (Bidirectional Bus).", "moduleCode": "N", "module": "I/O Organization", "topic": "Peripheral Interfaces", "subtopic": "Intel 8255 PPI Modes", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-020", "question": "In which DMA transfer mode does the DMA controller transfer data over the memory bus ONLY during clock cycles when the CPU is performing internal operations and does NOT need the system bus?", "options": {"A": "Burst mode", "B": "Cycle stealing mode", "C": "Transparent (Hidden) DMA mode", "D": "Programmed mode"}, "correctAnswer": "C", "explanation": "Transparent DMA transfers words only when the CPU is busy internally (zero CPU slowdown), though hardware detection of free bus cycles is more complex.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Transfer Modes", "subtopic": "Transparent (Hidden) DMA", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-021", "question": "In a processor that uses Memory-Mapped I/O, why must the memory address range assigned to I/O device Status and Data registers be marked as 'Non-Cacheable' in the MMU/Page Table?", "options": {"A": "Because if the CPU cached a peripheral's Status or Data Input register in L1 Cache, polling loops would repeatedly read the old cached copy instead of reading live hardware changes from the device!", "B": "Because I/O registers are 128 bits wide", "C": "Because cache SRAM cannot store 0s", "D": "Because DMA cannot access RAM"}, "correctAnswer": "A", "explanation": "Hardware I/O registers have side effects and change asynchronously due to external events; caching them would return stale status values and prevent writes from reaching the peripheral.", "moduleCode": "N", "module": "I/O Organization", "topic": "Memory-Mapped I/O", "subtopic": "Why Memory-Mapped I/O Must Bypass Cache", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-022", "question": "Why do modern I/O controller interfaces (such as 16550 UARTs, disk controllers, and network cards) include an on-chip hardware FIFO buffer?", "options": {"A": "To elasticize data rate differences (absorbing bursts from the device or bus without dropping bytes if the CPU or DMA controller has brief interrupt/arbitration latency)", "B": "To execute user C programs", "C": "To replace the CPU's Control Unit", "D": "To perform floating-point multiplication"}, "correctAnswer": "A", "explanation": "An interface FIFO decouples the instantaneous data rate of the peripheral from the bus/interrupt response time, preventing overrun/underrun errors.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Synchronization", "subtopic": "FIFO Buffer in I/O Interface", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-023", "question": "In Intel x86 processors, the `IN` and `OUT` instructions use a 16-bit I/O port address (stored in register `DX` or as an 8-bit immediate). How many distinct 8-bit I/O ports can be addressed in this Isolated I/O space?", "options": {"A": "256 ports", "B": "65,536 (64K) ports", "C": "1,024 ports", "D": "4 Billion ports"}, "correctAnswer": "B", "explanation": "A 16-bit I/O port address (`0x0000` to `0xFFFF`) addresses `2\u00b9\u2076 = 65,536` (64K) distinct 8-bit I/O ports.", "moduleCode": "N", "module": "I/O Organization", "topic": "Isolated I/O", "subtopic": "Intel x86 I/O Address Space Size", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-024", "question": "In a DMA transfer from an I/O device to Main Memory, what is the difference between 'Fly-By (Single-Bus-Cycle)' DMA and 'Two-Bus-Cycle (Fetch-and-Deposit)' DMA?", "options": {"A": "In Fly-By DMA, the DMA controller asserts `I/O Read` and `Memory Write` simultaneously so data flows directly from the I/O device to RAM in 1 bus cycle; in Two-Cycle DMA, the DMA controller first reads the word into an internal DMA buffer register and then writes it to RAM in a second bus cycle", "B": "Fly-By DMA takes 10 cycles per byte", "C": "Two-Cycle DMA does not use the data bus", "D": "Fly-By DMA only works with keyboards"}, "correctAnswer": "A", "explanation": "Fly-By DMA transfers data directly between the peripheral and memory in a single bus cycle by asserting `DACK` (Device Acknowledge / I/O Read) and `MemW` simultaneously.", "moduleCode": "N", "module": "I/O Organization", "topic": "DMA Operations", "subtopic": "Fly-By (Single-Cycle) vs Two-Cycle DMA", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-N-025", "question": "When multiple I/O devices share a single interrupt request line in an interrupt-driven I/O system without vectored hardware, how does 'Software Polling' identify which device requested service?", "options": {"A": "The CPU executes a polling routine that reads the Status Register of each device one by one (starting with the highest-priority device) until it finds the device whose `IRQ/Ready` flag is set", "B": "The CPU resets the computer", "C": "The DMA controller erases all devices", "D": "The ALU adds all device addresses"}, "correctAnswer": "A", "explanation": "In software polling, the CPU branches to a common ISR that sequentially tests each device's status register in priority order.", "moduleCode": "N", "module": "I/O Organization", "topic": "I/O Bus Topology", "subtopic": "Daisy-Chained vs Independent I/O Polling", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-001", "question": "Disabling an interrupt is known as ________.", "options": {"A": "Masking", "B": "Polling", "C": "Spooling", "D": "Vectored branching"}, "correctAnswer": "A", "explanation": "Masking an interrupt means temporarily disabling it (via an Interrupt Mask Register or clearing the Interrupt Enable flag) so the CPU ignores or defers it while executing a critical section or higher-priority ISR.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Masking", "subtopic": "Disabling an Interrupt", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "1 Aug 2021, Shift 1", "sourceReference": "https://www.utpaper.in/question/disabling-an-interrupt-is-known-as-3514", "numericalCategory": null}, {"id": "COA-O-002", "question": "Which of the following events is universally assigned to a Non-Maskable Interrupt (NMI) rather than a Maskable Interrupt?", "options": {"A": "Keyboard key press", "B": "Hard disk sector read completion", "C": "Imminent power failure or catastrophic hardware memory parity error", "D": "Mouse movement"}, "correctAnswer": "C", "explanation": "Catastrophic hardware emergencies (power-fail detection, uncorrectable RAM parity error, hardware watchdog timer) use a Non-Maskable Interrupt (NMI) that cannot be disabled by software.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Types", "subtopic": "Maskable vs Non-Maskable Interrupts", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-003", "question": "What is a 'Vectored Interrupt'?", "options": {"A": "An interrupt in which the interrupting device itself supplies a branch address (or vector number into the Interrupt Vector Table) to identify its specific Interrupt Service Routine (ISR)", "B": "An interrupt that can only occur in vector supercomputers", "C": "An interrupt where the CPU must poll every device in software", "D": "An interrupt that cannot save the Program Counter"}, "correctAnswer": "A", "explanation": "In a vectored interrupt, the device places a vector number/address on the data bus during the `INTA` cycle so the CPU can jump directly to that device's ISR without software polling.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Vectored Interrupts", "subtopic": "Vectored vs Non-Vectored", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-004", "question": "At what exact point in the instruction cycle does the CPU check the external hardware Interrupt Request (`INTR`) line?", "options": {"A": "In the middle of the Instruction Decode phase", "B": "At the end of the Execute phase of each instruction (before starting the Fetch phase of the next instruction)", "C": "Only when the computer is turned off", "D": "During the middle of an ALU addition"}, "correctAnswer": "B", "explanation": "To keep machine instructions atomic (except for long block-move instructions or page faults), the CPU samples the asynchronous `INTR` pin at the end of the current instruction's Execute cycle.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Cycle", "subtopic": "When CPU Checks for Hardware Interrupts", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-005", "question": "When a hardware interrupt is acknowledged, which two registers MUST be automatically saved by the CPU hardware (onto the stack or special registers) before loading `PC` with the ISR address?", "options": {"A": "Only the Accumulator (AC) and Index Register (XR)", "B": "The Program Counter (PC) and the Processor Status Word / Flag Register (PSW)", "C": "Only the Instruction Register (IR)", "D": "The DMA Word Count Register"}, "correctAnswer": "B", "explanation": "Because an asynchronous interrupt can occur between any two instructions, both the return address (`PC`) AND the condition flags (`PSW`) must be saved so `IRET` can resume the interrupted program without corrupting its status flags!", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Context Saving", "subtopic": "What Hardware Saves on an Interrupt", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-006", "question": "Match the three IEEE/x86 synchronous exception classes with their behavior upon return from the OS handler:\n1. Fault (e.g., Page Fault)                P. Unrecoverable fatal error; process is terminated\n2. Trap (e.g., System Call `INT 0x80`)     Q. Re-executes the EXACT SAME instruction that caused the exception\n3. Abort (e.g., Machine Check / Double Fault) R. Resumes execution at the NEXT instruction following the trap", "options": {"A": "1-Q, 2-R, 3-P", "B": "1-R, 2-Q, 3-P", "C": "1-P, 2-R, 3-Q", "D": "1-Q, 2-P, 3-R"}, "correctAnswer": "A", "explanation": "A **Fault** (like a Page Fault) is corrected by the OS and then re-executes the faulting instruction (Q). A **Trap** (like a System Call or Breakpoint) is intentional and resumes at the next instruction (R). An **Abort** terminates the program (P).", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Exceptions Classification", "subtopic": "Trap vs Fault vs Abort", "difficulty": "Difficult", "questionType": "Match-the-Following", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-007", "question": "In a hardware Daisy-Chaining interrupt priority system, three devices `D1, D2, D3` are wired in series along the `Interrupt Acknowledge (INTA)` line such that `CPU \u2192 D1 \u2192 D2 \u2192 D3`. If `D1` and `D3` assert the common `INTR` line simultaneously, which device gets serviced first and why?", "options": {"A": "D1 gets serviced first because it is physically closest to the CPU and intercepts the `INTA` signal (`PI = 1`), blocking `PO = 0` from reaching D2 and D3", "B": "D3 gets serviced first because it is at the end of the chain", "C": "Both get serviced simultaneously", "D": "Neither gets serviced; a deadlock occurs"}, "correctAnswer": "A", "explanation": "In Daisy Chaining, priority is determined by physical position along the serial `INTA` line: the requesting device closest to the CPU intercepts the grant and blocks downstream devices.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Priority", "subtopic": "Daisy-Chaining Priority Order", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-008", "question": "In the Intel 8085 microprocessor, which hardware interrupt has the HIGHEST priority, is Non-Maskable, and requires both edge and level triggering?", "options": {"A": "INTR", "B": "RST 7.5", "C": "TRAP (RST 4.5)", "D": "RST 5.5"}, "correctAnswer": "C", "explanation": "In Intel 8085, `TRAP` (Pin 6, also known as `RST 4.5`, vectored to `0024H`) is the only Non-Maskable Interrupt, has the highest priority, and is both edge- and level-triggered.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "8085 Interrupts", "subtopic": "Intel 8085 Hardware Interrupts", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-009", "question": "What is the hexadecimal vector branch address for the `RST 6.5` hardware interrupt in the Intel 8085 microprocessor?", "options": {"A": "0024H", "B": "002CH", "C": "0034H", "D": "003CH"}, "correctAnswer": "C", "explanation": "In Intel 8085, the vector address for `RST n` is `n \u00d7 8` in decimal, converted to hex: `6.5 \u00d7 8 = 52` decimal. Converting 52 to hexadecimal: `52 = 3 \u00d7 16 + 4 = 0034H`! (`TRAP = 0024H`, `RST 5.5 = 002CH`, `RST 6.5 = 0034H`, `RST 7.5 = 003CH`).", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "8085 Interrupts", "subtopic": "8085 RST Vector Address Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-O-010", "question": "Suppose Interrupt Priority is `P(Disk) > P(Network) > P(Keyboard)`. While the CPU is executing the `Network ISR` at `t = 10 ms`, a `Keyboard` interrupt arrives at `t = 12 ms` and a `Disk` interrupt arrives at `t = 15 ms`. Assuming nested priority interrupts are enabled, in what order do the ISRs complete?", "options": {"A": "Disk ISR completes first \u2192 Network ISR resumes and completes second \u2192 Keyboard ISR executes and completes last", "B": "Keyboard \u2192 Disk \u2192 Network", "C": "Network \u2192 Keyboard \u2192 Disk", "D": "Disk \u2192 Keyboard \u2192 Network"}, "correctAnswer": "A", "explanation": "At `t = 12 ms`, the lower-priority Keyboard interrupt is held pending. At `t = 15 ms`, the higher-priority Disk interrupt preempts the Network ISR, runs to completion, returns to finish the Network ISR, and finally the pending Keyboard ISR runs!", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Nested Interrupts", "subtopic": "Priority-Based Nested Interrupt Execution", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-011", "question": "What is 'Interrupt Latency'?", "options": {"A": "The total time elapsed from the instant an external device asserts its interrupt request signal until the CPU begins executing the first instruction of the corresponding Interrupt Service Routine (ISR)", "B": "The time taken to compile an operating system", "C": "The rotational delay of a hard disk", "D": "The time taken to refresh DRAM"}, "correctAnswer": "A", "explanation": "Interrupt latency includes the time to finish the current instruction (or uninterruptible critical section), acknowledge the interrupt, save `PC`/`PSW` context, and fetch the first ISR instruction.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Latency", "subtopic": "Factors Contributing to Interrupt Latency", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-012", "question": "In a Parallel Priority Interrupt Controller (such as Intel 8259A PIC) that accepts 8 independent interrupt request lines `IRQ0..IRQ7`, which combinational circuit determines the binary vector ID of the highest-priority active unmasked request in a single gate delay?", "options": {"A": "An 8-to-3 Priority Encoder", "B": "A 3-to-8 Decoder", "C": "A Ripple Carry Adder", "D": "A Shift Register"}, "correctAnswer": "A", "explanation": "An 8-to-3 Priority Encoder outputs the 3-bit binary index of the highest-priority active input line while ignoring all lower-priority active inputs.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Parallel Priority Interrupt", "subtopic": "Priority Encoder in Interrupt Controller", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-013", "question": "Which statement correctly distinguishes a 'Hardware Interrupt' from a 'Software Interrupt'?", "options": {"A": "A Hardware Interrupt is triggered asynchronously by an external electrical signal on a CPU pin, whereas a Software Interrupt (`INT n` / `TRAP`) is triggered synchronously by executing a machine instruction inside the program", "B": "A Software Interrupt cannot access the Interrupt Vector Table", "C": "A Hardware Interrupt does not save the Program Counter", "D": "A Software Interrupt can only be triggered by a mouse click"}, "correctAnswer": "A", "explanation": "Hardware interrupts are asynchronous external pin events; Software interrupts are synchronous machine instructions.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Hardware vs Software Interrupt", "subtopic": "Synchronous vs Asynchronous", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-014", "question": "Why must an Interrupt Service Routine (ISR) end with a special `IRET` / `RTI` (Return from Interrupt) instruction rather than a normal subroutine `RET` instruction?", "options": {"A": "Because `IRET` atomically restores BOTH the saved Status Flags (`PSW`) and the `Program Counter (PC)` (and re-enables interrupts / switches privilege mode back to User Mode), whereas `RET` pops only `PC`", "B": "Because `RET` clears all registers to zero", "C": "Because `IRET` deletes the stack", "D": "They are completely identical"}, "correctAnswer": "A", "explanation": "`IRET` restores the full interrupted processor state (`PC` + `PSW` + privilege mode/interrupt enable), whereas `RET` only pops `PC`.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Return", "subtopic": "Why Normal RET Cannot End an ISR", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-015", "question": "In the classic Intel 8086 architecture, the Interrupt Vector Table (IVT) supports 256 interrupt vectors (`Type 0` to `Type 255`), and each vector stores a 32-bit (`4-byte`) far pointer (`16-bit IP : 16-bit CS`). How many total bytes of physical memory does the IVT occupy at the bottom of memory (`0x00000` to `0x003FF`)?", "options": {"A": "256 bytes", "B": "512 bytes", "C": "1,024 bytes (1 KB)", "D": "4,096 bytes (4 KB)"}, "correctAnswer": "C", "explanation": "`256 vectors \u00d7 4 bytes/vector = 1,024 bytes = 1 KB` (occupying physical addresses `0x00000` through `0x003FF`).", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Vector Table", "subtopic": "IVT Memory Footprint", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-016", "question": "A single 8259A Programmable Interrupt Controller (PIC) handles 8 interrupt lines. If one Master 8259A has 2 of its input lines connected to two Slave 8259A PICs (as in the PC/AT architecture), how many total external device IRQ lines can the cascaded system support?", "options": {"A": "16 IRQ lines", "B": "22 IRQ lines", "C": "24 IRQ lines", "D": "64 IRQ lines"}, "correctAnswer": "B", "explanation": "3 PIC chips \u00d7 8 lines = 24 lines total, minus the 2 Master input lines used to cascade the 2 Slaves = `24 \u2212 2 = 22` usable IRQ lines! (In the standard PC/AT with 1 Master + 1 Slave, it is `16 \u2212 1 = 15` usable IRQ lines!).", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Cascaded Interrupt Controllers", "subtopic": "Cascading Intel 8259A PICs", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-017", "question": "Among the 5 hardware interrupt pins of the Intel 8085 (`TRAP, RST 7.5, RST 6.5, RST 5.5, INTR`), which is the ONLY Non-Vectored interrupt (requiring external hardware to supply an `RST n` or `CALL` opcode during `INTA`)?", "options": {"A": "TRAP", "B": "RST 7.5", "C": "INTR", "D": "RST 5.5"}, "correctAnswer": "C", "explanation": "`TRAP`, `RST 7.5`, `RST 6.5`, and `RST 5.5` have fixed internal vector addresses (`0024H, 003CH, 0034H, 002CH`). Only `INTR` is non-vectored.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Vectored vs Non-Vectored", "subtopic": "8085 Non-Vectored Interrupt", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-018", "question": "When an ALU instruction attempts to divide an integer by zero (`DIV R1, R0` where `R0 = 0`), what type of event is generated?", "options": {"A": "An asynchronous external hardware DMA request", "B": "A synchronous internal processor Exception (Divide Error Fault/Trap)", "C": "A cache hit", "D": "A bus arbitration grant"}, "correctAnswer": "B", "explanation": "Division by zero is detected synchronously by the ALU during instruction execution and triggers an internal processor exception (Interrupt Type 0 in x86).", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Exceptions", "subtopic": "Division by Zero Classification", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-019", "question": "Why does the CPU hardware automatically clear the Interrupt Enable flip-flop (`IEN \u2190 0`) as soon as it enters the Interrupt Cycle?", "options": {"A": "To prevent the same level-triggered interrupt (or another lower-priority interrupt) from recursively interrupting the ISR before the ISR has saved registers and cleared the device status!", "B": "To turn off the computer monitor", "C": "To clear the Accumulator", "D": "To flush the L2 cache"}, "correctAnswer": "A", "explanation": "Clearing `IEN \u2190 0` on interrupt entry prevents immediate infinite re-interruption while the ISR saves critical context.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Interrupt Disable on Entry", "subtopic": "Why CPU Automatically Clears IEN on Interrupt Entry", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-O-020", "question": "In a fixed-priority interrupt system (such as Daisy Chaining), what risk does the lowest-priority device face under heavy I/O load, and how can an interrupt controller mitigate it?", "options": {"A": "Starvation (indefinite postponement); mitigated by Rotating Priority (round-robin priority rotation after each serviced interrupt)", "B": "Cache thrashing; mitigated by direct mapping", "C": "Belady's anomaly; mitigated by FIFO", "D": "Arithmetic overflow; mitigated by 1's complement"}, "correctAnswer": "A", "explanation": "Programmable Interrupt Controllers (like 8259A) support a 'Rotating Priority' mode where a device that just received service is rotated to the lowest priority so no device starves.", "moduleCode": "O", "module": "Interrupts and Exceptions", "topic": "Priority Starvation", "subtopic": "Preventing Starvation in Interrupt Priority", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-001", "question": "With respect to the CPU (Bus Master) and Main Memory, what is the directionality of the Address Bus and the Data Bus?", "options": {"A": "Address Bus is Bidirectional; Data Bus is Unidirectional", "B": "Address Bus is Unidirectional; Data Bus is Bidirectional", "C": "Both Address Bus and Data Bus are Unidirectional", "D": "Both Address Bus and Data Bus are Bidirectional"}, "correctAnswer": "B", "explanation": "The Address Bus is Unidirectional (driven by the CPU/DMA master to select a memory or I/O location), whereas the Data Bus is Bidirectional (carrying read data to the CPU and write data from the CPU).", "moduleCode": "P", "module": "Bus Structure", "topic": "Address & Data Bus", "subtopic": "Directionality of System Buses", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-002", "question": "A 32-bit synchronous bus operates at a clock frequency of 200 MHz. If transferring one 32-bit word takes 1 clock cycle, what is the peak bandwidth of this bus in Megabytes per second (`1 MB = 10\u2076 bytes`)?", "options": {"A": "200 MB/s", "B": "400 MB/s", "C": "800 MB/s", "D": "6,400 MB/s"}, "correctAnswer": "C", "explanation": "Bytes per transfer = 32 bits / 8 = 4 bytes. Transfers per second = 200 \u00d7 10\u2076. Bandwidth = `4 bytes \u00d7 200 \u00d7 10\u2076 / s = 800 MB/s`.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Bandwidth", "subtopic": "Synchronous Bus Bandwidth Numerical", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-P-003", "question": "An asynchronous/synchronous system bus is 64 bits (8 bytes) wide and runs at 100 MHz (10 ns cycle). A block read of 32 bytes (four 64-bit words) requires 1 cycle to send the address, 2 idle memory-wait cycles, and then 1 cycle per 64-bit word (4 data cycles). What is the effective bus bandwidth during this 32-byte burst?", "options": {"A": "457.14 MB/s", "B": "800.00 MB/s", "C": "320.00 MB/s", "D": "228.57 MB/s"}, "correctAnswer": "A", "explanation": "Step 1: Total clock cycles for 32 bytes = 1 (address) + 2 (wait) + 4 (data words) = 7 cycles = `7 \u00d7 10 ns = 70 ns`. Step 2: Bandwidth = `32 bytes / 70 ns = 32 / (70 \u00d7 10\u207b\u2079) = 457.14 \u00d7 10\u2076 bytes/s = 457.14 MB/s`.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Bandwidth", "subtopic": "Block Burst Transfer Bandwidth", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-P-004", "question": "For a system bus with `N = 8` bus-master devices, how many arbitration control lines (including `Bus Busy`) are required by: (i) Daisy Chain, (ii) Polling, and (iii) Independent Request arbitration?", "options": {"A": "(i) 3 lines, (ii) 5 lines (`2 + log\u20828`), (iii) 17 lines (`2\u00d78 + 1`)", "B": "(i) 8 lines, (ii) 8 lines, (iii) 8 lines", "C": "(i) 3 lines, (ii) 10 lines, (iii) 8 lines", "D": "(i) 17 lines, (ii) 5 lines, (iii) 3 lines"}, "correctAnswer": "A", "explanation": "For `N = 8` devices: (i) Daisy Chain always uses 3 lines (`BR, BG, BBSY`); (ii) Polling uses `1 BR + 1 BBSY + log\u2082(8) Poll lines = 2 + 3 = 5` lines; (iii) Independent Request uses `8 BR + 8 BG + 1 BBSY = 17` lines!", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Arbitration", "subtopic": "Control Lines for Daisy Chain, Polling, Independent Request", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-005", "question": "Among Daisy Chaining, Polling, and Independent Request centralized bus arbitration schemes, which provides the FASTEST arbitration response time and programmable priority, and why?", "options": {"A": "Independent Request; because every device has its own dedicated `Bus Request` and `Bus Grant` wire pair connected directly to a fast parallel priority encoder in the arbiter", "B": "Daisy Chaining; because the grant ripples serially through every device", "C": "Polling; because the arbiter counts from 0 to N\u22121 sequentially", "D": "All three have identical speed"}, "correctAnswer": "A", "explanation": "Independent Request resolves contention in a single arbiter cycle without serial ripple delay or sequential counter polling.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Arbitration", "subtopic": "Fastest Bus Arbitration Method", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-006", "question": "Why do microprocessors like the Intel 8085 and 8086 use a 'Time-Multiplexed Address/Data Bus' (e.g., `AD0\u2013AD7` in 8085, controlled by the `ALE` Address Latch Enable signal)?", "options": {"A": "To reduce the number of physical pins on the IC package by using the same pins to output the Address during the first clock state (`T\u2081`) and transfer Data during subsequent states (`T\u2082, T\u2083`)", "B": "To double the data transfer speed", "C": "To eliminate the external RAM chip", "D": "To convert binary into octal"}, "correctAnswer": "A", "explanation": "Multiplexing `AD0\u2013AD7` saves 8 physical pins on the 40-pin 8085 package; an external 8-bit latch (74LS373) captures the lower address byte when `ALE = 1`.", "moduleCode": "P", "module": "Bus Structure", "topic": "Multiplexed Bus", "subtopic": "Time-Multiplexed Address/Data Bus (ALE)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-007", "question": "Why can a high-frequency Synchronous Parallel Bus NOT be made arbitrarily long (or wide) across a motherboard?", "options": {"A": "Because of 'Clock Skew' and signal propagation delay differences across parallel wires (signals sent at the same instant arrive at slightly different times at high frequencies)", "B": "Because copper wires melt at 10 MHz", "C": "Because synchronous buses have no clock line", "D": "Because asynchronous buses are always wider"}, "correctAnswer": "A", "explanation": "At high clock rates, tiny differences in trace length/capacitance cause **clock skew** and **data skew** across parallel lines\u2014which is why modern interconnects (PCIe, SATA, USB) switched to high-speed serial differential lanes with embedded clocking!", "moduleCode": "P", "module": "Bus Structure", "topic": "Synchronous vs Asynchronous Bus", "subtopic": "Clock Skew Limitation", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-008", "question": "How does 'PCI Express (PCIe)' fundamentally differ in architecture from the older 'Conventional PCI' bus?", "options": {"A": "Conventional PCI is a shared parallel bus (32/64-bit), whereas PCI Express (PCIe) is a high-speed point-to-point serial interconnect made of full-duplex differential lanes (`x1, x4, x8, x16`)", "B": "PCIe is a parallel 128-bit shared bus", "C": "Conventional PCI is a serial point-to-point link", "D": "PCIe cannot connect graphics cards"}, "correctAnswer": "A", "explanation": "PCIe replaced shared parallel buses with dedicated point-to-point full-duplex serial lanes (`x1` to `x16`), eliminating shared-bus arbitration contention and parallel skew.", "moduleCode": "P", "module": "Bus Structure", "topic": "Modern Interconnects", "subtopic": "PCI vs PCI Express (PCIe)", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-009", "question": "Which of the following peripheral interconnects use SERIAL bit transmission rather than parallel multi-wire data words?", "options": {"A": "Only Centronics Printer Port and IDE/PATA", "B": "USB (Universal Serial Bus), SATA (Serial ATA), and PCI Express (PCIe)", "C": "Only ISA and VESA Local Bus", "D": "Only the internal 64-bit ALU bus"}, "correctAnswer": "B", "explanation": "USB, SATA, and PCIe all use high-frequency serial differential signaling, achieving much higher transfer rates and thinner cables/traces than legacy parallel PATA/PCI buses.", "moduleCode": "P", "module": "Bus Structure", "topic": "Peripheral Interconnects", "subtopic": "SATA vs PATA (IDE) and USB", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-010", "question": "What is a 'Split-Transaction Bus' (Pipelined Bus) in a multiprocessor system?", "options": {"A": "Instead of holding the bus idle during the entire 50\u2013100 ns memory access latency, the bus splits a read into an 'Address/Request Packet' (releasing the bus immediately for other masters!) followed later by a 'Data Reply Packet' when memory is ready", "B": "A bus physically cut in half with wire cutters", "C": "A bus that can only transfer 4 bits at a time", "D": "A bus without an address bus"}, "correctAnswer": "A", "explanation": "A Split-Transaction Bus releases the bus between the Request phase and the Response phase so other processors can use the bus while DRAM fetches the requested block.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Signals", "subtopic": "Split-Transaction (Pipelined) Bus", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-011", "question": "A microprocessor has a 24-bit Address Bus and a 16-bit Data Bus. What is the maximum directly addressable memory space in Bytes (assuming byte-addressable memory)?", "options": {"A": "16 MB (2\u00b2\u2074 bytes)", "B": "32 MB", "C": "64 KB", "D": "4 GB"}, "correctAnswer": "A", "explanation": "With a 24-bit byte address bus, the processor can directly address `2\u00b2\u2074 bytes = 16 \u00d7 2\u00b2\u2070 bytes = 16 MB` of memory (arranged as 8M \u00d7 16-bit words).", "moduleCode": "P", "module": "Bus Structure", "topic": "Address Bus Capacity", "subtopic": "Addressable Memory from Address & Data Width", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-012", "question": "How does 'Distributed Bus Arbitration' work without a central hardware arbiter?", "options": {"A": "Each device has a unique 4-bit Arbitration ID and drives open-collector arbitration lines (`ARB0..ARB3`); through wired-OR priority comparison, the contender with the highest binary ID automatically wins mastership", "B": "All devices transmit data simultaneously causing a collision", "C": "The user manually flips a toggle switch for each byte", "D": "Only the keyboard acts as arbiter"}, "correctAnswer": "A", "explanation": "In distributed arbitration (used in NuBus, SCSI, CAN bus), devices compare their priority IDs on shared open-collector arbitration lines and withdraw if a higher-ID line is asserted.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Arbitration", "subtopic": "Distributed Arbitration", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-013", "question": "What is the purpose of the `READY` (or `WAIT'`) control line on a microprocessor system bus?", "options": {"A": "It allows a slow memory or I/O device to force the CPU to insert 'Wait States' (extra clock cycles) until the slow device has finished reading or latching data", "B": "It erases the BIOS ROM", "C": "It turns off the CPU fan", "D": "It masks non-maskable interrupts"}, "correctAnswer": "A", "explanation": "When a slow peripheral pulls `READY = 0`, the CPU inserts idle Wait States (`T_W`) into the current bus cycle until `READY` returns to `1`.", "moduleCode": "P", "module": "Bus Structure", "topic": "Control Bus Signals", "subtopic": "Function of READY / WAIT Bus Line", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-014", "question": "Why do computer motherboards organize buses hierarchically (connecting the CPU to a fast Memory/PCIe controller bus, bridged to a slower peripheral I/O bus for USB/Audio/SPI) rather than attaching all 20+ devices directly to the CPU local bus?", "options": {"A": "Because attaching many devices directly to the high-speed CPU bus adds heavy capacitive electrical load and propagation delay, drastically lowering the maximum clock frequency of the bus!", "B": "Because copper traces cannot exceed 2 devices", "C": "Because USB devices run at 100 GHz", "D": "To waste power"}, "correctAnswer": "A", "explanation": "High fan-out capacitive loading degrades signal integrity and limits frequency; bridging isolates fast CPU/RAM/GPU buses from slower peripheral buses.", "moduleCode": "P", "module": "Bus Structure", "topic": "Bus Hierarchy", "subtopic": "Mezzanine / Bridge Architecture (Northbridge/Southbridge)", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-P-015", "question": "A PCIe 4.0 link provides 2 GB/s of unidirectional bandwidth per lane (`x1`). What is the peak unidirectional bandwidth of a `PCIe 4.0 x16` graphics card slot?", "options": {"A": "16 GB/s", "B": "32 GB/s", "C": "64 GB/s", "D": "8 GB/s"}, "correctAnswer": "B", "explanation": "16 lanes \u00d7 2 GB/s per lane = 32 GB/s unidirectional (and 64 GB/s combined full-duplex!).", "moduleCode": "P", "module": "Bus Structure", "topic": "PCIe Bandwidth", "subtopic": "PCIe x16 Bandwidth Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "DMA & Bus Bandwidth"}, {"id": "COA-Q-001", "question": "________ is a loosely coupled system and ________ is a tightly coupled system.", "options": {"A": "Distributed / Multicomputer system (private local memory); Shared-memory Multiprocessor system", "B": "Shared-memory Multiprocessor; Distributed system", "C": "Uniprocessor; SISD system", "D": "Cache memory; Virtual memory"}, "correctAnswer": "A", "explanation": "A Distributed (Multicomputer) system where nodes have private memories and communicate via message passing is a **loosely coupled** system, whereas a Shared-Memory Multiprocessor system is a **tightly coupled** system.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Multiprocessor Coupling", "subtopic": "Loosely Coupled vs Tightly Coupled", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/is-loosely-coupled-system-and-is-tightly-coupled-system-4116", "numericalCategory": null}, {"id": "COA-Q-002", "question": "In Michael Flynn's taxonomy (1966), which class of computer architecture executes the exact same instruction broadcast by a single Control Unit simultaneously across multiple Processing Elements (PEs) operating on different data elements?", "options": {"A": "SISD (Single Instruction, Single Data)", "B": "SIMD (Single Instruction, Multiple Data)", "C": "MISD (Multiple Instruction, Single Data)", "D": "MIMD (Multiple Instruction, Multiple Data)"}, "correctAnswer": "B", "explanation": "SIMD (Single Instruction, Multiple Data) includes Array Processors (ILLIAC IV), Vector Processors, CPU SIMD vector extensions (AVX/NEON), and GPU thread warps.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Flynn's Taxonomy", "subtopic": "SIMD Architecture Examples", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-003", "question": "According to Amdahl's Law, if 90% of a program's execution time can be parallelized (`P = 0.90`) and 10% is strictly serial (`1 \u2212 P = 0.10`), what is the overall speedup achieved on a 9-processor system (`N = 9`)?", "options": {"A": "9.0\u00d7", "B": "5.0\u00d7", "C": "4.5\u00d7", "D": "10.0\u00d7"}, "correctAnswer": "B", "explanation": "Using `S(N) = 1 / [(1 \u2212 P) + (P / N)]`: `S(9) = 1 / [0.10 + (0.90 / 9)] = 1 / [0.10 + 0.10] = 1 / 0.20 = 5.0\u00d7`.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Amdahl's Law", "subtopic": "Amdahl's Law Speedup Numerical", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Amdahl Law"}, {"id": "COA-Q-004", "question": "A program contains 25% strictly serial code (`1 \u2212 P = 0.25`) that cannot be parallelized. What is the maximum theoretical speedup achievable even with an INFINITE number of processors (`N \u2192 \u221e`)?", "options": {"A": "4.0\u00d7", "B": "25.0\u00d7", "C": "75.0\u00d7", "D": "Infinite"}, "correctAnswer": "A", "explanation": "As `N \u2192 \u221e`, `P / N \u2192 0`, so `S_max = 1 / (1 \u2212 P) = 1 / 0.25 = 4.0\u00d7`.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Amdahl's Law", "subtopic": "Infinite Processors Speedup Limit", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Amdahl Law"}, {"id": "COA-Q-005", "question": "To achieve an overall speedup of `8\u00d7` on a `16`-processor system (`N = 16`), what minimum fraction `P` of the original program must be parallelizable?", "options": {"A": "P = 14/15 (\u2248 93.33%)", "B": "P = 7/8 (87.50%)", "C": "P = 15/16 (93.75%)", "D": "P = 4/5 (80.00%)"}, "correctAnswer": "A", "explanation": "Set `8 = 1 / [(1 \u2212 P) + P/16]` \u2192 `1 \u2212 (15/16)P = 1/8 = 2/16` \u2192 `(15/16)P = 14/16` \u2192 `P = 14/15 \u2248 93.33%`!", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Amdahl's Law", "subtopic": "Reverse Amdahl's Law (Finding Required Parallel Fraction)", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Amdahl Law"}, {"id": "COA-Q-006", "question": "How many crosspoint switches are required in a non-blocking Crossbar Switch network connecting `N = 16` processors to `M = 16` memory modules?", "options": {"A": "16 switches", "B": "32 switches", "C": "64 switches", "D": "256 switches (`16 \u00d7 16`)"}, "correctAnswer": "D", "explanation": "An `N \u00d7 M` Crossbar Switch requires `N \u00d7 M = 16 \u00d7 16 = 256` crosspoint switches (`O(N\u00b2)` hardware complexity).", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Interconnection Networks", "subtopic": "Crossbar Switch Complexity", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-007", "question": "An `N \u00d7 N` Multistage Omega Network connects `N = 32` processors to `32` memory modules using `2 \u00d7 2` interchange switch boxes. How many stages are in the network, and how many total `2 \u00d7 2` switches are required?", "options": {"A": "5 stages and 80 switches (`(32/2) \u00d7 log\u2082(32) = 16 \u00d7 5 = 80`)", "B": "5 stages and 160 switches", "C": "16 stages and 32 switches", "D": "32 stages and 1024 switches"}, "correctAnswer": "A", "explanation": "An `N \u00d7 N` Omega network has `log\u2082(N) = log\u2082(32) = 5` stages, with `N / 2 = 16` switches of size `2 \u00d7 2` per stage \u2192 `16 \u00d7 5 = 80` switches total.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Interconnection Networks", "subtopic": "Multistage Omega Network Switches", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-008", "question": "A 5-dimensional Hypercube (Binary 5-Cube) multiprocessor interconnection network has `N = 2\u2075 = 32` nodes. What are the (i) node degree (ports per node), (ii) network diameter (max shortest-path hops), and (iii) total number of bidirectional communication links?", "options": {"A": "Degree = 5, Diameter = 5, Total Links = 80 (`5 \u00d7 2\u2074`)", "B": "Degree = 32, Diameter = 5, Total Links = 160", "C": "Degree = 5, Diameter = 16, Total Links = 64", "D": "Degree = 4, Diameter = 4, Total Links = 32"}, "correctAnswer": "A", "explanation": "In an n-Cube Hypercube (`N = 2^n`, here `n = 5`): Degree = `n = 5`; Diameter = `n = 5` (max Hamming distance between 5-bit node IDs); Total links = `n \u00d7 2^(n \u2212 1) = 5 \u00d7 16 = 80`.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Interconnection Networks", "subtopic": "Binary n-Cube (Hypercube) Topology", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-009", "question": "What is the key difference between Symmetric Multiprocessing (SMP) and Asymmetric Multiprocessing (AMP)?", "options": {"A": "In SMP, all processors are equal peers sharing one OS instance and memory; in AMP, one Master processor runs the OS and schedules tasks onto Slave processors", "B": "SMP uses only 1 processor", "C": "AMP does not use main memory", "D": "SMP processors cannot share cache"}, "correctAnswer": "A", "explanation": "In SMP, every CPU core can run user threads or OS kernel code symmetrically; in AMP, a designated Master CPU controls the system and assigns work to Slave CPUs.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "SMP vs AMP", "subtopic": "Symmetric vs Asymmetric Multiprocessing", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-010", "question": "In a Vector Processor (such as the Cray-1), what is 'Vector Chaining'?", "options": {"A": "The vector architectural equivalent of pipeline Operand Forwarding: feeding the element-by-element output stream of one vector functional unit (e.g., Vector Multiplier) directly into the input stream of another vector unit (e.g., Vector Adder) without waiting for the entire 64-element vector to finish!", "B": "Linking multiple hard disks in RAID 0", "C": "Connecting keyboards in a daisy c
