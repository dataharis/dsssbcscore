}, {"id": "MOCK-23", "title": "Mock Test 23: DSSSB TGT Computer Science Full-Syllabus CBT Mock 2", "category": "Full-Length", "durationMins": 30, "questionIds": ["COA-A-004", "COA-B-009", "COA-B-024", "COA-C-014", "COA-D-004", "COA-E-004", "COA-E-019", "COA-F-014", "COA-G-004", "COA-G-019", "COA-H-009", "COA-I-004", "COA-I-019", "COA-J-014", "COA-J-029", "COA-K-014", "COA-L-004", "COA-L-019", "COA-L-034", "COA-M-014", "COA-N-004", "COA-N-019", "COA-O-009", "COA-P-004", "COA-Q-004", "COA-Q-019", "COA-R-014", "COA-S-014", "COA-T-009", "COA-U-009"]}, {"id": "MOCK-24", "title": "Mock Test 24: DSSSB PGT / KVS PGT Computer Science Full-Syllabus Mock 3", "category": "Full-Length", "durationMins": 30, "questionIds": ["COA-A-007", "COA-B-012", "COA-C-002", "COA-C-017", "COA-D-007", "COA-E-007", "COA-F-002", "COA-F-017", "COA-G-007", "COA-G-022", "COA-H-012", "COA-I-007", "COA-J-002", "COA-J-017", "COA-K-002", "COA-K-017", "COA-L-007", "COA-L-022", "COA-M-002", "COA-M-017", "COA-N-007", "COA-N-022", "COA-O-012", "COA-P-007", "COA-Q-007", "COA-R-002", "COA-S-002", "COA-S-017", "COA-T-012"]}, {"id": "MOCK-25", "title": "Mock Test 25: NVS / State TGT-PGT Full-Syllabus Mock 4", "category": "Full-Length", "durationMins": 30, "questionIds": ["COA-A-010", "COA-B-015", "COA-C-005", "COA-C-020", "COA-D-010", "COA-E-010", "COA-F-005", "COA-F-020", "COA-G-010", "COA-G-025", "COA-H-015", "COA-I-010", "COA-J-005", "COA-J-020", "COA-K-005", "COA-K-020", "COA-L-010", "COA-L-025", "COA-M-005", "COA-M-020", "COA-N-010", "COA-N-025", "COA-O-015", "COA-P-010", "COA-Q-010", "COA-R-005", "COA-S-005", "COA-S-020", "COA-T-015"]}, {"id": "MOCK-26", "title": "Mock Test 26: Final Exam-Trap & Expected Questions Grand Mock 5", "category": "Full-Length", "durationMins": 30, "questionIds": ["COA-B-003", "COA-B-018", "COA-C-008", "COA-C-023", "COA-D-013", "COA-E-013", "COA-F-008", "COA-F-023", "COA-G-013", "COA-H-003", "COA-H-018", "COA-I-013", "COA-J-008", "COA-J-023", "COA-K-008", "COA-K-023", "COA-L-013", "COA-L-028", "COA-M-008", "COA-M-023", "COA-N-013", "COA-O-003", "COA-O-018", "COA-P-013", "COA-Q-013", "COA-R-008", "COA-S-008", "COA-T-003", "COA-U-003"]}], "glossary": [{"term": "Computer Architecture", "def": "The conceptual design and fundamental operational structure of a computer system as seen by the assembly/machine language programmer (e.g., instruction set, number of bits used for data types, I/O mechanisms, and addressing modes).", "module": "A. COA Introduction", "code": "A"}, {"term": "Computer Organization", "def": "The operational units and their interconnections that realize the architectural specifications (e.g., control signals, interfaces between computer and peripherals, memory technology used, and hardware adders/multipliers).", "module": "A. COA Introduction", "code": "A"}, {"term": "Stored-Program Concept", "def": "Introduced by John von Neumann (1945) for the EDVAC design; it states that both program instructions and data are stored in the same read-write electronic main memory in binary format.", "module": "A. COA Introduction", "code": "A"}, {"term": "Von Neumann Bottleneck", "def": "The throughput limitation caused by a single shared system bus between the CPU and main memory for both instruction fetches and data transfers, preventing simultaneous instruction fetch and data access.", "module": "A. COA Introduction", "code": "A"}, {"term": "Harvard Architecture", "def": "A computer architecture with physically separate storage and separate signal pathways (buses) for instructions and data, enabling concurrent instruction fetch and data read/write.", "module": "A. COA Introduction", "code": "A"}, {"term": "Radix (Base r)", "def": "The number of unique digits used in a positional number system (e.g., r=2 for Binary {0,1}, r=8 for Octal {0..7}, r=16 for Hexadecimal {0..9, A..F}).", "module": "B. Data Representation", "code": "B"}, {"term": "r's Complement (2's Complement)", "def": "For an n-digit number N in base r, the r's complement is r^n - N (for N != 0). In binary, 2's complement = 1's complement + 1.", "module": "B. Data Representation", "code": "B"}, {"term": "(r-1)'s Complement (1's Complement)", "def": "For an n-digit number N in base r, it is (r^n - 1) - N. In binary, obtained by inverting every bit (0 -> 1 and 1 -> 0).", "module": "B. Data Representation", "code": "B"}, {"term": "Sign Extension", "def": "Increasing the bit-width of a signed 2's complement number while preserving its value and sign by replicating the Most Significant Bit (MSB / sign bit) into all newly added left positions.", "module": "B. Data Representation", "code": "B"}, {"term": "IEEE 754 Standard", "def": "The universal standard for floating-point representation using three fields: Sign (S), Biased Exponent (E = e + Bias), and Fractional Mantissa/Significand (M), representing (-1)^S \u00d7 (1.M)_2 \u00d7 2^(E - Bias).", "module": "B. Data Representation", "code": "B"}, {"term": "Carry Propagate (P_i) & Generate (G_i)", "def": "In a Carry Look-Ahead Adder, G_i = A_i \u00b7 B_i generates a carry regardless of input carry, while P_i = A_i \u2295 B_i propagates an incoming carry C_i to C_(i+1) = G_i + P_i \u00b7 C_i.", "module": "C. Arithmetic & ALU", "code": "C"}, {"term": "Booth's Algorithm", "def": "A signed 2's complement multiplication algorithm that inspects adjacent multiplier bit pairs (Q_0, Q_-1) to add, subtract, or skip the multiplicand followed by an Arithmetic Shift Right (ashr).", "module": "C. Arithmetic & ALU", "code": "C"}, {"term": "Arithmetic Shift Right (ASHR)", "def": "Shifts all bits right by 1 position while preserving the MSB sign bit (R[n-1] remains unchanged), effectively dividing a signed 2's complement number by 2 (floor division).", "module": "C. Arithmetic & ALU", "code": "C"}, {"term": "Status Flags (PSW)", "def": "Flip-flops in the Status/Flag Register set by the ALU after an operation: Zero (Z=1 if result is 0), Sign (S=MSB of result), Carry (C=1 on unsigned carry/borrow out), Overflow (V=1 on signed 2's complement overflow).", "module": "C. Arithmetic & ALU", "code": "C"}, {"term": "Micro-operation", "def": "An elementary operation performed during one clock pulse on the binary information stored in one or more registers (verified in KVS PGT CS and DSSSB TGT CS 2021).", "module": "D. RTL & Micro-ops", "code": "D"}, {"term": "Register Transfer Language (RTL)", "def": "A symbolic notation for describing micro-operation transfers among registers (e.g., R2 \u2190 R1) and the control conditions governing them (e.g., P: R2 \u2190 R1).", "module": "D. RTL & Micro-ops", "code": "D"}, {"term": "Common Bus System", "def": "A shared communication pathway constructed using either Multiplexers (MUXes) or Three-State (Tri-State) Buffers to transfer words between multiple registers without dedicated point-to-point wiring.", "module": "D. RTL & Micro-ops", "code": "D"}, {"term": "Program Counter (PC)", "def": "A 12-bit register (in Mano's 4K computer) that holds the memory address of the NEXT instruction to be fetched and executed (verified in DSSSB PGT CS 11 Jul 2021 Q1).", "module": "E. Basic Computer", "code": "E"}, {"term": "Instruction Register (IR)", "def": "A 16-bit register required by the Control Unit that holds the instruction code currently being decoded and executed (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q133).", "module": "E. Basic Computer", "code": "E"}, {"term": "Memory Address Register (MAR / AR)", "def": "A 12-bit register that holds the address for main memory read/write operations; connected directly to the memory address bus.", "module": "E. Basic Computer", "code": "E"}, {"term": "Memory Data Register (MDR / DR)", "def": "A 16-bit register that holds the operand/data read from or waiting to be written to main memory.", "module": "E. Basic Computer", "code": "E"}, {"term": "Accumulator (AC)", "def": "The primary 16-bit processor register that supplies one operand to the ALU and stores the result of arithmetic/logic operations.", "module": "E. Basic Computer", "code": "E"}, {"term": "Opcode (Operation Code)", "def": "The group of bits in an instruction that specifies the operation to be performed (e.g., ADD, SUB, LOAD, BRANCH). k opcode bits support up to 2^k distinct operations.", "module": "F. ISA & Formats", "code": "F"}, {"term": "Three-Address Instruction", "def": "Format `ADD R1, R2, R3` (`R1 \u2190 R2 + R3`). Preserves both source operands, requires the fewest instructions per expression, but needs the longest binary instruction word.", "module": "F. ISA & Formats", "code": "F"}, {"term": "Two-Address Instruction", "def": "Format `ADD R1, R2` (`R1 \u2190 R1 + R2`). Overwrites one source operand unless a `MOV` instruction is used.", "module": "F. ISA & Formats", "code": "F"}, {"term": "One-Address Instruction", "def": "Format `ADD X` (`AC \u2190 AC + M[X]`). Uses an implicit Accumulator (AC) register for one source and the destination.", "module": "F. ISA & Formats", "code": "F"}, {"term": "Zero-Address Instruction", "def": "Format `ADD` (`TOS \u2190 TOS + Second_On_Stack`). Used in Stack-organized CPUs where operands are implicitly popped from the top of the stack; only `PUSH X` and `POP X` specify an address.", "module": "F. ISA & Formats", "code": "F"}, {"term": "Effective Address (EA)", "def": "The actual memory address (or register identifier) where the operand resides, computed by the CPU during the instruction execution/decode phase.", "module": "G. Addressing Modes", "code": "G"}, {"term": "Immediate Addressing", "def": "The instruction's operand field contains the actual constant data value itself rather than an address (e.g., `MOV R1, #50`). Zero memory accesses required during execution!", "module": "G. Addressing Modes", "code": "G"}, {"term": "Direct Addressing", "def": "The address field of the instruction contains the actual effective address of the operand in main memory (`EA = A`, `Operand = M[A]`) (verified in DSSSB TGT CS 12 Sep 2025 Shift 2 Q74).", "module": "G. Addressing Modes", "code": "G"}, {"term": "Register Indirect Addressing", "def": "The instruction specifies a CPU register whose contents give the effective address of the operand in memory (`EA = R`, `Operand = M[R]`) (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q127).", "module": "G. Addressing Modes", "code": "G"}, {"term": "Control Word", "def": "A binary string of control variables (e.g., 14 bits `SELA | SELB | SELD | OPR` in Mano's 7-register CPU) that specifies a complete micro-operation across the register file and ALU in 1 clock cycle.", "module": "H. CPU Organization", "code": "H"}, {"term": "Superscalar Processor", "def": "A processor containing multiple parallel execution pipelines that can fetch, decode, and issue MORE THAN ONE instruction per clock cycle (`IPC > 1`, so `CPI < 1`).", "module": "H. CPU Organization", "code": "H"}, {"term": "Simultaneous Multithreading (SMT / Hyper-Threading)", "def": "Allows multiple hardware threads to issue instructions to a superscalar processor's execution units in the same clock cycle, improving functional unit utilization.", "module": "H. CPU Organization", "code": "H"}, {"term": "Hardwired Control Unit", "def": "Implements control logic using fixed combinational gates, decoders, flip-flops, and a sequence counter (state machine). Very fast (1 cycle), used in RISC CPUs, but difficult to modify.", "module": "I. Control Unit", "code": "I"}, {"term": "Microprogrammed Control Unit", "def": "Invented by Maurice Wilkes (1951); stores control signals as binary microinstructions inside a fast read-only Control Memory (Control ROM) (verified in DSSSB TGT CS 12 Sep 2025 Shift 2 Q73).", "module": "I. Control Unit", "code": "I"}, {"term": "Horizontal Microprogramming", "def": "Uses unencoded control fields (1 bit per control line): wide microinstruction word, high parallelism, zero decoding delay.", "module": "I. Control Unit", "code": "I"}, {"term": "Vertical Microprogramming", "def": "Uses encoded control fields of `\u2308log\u2082(N + 1)\u2309` bits per mutually exclusive group that are decoded by external `k \u00d7 2^k` decoders: narrow microinstruction word, requires decoder delay.", "module": "I. Control Unit", "code": "I"}, {"term": "Instruction Pipelining", "def": "Decomposing instruction execution into k sequential stages separated by inter-stage pipeline registers (latches) so k instructions execute concurrently in different stages.", "module": "J. Pipelining", "code": "J"}, {"term": "Structural Hazard", "def": "Occurs when two instructions in different pipeline stages attempt to use the same hardware resource in the same clock cycle (e.g., unified memory accessed by both IF and MEM stages).", "module": "J. Pipelining", "code": "J"}, {"term": "Data Hazard (RAW / WAR / WAW)", "def": "Occurs when an instruction depends on the data result of a previous instruction still in the pipeline. RAW (Read-After-Write) is a true dependency; WAR (Anti-dependency) and WAW (Output dependency) are name dependencies.", "module": "J. Pipelining", "code": "J"}, {"term": "Control (Branch) Hazard", "def": "Occurs when a branch instruction changes the Program Counter (PC), invalidating instructions already fetched into the pipeline after the branch.", "module": "J. Pipelining", "code": "J"}, {"term": "Operand Forwarding (Bypassing)", "def": "Hardware feedback paths that route ALU results directly from the EX/MEM or MEM/WB pipeline registers back to the ALU inputs, eliminating most RAW stalls.", "module": "J. Pipelining", "code": "J"}, {"term": "SRAM (Static RAM)", "def": "Stores each bit in a bistable flip-flop latch (typically 6 CMOS transistors). Retains data as long as power is supplied (no periodic refresh needed), very fast (~1\u20135 ns), expensive, low density\u2014used for CPU Cache Memory.", "module": "K. Memory Org", "code": "K"}, {"term": "DRAM (Dynamic RAM)", "def": "Stores each bit as electric charge on a tiny capacitor plus 1 access transistor (1T1C cell). Charge leaks within milliseconds, requiring periodic refresh cycles and destructive read restoration; high density, lower cost\u2014used for Main Memory.", "module": "K. Memory Org", "code": "K"}, {"term": "Associative Memory (CAM)", "def": "Content-Addressable Memory accessed simultaneously in parallel by data CONTENT rather than by physical address (used in Fully Associative Cache tags and TLBs).", "module": "K. Memory Org", "code": "K"}, {"term": "Memory Cycle Time", "def": "The minimum time required between the start of two successive main memory accesses (`t_cycle \u2265 t_access`; in DRAM, `t_cycle = t_access + t_restore` because reads are destructive).", "module": "K. Memory Org", "code": "K"}, {"term": "Hit Ratio (h) & Miss Ratio (1 \u2212 h)", "def": "Hit Ratio h = Hits / (Hits + Misses) is the fraction of memory references found in the cache. Miss Ratio m = 1 \u2212 h.", "module": "L. Cache Memory", "code": "L"}, {"term": "Average Memory Access Time (AMAT)", "def": "AMAT = T_hit + (1 \u2212 h) \u00d7 T_miss_penalty (for sequential lookup) or h \u00d7 T_cache + (1 \u2212 h) \u00d7 T_main (when T_main includes cache check).", "module": "L. Cache Memory", "code": "L"}, {"term": "Direct Mapping", "def": "Each main memory block j can map to ONLY ONE specific cache line: `Line = j mod N_lines`. Simple hardware (1 comparator), zero replacement policy needed, but suffers from high conflict/thrashing misses.", "module": "L. Cache Memory", "code": "L"}, {"term": "Fully Associative Mapping", "def": "Any main memory block can be placed in ANY cache line. Address has only `[ Tag | Offset ]` (Index bits = 0). Zero conflict misses, but requires N_lines parallel comparators.", "module": "L. Cache Memory", "code": "L"}, {"term": "k-Way Set-Associative Mapping", "def": "Divides N_lines into `S = N_lines / k` sets of `k` lines each. Block `j` maps to `Set = j mod S` and can occupy any of the `k` lines in that set (uses `k` comparators).", "module": "L. Cache Memory", "code": "L"}, {"term": "Logical (Virtual) Address", "def": "An address generated by the CPU during program execution, consisting of `[ Page Number (p) | Page Offset (d) ]`.", "module": "M. Virtual Memory", "code": "M"}, {"term": "Physical Address", "def": "The actual address placed on the main memory (RAM) address bus after MMU translation, consisting of `[ Frame Number (f) | Page Offset (d) ]`.", "module": "M. Virtual Memory", "code": "M"}, {"term": "Page & Frame", "def": "Virtual address space is divided into fixed-size blocks called Pages; Physical RAM is divided into fixed-size blocks of the EXACT SAME SIZE called Frames (`Page Size = Frame Size`, verified in DSSSB PGT CS 11 Jul 2021 Q29).", "module": "M. Virtual Memory", "code": "M"}, {"term": "Translation Lookaside Buffer (TLB)", "def": "A small, ultra-fast hardware associative cache inside the MMU that caches recent `Virtual Page Number \u2192 Physical Frame Number` translations.", "module": "M. Virtual Memory", "code": "M"}, {"term": "Page Fault", "def": "A synchronous hardware trap raised by the MMU when a referenced page's Valid/Present bit in the Page Table Entry is `0` (page is not currently in RAM) (verified in DSSSB TGT CS 24 Jun 2023 Shift 3 Q118).", "module": "M. Virtual Memory", "code": "M"}, {"term": "Thrashing", "def": "A pathological state where a system spends more time paging (swapping pages between RAM and disk) than executing CPU instructions because total working set exceeds physical frames.", "module": "M. Virtual Memory", "code": "M"}, {"term": "I/O Interface Unit", "def": "Hardware circuitry sitting between the CPU system bus and peripheral devices that resolves differences in operating speed, signal levels, data codes/formats, and synchronization (verified in DSSSB PGT CS 11 Jul 2021 Q2).", "module": "N. I/O Organization", "code": "N"}, {"term": "Programmed I/O", "def": "Data transfer controlled entirely by CPU software instructions; the CPU stays in a busy-wait polling loop repeatedly reading the device Status Register until the Ready flag is set.", "module": "N. I/O Organization", "code": "N"}, {"term": "Interrupt-Driven I/O", "def": "The CPU issues an I/O command and continues executing other work; when the peripheral is ready, it asserts an Interrupt Request (INTR) line to the CPU.", "module": "N. I/O Organization", "code": "N"}, {"term": "Direct Memory Access (DMA)", "def": "High-speed I/O technique where a dedicated DMA Controller takes control of the memory bus (`Bus Request BR` \u2192 `Bus Grant BG = 1`) and transfers data blocks directly between I/O devices and Main Memory without involving the CPU for each word (verified in KVS PGT CS and DSSSB TGT CS 7 Feb 2024 Shift 2 Q138).", "module": "N. I/O Organization", "code": "N"}, {"term": "Interrupt Masking", "def": "Temporarily disabling or ignoring maskable interrupts by clearing the Interrupt Enable flip-flop or setting bits in an Interrupt Mask Register (verified in DSSSB TGT CS 1 Aug 2021 Shift 1 Q53).", "module": "O. Interrupts", "code": "O"}, {"term": "Non-Maskable Interrupt (NMI)", "def": "A highest-priority hardware interrupt that CANNOT be disabled by software instructions (e.g., power failure, catastrophic memory parity error, Intel 8085 TRAP).", "module": "O. Interrupts", "code": "O"}, {"term": "Vectored Interrupt", "def": "An interrupt where the interrupting device itself supplies the branch address (or vector number into the Interrupt Vector Table) of its Interrupt Service Routine (ISR).", "module": "O. Interrupts", "code": "O"}, {"term": "Daisy Chaining Priority", "def": "A serial hardware priority scheme where the Interrupt Acknowledge (`INTA`) signal propagates sequentially from the highest-priority device (closest to CPU) to the lowest-priority device.", "module": "O. Interrupts", "code": "O"}, {"term": "Address Bus (Unidirectional)", "def": "Unidirectional lines driven by the current Bus Master (CPU or DMA controller) to specify the memory or I/O port address. `k` address lines address `2^k` locations.", "module": "P. Bus Structure", "code": "P"}, {"term": "Data Bus (Bidirectional)", "def": "Bidirectional lines that carry instructions and data between CPU, Memory, and I/O. Width (`n` bits) determines how many bits are transferred in parallel per bus cycle.", "module": "P. Bus Structure", "code": "P"}, {"term": "Control Bus", "def": "Carries command, timing, and status signals (`MemR`, `MemW`, `IOR`, `IOW`, `INTR`, `INTA`, `BR`, `BG`, `CLK`, `RESET`). Individual lines are unidirectional, while the bus as a whole transfers signals in both directions.", "module": "P. Bus Structure", "code": "P"}, {"term": "Bus Arbitration", "def": "The mechanism by which the next Bus Master is selected when multiple devices (CPU, DMA controllers, bus-mastering I/O cards) request control of the shared system bus simultaneously.", "module": "P. Bus Structure", "code": "P"}, {"term": "Flynn's Taxonomy (1966)", "def": "Classifies computer architectures by the multiplicity of Instruction Streams (IS) and Data Streams (DS): SISD, SIMD, MISD, and MIMD.", "module": "Q. Parallel Processing", "code": "Q"}, {"term": "Tightly Coupled (Shared Memory) vs Loosely Coupled (Distributed)", "def": "Distributed/multicomputer systems are loosely coupled (private memory, message passing), whereas shared-memory multiprocessors are tightly coupled (verified in DSSSB PGT CS 11 Jul 2021 Q166).", "module": "Q. Parallel Processing", "code": "Q"}, {"term": "Amdahl's Law", "def": "Formulated by Gene Amdahl (1967): If a fraction P of a program can be parallelized across N processors and (1 \u2212 P) is strictly serial, overall speedup is S(N) = 1 / [(1 \u2212 P) + (P / N)].", "module": "Q. Parallel Processing", "code": "Q"}, {"term": "RISC (Reduced Instruction Set Computer)", "def": "Architecture that keeps only a small set of simple, fixed-length instructions executing in a single clock cycle via hardwired control and a Load-Store register model (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q125 & UTpaper Q4154).", "module": "R. RISC & CISC", "code": "R"}, {"term": "CISC (Complex Instruction Set Computer)", "def": "Architecture featuring a large set of complex, variable-length instructions capable of multi-step operations and direct memory-to-memory/register-memory arithmetic, typically using microprogrammed control.", "module": "R. RISC & CISC", "code": "R"}, {"term": "Load-Store Architecture", "def": "A hallmark of RISC where ONLY explicit `LOAD` and `STORE` instructions access main memory; all arithmetic and logical instructions operate strictly on CPU registers.", "module": "R. RISC & CISC", "code": "R"}, {"term": "Overlapping Register Windows", "def": "A RISC technique (Berkeley RISC / SPARC) that divides a large physical register file into circular overlapping windows (Global, In, Local, Out registers) to pass procedure parameters without slow stack memory accesses!", "module": "R. RISC & CISC", "code": "R"}, {"term": "Performance (Perf_X)", "def": "Defined as the reciprocal of Execution Time: `Performance_X = 1 / Execution_Time_X`. Saying 'X is n times faster than Y' means `Execution_Time_Y / Execution_Time_X = n`.", "module": "S. Performance Eval", "code": "S"}, {"term": "CPI (Cycles Per Instruction)", "def": "The average number of clock cycles required to execute one instruction for a given program: `CPI = Total_Clock_Cycles / Instruction_Count`.", "module": "S. Performance Eval", "code": "S"}, {"term": "MIPS (Millions of Instructions Per Second)", "def": "Rate of instruction execution: `MIPS = Instruction_Count / (Execution_Time \u00d7 10^6) = Clock_Rate_in_MHz / CPI`.", "module": "S. Performance Eval", "code": "S"}, {"term": "Dynamic Power Consumption", "def": "Power consumed by CMOS transistor switching: `P_dynamic \u221d C_load \u00d7 V_dd\u00b2 \u00d7 f_clock`.", "module": "S. Performance Eval", "code": "S"}, {"term": "Seek Time (T_seek)", "def": "The mechanical time required to move the disk read/write head actuator radially to the target concentric track.", "module": "T. Storage & RAID", "code": "T"}, {"term": "Rotational Latency (T_rot)", "def": "The time required to wait for the disk platter to rotate until the desired sector comes under the read/write head (verified in DSSSB TGT CS 2021). Average rotational latency = \u00bd \u00d7 Time of 1 full revolution = `30 / RPM` seconds!", "module": "T. Storage & RAID", "code": "T"}, {"term": "Cylinder", "def": "The set of all tracks having the exact same radius (track number) vertically aligned across all recording surfaces of all platters\u2014accessible without moving the read/write head assembly!", "module": "T. Storage & RAID", "code": "T"}, {"term": "RAID (Redundant Array of Independent Disks)", "def": "Combines multiple physical disks into a single logical unit to improve I/O throughput (via striping) and/or fault tolerance (via mirroring or parity).", "module": "T. Storage & RAID", "code": "T"}, {"term": "Cache Coherence Problem", "def": "In a multiprocessor with private per-core caches (L1/L2), if two cores cache the same memory block and one core modifies its copy, the other core's copy becomes stale/inconsistent.", "module": "U. Modern Arch", "code": "U"}, {"term": "MESI Protocol", "def": "A 4-state write-invalidate snoopy cache coherence protocol where every cache line is marked as **M**odified (dirty, only in this cache), **E**xclusive (clean, only in this cache), **S**hared (clean, may be in other caches), or **I**nvalid.", "module": "U. Modern Arch", "code": "U"}, {"term": "UMA vs. NUMA", "def": "In UMA (Uniform Memory Access), all processors access all main memory locations with identical latency over a shared bus/switch. In NUMA (Non-Uniform Memory Access), each processor socket has its own fast Local RAM, while accessing another socket's Remote RAM over an interconnect takes longer.", "module": "U. Modern Arch", "code": "U"}, {"term": "System-on-Chip (SoC)", "def": "Integrates CPU cores, GPU, NPU, memory controllers, I/O interfaces, andDSP/modems onto a single silicon die (e.g., Apple M-series, Snapdragon, Raspberry Pi Broadcom SoC).", "module": "U. Modern Arch", "code": "U"}, {"term": "Accumulator (AC)", "def": "Primary processor register in 1-address CPUs that supplies one ALU operand and receives the result.", "module": "E. Basic Computer", "code": "E"}, {"term": "ALE (Address Latch Enable)", "def": "Control signal in Intel 8085/8086 pulsed high during T1 to latch the lower address bits from the multiplexed AD0\u2013AD7 bus.", "module": "P. Bus Structure", "code": "P"}, {"term": "Belady's Anomaly", "def": "Phenomenon in non-stack page replacement policies (such as FIFO) where allocating more physical frames increases page faults.", "module": "M. Virtual Memory", "code": "M"}, {"term": "Barrel Shifter", "def": "Combinational log2(n)-stage multiplexer network that shifts or rotates a data word by any number of bits in 1 clock cycle.", "module": "D. RTL & Micro-ops", "code": "D"}, {"term": "Branch Target Buffer (BTB)", "def": "Small cache indexed by PC in the IF stage that predicts the target address of taken branches before instruction decode.", "module": "J. Pipelining", "code": "J"}, {"term": "Burst Mode DMA", "def": "DMA mode where the DMA controller retains the memory bus continuously until a complete multi-word data block is transferred.", "module": "N. I/O Organization", "code": "N"}, {"term": "Cycle Stealing DMA", "def": "DMA mode where the controller steals one memory bus cycle at a time to transfer 1 word, then yields bus control back to the CPU.", "module": "N. I/O Organization", "code": "N"}, {"term": "Dirty Bit (Modified Bit)", "def": "1-bit status flag in a Write-Back cache line or Page Table Entry set to 1 when the block/page is written to, indicating it must be written back to RAM/disk upon eviction.", "module": "L. Cache Memory", "code": "L"}, {"term": "Expanding Opcode", "def": "Instruction encoding technique that varies opcode field length to support 3-, 2-, 1-, and 0-address instructions in a fixed-size instruction word.", "module": "F. ISA & Formats", "code": "F"}, {"term": "False Sharing", "def": "Multiprocessor cache performance degradation when threads on different cores modify independent variables residing in the same cache line.", "module": "Q. Parallel Processing", "code": "Q"}, {"term": "Guard, Round, and Sticky Bits", "def": "Three extra precision bits maintained by IEEE 754 floating-point units during right-shift alignment to ensure exact round-to-nearest-even rounding.", "module": "C. Arithmetic & ALU", "code": "C"}, {"term": "Inverted Page Table", "def": "Global page table with exactly one entry per physical RAM frame (indexed by frame number and storing PID + VPN), minimizing page table memory overhead in 64-bit systems.", "module": "M. Virtual Memory", "code": "M"}, {"term": "Load-Use Hazard", "def": "RAW data hazard where a LOAD instruction is immediately followed by an instruction that uses the loaded register, requiring 1 stall cycle even with operand forwarding.", "module": "J. Pipelining", "code": "J"}, {"term": "Reorder Buffer (ROB)", "def": "Hardware queue in Out-of-Order superscalar CPUs that ensures instructions commit results in strict program order for precise exceptions.", "module": "H. CPU Organization", "code": "H"}, {"term": "Victim Cache", "def": "Small fully associative cache placed behind a direct-mapped L1 cache to hold blocks recently evicted due to conflict misses.", "module": "L. Cache Memory", "code": "L"}, {"term": "Wilkes' Control Unit", "def": "Original 1951 microprogrammed control unit architecture using a diode matrix for control signals and next-microinstruction sequencing.", "module": "I. Control Unit", "code": "I"}, {"term": "Working Set W(t, \u0394)", "def": "Set of unique virtual pages referenced by a process during the trailing time window \u0394; used by the OS to prevent thrashing.", "module": "M. Virtual Memory", "code": "M"}]};

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.completedModules = parsed.completedModules || {};
          state.attempts = parsed.attempts || {};
          state.bookmarks = parsed.bookmarks || {};
          state.reviewMarks = parsed.reviewMarks || {};
          state.mockHistory = parsed.mockHistory || [];
          if (typeof parsed.darkMode === 'boolean') state.darkMode = parsed.darkMode;
        }
      } catch (e) {
        // Fallback to in-memory state in restricted iframe environments
      }
      applyTheme();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          completedModules: state.completedModules,
          attempts: state.attempts,
          bookmarks: state.bookmarks,
          reviewMarks: state.reviewMarks,
          mockHistory: state.mockHistory,
          darkMode: state.darkMode
        }));
      } catch (e) {}
      updateHeaderScorePill();
    }

    function showToast(msg) {
      const t = document.getElementById('app-toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    function openAppModal(title, body, onConfirm) {
      const m = document.getElementById('app-modal');
      document.getElementById('app-modal-title').textContent = title;
      document.getElementById('app-modal-body').textContent = body;
      const btn = document.getElementById('app-modal-confirm-btn');
      btn.onclick = () => {
        closeAppModal();
        if (onConfirm) onConfirm();
      };
      m.classList.remove('hidden');
    }

    function closeAppModal() {
      document.getElementById('app-modal').classList.add('hidden');
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveState();
    }

    function applyTheme() {
      const htmlEl = document.documentElement;
      const bodyEl = document.getElementById('app-body');
      const iconEl = document.getElementById('theme-icon');
      if (state.darkMode) {
        htmlEl.classList.add('dark');
        if (bodyEl) {
          bodyEl.className = 'bg-slate-950 text-slate-100 min-h-screen flex flex-col transition-colors duration-200';
        }
        if (iconEl) iconEl.textContent = '☀️';
      } else {
        htmlEl.classList.remove('dark');
        if (bodyEl) {
          bodyEl.className = 'bg-slate-100 text-slate-900 min-h-screen flex flex-col transition-colors duration-200';
        }
        if (iconEl) iconEl.textContent = '🌙';
      }
    }

      sb.classList.toggle('hidden');
      sb.classList.toggle('fixed');

      sb.classList.toggle('left-0');
      sb.classList.toggle('top-14');

          : 'w-full text-left px-2.5 py-1.5 rounded-lg text-slate-300 hover:bg-slate-800/80 hover:text-white flex items-center gap-2 transition';
        groups[sec.group].push(`<button type="button" onclick="navigateTo('${sec.id}')" class="${btnClass}"><span>${sec.icon}</span><span class="truncate">${sec.label}</span></button>`);
      });
      document.getElementById('nav-group-core').innerHTML = groups.core.join('');

    function updateHeaderScorePill() {
      const total = APP_DATA.questions.length;
      const attemptedIds = Object.keys(state.attempts);
      const correctCount = attemptedIds.filter(id => state.attempts[id].isCorrect).length;
      const acc = attemptedIds.length ? Math.round((correctCount / attemptedIds.length) * 100) : 0;
      const el = document.getElementById('header-accuracy-text');
      if (el) el.textContent = `${attemptedIds.length}/${total} Solved (${acc}% Acc)`;
    }

    function navigateTo(sectionId, param) {
      state.currentSection = sectionId;
      if (param) {
        if (sectionId === 'study-notes') state.activeStudyModule = param;
        if (sectionId === 'simulators') state.activeSimulator = param;
      }
      // Close mobile sidebar if open
      const sb = document.getElementById('sidebar-nav');
      if (sb && sb.classList.contains('fixed')) {
        toggleMobileSidebar();
      }
      renderSidebar();
      renderMainView();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToModulePractice(modCode, numCat) {
      state.practiceConfig.moduleCode = modCode || 'ALL';
      state.practiceConfig.difficulty = 'ALL';
      state.practiceConfig.sourceType = 'ALL';
      state.practiceConfig.questionType = 'ALL';
      state.practiceConfig.numericalCategory = numCat || 'ALL';
      state.practiceConfig.limit = 50;
      state.practiceConfig.currentIndex = 0;
      buildPracticeList();
      navigateTo('practice');
    }

    function practiceWeakTopics() {
      // Compute module with lowest accuracy (or highest unattempted if none attempted)
      const modStats = APP_DATA.modules.map(m => {
        const qs = APP_DATA.questions.filter(q => q.moduleCode === m.code);
        const att = qs.filter(q => state.attempts[q.id]);
        const corr = att.filter(q => state.attempts[q.id].isCorrect);
        const acc = att.length ? (corr.length / att.length) * 100 : -1;
        return { code: m.code, acc, attempted: att.length };
      });
      const attemptedMods = modStats.filter(m => m.attempted > 0).sort((a, b) => a.acc - b.acc);
      const targetMod = attemptedMods.length ? attemptedMods[0].code : 'L'; // Default to high-weightage Cache Memory if no attempts yet
      showToast(`Launching focused practice on Module ${targetMod}!`);
      jumpToModulePractice(targetMod);
    }

    // GLOBAL SEARCH ENGINE
    function handleGlobalSearch(query) {
      const panel = document.getElementById('global-search-panel');
      const clearBtn = document.getElementById('clear-global-search-btn');
      const q = (query || '').trim().toLowerCase();
      if (!q || q.length < 2) {
        panel.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }
      clearBtn.classList.remove('hidden');
      panel.classList.remove('hidden');

      const matchedMods = APP_DATA.modules.filter(m =>
        m.title.toLowerCase().includes(q) ||
        m.intro.toLowerCase().includes(q) ||
        m.subtopics.some(s => s.toLowerCase().includes(q))
      ).slice(0, 5);

      const matchedTerms = APP_DATA.glossary.filter(g =>
        g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q)
      ).slice(0, 6);

      const matchedQs = APP_DATA.questions.filter(item =>
        item.id.toLowerCase().includes(q) ||
        item.question.toLowerCase().includes(q) ||
        item.topic.toLowerCase().includes(q) ||
        item.subtopic.toLowerCase().includes(q) ||
        item.explanation.toLowerCase().includes(q)
      ).slice(0, 12);

      document.getElementById('global-search-title').textContent = `Search Results for "${query}" (${matchedMods.length} Modules, ${matchedTerms.length} Definitions, ${matchedQs.length}+ Questions)`;

      let html = '';
      if (matchedMods.length) {
        html += `<div><div class="text-xs font-bold uppercase text-sky-400 mb-1.5">Matching Syllabus Modules</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
        matchedMods.forEach(m => {
          html += `<div onclick="clearGlobalSearch(); navigateTo('study-notes', '${m.code}')" class="p-2.5 rounded-lg bg-slate-800/90 hover:bg-slate-800 border border-slate-700 cursor-pointer">
            <div class="text-xs font-bold text-white">${m.title}</div>
            <div class="text-[11px] text-slate-400 truncate mt-0.5">${m.subtopics.join(' • ')}</div>
          </div>`;
        });
        html += `</div></div>`;
      }
      if (matchedTerms.length) {
        html += `<div><div class="text-xs font-bold uppercase text-emerald-400 mb-1.5">Definitions &amp; Architecture Terms</div><div class="space-y-1.5">`;
        matchedTerms.forEach(g => {
          html += `<div class="p-2 rounded-lg bg-slate-800/60 border border-slate-700/80 text-xs">
            <span class="font-bold text-emerald-300">${g.term}</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 ml-1">${g.module}</span>
            <p class="text-slate-300 mt-0.5">${g.def}</p>
          </div>`;
        });
        html += `</div></div>`;
      }
      if (matchedQs.length) {
        html += `<div><div class="text-xs font-bold uppercase text-amber-400 mb-1.5">Matching Questions (Click to Practice)</div><div class="space-y-2">`;
        matchedQs.forEach(item => {
          html += `<div onclick="openSpecificQuestion('${item.id}')" class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-slate-700 cursor-pointer text-xs">
            <div class="flex items-center justify-between gap-2 mb-1">
              <span class="font-mono font-bold text-sky-400">${item.id} (${item.module})</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-700 text-slate-200">${item.sourceType}${item.exam ? ' • ' + item.exam + ' (' + item.year + ')' : ''}</span>
            </div>
            <div class="text-slate-100 font-medium">${item.question}</div>
            <div class="text-[11px] text-emerald-400 mt-1">Ans (${item.correctAnswer}): ${item.options[item.correctAnswer]}</div>
          </div>`;
        });
        html += `</div></div>`;
      }
      if (!html) {
        html = `<div class="text-sm text-slate-400 py-6 text-center">No matching questions, modules, or formulas found for "${query}". Try keywords like "cache", "2's complement", "Booth", "DMA", "RISC", "pipeline", or "AMAT".</div>`;
      }
      document.getElementById('global-search-results').innerHTML = html;
    }

      state.practiceConfig.numericalCategory = 'ALL';
      state.practiceConfig.limit = 440;
      state.practiceConfig.activeList = APP_DATA.questions.slice();
      state.practiceConfig.currentIndex = idx;
      navigateTo('practice');

    function updateSimAddrMode() {
      const mode = document.getElementById('am-mode').value;

      const R1 = parseInt(document.getElementById('am-r1').value, 10) || 0;
      const XR = parseInt(document.getElementById('am-xr').value, 10) || 0;

      // Simulated deterministic memory function M[addr] = (addr * 2) + 50

      let ea = 'None (In Instruction / Register)';
      let op = 0;
      let formula = '';
      let memRefs = 0;

      if (mode === 'IMM') {
        formula = 'Operand = A (Constant inside instruction)';
        op = A;
        memRefs = 0;
      } else if (mode === 'DIR') {
        ea = A;
        op = memVal(ea);
        formula = `EA = A = ${A} → Operand = M[${A}] = ${op}`;
        memRefs = 1;
      } else if (mode === 'IND') {
        ea = memVal(A);
        op = memVal(ea);
        formula = `EA = M[A] = M[${A}] = ${ea} → Operand = M[${ea}] = ${op}`;
        memRefs = 2;
      } else if (mode === 'REG') {
        ea = 'Register R1';
        op = R1;
        formula = `Operand = Contents of Register R1 = ${R1}`;
        memRefs = 0;
      } else if (mode === 'REGIND') {
        ea = R1;
        op = memVal(ea);
        formula = `EA = (R1) = ${R1} → Operand = M[${R1}] = ${op}`;
        memRefs = 1;
      } else if (mode === 'REL') {
        ea = PC + A;
        op = memVal(ea);
        formula = `EA = PC_next + A = ${PC} + ${A} = ${ea} → Operand = M[${ea}] = ${op}`;
        memRefs = 1;
      } else if (mode === 'IDX' || mode === 'BASE') {
        ea = A + XR;
        op = memVal(ea);
        formula = `EA = A + XR/BR = ${A} + ${XR} = ${ea} → Operand = M[${ea}] = ${op}`;
        memRefs = 1;
      } else if (mode === 'AUTOINC') {
        ea = R1;
        op = memVal(ea);
        formula = `EA = (R1) = ${R1} → Operand = M[${R1}] = ${op}, then R1 ← ${R1} + 1 = ${R1 + 1}`;
        memRefs = 1;
      } else if (mode === 'AUTODEC') {
        ea = R1 - 1;
        op = memVal(ea);
        formula = `R1 ← ${R1} − 1 = ${ea}, then EA = ${ea} → Operand = M[${ea}] = ${op}`;

    function toBin8(n) {
      return ((n & 0xFF) >>> 0).toString(2).padStart(8, '0');
    }

    function updateSimBinArith() {
      let a = Math.max(-128, Math.min(127, parseInt(document.getElementById('ba-a').value, 10) || 0));
      let b = Math.max(-128, Math.min(127, parseInt(document.getElementById('ba-b').value, 10) || 0));
      const op = document.getElementById('ba-op').value;
      const effB = op === 'SUB' ? -b : b;
      const rawSum = a + effB;
      const overflow = rawSum < -128 || rawSum > 127;
      const wrapped = ((rawSum & 0xFF) << 24) >> 24;
      const onesA = ((~a) & 0xFF).toString(2).padStart(8, '0');

      document.getElementById('ba-int-out').innerHTML = `
        <div>A (${a}): 1's Comp = <span class="text-slate-400">${onesA}</span> | 8-Bit 2's Comp = <span class="text-sky-400 font-bold">${toBin8(a)}</span></div>
        <div>B (${b}): 8-Bit 2's Comp = <span class="text-sky-400 font-bold">${toBin8(b)}</span> ${op==='SUB' ? `(−B = ${toBin8(-b)})` : ''}</div>
        <div class="border-t border-slate-800 pt-1 text-emerald-400 font-bold">8-Bit Result: ${toBin8(rawSum)} (Signed 8-bit = ${wrapped}, True Algebraic = ${rawSum})</div>
        <div class="${overflow ? 'text-rose-400 font-bold' : 'text-slate-400'}">Overflow Flag (V = C7 ⊕ C8): ${overflow ? '1 (OVERFLOW DETECTED! Outside [-128, +127])' : '0 (No Overflow)'} | Zero Flag (Z): ${wrapped===0?1:0} | Sign Flag (S): ${(rawSum & 0x80)?1:0}</div>`;

      // IEEE 754 encoder using DataView
      const fVal = parseFloat(document.getElementById('ba-float').value) || 0;
      const buf = new ArrayBuffer(4);
      const view = new DataView(buf);
      view.setFloat32(0, fVal, false); // Big-endian for bit display
      const u32 = view.getUint32(0, false);
      const bin32 = u32.toString(2).padStart(32, '0');
      const signBit = bin32[0];
      const expBits = bin32.slice(1, 9);
      const mantBits = bin32.slice(9);
      const expDec = parseInt(expBits, 2);
      const hexStr = '0x' + u32.toString(16).toUpperCase().padStart(8, '0');

      document.getElementById('ba-float-out').innerHTML = `
        <div>Hexadecimal Encoding: <span class="text-amber-300 font-bold">${hexStr}</span></div>
        <div>Sign Bit (S, 1b): <span class="text-rose-400 font-bold">${signBit}</span> (${signBit==='1' ? 'Negative' : 'Positive'})</div>
        <div>Biased Exponent (E, 8b): <span class="text-sky-400 font-bold">${expBits}</span> (E = ${expDec}, True exp e = E − 127 = ${expDec - 127})</div>
        <div class="break-all">Mantissa Fraction (M, 23b): <span class="text-emerald-400 font-bold">${mantBits}</span></div>`;
    }

    // --- SIMULATOR F: BOOTH'S MULTIPLICATION VISUALIZER ---
    function renderSimBooth(stage) {
      stage.innerHTML = `
        <div class="space-y-4">

          <p class="text-xs text-slate-400">Enter two 5-bit signed integers (-15 to +15) to trace every cycle of Booth's Algorithm (<code>AC, QR, Q_-1, SC</code>).</p>
          <div class="flex flex-wrap items-end gap-3 bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-xs">
            <div>

            </div>

              <label class="font-bold text-slate-300 block mb-1">Multiplier QR (-15..15)</label>

            </div>
          </div>
          <div id="bm-table-out" class="overflow-x-auto"></div>

    }

    function updateSimBooth() {
      const m = Math.max(-15, Math.min(15, parseInt(document.getElementById('bm-m').value, 10) || 0));
      const q = Math.max(-15, Math.min(15, parseInt(document.getElementById('bm-q').value, 10) || 0));
      const n = 5;
      const mask = (1 << n) - 1;
      const toB = (v) => ((v & mask) >>> 0).toString(2).padStart(n, '0');

      let ac = 0;
      let qr = q & mask;
      let q_1 = 0;
      let rowsHtml = `
        <tr class="border-b border-slate-800 text-slate-300">
          <td class="p-2 font-mono">Init</td><td class="p-2 font-mono">-</td>
          <td class="p-2">Initialize AC=0, BR=${toB(m)} (${m}), −BR=${toB(-m)} (${-m})</td>
          <td class="p-2 font-mono text-sky-400">${toB(ac)}</td>
          <td class="p-2 font-mono text-amber-300">${toB(qr)}</td>
          <td class="p-2 font-mono">${q_1}</td>
          <td class="p-2 font-mono">${n}</td>
        </tr>`;

      for (let step = 1; step <= n; step++) {
        const q0 = qr & 1;
        const pair = `${q0}${q_1}`;
        let action = 'No arithmetic op; ashr(AC, QR, Q_-1)';
        if (q0 === 1 && q_1 === 0) {
          ac = (ac - m) & mask;
          action = `10 → Subtract BR (AC ← AC − BR = ${toB(ac)}), then ashr`;
        } else if (q0 === 0 && q_1 === 1) {
          ac = (ac + m) & mask;
          action = `01 → Add BR (AC ← AC + BR = ${toB(ac)}), then ashr`;
        }
        // Arithmetic Shift Right (AC, QR, Q_-1)
        q_1 = qr & 1;
        const acLsb = ac & 1;
        qr = (qr >>> 1) | (acLsb << (n - 1));
        const acSign = ac & (1 << (n - 1));
        ac = (ac >>> 1) | acSign;

        rowsHtml += `
          <tr class="border-b border-slate-800/80">
            <td class="p-2 font-mono font-bold text-white">Step ${step}</td>
            <td class="p-2 font-mono text-indigo-300 font-bold">${pair}</td>
            <td class="p-2 text-slate-300">${action}</td>
            <td class="p-2 font-mono text-sky-400 font-bold">${toB(ac)}</td>
            <td class="p-2 font-mono text-amber-300 font-bold">${toB(qr)}</td>
            <td class="p-2 font-mono">${q_1}</td>
            <td class="p-2 font-mono">${n - step}</td>
          </tr>`;
      }

      const prodBin = toB(ac) + toB(qr);
      document.getElementById('bm-table-out').innerHTML = `
        <table class="w-full text-left text-xs border border-slate-800 rounded-lg overflow-hidden">
          <thead class="bg-slate-800 text-slate-200">
            <tr><th class="p-2">Cycle</th><th class="p-2">(Q₀, Q₋₁)</th><th class="p-2">Operation Performed</th><th class="p-2">AC (5-bit)</th><th class="p-2">QR (5-bit)</th><th class="p-2">Q₋₁</th><th class="p-2">SC</th></tr>
          </thead>
          <tbody class="bg-slate-900/90">${rowsHtml}</tbody>
        </table>
        <div class="mt-3 p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/40 text-xs font-mono text-emerald-300 font-bold">
          Final 10-Bit 2's Complement Product (AC || QR) = ${prodBin}₂ = ${m * q}₁₀ (Verified: ${m} × ${q} = ${m * q})
        </div>`;
    }

    function updateSimCacheMap() {
      const mBits = parseInt(document.getElementById('cm-mem').value, 10);
      const cBits = parseInt(document.getElementById('cm-cache').value, 10);
      const bBits = parseInt(document.getElementById('cm-block').value, 10);

      const lBits = Math.max(0, cBits - bBits);
      const totalLines = 1 << lBits;
      let indexBits = 0;
      let setsCount = 1;
      if (assoc === 0) {
        indexBits = 0;
        setsCount = 1;
      } else {
        const kBits = Math.log2(assoc);
        indexBits = Math.max(0, lBits - kBits);
        setsCount = 1 << indexBits;
      }
      const tagBits = Math.max(0, mBits - indexBits - bBits);
      const blockNum = Math.floor(addr / (1 << bBits));
      const byteOffset = addr % (1 << bBits);
      const targetIndex = assoc === 0 ? 'Any of ' + totalLines + ' Lines' : (blockNum % setsCount);

      document.getElementById('cm-out').innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">

          <div class="text-emerald-400 font-bold">Mapped Destination: ${assoc === 1 ? 'Cache Line #' + targetIndex : (assoc === 0 ? targetIndex : 'Cache Set #' + targetIndex + ' (any of ' + assoc + ' ways)')}</div>
        </div>`;
    }

                <option value="LRU" selected>LRU (Least Recently Used)</option>
                <option value="FIFO">FIFO (First-In, First-Out)</option>
                <option value="LFU">LFU (Least Frequently Used)</option>
                <option value="OPT">Optimal (Belady's MIN)</option>

      updateSimCacheRep();

    function updateSimCacheRep() {
      const raw = document.getElementById('cr-seq').value;
      const refs = raw.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      const cap = parseInt(document.getElementById('cr-frames').value, 10) || 3;
      const pol = document.getElementById('cr-pol').value;

      let frames = [];
      let fifoOrder = [];
      let lastUsed = {};
      let freq = {};
      let hits = 0;
      let misses = 0;
      let colsHtml = '';

      refs.forEach((r, t) => {
        freq[r] = (freq[r] || 0) + 1;
        const isHit = frames.includes(r);
        let evicted = '-';
        if (isHit) {
          hits++;
        } else {
          misses++;
          if (frames.length < cap) {
            frames.push(r);
            fifoOrder.push(r);
          } else {
            let victim = frames[0];
            if (pol === 'FIFO') {
              victim = fifoOrder.shift();
              fifoOrder.push(r);
            } else if (pol === 'LRU') {
              victim = frames.reduce((a, b) => (lastUsed[a] < lastUsed[b] ? a : b));
            } else if (pol === 'LFU') {
              victim = frames.reduce((a, b) => (freq[a] <= freq[b] ? a : b));
            } else if (pol === 'OPT') {
              let farthestIdx = -1;
              frames.forEach(f => {
                const nextUse = refs.slice(t + 1).indexOf(f);
                const dist = nextUse === -1 ? 999999 : nextUse;
                if (dist > farthestIdx) {
                  farthestIdx = dist;
                  victim = f;
                }
              });
            }
            evicted = victim;
            frames[frames.indexOf(victim)] = r;
          }
        }
        lastUsed[r] = t;

        const cells = [];
        for (let i = 0; i < cap; i++) {
          cells.push(`<div class="py-1 px-2 border-t border-slate-800 font-mono ${frames[i]===r ? 'text-sky-300 font-bold' : 'text-slate-300'}">${frames[i] !== undefined ? frames[i] : '-'}</div>`);
        }
        colsHtml += `
          <div class="min-w-[54px] text-center bg-slate-900 border border-slate-800 rounded-lg overflow-hidden text-xs">
            <div class="py-1.5 font-mono font-bold bg-slate-800 text-white">${r}</div>
            ${cells.join('')}
            <div class="py-1 text-[10px] font-bold ${isHit ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">${isHit ? 'HIT' : 'MISS'}</div>
          </div>`;
      });

      const total = refs.length || 1;
      const hitRatio = ((hits / total) * 100).toFixed(1);
      document.getElementById('cr-out').innerHTML = `
        <div class="flex flex-wrap gap-3 text-xs">
          <span class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-semibold">Total References: <strong>${refs.length}</strong></span>
          <span class="px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 font-semibold">Hits: <strong>${hits}</strong> (${hitRatio}%)</span>
          <span class="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 font-semibold">Misses / Page Faults: <strong>${misses}</strong> (${(100 - hitRatio).toFixed(1)}%)</span>
        </div>
        <div class="flex gap-1.5 pb-2 overflow-x-auto">${colsHtml}</div>`;
    }

    // --- SIMULATOR I: 5-STAGE PIPELINE SIMULATOR ---
    function renderSimPipeline(stage) {
      stage.innerHTML = `

    function updateSimPipeline() {
      const scenario = document.getElementById('pl-prog').value;
      const fwd = document.getElementById('pl-fwd').checked;
      let instrs = [];
      if (scenario === 'LOADUSE') {
        instrs = [
          { text: 'I1: LW  R1, 0(R2)', op: 'LW', dest: 'R1', src: ['R2'] },
          { text: 'I2: ADD R3, R1, R4', op: 'ALU', dest: 'R3', src: ['R1', 'R4'] },
          { text: 'I3: SUB R5, R3, R6', op: 'ALU', dest: 'R5', src: ['R3', 'R6'] },
          { text: 'I4: OR  R7, R8, R9', op: 'ALU', dest: 'R7', src: ['R8', 'R9'] }
        ];
      } else if (scenario === 'ALURAW') {
        instrs = [
          { text: 'I1: ADD R1, R2, R3', op: 'ALU', dest: 'R1', src: ['R2', 'R3'] },
          { text: 'I2: SUB R4, R1, R5', op: 'ALU', dest: 'R4', src: ['R1', 'R5'] },
          { text: 'I3: AND R6, R4, R7', op: 'ALU', dest: 'R6', src: ['R4', 'R7'] },
          { text: 'I4: OR  R8, R9, R10', op: 'ALU', dest: 'R8', src: ['R9', 'R10'] }
        ];
      } else {
        instrs = [
          { text: 'I1: ADD R1, R2, R3', op: 'ALU', dest: 'R1', src: ['R2', 'R3'] },
          { text: 'I2: SUB R4, R5, R6', op: 'ALU', dest: 'R4', src: ['R5', 'R6'] },
          { text: 'I3: LW  R7, 0(R8)', op: 'LW', dest: 'R7', src: ['R8'] },
          { text: 'I4: OR  R9, R10, R11', op: 'ALU', dest: 'R9', src: ['R10', 'R11'] }
        ];
      }

      // Compute timeline per instruction
      let timelines = [];
      let totalStalls = 0;
      let hazardNotes = [];
      let prevFinishEx = -1;
      let prevDest = null;
      let prevOp = null;

      instrs.forEach((ins, idx) => {
        const startCycle = idx === 0 ? 1 : timelines[idx - 1].idCycle;
        let stalls = 0;
        if (idx > 0 && prevDest && ins.src.includes(prevDest)) {
          if (fwd) {
            if (prevOp === 'LW') {
              stalls = 1;
              hazardNotes.push(`Load-Use RAW Hazard on ${prevDest} between I${idx} and I${idx+1}: 1 Stall Bubble inserted (MEM/WB → EX forwarding).`);
            } else {
              stalls = 0;
              hazardNotes.push(`ALU RAW Hazard on ${prevDest} between I${idx} and I${idx+1}: Resolved with 0 stalls via EX/MEM → EX Operand Forwarding!`);
            }
          } else {
            stalls = 2;
            hazardNotes.push(`RAW Hazard on ${prevDest} between I${idx} and I${idx+1} (Forwarding OFF): 2 Stall Bubbles inserted until WB completes.`);
          }
        }
        totalStalls += stalls;
        const ifCycle = startCycle;
        const idCycle = ifCycle + 1;
        const exCycle = idCycle + 1 + stalls;
        const memCycle = exCycle + 1;
        const wbCycle = memCycle + 1;
        timelines.push({ text: ins.text, ifCycle, idCycle, exCycle, memCycle, wbCycle, stalls });
        prevDest = ins.dest;
        prevOp = ins.op;
      });

      const maxCycle = timelines[timelines.length - 1].wbCycle;
      const nonPipeCycles = instrs.length * 5;
      const speedup = (nonPipeCycles / maxCycle).toFixed(2);
      const cpi = (maxCycle / instrs.length).toFixed(2);

      let headerCells = '<th class="p-2">Instruction</th>';
      for (let c = 1; c <= maxCycle; c++) headerCells += `<th class="p-2 text-center font-mono">C${c}</th>`;

      let rowsHtml = '';
      timelines.forEach(t => {
        let cells = `<td class="p-2 font-mono font-bold text-white whitespace-nowrap">${t.text}</td>`;
        for (let c = 1; c <= maxCycle; c++) {
          let badge = '';
          if (c === t.ifCycle) badge = '<span class="px-2 py-0.5 rounded bg-blue-600 text-white font-bold">IF</span>';
          else if (c === t.idCycle) badge = '<span class="px-2 py-0.5 rounded bg-purple-600 text-white font-bold">ID</span>';
          else if (c > t.idCycle && c < t.exCycle) badge = '<span class="px-1.5 py-0.5 rounded bg-rose-600/80 text-white font-bold">STALL</span>';
          else if (c === t.exCycle) badge = '<span class="px-2 py-0.5 rounded bg-emerald-600 text-white font-bold">EX</span>';
          else if (c === t.memCycle) badge = '<span class="px-2 py-0.5 rounded bg-amber-600 text-white font-bold">MEM</span>';
          else if (c === t.wbCycle) badge = '<span class="px-2 py-0.5 rounded bg-pink-600 text-white font-bold">WB</span>';
          cells += `<td class="p-2 text-center font-mono text-[11px]">${badge}</td>`;
        }
        rowsHtml += `<tr class="border-b border-slate-800">${cells}</tr>`;
      });

      document.getElementById('pl-out').innerHTML = `
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
          <div class="p-3 rounded-lg bg-slate-800 border border-slate-700"><div class="text-slate-400">Pipelined Cycles</div><div class="text-base font-bold text-sky-400 font-mono mt-1">${maxCycle} Cycles (${totalStalls} Stalls)</div></div>
          <div class="p-3 rounded-lg bg-slate-800 border border-slate-700"><div class="text-slate-400">Non-Pipelined Cycles</div><div class="text-base font-bold text-slate-300 font-mono mt-1">${nonPipeCycles} Cycles</div></div>
          <div class="p-3 rounded-lg bg-slate-800 border border-slate-700"><div class="text-slate-400">Pipeline Speedup</div><div class="text-base font-bold text-emerald-400 font-mono mt-1">${speedup}×</div></div>
          <div class="p-3 rounded-lg bg-slate-800 border border-slate-700"><div class="text-slate-400">Effective CPI</div><div class="text-base font-bold text-amber-400 font-mono mt-1">${cpi} Cycles/Instr</div></div>
        </div>
        <table class="w-full text-left text-xs border border-slate-800 rounded-lg overflow-hidden bg-slate-900">
          <thead class="bg-slate-800 text-slate-300"><tr>${headerCells}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-300 space-y-1">
          ${hazardNotes.length ? hazardNotes.map(n => `<div>• ${n}</div>`).join('') : '<div>✔ Zero data hazards detected; ideal k + n − 1 = 8 cycles achieved!</div>'}
        </div>`;
    }

    // --- SIMULATOR M: CPU PERFORMANCE CALCULATOR ---
    function renderSimCpuPerf(stage) {
      stage.innerHTML = `
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">M. CPU Performance Equation (Iron Law) &amp; MIPS Calculator</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-xs">
            <div>
              <label class="font-bold text-slate-300 block mb-1">Instruction Count (Millions)</label>
              <input id="cp-ic" type="number" min="1" value="500" oninput="updateSimCpuPerf()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Average CPI (Cycles / Instruction)</label>
              <input id="cp-cpi" type="number" step="0.1" min="0.2" value="1.6" oninput="updateSimCpuPerf()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Clock Rate (GHz)</label>
              <input id="cp-ghz" type="number" step="0.1" min="0.1" value="2.5" oninput="updateSimCpuPerf()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono" />
            </div>
          </div>
          <div id="cp-out" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        </div>`;
      updateSimCpuPerf();
    }

    function updateSimCpuPerf() {
      const icM = parseFloat(document.getElementById('cp-ic').value) || 100;
      const cpi = parseFloat(document.getElementById('cp-cpi').value) || 1.0;
      const ghz = parseFloat(document.getElementById('cp-ghz').value) || 1.0;
      const tClkNs = 1 / ghz;
      const totalCyclesM = icM * cpi;
      const execSec = (icM * 1e6 * cpi) / (ghz * 1e9);
      const mips = (ghz * 1000) / cpi;

      document.getElementById('cp-out').innerHTML = `
        <div class="p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs"><div class="text-slate-400">Clock Cycle Time (T_clk)</div><div class="text-base font-bold text-sky-400 font-mono mt-1">${tClkNs.toFixed(3)} ns</div></div>
        <div class="p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs"><div class="text-slate-400">Total Clock Cycles</div><div class="text-base font-bold text-amber-400 font-mono mt-1">${totalCyclesM.toFixed(1)} Million</div></div>
        <div class="p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs"><div class="text-slate-400">CPU Execution Time</div><div class="text-base font-bold text-emerald-400 font-mono mt-1">${execSec.toFixed(4)} sec (${(execSec*1000).toFixed(1)} ms)</div></div>
        <div class="p-3.5 rounded-xl bg-slate-800 border border-slate-700 text-xs"><div class="text-slate-400">MIPS Rating</div><div class="text-base font-bold text-purple-400 font-mono mt-1">${mips.toFixed(1)} MIPS</div></div>`;
    }

    // --- SIMULATOR N: AMDAHL'S LAW CALCULATOR ---
    function renderSimAmdahl(stage) {
      stage.innerHTML = `
        <div class="space-y-4">
          <h3 class="text-base font-bold text-white">N. Amdahl\'s Law Parallel Speedup &amp; Efficiency Calculator</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700 text-xs">
            <div>
              <label class="font-bold text-slate-300 block mb-1">Parallelizable Fraction (P): <span id="am-p-val" class="text-sky-400 font-mono">80%</span> (Serial = <span id="am-s-val">20%</span>)</label>
              <input id="am-p" type="range" min="10" max="99" value="80" oninput="updateSimAmdahl()" class="w-full" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Number of Processors / Cores (N): <span id="am-n-val" class="text-emerald-400 font-mono">8</span></label>
              <input id="am-n" type="range" min="1" max="64" value="8" oninput="updateSimAmdahl()" class="w-full" />
            </div>
          </div>
          <div id="am-law-out" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>`;
      updateSimAmdahl();
    }

    function updateSimAmdahl() {
      const pPct = parseInt(document.getElementById('am-p').value, 10) || 80;
      const n = parseInt(document.getElementById('am-n').value, 10) || 8;
      const p = pPct / 100;
      const s = 1 - p;
      document.getElementById('am-p-val').textContent = pPct + '%';
      document.getElementById('am-s-val').textContent = (100 - pPct) + '%';
      document.getElementById('am-n-val').textContent = n;

      const speedup = 1 / (s + (p / n));
      const maxSpeedup = 1 / s;
      const eff = (speedup / n) * 100;

      document.getElementById('am-law-out').innerHTML = `
        <div class="p-4 rounded-xl bg-slate-800 border border-slate-700 text-xs">
          <div class="text-slate-400">Speedup on N = ${n} Cores</div>
          <div class="text-xl font-extrabold text-emerald-400 font-mono mt-1">${speedup.toFixed(2)}×</div>
          <div class="text-[11px] text-slate-400 mt-1">1 / (${s.toFixed(2)} + ${p.toFixed(2)}/${n})</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-800 border border-slate-700 text-xs">
          <div class="text-slate-400">Parallel Efficiency E = S(N) / N</div>
          <div class="text-xl font-extrabold text-sky-400 font-mono mt-1">${eff.toFixed(1)}%</div>
          <div class="text-[11px] text-slate-400 mt-1">Per-core utilization</div>
        </div>
        <div class="p-4 rounded-xl bg-slate-800 border border-slate-700 text-xs">
          <div class="text-slate-400">Max Asymptotic Speedup (N → ∞)</div>
          <div class="text-xl font-extrabold text-amber-400 font-mono mt-1">${maxSpeedup.toFixed(2)}×</div>
          <div class="text-[11px] text-slate-400 mt-1">Bounded by serial 1/(1−P)</div>
        </div>`;
    }

    // ==================== 19. TOPIC-WISE PRACTICE ENGINE ====================
    function buildPracticeList() {
      const cfg = state.practiceConfig;
      let filtered = APP_DATA.questions.filter(q => {
        if (cfg.moduleCode !== 'ALL' && q.moduleCode !== cfg.moduleCode) return false;
        if (cfg.difficulty !== 'ALL' && q.difficulty !== cfg.difficulty) return false;
        if (cfg.sourceType !== 'ALL' && q.sourceType !== cfg.sourceType) return false;
        if (cfg.questionType !== 'ALL' && q.questionType !== cfg.questionType) return false;
        if (cfg.numericalCategory !== 'ALL' && q.numericalCategory !== cfg.numericalCategory) return false;
        return true;
      });
      cfg.activeList = filtered.slice(0, cfg.limit || 440);
      if (cfg.currentIndex >= cfg.activeList.length) cfg.currentIndex = 0;
    }

    function applyPracticeFilters() {
      const cfg = state.practiceConfig;
      cfg.moduleCode = document.getElementById('pf-mod').value;
      cfg.difficulty = document.getElementById('pf-diff').value;
      cfg.sourceType = document.getElementById('pf-src').value;
      cfg.numericalCategory = document.getElementById('pf-num').value;
      cfg.limit = parseInt(document.getElementById('pf-limit').value, 10) || 440;
      cfg.currentIndex = 0;
      buildPracticeList();
      renderMainView();
    }

    function submitPracticeAnswer(qId, optKey) {
      const qObj = APP_DATA.questions.find(q => q.id === qId);
      if (!qObj) return;
      state.attempts[qId] = {
        selected: optKey,
        isCorrect: optKey === qObj.correctAnswer
      };
      saveState();
      renderMainView();
    }

    function toggleBookmark(qId) {
      if (state.bookmarks[qId]) delete state.bookmarks[qId];
      else state.bookmarks[qId] = true;
      saveState();
      renderMainView();
      showToast(state.bookmarks[qId] ? `Bookmarked ${qId}` : `Removed bookmark ${qId}`);
    }

    function toggleReviewMark(qId) {
      if (state.reviewMarks[qId]) delete state.reviewMarks[qId];
      else state.reviewMarks[qId] = true;
      saveState();
      renderMainView();
    }

    // ==================== 21. MOCK TESTS ENGINE (26 TESTS) ====================
    function startMockTest(testId) {
      const m = APP_DATA.mockTests.find(t => t.id === testId);
      if (!m) return;
      clearInterval(mockTimerInterval);
      const qs = m.questionIds.map(id => APP_DATA.questions.find(q => q.id === id)).filter(Boolean);
      state.mockSession = {
        active: true,
        testId: m.id,
        title: m.title,
        questions: qs,
        responses: {},
        markedReview: {},
        currentIdx: 0,
        remainingSec: m.durationMins * 60,
        negativeMarking: true,
        submitted: false,
        resultSummary: null
      };
      mockTimerInterval = setInterval(() => {
        if (!state.mockSession.active || state.mockSession.submitted) {
          clearInterval(mockTimerInterval);
          return;
        }
        state.mockSession.remainingSec--;
        const timerEl = document.getElementById('mock-timer-display');
        if (timerEl) {
          const mins = Math.floor(state.mockSession.remainingSec / 60);
          const secs = state.mockSession.remainingSec % 60;
          timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
        if (state.mockSession.remainingSec <= 0) {
          clearInterval(mockTimerInterval);
          submitMockTestNow();
        }
      }, 1000);
      renderMainView();
    }

    function selectMockOption(optKey) {
      const ms = state.mockSession;
      const qObj = ms.questions[ms.currentIdx];
      if (!qObj || ms.submitted) return;
      ms.responses[qObj.id] = optKey;
      renderMainView();
    }

    function clearMockOption() {
      const ms = state.mockSession;
      const qObj = ms.questions[ms.currentIdx];
      if (!qObj || ms.submitted) return;
      delete ms.responses[qObj.id];
      renderMainView();
    }

    function toggleMockReview() {
      const ms = state.mockSession;
      const qObj = ms.questions[ms.currentIdx];
      if (!qObj || ms.submitted) return;
      ms.markedReview[qObj.id] = !ms.markedReview[qObj.id];
      renderMainView();
    }

    function submitMockTestNow() {
      clearInterval(mockTimerInterval);
      const ms = state.mockSession;
      ms.submitted = true;
      let correct = 0;
      let wrong = 0;
      let unattempted = 0;
      ms.questions.forEach(q => {
        const sel = ms.responses[q.id];
        if (!sel) unattempted++;
        else if (sel === q.correctAnswer) {
          correct++;
          state.attempts[q.id] = { selected: sel, isCorrect: true };
        } else {
          wrong++;
          state.attempts[q.id] = { selected: sel, isCorrect: false };
        }
      });
      const rawScore = ms.negativeMarking ? (correct - wrong * 0.25) : correct;
      const acc = (correct + wrong) ? Math.round((correct / (correct + wrong)) * 100) : 0;
      ms.resultSummary = {
        correct, wrong, unattempted,
        score: rawScore.toFixed(2),
        total: ms.questions.length,
        accuracy: acc
      };
      state.mockHistory.unshift({
        testId: ms.testId,
        title: ms.title,
        score: rawScore.toFixed(2),
        total: ms.questions.length,
        accuracy: acc,
        date: new Date().toLocaleDateString()
      });
      saveState();
      renderMainView();
    }

    function exitMockTest() {
      clearInterval(mockTimerInterval);
      state.mockSession.active = false;
      renderMainView();
    }
