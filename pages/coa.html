                <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-2 text-xs">
                  <div class="flex items-center justify-between">
                    <span class="font-mono font-bold text-sky-400">Expected #${idx+1} • ${qItem.id} (${qItem.module})</span>
                    <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-semibold">${qItem.sourceType}</span>
                  </div>
                  <div class="text-white font-semibold text-sm">${qItem.question}</div>
                  <div class="text-emerald-400 font-bold">Ans (${qItem.correctAnswer}): ${qItem.options[qItem.correctAnswer]}</div>
                  <div class="text-slate-300">${qItem.explanation}</div>
                </div>`).join('')}
            </div>
          </div>`;
      }

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
            <h2 class="text-lg font-bold text-white">Rapid Revision &amp; Last-Minute High-Yield Resources</h2>
            <div class="flex flex-wrap gap-2">
              ${tabs.map(t => `<button type="button" onclick="state.activeRevisionTab='${t.id}'; renderMainView()" class="px-3 py-1.5 rounded-lg text-xs font-bold ${tab===t.id ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${t.label}</button>`).join('')}
            </div>
          </div>
          ${bodyHtml}
        </div>`;
    }

    // ==================== 25. BOOKMARKS, REVIEW & WRONG ANSWERS ====================
    function renderBookmarksView() {
      const bmIds = Object.keys(state.bookmarks).filter(k => state.bookmarks[k]);
      const revIds = Object.keys(state.reviewMarks).filter(k => state.reviewMarks[k]);
      const wrongIds = Object.keys(state.attempts).filter(k => !state.attempts[k].isCorrect);

      const renderList = (ids, emptyMsg) => {
        if (!ids.length) return `<div class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 text-xs text-slate-400">${emptyMsg}</div>`;
        return ids.map(id => {
          const q = APP_DATA.questions.find(item => item.id === id);
          if (!q) return '';
          return `<div class="p-3.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between gap-3 text-xs">
            <div>
              <div class="font-mono font-bold text-sky-400">${q.id} • ${q.module} (${q.difficulty})</div>
              <div class="text-white font-medium mt-0.5">${q.question}</div>
              <div class="text-emerald-400 mt-1">Ans (${q.correctAnswer}): ${q.options[q.correctAnswer]}</div>
            </div>
            <button type="button" onclick="openSpecificQuestion('${q.id}')" class="px-3 py-1.5 rounded-lg bg-sky-600 text-white font-bold flex-shrink-0">Open →</button>
          </div>`;
        }).join('');
      };

      return `
        <div class="space-y-6">
          <div class="space-y-2">
            <h2 class="text-base sm:text-lg font-bold text-sky-400">🔖 Bookmarked Questions (${bmIds.length})</h2>
            <div class="space-y-2">${renderList(bmIds, 'No questions bookmarked yet. Click "🔖 Bookmark" on any question during practice.')}</div>
          </div>
          <div class="space-y-2">
            <h2 class="text-base sm:text-lg font-bold text-amber-400">⚑ Questions Marked for Review (${revIds.length})</h2>
            <div class="space-y-2">${renderList(revIds, 'No questions marked for review yet.')}</div>
          </div>
          <div class="space-y-2">
            <h2 class="text-base sm:text-lg font-bold text-rose-400">✘ Incorrectly Answered Questions (${wrongIds.length})</h2>
            <div class="space-y-2">${renderList(wrongIds, 'Zero incorrect answers recorded so far!')}</div>
          </div>
        </div>`;
    }

    // ==================== 26. PERFORMANCE ANALYTICS DASHBOARD ====================
    function renderAnalyticsView() {
      const total = APP_DATA.questions.length;
      const attIds = Object.keys(state.attempts);
      const corrIds = attIds.filter(id => state.attempts[id].isCorrect);
      const wrongIds = attIds.filter(id => !state.attempts[id].isCorrect);
      const acc = attIds.length ? ((corrIds.length / attIds.length) * 100).toFixed(1) : '0.0';

      const modStats = APP_DATA.modules.map(m => {
        const qs = APP_DATA.questions.filter(q => q.moduleCode === m.code);
        const att = qs.filter(q => state.attempts[q.id]);
        const corr = att.filter(q => state.attempts[q.id].isCorrect);
        const mAcc = att.length ? Math.round((corr.length / att.length) * 100) : null;
        return { mod: m, total: qs.length, att: att.length, corr: corr.length, acc: mAcc };
      });

      const strongMods = modStats.filter(s => s.acc !== null && s.acc >= 75);
      const weakMods = modStats.filter(s => s.acc !== null && s.acc < 75);

      return `
        <div class="space-y-6">
          <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg sm:text-xl font-bold text-white">Candidate Performance Tracking &amp; Diagnostic Analytics</h2>
              <p class="text-xs text-slate-400 mt-1">Track overall accuracy, module-wise mastery, mock test history, and weak areas saved automatically in browser localStorage.</p>
            </div>
            <div class="flex gap-2">
              <button type="button" onclick="practiceWeakTopics()" class="px-4 py-2 rounded-lg bg-emerald-500 text-slate-950 font-bold text-xs">🎯 Practice Weak Topics</button>
              <button type="button" onclick="confirmResetProgress()" class="px-3.5 py-2 rounded-lg bg-rose-600/80 hover:bg-rose-600 text-white font-bold text-xs">Reset Progress</button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-4 rounded-xl bg-emerald-950/30 border border-emerald-500/40 text-xs space-y-1.5">
              <div class="font-bold text-emerald-300 text-sm">💪 Strong Modules (Accuracy ≥ 75%)</div>
              <div>${strongMods.length ? strongMods.map(s => `<span class="inline-block px-2 py-1 rounded bg-emerald-500/20 text-emerald-200 mr-1.5 mb-1">${s.mod.shortTitle} (${s.acc}%)</span>`).join('') : 'Attempt questions across modules to identify your strong topics.'}</div>
            </div>
            <div class="p-4 rounded-xl bg-rose-950/30 border border-rose-500/40 text-xs space-y-1.5">
              <div class="font-bold text-rose-300 text-sm">⚠️ Weak Modules Needing Revision (Accuracy &lt; 75%)</div>
              <div>${weakMods.length ? weakMods.map(s => `<span onclick="jumpToModulePractice('${s.mod.code}')" class="inline-block px-2 py-1 rounded bg-rose-500/20 text-rose-200 mr-1.5 mb-1 cursor-pointer hover:underline">${s.mod.shortTitle} (${s.acc}%) → Practice</span>`).join('') : 'No weak modules flagged yet!'}</div>
            </div>
          </div>

          <!-- MODULE-WISE ACCURACY TABLE -->
          <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
            <h3 class="text-sm font-bold text-white">Module-Wise Performance Breakdown (Overall Accuracy: ${acc}% across ${attIds.length}/${total} Qs)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs border border-slate-800 rounded-lg">
                <thead class="bg-slate-800 text-slate-200">
                  <tr><th class="p-2.5">Module</th><th class="p-2.5">Total Qs</th><th class="p-2.5">Attempted</th><th class="p-2.5">Correct</th><th class="p-2.5">Accuracy</th><th class="p-2.5">Action</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${modStats.map(s => `
                    <tr>
                      <td class="p-2.5 font-bold text-white">${s.mod.title}</td>
                      <td class="p-2.5 font-mono">${s.total}</td>
                      <td class="p-2.5 font-mono text-sky-400">${s.att}</td>
                      <td class="p-2.5 font-mono text-emerald-400">${s.corr}</td>
                      <td class="p-2.5 font-mono font-bold ${s.acc===null ? 'text-slate-500' : (s.acc>=75 ? 'text-emerald-400' : 'text-amber-400')}">${s.acc === null ? 'Not Attempted' : s.acc + '%'}</td>
                      <td class="p-2.5"><button type="button" onclick="jumpToModulePractice('${s.mod.code}')" class="text-sky-400 hover:underline font-semibold">Practice →</button></td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- MOCK TEST HISTORY -->
          <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
            <h3 class="text-sm font-bold text-white">Completed Mock Test Score History (${state.mockHistory.length})</h3>
            ${state.mockHistory.length ? `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                ${state.mockHistory.map(h => `
                  <div class="p-3 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between">
                    <div>
                      <div class="font-bold text-white">${h.title}</div>
                      <div class="text-slate-400">${h.date} • Accuracy: ${h.accuracy}%</div>
                    </div>
                    <div class="text-base font-extrabold font-mono text-emerald-400">${h.score}/${h.total}</div>
                  </div>`).join('')}
              </div>
            ` : `<div class="text-xs text-slate-400">No mock tests submitted yet. Visit Section 21 (Mock Tests) to take a timed CBT test.</div>`}
          </div>
        </div>`;
    }

    // Keyboard shortcut Esc to close global search or modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        clearGlobalSearch();
        closeAppModal();
      }
    });

    window.onload = () => {
      loadState();
      buildPracticeList();
      renderSidebar();
      renderMainView();
    };
  </script>
</body>
</html>
