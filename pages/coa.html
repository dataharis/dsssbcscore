ontents `M[100] = 500`, `M[120] = 600`, `M[520] = 900`. What are the Effective Addresses for (a) Pre-Indexed Indirect `EA = M[A + XR]` and (b) Post-Indexed Indirect `EA = M[A] + XR`?", "options": {"A": "(a) EA = 600, (b) EA = 520", "B": "(a) EA = 520, (b) EA = 600", "C": "(a) EA = 120, (b) EA = 500", "D": "(a) EA = 900, (b) EA = 600"}, "correctAnswer": "A", "explanation": "(a) Pre-Indexed Indirect adds the index BEFORE memory indirection: `EA = M[A + XR] = M[100 + 20] = M[120] = 600`. (b) Post-Indexed Indirect fetches the pointer from `M[A]` first, then adds `XR`: `EA = M[100] + 20 = 500 + 20 = 520`.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Indexed Addressing", "subtopic": "Pre-Indexing vs Post-Indexing with Indirection", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-016", "question": "In Stack Addressing mode, which register implicitly supplies the Effective Address of the operand(s)?", "options": {"A": "Program Counter (PC)", "B": "Stack Pointer (SP)", "C": "Instruction Register (IR)", "D": "Index Register (XR)"}, "correctAnswer": "B", "explanation": "In Stack Addressing mode, the Stack Pointer (`SP`) register implicitly points to the Top of Stack in memory (or register stack).", "moduleCode": "G", "module": "Addressing Modes", "topic": "Stack Addressing", "subtopic": "Implicit Stack Pointer", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-017", "question": "What is the primary architectural limitation of Direct Addressing mode in a fixed-length instruction format?", "options": {"A": "It requires 3 memory accesses per instruction", "B": "The addressable memory space is strictly limited to `2^k` locations, where `k` is the bit-width of the instruction's address field", "C": "It cannot access global variables", "D": "It requires an index register"}, "correctAnswer": "B", "explanation": "If a 16-bit instruction devotes 4 bits to the opcode and 12 bits to a Direct address field, it can only directly address `2\u00b9\u00b2 = 4096` words of memory.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Direct vs Indirect", "subtopic": "Limitation of Direct Addressing", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-018", "question": "Position-Independent Code (PIC) used in shared libraries (`.so` / `.dll`) relies heavily on which addressing mode so that branches and local data references work regardless of where the library is loaded in virtual memory?", "options": {"A": "Absolute / Direct addressing", "B": "PC-Relative addressing", "C": "Immediate addressing", "D": "Implied addressing"}, "correctAnswer": "B", "explanation": "In PC-Relative addressing (`EA = PC + offset`), the distance between the instruction and the target label or Global Offset Table (GOT) remains constant no matter what base address the shared library is loaded at.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Effective Address Calculation", "subtopic": "Self-Relocating Code", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-019", "question": "An x86 instruction uses Base-Index-Scale-Displacement addressing: `MOV EAX, [EBX + ESI*8 + 16]`. If `EBX = 1000`, `ESI = 5`, what is the Effective Address?", "options": {"A": "1040", "B": "1056", "C": "1096", "D": "1128"}, "correctAnswer": "B", "explanation": "Compute `EA = Base (EBX) + Index (ESI) \u00d7 Scale (8) + Displacement (16) = 1000 + (5 \u00d7 8) + 16 = 1000 + 40 + 16 = 1056`.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Effective Address Calculation", "subtopic": "Scaled Indexed Addressing (x86)", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-020", "question": "If a system implements a Descending Full Stack (where the stack grows toward lower memory addresses and `SP` points to the last occupied top item), which two addressing modes using `SP` naturally implement `PUSH` and `POP`?", "options": {"A": "PUSH uses Pre-Auto-Decrement `\u2212(SP)`, and POP uses Post-Auto-Increment `(SP)+`", "B": "PUSH uses Post-Auto-Increment `(SP)+`, and POP uses Pre-Auto-Decrement `\u2212(SP)`", "C": "Both PUSH and POP use Immediate mode", "D": "PUSH uses Direct mode, and POP uses Relative mode"}, "correctAnswer": "A", "explanation": "In a descending full stack, `PUSH` first decrements `SP` to the next empty lower address and writes (`\u2212(SP)`), while `POP` first reads from current `SP` and then increments `SP` (`(SP)+`).", "moduleCode": "G", "module": "Addressing Modes", "topic": "Auto-Decrement", "subtopic": "Descending Stack Implementation", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-021", "question": "A 32-bit RISC `ADDI R1, R2, Imm12` instruction contains a 12-bit signed 2's complement immediate field `Imm12 = 0xFF8`. If `R2 = 100` (decimal), what decimal value is written into `R1`?", "options": {"A": "4192", "B": "92", "C": "108", "D": "\u22128"}, "correctAnswer": "B", "explanation": "`0xFF8` in 12-bit binary is `1111 1111 1000\u2082`, which is `\u22128` in 12-bit 2's complement. Sign-extended to 32 bits (`0xFFFFFFF8 = \u22128`) and added to `R2 = 100`, `R1 = 100 + (\u22128) = 92`.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Immediate Addressing", "subtopic": "Sign-Extended Immediate in RISC", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-022", "question": "Match the following Intel 8085 instructions with their correct addressing modes:\n1. `MVI A, 35H`     P. Direct addressing\n2. `LDA 2050H`      Q. Register Indirect addressing\n3. `MOV A, B`       R. Immediate addressing\n4. `MOV A, M`       S. Register addressing (where M points to M[HL])", "options": {"A": "1-R, 2-P, 3-S, 4-Q", "B": "1-P, 2-R, 3-S, 4-Q", "C": "1-R, 2-Q, 3-P, 4-S", "D": "1-S, 2-P, 3-R, 4-Q"}, "correctAnswer": "A", "explanation": "In Intel 8085: `MVI A, 35H` is Immediate (R); `LDA 2050H` is Direct (P); `MOV A, B` is Register (S); and `MOV A, M` accesses memory pointed to by the `HL` register pair, which is Register Indirect addressing (Q)!", "moduleCode": "G", "module": "Addressing Modes", "topic": "Addressing Mode Identification", "subtopic": "8085 Addressing Modes", "difficulty": "Moderate", "questionType": "Match-the-Following", "sourceType": "Adapted PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-023", "question": "In computers that allow multilevel memory indirect addressing (where bit 15 of every fetched pointer word in memory is itself checked as an Indirect flag `I`), what hazard can occur if memory location `500` contains `[I=1 | Addr=500]`?", "options": {"A": "The ALU overflows", "B": "An infinite indirection loop occurs during the Indirect cycle, hanging instruction execution unless bounded by a hardware counter trap", "C": "The cache is flushed", "D": "The stack pointer is reset"}, "correctAnswer": "B", "explanation": "If `M[500]` has its indirect bit set (`I = 1`) and points back to `500`, the CPU will stay in the Indirect cycle fetching `AR \u2190 M[500]` indefinitely unless hardware limits the indirection depth.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Indirect Addressing", "subtopic": "Multi-level Indirection Trap", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-G-024", "question": "A 1-word PC-Relative branch instruction stored at word address `1200` branches to target word address `1150`. What decimal value must be stored in the instruction's signed offset field?", "options": {"A": "\u221250", "B": "\u221251", "C": "+50", "D": "\u221249"}, "correctAnswer": "B", "explanation": "After fetching the 1-word instruction at `1200`, `PC` is incremented to `1201`. Since `EA = PC_next + Offset \u2192 1150 = 1201 + Offset`, we get `Offset = 1150 \u2212 1201 = \u221251`!", "moduleCode": "G", "module": "Addressing Modes", "topic": "Effective Address Calculation", "subtopic": "Reverse EA Problem", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Addressing Modes"}, {"id": "COA-G-025", "question": "Which of the following groups contains ONLY addressing modes that require ZERO data memory accesses during the instruction Execute phase (after the instruction itself has been fetched)?", "options": {"A": "Immediate, Register, and Implied (for register operations)", "B": "Direct, Immediate, and Register Indirect", "C": "Indexed, Base-Register, and PC-Relative", "D": "Indirect, Auto-Increment, and Stack"}, "correctAnswer": "A", "explanation": "Immediate (operand in instruction), Register (operand in CPU register), and Implied register instructions (`CMA`, `CLA`) require zero data memory references during execution.", "moduleCode": "G", "module": "Addressing Modes", "topic": "Addressing Modes Comparison", "subtopic": "Zero Memory Access Modes", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-001", "question": "Which of the following is an example of an 8-bit microprocessor?", "options": {"A": "Intel 8086", "B": "Intel 8085", "C": "Intel 80286", "D": "Intel 80386"}, "correctAnswer": "B", "explanation": "Intel 8085 (introduced in 1976) is an 8-bit microprocessor with an 8-bit data bus and a 16-bit address bus (64 KB memory). Intel 8086 and 80286 are 16-bit microprocessors, and 80386 is a 32-bit microprocessor.", "moduleCode": "H", "module": "CPU Organization", "topic": "Microprocessor Architecture", "subtopic": "8-Bit Microprocessor", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "13 Sep 2025, Shift 3 (5:00 PM)", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-is-an-example-of-an-8-bit-microprocessor-3437", "numericalCategory": null}, {"id": "COA-H-002", "question": "In Morris Mano's 7-register CPU (R1..R7) controlled by a 14-bit Control Word (`SELA: 3 bits | SELB: 3 bits | SELD: 3 bits | OPR: 5 bits`), if `OPR = 00101` stands for Subtract (`A \u2212 B`), what 14-bit binary Control Word executes `R1 \u2190 R2 \u2212 R3`?", "options": {"A": "010 011 001 00101", "B": "001 010 011 00101", "C": "011 010 001 00101", "D": "010 011 000 00101"}, "correctAnswer": "A", "explanation": "Source A (`SELA`) selects R2 = `010`; Source B (`SELB`) selects R3 = `011`; Destination (`SELD`) loads R1 = `001`; Operation (`OPR`) is Subtract = `00101`. Concatenating gives `010 011 001 00101`.", "moduleCode": "H", "module": "CPU Organization", "topic": "General Register Organization", "subtopic": "14-Bit Control Word", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-H-003", "question": "A processor has 16 general-purpose registers (R0..R15) and an ALU capable of 32 distinct operations. For a 3-register datapath (2 source muxes + 1 destination decoder), how many bits are needed in the Control Word?", "options": {"A": "12 bits", "B": "17 bits", "C": "21 bits", "D": "16 bits"}, "correctAnswer": "B", "explanation": "Selecting 1 of 16 registers requires log\u2082(16) = 4 bits. Thus SELA = 4 bits, SELB = 4 bits, SELD = 4 bits. Selecting 1 of 32 ALU operations requires log\u2082(32) = 5 bits. Total Control Word = 4 + 4 + 4 + 5 = 17 bits.", "moduleCode": "H", "module": "CPU Organization", "topic": "General Register Organization", "subtopic": "Control Word Width Formula", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-H-004", "question": "In a general-register CPU where `SELD` feeds a 3\u00d78 destination register load decoder (outputs D\u2080..D\u2087, with D\u2081..D\u2087 connected to Load inputs of R1..R7), what happens when `SELD = 000`?", "options": {"A": "Register R1 is cleared to 0", "B": "No internal register is loaded; the ALU result is only placed on the external output bus (useful for Flag comparisons or writing to external memory)", "C": "All 7 registers are loaded with the ALU output simultaneously", "D": "The CPU halts"}, "correctAnswer": "B", "explanation": "Decoder output D\u2080 (`SELD = 000`) is not connected to any register's Load input, allowing the ALU output to drive the external data bus or update status flags (`CMP`) without modifying R1..R7.", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Datapath", "subtopic": "Destination Selector SELD = 000", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-005", "question": "In a 64-word hardware register stack (addresses 0 to 63 = `111111\u2082`) with a 6-bit Stack Pointer `SP`, 1-bit `FULL` flag, and 1-bit `EMTY` flag, when is the `FULL` flag set to 1 during a `PUSH` operation?", "options": {"A": "When SP increments and reaches 000000\u2082 (wrapping around from 63 = 111111\u2082 to 0)", "B": "When SP equals 000001\u2082", "C": "When SP equals 100000\u2082 (32)", "D": "Whenever DR is zero"}, "correctAnswer": "A", "explanation": "In Mano's 64-word register stack, location 0 holds the 64th (last) item: `SP` starts at 0 (`EMTY=1`), first PUSH increments `SP` to 1, 63rd PUSH sets `SP=63`, and 64th PUSH wraps `SP` from `63 (111111\u2082)` to `0 (000000\u2082)`, setting `FULL \u2190 1`.", "moduleCode": "H", "module": "CPU Organization", "topic": "Stack Organization", "subtopic": "64-Word Register Stack Flags", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-006", "question": "What is the defining characteristic of a 'Superscalar' processor architecture?", "options": {"A": "It uses vacuum tubes instead of CMOS transistors", "B": "It contains multiple parallel execution pipelines and can fetch, decode, and issue more than one instruction per clock cycle (IPC > 1)", "C": "It has no cache memory", "D": "It executes each instruction over 100 sequential clock cycles"}, "correctAnswer": "B", "explanation": "A scalar pipelined processor issues at most 1 instruction per clock cycle (ideal CPI = 1). A Superscalar processor replicates fetch/decode/execution hardware to issue multiple instructions per clock cycle (IPC > 1, so CPI < 1).", "moduleCode": "H", "module": "CPU Organization", "topic": "Processor Design", "subtopic": "Superscalar Processor", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-007", "question": "In a CPU datapath where the ALU has two combinational inputs and one output, why does a 'Single Internal Bus' organization require two temporary buffer registers (`Y` and `Z`) around the ALU, whereas a 'Three-Bus' organization requires none?", "options": {"A": "Because only one operand can be transferred over a single bus per clock cycle, so `R1 + R2` takes 3 cycles (latch R1 into Y, add Y+R2 into Z, transfer Z to R3) on a 1-bus datapath versus 1 cycle on a 3-bus datapath", "B": "Because a single bus cannot carry binary 1s", "C": "Because a 3-bus datapath does not have an ALU", "D": "Because registers cannot connect to a single bus"}, "correctAnswer": "A", "explanation": "A combinational ALU needs both operands simultaneously at its inputs and a separate path for its output. A single internal bus can only carry one value at a time, requiring input latch `Y` and output latch `Z` across 3 sub-cycles.", "moduleCode": "H", "module": "CPU Organization", "topic": "Internal CPU Buses", "subtopic": "Single-Bus vs Three-Bus Datapath", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-008", "question": "If a processor operates at a clock frequency of 2.5 GHz, what is the duration of a single clock cycle (`T_clk`) in picoseconds (ps)?", "options": {"A": "250 ps", "B": "400 ps", "C": "40 ps", "D": "2500 ps"}, "correctAnswer": "B", "explanation": "T_clk = 1 / f = 1 / (2.5 \u00d7 10\u2079 Hz) = 0.4 \u00d7 10\u207b\u2079 s = 0.4 ns = 400 picoseconds (ps).", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Clock & Timing", "subtopic": "Clock Rate to Cycle Period", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-H-009", "question": "A 2-issue Superscalar RISC processor can execute two 3-register ALU instructions (`ADD Rd, Rs1, Rs2`) simultaneously in the same clock cycle. How many independent Read ports and Write ports must its Register File provide?", "options": {"A": "2 Read ports and 1 Write port", "B": "4 Read ports and 2 Write ports", "C": "1 Read port and 1 Write port", "D": "6 Read ports and 6 Write ports"}, "correctAnswer": "B", "explanation": "Each 3-register instruction reads 2 source registers (`Rs1, Rs2`) and writes 1 destination register (`Rd`). Issuing 2 such instructions per cycle requires `2 \u00d7 2 = 4` Read ports and `2 \u00d7 1 = 2` Write ports.", "moduleCode": "H", "module": "CPU Organization", "topic": "Register File Design", "subtopic": "Read and Write Ports", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-010", "question": "How does Simultaneous Multithreading (SMT / Intel Hyper-Threading) differ from Coarse-Grained and Fine-Grained Hardware Multithreading?", "options": {"A": "Coarse-grained switches threads only on costly stalls (like L2 cache misses); Fine-grained switches threads every clock cycle in round-robin; SMT issues instructions from MULTIPLE threads to different execution units within the SAME clock cycle", "B": "SMT only runs on single-pipeline non-superscalar CPUs", "C": "Coarse-grained requires no registers", "D": "Fine-grained switches threads only once per hour"}, "correctAnswer": "A", "explanation": "Coarse-grained switches on long-latency stalls (eliminating vertical waste); Fine-grained switches every cycle; SMT exploits a superscalar datapath to issue instructions from multiple hardware threads in the same cycle (eliminating both horizontal and vertical waste!).", "moduleCode": "H", "module": "CPU Organization", "topic": "Multithreading", "subtopic": "Fine-Grained vs Coarse-Grained vs SMT", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-011", "question": "In which CPU organization are arithmetic and logic instructions strictly prohibited from referencing main memory addresses directly?", "options": {"A": "Register-Memory Organization (e.g., Intel x86)", "B": "Memory-to-Memory Organization (e.g., DEC VAX)", "C": "Register-Register / Load-Store Organization (e.g., ARM, MIPS, RISC-V)", "D": "Single-Accumulator Organization (e.g., Intel 8085)"}, "correctAnswer": "C", "explanation": "In a Register-Register (Load-Store) architecture, only `LOAD` and `STORE` instructions access memory; all ALU operations take register operands.", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Organizations", "subtopic": "Load-Store vs Register-Memory", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-012", "question": "How does a VLIW (Very Long Instruction Word) processor differ from a dynamically scheduled Superscalar processor?", "options": {"A": "In VLIW, the COMPILER statically bundles multiple independent operations into one long instruction word (e.g., 128 bits), whereas a Superscalar CPU uses hardware dynamic scheduling to discover independent instructions at runtime", "B": "VLIW processors execute only 1 bit per cycle", "C": "Superscalar processors cannot use caches", "D": "VLIW processors use microprogrammed CISC string instructions"}, "correctAnswer": "A", "explanation": "VLIW shifts instruction-level parallelism (ILP) dependency checking and scheduling from complex hardware out-of-order issue queues to the compiler.", "moduleCode": "H", "module": "CPU Organization", "topic": "Processor Design", "subtopic": "VLIW (Very Long Instruction Word)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-013", "question": "What information is stored in the Processor Status Word (PSW) / EFLAGS / CPSR register of a CPU?", "options": {"A": "The physical capacity of the hard disk", "B": "Condition code flags (Zero, Sign, Carry, Overflow) plus control/system mode bits (Interrupt Enable, Supervisor/User Mode)", "C": "The MAC address of the network card", "D": "The ASCII table"}, "correctAnswer": "B", "explanation": "The PSW combines ALU status flags (Z, S, C, V) and processor control/privilege flags (Interrupt mask bit, Kernel/User mode bit, Trap bit).", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Registers", "subtopic": "Processor Status Word (PSW)", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-014", "question": "Why do modern CPUs include a hardware Mode Bit in the PSW to distinguish between User Mode (Bit = 1) and Kernel/Supervisor Mode (Bit = 0)?", "options": {"A": "To double the clock frequency when playing games", "B": "To prevent user applications from executing privileged instructions (such as halting the CPU, modifying page tables, or directly accessing I/O ports)", "C": "To disable the ALU in User Mode", "D": "To convert binary to decimal"}, "correctAnswer": "B", "explanation": "Dual-mode operation protects the OS and hardware: attempting to execute a privileged instruction (`HLT`, `CLI`, `LGDT`, `OUT`) in User Mode triggers a hardware General Protection Fault trap to the OS.", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Privilege Rings", "subtopic": "Dual-Mode Operation (User vs Kernel)", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-015", "question": "What is the primary advantage of implementing the Stack in a portion of Main Memory (pointed to by CPU register `SP`) rather than using a fixed 64-word hardware Register Stack inside the CPU?", "options": {"A": "A memory stack is 100 times faster than CPU registers", "B": "A memory stack can grow to virtually any size limited only by available RAM, whereas a dedicated hardware register stack has a small fixed capacity", "C": "A memory stack does not require a Stack Pointer register", "D": "A memory stack requires zero bus cycles"}, "correctAnswer": "B", "explanation": "A dedicated register stack is fast but tiny (e.g., 8 or 64 words), whereas a memory stack backed by RAM (and cached by L1 D-Cache) provides megabytes of stack space for deep call trees and local arrays.", "moduleCode": "H", "module": "CPU Organization", "topic": "Stack Organization", "subtopic": "Memory Stack vs Register Stack", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-016", "question": "In a dynamically scheduled Out-of-Order (OoO) processor using Tomasulo's Algorithm, which hardware mechanism eliminates false name dependencies (WAR and WAW hazards)?", "options": {"A": "Delayed branching", "B": "Hardware Register Renaming via Reservation Stations and the Reorder Buffer (ROB)", "C": "Increasing the size of the Program Counter", "D": "Disabling the L1 cache"}, "correctAnswer": "B", "explanation": "Tomasulo's algorithm uses Reservation Stations and Register Renaming (mapping architectural registers to a larger pool of physical registers / ROB entries) to completely eliminate WAR and WAW name hazards.", "moduleCode": "H", "module": "CPU Organization", "topic": "Out-of-Order Execution", "subtopic": "Tomasulo's Algorithm & Reservation Stations", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-017", "question": "In an Out-of-Order superscalar processor, instructions may execute and complete out of program order. What hardware structure ensures that instructions COMMIT (write results to architectural registers/memory) strictly IN PROGRAM ORDER to guarantee 'Precise Exceptions'?", "options": {"A": "Branch Target Buffer (BTB)", "B": "Reorder Buffer (ROB)", "C": "Translation Lookaside Buffer (TLB)", "D": "Instruction Register (IR)"}, "correctAnswer": "B", "explanation": "The Reorder Buffer (ROB) holds speculatively executed results and commits them strictly in original program order, allowing exact state recovery on branch mispredictions or page faults (precise exceptions).", "moduleCode": "H", "module": "CPU Organization", "topic": "Out-of-Order Execution", "subtopic": "Role of the Reorder Buffer (ROB)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-018", "question": "A processor has a clock rate of 3 GHz and executes a program with an average CPI of 1.5. How many instructions does this processor execute in 2 milliseconds (ms)?", "options": {"A": "2 \u00d7 10\u2076 instructions", "B": "4 \u00d7 10\u2076 instructions", "C": "3 \u00d7 10\u2079 instructions", "D": "6 \u00d7 10\u2076 instructions"}, "correctAnswer": "B", "explanation": "Total clock cycles in 2 ms = 3 \u00d7 10\u2079 cycles/s \u00d7 2 \u00d7 10\u207b\u00b3 s = 6 \u00d7 10\u2076 cycles. Number of instructions = Total Cycles / CPI = (6 \u00d7 10\u2076) / 1.5 = 4 \u00d7 10\u2076 (4 million) instructions.", "moduleCode": "H", "module": "CPU Organization", "topic": "CPU Performance", "subtopic": "Instruction Execution Rate", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-H-019", "question": "Which three architectural barriers\u2014collectively known as the 'Brick Wall' of single-thread scaling\u2014drove processor designers in the mid-2000s to shift from raising single-core clock frequency to building Multicore processors?", "options": {"A": "Power Wall + Memory Wall + ILP (Instruction-Level Parallelism) Wall", "B": "Keyboard Wall + Monitor Wall + Printer Wall", "C": "ASCII Wall + BCD Wall + Gray Wall", "D": "ROM Wall + DMA Wall + Bus Wall"}, "correctAnswer": "A", "explanation": "David Patterson and John Hennessy formulated the Brick Wall: Power Wall (thermal limits of V\u00b2f), Memory Wall (DRAM speed lagging CPU speed), and ILP Wall (diminishing returns in finding parallel instructions in a single serial thread).", "moduleCode": "H", "module": "CPU Organization", "topic": "Multicore Architecture", "subtopic": "Why Multicore Replaced Frequency Scaling", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-H-020", "question": "In a synchronous CPU register file, why can a register be READ combinationally (asynchronously via a multiplexer as soon as its select address arrives), whereas WRITING to a register must wait for the active clock edge?", "options": {"A": "Because reading a flip-flop's output Q through a multiplexer does not alter state, whereas writing must be synchronized by a clock edge + Write-Enable signal to prevent race conditions", "B": "Because multiplexers require a clock input", "C": "Because decoders only work on falling clock edges", "D": "Because registers cannot be read"}, "correctAnswer": "A", "explanation": "Register outputs are continuously available at the MUX inputs (combinational read), while register state updates must be edge-triggered (`CLK \u2191` and `Load = 1`) so feedback paths through the ALU do not race within the same cycle.", "moduleCode": "H", "module": "CPU Organization", "topic": "Internal CPU Datapath", "subtopic": "Register File Read Timing", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-001", "question": "In designing a microprogrammed control unit, what is stored in the control memory?", "options": {"A": "Addressing modes", "B": "Microinstructions that define control signals", "C": "Machine-level user instructions", "D": "User data values"}, "correctAnswer": "B", "explanation": "In a microprogrammed control unit, the Control Memory (usually a fast internal ROM) stores microprograms made up of microinstructions that generate the internal control signals for each micro-operation.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microprogrammed Control", "subtopic": "Control Memory Contents", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 2 (1:00 PM)", "sourceReference": "https://www.utpaper.in/question/in-designing-a-microprogrammed-control-unit-what-is-stored-in-the-control-memory-3234", "numericalCategory": null}, {"id": "COA-I-002", "question": "Which of the following accurately compares a Hardwired Control Unit with a Microprogrammed Control Unit?", "options": {"A": "Hardwired control is slower but easier to modify than microprogrammed control", "B": "Hardwired control is faster (used in RISC) but harder to modify; Microprogrammed control is slower (due to Control ROM access) but easier to modify and ideal for complex CISC instructions", "C": "Both use a Control Memory ROM", "D": "Microprogrammed control cannot generate ALU signals"}, "correctAnswer": "B", "explanation": "Hardwired control uses fixed combinational logic gates (fastest execution, typical of RISC), whereas Microprogrammed control fetches microinstructions from Control Memory ROM (easier to design/modify, typical of CISC).", "moduleCode": "I", "module": "Control Unit Design", "topic": "Hardwired vs Microprogrammed", "subtopic": "Speed and Flexibility Comparison", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-003", "question": "Which of the following is a defining characteristic of 'Horizontal Microprogramming' compared to 'Vertical Microprogramming'?", "options": {"A": "Long (wide) microinstruction words with unencoded control bits (1 bit per control line), enabling high parallelism and zero external decoding delay", "B": "Short (narrow) microinstruction words requiring k \u00d7 2^k decoders", "C": "Inability to trigger more than one micro-operation per cycle", "D": "Storage of microinstructions on magnetic tape"}, "correctAnswer": "A", "explanation": "Horizontal microprogramming dedicates 1 bit per control signal (unencoded), resulting in wide microinstructions, maximum parallel micro-operations per cycle, and no decoder delay.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Horizontal vs Vertical", "subtopic": "Horizontal Microinstruction Characteristics", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-004", "question": "A CPU has 35 control signals partitioned into 4 mutually exclusive groups containing 7, 14, 6, and 8 signals respectively. How many total control field bits are required in a Vertically Encoded microinstruction (remembering to include 1 state per group for No-Operation)?", "options": {"A": "12 bits", "B": "14 bits", "C": "16 bits", "D": "35 bits"}, "correctAnswer": "B", "explanation": "For each mutually exclusive group of N_i signals, required bits = \u2308log\u2082(N_i + 1)\u2309 (adding 1 for NOP): Group 1: \u2308log\u2082(7+1)\u2309 = 3 bits; Group 2: \u2308log\u2082(14+1)\u2309 = 4 bits; Group 3: \u2308log\u2082(6+1)\u2309 = 3 bits; Group 4: \u2308log\u2082(8+1)\u2309 = 4 bits. Total = 3 + 4 + 3 + 4 = 14 bits!", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microinstruction Formats", "subtopic": "Vertical Group Encoding Numerical", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-I-005", "question": "In a Microprogrammed Control Unit, what is the exact role of the Control Address Register (CAR / \u00b5PC)?", "options": {"A": "It holds the address of the next machine instruction in DRAM", "B": "It holds the address of the next microinstruction to be read from Control Memory (Control ROM)", "C": "It stores the result of floating-point division", "D": "It holds the I/O port address"}, "correctAnswer": "B", "explanation": "CAR (also called the Microprogram Counter, \u00b5PC) specifies the address of the microinstruction in Control Memory, while CDR (Control Data/Buffer Register) holds the fetched microinstruction.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Control Memory", "subtopic": "CAR and CDR Registers", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-006", "question": "In Morris Mano's microprogram sequencer with a 128 \u00d7 20 Control Memory (7-bit CAR address), a 4-bit machine Opcode `xxxx` from `IR` is transformed into a 7-bit starting microprogram address by placing `0` at the MSB and `00` at the two LSBs (`0 xxxx 00\u2082`). How many words are spaced between adjacent machine instruction routines in Control Memory, and what is the starting decimal address for Opcode `1011\u2082` (11)?", "options": {"A": "4 words apart; starting address = 44 (0101100\u2082)", "B": "2 words apart; starting address = 22", "C": "8 words apart; starting address = 88", "D": "1 word apart; starting address = 11"}, "correctAnswer": "A", "explanation": "Appending two trailing zeros (`00\u2082`) multiplies the opcode by 4 (providing 4 microinstruction words per routine before branching). For Opcode `1011\u2082` (11), the 7-bit address is `0101100\u2082 = 11 \u00d7 4 = 44`.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microprogram Sequencing", "subtopic": "Opcode Mapping to Micro-Address", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-007", "question": "Who invented the concept of Microprogramming in 1951 using a diode matrix for the control signal array and next-address array?", "options": {"A": "John von Neumann", "B": "Maurice Wilkes", "C": "Seymour Cray", "D": "Gene Amdahl"}, "correctAnswer": "B", "explanation": "Sir Maurice Wilkes introduced Microprogramming in 1951 as a systematic, regular alternative to ad-hoc hardwired control logic.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Wilkes Control Unit", "subtopic": "Pioneer of Microprogramming", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-008", "question": "A microprogrammed control unit has a Control Memory of 1024 words. Each microinstruction contains 24 control bits, a 3-bit branch condition select field, and a Next-Address field capable of branching to any word in Control Memory. What is the total capacity of the Control Memory in bits?", "options": {"A": "37,888 bits", "B": "34,816 bits", "C": "24,576 bits", "D": "40,960 bits"}, "correctAnswer": "A", "explanation": "Step 1: Next-Address field for 1024 words = log\u2082(1024) = 10 bits. Step 2: Total width of each microinstruction = 24 (control) + 3 (condition) + 10 (address) = 37 bits. Step 3: Total Control Memory bits = 1024 \u00d7 37 = 37,888 bits.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microinstruction Formats", "subtopic": "Control Memory Total Size Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-009", "question": "A hardwired control unit requires 16 distinct sequential timing signals `T\u2080, T\u2081, ..., T\u2081\u2085`. If implemented using a binary Sequence Counter (SC) and a decoder instead of a 16-bit Ring Counter, what is the bit width of SC and the size of the decoder?", "options": {"A": "4-bit Sequence Counter and a 4 \u00d7 16 Decoder", "B": "16-bit Sequence Counter and a 16 \u00d7 4 Decoder", "C": "8-bit Sequence Counter and an 8 \u00d7 16 Decoder", "D": "2-bit Sequence Counter and a 2 \u00d7 4 Decoder"}, "correctAnswer": "A", "explanation": "Since 2\u2074 = 16, a 4-bit binary Sequence Counter coupled with a 4 \u00d7 16 decoder generates all 16 mutually exclusive timing signals `T\u2080..T\u2081\u2085`.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Hardwired Control", "subtopic": "Ring Counter vs Binary Counter + Decoder", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-010", "question": "What is 'Dynamic Microprogramming', and what type of Control Memory does it require?", "options": {"A": "A control unit whose microprograms can be modified or loaded dynamically by system software, requiring a Writable Control Store (WCS / RAM or EEPROM) instead of a fixed mask ROM", "B": "A control unit without any clock signal", "C": "A hardwired PLA that melts fuses at runtime", "D": "A cache replacement policy"}, "correctAnswer": "A", "explanation": "Dynamic microprogramming uses a Writable Control Store (WCS) so new instruction sets, emulators, or microcode security patches can be loaded into Control Memory after manufacture.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microprogrammed Control", "subtopic": "Dynamic Microprogramming & WCS", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-011", "question": "In a Microprogram Sequencer, what is the purpose of the Subroutine Register (`SBR`)?", "options": {"A": "To store user C++ local variables", "B": "To save the return micro-address (`CAR + 1`) when a microinstruction makes a micro-subroutine call (such as the shared Effective Address fetch micro-routine)", "C": "To hold the ALU status flags", "D": "To count cache misses"}, "correctAnswer": "B", "explanation": "Microprograms can call shared micro-subroutines (e.g., an indirect address calculation routine); the Sequencer saves `CAR + 1` in `SBR` on `CALL` and restores `CAR \u2190 SBR` on `RET`.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microprogram Sequencing", "subtopic": "Subroutine Register (SBR)", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-012", "question": "In processors like the Motorola 68000, 'Nanoprogramming' (a two-level control store consisting of a narrow vertical Micro-ROM that points to a wide horizontal Nano-ROM) is used primarily to:", "options": {"A": "Reduce total control ROM bit area when the same wide horizontal control word patterns occur repeatedly across many microinstructions", "B": "Eliminate the ALU from the processor", "C": "Double the external RAM bus width", "D": "Replace virtual memory paging"}, "correctAnswer": "A", "explanation": "If `M` microinstructions share only `U` unique wide (`W`-bit) control word patterns (`U \u226a M`), storing narrow `log\u2082(U)`-bit pointers in Micro-ROM and the `U` wide `W`-bit words in Nano-ROM dramatically reduces total silicon ROM bits!", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microinstruction Formats", "subtopic": "Nanoprogramming (Two-Level Control)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-013", "question": "Why do most modern microprogrammed control units use a single 'Branch Address' field plus a multiplexer (selecting between `CAR + 1` and `Branch_Address`) instead of storing TWO address fields in every microinstruction?", "options": {"A": "Because storing two address fields in every microinstruction wastes Control ROM bits whenever microinstructions execute sequentially", "B": "Because Control ROM cannot hold binary numbers", "C": "Because `CAR` cannot be incremented", "D": "Because multiplexers are slower than magnetic disks"}, "correctAnswer": "A", "explanation": "Most microinstructions execute sequentially (`CAR \u2190 CAR + 1`), so dedicating a second address field in every word wastes ROM space; a hardware incrementer + MUX is much more area-efficient.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microinstruction Sequencing", "subtopic": "Single-Address vs Two-Address Microinstructions", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-014", "question": "In a Hardwired Control Unit implemented using the 'One-Hot' state assignment method (1 flip-flop per control state), how many flip-flops are required for a state machine with 12 control states?", "options": {"A": "4 flip-flops", "B": "12 flip-flops", "C": "24 flip-flops", "D": "2\u00b9\u00b2 = 4096 flip-flops"}, "correctAnswer": "B", "explanation": "One-Hot encoding assigns exactly 1 flip-flop per state (so 12 states = 12 flip-flops, where exactly one flip-flop is '1' at any time), eliminating state-decoding delay.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Hardwired Control", "subtopic": "One-Hot State Encoding", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-015", "question": "Which four sources provide the primary inputs to the Control Unit logic matrix / sequencer?", "options": {"A": "Instruction Register (Opcode), Status Flags (PSW), Clock / Timing Signals, and External Control Bus Signals (e.g., Interrupt Request / Bus Grant)", "B": "Monitor, Keyboard, Mouse, and Printer", "C": "Hard Disk, CD-ROM, USB, and Ethernet", "D": "L1 Cache, L2 Cache, L3 Cache, and TLB"}, "correctAnswer": "A", "explanation": "The Control Unit takes inputs from the IR opcode decoder, ALU Status Flags (for conditional branches), Clock/Timing generator, and external control bus signals (`INTR`, `WAIT`).", "moduleCode": "I", "module": "Control Unit Design", "topic": "Control Unit Inputs", "subtopic": "Inputs to Control Logic", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-016", "question": "In a pipelined microprogrammed control unit, what is the role of the Control Data Register (`CDR` / Pipeline Register) placed at the output of Control Memory?", "options": {"A": "It allows the execution of the current microinstruction in `CDR` to overlap with the fetching of the next microinstruction from Control Memory using `CAR`", "B": "It converts binary microcode into ASCII text", "C": "It replaces the Program Counter in main memory", "D": "It disables the ALU"}, "correctAnswer": "A", "explanation": "`CDR` acts as a pipeline latch: while the datapath executes the control signals currently latched in `CDR`, the Control Memory fetches the next microinstruction addressed by `CAR`.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Microprogrammed Control", "subtopic": "Microinstruction Pipelining", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-017", "question": "When partitioning control signals into mutually exclusive groups for Vertical Microprogramming, which rule MUST be followed?", "options": {"A": "Two control signals that need to be active SIMULTANEOUSLY in the same clock cycle must NEVER be placed in the same encoded group", "B": "All ALU signals must be placed in different groups", "C": "Every group must contain exactly 2 signals", "D": "No group can include a NOP state"}, "correctAnswer": "A", "explanation": "Because an encoded group decoder (`k \u00d7 2^k`) can assert only ONE output line at a time, any two control signals that must be asserted concurrently in the same microinstruction must belong to different groups!", "moduleCode": "I", "module": "Control Unit Design", "topic": "Horizontal vs Vertical", "subtopic": "Parallel Micro-operations Constraint", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-018", "question": "Which programmable combinational logic device consisting of a programmable AND plane followed by a programmable OR plane is commonly used to synthesize Hardwired Control Unit boolean equations?", "options": {"A": "Programmable Logic Array (PLA)", "B": "Dynamic RAM (DRAM)", "C": "Shift Register", "D": "Multiplexer"}, "correctAnswer": "A", "explanation": "A Programmable Logic Array (PLA) implements sum-of-products Boolean control equations cleanly using a programmable AND array and programmable OR array.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Hardwired Control", "subtopic": "PLA Implementation", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-019", "question": "What is the relationship between a 'Machine Instruction' and a 'Microinstruction'?", "options": {"A": "A single Machine Instruction (in Main Memory) is executed by a sequence of one or more Microinstructions (stored in Control Memory)", "B": "A single Microinstruction is made up of 100 Machine Instructions", "C": "They are identical terms", "D": "Microinstructions are written by end-users in Python"}, "correctAnswer": "A", "explanation": "Each machine instruction (e.g., `ADD`, `MUL`) triggers a microprogram routine consisting of a sequence of microinstructions in Control Memory.", "moduleCode": "I", "module": "Control Unit Design", "topic": "Control Word", "subtopic": "Microprogram vs Machine Program", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-I-020", "question": "Why do RISC processors almost universally use a Hardwired Control Unit instead of a Microprogrammed Control Unit?", "options": {"A": "Because RISC instructions have fixed length and simple formats that must execute in a single fast clock cycle without Control ROM lookup latency", "B": "Because ROM chips cannot be fabricated on silicon", "C": "Because RISC processors do not have an Instruction Register", "D": "Because RISC instructions are 15 bytes long"}, "correctAnswer": "A", "explanation": "RISC's simple, fixed-width instructions decode directly in 1 cycle using fast hardwired combinational logic.", "moduleCode": "I", "module": "Control Unit Design", "topic": "RISC vs CISC Control", "subtopic": "Why RISC Uses Hardwired Control", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-001", "question": "How many clock cycles are required to execute `n = 100` instructions in an ideal `k = 5`-stage instruction pipeline with no hazards or stalls?", "options": {"A": "500 cycles", "B": "104 cycles", "C": "105 cycles", "D": "95 cycles"}, "correctAnswer": "B", "explanation": "In a k-stage pipeline without stalls, the first instruction takes k = 5 cycles and the remaining (n \u2212 1) = 99 instructions complete at 1 per cycle: Total Cycles = k + n \u2212 1 = 5 + 100 \u2212 1 = 104 cycles.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Timing", "subtopic": "Total Cycles Formula", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-002", "question": "A 5-stage instruction pipeline has stage delays of IF = 120 ps, ID = 150 ps, EX = 200 ps, MEM = 180 ps, and WB = 100 ps. If each inter-stage pipeline register (latch) has a delay of 20 ps, what is the minimum clock cycle time (`\u03c4`) and maximum clock frequency of the pipeline?", "options": {"A": "\u03c4 = 220 ps (f \u2248 4.55 GHz)", "B": "\u03c4 = 200 ps (f = 5.0 GHz)", "C": "\u03c4 = 170 ps (f \u2248 5.88 GHz)", "D": "\u03c4 = 770 ps (f \u2248 1.30 GHz)"}, "correctAnswer": "A", "explanation": "The pipeline clock cycle time is determined by the slowest stage (`max = 200 ps` in EX) plus the latch delay (`20 ps`): `\u03c4 = 200 + 20 = 220 ps`. Clock frequency `f = 1 / 220 ps \u2248 4.545 GHz`.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Clock Period", "subtopic": "Bottleneck Stage & Latch Delay", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-003", "question": "For an ideal `k`-stage balanced pipeline (where all stages have equal delay and zero latch overhead) executing a very large number of instructions (`n \u2192 \u221e`) without stalls, what is the maximum theoretical speedup over an equivalent non-pipelined processor?", "options": {"A": "k\u00b2", "B": "k (equal to the number of pipeline stages)", "C": "2^k", "D": "k \u2212 1"}, "correctAnswer": "B", "explanation": "As `n \u2192 \u221e`, `S = (n \u00d7 k \u00d7 \u03c4) / [(k + n \u2212 1) \u00d7 \u03c4] = k / (k/n + 1 \u2212 1/n) \u2192 k`. Thus the ideal asymptotic speedup of a k-stage balanced pipeline is `k`.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Speedup", "subtopic": "Asymptotic Maximum Speedup", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-004", "question": "A non-pipelined processor takes 50 ns to execute an instruction. It is converted into a 5-stage pipeline with stage delays of 10 ns, 8 ns, 12 ns, 11 ns, and 9 ns (latch delay = 0 ns). What is the asymptotic speedup (`n \u2192 \u221e`) of this pipeline over the non-pipelined processor?", "options": {"A": "5.0", "B": "4.17", "C": "4.55", "D": "3.85"}, "correctAnswer": "B", "explanation": "Non-pipelined time per instruction = 50 ns. Pipelined cycle time \u03c4 = max(10, 8, 12, 11, 9) = 12 ns. For large n (1 instruction completed per 12 ns cycle), Asymptotic Speedup = 50 ns / 12 ns = 4.167 (4.17).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Speedup", "subtopic": "Unbalanced Pipeline Asymptotic Speedup", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-005", "question": "Consider the following two consecutive instructions:\n`I1: ADD R1, R2, R3`   (R1 \u2190 R2 + R3)\n`I2: SUB R4, R1, R5`   (R4 \u2190 R1 \u2212 R5)\nWhich type of pipeline hazard exists between `I1` and `I2`?", "options": {"A": "Structural Hazard", "B": "Read-After-Write (RAW) True Data Hazard on register R1", "C": "Write-After-Read (WAR) Anti-Dependency Hazard", "D": "Write-After-Write (WAW) Output Dependency Hazard"}, "correctAnswer": "B", "explanation": "`I1` writes to `R1` (in WB) and `I2` subsequently reads `R1` (in ID/EX). Because `I2` attempts to read `R1` before `I1` has written its result back, this is a Read-After-Write (RAW) true data dependency.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Data Hazard Classification (RAW, WAR, WAW)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-006", "question": "In a 5-stage RISC pipeline (`IF, ID, EX, MEM, WB`), how many stall cycles are required between `I1: ADD R1, R2, R3` and `I2: SUB R4, R1, R5` when full ALU-to-ALU Operand Forwarding (EX/MEM \u2192 EX bypass) is implemented?", "options": {"A": "0 stall cycles", "B": "1 stall cycle", "C": "2 stall cycles", "D": "3 stall cycles"}, "correctAnswer": "A", "explanation": "Because `ADD` computes the new value of `R1` by the end of `I1`'s `EX` stage (Cycle 3), hardware forwarding routes `R1` directly from the `EX/MEM` pipeline latch to the ALU input at the start of `I2`'s `EX` stage (Cycle 4) with **0 stall cycles**!", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Operand Forwarding (Bypassing)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-007", "question": "Even when a 5-stage pipeline (`IF, ID, EX, MEM, WB`) implements full Operand Forwarding, why does the instruction pair `I1: LW R1, 0(R2)` followed immediately by `I2: ADD R3, R1, R4` STILL require 1 stall cycle (pipeline bubble)?", "options": {"A": "Because `LW` only retrieves the data from D-Cache at the end of the `MEM` stage (Cycle 4), which is too late for `I2`'s `EX` stage in Cycle 4 (`MEM/WB \u2192 EX` forwarding can only feed `I2`'s `EX` in Cycle 5)", "B": "Because `LW` does not write to a register", "C": "Because `ADD` does not use the ALU", "D": "Because `R1` is hardwired to zero"}, "correctAnswer": "A", "explanation": "This is the classic **Load-Use Hazard**: `LW` gets data from memory at the end of Cycle 4 (`MEM`), whereas `ADD` needs `R1` at the start of Cycle 4 (`EX`). Hardware interlock inserts 1 stall bubble (or the compiler schedules an independent instruction between `LW` and `ADD`).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Load-Use Data Hazard", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-008", "question": "In a 5-stage pipeline with a single unified cache/memory (Von Neumann style), a Structural Hazard occurs in Clock Cycle 4 when Instruction `I1` (a `LOAD` or `STORE`) is in the `MEM` stage while Instruction `I4` is in the `IF` stage. How do modern processors eliminate this structural hazard?", "options": {"A": "By removing the `MEM` stage from the pipeline", "B": "By using a Modified Harvard architecture with separate L1 Instruction Cache (I-Cache) and L1 Data Cache (D-Cache)", "C": "By using register renaming", "D": "By flushing the pipeline on every instruction"}, "correctAnswer": "B", "explanation": "Splitting L1 cache into a dedicated Instruction Cache (for `IF`) and Data Cache (for `MEM`) provides two independent memory ports, completely eliminating fetch/data structural conflicts.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Structural Hazard Cause & Solution", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-009", "question": "In a 5-stage pipelined processor, 25% of all instructions are `LOAD` instructions, and 40% of `LOAD` instructions are immediately followed by a dependent instruction that causes a 1-cycle Load-Use stall. Assuming no other hazards, what is the effective CPI of the processor?", "options": {"A": "1.00", "B": "1.10", "C": "1.25", "D": "1.40"}, "correctAnswer": "B", "explanation": "Average stall cycles per instruction = Fraction_of_Loads (0.25) \u00d7 Fraction_Dependent (0.40) \u00d7 Stall_Penalty (1) = 0.10 cycles. Effective CPI = Ideal_CPI (1) + 0.10 = 1.10.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Performance", "subtopic": "CPI with Stalls Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-010", "question": "A pipelined processor has an ideal CPI of 1. Conditional branches account for 15% of all instructions, and the branch predictor has an 80% accuracy rate (so 20% of branches are mispredicted). If each mispredicted branch incurs a 3-cycle flush penalty, what is the effective CPI?", "options": {"A": "1.09", "B": "1.45", "C": "1.36", "D": "1.15"}, "correctAnswer": "A", "explanation": "Branch stall cycles per instruction = Branch_Frequency (0.15) \u00d7 Misprediction_Rate (1 \u2212 0.80 = 0.20) \u00d7 Penalty (3 cycles) = 0.15 \u00d7 0.20 \u00d7 3 = 0.09. Effective CPI = 1 + 0.09 = 1.09.", "moduleCode": "J", "module": "Pipelining", "topic": "Control Hazards", "subtopic": "Branch Penalty & Speedup", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-011", "question": "In 'Delayed Branching' (used in MIPS and SPARC RISC pipelines), what instruction does the compiler place into the 'Branch Delay Slot' immediately following a branch instruction?", "options": {"A": "An instruction from before the branch that is independent of the branch condition and must always be executed whether the branch is taken or not", "B": "A `HLT` instruction", "C": "An illegal opcode to trigger a trap", "D": "A duplicate copy of the branch instruction itself"}, "correctAnswer": "A", "explanation": "The instruction in the branch delay slot is fetched and executed unconditionally before the branch takes effect. The compiler fills the slot with a useful instruction from before the branch (or `NOP` if none is available).", "moduleCode": "J", "module": "Pipelining", "topic": "Control Hazards", "subtopic": "Delayed Branching (Branch Delay Slot)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-012", "question": "Why is a 2-bit dynamic branch predictor (4 states: Strongly Taken, Weakly Taken, Weakly Not Taken, Strongly Not Taken) markedly superior to a 1-bit branch predictor for program loops?", "options": {"A": "A 1-bit predictor mispredicts TWICE per loop execution (on loop exit and again on loop re-entry), whereas a 2-bit predictor requires TWO consecutive wrong outcomes to flip its prediction, mispredicting only ONCE per loop (on exit)!", "B": "A 2-bit predictor does not use any flip-flops", "C": "A 1-bit predictor can only predict unconditional jumps", "D": "A 2-bit predictor eliminates data hazards"}, "correctAnswer": "A", "explanation": "At the end of a loop that iterates 100 times, the exit branch is Not Taken once; a 1-bit predictor flips immediately and mispredicts again on the first iteration of the next loop invocation, whereas a 2-bit predictor moves from Strongly Taken to Weakly Taken and still predicts Taken on re-entry!", "moduleCode": "J", "module": "Pipelining", "topic": "Branch Prediction", "subtopic": "2-Bit Saturating Counter Predictor", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-013", "question": "Why do Write-After-Read (WAR) and Write-After-Write (WAW) data hazards NEVER occur in the classic 5-stage in-order RISC pipeline (`IF, ID, EX, MEM, WB`)?", "options": {"A": "Because all register reads occur early in Stage 2 (`ID`) and all register writes occur late in Stage 5 (`WB`) strictly in program order", "B": "Because RISC processors have only 1 register", "C": "Because operand forwarding prevents writes", "D": "Because the `WB` stage occurs before `IF`"}, "correctAnswer": "A", "explanation": "Since every instruction reads its registers in `ID` (stage 2) and writes its destination register in `WB` (stage 5) in strict program order, a later instruction can never write a register before an earlier instruction reads (`WAR`) or writes (`WAW`) it.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "WAR and WAW in In-Order 5-Stage Pipeline", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-014", "question": "Pipelining a processor datapath primarily improves CPU performance by:", "options": {"A": "Decreasing the execution latency of each individual instruction in isolation", "B": "Increasing the overall instruction throughput (number of instructions completed per unit time)", "C": "Eliminating the need for main memory", "D": "Reducing the number of registers in the CPU"}, "correctAnswer": "B", "explanation": "Pipelining increases **instruction throughput** (approaching 1 instruction completed per clock cycle) without reducing the latency of an individual instruction.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Latency vs Throughput", "subtopic": "Core Effect of Pipelining", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-015", "question": "A 6-stage pipeline with a clock cycle of 10 ns executes 15 instructions without stalls. What are the actual Speedup (`S`) and Pipeline Efficiency (`\u03b7`) compared to a non-pipelined unit that takes 60 ns per instruction?", "options": {"A": "Speedup = 4.5, Efficiency = 75%", "B": "Speedup = 6.0, Efficiency = 100%", "C": "Speedup = 3.0, Efficiency = 50%", "D": "Speedup = 5.0, Efficiency = 83.3%"}, "correctAnswer": "A", "explanation": "Step 1: Non-pipelined time = 15 \u00d7 60 ns = 900 ns. Step 2: Pipelined time = (k + n \u2212 1) \u00d7 \u03c4 = (6 + 15 \u2212 1) \u00d7 10 ns = 20 \u00d7 10 = 200 ns. Step 3: Speedup S = 900 / 200 = 4.5. Step 4: Efficiency \u03b7 = S / k = 4.5 / 6 = 0.75 = 75%.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Efficiency", "subtopic": "Efficiency & Throughput Numerical", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-016", "question": "In a 5-stage RISC pipeline, if Instruction `I1` is in the `WB` stage (writing `R1`) during the exact same clock cycle (Cycle 5) that Instruction `I4` is in the `ID` stage (reading `R1`), how do they avoid reading stale data without inserting a stall?", "options": {"A": "The Register File performs writes in the FIRST half of the clock cycle (on falling/rising edge) and reads in the SECOND half of the clock cycle (or provides internal Register File write-through forwarding)", "B": "I4 is aborted and re-fetched", "C": "I1's write is discarded", "D": "The clock is stopped"}, "correctAnswer": "A", "explanation": "By writing to the Register File in the first half of the clock cycle and reading in the second half (split-phase clock), `I4` in `ID` reads the newly written value of `R1` from `I1` in `WB` during Cycle 5 with 0 stalls!", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Latches", "subtopic": "Register Split Read/Write in Same Cycle", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-017", "question": "Why do high-performance pipelined processors include a 'Branch Target Buffer (BTB)' indexed by the `PC` during the `IF` stage alongside the branch direction predictor?", "options": {"A": "Because knowing a branch is Taken is useless in `IF` unless we also know the TARGET ADDRESS (`PC_target`) in Cycle 1 before the instruction is even decoded!", "B": "To store floating-point remainders", "C": "To replace the Data Cache", "D": "To count page faults"}, "correctAnswer": "A", "explanation": "The BTB caches `(Branch_PC \u2192 Target_Address)` so that if the `IF` stage hits in the BTB and predicts Taken, the very next cycle fetches from `Target_Address` with **zero branch penalty cycles**!", "moduleCode": "J", "module": "Pipelining", "topic": "Branch Prediction", "subtopic": "Branch Target Buffer (BTB)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-018", "question": "When the Hazard Detection Unit inserts a 1-cycle 'stall' (pipeline bubble) in the `ID` stage, what control action does it take?", "options": {"A": "It freezes `PC` and the `IF/ID` latch (so the stalled instruction is held) and forces all control signals (`RegWrite`, `MemWrite`) in the `ID/EX` latch to `0` (creating a harmless `NOP` bubble)", "B": "It turns off power to the RAM", "C": "It resets `PC` to 0x0000", "D": "It erases the Register File"}, "correctAnswer": "A", "explanation": "De-asserting `RegWrite = 0` and `MemWrite = 0` in the `ID/EX` pipeline register creates a safe `NOP` bubble that flows down `EX, MEM, WB` without modifying any architectural state, while `PC` and `IF/ID` are held.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Stalls", "subtopic": "What is a Pipeline Bubble / NOP?", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-019", "question": "In a 4-stage Arithmetic Pipeline for Floating-Point Addition, what is the correct sequential order of the four stages?", "options": {"A": "1. Compare exponents \u2192 2. Align mantissas (shift right) \u2192 3. Add/Subtract mantissas \u2192 4. Normalize result & round", "B": "1. Multiply mantissas \u2192 2. Add exponents \u2192 3. Subtract bias \u2192 4. Round", "C": "1. Normalize \u2192 2. Compare exponents \u2192 3. Align \u2192 4. Add", "D": "1. Add mantissas \u2192 2. Compare exponents \u2192 3. Shift left \u2192 4. Truncate"}, "correctAnswer": "A", "explanation": "A 4-stage pipelined FP adder performs: Stage 1 (Compare exponents by subtraction), Stage 2 (Align smaller number's mantissa by right-shifting), Stage 3 (Add or subtract aligned mantissas), Stage 4 (Normalize and round).", "moduleCode": "J", "module": "Pipelining", "topic": "Arithmetic Pipelining", "subtopic": "Floating-Point Adder Pipeline", "difficulty": "Moderate", "questionType": "Sequence/Order", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-020", "question": "In an out-of-order pipeline, consider:\n`I1: DIV R1, R2, R3`   (R1 \u2190 R2 / R3)\n`I2: ADD R2, R4, R5`   (R2 \u2190 R4 + R5)\n`I3: SUB R1, R6, R7`   (R1 \u2190 R6 \u2212 R7)\nWhat hazard exists between `(I1, I2)` and between `(I1, I3)`?", "options": {"A": "(I1, I2) is WAR (anti-dependency on R2); (I1, I3) is WAW (output dependency on R1)", "B": "(I1, I2) is RAW; (I1, I3) is WAR", "C": "(I1, I2) is WAW; (I1, I3) is RAW", "D": "Both are Structural hazards"}, "correctAnswer": "A", "explanation": "`I1` reads `R2` while `I2` writes `R2` (`Write-After-Read = WAR` on `R2`). Both `I1` and `I3` write to `R1` (`Write-After-Write = WAW` on `R1`).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Identify WAR and WAW Pairs", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-021", "question": "A 5-stage pipeline (`IF, ID, EX, MEM, WB`) with full Operand Forwarding executes the following 3 instructions:\n`I1: LW  R1, 0(R2)`\n`I2: ADD R3, R1, R4`\n`I3: SUB R5, R3, R1`\nHow many total clock cycles are required to complete all 3 instructions?", "options": {"A": "7 cycles", "B": "8 cycles", "C": "9 cycles", "D": "10 cycles"}, "correctAnswer": "B", "explanation": "`I1 (LW)` finishes in Cycle 5. `I2 (ADD)` depends on `LW R1` (Load-Use hazard!), so `I2` stalls for 1 cycle and finishes in Cycle 7. `I3 (SUB)` depends on `R3` from `I2`, which is forwarded via `EX/MEM \u2192 EX` with 0 additional stalls, finishing in Cycle 8! (`k + n - 1 + 1 stall = 5 + 3 - 1 + 1 = 8` cycles).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Performance", "subtopic": "Instruction Sequence Cycle Trace with Forwarding", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-022", "question": "How can an optimizing compiler eliminate the 1-cycle Load-Use stall in the sequence `LW R1, 0(R2); ADD R3, R1, R4; LW R5, 4(R2); ADD R6, R5, R4` without changing program semantics?", "options": {"A": "By reordering the independent second load ahead of the first add: `LW R1, 0(R2); LW R5, 4(R2); ADD R3, R1, R4; ADD R6, R5, R4`", "B": "By deleting both ADD instructions", "C": "By replacing LW with SW", "D": "By disabling the cache"}, "correctAnswer": "A", "explanation": "Moving the independent `LW R5, 4(R2)` between `LW R1, 0(R2)` and `ADD R3, R1, R4` separates each Load from its dependent Add by 1 instruction, reducing Load-Use stalls from 2 to 0!", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Scheduling", "subtopic": "Compiler Instruction Reordering", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-023", "question": "What is a 'Superpipelined' processor (e.g., MIPS R4000 or Intel Pentium 4 with 20\u201331 stages), and what is its main downside when subdividing a pipeline into too many stages?", "options": {"A": "A processor with a very deep pipeline (`k = 10 to 30+` stages) for high clock frequency; downside is higher latch overhead and severe multi-cycle branch misprediction penalties", "B": "A processor with only 2 stages", "C": "A processor that executes 10 instructions in 1 stage", "D": "A processor without branch instructions"}, "correctAnswer": "A", "explanation": "Increasing pipeline depth `k` shortens stage delay and raises clock rate, but latch delay (`d`) becomes a large fraction of the cycle and branch misprediction flushes waste many more cycles.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Depth", "subtopic": "Superpipelining Trade-Off", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-024", "question": "In a 5-stage pipeline, if conditional branch target calculation and comparison are moved from the `EX` stage (Stage 3) into the `ID` stage (Stage 2) using a dedicated comparator and adder, the taken-branch flush penalty (without prediction) is reduced from:", "options": {"A": "2 stall cycles down to 1 stall cycle", "B": "4 stall cycles down to 3 stall cycles", "C": "3 stall cycles down to 0 stall cycles", "D": "1 stall cycle down to 2 stall cycles"}, "correctAnswer": "A", "explanation": "Resolving branches at the end of `EX` (Stage 3) flushes instructions fetched in Cycles 2 and 3 (2-cycle penalty). Moving branch resolution to `ID` (Stage 2) flushes only the 1 instruction fetched in Cycle 2 (1-cycle penalty!).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Branch Resolved in ID vs EX", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-025", "question": "In static/dynamic multifunction pipelines analyzed using a Space-Time Reservation Table, if two checkmarks ('X') in the same row occur in columns `t = 2` and `t = 5`, what is the 'Forbidden Latency' between initiating two tasks?", "options": {"A": "3 clock cycles (`5 \u2212 2 = 3`)", "B": "7 clock cycles (`5 + 2 = 7`)", "C": "2 clock cycles", "D": "5 clock cycles"}, "correctAnswer": "A", "explanation": "If a pipeline stage (row) is used at times `t_i` and `t_j` by the same task, initiating a second task `|t_j \u2212 t_i| = |5 \u2212 2| = 3` cycles later will cause both tasks to collide in that stage at cycle 5!", "moduleCode": "J", "module": "Pipelining", "topic": "Reservation Table", "subtopic": "Forbidden Latency & Collision Vector", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-026", "question": "In a pipeline whose Reservation Table has forbidden latencies `{2, 4}` (so permissible initiation latencies include `1, 3, 5, ...`), if latency `1` does not cause a collision with `{2, 4}`Wait\u2014if `1` is permissible, can `1 + 1 = 2` occur? Why does initiating a third task at `t = 1 + 1 = 2` collide if `2` is forbidden?", "options": {"A": "Because two consecutive initiations of latency 1 (`1, 1`) sum to a cumulative distance of `1 + 1 = 2` (which is forbidden!), so the greedy cycle must alternate `(1, 3)` giving Minimum Average Latency = `(1 + 3) / 2 = 2.0`!", "B": "Because latency 1 is always forbidden", "C": "Because MAL is always 4", "D": "Because reservation tables have no rows"}, "correctAnswer": "A", "explanation": "In a state diagram for forbidden set `{2, 4}` (Initial Collision Vector `1010\u2082`), shifting right by 1 gives `0101\u2082 | 1010\u2082 = 1111\u2082`, where latency 3 returns to `1010\u2082`, yielding the cycle `(1, 3)` with Average Latency = `(1 + 3)/2 = 2.0` cycles!", "moduleCode": "J", "module": "Pipelining", "topic": "Reservation Table", "subtopic": "Minimum Average Latency (MAL)", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-027", "question": "Which values are latched inside the `EX/MEM` inter-stage pipeline register at the end of the `EX` stage in a 5-stage RISC pipeline?", "options": {"A": "The ALU result, the Store data value (`R[rs2]`), the destination register number (`Rd`), and the `MEM`/`WB` control signals", "B": "Only the Program Counter", "C": "The entire L1 Instruction Cache", "D": "The ASCII code of the instruction mnemonic"}, "correctAnswer": "A", "explanation": "Each inter-stage latch must carry forward both the computed data/addresses (`ALUOut`, `WriteData`, `Rd`) and the remaining control signals needed by downstream stages (`MEM` and `WB`).", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Stages", "subtopic": "Role of EX/MEM Pipeline Register", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-028", "question": "A 5-stage pipelined processor operates with a clock c
