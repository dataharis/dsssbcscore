dth=\"200\" height=\"120\" rx=\"8\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"75\" fill=\"#ecfdf5\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">DMA Controller (8237/8257)</text>\n  <text x=\"410\" y=\"96\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">\u2022 Address Register</text>\n  <text x=\"410\" y=\"113\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">\u2022 Word Count Register</text>\n  <text x=\"410\" y=\"130\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">\u2022 Control/Status Reg</text>\n  <text x=\"410\" y=\"150\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">RD/WR = Output when BG=1</text>\n\n  <line x1=\"510\" y1=\"110\" x2=\"585\" y2=\"110\" stroke=\"#38bdf8\" stroke-width=\"4\"/>\n  <text x=\"547\" y=\"100\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">Direct Bus</text>\n\n  <rect x=\"585\" y=\"55\" width=\"150\" height=\"110\" rx=\"8\" fill=\"#1e293b\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"660\" y=\"95\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Main Memory</text>\n  <text x=\"660\" y=\"115\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">(RAM)</text>\n  <text x=\"660\" y=\"138\" fill=\"#86efac\" font-size=\"10\" text-anchor=\"middle\">High-Speed Block I/O</text>\n</svg>", "workedExamples": [{"title": "DMA Cycle Stealing CPU Slowdown %", "problem": "A disk controller uses cycle-stealing DMA to transfer data at 4 MB/s into main memory over a 32-bit (4-byte) memory bus. If each DMA memory cycle takes 250 ns to steal, what percentage of CPU memory bus time is consumed by DMA?", "steps": ["Step 1: Bytes transferred per DMA cycle = 32 bits = 4 bytes.", "Step 2: Number of DMA transfers per second = (4 \u00d7 10^6 bytes/s) / (4 bytes/transfer) = 10^6 transfers/s.", "Step 3: Total bus time stolen per second = 10^6 \u00d7 250 ns = 10^6 \u00d7 250 \u00d7 10^(\u22129) s = 0.25 seconds.", "Step 4: Percentage of bus time stolen = (0.25 s / 1.0 s) \u00d7 100% = 25%."], "answer": "25% of bus time."}], "realWorld": "Intel 8255 is the classic Programmable Peripheral Interface (PPI), and Intel 8237 / 8257 is the classic Programmable DMA Controller used in PC architectures.", "differences": "Burst Mode vs. Cycle Stealing DMA: Burst Mode locks the bus for an entire multi-word block transfer (maximizes I/O throughput, blocks CPU memory access), whereas Cycle Stealing transfers 1 word per stolen bus cycle (minimizes CPU latency).", "formulas": ["DMA Transfers/sec = Data Transfer Rate (Bytes/s) / Bytes per Bus Transfer", "CPU Bus Slowdown % (Cycle Stealing) = (DMA Transfers/sec \u00d7 Time per Stolen Cycle) \u00d7 100%"], "examTraps": ["TRAP 1: Thinking the Read and Write lines of a DMA controller are unidirectional. They are **bidirectional**! Input lines when `BG = 0` (CPU programs DMA registers) and Output lines when `BG = 1` (DMA drives RAM) \u2014 tested in DSSSB PGT CS 11 Jul 2021 Q4!", "TRAP 2: Confusing Strobe control with Handshaking. Strobe uses a single control line and cannot verify whether the receiver actually captured the data; Handshaking adds a second reply line (`Data Accepted`) to guarantee synchronization."], "factsToMemorize": ["In DMA, the CPU only intervenes at the **beginning** (initializing Address, Count, and Read/Write control) and at the **end** (handling the single completion interrupt when Word Count reaches 0).", "When `BG = 1`, the CPU places its Address, Data, and Read/Write lines into the **High-Impedance (Tri-state)** state."], "pyqInsights": "DSSSB PGT CS 11 Jul 2021 Q2, Q3, Q4 tested the I/O Interface Unit, Data Input Command, and DMA `BG=1` Read/Write line direction; DSSSB TGT CS 7 Feb 2024 Shift 2 Q138 tested Burst Transfer DMA.", "quickRevision": "I/O Interface resolves speed/format mismatch. Memory-mapped I/O shares address space & uses LOAD/STORE; Isolated I/O uses separate port space & IN/OUT. Programmed I/O = busy-wait polling. Interrupt I/O = interrupt per word. DMA = hardware block transfer (Burst = full block; Cycle Stealing = 1 word/cycle; BG=1 -> DMA RD/WR are outputs)."}, {"id": "MOD-O", "code": "O", "title": "Module O: Interrupts and Exceptions", "shortTitle": "O. Interrupts", "navGroup": "mod-interrupts-dma", "targetQuestions": 20, "subtopics": ["Interrupt fundamentals", "Hardware vs Software interrupts", "Maskable vs Non-Maskable Interrupts (NMI)", "Vectored vs Non-vectored interrupts", "Synchronous exceptions (Trap, Fault, Abort) vs Asynchronous interrupts", "Interrupt Service Routine (ISR) & Interrupt Vector Table (IVT)", "Interrupt cycle & Interrupt handling sequence", "Interrupt priority: Software Polling vs Hardware Daisy Chaining vs Parallel Priority (8259 PIC)", "Nested interrupts, Interrupt latency, Context saving and restoration, System calls"], "intro": "Interrupts and Exceptions allow the CPU to respond asynchronously to external hardware events or synchronously to internal program conditions (traps, page faults, division by zero). DSSSB TGT CS (1 Aug 2021 Shift 1 Q53) directly tested interrupt masking, and exams frequently test Vectored vs. Non-Vectored and Daisy Chaining priority.", "definitions": [{"term": "Interrupt Masking", "def": "Temporarily disabling or ignoring maskable interrupts by clearing the Interrupt Enable flip-flop or setting bits in an Interrupt Mask Register (verified in DSSSB TGT CS 1 Aug 2021 Shift 1 Q53)."}, {"term": "Non-Maskable Interrupt (NMI)", "def": "A highest-priority hardware interrupt that CANNOT be disabled by software instructions (e.g., power failure, catastrophic memory parity error, Intel 8085 TRAP)."}, {"term": "Vectored Interrupt", "def": "An interrupt where the interrupting device itself supplies the branch address (or vector number into the Interrupt Vector Table) of its Interrupt Service Routine (ISR)."}, {"term": "Daisy Chaining Priority", "def": "A serial hardware priority scheme where the Interrupt Acknowledge (`INTA`) signal propagates sequentially from the highest-priority device (closest to CPU) to the lowest-priority device."}], "explanation": "\n<h4>1. Classification of Interrupts & Exceptions</h4>\n<ul>\n  <li><strong>External (Hardware) vs. Internal (Exceptions / Traps):</strong>\n    <ul>\n      <li><strong>External Interrupts:</strong> Asynchronous events triggered by peripheral signals on CPU pins (e.g., I/O completion, timer tick). Not tied to a specific instruction.</li>\n      <li><strong>Internal Exceptions (Synchronous):</strong> Triggered directly by the execution of the current instruction:\n        <ul>\n          <li><strong>Fault:</strong> Recoverable exception; once the OS fixes the condition (e.g., <strong>Page Fault</strong>), the CPU re-executes the <em>exact same faulting instruction</em>!</li>\n          <li><strong>Trap:</strong> Intentional software exception or condition (e.g., <code>INT 0x80</code> / <code>SYSCALL</code> system call, debugger breakpoint); resumes at the <em>next instruction</em> after the trap.</li>\n          <li><strong>Abort:</strong> Unrecoverable fatal hardware error (e.g., double fault, machine check); terminates the process.</li>\n        </ul>\n      </li>\n    </ul>\n  </li>\n  <li><strong>Maskable vs. Non-Maskable:</strong> Maskable interrupts (`INTR`) are ignored when `IEN = 0` (`CLI` / `IOF`); Non-Maskable Interrupts (`NMI`, 8085 `TRAP`) are always serviced.</li>\n  <li><strong>Vectored vs. Non-Vectored:</strong> Vectored devices send a vector ID over the data bus during `INTA` to index the <strong>Interrupt Vector Table (IVT)</strong>; Non-Vectored interrupts jump to a single fixed address where software must poll devices to find the source.</li>\n</ul>\n\n<h4>2. Exact Interrupt Handling Sequence (At the End of Instruction Execute Phase)</h4>\n<ol>\n  <li>CPU finishes executing the current instruction and checks if <code>Interrupt_Pending \u2227 IEN == 1</code>.</li>\n  <li>CPU disables further interrupts (<code>IEN \u2190 0</code>) and sends <strong>Interrupt Acknowledge (<code>INTA</code>)</strong>.</li>\n  <li>CPU saves the <strong>Program Counter (<code>PC</code>)</strong> (address of next instruction) and <strong>Processor Status Word (<code>PSW / Flags</code>)</strong> onto the system stack.</li>\n  <li>CPU loads <code>PC</code> with the starting address of the <strong>Interrupt Service Routine (ISR)</strong> from the Interrupt Vector Table (IVT).</li>\n  <li>ISR saves general-purpose registers, services the device, restores registers, and executes <strong>Return from Interrupt (<code>IRET / RTI</code>)</strong>, which pops <code>PSW</code> and <code>PC</code> from the stack!</li>\n</ol>\n", "classifications": ["Interrupt Priority Resolution Schemes: (1) Software Polling (slowest, zero extra hardware; checks devices in priority order), (2) Daisy-Chain Hardware Priority (serial `PI \u2192 PO` chain; fast), (3) Parallel Priority Interrupt Controller (fastest; uses Priority Encoder + Mask Register, e.g., Intel 8259A PIC)."], "diagramSvg": "<svg viewBox=\"0 0 760 185\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Hardware Daisy-Chaining Interrupt Priority (Closest to CPU = Highest Priority)</text>\n  <rect x=\"20\" y=\"60\" width=\"110\" height=\"75\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"75\" y=\"92\" fill=\"#f8fafc\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">CPU</text>\n  <text x=\"75\" y=\"112\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">INTR &amp; INTA</text>\n\n  <line x1=\"130\" y1=\"80\" x2=\"195\" y2=\"80\" stroke=\"#34d399\" stroke-width=\"3\"/>\n  <text x=\"162\" y=\"72\" fill=\"#34d399\" font-size=\"10\" text-anchor=\"middle\">INTA \u25ba</text>\n\n  <rect x=\"195\" y=\"55\" width=\"155\" height=\"70\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"272\" y=\"80\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Device 1 (Highest)</text>\n  <text x=\"272\" y=\"100\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">PI=1 \u2192 Blocks PO if req</text>\n\n  <line x1=\"350\" y1=\"80\" x2=\"405\" y2=\"80\" stroke=\"#fde047\" stroke-width=\"2\"/>\n  <text x=\"377\" y=\"72\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">PO\u2192PI</text>\n\n  <rect x=\"405\" y=\"55\" width=\"155\" height=\"70\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"482\" y=\"80\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Device 2 (Medium)</text>\n  <text x=\"482\" y=\"100\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">Places Vector on Bus</text>\n\n  <line x1=\"560\" y1=\"80\" x2=\"605\" y2=\"80\" stroke=\"#fde047\" stroke-width=\"2\"/>\n  <text x=\"582\" y=\"72\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">PO\u2192PI</text>\n\n  <rect x=\"605\" y=\"55\" width=\"135\" height=\"70\" rx=\"6\" fill=\"#334155\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n  <text x=\"672\" y=\"80\" fill=\"#fff\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Device 3 (Lowest)</text>\n  <text x=\"672\" y=\"100\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Starvation risk!</text>\n\n  <line x1=\"130\" y1=\"150\" x2=\"672\" y2=\"150\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <line x1=\"272\" y1=\"125\" x2=\"272\" y2=\"150\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <line x1=\"482\" y1=\"125\" x2=\"482\" y2=\"150\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <line x1=\"672\" y1=\"125\" x2=\"672\" y2=\"150\" stroke=\"#f43f5e\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"168\" fill=\"#fda4af\" font-size=\"11\" text-anchor=\"middle\">\u25c4 Wired-OR Common Interrupt Request Line (INTR)</text>\n</svg>", "workedExamples": [{"title": "Interrupt Vector Table (IVT) Address Calculation", "problem": "In an x86-style processor, the Interrupt Vector Table (IVT) starts at physical memory address 0x00000 and each interrupt vector entry is 4 bytes (2 bytes IP offset + 2 bytes CS segment). At what hexadecimal memory address is the vector for Interrupt Type 21H (33 decimal) stored?", "steps": ["Step 1: Convert interrupt type 21H to decimal: 2 \u00d7 16 + 1 = 33 (or multiply directly in hex by 4).", "Step 2: Multiply by 4 bytes per entry: 33 \u00d7 4 = 132 bytes in decimal.", "Step 3: Convert 132 to hexadecimal: 132 = 8 \u00d7 16 + 4 = 0x00084 (covers bytes 0x00084 to 0x00087)."], "answer": "0x00084 (to 0x00087)."}], "realWorld": "In Intel 8085 (an 8-bit microprocessor tested in DSSSB TGT CS 13 Sep 2025 Shift 3 Q76), the 5 hardware interrupts in priority order are: `TRAP` (Pin 6, Non-Maskable, Vectored to `0024H`), `RST 7.5` (`003CH`), `RST 6.5` (`0034H`), `RST 5.5` (`002CH`), and `INTR` (Maskable, Non-Vectored).", "differences": "Subroutine Call (CALL) vs. Hardware Interrupt: A Subroutine Call is synchronous (triggered by the programmer at a known point in code, saves only PC), whereas a Hardware Interrupt is asynchronous (triggered by an external device at any instruction boundary, must save both PC and Status Flags/PSW via `IRET`).", "formulas": ["IVT Entry Address = IVT_Base_Address + (Vector_Number \u00d7 Bytes_Per_Entry)", "8085 RST n Vector Address (in Hex) = Hex(n \u00d7 8) (e.g., RST 7.5 \u2192 7.5 \u00d7 8 = 60\u2081\u2080 = 003CH)"], "examTraps": ["TRAP 1: Thinking the CPU checks for hardware interrupts in the middle of a micro-operation. The CPU checks the `INTR` line ONLY at the **end of the instruction Execute cycle** (so instructions appear atomic)!", "TRAP 2: Forgetting that `IRET` restores BOTH the Program Counter (`PC`) and the Status/Flag Register (`PSW`), whereas a normal subroutine `RET` pops ONLY `PC`."], "factsToMemorize": ["Disabling an interrupt is called **Masking** (verified DSSSB TGT CS 1 Aug 2021 Shift 1 Q53).", "In Intel 8085, `TRAP` is both level- and edge-triggered, non-maskable, and has the highest priority (`0024H`).", "Daisy Chaining priority is determined by physical proximity to the CPU on the `INTA` grant line."], "pyqInsights": "DSSSB TGT CS 1 Aug 2021 Shift 1 Q53 tested Interrupt Masking, and 13 Sep 2025 Shift 3 Q76 tested the 8-bit 8085 microprocessor.", "quickRevision": "Masking = disabling interrupts. NMI = cannot be masked (power fail, parity error, 8085 TRAP). Vectored = device supplies ISR vector; Non-vectored = fixed jump + software polling. Interrupt saves BOTH PC & PSW (Flags) at end of Execute cycle. Daisy Chain priority = closest to CPU wins."}, {"id": "MOD-P", "code": "P", "title": "Module P: Bus Structure and Communication", "shortTitle": "P. Bus Structure", "navGroup": "mod-io-org", "targetQuestions": 15, "subtopics": ["Computer bus fundamentals: Data bus, Address bus, Control bus, System bus", "Bus arbitration: Centralized (Daisy chain, Polling/Rotating priority, Independent request) vs Distributed", "Synchronous vs Asynchronous bus", "Bus bandwidth, Bus width, Bus cycle", "Multiplexed bus (Time-division multiplexing AD0\u2013AD7)", "PCI, PCI Express (PCIe), USB, SATA, Peripheral interconnect fundamentals", "Memory bus & I/O bus"], "intro": "A System Bus is a shared collection of signal lines that connects the CPU, Main Memory, and I/O controllers. Module P covers Address/Data/Control bus properties, Bus Arbitration methods (Daisy Chain, Polling, Independent Request), Synchronous vs. Asynchronous bus timing, and Bus Bandwidth numerical problems.", "definitions": [{"term": "Address Bus (Unidirectional)", "def": "Unidirectional lines driven by the current Bus Master (CPU or DMA controller) to specify the memory or I/O port address. `k` address lines address `2^k` locations."}, {"term": "Data Bus (Bidirectional)", "def": "Bidirectional lines that carry instructions and data between CPU, Memory, and I/O. Width (`n` bits) determines how many bits are transferred in parallel per bus cycle."}, {"term": "Control Bus", "def": "Carries command, timing, and status signals (`MemR`, `MemW`, `IOR`, `IOW`, `INTR`, `INTA`, `BR`, `BG`, `CLK`, `RESET`). Individual lines are unidirectional, while the bus as a whole transfers signals in both directions."}, {"term": "Bus Arbitration", "def": "The mechanism by which the next Bus Master is selected when multiple devices (CPU, DMA controllers, bus-mastering I/O cards) request control of the shared system bus simultaneously."}], "explanation": "\n<h4>1. Centralized Bus Arbitration Methods (Hardware Comparison)</h4>\n<ul>\n  <li><strong>1. Daisy Chaining (Serial Priority):</strong> Uses <strong>3 control lines</strong> total (`Bus Request`, `Bus Busy`, and a serial `Bus Grant` line passed from device to device). Simplest wiring, fixed priority (closest to arbiter wins), suffers from starvation of far devices and single-point failure if a device breaks the chain.</li>\n  <li><strong>2. Polling / Rotating Priority Counter:</strong> Uses `1 Bus Request` + `1 Bus Busy` + <strong>`\u2308log\u2082(N)\u2309` Poll Count lines</strong> for `N` devices. Arbiter cycles through device IDs on the poll lines; changing the starting count gives fair rotating priority!</li>\n  <li><strong>3. Independent Request (Parallel Arbitration):</strong> Each of the `N` devices has its own dedicated `Bus Request_i` and `Bus Grant_i` pair (`2N` lines + `1 Bus Busy`). Fastest arbitration (1 cycle via priority encoder), flexible programmable priority, but requires the most control lines (`2N + 1`).</li>\n</ul>\n\n<h4>2. Bus Bandwidth Calculation & Interconnect Standards</h4>\n<ul>\n  <li><strong>Synchronous Bus Bandwidth:</strong><br/>\n    <code>Bandwidth (Bytes/sec) = (Bus Width in Bits / 8) \u00d7 (Bus Frequency in Hz / Cycles per Transfer)</code>.</li>\n  <li><strong>Multiplexed Bus:</strong> Shares physical pins between Address and Data using Time-Division Multiplexing (e.g., Intel 8085 uses `AD0\u2013AD7` for the lower 8 address bits during `T1` when `ALE = 1`, and for the 8-bit data bus during `T2, T3`). Reduces chip pin count at the cost of a slightly longer bus cycle.</li>\n  <li><strong>Modern Interconnects:</strong> <strong>PCI</strong> is a parallel shared bus (32/64-bit); <strong>PCI Express (PCIe)</strong> is a high-speed <strong>serial point-to-point full-duplex lane</strong> interconnect; <strong>SATA</strong> is serial storage interconnect; <strong>USB</strong> is a serial tiered-star host-polled peripheral bus.</li>\n</ul>\n", "classifications": ["Bus Timing: Synchronous Bus (all devices locked to a common clock; fast, suitable for same-speed components, limited length due to clock skew) vs. Asynchronous Bus (no common clock, uses full handshaking; accommodates mixed-speed devices).", "Bus Arbitration: Centralized (Single hardware Bus Arbiter) vs. Distributed (Self-selection on open-collector arbitration lines, e.g., SCSI, NuBus, CAN bus)."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">System Bus Architecture (Address, Data, and Control Buses)</text>\n  <rect x=\"60\" y=\"42\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/><text x=\"140\" y=\"72\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">CPU</text>\n  <rect x=\"300\" y=\"42\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#34d399\" stroke-width=\"2\"/><text x=\"380\" y=\"72\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">Main Memory</text>\n  <rect x=\"540\" y=\"42\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fb923c\" stroke-width=\"2\"/><text x=\"620\" y=\"72\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">I/O Modules</text>\n\n  <line x1=\"40\" y1=\"118\" x2=\"720\" y2=\"118\" stroke=\"#60a5fa\" stroke-width=\"4\"/>\n  <text x=\"380\" y=\"112\" fill=\"#93c5fd\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Address Bus (Unidirectional from Master \u2192 2^k Memory/IO Locations)</text>\n\n  <line x1=\"40\" y1=\"145\" x2=\"720\" y2=\"145\" stroke=\"#34d399\" stroke-width=\"4\"/>\n  <text x=\"380\" y=\"139\" fill=\"#6ee7b7\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Data Bus (Bidirectional \u2194 Transfers n-bit Words in Parallel)</text>\n\n  <line x1=\"40\" y1=\"172\" x2=\"720\" y2=\"172\" stroke=\"#fde047\" stroke-width=\"4\"/>\n  <text x=\"380\" y=\"166\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">Control Bus (Command &amp; Timing Signals: MemR, MemW, IOR, IOW, INTR, BR, BG)</text>\n</svg>", "workedExamples": [{"title": "Synchronous Bus Bandwidth Calculation", "problem": "A 64-bit synchronous system bus operates at a clock frequency of 400 MHz. If each read/write bus transfer requires 2 clock cycles, what is the maximum data transfer rate (bandwidth) of the bus in MB/s (where 1 MB = 10^6 bytes)?", "steps": ["Step 1: Bytes per transfer = 64 bits / 8 = 8 bytes.", "Step 2: Number of transfers per second = 400 MHz / 2 cycles = 200 \u00d7 10^6 transfers/s.", "Step 3: Bandwidth = 8 bytes \u00d7 200 \u00d7 10^6 transfers/s = 1,600 \u00d7 10^6 bytes/s = 1,600 MB/s (1.6 GB/s)."], "answer": "1,600 MB/s (1.6 GB/s)."}], "realWorld": "Modern PCIe 4.0/5.0 replaced wide parallel buses (PCI) with high-speed differential serial lanes because parallel buses above a few hundred MHz suffer from severe wire-to-wire **clock skew**!", "differences": "Synchronous vs. Asynchronous Bus: Synchronous bus uses a shared clock signal with fixed-duration cycles (fast, susceptible to clock skew over long lines), while Asynchronous bus uses unclocked handshaking signals (flexible for varied device speeds).", "formulas": ["Bus Bandwidth = (Bus Width in Bytes) \u00d7 (Clock Rate / Cycles per Transfer)", "Arbitration Control Lines for N Devices: Daisy Chain = 3; Polling = 2 + \u2308log\u2082(N)\u2309; Independent Request = 2N + 1"], "examTraps": ["TRAP 1: Saying the Address Bus is bidirectional.With respect to the CPU (or current bus master), the **Address Bus is strictly UNIDIRECTIONAL**, while the **Data Bus is BIDIRECTIONAL**!", "TRAP 2: Confusing the number of control lines in Daisy Chain (3 lines regardless of N) vs. Independent Request (`2N + 1` lines)."], "factsToMemorize": ["Independent Request arbitration provides the fastest bus grant response time.", "Intel 8085 uses `ALE` (Address Latch Enable) to demultiplex the lower 8 address/data lines (`AD0\u2013AD7`)."], "pyqInsights": "Address bus unidirectionality, bus bandwidth calculations, and Daisy Chain vs Independent Request arbitration are standard questions across DSSSB and KVS.", "quickRevision": "Address Bus = Unidirectional (2^k locations). Data Bus = Bidirectional (n-bit word width). Control Bus = Command/Timing. Arbitration lines for N devices: Daisy Chain (3), Polling (2 + log2(N)), Independent Request (2N + 1, fastest). Bandwidth = Bytes_per_transfer * Transfers_per_sec."}, {"id": "MOD-Q", "code": "Q", "title": "Module Q: Parallel Processing and Multiprocessors", "shortTitle": "Q. Parallel Processing", "navGroup": "mod-parallel", "targetQuestions": 20, "subtopics": ["Parallel processing & Flynn's taxonomy: SISD, SIMD, MISD, MIMD", "Multiprocessor systems: Tightly coupled (Shared memory) vs Loosely coupled (Distributed memory)", "Symmetric Multiprocessing (SMP) vs Asymmetric Multiprocessing (AMP)", "Vector processing, Array processors, GPU architecture fundamentals", "Thread-Level (TLP), Instruction-Level (ILP), and Data-Level Parallelism (DLP)", "Amdahl's Law, Speedup, Efficiency, Scalability", "Synchronization & Cache coherence", "Interconnection networks: Crossbar, Multistage (Omega), Hypercube"], "intro": "Module Q covers Flynn's Taxonomy (SISD, SIMD, MISD, MIMD), Tightly vs. Loosely Coupled Multiprocessors (tested directly in DSSSB PGT CS 11 Jul 2021 Q166), Amdahl's Law numerical speedup problems, and Multiprocessor Interconnection Networks (Crossbar, Omega, Hypercube).", "definitions": [{"term": "Flynn's Taxonomy (1966)", "def": "Classifies computer architectures by the multiplicity of Instruction Streams (IS) and Data Streams (DS): SISD, SIMD, MISD, and MIMD."}, {"term": "Tightly Coupled (Shared Memory) vs Loosely Coupled (Distributed)", "def": "Distributed/multicomputer systems are loosely coupled (private memory, message passing), whereas shared-memory multiprocessors are tightly coupled (verified in DSSSB PGT CS 11 Jul 2021 Q166)."}, {"term": "Amdahl's Law", "def": "Formulated by Gene Amdahl (1967): If a fraction P of a program can be parallelized across N processors and (1 \u2212 P) is strictly serial, overall speedup is S(N) = 1 / [(1 \u2212 P) + (P / N)]."}], "explanation": "\n<h4>1. Flynn's Taxonomy (4 Architectural Classes)</h4>\n<ul>\n  <li><strong>SISD (Single Instruction, Single Data):</strong> Conventional uniprocessor executing one instruction stream on one data stream.</li>\n  <li><strong>SIMD (Single Instruction, Multiple Data):</strong> A single control unit broadcasts one instruction simultaneously to many Processing Elements (PEs), each operating on its own data element. Examples: <strong>Array Processors (ILLIAC IV), Vector Processors (Cray-1), SIMD extensions (SSE/AVX/NEON), and GPU warps</strong>.</li>\n  <li><strong>MISD (Multiple Instruction, Single Data):</strong> Multiple processors apply different instruction streams to the exact same data stream (theoretical / specialized fault-tolerant systolic arrays or Space Shuttle triple-modular flight control).</li>\n  <li><strong>MIMD (Multiple Instruction, Multiple Data):</strong> Multiple autonomous processors simultaneously execute different instructions on different data. Subdivided into <strong>Shared-Memory Multiprocessors (Tightly Coupled \u2014 SMP/UMA &amp; NUMA)</strong> and <strong>Distributed-Memory Multicomputers (Loosely Coupled \u2014 Clusters/MPPs)</strong> (verified in <a href=\"https://www.utpaper.in/question/is-loosely-coupled-system-and-is-tightly-coupled-system-4116\" target=\"_blank\" rel=\"noopener\">DSSSB PGT CS 11 Jul 2021 Q166</a>).</li>\n</ul>\n\n<h4>2. Multiprocessor Interconnection Networks (Formulas for N Processors / Nodes)</h4>\n<ul>\n  <li><strong>Crossbar Switch (`N \u00d7 N`):</strong> Non-blocking network using <strong><code>N\u00b2</code> crosspoint switches</strong>. Fastest, zero contention for distinct memory modules, but hardware cost scales quadratically `O(N\u00b2)`.</li>\n  <li><strong>Multistage Interconnection Network (Omega Network):</strong> Connects `N` inputs to `N` outputs using **`log\u2082(N)` stages**, with **`N / 2` switches of size `2 \u00d7 2` per stage** \u2192 Total `2 \u00d7 2` switches = **`(N / 2) log\u2082(N)`**.</li>\n  <li><strong>n-Dimensional Hypercube (Binary n-Cube):</strong> Has **`N = 2^n` nodes**. Each node has **degree `n = log\u2082(N)`**, the **network diameter (maximum hops) is `n = log\u2082(N)`**, and the **total number of bidirectional links is `n \u00d7 2^(n \u2212 1) = (N / 2) log\u2082(N)`**.</li>\n</ul>\n", "classifications": ["Shared-Memory Multiprocessors: Symmetric Multiprocessing (SMP \u2014 all CPUs are peers running one shared OS instance) vs. Asymmetric Multiprocessing (AMP \u2014 one Master CPU runs the OS and schedules Slave CPUs).", "Parallelism Granularity: Instruction-Level Parallelism (ILP \u2014 pipelining, superscalar), Data-Level Parallelism (DLP \u2014 SIMD, vector, GPU), Thread/Task-Level Parallelism (TLP \u2014 multicore, MIMD)."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">Flynn's Taxonomy &amp; Amdahl's Law Speedup Ceiling</text>\n  <rect x=\"25\" y=\"42\" width=\"165\" height=\"62\" rx=\"6\" fill=\"#1e293b\" stroke=\"#60a5fa\"/><text x=\"107\" y=\"65\" fill=\"#93c5fd\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">SISD</text><text x=\"107\" y=\"84\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Uniprocessor CPU</text>\n  <rect x=\"205\" y=\"42\" width=\"165\" height=\"62\" rx=\"6\" fill=\"#1e293b\" stroke=\"#34d399\"/><text x=\"287\" y=\"65\" fill=\"#6ee7b7\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">SIMD</text><text x=\"287\" y=\"84\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Vector / Array / GPU</text>\n  <rect x=\"385\" y=\"42\" width=\"165\" height=\"62\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fde047\"/><text x=\"467\" y=\"65\" fill=\"#fef08a\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">MISD</text><text x=\"467\" y=\"84\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Systolic / Fault-Tolerant</text>\n  <rect x=\"565\" y=\"42\" width=\"170\" height=\"62\" rx=\"6\" fill=\"#1e293b\" stroke=\"#f472b6\"/><text x=\"650\" y=\"65\" fill=\"#fbcfe8\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">MIMD</text><text x=\"650\" y=\"84\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Multicore SMP / Clusters</text>\n\n  <rect x=\"25\" y=\"120\" width=\"710\" height=\"55\" rx=\"6\" fill=\"#0f172a\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"143\" fill=\"#fde047\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">Amdahl's Law: Speedup S(N) = 1 / [ (1 \u2212 P) + (P / N) ]   |   Max Speedup (N \u2192 \u221e) = 1 / (1 \u2212 P)</text>\n  <text x=\"380\" y=\"163\" fill=\"#cbd5e1\" font-size=\"11\" text-anchor=\"middle\">Example: If 20% of code is serial (1\u2212P = 0.20, P = 0.80), even with \u221e processors, Max Speedup = 1 / 0.20 = 5.0\u00d7</text>\n</svg>", "workedExamples": [{"title": "Amdahl's Law Speedup Calculation", "problem": "A program is 80% parallelizable (P = 0.80) and 20% strictly serial. Calculate (a) the speedup on an 8-core processor and (b) the maximum theoretical speedup with an infinite number of cores.", "steps": ["Step 1: Given P = 0.80, Serial fraction (1 \u2212 P) = 0.20, N = 8.", "Step 2: (a) S(8) = 1 / [(1 \u2212 0.80) + (0.80 / 8)] = 1 / [0.20 + 0.10] = 1 / 0.30 = 3.33\u00d7.", "Step 3: (b) As N \u2192 \u221e, P / N \u2192 0, so S_max = 1 / (1 \u2212 P) = 1 / 0.20 = 5.0\u00d7."], "answer": "(a) Speedup on 8 cores = 3.33\u00d7; (b) Max theoretical speedup = 5.0\u00d7."}, {"title": "Hypercube & Omega Network Hardware Counts", "problem": "A multiprocessor system has N = 64 nodes. Calculate (a) node degree, diameter, and total bidirectional links in a 6-Cube Hypercube, and (b) number of 2\u00d72 switches in a 64\u00d764 Omega network.", "steps": ["Step 1: Since N = 64 = 2^6, dimension n = log_2(64) = 6.", "Step 2: (a) Hypercube node degree = n = 6; Diameter = n = 6 hops; Total links = n \u00d7 2^(n\u22121) = 6 \u00d7 32 = 192 links.", "Step 3: (b) Omega network stages = log_2(64) = 6; switches per stage = N/2 = 32 -> Total 2\u00d72 switches = 32 \u00d7 6 = 192 switches."], "answer": "(a) Degree = 6, Diameter = 6, Links = 192; (b) 192 switches of size 2\u00d72."}], "realWorld": "NVIDIA GPUs execute thousands of threads using SIMT (Single Instruction, Multiple Threads\u2014an evolution of SIMD) grouped into 32-thread warps, while server clusters use MIMD message-passing (MPI) across nodes and SMP shared memory within each multicore node.", "differences": "Tightly Coupled vs. Loosely Coupled Multiprocessors: Tightly coupled systems share a common global main memory (communicate via shared variables, require cache coherence), whereas Loosely coupled systems (multicomputers/clusters) give each node its own private local memory (communicate via message passing).", "formulas": ["Amdahl's Law: S(N) = 1 / [(1 \u2212 P) + (P / N)] ; Parallel Efficiency E(N) = S(N) / N", "n-Cube Hypercube (N = 2^n): Degree = n, Diameter = n, Links = n \u00b7 2^(n\u22121)", "N \u00d7 N Crossbar Switches = N\u00b2 ; N \u00d7 N Omega Network (2\u00d72 switches) = (N / 2) log\u2082(N)"], "examTraps": ["TRAP 1: Mixing up Tightly Coupled and Loosely Coupled in fill-in-the-blank questions! In DSSSB PGT CS 11 Jul 2021 Q166, the exact question was: '______ is loosely coupled system and ______ is tightly coupled system' (Ans: Distributed / Multicomputer is loosely coupled; Shared-memory Multiprocessor is tightly coupled)."], "factsToMemorize": ["Hardware atomic instructions used for multiprocessor lock synchronization: `Test-and-Set (TSL)`, `Compare-and-Swap (CAS)`, and `Load-Linked / Store-Conditional (LL/SC)`.", "Vector processors use long vector registers (e.g., 64 elements) and pipelined functional units; **Vector Chaining** is the vector equivalent of operand forwarding!"], "pyqInsights": "DSSSB PGT CS 11 Jul 2021 Q166 & Q161 tested loosely vs tightly coupled systems and distributed computing; UTpaper Q4154 options tested SIMD and MIMD alongside RISC/CISC.", "quickRevision": "Flynn: SISD (1P), SIMD (Vector/Array/GPU), MISD (Systolic), MIMD (Multicore/Cluster). Tightly coupled = Shared Memory; Loosely coupled = Distributed Memory. Amdahl: S = 1 / ((1-P) + P/N). Hypercube (2^n nodes): degree=n, diameter=n, links=n*2^(n-1). Omega switches = (N/2)log2(N)."}, {"id": "MOD-R", "code": "R", "title": "Module R: RISC and CISC Architecture", "shortTitle": "R. RISC & CISC", "navGroup": "mod-cpu-org", "targetQuestions": 15, "subtopics": ["RISC and CISC fundamentals & characteristics", "Instruction complexity & Instruction length (Fixed vs Variable)", "Addressing modes, Register organization (Overlapping Register Windows), Pipelining", "Load-Store architecture & Memory access", "Compiler role", "RISC vs CISC comparison", "ARM & x86 architecture fundamentals"], "intro": "Reduced Instruction Set Computer (RISC) vs. Complex Instruction Set Computer (CISC) is one of the most frequently tested architectural comparisons in DSSSB TGT Computer Science (tested in DSSSB TGT CS 7 Feb 2024 Shift 2 Q125 and UTpaper Q4154).", "definitions": [{"term": "RISC (Reduced Instruction Set Computer)", "def": "Architecture that keeps only a small set of simple, fixed-length instructions executing in a single clock cycle via hardwired control and a Load-Store register model (verified in DSSSB TGT CS 7 Feb 2024 Shift 2 Q125 & UTpaper Q4154)."}, {"term": "CISC (Complex Instruction Set Computer)", "def": "Architecture featuring a large set of complex, variable-length instructions capable of multi-step operations and direct memory-to-memory/register-memory arithmetic, typically using microprogrammed control."}, {"term": "Load-Store Architecture", "def": "A hallmark of RISC where ONLY explicit `LOAD` and `STORE` instructions access main memory; all arithmetic and logical instructions operate strictly on CPU registers."}, {"term": "Overlapping Register Windows", "def": "A RISC technique (Berkeley RISC / SPARC) that divides a large physical register file into circular overlapping windows (Global, In, Local, Out registers) to pass procedure parameters without slow stack memory accesses!"}], "explanation": "\n<h4>1. Core Characteristics of RISC (Verified DSSSB TGT CS 7 Feb 2024 Shift 2 Q125)</h4>\n<ul>\n  <li><strong>Fixed-length, easily decoded instruction format</strong> (e.g., all instructions are 32 bits wide with `rs1`, `rs2`, `rd` in fixed bit positions).</li>\n  <li><strong>Single-cycle execution</strong> (`CPI \u2248 1`) enabled by deep, uniform pipelining.</li>\n  <li><strong>Load-Store memory model:</strong> Arithmetic instructions never reference memory directly.</li>\n  <li><strong>Hardwired Control Unit</strong> (fast combinational decoding, no microcode ROM latency).</li>\n  <li><strong>Large number of general-purpose registers</strong> (32 to 128+ registers) and <strong>few, simple addressing modes</strong> (typically 3 to 5).</li>\n  <li><strong>Complexity shifted to the Compiler</strong> (optimizing instruction scheduling, register allocation, and delayed branch slots).</li>\n</ul>\n\n<h4>2. Core Characteristics of CISC</h4>\n<ul>\n  <li><strong>Variable-length instructions</strong> (e.g., 1 to 15 bytes in x86) to minimize code size when RAM was expensive.</li>\n  <li><strong>Multi-cycle execution</strong> (`CPI` varies from 1 to decenas of cycles).</li>\n  <li><strong>Memory operands allowed directly in ALU instructions</strong> (e.g., `ADD [EAX+4*EBX], ECX`).</li>\n  <li><strong>Microprogrammed Control Unit</strong> and <strong>many complex addressing modes</strong> (12 to 24).</li>\n</ul>\n", "classifications": ["RISC Processor Families: ARM, RISC-V, MIPS, SPARC (uses Overlapping Register Windows), IBM PowerPC, DEC Alpha.", "CISC Processor Families: Intel x86 / AMD64, Motorola 68000 (68k), DEC VAX-11, IBM System/360-370."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">RISC vs. CISC Architectural Design Philosophy</text>\n  <rect x=\"25\" y=\"42\" width=\"340\" height=\"132\" rx=\"8\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"195\" y=\"65\" fill=\"#ecfdf5\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">RISC (ARM, RISC-V, MIPS, SPARC)</text>\n  <text x=\"195\" y=\"87\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fixed-length instructions (e.g., 32-bit)</text>\n  <text x=\"195\" y=\"106\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Load/Store only memory access</text>\n  <text x=\"195\" y=\"125\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Hardwired Control Unit, CPI \u2248 1</text>\n  <text x=\"195\" y=\"144\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Many Registers (32+), Few Addressing Modes</text>\n  <text x=\"195\" y=\"163\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">Complexity in Compiler (Software)</text>\n\n  <rect x=\"395\" y=\"42\" width=\"340\" height=\"132\" rx=\"8\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"565\" y=\"65\" fill=\"#eff6ff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">CISC (Intel x86, VAX, Motorola 68k)</text>\n  <text x=\"565\" y=\"87\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">\u2022 Variable-length instructions (1\u201315 bytes)</text>\n  <text x=\"565\" y=\"106\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">\u2022 Direct ALU operations on memory operands</text>\n  <text x=\"565\" y=\"125\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">\u2022 Microprogrammed Control Unit, Multi-cycle</text>\n  <text x=\"565\" y=\"144\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fewer GPRs (8\u201316), Many Addressing Modes</text>\n  <text x=\"565\" y=\"163\" fill=\"#fde047\" font-size=\"10\" text-anchor=\"middle\">Complexity in Microcode (Hardware)</text>\n</svg>", "workedExamples": [{"title": "Overlapping Register Windows Total Physical Registers", "problem": "A RISC processor with overlapping register windows has G = 10 global registers and W = 4 windows. Each window has L = 10 local registers and C = 6 common (in/out overlap) registers shared with adjacent windows. How many total physical registers are in the CPU, and how many registers are visible to a procedure at any one time?", "steps": ["Step 1: Each window contributes (L + C) = 10 + 6 = 16 unique physical registers to the circular ring (since one window's Out registers are the next window's In registers!).", "Step 2: Total Physical Registers = G + W \u00d7 (L + C) = 10 + 4 \u00d7 (10 + 6) = 10 + 64 = 74 physical registers.", "Step 3: Registers visible to any single procedure (Window Size) = G + In + Local + Out = G + L + 2C = 10 + 10 + 2(6) = 32 visible registers."], "answer": "74 total physical registers; 32 visible registers per window."}], "realWorld": "Modern x86 processors (Intel Core, AMD Ryzen) have a CISC instruction set at the programmer/compiler interface for backward compatibility, but internally translate complex x86 instructions into fixed-length RISC-like micro-operations (`\u00b5ops`) executed on a superscalar Load-Store core!", "differences": "RISC vs. CISC Program Size: A compiled RISC binary typically has MORE instructions (larger code size in bytes) than a CISC binary for the same high-level program because a single CISC instruction equals several simple RISC instructions.", "formulas": ["Overlapping Register Windows: Total Physical Registers = G + W \u00d7 (L + C)", "Registers Visible per Procedure Window = G + L + 2C"], "examTraps": ["TRAP 1: Multiplying `2C` by `W` when calculating total physical registers in overlapping register windows! Because the `C` Out-registers of Window `i` ARE the `C` In-registers of Window `i+1`, each window only adds `L + C` unique registers to the ring (`Total = G + W(L + C)`).", "TRAP 2: Thinking RISC has smaller binary program size than CISC. CISC has smaller code size (higher code density); RISC has larger code size because it requires multiple simple instructions (LOAD, ADD, STORE) to do what one CISC instruction does."], "factsToMemorize": ["Characteristic of RISC tested in DSSSB TGT CS 7 Feb 2024 Shift 2 Q125: **Fixed-length, easily decoded instruction format**.", "ARM originally stood for **Acorn RISC Machine** (later Advanced RISC Machines)."], "pyqInsights": "DSSSB TGT CS 7 Feb 2024 Shift 2 Q125 and UTpaper Q4154 directly tested RISC characteristics and definition.", "quickRevision": "RISC = Fixed-length, Load-Store, Hardwired CU, CPI ~ 1, many registers, few addressing modes, larger program size. CISC = Variable-length, memory-to-register ALU ops, Microprogrammed CU, multi-cycle, smaller program size. Register Windows: Total = G + W(L + C); Window Size = G + L + 2C."}, {"id": "MOD-S", "code": "S", "title": "Module S: Performance Evaluation and Computer Benchmarking", "shortTitle": "S. Performance Eval", "navGroup": "mod-performance", "targetQuestions": 20, "subtopics": ["Iron Law of CPU Performance: CPU Time = IC \u00d7 CPI \u00d7 T_clk", "Execution time, Clock cycle time, Clock rate", "Instruction Count (IC), CPI, and Weighted Average CPI", "MIPS (Millions of Instructions Per Second) & MFLOPS / GFLOPS", "Benchmarking & SPEC benchmarks (Geometric Mean)", "Speedup, Throughput, Latency, Response time", "Performance per Watt, Dynamic Power (C \u00b7 V\u00b2 \u00b7 f) & Static Power"], "intro": "Performance Evaluation provides the quantitative framework for comparing computer architectures. Module S covers the Iron Law of Processor Performance (`T_CPU = IC \u00d7 CPI / Clock_Rate`), Weighted Average CPI, MIPS pitfalls, SPEC geometric means, and CMOS Dynamic Power (`P \u221d C \u00b7 V\u00b2 \u00b7 f`).", "definitions": [{"term": "Performance (Perf_X)", "def": "Defined as the reciprocal of Execution Time: `Performance_X = 1 / Execution_Time_X`. Saying 'X is n times faster than Y' means `Execution_Time_Y / Execution_Time_X = n`."}, {"term": "CPI (Cycles Per Instruction)", "def": "The average number of clock cycles required to execute one instruction for a given program: `CPI = Total_Clock_Cycles / Instruction_Count`."}, {"term": "MIPS (Millions of Instructions Per Second)", "def": "Rate of instruction execution: `MIPS = Instruction_Count / (Execution_Time \u00d7 10^6) = Clock_Rate_in_MHz / CPI`."}, {"term": "Dynamic Power Consumption", "def": "Power consumed by CMOS transistor switching: `P_dynamic \u221d C_load \u00d7 V_dd\u00b2 \u00d7 f_clock`."}], "explanation": "\n<h4>1. The Iron Law of Processor Performance</h4>\n<p><strong><code>CPU Execution Time = Instruction Count (IC) \u00d7 Average CPI \u00d7 Clock Cycle Time (T_clk) = (IC \u00d7 CPI) / Clock Rate (f)</code></strong></p>\n<ul>\n  <li><strong>Instruction Count (IC)</strong> is determined by the <strong>Algorithm, Compiler, and ISA</strong>.</li>\n  <li><strong>Average CPI</strong> is determined by the <strong>ISA, Compiler, and Processor Microarchitecture (pipelining, cache miss rate)</strong>:<br/>\n    <strong><code>CPI_avg = \u2211 (f_i \u00d7 CPI_i) = (\u2211 IC_i \u00d7 CPI_i) / IC_total</code></strong>, where <code>f_i</code> is the fraction of instructions of class <code>i</code>.</li>\n  <li><strong>Clock Cycle Time (<code>T_clk</code>)</strong> is determined by the <strong>Processor Microarchitecture and Semiconductor Transistor Technology</strong>.</li>\n</ul>\n\n<h4>2. Why MIPS Can Be Misleading (The Classic MIPS Trap)</h4>\n<p>Comparing two machines with different ISAs (e.g., RISC vs. CISC) using MIPS is invalid because a RISC compiler emits more simple low-CPI instructions (`high IC, low CPI \u2192 high MIPS`), yet the total execution time `IC \u00d7 CPI \u00d7 T_clk` might actually be longer than on a CISC machine executing fewer complex instructions!</p>\n\n<h4>3. CMOS Power Wall & Energy Efficiency</h4>\n<p>Because Dynamic Power scales with the <strong>square of voltage (`V\u00b2`)</strong> and linearly with clock frequency (`f`), lowering supply voltage by 20% (`0.8 V`) and clock rate by 20% (`0.8 f`) reduces dynamic power to `0.8\u00b2 \u00d7 0.8 = 0.512` (nearly a <strong>50% reduction in power</strong>!).</p>\n", "classifications": ["Benchmark Suites: Synthetic Benchmarks (Dhrystone, Whetstone), Kernel Benchmarks (Linpack for TOP500 supercomputer FLOPS), Real-Application Suites (SPEC CPU2017 \u2014 summarized using the Geometric Mean of normalized execution time ratios; TPC for databases)."], "diagramSvg": "<svg viewBox=\"0 0 760 175\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"24\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">The Iron Law of CPU Performance</text>\n  <rect x=\"25\" y=\"45\" width=\"160\" height=\"75\" rx=\"8\" fill=\"#1e293b\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"105\" y=\"75\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\">CPU Time</text>\n  <text x=\"105\" y=\"96\" fill=\"#93c5fd\" font-size=\"11\" text-anchor=\"middle\">(Seconds / Program)</text>\n\n  <text x=\"205\" y=\"88\" fill=\"#fde047\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"middle\">=</text>\n\n  <rect x=\"225\" y=\"45\" width=\"155\" height=\"75\" rx=\"8\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"302\" y=\"72\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Instruction Count</text>\n  <text x=\"302\" y=\"92\" fill=\"#6ee7b7\" font-size=\"10\" text-anchor=\"middle\">(Instructions / Program)</text>\n  <text x=\"302\" y=\"108\" fill=\"#a7f3d0\" font-size=\"9\" text-anchor=\"middle\">Compiler + ISA</text>\n\n  <text x=\"398\" y=\"88\" fill=\"#fde047\" font-size=\"18\" font-weight=\"bold\" text-anchor=\"middle\">\u00d7</text>\n\n  <rect x=\"415\" y=\"45\" width=\"145\" height=\"75\" rx=\"8\" fill=\"#581c87\" stroke=\"#c084fc\" stroke-width=\"2\"/>\n  <text x=\"487\" y=\"72\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Average CPI</text>\n  <text x=\"487\" y=\"92\" fill=\"#e9d5ff\" font-size=\"10\" text-anchor=\"middle\">(Cycles / Instruction)</text>\n  <text x=\"487\" y=\"108\" fill=\"#d8b4fe\" font-size=\"9\" text-anchor=\"middle\">ISA + Microarchitecture</text>\n\n  <text x=\"577\" y=\"88\" fill=\"#fde047\" font-size=\"18\" font-weight=\"bold\" text-anchor=\"middle\">\u00d7</text>\n\n  <rect x=\"595\" y=\"45\" width=\"145\" height=\"75\" rx=\"8\" fill=\"#7c2d12\" stroke=\"#fb923c\" stroke-width=\"2\"/>\n  <text x=\"667\" y=\"72\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">Clock Cycle Time</text>\n  <text x=\"667\" y=\"92\" fill=\"#fdba74\" font-size=\"10\" text-anchor=\"middle\">(Seconds / Cycle = 1/f)</text>\n  <text x=\"667\" y=\"108\" fill=\"#fed7aa\" font-size=\"9\" text-anchor=\"middle\">Org + Circuit Tech</text>\n\n  <text x=\"380\" y=\"152\" fill=\"#fde047\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">MIPS = Clock Rate (MHz) / CPI = Instruction Count / (Execution Time \u00d7 10\u2076)</text>\n</svg>", "workedExamples": [{"title": "Weighted Average CPI, Execution Time, and MIPS", "problem": "A 2 GHz processor executes a program of 10^8 instructions consisting of: 50% ALU instructions (1 cycle), 30% Load/Store instructions (3 cycles), and 20% Branch instructions (2 cycles). Calculate (a) Weighted Average CPI, (b) CPU Execution Time, and (c) MIPS rating.", "steps": ["Step 1: (a) Average CPI = (0.50 \u00d7 1) + (0.30 \u00d7 3) + (0.20 \u00d7 2) = 0.50 + 0.90 + 0.40 = 1.80 cycles/instruction.", "Step 2: (b) Total Clock Cycles = IC \u00d7 CPI = 10^8 \u00d7 1.80 = 1.8 \u00d7 10^8 cycles. At f = 2 GHz = 2 \u00d7 10^9 Hz, Execution Time = (1.8 \u00d7 10^8) / (2 \u00d7 10^9) = 0.09 seconds (90 ms).", "Step 3: (c) MIPS = Clock_Rate_in_MHz / CPI = 2000 MHz / 1.80 = 1111.11 MIPS."], "answer": "(a) CPI = 1.80; (b) T_exec = 0.09 s (90 ms); (c) MIPS = 1111.11."}], "realWorld": "Why did single-core clock speeds plateau around 4\u20135 GHz after 2005, shifting the entire industry to Multicore processors? Because of the **Power Wall**: increasing clock frequency `f` required higher voltage `V`, causing `P_dynamic \u221d C \u00b7 V\u00b2 \u00b7 f` to grow cubically and exceed chip thermal cooling limits!", "differences": "Latency (Response Time) vs. Throughput (Bandwidth): Latency is the total time to complete a single task from start to finish, whereas Throughput is the number of tasks completed per unit time.", "formulas": ["CPU Time = (IC \u00d7 CPI) / Clock_Rate", "CPI_avg = \u2211 (f_i \u00d7 CPI_i)", "MIPS = Clock_Rate (MHz) / CPI = IC / (T_CPU \u00d7 10\u2076)", "Dynamic Power P_dyn = \u00bd \u00b7 C \u00b7 V\u00b2 \u00b7 f \u00b7 \u03b1"], "examTraps": ["TRAP 1: Taking the simple arithmetic average of CPIs `(1 + 3 + 2)/3 = 2.0` instead of the **weighted average** `\u2211(f_i \u00d7 CPI_i)`!", "TRAP 2: Using Arithmetic Mean instead of **Geometric Mean** when aggregating normalized SPEC benchmark ratios!"], "factsToMemorize": ["SPEC (Standard Performance Evaluation Corporation) uses the **Geometric Mean** of execution time ratios because it is independent of which computer is chosen as the reference machine.", "Static power is caused by subthreshold transistor **leakage current** (`P_static = V_dd \u00d7 I_leakage`), even when clocks are gated."], "pyqInsights": "Numerical problems on `CPU Time = IC * CPI / f`, MIPS calculation, and latency vs throughput appear regularly across KVS/NVS PGT and DSSSB TGT exams.", "quickRevision": "CPU Time = IC * CPI * T_clk = (IC * CPI) / f. Weighted CPI = sum(f_i * CPI_i). MIPS = f(MHz) / CPI. SPEC uses Geometric Mean. Dynamic Power P ~ C * V^2 * f."}, {"id": "MOD-T", "code": "T", "title": "Module T: Storage Systems and RAID", "shortTitle": "T. Storage & RAID", "navGroup": "mod-memory-org", "targetQuestions": 15, "subtopics": ["Magnetic disks & Hard disk structure: Platters, Surfaces, Tracks, Sectors, Cylinders", "Disk access time: Seek time, Rotational latency (tested in DSSSB TGT CS 2021), Transfer time", "Disk scheduling fundamentals (FCFS, SSTF, SCAN, C-SCAN, LOOK)", "Solid-State Drives (SSD), Flash storage, Optical storage", "RAID fundamentals: RAID 0, RAID 1, RAID 2, RAID 3, RAID 4, RAID 5, RAID 6, RAID 10", "Redundancy, Striping, Mirroring, Parity, Fault tolerance, Storage performance"], "intro": "Module T covers the physical geometry and timing of Magnetic Hard Disks (Seek Time + Average Rotational Latency + Transfer Time), Solid-State Drives (SSDs), and RAID Levels 0 through 6 and 10 (capacity efficiency, minimum disks required, and fault tolerance).", "definitions": [{"term": "Seek Time (T_seek)", "def": "The mechanical time required to move the disk read/write head actuator radially to the target concentric track."}, {"term": "Rotational Latency (T_rot)", "def": "The time required to wait for the disk platter to rotate until the desired sector comes under the read/write head (verified in DSSSB TGT CS 2021). Average rotational latency = \u00bd \u00d7 Time of 1 full revolution = `30 / RPM` seconds!"}, {"term": "Cylinder", "def": "The set of all tracks having the exact same radius (track number) vertically aligned across all recording surfaces of all platters\u2014accessible without moving the read/write head assembly!"}, {"term": "RAID (Redundant Array of Independent Disks)", "def": "Combines multiple physical disks into a single logical unit to improve I/O throughput (via striping) and/or fault tolerance (via mirroring or parity)."}], "explanation": "\n<h4>1. Magnetic Disk Geometry & Access Time Formulas</h4>\n<ul>\n  <li><strong>Disk Capacity:</strong><br/>\n    <code>Capacity = Number of Platters \u00d7 Surfaces per Platter (usually 2) \u00d7 Tracks per Surface \u00d7 Sectors per Track \u00d7 Bytes per Sector</code>.</li>\n  <li><strong>Total Disk Access Time:</strong><br/>\n    <strong><code>T_access = T_seek + T_rotational_latency + T_transfer + T_controller</code></strong>\n    <ul>\n      <li><strong>Time for 1 Full Rotation:</strong> <code>T_rev = 60 / RPM</code> seconds.</li>\n      <li><strong>Average Rotational Latency:</strong> <strong><code>T_rot_avg = \u00bd \u00d7 (60 / RPM) = 30 / RPM</code> seconds</strong> (half a revolution!).</li>\n      <li><strong>Transfer Time:</strong> <code>T_transfer = Bytes_to_Transfer / Transfer_Rate</code>.</li>\n    </ul>\n  </li>\n</ul>\n\n<h4>2. Complete Guide to RAID Levels (0, 1, 2, 3, 4, 5, 6, 10)</h4>\n<ul>\n  <li><strong>RAID 0 (Block-Level Striping, No Redundancy):</strong> Splits data across `N` disks (`Min Disks = 2`). Usable Capacity = `100% (N)`. Highest read/write speed, **ZERO fault tolerance** (if 1 disk fails, all data is lost!).</li>\n  <li><strong>RAID 1 (Disk Mirroring):</strong> Duplicates every disk (`Min Disks = 2`). Usable Capacity = **`50% (N / 2)`**. Can survive 1 disk failure per mirrored pair; fast reads, 2\u00d7 physical write cost.</li>\n  <li><strong>RAID 2 (Bit-Level Striping + Hamming ECC):</strong> Uses `r` Hamming code disks (`2^r \u2265 m + r + 1`). Obsolete because modern drives have built-in sector ECC.</li>\n  <li><strong>RAID 3 (Byte/Bit-Level Striping + Dedicated Parity Disk):</strong> Synchronized spindles; 1 dedicated parity disk (`Min Disks = 3`, Capacity = `N \u2212 1`). High sequential transfer rate, poor small random I/O.</li>\n  <li><strong>RAID 4 (Block-Level Striping + Dedicated Parity Disk):</strong> Independent block reads, but all writes must update the **single dedicated parity disk**, creating a severe **parity disk write bottleneck** (`Min Disks = 3`, Capacity = `N \u2212 1`).</li>\n  <li><strong>RAID 5 (Block-Level Striping + Distributed Single Parity):</strong> Distributes parity blocks evenly across ALL `N` disks (`Min Disks = 3`, Usable Capacity = **`(N \u2212 1) / N`**), eliminating the RAID 4 bottleneck! Survives **1 disk failure**. Note: Each small random write incurs the **RAID 5 Small-Write Penalty of 4 I/O operations** (Read old data, Read old parity, Write new data, Write new parity).</li>\n  <li><strong>RAID 6 (Block-Level Striping + Distributed Double Parity P+Q):</strong> Uses two independent parity calculations (`Min Disks = 4`, Usable Capacity = **`(N \u2212 2) / N`**). Survives **any 2 simultaneous disk failures**!</li>\n  <li><strong>RAID 10 (RAID 1+0 \u2014 Stripe of Mirrors):</strong> Mirrors pairs first, then stripes across pairs (`Min Disks = 4`, Usable Capacity = **`50% (N / 2)`**). High performance + fault tolerance.</li>\n</ul>\n", "classifications": ["Secondary Storage Media: Magnetic (HDD, Magnetic Tape), Semiconductor Non-Volatile (NAND Flash SSD, NVMe, SD/eMMC \u2014 requires Wear Leveling and Garbage Collection because Flash must erase a block before rewriting a page), Optical (CD-ROM 780nm IR, DVD 650nm Red, Blu-Ray 405nm Blue-Violet laser)."], "diagramSvg": "<svg viewBox=\"0 0 760 190\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">RAID Levels Comparison (Capacity, Min Disks, and Fault Tolerance for N Disks)</text>\n  <rect x=\"20\" y=\"42\" width=\"170\" height=\"132\" rx=\"6\" fill=\"#7f1d1d\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"105\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">RAID 0 (Striping)</text>\n  <text x=\"105\" y=\"88\" fill=\"#fecaca\" font-size=\"11\" text-anchor=\"middle\">\u2022 Min Disks: 2</text>\n  <text x=\"105\" y=\"108\" fill=\"#fecaca\" font-size=\"11\" text-anchor=\"middle\">\u2022 Capacity: N (100%)</text>\n  <text x=\"105\" y=\"128\" fill=\"#fde047\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fault Tol: 0 Disks!</text>\n  <text x=\"105\" y=\"150\" fill=\"#fca5a5\" font-size=\"10\" text-anchor=\"middle\">Pure Speed, Zero Safety</text>\n\n  <rect x=\"205\" y=\"42\" width=\"170\" height=\"132\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"290\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">RAID 1 (Mirroring)</text>\n  <text x=\"290\" y=\"88\" fill=\"#bfdbfe\" font-size=\"11\" text-anchor=\"middle\">\u2022 Min Disks: 2</text>\n  <text x=\"290\" y=\"108\" fill=\"#bfdbfe\" font-size=\"11\" text-anchor=\"middle\">\u2022 Capacity: N/2 (50%)</text>\n  <text x=\"290\" y=\"128\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fault Tol: 1 Disk</text>\n  <text x=\"290\" y=\"150\" fill=\"#93c5fd\" font-size=\"10\" text-anchor=\"middle\">Full Duplication</text>\n\n  <rect x=\"390\" y=\"42\" width=\"170\" height=\"132\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"475\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">RAID 5 (Dist. Parity)</text>\n  <text x=\"475\" y=\"88\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Min Disks: 3</text>\n  <text x=\"475\" y=\"108\" fill=\"#a7f3d0\" font-size=\"11\" text-anchor=\"middle\">\u2022 Capacity: N \u2212 1</text>\n  <text x=\"475\" y=\"128\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fault Tol: 1 Disk</text>\n  <text x=\"475\" y=\"150\" fill=\"#6ee7b7\" font-size=\"10\" text-anchor=\"middle\">4-I/O Small-Write Penalty</text>\n\n  <rect x=\"575\" y=\"42\" width=\"165\" height=\"132\" rx=\"6\" fill=\"#581c87\" stroke=\"#c084fc\" stroke-width=\"2\"/>\n  <text x=\"657\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">RAID 6 (Dual Parity)</text>\n  <text x=\"657\" y=\"88\" fill=\"#e9d5ff\" font-size=\"11\" text-anchor=\"middle\">\u2022 Min Disks: 4</text>\n  <text x=\"657\" y=\"108\" fill=\"#e9d5ff\" font-size=\"11\" text-anchor=\"middle\">\u2022 Capacity: N \u2212 2</text>\n  <text x=\"657\" y=\"128\" fill=\"#86efac\" font-size=\"11\" text-anchor=\"middle\">\u2022 Fault Tol: 2 Disks</text>\n  <text x=\"657\" y=\"150\" fill=\"#d8b4fe\" font-size=\"10\" text-anchor=\"middle\">P + Q Reed-Solomon</text>\n</svg>", "workedExamples": [{"title": "Disk Access Time Numerical Problem", "problem": "A magnetic hard disk rotates at 7,200 RPM, has an average seek time of 6 ms, and has 500 sectors per track with 512 bytes per sector. How long does it take on average to read a single 512-byte sector?", "steps": ["Step 1: Time for 1 full revolution = 60 / 7200 s = (1 / 120) s = 8.333 ms.", "Step 2: Average Rotational Latency = \u00bd \u00d7 8.333 ms = 4.167 ms (or 30,000 / 7200 ms = 4.167 ms).", "Step 3: Transfer Time for 1 sector (1/500 of a track) = (1 / 500) \u00d7 8.333 ms = 0.0167 ms.", "Step 4: Total Average Access Time = T_seek + T_rot + T_transfer = 6 + 4.167 + 0.0167 = 10.183 ms."], "answer": "10.183 ms (Seek: 6 ms + Avg Rotational Latency: 4.167 ms + Transfer: 0.0167 ms)."}, {"title": "RAID Capacity Comparison Across 6 Disks", "problem": "An array consists of 6 disks, each of 2 TB capacity (12 TB raw). Find the usable storage capacity in RAID 0, RAID 1, RAID 5, RAID 6, and RAID 10.", "steps": ["Step 1: Raw capacity = 6 \u00d7 2 TB = 12 TB.", "Step 2: RAID 0 = N \u00d7 2 TB = 12 TB (100%).", "Step 3: RAID 1 / RAID 10 = (N / 2) \u00d7 2 TB = 3 \u00d7 2 TB = 6 TB (50%).", "Step 4: RAID 5 = (N \u2212 1) \u00d7 2 TB = 5 \u00d7 2 TB = 10 TB (83.33%).", "Step 5: RAID 6 = (N \u2212 2) \u00d7 2 TB = 4 \u00d7 2 TB = 8 TB (66.67%)."], "answer": "RAID 0 = 12 TB; RAID 1/10 = 6 TB; RAID 5 = 10 TB; RAID 6 = 8 TB."}], "realWorld": "Enterprise NAS/SAN arrays favour RAID 6 or RAID 10 over RAID 5 for large multi-terabyte drives because if a second disk encounters an unrecoverable read error while rebuilding a failed RAID 5 array, the entire array is lost.", "differences": "RAID 4 vs. RAID 5: Both use block-level striping and require N\u22121 data capacity (1 parity disk equivalent), but RAID 4 puts all parity on a single dedicated disk (creating a write bottleneck), whereas RAID 5 distributes parity blocks across all N disks.", "formulas": ["Average Rotational Latency (ms) = (0.5 \u00d7 60 \u00d7 1000) / RPM = 30,000 / RPM", "Disk Access Time = Seek Time + Avg Rotational Latency + Transfer Time", "RAID Usable Capacity (N disks of size D): RAID 0 = N\u00b7D; RAID 1/10 = (N/2)\u00b7D; RAID 3/4/5 = (N\u22121)\u00b7D; RAID 6 = (N\u22122)\u00b7D"], "examTraps": ["TRAP 1: Forgetting the **\u00bd factor** when computing Average Rotational Latency! A full revolution takes `60 / RPM` seconds, so the *average* rotational wait is HALF a revolution (`30 / RPM` seconds).", "TRAP 2: Thinking RAID 0 provides redundancy because 'R' in RAID stands for Redundant. **RAID 0 has ZERO redundancy and ZERO fault tolerance!**"], "factsToMemorize": ["The time required to wait until the read/write head comes under the desired sector is **Rotational Latency** (verified DSSSB TGT CS 2021 PYQ).", "SSDs have **zero mechanical seek time and zero rotational latency** (`~0.02\u20130.1 ms` uniform random access time)."], "pyqInsights": "DSSSB TGT CS 2021 directly tested the definition of Rotational Latency, and RAID level fault tolerance / usable capacity are staple KVS/NVS/DSSSB questions.", "quickRevision": "Disk Access = Seek (track) + Rotational Latency (30,000/RPM ms) + Transfer. Cylinder = same-radius tracks across platters. RAID 0 = Striping only (0 fault tol, 100% cap). RAID 1 = Mirroring (50% cap). RAID 4 = Dedicated block parity. RAID 5 = Distributed parity (N-1 cap, min 3 disks). RAID 6 = Dual distributed parity (N-2 cap, min 4 disks)."}, {"id": "MOD-U", "code": "U", "title": "Module U: Advanced and Modern Computer Architecture", "shortTitle": "U. Modern Arch", "navGroup": "mod-parallel", "targetQuestions": 10, "subtopics": ["Multicore processor architecture & Many-core systems", "GPU architecture & Heterogeneous computing (CPU + GPU + NPU)", "Cache coherence protocols & MESI protocol (Modified, Exclusive, Shared, Invalid)", "UMA (Uniform Memory Access) vs NUMA (Non-Uniform Memory Access)", "System-on-Chip (SoC) & Embedded processor architecture", "ARM processor fundamentals & 64-bit architecture", "Hardware virtualization support (Intel VT-x / AMD-V)", "AI accelerators (TPU / NPU) & Quantum computing fundamentals (Qubits, Superposition, Entanglement)"], "intro": "Module U introduces modern processor concepts tested at a conceptual level in TGT/PGT Computer Science exams: the MESI Cache Coherence Protocol, UMA vs. NUMA shared memory architectures, Multicore vs. Many-core GPUs, System-on-Chip (SoC), Hardware Virtualization extensions, AI Tensor Accelerators, and Quantum Computing fundamentals.", "definitions": [{"term": "Cache Coherence Problem", "def": "In a multiprocessor with private per-core caches (L1/L2), if two cores cache the same memory block and one core modifies its copy, the other core's copy becomes stale/inconsistent."}, {"term": "MESI Protocol", "def": "A 4-state write-invalidate snoopy cache coherence protocol where every cache line is marked as **M**odified (dirty, only in this cache), **E**xclusive (clean, only in this cache), **S**hared (clean, may be in other caches), or **I**nvalid."}, {"term": "UMA vs. NUMA", "def": "In UMA (Uniform Memory Access), all processors access all main memory locations with identical latency over a shared bus/switch. In NUMA (Non-Uniform Memory Access), each processor socket has its own fast Local RAM, while accessing another socket's Remote RAM over an interconnect takes longer."}, {"term": "System-on-Chip (SoC)", "def": "Integrates CPU cores, GPU, NPU, memory controllers, I/O interfaces, andDSP/modems onto a single silicon die (e.g., Apple M-series, Snapdragon, Raspberry Pi Broadcom SoC)."}], "explanation": "\n<h4>1. Cache Coherence & The MESI Protocol</h4>\n<p>Two main hardware enforcement approaches keep multiprocessor caches coherent:</p>\n<ul>\n  <li><strong>1. Snoopy Bus Protocols:</strong> Used in bus-based SMP systems; every cache controller 'snoops' (monitors) the shared memory bus for read/write broadcasts and either <strong>Write-Invalidates</strong> or <strong>Write-Updates</strong> matching cache lines.</li>\n  <li><strong>2. Directory-Based Protocols:</strong> Used in large-scale NUMA systems with point-to-point interconnects (no shared broadcast bus); a centralized/distributed Directory tracks which nodes share each memory block.</li>\n  <li><strong>The 4 States of the Illinois MESI Protocol (2 state bits per cache line):</strong>\n    <ul>\n      <li><strong>Modified (M):</strong> Line is present ONLY in the current cache, and is <strong>dirty</strong> (modified relative to main memory).</li>\n      <li><strong>Exclusive (E):</strong> Line is present ONLY in the current cache, and is <strong>clean</strong> (matches main memory). Can transition to <code>M</code> on a write without any bus transaction!</li>\n      <li><strong>Shared (S):</strong> Line is <strong>clean</strong> and may be replicated in one or more other caches.</li>\n      <li><strong>Invalid (I):</strong> Line does not contain valid data (invalidated by another core's write!).</li>\n    </ul>\n  </li>\n</ul>\n\n<h4>2. Modern Computing Frontiers: Virtualization, AI Accelerators & Quantum</h4>\n<ul>\n  <li><strong>Hardware-Assisted Virtualization (Intel VT-x / AMD-V):</strong> Adds a privileged hypervisor root mode (`VMX Root` vs `VMX Non-Root`) and **Extended/Nested Page Tables (EPT / RVI)** so Guest OS virtual addresses translate to Host Physical Addresses in hardware without slow software binary translation traps.</li>\n  <li><strong>AI Accelerators (TPU / NPU / Tensor Cores):</strong> Use **Systolic Arrays** for high-throughput low-precision (`FP16`, `BF16`, `INT8`) matrix-multiply-accumulate (`GEMM`) operations critical to Deep Learning and Transformers.</li>\n  <li><strong>Quantum Computing Fundamentals:</strong> Uses **Qubits** that can exist in a linear **Superposition** of `|0\u27e9` and `|1\u27e9` (`\u03b1|0\u27e9 + \u03b2|1\u27e9` where `|\u03b1|\u00b2 + |\u03b2|\u00b2 = 1`) and exhibit **Entanglement** and **Quantum Interference**, enabling `n` entangled qubits to represent `2^n` basis states simultaneously.</li>\n</ul>\n", "classifications": ["Shared-Memory Architectures: UMA (Symmetric access time to centralized RAM) vs. NUMA (Fast local socket RAM + slower remote socket RAM) vs. COMA (Cache-Only Memory Architecture).", "Cache Coherence Policies: Write-Invalidate (MESI, MSI, MOESI, MESIF) vs. Write-Update (Broadcasts new data to all sharing caches)."], "diagramSvg": "<svg viewBox=\"0 0 760 185\" class=\"w-full h-auto bg-slate-900 rounded-lg p-3 border border-slate-700\">\n  <text x=\"380\" y=\"22\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">MESI Cache Coherence Protocol States &amp; UMA vs. NUMA</text>\n  <rect x=\"20\" y=\"42\" width=\"165\" height=\"65\" rx=\"6\" fill=\"#7f1d1d\" stroke=\"#f87171\"/><text x=\"102\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">M \u2014 Modified</text><text x=\"102\" y=\"84\" fill=\"#fecaca\" font-size=\"10\" text-anchor=\"middle\">Only copy, Dirty (\u2260 RAM)</text>\n  <rect x=\"200\" y=\"42\" width=\"165\" height=\"65\" rx=\"6\" fill=\"#064e3b\" stroke=\"#34d399\"/><text x=\"282\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">E \u2014 Exclusive</text><text x=\"282\" y=\"84\" fill=\"#a7f3d0\" font-size=\"10\" text-anchor=\"middle\">Only copy, Clean (= RAM)</text>\n  <rect x=\"380\" y=\"42\" width=\"165\" height=\"65\" rx=\"6\" fill=\"#1e3a8a\" stroke=\"#60a5fa\"/><text x=\"462\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">S \u2014 Shared</text><text x=\"462\" y=\"84\" fill=\"#bfdbfe\" font-size=\"10\" text-anchor=\"middle\">Multiple copies, Clean</text>\n  <rect x=\"560\" y=\"42\" width=\"175\" height=\"65\" rx=\"6\" fill=\"#334155\" stroke=\"#94a3b8\"/><text x=\"647\" y=\"65\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\">I \u2014 Invalid</text><text x=\"647\" y=\"84\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Unusable / Stale (Miss)</text>\n\n  <rect x=\"20\" y=\"120\" width=\"350\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#38bdf8\"/><text x=\"195\" y=\"142\" fill=\"#93c5fd\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">UMA (Uniform Memory Access)</text><text x=\"195\" y=\"159\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Equal access latency from any CPU to any RAM address</text>\n  <rect x=\"390\" y=\"120\" width=\"345\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fde047\"/><text x=\"562\" y=\"142\" fill=\"#fef08a\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\">NUMA (Non-Uniform Memory Access)</text><text x=\"562\" y=\"159\" fill=\"#cbd5e1\" font-size=\"10\" text-anchor=\"middle\">Local node RAM is faster than Remote node RAM</text>\n</svg>", "workedExamples": [{"title": "MESI State Transition Trace", "problem": "Core 0 reads memory block X (not present in any cache). Next, Core 1 reads the same memory block X. Finally, Core 0 writes a new value to block X. Trace the MESI state of block X in (Core 0, Core 1) after each of the three steps.", "steps": ["Step 1: Core 0 reads X (no other cache holds X) -> Core 0 loads X in Exclusive (E) state: (E, I).", "Step 2: Core 1 reads X (snooped by Core 0) -> Both cores hold clean shared copies in Shared (S) state: (S, S).", "Step 3: Core 0 writes to X -> Core 0 broadcasts a Write-Invalidate signal; Core 1's copy becomes Invalid (I) and Core 0's copy becomes Modified (M): (M, I)."], "answer": "Step 1: (E, I) \u2192 Step 2: (S, S) \u2192 Step 3: (M, I)."}], "realWorld": "ARM big.LITTLE and Intel Hybrid (Performance P-cores + Efficiency E-cores) are Heterogeneous Multicore architectures that schedule heavy threads on wide out-of-order P-cores and background threads on power-efficient E-cores.", "differences": "CPU vs. GPU Architecture: CPUs are latency-oriented (few complex cores, huge caches, sophisticated branch predictors for serial threads), whereas GPUs are throughput-oriented (thousands of simple SIMD/SIMT ALUs optimized for massive data-parallel workloads).", "formulas": ["MESI State Encoding: 4 states require log\u2082(4) = 2 status bits per cache line", "Quantum Superposition State Space for n Qubits = 2^n complex amplitudes"], "examTraps": ["TRAP 1: Thinking the 'E' in MESI stands for Error or Empty. **MESI = Modified, Exclusive, Shared, Invalid!**", "TRAP 2: Confusing 64-bit architecture general-purpose register width (64 bits) with virtual address implementation width (current x86-64/ARM64 CPUs implement 48-bit or 57-bit canonical virtual addresses, though registers are full 64 bits)."], "factsToMemorize": ["In a 64-bit processor, general-purpose registers and native pointers are 64 bits (8 bytes) wide, supporting a theoretical address space of `2^64` bytes (16 Exabytes).", "Google's TPU (Tensor Processing Unit) uses a hardware **Systolic Array** for matrix multiplication."], "pyqInsights": "DSSSB TGT CS 13 Sep 2025 Shift 3 Q19 tested consistency across distributed nodes, and modern exams increasingly include conceptual questions on MESI states, UMA vs NUMA, and 64-bit vs 8-bit microprocessors.", "quickRevision": "MESI = Modified (dirty, unique), Exclusive (clean, unique), Shared (clean, shared), Invalid. UMA = equal RAM latency; NUMA = fast local RAM, slower remote RAM. GPU = throughput/SIMD; CPU = latency/branching. SoC = CPU+GPU+NPU+Memory+I/O on 1 chip."}], "comparisons": [{"id": "CMP-01", "title": "1. Computer Architecture vs. Computer Organization", "module": "Module A", "headers": ["Feature / Aspect", "Computer Architecture", "Computer Organization"], "rows": [["Core Meaning", "Attributes visible to the assembly/machine programmer ('WHAT' the computer does).", "Hardware units and operational interconnections that realize the architecture ('HOW' it is built)."], ["Abstraction Level", "ISA interface between software and hardware.", "Physical microarchitecture and digital logic implementation."], ["Typical Examples", "Instruction set, data bit-widths, addressing modes, register count.", "Control signals, pipeline stages, cache mapping, hardware multiplier vs adder loop, SRAM/DRAM technology."], ["Change Across Family", "Remains identical across a processor family (e.g., IBM System/360 or x86-64) for binary compatibility.", "Changes across generations/models to improve speed, cost, or power consumption."]]}, {"id": "CMP-02", "title": "2. Von Neumann Architecture vs. Harvard Architecture", "module": "Module A", "headers": ["Feature", "Von Neumann Architecture", "Harvard Architecture"], "rows": [["Memory Structure", "Single unified main memory stores both instructions and data.", "Physically separate memories for instructions and data."], ["Bus Pathways", "Single shared Address and Data bus between CPU and memory.", "Two independent sets of Address and Data buses (Instruction Bus & Data Bus)."], ["Concurrent Access", "Cannot fetch an instruction and read/write data simultaneously (Von Neumann Bottleneck).", "Fetches next instruction and accesses data operand in the same clock cycle."], ["Word Width", "Instructions and data share the same memory word width.", "Instruction word width and data word width can differ (e.g., 14-bit instructions, 8-bit data in PIC)."], ["Typical Use", "General-purpose desktop/server main memory (with Modified Harvard L1 cache).", "DSPs, microcontrollers (AVR, PIC, 8051), and internal L1 I-Cache / D-Cache."]]}, {"id": "CMP-03", "title": "3. Fixed-Length vs. Variable-Length Instructions", "module": "Module F", "headers": ["Feature", "Fixed-Length Instructions", "Variable-Length Instructions"], "rows": [["Instruction Size", "Every instruction has the exact same bit width (e.g., 32 bits in ARM/MIPS/RISC-V).", "Instructions vary in length (e.g., 1 to 15 bytes in Intel x86)."], ["Fetch & Decode", "Fetched in 1 word; opcode and register fields are in fixed bit positions (fast parallel decode).", "May span multiple memory words/cache lines; sequential byte-by-byte decoding required."], ["Pipelining", "Highly streamlined for deep instruction pipelining.", "Complicates instruction fetch/decode pipeline stages."], ["Code Density", "Lower code density (larger binary program size).", "Higher code density (compact binary programs)."]]}, {"id": "CMP-04", "title": "4. Zero-, One-, Two-, and Three-Address Instructions", "module": "Module F", "headers": ["Instruction Type", "Syntax & RTL", "CPU Organization", "Key Trade-Off"], "rows": [["Three-Address", "ADD R1, R2, R3 (R1 \u2190 R2 + R3)", "RISC GPR (Load-Store)", "Fewest instructions per expression; longest instruction word (3 address fields)."], ["Two-Address", "ADD R1, R2 (R1 \u2190 R1 + R2)", "CISC GPR / Register-Memory", "Moderate instruction length; overwrites one source operand (needs extra MOVs)."], ["One-Address", "ADD X (AC \u2190 AC + M[X])", "Single Accumulator (AC)", "Short instruction; high memory traffic to save/reload intermediate AC values."], ["Zero-Address", "ADD (TOS \u2190 TOS + SOS)", "Stack-Organized CPU", "Shortest opcode-only arithmetic instructions (uses Postfix/RPN); high instruction count."]]}, {"id": "CMP-05", "title": "5. Immediate vs. Direct Addressing Mode", "module": "Module G", "headers": ["Feature", "Immediate Addressing", "Direct (Absolute) Addressing"], "rows": [["Address Field Content", "Contains the actual constant operand value itself.", "Contains the effective memory address of the operand (EA = A)."], ["Memory Accesses (Execute)", "0 memory accesses (fastest for constants).", "1 memory access to read M[A]."], ["Operand Flexibility", "Constant is fixed at compile/assembly time; range limited by field width.", "Value in M[A] can change dynamically at runtime; address space limited by field width."]]}, {"id": "CMP-06", "title": "6. Direct vs. Indirect Addressing Mode", "module": "Module G", "headers": ["Feature", "Direct Addressing", "Memory Indirect Addressing"], "rows": [["Effective Address (EA)", "EA = A (Address field of instruction).", "EA = M[A] (Contents of memory word pointed to by A)."], ["Operand Expression", "Operand = M[A].", "Operand = M[M[A]]."], ["Memory Accesses (Execute)", "1 memory reference.", "2 sequential memory references (slower)."], ["Addressable Range", "Limited to 2^k words (where k = address field bits).", "Full 2^n word-width address space (supports pointers/indirection)."]]}, {"id": "CMP-07", "title": "7. Register vs. Register Indirect Addressing Mode", "module": "Module G", "headers": ["Feature", "Register Addressing", "Register Indirect Addressing"], "rows": [["Location of Operand", "Operand is inside the specified CPU register R.", "Operand is in Main Memory at the address held inside CPU register R (EA = R)."], ["Memory Accesses (Execute)", "0 memory references.", "1 memory reference (one fewer than Memory Indirect!)."], ["Assembly Syntax", "MOV R1, R2 (R1 \u2190 R2)", "MOV R1, [R2] or (R2) (R1 \u2190 M[R2])"]]}, {"id": "CMP-08", "title": "8. RISC vs. CISC Architecture", "module": "Module R", "headers": ["Characteristic", "RISC (Reduced Instruction Set)", "CISC (Complex Instruction Set)"], "rows": [["Instruction Format", "Fixed-length, simple decoding (verified DSSSB TGT CS 2024).", "Variable-length, complex decoding."], ["Execution Cycles (CPI)", "Single clock cycle per instruction (CPI \u2248 1).", "Multi-cycle instructions (CPI varies widely)."], ["Memory Access", "Strictly Load-Store (only LOAD/STORE access RAM).", "ALU instructions can directly manipulate memory operands."], ["Control Unit", "Hardwired Control Unit.", "Microprogrammed Control Unit (Control Memory ROM)."], ["Registers & Modes", "Many GPRs (32+); few addressing modes (3\u20135).", "Fewer GPRs (8\u201316); many complex addressing modes (12\u201324)."], ["Examples", "ARM, RISC-V, MIPS, SPARC, PowerPC.", "Intel x86, Motorola 68000, DEC VAX."]]}, {"id": "CMP-09", "title": "9. Hardwired vs. Microprogrammed Control Unit", "module": "Module I", "headers": ["Feature", "Hardwired Control Unit", "Microprogrammed Control Unit"], "rows": [["Implementation", "Combinational logic gates, flip-flops, decoders, state counters.", "Control Memory (ROM) storing microinstructions + CAR/\u00b5PC sequencer."], ["Speed", "Very fast (gate delay only; ideal for 1-cycle RISC).", "Slower (limited by Control ROM read access time)."], ["Flexibility & Modification", "Difficult to modify (requires hardware redesign/rewiring).", "Easy to modify or patch by updating microcode in Control Memory."], ["Instruction Complexity", "Best suited for simple, regular RISC instruction sets.", "Best suited for complex CISC instruction sets."]]}, {"id": "CMP-10", "title": "10. SRAM (Static RAM) vs. DRAM (Dynamic RAM)", "module": "Module K", "headers": ["Feature", "SRAM (Static RAM)", "DRAM (Dynamic RAM)"], "rows": [["Storage Cell", "6-Transistor (6T) bistable flip-flop latch.",
