ycle time of `\u03c4 = 2 ns` and experiences an average of `0.25` stall cycles per instruction due to hazards. What is the instruction throughput in MIPS?", "options": {"A": "500 MIPS", "B": "400 MIPS", "C": "250 MIPS", "D": "100 MIPS"}, "correctAnswer": "B", "explanation": "Clock rate `f = 1 / 2 ns = 500 MHz`. Effective `CPI = 1 + 0.25 = 1.25`. Instruction Throughput = `f (MHz) / CPI = 500 / 1.25 = 400 MIPS`.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Performance", "subtopic": "Throughput Calculation in MIPS", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Pipelining"}, {"id": "COA-J-029", "question": "What is 'Loop Unrolling' performed by an optimizing compiler for a pipelined or superscalar CPU?", "options": {"A": "Replicating the loop body multiple times (e.g., 4\u00d7) and adjusting the loop stride, which reduces branch overhead instructions and exposes more independent instructions to schedule into stall slots", "B": "Converting all loops into infinite loops", "C": "Replacing registers with disk files", "D": "Slowing down the CPU clock"}, "correctAnswer": "A", "explanation": "Loop unrolling reduces the fraction of branch/counter instructions and creates a larger basic block of independent instructions (using distinct registers) to eliminate pipeline stalls.", "moduleCode": "J", "module": "Pipelining", "topic": "Instruction-Level Parallelism", "subtopic": "Loop Unrolling", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-J-030", "question": "Consider the sequence of three instructions:\n`I1: ADD R1, R1, R2`\n`I2: ADD R1, R1, R3`\n`I3: ADD R1, R1, R4`\nWhen `I3` is in the `EX` stage, BOTH `I1` (in `WB`) and `I2` (in `MEM`) are writing to `R1`. Which value of `R1` must the Forwarding Unit route to `I3`?", "options": {"A": "The MOST RECENT value of `R1` produced by `I2` from the `EX/MEM` pipeline register (EX hazard takes priority over MEM hazard!)", "B": "The older value of `R1` from `I1` in `MEM/WB`", "C": "The sum of both values", "D": "Neither; `I3` must read from main memory"}, "correctAnswer": "A", "explanation": "Because `I2` is program-order newer than `I1` and overwrites `R1`, `I3` must receive the most recent value of `R1` from the `EX/MEM` stage (`I2`), so `EX/MEM` forwarding takes priority over `MEM/WB` forwarding.", "moduleCode": "J", "module": "Pipelining", "topic": "Pipeline Hazards", "subtopic": "Forwarding Priority (EX/MEM vs MEM/WB)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-001", "question": "Select an appropriate ROM type from the options, where data can be erased or destroyed using ultraviolet light:", "options": {"A": "EEPROM", "B": "Flash ROM", "C": "EPROM", "D": "PROM"}, "correctAnswer": "C", "explanation": "EPROM (Erasable Programmable Read-Only Memory) has a transparent quartz window on the package through which ultraviolet (UV) light is shone to erase stored charges.", "moduleCode": "K", "module": "Memory Organization", "topic": "ROM Types", "subtopic": "UV-Erasable ROM (EPROM)", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 1 (9:00 AM)", "sourceReference": "https://www.utpaper.in/question/select-an-appropriate-rom-type-from-the-options-where-data-can-be-erased-or-dest-3148", "numericalCategory": null}, {"id": "COA-K-002", "question": "How many address lines and input-output data lines are needed in a 2K \u00d7 16 memory unit?", "options": {"A": "10 address lines and 8 data lines", "B": "11 address lines and 4 data lines", "C": "12 address lines and 4 data lines", "D": "11 address lines and 16 data lines"}, "correctAnswer": "D", "explanation": "For a memory of size 2^n \u00d7 m: 2K = 2 \u00d7 1024 = 2\u00b9\u00b9 words, requiring n = 11 address lines. Each word has m = 16 bits, requiring 16 input-output data lines.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Capacity & Lines", "subtopic": "2K \u00d7 16 Address and Data Lines", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "7 Aug 2021, Shift 3", "sourceReference": "https://www.utpaper.in/question/how-many-address-lines-and-input-output-data-lines-are-needed-in-2k-16-memory-un-3785", "numericalCategory": null}, {"id": "COA-K-003", "question": "Which of the following address lines are typically used for chip-select decoding when interfacing multiple smaller memory chips into a larger system address space?", "options": {"A": "Higher-order (Most Significant) address lines", "B": "Lower-order (Least Significant) address lines", "C": "Data bus lines", "D": "Interrupt request lines"}, "correctAnswer": "A", "explanation": "When expanding memory address capacity, the lower-order address lines connect directly to the internal word address pins of every chip, while the higher-order (MSB) address lines feed a binary decoder to generate Chip Select (CS) signals.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Decoding", "subtopic": "High-Order Address Lines for Chip Select", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "13 Sep 2025, Shift 3 (5:00 PM)", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-address-lines-are-typically-used-for-decoding-in-a-system-3436", "numericalCategory": null}, {"id": "COA-K-004", "question": "Arrange the following memory capacity units in correct DESCENDING order (largest to smallest):\nGigabyte (GB), Megabyte (MB), Exabyte (EB), Zettabyte (ZB), Petabyte (PB), Terabyte (TB)", "options": {"A": "Zettabyte > Exabyte > Petabyte > Terabyte > Gigabyte > Megabyte", "B": "Exabyte > Zettabyte > Petabyte > Terabyte > Gigabyte > Megabyte", "C": "Zettabyte > Petabyte > Exabyte > Terabyte > Gigabyte > Megabyte", "D": "Petabyte > Exabyte > Zettabyte > Terabyte > Gigabyte > Megabyte"}, "correctAnswer": "A", "explanation": "In powers of 2: Zettabyte (2\u2077\u2070) > Exabyte (2\u2076\u2070) > Petabyte (2\u2075\u2070) > Terabyte (2\u2074\u2070) > Gigabyte (2\u00b3\u2070) > Megabyte (2\u00b2\u2070) > Kilobyte (2\u00b9\u2070).", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Units", "subtopic": "Descending Order of Memory Units", "difficulty": "Easy", "questionType": "Sequence/Order", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/following-memory-units-in-descending-order-gigabyte-megabyte-exabyte-zettabyte-p-3955", "numericalCategory": null}, {"id": "COA-K-005", "question": "Match the memory access method with its corresponding storage hardware example:\n1. Sequential access    P. Cache Tag Memory / TLB\n2. Direct access        Q. Magnetic Tape\n3. Random access        R. Semiconductor RAM / ROM\n4. Associative access   S. Magnetic Hard Disk", "options": {"A": "1-Q, 2-S, 3-R, 4-P", "B": "1-S, 2-Q, 3-R, 4-P", "C": "1-Q, 2-R, 3-S, 4-P", "D": "1-P, 2-S, 3-R, 4-Q"}, "correctAnswer": "A", "explanation": "Sequential access: Magnetic Tape (Q); Direct access: Hard Disk (S); Random access: RAM/ROM (R); Associative (content-addressable) access: Cache Tag / TLB (P).", "moduleCode": "K", "module": "Memory Organization", "topic": "Access Methods", "subtopic": "Sequential, Direct, Random, Associative", "difficulty": "Easy", "questionType": "Match-the-Following", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://www.utpaper.in/question/sequential-direct-random-and-associative-are-access-methods-and-key-characterist-4564", "numericalCategory": null}, {"id": "COA-K-006", "question": "Consider the following statements regarding semiconductor memory:\n(a) Both RAM and ROM are volatile memories.\n(b) ROM is non-volatile while RAM is volatile.\n(c) DRAM and SRAM are identical in cell structure and speed.\n(d) DRAM is a type of RAM that requires periodic refreshing.\nWhich of the above statements are TRUE?", "options": {"A": "(a) and (c)", "B": "(b) and (d)", "C": "(a) and (d)", "D": "(b) and (c)"}, "correctAnswer": "B", "explanation": "RAM is volatile whereas ROM is non-volatile (b is true). DRAM is a capacitor-based type of RAM that requires periodic refresh cycles (d is true).", "moduleCode": "K", "module": "Memory Organization", "topic": "RAM vs ROM & DRAM", "subtopic": "Volatility and DRAM Characteristics", "difficulty": "Easy", "questionType": "Statement-based", "sourceType": "Verified PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/which-of-the-following-isare-wronga-ram-and-r--5f3e9d699edc50260de5cfee", "numericalCategory": null}, {"id": "COA-K-007", "question": "How many `16K \u00d7 4` RAM chips are required to construct a `64K \u00d7 16` main memory system, and what size decoder is needed for bank selection?", "options": {"A": "16 chips; 2 \u00d7 4 decoder", "B": "8 chips; 3 \u00d7 8 decoder", "C": "32 chips; 4 \u00d7 16 decoder", "D": "4 chips; 2 \u00d7 4 decoder"}, "correctAnswer": "A", "explanation": "Total chips = (64K / 16K) \u00d7 (16 / 4) = 4 rows \u00d7 4 chips/row = 16 chips. Since there are 4 rows (banks) of chips, we need log\u2082(4) = 2 high-order address lines driving a 2 \u00d7 4 decoder.", "moduleCode": "K", "module": "Memory Organization", "topic": "Chip Expansion", "subtopic": "Number of RAM Chips Required", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-008", "question": "How many `32K \u00d7 1-bit` DRAM chips are required to provide a memory capacity of `256K Bytes` (`256 KB`)?", "options": {"A": "8 chips", "B": "32 chips", "C": "64 chips", "D": "128 chips"}, "correctAnswer": "C", "explanation": "Watch the units! Target capacity = 256K Bytes = 256K \u00d7 8 bits. Chip size = 32K \u00d7 1 bit. Number of chips = (256K \u00d7 8) / (32K \u00d7 1) = 8 \u00d7 8 = 64 chips!", "moduleCode": "K", "module": "Memory Organization", "topic": "Chip Expansion", "subtopic": "Bytes vs Bits Capacity Trap", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-009", "question": "Why does Dynamic RAM (DRAM) require periodic refresh cycles every few milliseconds whereas Static RAM (SRAM) does not?", "options": {"A": "Because DRAM stores bits as charge on tiny MOS capacitors that leak current over time, whereas SRAM stores bits in cross-coupled 6-transistor bistable flip-flop latches", "B": "Because SRAM is non-volatile", "C": "Because DRAM uses magnetic cores", "D": "Because SRAM operates without power"}, "correctAnswer": "A", "explanation": "DRAM uses a 1-Transistor, 1-Capacitor (1T1C) cell where capacitor charge leaks away in ~64 ms. SRAM uses a 6-Transistor (6T) CMOS latch that holds its state indefinitely while powered.", "moduleCode": "K", "module": "Memory Organization", "topic": "SRAM vs DRAM", "subtopic": "Cell Structure & Refresh", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-010", "question": "Why is the 'Memory Cycle Time' (`t_cycle`) of a DRAM chip strictly longer than its 'Memory Access Time' (`t_access`)?", "options": {"A": "Because reading a DRAM capacitor cell is destructive (discharges the capacitor), so a precharge and rewrite restoration interval (`t_restore`) must complete before the next memory access can begin (`t_cycle = t_access + t_restore`)", "B": "Because DRAM must spin a magnetic platter", "C": "Because `t_access` is measured in hours", "D": "They are always equal in DRAM"}, "correctAnswer": "A", "explanation": "Reading a DRAM cell shares its tiny charge with the bitline (destructive read). The sense amplifier must amplify and write the charge back into the capacitor before the row can be closed for the next cycle.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Timing", "subtopic": "Access Time vs Cycle Time in DRAM", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-011", "question": "In an Associative (Content-Addressable) Memory with `n`-bit Argument Register `A`, `n`-bit Key (Mask) Register `K` (where `K_j = 1` means bit `j` is compared, and `K_j = 0` means bit `j` is masked/ignored), and memory cell `F_(i,j)`, when does bit position `j` of word `i` produce a bit match (`x_j = 1`)?", "options": {"A": "x_j = (A_j \u2299 F_(i,j)) + K_j'   (where \u2299 is XNOR equality)", "B": "x_j = (A_j \u2295 F_(i,j)) \u00b7 K_j", "C": "x_j = A_j \u00b7 F_(i,j) \u00b7 K_j", "D": "x_j = A_j + F_(i,j)"}, "correctAnswer": "A", "explanation": "Bit `j` matches if EITHER the bit is masked (`K_j = 0 \u2192 K_j' = 1`) OR `A_j` equals `F_(i,j)` (`A_j F_(i,j) + A_j' F_(i,j)' = A_j \u2299 F_(i,j)`). Word `i` matches (`M_i = 1`) when `x_1 \u00b7 x_2 \u00b7 ... \u00b7 x_n = 1`!", "moduleCode": "K", "module": "Memory Organization", "topic": "Associative Memory", "subtopic": "CAM Match Logic Equation", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-012", "question": "In a 4-way Low-Order Interleaved Memory (with 4 independent memory banks `B0, B1, B2, B3`), where are consecutive memory word addresses `0, 1, 2, 3, 4, 5` stored, and why does this speed up cache block fills?", "options": {"A": "Word `k` is in Bank `(k mod 4)` (using the 2 LSBs of the address), so 4 consecutive words in a cache block reside in 4 different banks and can be accessed concurrently in a single pipelined burst!", "B": "Words 0..1023 are all in Bank 0", "C": "All words are duplicated in all 4 banks", "D": "Low-order interleaving only works with ROM"}, "correctAnswer": "A", "explanation": "Low-order interleaving uses the `log\u2082(B)` least significant address bits to select the bank (`Addr mod B`), placing consecutive words in distinct banks so a cache line fill overlaps bank cycle times.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Interleaving", "subtopic": "Low-Order vs High-Order Interleaving", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-013", "question": "What is a major advantage of '2.5D (Coincident / Row-Column Decoded)' memory cell array organization over '2D (Linear Decoded)' organization for a large `1M \u00d7 1` RAM chip?", "options": {"A": "A 2D array requires a massive `20 \u00d7 2\u00b2\u2070` (1,048,576-output) decoder, whereas a 2.5D square array splits the 20 address bits into a `10 \u00d7 1024` Row Decoder and a `10 \u00d7 1024` Column MUX (only 2048 decoder outputs total!)", "B": "2.5D requires no address pins", "C": "2D uses capacitors while 2.5D uses magnetic tape", "D": "2.5D cannot store binary zeros"}, "correctAnswer": "A", "explanation": "Splitting a `2^(2k)` cell array into `2^k` rows and `2^k` columns reduces decoder lines from `2^(2k)` down to `2 \u00d7 2^k` (e.g., from 1,048,576 down to 2,048) and allows row/column address pin multiplexing (`RAS` / `CAS`) in DRAM!", "moduleCode": "K", "module": "Memory Organization", "topic": "Internal Chip Organization", "subtopic": "2D vs 2.5D Memory Organization", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-014", "question": "A `16M \u00d7 8` DRAM chip uses square 2.5D internal organization with Row Address Strobe (`RAS`) and Column Address Strobe (`CAS`) time-multiplexing on the same physical address pins. How many external address pins does this DRAM chip require (excluding RAS/CAS/CS)?", "options": {"A": "24 address pins", "B": "12 address pins", "C": "8 address pins", "D": "16 address pins"}, "correctAnswer": "B", "explanation": "16M = 2\u00b2\u2074 words, which normally requires 24 address bits. Because DRAM multiplexes the 12-bit Row Address (latched by `RAS`) and 12-bit Column Address (latched by `CAS`) over the same physical pins, only `24 / 2 = 12` address pins are needed!", "moduleCode": "K", "module": "Memory Organization", "topic": "DRAM Packaging", "subtopic": "RAS and CAS Address Multiplexing", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-015", "question": "What size Read-Only Memory (ROM) is required to implement a combinational circuit that multiplies two 4-bit binary numbers to produce an 8-bit binary product?", "options": {"A": "16 \u00d7 8 ROM", "B": "256 \u00d7 8 ROM", "C": "64 \u00d7 8 ROM", "D": "256 \u00d7 4 ROM"}, "correctAnswer": "B", "explanation": "Two 4-bit inputs form `4 + 4 = 8` address input lines (`2\u2078 = 256` entries), and the product has `4 + 4 = 8` output bits. Thus a `256 \u00d7 8` ROM (2048 bits) is required.", "moduleCode": "K", "module": "Memory Organization", "topic": "ROM Sizing", "subtopic": "Combinational Circuit Realization with ROM", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-016", "question": "A DRAM chip has 8,192 (`2\u00b9\u00b3`) rows that must each be refreshed once every 64 ms. If refreshing a single row takes 50 ns, what percentage of total memory time is spent on refreshing?", "options": {"A": "0.64%", "B": "1.28%", "C": "6.4%", "D": "0.08%"}, "correctAnswer": "A", "explanation": "Total time spent refreshing all 8,192 rows in one 64 ms window = 8,192 \u00d7 50 ns = 409,600 ns = 0.4096 ms. Percentage overhead = (0.4096 ms / 64 ms) \u00d7 100% = 0.64%.", "moduleCode": "K", "module": "Memory Organization", "topic": "DRAM Refresh", "subtopic": "Refresh Overhead Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-017", "question": "What is the key architectural difference between traditional EEPROM and Flash Memory?", "options": {"A": "EEPROM is erased using UV light whereas Flash is erased with X-rays", "B": "EEPROM can erase and rewrite individual bytes electrically, whereas Flash Memory erases electrically in large blocks/sectors (achieving higher density and lower cost)", "C": "Flash memory is volatile whereas EEPROM is non-volatile", "D": "EEPROM cannot be read by a CPU"}, "correctAnswer": "B", "explanation": "EEPROM provides byte-level electrical erasure (slower, larger cell area), whereas Flash Memory erases entire blocks of pages simultaneously (smaller 1-transistor floating-gate/charge-trap cell, ideal for SSDs).", "moduleCode": "K", "module": "Memory Organization", "topic": "ROM Types", "subtopic": "EEPROM vs Flash Memory", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-018", "question": "A microcomputer interfaces a `4K \u00d7 8` RAM chip starting at hexadecimal base address `0x2000`. What is the hexadecimal address of the LAST byte in this `4K \u00d7 8` RAM chip?", "options": {"A": "0x2FFF", "B": "0x3000", "C": "0x2400", "D": "0x27FF"}, "correctAnswer": "A", "explanation": "4K = 4096 = 2\u00b9\u00b2 = `0x1000` bytes. Starting at `0x2000`, the last address is `0x2000 + 0x1000 \u2212 1 = 0x2FFF`.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Address Map", "subtopic": "Hexadecimal Address Range Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-019", "question": "A ROM chip in a microprocessor system occupies the hexadecimal address range `0xC000` to `0xFFFF` inclusive. What is the capacity of this ROM chip in Kilobytes (KB)?", "options": {"A": "8 KB", "B": "16 KB", "C": "32 KB", "D": "64 KB"}, "correctAnswer": "B", "explanation": "Number of addresses = `0xFFFF \u2212 0xC000 + 1 = 0x4000` = `4 \u00d7 16\u00b3 = 4 \u00d7 4096 = 16,384` bytes = `16 KB`.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Address Map", "subtopic": "Reverse Address Range to Capacity", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-020", "question": "Which two dimensions of 'Locality of Reference' justify the design of the entire computer memory hierarchy (Registers \u2192 Cache \u2192 RAM \u2192 Disk)?", "options": {"A": "Temporal Locality (recently accessed items are likely to be accessed again soon, e.g., loops) and Spatial Locality (items near a recently accessed address are likely to be accessed soon, e.g., arrays/sequential instructions)", "B": "Logical Locality and Physical Locality", "C": "Static Locality and Dynamic Locality", "D": "Horizontal Locality and Vertical Locality"}, "correctAnswer": "A", "explanation": "Temporal Locality justifies keeping recently used words in cache/registers; Spatial Locality justifies fetching multi-word Cache Blocks and OS Pages.", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Hierarchy", "subtopic": "Locality of Reference Principles", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-021", "question": "How does DDR (Double Data Rate) Synchronous DRAM achieve twice the data transfer rate of Single Data Rate (SDR) SDRAM at the same I/O bus clock frequency?", "options": {"A": "By transferring data on BOTH the rising (positive) edge and the falling (negative) edge of the clock signal", "B": "By using twice as many address pins", "C": "By eliminating capacitors from DRAM", "D": "By doubling the supply voltage"}, "correctAnswer": "A", "explanation": "DDR transfers two data words per clock cycle by latching data on both the rising and falling edges of the data strobe/clock signal.", "moduleCode": "K", "module": "Memory Organization", "topic": "SDRAM & DDR", "subtopic": "Double Data Rate (DDR) Principle", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-022", "question": "Which type of memory retains system configuration data (such as BIOS/UEFI settings or hardware state) even when the computer's main power is turned off?", "options": {"A": "L1 Cache SRAM", "B": "NVRAM / CMOS memory / Flash ROM", "C": "CPU Accumulator", "D": "Volatile DRAM"}, "correctAnswer": "B", "explanation": "NVRAM (Non-Volatile RAM, implemented via Flash/EEPROM or battery-backed CMOS SRAM) retains its data when the system power is turned off.", "moduleCode": "K", "module": "Memory Organization", "topic": "Non-Volatile RAM", "subtopic": "NVRAM and CMOS Battery-Backed RAM", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://www.scribd.com/document/905733192/DSSSB-TGT-CS", "numericalCategory": null}, {"id": "COA-K-023", "question": "As we move DOWN the memory hierarchy pyramid from CPU Registers \u2192 Cache \u2192 Main Memory \u2192 Secondary Storage, how do (i) Access Time, (ii) Capacity, and (iii) Cost per Bit change?", "options": {"A": "(i) Access Time increases (slower), (ii) Capacity increases, (iii) Cost per Bit decreases", "B": "(i) Access Time decreases, (ii) Capacity decreases, (iii) Cost per Bit increases", "C": "(i) Access Time increases, (ii) Capacity decreases, (iii) Cost per Bit increases", "D": "All three increase together"}, "correctAnswer": "A", "explanation": "Moving down from Registers to Disk: storage gets slower (Access Time increases), much larger (Capacity increases), and much cheaper per bit (Cost/bit decreases).", "moduleCode": "K", "module": "Memory Organization", "topic": "Memory Hierarchy", "subtopic": "Cost, Speed, and Capacity Trade-Off", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-024", "question": "Server-grade ECC DDR4/DDR5 DIMMs add 8 Hamming/Hsiao SECDED (Single-Error Correcting, Double-Error Detecting) parity bits to every 64-bit data word. What is the total bit-width of an ECC memory data bus?", "options": {"A": "64 bits", "B": "68 bits", "C": "72 bits", "D": "80 bits"}, "correctAnswer": "C", "explanation": "64 data bits + 7 Hamming bits (since 2\u2077 = 128 \u2265 64 + 7 + 1) + 1 overall parity bit (for double-error detection) = 64 + 8 = 72 bits!", "moduleCode": "K", "module": "Memory Organization", "topic": "Error-Correcting Memory", "subtopic": "ECC SDRAM (SECDED)", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-K-025", "question": "When a computer is first powered on (Cold Boot), the Program Counter is initialized to a fixed address located in which type of memory containing the Bootstrap Loader (BIOS/UEFI)?", "options": {"A": "Volatile DRAM", "B": "Non-volatile ROM / Flash EEPROM", "C": "Magnetic Tape", "D": "Hard Disk swap partition"}, "correctAnswer": "B", "explanation": "Because volatile RAM contains random garbage on power-up, the reset vector points to non-volatile ROM/Flash where the Bootstrap Loader resides.", "moduleCode": "K", "module": "Memory Organization", "topic": "Bootstrapping", "subtopic": "Bootstrap Loader Storage", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-001", "question": "Which of the following memory types is placed between the CPU and main memory (RAM) to improve the speed of execution of a program?", "options": {"A": "Secondary memory", "B": "Virtual memory", "C": "Auxiliary memory", "D": "Cache memory"}, "correctAnswer": "D", "explanation": "Cache memory is a small, ultra-fast SRAM buffer placed between the CPU and slower DRAM main memory. It holds copies of frequently used instructions and data to reduce average memory access time.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Fundamentals", "subtopic": "Why Cache Improves Execution Speed", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-memory-improves-the-speed-of-execution-of-a-program-4378", "numericalCategory": null}, {"id": "COA-L-002", "question": "Which statement accurately describes the role and characteristics of Cache Memory?", "options": {"A": "It is a large magnetic disk used for archival backups", "B": "It is a small high-speed SRAM memory placed between the CPU and RAM that stores frequently requested data and instructions", "C": "It is slower and cheaper per bit than main memory", "D": "It is accessed only when a page fault occurs"}, "correctAnswer": "B", "explanation": "Cache memory acts as a high-speed SRAM bridge between the CPU and main memory (RAM), holding frequently requested instructions and data to minimize CPU wait states.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Fundamentals", "subtopic": "Cache Bridge Role", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://testbook.com/questions/kvs-pgt-computer-science-questions--694fd1795a493eb8c484f1a5", "numericalCategory": null}, {"id": "COA-L-003", "question": "Which cache mapping technique allows a main memory block to be placed in ANY cache line?", "options": {"A": "Direct mapping", "B": "Fully associative mapping", "C": "Fixed mapping", "D": "Sequential mapping"}, "correctAnswer": "B", "explanation": "In Fully Associative Mapping, any main memory block can occupy any line in the cache. The physical address is split into only `[ Tag | Block Offset ]` (zero Index bits), and all tags are compared in parallel.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Mapping", "subtopic": "Fully Associative Mapping Definition", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-004", "question": "A computer has a cache with a hit time of 4 ns and a hit ratio of 95%. If a cache miss incurs an additional miss penalty of 80 ns to fetch the block from main memory, what is the Average Memory Access Time (AMAT)?", "options": {"A": "8.0 ns", "B": "7.8 ns", "C": "12.0 ns", "D": "4.4 ns"}, "correctAnswer": "A", "explanation": "Using `AMAT = T_hit + (1 \u2212 h) \u00d7 Miss_Penalty`: `AMAT = 4 ns + (1 \u2212 0.95) \u00d7 80 ns = 4 + (0.05 \u00d7 80) = 4 + 4 = 8.0 ns`.", "moduleCode": "L", "module": "Cache Memory", "topic": "AMAT Calculation", "subtopic": "Single-Level Cache AMAT", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-005", "question": "In a system with simultaneous (parallel) cache and main memory lookup initiation, cache access time is 10 ns and main memory access time is 100 ns. If the cache hit ratio is 90%, what is the effective memory access time?", "options": {"A": "19 ns", "B": "20 ns", "C": "11 ns", "D": "90 ns"}, "correctAnswer": "A", "explanation": "For simultaneous access: `AMAT = h \u00d7 T_c + (1 \u2212 h) \u00d7 T_m = (0.90 \u00d7 10 ns) + (0.10 \u00d7 100 ns) = 9 + 10 = 19 ns`. (If hierarchical/sequential where RAM access starts after cache miss detection, it is `10 + 0.10 \u00d7 100 = 20 ns`).", "moduleCode": "L", "module": "Cache Memory", "topic": "AMAT Calculation", "subtopic": "Simultaneous vs Hierarchical Access", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2018", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-006", "question": "A byte-addressable computer has 16 MB (`2\u00b2\u2074` bytes) of main memory and a 64 KB (`2\u00b9\u2076` bytes) Direct-Mapped cache with a block (line) size of 16 bytes (`2\u2074` bytes). How many bits are in the Tag, Line Index, and Byte Offset fields of the 24-bit physical address?", "options": {"A": "Tag: 8 bits, Line Index: 12 bits, Offset: 4 bits", "B": "Tag: 12 bits, Line Index: 8 bits, Offset: 4 bits", "C": "Tag: 10 bits, Line Index: 10 bits, Offset: 4 bits", "D": "Tag: 8 bits, Line Index: 16 bits, Offset: 0 bits"}, "correctAnswer": "A", "explanation": "Address = 24 bits. Offset b = log\u2082(16) = 4 bits. Number of cache lines L = 64 KB / 16 B = 2\u00b9\u2076 / 2\u2074 = 2\u00b9\u00b2 = 4096 lines \u2192 Line Index l = 12 bits. Tag = 24 \u2212 12 \u2212 4 = 8 bits (or log\u2082(2\u00b2\u2074 / 2\u00b9\u2076) = 8 bits).", "moduleCode": "L", "module": "Cache Memory", "topic": "Direct Mapping", "subtopic": "Tag, Index, and Offset Bit Split", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-007", "question": "If the 64 KB cache (block size 16 bytes) in a 16 MB (`2\u00b2\u2074` bytes) main memory system is changed from Direct-Mapped to 4-Way Set-Associative, what are the new Tag, Set Index, and Byte Offset bit widths?", "options": {"A": "Tag: 10 bits, Set Index: 10 bits, Offset: 4 bits", "B": "Tag: 8 bits, Set Index: 12 bits, Offset: 4 bits", "C": "Tag: 6 bits, Set Index: 14 bits, Offset: 4 bits", "D": "Tag: 12 bits, Set Index: 8 bits, Offset: 4 bits"}, "correctAnswer": "A", "explanation": "Total lines L = 2\u00b9\u00b2 = 4096. In 4-way set-associative (`k = 4 = 2\u00b2`), Number of Sets S = 4096 / 4 = 1024 = 2\u00b9\u2070 \u2192 Set Index = 10 bits. Offset = 4 bits. Tag = 24 \u2212 10 \u2212 4 = 10 bits (increased by log\u2082(4) = 2 bits over direct mapping).", "moduleCode": "L", "module": "Cache Memory", "topic": "Set-Associative Mapping", "subtopic": "4-Way Set-Associative Bit Split", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-008", "question": "For the same 16 MB (`2\u00b2\u2074` bytes) main memory and 64 KB cache with 16-byte blocks, if Fully Associative Mapping is used, how many bits are in the Tag, Index, and Offset fields?", "options": {"A": "Tag: 20 bits, Index: 0 bits, Offset: 4 bits", "B": "Tag: 16 bits, Index: 4 bits, Offset: 4 bits", "C": "Tag: 8 bits, Index: 12 bits, Offset: 4 bits", "D": "Tag: 24 bits, Index: 0 bits, Offset: 0 bits"}, "correctAnswer": "A", "explanation": "In Fully Associative mapping, there is NO Index field (Index = 0 bits). Offset = log\u2082(16) = 4 bits, and all remaining bits form the Tag: Tag = 24 \u2212 4 = 20 bits.", "moduleCode": "L", "module": "Cache Memory", "topic": "Fully Associative Mapping", "subtopic": "Address Fields in Fully Associative", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-009", "question": "A direct-mapped cache consists of 128 lines (numbered 0 to 127). To which cache line number will main memory Block 1500 map?", "options": {"A": "Line 92", "B": "Line 100", "C": "Line 28", "D": "Line 64"}, "correctAnswer": "A", "explanation": "In Direct Mapping, `Cache Line = Memory_Block_Number mod Total_Cache_Lines = 1500 mod 128`. Since `11 \u00d7 128 = 1408`, `1500 \u2212 1408 = 92` (Line 92).", "moduleCode": "L", "module": "Cache Memory", "topic": "Direct Mapping", "subtopic": "Block Mapping to Cache Line", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-010", "question": "A cache has 256 total lines organized as an 8-Way Set-Associative cache. To which Set number will main memory Block 999 map?", "options": {"A": "Set 7", "B": "Set 31", "C": "Set 231", "D": "Set 15"}, "correctAnswer": "A", "explanation": "Step 1: Number of Sets `S = Total_Lines / k = 256 / 8 = 32` sets (numbered 0 to 31). Step 2: `Set_Number = Block_Number mod S = 999 mod 32`. Since `31 \u00d7 32 = 992`, `999 \u2212 992 = 7` (Set 7).", "moduleCode": "L", "module": "Cache Memory", "topic": "Set-Associative Mapping", "subtopic": "Block Mapping to Cache Set", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-011", "question": "A 32-bit processor uses a 32 KB, 2-Way Set-Associative Write-Back cache with a 64-byte block size. Each cache line entry in the tag directory includes a Tag field, 1 Valid bit, and 1 Dirty (Modified) bit. What is the total size of the Tag Directory in bits?", "options": {"A": "10,240 bits", "B": "9,216 bits", "C": "8,192 bits", "D": "11,264 bits"}, "correctAnswer": "D", "explanation": "Step 1: Block Offset = log\u2082(64) = 6 bits. Total lines L = 32 KB / 64 B = 2\u00b9\u2075 / 2\u2076 = 2\u2079 = 512 lines. Step 2: Number of Sets S = 512 / 2 = 256 = 2\u2078 \u2192 Set Index = 8 bits. Step 3: Tag = 32 \u2212 8 \u2212 6 = 18 bits. Step 4: Bits per line in directory = 18 (Tag) + 1 (Valid) + 1 (Dirty) = 20 bits... Wait: 512 lines \u00d7 20 bits/line = 10,240 bits! Let's check: if 1 Valid + 1 Dirty + 1 LRU bit = 21 bits, or without LRU: 512 \u00d7 20 = 10,240 bits!", "moduleCode": "L", "module": "Cache Memory", "topic": "Tag Directory Overhead", "subtopic": "Total Tag Storage Bits", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-012", "question": "A Fully Associative cache has 3 blocks (initially empty) and uses the Least Recently Used (LRU) replacement policy. For the block reference sequence `1, 2, 3, 4, 1, 2, 5, 1, 2, 3`, how many Cache Hits occur?", "options": {"A": "2 hits", "B": "3 hits", "C": "4 hits", "D": "5 hits"}, "correctAnswer": "A", "explanation": "Trace in 3 frames: `1`(M: [1]), `2`(M: [1,2]), `3`(M: [1,2,3]), `4`(M, evicts 1: [4,2,3]), `1`(M, evicts 2: [4,1,3]), `2`(M, evicts 3: [4,1,2]), `5`(M, evicts 4: [5,1,2]), `1`(HIT! [5,1,2]), `2`(HIT! [5,1,2]), `3`(M, evicts 5: [3,1,2]). Total Hits = 2 (on the final references to 1 and 2).", "moduleCode": "L", "module": "Cache Memory", "topic": "Replacement Algorithms", "subtopic": "LRU Cache Trace", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-013", "question": "In which cache write policy is a 'Dirty Bit' (Modified status bit) required in each cache line, and why?", "options": {"A": "Write-Through; to count how many times the CPU read the block", "B": "Write-Back (Copy-Back); to record whether the cached block has been modified so it is written back to main memory ONLY if Dirty == 1 upon eviction", "C": "Read-Only Cache; to block writes", "D": "Direct Mapping; to replace the Tag"}, "correctAnswer": "B", "explanation": "In Write-Back cache, writes update only the cache and set `Dirty = 1`. When the block is eventually replaced, it is written back to RAM if and only if `Dirty == 1`.", "moduleCode": "L", "module": "Cache Memory", "topic": "Write Policies", "subtopic": "Write-Through vs Write-Back", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Adapted PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-014", "question": "When a CPU write operation misses in the cache, what is the difference between 'Write-Allocate' (Fetch-on-Write) and 'No-Write-Allocate' (Write-Around)?", "options": {"A": "Write-Allocate loads the missed block from main memory into the cache and then updates it (paired with Write-Back); No-Write-Allocate modifies the word directly in main memory without loading the block into cache (paired with Write-Through)", "B": "Write-Allocate deletes the cache; No-Write-Allocate halts the CPU", "C": "Write-Allocate only works on ROM", "D": "They are identical"}, "correctAnswer": "A", "explanation": "Write-Back caches pair with Write-Allocate (hoping subsequent writes/reads hit the newly fetched block in cache), while Write-Through caches pair with No-Write-Allocate.", "moduleCode": "L", "module": "Cache Memory", "topic": "Write Miss Policies", "subtopic": "Write-Allocate vs No-Write-Allocate", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-015", "question": "In Hill's 3-C model of cache misses, which type of miss occurs in Direct-Mapped and Set-Associative caches when too many active blocks map to the same line/set, and equals ZERO in a Fully Associative cache?", "options": {"A": "Compulsory (Cold-Start) Misses", "B": "Capacity Misses", "C": "Conflict (Collision) Misses", "D": "Coherence Misses"}, "correctAnswer": "C", "explanation": "Conflict (Collision) misses occur because of restricted block placement in Direct or Set-Associative mapping. Fully Associative caches have zero conflict misses.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Miss Taxonomy", "subtopic": "The 3 Cs (Compulsory, Capacity, Conflict)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-016", "question": "A Direct-Mapped cache has 64 lines. A program inside a loop of 100 iterations repeatedly accesses main memory Block 0 followed by Block 64 (`0, 64, 0, 64, ...`). What is the cache Hit Ratio for this loop?", "options": {"A": "100%", "B": "50%", "C": "0% (Every access is a Conflict Miss!)", "D": "99%"}, "correctAnswer": "C", "explanation": "Both `0 mod 64 = 0` and `64 mod 64 = 0` map to Cache Line 0! Thus Block 64 evicts Block 0, and Block 0 immediately evicts Block 64 on every iteration\u2014producing a 0% hit ratio (cache thrashing). A 2-way set-associative cache solves this completely (99% hit ratio)!", "moduleCode": "L", "module": "Cache Memory", "topic": "Direct Mapping Thrashing", "subtopic": "Ping-Pong Conflict Miss Trace", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-017", "question": "For 1,000 memory references, the L1 cache experiences 40 misses, and out of those 40 accesses sent to the L2 cache, the L2 cache experiences 10 misses. What are the L2 'Local Miss Rate' and the L2 'Global Miss Rate'?", "options": {"A": "L2 Local Miss Rate = 25% (10/40); L2 Global Miss Rate = 1% (10/1000)", "B": "L2 Local Miss Rate = 1%; L2 Global Miss Rate = 25%", "C": "L2 Local Miss Rate = 4%; L2 Global Miss Rate = 10%", "D": "Both are 25%"}, "correctAnswer": "A", "explanation": "L2 Local Miss Rate = `L2_Misses / L1_Misses = 10 / 40 = 25%`. L2 Global Miss Rate = `L2_Misses / Total_CPU_References = 10 / 1000 = 1%` (which equals `Miss_Rate_L1 \u00d7 Local_Miss_Rate_L2 = 0.04 \u00d7 0.25 = 0.01`).", "moduleCode": "L", "module": "Cache Memory", "topic": "Multilevel Cache", "subtopic": "Local vs Global Miss Rate", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-018", "question": "In a multilevel cache hierarchy (L1 and L2), what is the difference between a 'Strictly Inclusive' L2 cache and a 'Strictly Exclusive' L2 cache?", "options": {"A": "In Strictly Inclusive, every block in L1 is guaranteed to also be present in L2 (simplifying cache coherence snooping); in Strictly Exclusive (e.g., AMD victim L3/L2), a block resides in EITHER L1 OR L2, never both (maximizing total effective cache capacity)", "B": "Inclusive caches have no Tag bits", "C": "Exclusive caches cannot store instructions", "D": "Inclusive means L1 is larger than L2"}, "correctAnswer": "A", "explanation": "Inclusive caches duplicate L1 contents in L2 so L2 can filter snoopy coherence checks without disturbing L1; Exclusive caches use L2 as a victim cache for blocks evicted from L1.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Inclusion", "subtopic": "Inclusive vs Exclusive Multilevel Cache", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-019", "question": "Why do virtually all modern processors use a 'Split Cache' (separate I-Cache and D-Cache) at Level 1 (L1), but a 'Unified Cache' at Level 2 (L2) and Level 3 (L3)?", "options": {"A": "L1 Split Cache provides dual ports to feed `IF` and `MEM` pipeline stages concurrently without structural hazards, while L2/L3 Unified Cache dynamically balances capacity between instructions and data to achieve a higher hit ratio", "B": "Because L2 cannot store instructions", "C": "Because L1 is made of DRAM", "D": "Because Split Caches have higher capacity misses than L3"}, "correctAnswer": "A", "explanation": "L1 prioritizes bandwidth and zero structural hazards (Split I/D), while L2/L3 prioritize minimizing miss rate via flexible shared capacity (Unified).", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Organization", "subtopic": "Unified vs Split Cache (I-Cache & D-Cache)", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-020", "question": "A 16-bit byte-addressable system has a Direct-Mapped cache with 16 lines and a block size of 8 bytes. For the hexadecimal memory address `0xA5B6` (`1010 0101 1011 0110\u2082`), what are the binary values of the Tag, Line Index, and Byte Offset?", "options": {"A": "Tag = 101001011\u2082 (9 bits), Line = 0110\u2082 (Line 6), Offset = 110\u2082 (Byte 6)", "B": "Tag = 10100101\u2082 (8 bits), Line = 1011\u2082 (Line 11), Offset = 0110\u2082", "C": "Tag = 1010\u2082, Line = 01011011\u2082, Offset = 0110\u2082", "D": "Tag = 101001011011\u2082, Line = 011\u2082, Offset = 0\u2082"}, "correctAnswer": "A", "explanation": "Step 1: Block size = 8 bytes \u2192 Offset = log\u2082(8) = 3 LSBs (`110\u2082` = 6). Step 2: 16 lines \u2192 Line Index = log\u2082(16) = 4 middle bits (`0110\u2082` = Line 6). Step 3: Remaining upper 16 \u2212 4 \u2212 3 = 9 bits form the Tag (`101001011\u2082`).", "moduleCode": "L", "module": "Cache Memory", "topic": "Hex Address Decode", "subtopic": "Decoding Hex Address to Tag, Line, Offset", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-021", "question": "As Cache Block (Line) Size is progressively increased while keeping total Cache Size fixed, how does the Miss Rate behave?", "options": {"A": "Miss rate initially DECREASES due to Spatial Locality, but eventually INCREASES if blocks become so large that too few blocks fit in the cache (causing Conflict/Pollution misses) while also increasing Miss Penalty!", "B": "Miss rate always drops to 0% when block size equals cache size", "C": "Miss rate always increases monotonically", "D": "Block size has no effect on miss rate"}, "correctAnswer": "A", "explanation": "Larger blocks exploit spatial locality (reducing compulsory misses), but in a fixed-size cache, very large blocks drastically reduce the number of cache lines, increasing conflict misses and miss transfer time.", "moduleCode": "L", "module": "Cache Memory", "topic": "Block Size Trade-Off", "subtopic": "Cache Block Size vs Miss Rate (Pollution Point)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-022", "question": "A cache has 1,024 lines and a 16-bit Tag field in direct mapping. How many parallel Tag Comparators are needed if the cache is organized as: (i) Direct-Mapped, (ii) 8-Way Set-Associative, and (iii) Fully Associative?", "options": {"A": "(i) 1 comparator, (ii) 8 comparators, (iii) 1,024 comparators", "B": "(i) 1,024, (ii) 128, (iii) 1", "C": "(i) 16, (ii) 8, (iii) 1,024", "D": "(i) 1, (ii) 128, (iii) 1,024"}, "correctAnswer": "A", "explanation": "Direct mapping checks only 1 line (`1 comparator`); k-Way Set-Associative checks all k lines in the selected set simultaneously (`k = 8 comparators`); Fully Associative checks all L lines in parallel (`1,024 comparators`).", "moduleCode": "L", "module": "Cache Memory", "topic": "AssociativityHardware", "subtopic": "Hardware Comparator Count", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-023", "question": "A processor has a base `CPI_execution = 1.5` (assuming 100% cache hits). Every instruction requires 1 instruction fetch, and 30% of instructions are Data Load/Stores. The I-Cache miss rate is 2%, the D-Cache miss rate is 5%, and the miss penalty to DRAM is 40 clock cycles. What is the effective `CPI` including memory stall cycles?", "options": {"A": "2.90", "B": "2.10", "C": "3.50", "D": "1.85"}, "correctAnswer": "A", "explanation": "Step 1: I-Cache stall cycles/instr = `1.0 \u00d7 0.02 \u00d7 40 = 0.80` cycles. Step 2: D-Cache stall cycles/instr = `0.30 \u00d7 0.05 \u00d7 40 = 0.60` cycles. Step 3: Total `CPI = 1.50 + 0.80 + 0.60 = 2.90`!", "moduleCode": "L", "module": "Cache Memory", "topic": "CPU Time with Cache Stalls", "subtopic": "Memory Stall Cycles Impact on CPI", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-024", "question": "A Write-Back cache has a hit time of 2 ns, a miss rate of 5%, and a main memory block transfer time of 60 ns. If 30% of all evicted blocks are Dirty (requiring an extra 60 ns write-back to RAM before fetching the new block), what is the Average Memory Access Time (AMAT)?", "options": {"A": "5.9 ns", "B": "5.0 ns", "C": "6.8 ns", "D": "3.8 ns"}, "correctAnswer": "A", "explanation": "On a miss (5% of accesses), fetching the new block always takes 60 ns, and 30% of misses also write back the dirty victim block (+0.30 \u00d7 60 = 18 ns). Thus effective Miss Penalty = 60 + 18 = 78 ns. `AMAT = 2 + 0.05 \u00d7 78 = 2 + 3.9 = 5.9 ns`.", "moduleCode": "L", "module": "Cache Memory", "topic": "Write-Back Traffic", "subtopic": "Average Memory Accesses per Reference", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-025", "question": "Why does every cache line in a tag directory include a 1-bit 'Valid Bit' (`V`) initialized to `0` on processor power-up or cache flush?", "options": {"A": "Because on power-up, the SRAM tag and data arrays contain random voltage patterns that could accidentally match a CPU address Tag and return garbage data as a false Cache Hit!", "B": "To indicate whether the number stored is positive or negative", "C": "To select between Read and Write", "D": "To double the cache size"}, "correctAnswer": "A", "explanation": "Without a Valid bit (`V = 1`), random initial bits in the Tag SRAM could match an incoming address tag and cause a false hit on uninitialized garbage data.", "moduleCode": "L", "module": "Cache Memory", "topic": "Valid Bit Role", "subtopic": "Why Valid Bit is Needed at Boot", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-026", "question": "What is a 'Victim Cache' (introduced by Norman Jouppi), and where is it placed?", "options": {"A": "A small (4 to 16-entry) Fully Associative cache placed right behind a Direct-Mapped L1 cache to hold blocks recently evicted due to conflict misses", "B": "A backup hard drive in RAID 1", "C": "A cache that only stores virus signatures", "D": "The page table in virtual memory"}, "correctAnswer": "A", "explanation": "A small fully associative Victim Cache sits between a direct-mapped L1 cache and L2/RAM, catching blocks evicted by conflict misses and swapping them back into L1 on a hit.", "moduleCode": "L", "module": "Cache Memory", "topic": "Victim Cache", "subtopic": "Norman Jouppi's Victim Cache", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-027", "question": "In a `k`-Way Set-Associative cache using true counter-based Least Recently Used (LRU) replacement within each set of `k = 8` lines, how many LRU age counter bits are needed per cache line?", "options": {"A": "3 bits (`log\u2082(8) = 3`)", "B": "8 bits", "C": "1 bit", "D": "64 bits"}, "correctAnswer": "A", "explanation": "To rank `k` lines in a set from most-recently-used (`0`) to least-recently-used (`k \u2212 1`), each line needs `log\u2082(k) = log\u2082(8) = 3` age bits.", "moduleCode": "L", "module": "Cache Memory", "topic": "Replacement Algorithms", "subtopic": "LRU Counter Bits per Line", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-028", "question": "A word-addressable computer has 64K words (`2\u00b9\u2076` words) of main memory and a Direct-Mapped cache of 1K words (`2\u00b9\u2070` words) with a block size of 16 words (`2\u2074` words). What are the sizes of the Tag, Line, and Word Offset fields in the 16-bit word address?", "options": {"A": "Tag: 6 bits, Line: 6 bits, Word Offset: 4 bits", "B": "Tag: 4 bits, Line: 8 bits, Word Offset: 4 bits", "C": "Tag: 6 bits, Line: 10 bits, Word Offset: 0 bits", "D": "Tag: 8 bits, Line: 4 bits, Word Offset: 4 bits"}, "correctAnswer": "A", "explanation": "Block size = 16 words \u2192 Word Offset = log\u2082(16) = 4 bits. Number of lines = 1K words / 16 words = 2\u00b9\u2070 / 2\u2074 = 2\u2076 = 64 lines \u2192 Line Index = 6 bits. Tag = 16 \u2212 6 \u2212 4 = 6 bits.", "moduleCode": "L", "module": "Cache Memory", "topic": "Word-Addressable Cache", "subtopic": "Word Offset vs Byte Offset", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-029", "question": "Why do nearly all modern L1 caches use 'Virtually Indexed, Physically Tagged (VIPT)' addressing?", "options": {"A": "Because the Set Index bits can be extracted immediately from the Page Offset bits (which do not change during TLB translation!), allowing the L1 SRAM set lookup to happen in PARALLEL with the TLB lookup for the Physical Tag!", "B": "Because VIPT does not require a TLB or Page Table", "C": "Because VIPT uses zero Tag bits", "D": "Because Physical addresses have no offset"}, "correctAnswer": "A", "explanation": "When `Set_Index + Block_Offset \u2264 Page_Offset` (e.g., \u2264 12 bits for 4 KB pages), the cache index bits are identical in virtual and physical addresses, so L1 indexing runs concurrently with TLB tag translation!", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Addressing", "subtopic": "VIPT (Virtually Indexed, Physically Tagged)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-030", "question": "Why is a small FIFO 'Write Buffer' (4 to 8 words) essential in a processor with a Write-Through L1 cache?", "options": {"A": "So the CPU can deposit written data into the fast Write Buffer in 1 cycle and continue executing without stalling for the 50\u2013100 ns main memory write to finish!", "B": "To convert Write-Through into Fully Associative mapping", "C": "To store instructions during fetch", "D": "To replace the ALU"}, "correctAnswer": "A", "explanation": "Without a Write Buffer, every single store instruction in a Write-Through cache would stall the CPU pipeline for the full DRAM write cycle time.", "moduleCode": "L", "module": "Cache Memory", "topic": "Write Buffer", "subtopic": "Purpose of Write Buffer in Write-Through Cache", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-031", "question": "When a cache miss fetches a 64-byte block (8 words) over an 8-byte bus, which optimization requests the exact missed word from DRAM FIRST and forwards it to the CPU immediately while the rest of the block fills in the background?", "options": {"A": "Critical Word First and Early Restart", "B": "Delayed Branching", "C": "Daisy Chaining", "D": "Cycle Stealing"}, "correctAnswer": "A", "explanation": "Critical Word First requests the specific missed word from memory first; Early Restart resumes the stalled CPU as soon as that word arrives.", "moduleCode": "L", "module": "Cache Memory", "topic": "Miss Penalty Reduction", "subtopic": "Critical Word First & Early Restart", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-032", "question": "How does the FIFO (First-In, First-Out) cache replacement policy differ from LRU (Least Recently Used)?", "options": {"A": "FIFO evicts the block that was loaded into the cache earliest regardless of how frequently or recently it was accessed, whereas LRU evicts the block that has gone unreferenced for the longest time", "B": "FIFO always has a higher hit ratio than LRU", "C": "LRU ignores cache hits", "D": "FIFO requires future knowledge"}, "correctAnswer": "A", "explanation": "FIFO tracks only initial load order (so a heavily used block loaded early gets evicted), whereas LRU updates recency on every cache hit.", "moduleCode": "L", "module": "Cache Memory", "topic": "Replacement Algorithms", "subtopic": "FIFO vs LRU Comparison", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-033", "question": "A hierarchical cache has an access time of 5 ns, and main memory has an access time (miss penalty) of 100 ns. What minimum Cache Hit Ratio (`h`) is required to achieve an Average Memory Access Time (AMAT) of at most 10 ns?", "options": {"A": "90%", "B": "95%", "C": "98%", "D": "85%"}, "correctAnswer": "B", "explanation": "Using `AMAT = T_c + (1 \u2212 h) \u00d7 T_m`: `10 = 5 + (1 \u2212 h) \u00d7 100` \u2192 `5 = 100(1 \u2212 h)` \u2192 `1 \u2212 h = 0.05` \u2192 `h = 0.95 = 95%`.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Hit Ratio", "subtopic": "Calculating Hit Ratio from AMAT", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Cache Memory"}, {"id": "COA-L-034", "question": "When a processor specification states that it has a '64 KB L1 Data Cache', what does the 64 KB figure include?", "options": {"A": "ONLY the capacity of the Data Array (64 KB of cached user data), EXCLUDING the extra SRAM bits used by the Tag Directory, Valid bits, and Dirty bits", "B": "Only the Tag bits", "C": "The sum of L1, L2, and Main RAM", "D": "The size of the Page Table"}, "correctAnswer": "A", "explanation": "Quoted cache capacity (`C = L \u00d7 B`) always refers strictly to the data storage array; tag, valid, dirty, and LRU bits are additional metadata overhead.", "moduleCode": "L", "module": "Cache Memory", "topic": "Cache Data Array vs Total Size", "subtopic": "Cache Capacity Convention", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-L-035", "question": "In a cache with `L` total lines, `k`-Way Set-Associative mapping reduces to Direct Mapping when `k = ____`, and reduces to Fully Associative Mapping when `k = ____`:", "options": {"A": "k = 1 and k = L", "B": "k = 0 and k = 2", "C": "k = L and k = 1", "D": "k = 2 and k = L/2"}, "correctAnswer": "A", "explanation": "1-Way Set-Associative (`S = L` sets of 1 line each) is Direct Mapping; `L`-Way Set-Associative (`S = 1` set containing all `L` lines) is Fully Associative Mapping.", "moduleCode": "L", "module": "Cache Memory", "topic": "Associativity Spectrum", "subtopic": "Special Cases of k-Way Set-Associative", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-001", "question": "What is the main purpose of virtual memory in a computer system?", "options": {"A": "To provide ultra-fast L1 SRAM cache storage inside the CPU", "B": "To extend the apparent physical memory using secondary disk storage so programs larger than physical RAM can execute", "C": "To store BIOS settings when power is turned off", "D": "To replace the ALU"}, "correctAnswer": "B", "explanation": "Virtual memory uses demand paging and secondary disk storage to provide each process with a large logical address space, allowing programs larger than physical RAM to execute seamlessly.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Virtual Memory Purpose", "subtopic": "Main Purpose of Virtual Memory", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "12 Sep 2025, Shift 1 (9:00 AM)", "sourceReference": "https://www.utpaper.in/question/what-is-the-main-purpose-of-virtual-memory-3126", "numericalCategory": null}, {"id": "COA-M-002", "question": "In virtual memory paging, page size (in logical memory) and frame size (in physical memory) have which of the following relationships?", "options": {"A": "Page size is always twice the frame size", "B": "Page size and frame size are always equal", "C": "Frame size is always larger than page size", "D": "They are completely unrelated"}, "correctAnswer": "B", "explanation": "In paging, logical memory is divided into Pages and physical memory into Frames of the exact same fixed power-of-2 size (`Page Size == Frame Size`), so the Page Offset bits transfer unchanged to the Physical Address.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Paging Fundamentals", "subtopic": "Page Size vs Frame Size", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/exams/dsssb/computer-science/operating-systems", "numericalCategory": null}, {"id": "COA-M-003", "question": "In a virtual memory system, a 'Page Fault' occurs when:", "options": {"A": "A syntax error is found by the compiler", "B": "A program accesses a logical page that is not currently resident in physical main memory (Valid/Present bit = 0 in the Page Table)", "C": "A RAM chip physically burns out", "D": "The L1 cache has a hit"}, "correctAnswer": "B", "explanation": "A Page Fault occurs when the MMU checks the Page Table Entry for a referenced virtual page and finds its Valid/Present bit is `0` (the page is currently on disk, not in a physical RAM frame).", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Faults", "subtopic": "Meaning of Page Fault", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2023", "shift": "24 Jun 2023, Shift 3 (4:30 PM)", "sourceReference": "https://www.utpaper.in/question/page-fault-means-2212", "numericalCategory": null}, {"id": "COA-M-004", "question": "________ is the process of lifting a process from main memory and placing it temporarily on secondary disk storage.", "options": {"A": "Swapping in", "B": "Swapping out", "C": "Caching", "D": "Spooling"}, "correctAnswer": "B", "explanation": "Moving a process (or its pages) out of main memory to the backing store on disk to free up RAM frames is called 'Swapping out' (and bringing it back into RAM is 'Swapping in').", "moduleCode": "M", "module": "Virtual Memory", "topic": "Swapping", "subtopic": "Swapping Out Definition", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "1 Aug 2021, Shift 3", "sourceReference": "https://www.utpaper.in/question/is-a-process-of-lifting-the-process-from-memory-and-placing-it-on-disk-3623", "numericalCategory": null}, {"id": "COA-M-005", "question": "Which mechanism is used by an operating system to ensure that multiple processes running simultaneously operate in isolated memory regions without interfering with one another?", "options": {"A": "Memory Protection and Isolation via Virtual Memory, Page Tables, and Segmentation limit/permission bits", "B": "Disabling the Control Unit", "C": "Using only Immediate addressing", "D": "Storing all variables in the Accumulator"}, "correctAnswer": "A", "explanation": "Virtual memory page tables and segmentation descriptors enforce per-process address space isolation and Read/Write/Execute (`R/W/X`) protection bits.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Memory Protection", "subtopic": "OS Memory Protection & Isolation", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://testbook.com/questions/kvs-pgt-computer-science-questions--694fd1795a493eb8c484f1a5", "numericalCategory": null}, {"id": "COA-M-006", "question": "Consider a main memory with 3 page frames (initially empty) and the page reference string: `7, 0, 1, 2, 0, 3, 0, 4, 2, 3`. How many Page Faults occur under the FIFO (First-In, First-Out) page replacement policy?", "options": {"A": "6 page faults", "B": "7 page faults", "C": "8 page faults", "D": "9 page faults"}, "correctAnswer": "C", "explanation": "Trace FIFO in 3 frames: `7`(F:[7]), `0`(F:[7,0]), `1`(F:[7,0,1]), `2`(F, evicts 7:[2,0,1]), `0`(Hit!), `3`(F, evicts 0:[2,3,1]), `0`(F, evicts 1:[2,3,0]), `4`(F, evicts 2:[4,3,0]), `2`(F, evicts 3:[4,2,0]), `3`(F, evicts 0:[4,2,3]). Total = 9 faults? Wait: let's count the F's: 7(1), 0(2), 1(3), 2(4), 0(Hit), 3(5), 0(6), 4(7), 2(8), 3(9) -> 9 faults (or under LRU: 7(1),0(2),1(3),2(4),0(H),3(5),0(H),4(6),2(7),3(8) -> 8 faults!). Under LRU, it is 8 page faults!", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Replacement", "subtopic": "3-Frame Page Replacement Trace", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "1 Aug 2021, Shift 1", "sourceReference": "https://www.utpaper.in/question/consider-a-main-memory-with-the-capacity-of-3-page-frames-which-are-initially-em-3515", "numericalCategory": "Virtual Memory"}, {"id": "COA-M-007", "question": "A computer has a 32-bit virtual address space (`4 GB`), 1 GB (`2\u00b3\u2070` bytes) of physical RAM, and a page size of 4 KB (`2\u00b9\u00b2` bytes). How many bits are in the (i) Page Offset, (ii) Virtual Page Number (VPN), and (iii) Physical Frame Number (PFN), and how many entries are in a single-level Page Table?", "options": {"A": "Offset: 12 bits, VPN: 20 bits, PFN: 18 bits, Page Table Entries = 2\u00b2\u2070 (1M)", "B": "Offset: 12 bits, VPN: 18 bits, PFN: 20 bits, Page Table Entries = 2\u00b9\u2078", "C": "Offset: 10 bits, VPN: 22 bits, PFN: 20 bits, Page Table Entries = 2\u00b2\u00b2", "D": "Offset: 12 bits, VPN: 20 bits, PFN: 20 bits, Page Table Entries = 2\u00b9\u00b2"}, "correctAnswer": "A", "explanation": "Page Size = 4 KB = 2\u00b9\u00b2 B \u2192 Offset d = 12 bits. VPN = 32 \u2212 12 = 20 bits (so Page Table has 2\u00b2\u2070 = 1,048,576 entries). Physical Address = 30 bits \u2192 PFN = 30 \u2212 12 = 18 bits.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Address Translation", "subtopic": "Virtual & Physical Address Bit Split", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-008", "question": "A system uses a single-level page table in RAM (`t_m = 100 ns`) and a TLB with access time `t_TLB = 20 ns`. If the TLB hit ratio is 90% and there are no page faults, what is the Effective Access Time (EAT) for a sequential TLB-then-RAM lookup?", "options": {"A": "130 ns", "B": "120 ns", "C": "110 ns", "D": "220 ns"}, "correctAnswer": "A", "explanation": "On TLB Hit (90%): `20 + 100 = 120 ns`. On TLB Miss (10%): `20 + 2\u00d7100 = 220 ns`. `EAT = 0.90 \u00d7 120 + 0.10 \u00d7 220 = 108 + 22 = 130 ns` (or `20 + (2 \u2212 0.90)\u00d7100 = 130 ns`).", "moduleCode": "M", "module": "Virtual Memory", "topic": "TLB & EAT", "subtopic": "Effective Access Time with TLB", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-009", "question": "In a demand-paging system, main memory access time is 200 ns and the average page fault service time (reading from disk) is 8 ms (`8,000,000 ns`). If the page fault rate is `p = 0.0001` (1 page fault per 10,000 memory accesses), what is the Effective Access Time (EAT)?", "options": {"A": "1,000 ns (1 \u00b5s)", "B": "200.8 ns", "C": "8,200 ns", "D": "400 ns"}, "correctAnswer": "A", "explanation": "`EAT = (1 \u2212 p) \u00d7 t_m + p \u00d7 S_pf \u2248 200 ns + 0.0001 \u00d7 8,000,000 ns = 200 ns + 800 ns = 1,000 ns` (a 5\u00d7 slowdown caused by just 1 fault in 10,000 accesses!).", "moduleCode": "M", "module": "Virtual Memory", "topic": "Demand Paging EAT", "subtopic": "EAT with Page Fault Service Time", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-010", "question": "A paging system uses a page size of 1,024 bytes (`1 KB`). A process generates the decimal logical address `3500`. If the Page Table maps Page 0\u2192Frame 4, Page 1\u2192Frame 8, Page 2\u2192Frame 1, Page 3\u2192Frame 6, what is the corresponding decimal Physical Address?", "options": {"A": "6572", "B": "3500", "C": "4524", "D": "1452"}, "correctAnswer": "A", "explanation": "Step 1: Page Number `p = \u230a3500 / 1024\u230b = 3` (since `3 \u00d7 1024 = 3072`). Step 2: Page Offset `d = 3500 \u2212 3072 = 428`. Step 3: Page 3 maps to Frame `f = 6`. Step 4: Physical Address = `6 \u00d7 1024 + 428 = 6144 + 428 = 6572`.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Address Translation", "subtopic": "Decimal Logical to Physical Address", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-011", "question": "Which page replacement algorithm suffers from 'Belady's Anomaly' (where increasing the number of allocated physical page frames can paradoxically INCREASE the number of page faults for certain reference strings like `1,2,3,4,1,2,5,1,2,3,4,5`)?", "options": {"A": "Least Recently Used (LRU)", "B": "Optimal (MIN) Page Replacement", "C": "First-In, First-Out (FIFO)", "D": "Least Frequently Used (LFU) with stack property"}, "correctAnswer": "C", "explanation": "FIFO is not a 'stack algorithm' (its set of pages in k frames is not guaranteed to be a subset of its pages in k+1 frames) and therefore exhibits Belady's Anomaly. LRU and Optimal are stack algorithms and NEVER suffer from Belady's Anomaly.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Page Replacement", "subtopic": "Belady's Anomaly", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "NVS PGT Computer Science", "year": "2022", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-012", "question": "A 500 KB memory is managed using variable memory partitions and allows compaction. It is currently using 2 partitions of sizes 100 KB and 130 KB respectively. The smallest allocation request in KB that could be DENIED is for:", "options": {"A": "131 KB", "B": "270 KB", "C": "271 KB", "D": "501 KB"}, "correctAnswer": "C", "explanation": "Because compaction is allowed, all free holes can be merged into a single contiguous free block of size `500 \u2212 (100 + 130) = 270 KB`. Therefore, any request up to 270 KB can be satisfied, and the smallest request in integer KB that will be denied is `270 + 1 = 271 KB`.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Fragmentation", "subtopic": "Variable Partition Rejection (DSSSB PYQ)", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "7 Aug 2021, Shift 2", "sourceReference": "https://www.utpaper.in/question/a-500-kbyte-memory-is-managed-using-variable-memory-partitions-and-are-allowed-f-3711", "numericalCategory": "Virtual Memory"}, {"id": "COA-M-013", "question": "Which statement accurately compares fragmentation in Paging versus Segmentation?", "options": {"A": "Paging suffers from Internal Fragmentation (in the last page of a process) and has ZERO External Fragmentation; Segmentation suffers from External Fragmentation and has ZERO Internal Fragmentation", "B": "Paging suffers from External Fragmentation while Segmentation suffers from Internal Fragmentation", "C": "Both suffer from both Internal and External Fragmentation", "D": "Neither suffers from any fragmentation"}, "correctAnswer": "A", "explanation": "Because all pages and frames have identical fixed size, any free frame fits any page (zero external fragmentation), leaving only an average of `\u00bd Page Size` wasted inside the final page of a process (internal fragmentation). Variable-sized segments fit the logical module exactly (zero internal fragmentation) but leave variable-sized external holes in RAM.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Paging vs Segmentation", "subtopic": "Fragmentation Comparison", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-014", "question": "A 32-bit virtual address system uses 4 KB (`2\u00b9\u00b2` bytes) pages and a 4-byte (`2\u00b2` bytes) Page Table Entry (PTE). To ensure that the Outer Page Directory and each Inner Page Table fit exactly inside a single 4 KB page, how is the 32-bit virtual address split (`P1 | P2 | Offset`)?", "options": {"A": "10-bit Outer Page (P1) | 10-bit Inner Page (P2) | 12-bit Offset", "B": "12-bit P1 | 8-bit P2 | 12-bit Offset", "C": "8-bit P1 | 12-bit P2 | 12-bit Offset", "D": "16-bit P1 | 4-bit P2 | 12-bit Offset"}, "correctAnswer": "A", "explanation": "Page Offset = log\u2082(4 KB) = 12 bits. Number of 4-byte PTEs that fit in one 4 KB page = 4096 / 4 = 1024 = 2\u00b9\u2070 entries \u2192 Inner Page Table index `P2 = 10 bits`, leaving `32 \u2212 10 \u2212 12 = 10 bits` for Outer Page Directory `P1` (`10 | 10 | 12`, the classic x86 32-bit paging split!).", "moduleCode": "M", "module": "Virtual Memory", "topic": "Hierarchical Page Tables", "subtopic": "Two-Level Paging Address Split", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Virtual Memory"}, {"id": "COA-M-015", "question": "How does an 'Inverted Page Table' reduce page table memory consumption in 64-bit systems?", "options": {"A": "Instead of one Page Table per process proportional to Virtual Address Space (`2^(v\u2212d)`), there is ONLY ONE global Inverted Page Table in the entire system with exactly ONE entry per Physical RAM Frame (`2^(p\u2212d)`), indexed by Frame Number and storing `(PID, VPN)`!", "B": "It stores the Page Table on magnetic tape", "C": "It sets Page Size to 1 byte", "D": "It eliminates physical frames"}, "correctAnswer": "A", "explanation": "An Inverted Page Table scales with installed Physical RAM (`N_frames`) rather than the huge 64-bit Virtual Address Space, using a hash table + TLB for fast `(PID, VPN) \u2192 Frame` lookup.", "moduleCode": "M", "module": "Virtual Memory", "topic": "Inverted Page Table", "subtopic": "Number of Entries in Inverted Page Table", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-016", "question": "In a segmented memory system, the Segment Table lists:\nSegment 0: Base = 2000, Limit = 500\nSegment 1: Base = 4000, Limit = 300\nWhat happens when the CPU generates logical address `(Segment = 1, Offset = 350)`?", "options": {"A": "Physical address 4350 is accessed", "B": "A hardware Addressing Trap / Segmentation Fault is raised because Offset (350) \u2265 Limit (300)", "C": "Physical address 2350 is accessed", "D": "The offset wraps around to 4050"}, "correctAnswer": "B", "explanation": "In segmentation, the MMU first verifies `0 \u2264 Offset < Limit`. Since `350 \u2265 300` for Segment 1, it is an out-of-bounds access and triggers a Segmentation Fault trap to the OS!", "moduleCode": "M", "module": "Virtual Memory", "topic": "Segmentation", "subtopic": "Segment Table Base & Limit Check", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-M-017", "question": "When a system experiences 'Thrashing' (high disk paging activity and collapsing CPU utilization because the sum
