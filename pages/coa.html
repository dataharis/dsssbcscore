hain", "D": "Converting vectors into linked lists"}, "correctAnswer": "A", "explanation": "Vector Chaining forwards elements as soon as they emerge from the first vector pipeline into the second vector pipeline, saving `N_elements` cycles.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Vector Processing", "subtopic": "Vector Chaining", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-011", "question": "Why can mutual exclusion (spinlocks) across multiple processors NOT be implemented reliably using ordinary `LOAD` and `STORE` instructions alone without atomic hardware instructions like `Test-and-Set (TSL)` or `Compare-and-Swap (CAS)`?", "options": {"A": "Because two processors can simultaneously execute `LOAD Lock` (both seeing `0`) before either executes `STORE Lock = 1`, allowing both to enter the critical section! `TSL` and `CAS` perform the read-modify-write atomically in a single locked bus/cache transaction", "B": "Because `LOAD` cannot read from RAM", "C": "Because `STORE` takes 10 seconds", "D": "Because multiprocessors have no ALU"}, "correctAnswer": "A", "explanation": "Hardware atomic instructions (`TSL`, `XCHG`, `CAS`, `LL/SC`) lock the cache line or memory bus across the read and write steps so no other core can intervene.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Synchronization", "subtopic": "Atomic Hardware Primitives (TSL / CAS)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-012", "question": "Which of the four classes in Flynn's Taxonomy has the fewest commercial general-purpose implementations, typically appearing only in systolic arrays or redundant fault-tolerant flight control computers?", "options": {"A": "SISD", "B": "SIMD", "C": "MISD (Multiple Instruction, Single Data)", "D": "MIMD"}, "correctAnswer": "C", "explanation": "MISD applies multiple distinct instruction streams to a single data stream (e.g., triple-modular redundant flight control or specialized systolic pipelines).", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Flynn's Taxonomy", "subtopic": "MISD Architecture", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-013", "question": "A parallel program running on `N = 16` processors achieves a speedup of `S = 12` over a single processor. What is the 'Parallel Efficiency' (`E`) of this execution?", "options": {"A": "75% (`12 / 16 = 0.75`)", "B": "133%", "C": "25%", "D": "50%"}, "correctAnswer": "A", "explanation": "Parallel Efficiency `E(N) = Speedup(N) / N = 12 / 16 = 0.75 = 75%`.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Parallel Efficiency", "subtopic": "Speedup vs Parallel Efficiency", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Amdahl Law"}, {"id": "COA-Q-014", "question": "Both Array Processors (e.g., ILLIAC IV) and Vector Processors (e.g., Cray-1) belong to Flynn's SIMD class. How do their hardware organizations differ?", "options": {"A": "An Array Processor uses `N` parallel Processing Elements (PEs) each with its own ALU and local memory operating in lockstep, whereas a Vector Processor uses long Vector Registers feeding deeply pipelined functional units", "B": "An Array Processor has only 1 ALU and no registers", "C": "A Vector Processor cannot add floating-point numbers", "D": "They are identical in hardware"}, "correctAnswer": "A", "explanation": "Array processors achieve SIMD via spatial replication (`N` parallel ALUs), whereas Vector processors achieve SIMD via temporal pipelining (streaming vector registers through pipelined functional units)\u2014and modern GPUs combine both!", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Array vs Vector Processors", "subtopic": "Array Processor vs Pipelined Vector Processor", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-015", "question": "Match the type of hardware parallelism with the architectural mechanism that exploits it:\n1. Instruction-Level Parallelism (ILP)   P. Multicore processors & Simultaneous Multithreading (SMT)\n2. Data-Level Parallelism (DLP)          Q. Instruction Pipelining & Superscalar Out-of-Order Execution\n3. Thread-Level Parallelism (TLP)        R. SIMD Vector Extensions (AVX-512) & GPU Warps", "options": {"A": "1-Q, 2-R, 3-P", "B": "1-R, 2-Q, 3-P", "C": "1-P, 2-R, 3-Q", "D": "1-Q, 2-P, 3-R"}, "correctAnswer": "A", "explanation": "ILP is exploited by pipelining and superscalar execution (Q); DLP is exploited by SIMD/Vector/GPU hardware (R); TLP is exploited by Multicore and SMT (P).", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Levels of Parallelism", "subtopic": "ILP vs DLP vs TLP", "difficulty": "Easy", "questionType": "Match-the-Following", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-016", "question": "In a 4-dimensional Hypercube (`16` nodes numbered `0000\u2082` to `1111\u2082`), what is the shortest path distance (number of link hops) between Node `0101\u2082` (5) and Node `1110\u2082` (14)?", "options": {"A": "1 hop", "B": "2 hops", "C": "3 hops", "D": "4 hops"}, "correctAnswer": "C", "explanation": "In a binary Hypercube, two nodes are directly connected by a link if and only if their binary addresses differ in 1 bit. Thus the shortest path distance is the Hamming distance (`0101 \u2295 1110 = 1011\u2082`, which has three 1s = **3 hops**)!", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Interconnection Networks", "subtopic": "Routing in a Hypercube (E-Cube Routing)", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-017", "question": "How does 'Gustafson's Law' (Scaled Speedup: `S_scaled(N) = (1 \u2212 P) + N \u00d7 P`) counter the pessimism of Amdahl's Law for massive supercomputers?", "options": {"A": "It observes that as users get more processors `N`, they scale up the parallel data problem size (keeping total runtime fixed) rather than solving the same tiny fixed-size problem!", "B": "It assumes serial code runs in 0 seconds", "C": "It prohibits parallel processors", "D": "It states that speedup is always 1"}, "correctAnswer": "A", "explanation": "Amdahl's Law assumes a fixed problem size (strong scaling), whereas Gustafson's Law models weak scaling (growing problem size with `N`).", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Scalability", "subtopic": "Gustafson's Law (Scaled Speedup)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-018", "question": "In a shared-memory multiprocessor with a snoopy Write-Invalidate cache protocol, what causes 'False Sharing'?", "options": {"A": "Two cores repeatedly modify TWO DIFFERENT independent variables (`x` and `y`) that happen to reside inside the SAME 64-byte Cache Block, causing the entire cache block to ping-pong (invalidate) back and forth between the two cores!", "B": "Two cores read the same constant instruction from ROM", "C": "A core divides by zero", "D": "A hard disk sector fails"}, "correctAnswer": "A", "explanation": "Because cache coherence operates at the granularity of a whole Cache Block (e.g., 64 bytes), independent variables packed into the same cache line cause unnecessary coherence invalidations (`False Sharing`), cured by padding/aligning hot per-thread variables to 64-byte cache line boundaries.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Cache Coherence", "subtopic": "False Sharing in Multiprocessor Caches", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-Q-019", "question": "Which of the following is NOT an example or characteristic of Distributed Computing?", "options": {"A": "Resource sharing across autonomous networked nodes", "B": "Fault tolerance and incremental scalability", "C": "All processors sharing a single centralized CPU register file and clock", "D": "Concurrent execution across geographically or locally networked computers"}, "correctAnswer": "C", "explanation": "In distributed computing, autonomous nodes have their own independent clocks, CPUs, and local memories; they do NOT share a single centralized CPU register file and clock.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Distributed Computing", "subtopic": "Characteristics of Distributed Systems", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB PGT Computer Science", "year": "2021", "shift": "11 Jul 2021", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-is-not-a-example-of-distributive-computing-4111", "numericalCategory": null}, {"id": "COA-Q-020", "question": "What does the metric 'Bisection Bandwidth' measure in a multiprocessor interconnection network?", "options": {"A": "The minimum data bandwidth across a cut that divides the `N`-node network into two equal halves of `N/2` nodes each", "B": "The clock rate of a single ALU", "C": "The capacity of the L1 cache", "D": "The rotational speed of a disk"}, "correctAnswer": "A", "explanation": "Bisection Bandwidth measures global communication capacity under worst-case all-to-all traffic by cutting the network into two equal `N/2` partitions.", "moduleCode": "Q", "module": "Parallel Processing", "topic": "Interconnection Networks", "subtopic": "Bisection Bandwidth", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-001", "question": "Which of the following is a characteristic of a RISC (Reduced Instruction Set Computer) processor?", "options": {"A": "Microprogrammed control unit", "B": "Instructions that manipulate operands directly in main memory", "C": "Fixed-length, easily decoded instruction format", "D": "A large number (100\u2013250) of complex variable-length instructions"}, "correctAnswer": "C", "explanation": "RISC processors use fixed-length (e.g., 32-bit), easily decoded instruction formats, hardwired control, a load-store architecture, and single-cycle execution.", "moduleCode": "R", "module": "RISC and CISC", "topic": "RISC Characteristics", "subtopic": "Fixed-Length Instruction Format", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2024", "shift": "7 Feb 2024, Shift 2 (12:30 PM)", "sourceReference": "https://www.utpaper.in/question/which-of-the-following-is-characteristic-of-a-risc-reduced-instruction-set-compu-2019", "numericalCategory": null}, {"id": "COA-R-002", "question": "The processor design technology that stores only the essential, simple instructions on a microprocessor chip and thus enhances its execution speed is referred to as:", "options": {"A": "MIMD", "B": "CISC", "C": "RISC", "D": "SIMD"}, "correctAnswer": "C", "explanation": "RISC (Reduced Instruction Set Computer) keeps only essential, simple instructions on the chip so they execute in 1 clock cycle via a streamlined hardwired pipeline.", "moduleCode": "R", "module": "RISC and CISC", "topic": "RISC Definition", "subtopic": "Essential Instructions on Chip", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": "https://www.utpaper.in/question/the-technology-that-stores-only-the-essential-instructions-on-a-microprocessors-4154", "numericalCategory": null}, {"id": "COA-R-003", "question": "Why is a RISC architecture also called a 'Load-Store Architecture'?", "options": {"A": "Because ONLY explicit `LOAD` and `STORE` instructions are permitted to access main memory; all arithmetic and logical instructions operate strictly on CPU registers", "B": "Because it has no registers", "C": "Because it loads programs directly from magnetic tape", "D": "Because `ADD` instructions must always write to the hard disk"}, "correctAnswer": "A", "explanation": "Restricting memory access to `LOAD` and `STORE` keeps all ALU instructions uniform in length and duration, making 5-stage pipelining simple and hazard-free.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Load-Store Architecture", "subtopic": "Memory Access in RISC", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-004", "question": "A RISC processor (like Berkeley RISC / SPARC) uses Overlapping Register Windows with `G = 8` global registers and `W = 8` circular windows. Each window contains `L = 8` local registers and shares `C = 8` common (In/Out overlap) registers with adjacent windows. What are (i) the number of registers visible to a procedure at any instant, and (ii) the total number of physical registers in the CPU?", "options": {"A": "(i) 32 visible registers; (ii) 136 total physical registers", "B": "(i) 24 visible registers; (ii) 136 total physical registers", "C": "(i) 32 visible registers; (ii) 200 total physical registers", "D": "(i) 16 visible registers; (ii) 64 total physical registers"}, "correctAnswer": "A", "explanation": "(i) Visible window size = `G + In + Local + Out = G + L + 2C = 8 + 8 + 2(8) = 32` registers. (ii) Total physical registers = `G + W \u00d7 (L + C) = 8 + 8 \u00d7 (8 + 8) = 8 + 128 = 136` physical registers!", "moduleCode": "R", "module": "RISC and CISC", "topic": "Register Organization", "subtopic": "Overlapping Register Windows Numerical", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-005", "question": "What is the primary performance goal of 'Overlapping Register Windows' in RISC architectures?", "options": {"A": "To eliminate slow main memory stack accesses (`PUSH`/`POP`) during procedure calls and returns by passing parameters in the overlapping Out/In registers and simply incrementing/decrementing the Current Window Pointer (`CWP`)", "B": "To display multiple GUI windows on a monitor", "C": "To replace the Instruction Cache", "D": "To convert CISC code to ASCII"}, "correctAnswer": "A", "explanation": "Because Window `i`'s Out registers physically overlap with Window `i+1`'s In registers, calling a subroutine passes arguments in registers with zero memory traffic!", "moduleCode": "R", "module": "RISC and CISC", "topic": "Register Organization", "subtopic": "Purpose of Overlapping Register Windows", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-006", "question": "When the exact same C program is compiled for a pure RISC processor versus a CISC processor, how do their compiled binary machine code sizes (in bytes) and instruction counts (`IC`) typically compare?", "options": {"A": "The RISC binary has a HIGHER Instruction Count (`IC`) and LARGER total code size in bytes than the CISC binary, but executes with a much lower CPI (`\u2248 1`)", "B": "The RISC binary has fewer instructions and smaller code size than CISC", "C": "Both have the exact same instruction count", "D": "CISC binaries cannot be compiled from C"}, "correctAnswer": "A", "explanation": "CISC instructions pack complex multi-step operations (like memory-to-register add with indexing) into single compact instructions (smaller code size, lower `IC`, higher `CPI`), whereas RISC breaks them into separate `LOAD`, `ADD`, `STORE` instructions (higher `IC`, larger code size, `CPI \u2248 1`).", "moduleCode": "R", "module": "RISC and CISC", "topic": "RISC vs CISC", "subtopic": "Program Code Size Comparison", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-007", "question": "Which of the following lists contains ONLY RISC architectures?", "options": {"A": "ARM, RISC-V, MIPS, SPARC, and PowerPC", "B": "Intel x86, Motorola 68000, and DEC VAX", "C": "Intel 8085, 8086, and 80386", "D": "IBM System/370 and DEC VAX-11/780"}, "correctAnswer": "A", "explanation": "ARM, RISC-V, MIPS, SPARC, PowerPC, and DEC Alpha are RISC architectures. Intel x86, Motorola 680x0, DEC VAX, and IBM S/360-370 are CISC architectures.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Processor Examples", "subtopic": "Classify RISC vs CISC Families", "difficulty": "Easy", "questionType": "Match-the-Following", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-008", "question": "How do modern Intel Core and AMD Ryzen x86-64 processors combine the advantages of CISC and RISC?", "options": {"A": "They maintain the variable-length CISC x86 ISA externally for software compatibility, but their hardware front-end decoders translate x86 instructions into fixed-length RISC-like micro-operations (`\u00b5ops`) executed on a pipelined Load-Store superscalar core", "B": "They run at 100 Hz using vacuum tubes", "C": "They require programmers to write microcode manually", "D": "They have no general-purpose registers"}, "correctAnswer": "A", "explanation": "Since the Intel Pentium Pro / P6 microarchitecture, x86 CPUs decode CISC instructions into RISC-like `\u00b5ops` so the execution engine enjoys all the pipelining and out-of-order benefits of RISC.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Modern Processor Design", "subtopic": "x86 Internal RISC Micro-ops (\u00b5ops)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-009", "question": "How does the placement of instruction-scheduling and optimization complexity differ between CISC and RISC design philosophies?", "options": {"A": "CISC places complexity in the HARDWARE (microcode ROM and complex decoding), whereas RISC simplifies hardware and shifts complexity to the COMPILER (register allocation and pipeline scheduling)", "B": "RISC places complexity in microcode ROM", "C": "Neither uses a compiler", "D": "CISC requires no hardware control unit"}, "correctAnswer": "A", "explanation": "RISC keeps silicon hardware simple and fast, relying on an optimizing compiler to allocate the 32+ registers and schedule instructions to avoid pipeline stalls.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Compiler Role", "subtopic": "Hardware vs Compiler Complexity", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-010", "question": "In classic 32-bit ARM RISC architecture, nearly every instruction can be conditionally executed based on a 4-bit condition code prefix (e.g., `ADDEQ`, `SUBNE`). What pipeline hazard does this 'Predicated Execution' avoid for short `if-else` statements?", "options": {"A": "It eliminates conditional Branch instructions, thereby avoiding Control (Branch) Hazards and branch misprediction flushes!", "B": "It eliminates Structural Hazards", "C": "It eliminates Page Faults", "D": "It eliminates DRAM refresh"}, "correctAnswer": "A", "explanation": "Replacing a short branch over 1\u20132 instructions with predicated conditional instructions (`ADDEQ R1, R2, R3`) keeps the instruction stream sequential and avoids branch misprediction penalties.", "moduleCode": "R", "module": "RISC and CISC", "topic": "ARM Architecture", "subtopic": "Conditional Execution / Predication", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-011", "question": "Traditionally, RISC processors pair with a ________ Control Unit, while CISC processors pair with a ________ Control Unit:", "options": {"A": "Hardwired; Microprogrammed", "B": "Microprogrammed; Hardwired", "C": "DMA; Interrupt", "D": "Virtual; Physical"}, "correctAnswer": "A", "explanation": "RISC uses Hardwired control for 1-cycle decoding; CISC uses Microprogrammed control to sequence complex multi-cycle instructions.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Hardwired vs Microcode", "subtopic": "Control Unit Pairing", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-012", "question": "Why do RISC architectures provide a large Register File (typically 32 general-purpose registers) compared to classic CISC architectures (e.g., 8 general-purpose registers in 32-bit x86)?", "options": {"A": "To keep local variables, expression temporaries, and function parameters in fast CPU registers and minimize `LOAD`/`STORE` memory traffic", "B": "Because RISC instructions are 128 bits wide", "C": "Because RISC CPUs have no cache memory", "D": "To slow down context switches"}, "correctAnswer": "A", "explanation": "Since RISC prohibits direct memory operands in ALU instructions, having 32 registers lets the compiler keep operands in registers and avoid spilling to memory.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Register Count", "subtopic": "Why RISC Has Many Registers", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-013", "question": "Why do RISC architectures like MIPS (`$zero / R0`) and RISC-V (`x0`) permanently hardwire Register 0 to the constant value `0` (so reading `R0` always returns `0` and writing to `R0` has no effect)?", "options": {"A": "It allows common operations like `MOV R1, R2` (`ADD R1, R2, R0`), `NEG R1, R2` (`SUB R1, R0, R2`), `NOP` (`ADD R0, R0, R0`), and zero-comparisons to be synthesized directly from existing instructions without adding extra opcodes!", "B": "Because flip-flops cannot be built for Register 0", "C": "To cause a divide-by-zero exception", "D": "To store the stack pointer"}, "correctAnswer": "A", "explanation": "A hardwired zero register (`R0 = 0`) streamlines the ISA by letting standard 3-operand instructions synthesize `MOV`, `CLR`, `NEG`, `CMP`, and `NOP` as pseudo-instructions!", "moduleCode": "R", "module": "RISC and CISC", "topic": "RISC-V & MIPS", "subtopic": "Hardwired Zero Register (R0 / x0)", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-014", "question": "Why did ARM introduce 'Thumb / Thumb-2' and RISC-V introduce the 'C (Compressed) Extension' (allowing common 32-bit RISC instructions to be encoded in 16 bits)?", "options": {"A": "To overcome RISC's larger program size disadvantage and achieve CISC-like high code density for embedded systems and better L1 Instruction Cache hit rates!", "B": "To convert RISC into a microprogrammed stack machine", "C": "To reduce the number of registers to 2", "D": "To disable pipelining"}, "correctAnswer": "A", "explanation": "Compressed 16-bit instructions expand into standard 32-bit RISC instructions in the `IF/ID` decoder while shrinking binary code size by 25\u201330%.", "moduleCode": "R", "module": "RISC and CISC", "topic": "ARM Thumb / RISC-V C", "subtopic": "Compressed 16-Bit RISC Instructions", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-R-015", "question": "Historically, what motivated computer architects in the 1960s and 1970s (like the designers of DEC VAX and IBM System/360) to design rich CISC instruction sets?", "options": {"A": "To bridge the 'Semantic Gap' between high-level programming languages and machine code while minimizing program size when main memory (magnetic core / early DRAM) was extremely small and expensive", "B": "Because compilers did not exist in the 1970s", "C": "Because hardwired gates were slower than magnetic tape", "D": "Because L3 caches were 64 MB in 1970"}, "correctAnswer": "A", "explanation": "Early CISC designers aimed to close the 'Semantic Gap' by providing single machine instructions for array bounds checking, polynomial evaluation, loop control, and string manipulation.", "moduleCode": "R", "module": "RISC and CISC", "topic": "Semantic Gap", "subtopic": "Origin of CISC Philosophy", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-001", "question": "Which of the following equations correctly states the fundamental CPU Execution Time ('Iron Law of Processor Performance')?", "options": {"A": "CPU Time = (Instruction Count \u00d7 CPI) / Clock Cycle Time", "B": "CPU Time = Instruction Count \u00d7 CPI \u00d7 Clock Cycle Time = (Instruction Count \u00d7 CPI) / Clock Rate", "C": "CPU Time = Clock Rate / (Instruction Count \u00d7 CPI)", "D": "CPU Time = MIPS \u00d7 Clock Rate"}, "correctAnswer": "B", "explanation": "`CPU Execution Time = Instruction Count (IC) \u00d7 Cycles Per Instruction (CPI) \u00d7 Clock Cycle Time (T_clk)`. Since `T_clk = 1 / Clock_Rate`, `CPU Time = (IC \u00d7 CPI) / Clock_Rate`.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "CPU Performance Equation", "subtopic": "Iron Law of Processor Performance", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-002", "question": "A program consists of `10\u2077` (10 million) instructions with the following mix:\n\u2022 Arithmetic: 60% (CPI = 1)\n\u2022 Load/Store: 20% (CPI = 4)\n\u2022 Branch: 20% (CPI = 2)\nIf the processor runs at a clock rate of `2 GHz`, what are the Weighted Average CPI and the total CPU Execution Time?", "options": {"A": "CPI = 1.8; CPU Time = 9 ms", "B": "CPI = 2.33; CPU Time = 11.65 ms", "C": "CPI = 1.8; CPU Time = 18 ms", "D": "CPI = 1.5; CPU Time = 7.5 ms"}, "correctAnswer": "A", "explanation": "Step 1: `CPI = 0.60(1) + 0.20(4) + 0.20(2) = 0.6 + 0.8 + 0.4 = 1.8`. Step 2: `CPU Time = (10\u2077 \u00d7 1.8) / (2 \u00d7 10\u2079 Hz) = 0.9 \u00d7 10\u207b\u00b2 s = 9 ms`.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Weighted Average CPI", "subtopic": "Calculating Average CPI and Execution Time", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-003", "question": "A processor has a clock frequency of `1.6 GHz` and executes a benchmark program with an average `CPI` of `2.0`. What is its execution rate in `MIPS` (Millions of Instructions Per Second)?", "options": {"A": "3,200 MIPS", "B": "800 MIPS", "C": "1,600 MIPS", "D": "400 MIPS"}, "correctAnswer": "B", "explanation": "`MIPS = Clock_Rate_in_MHz / CPI = 1,600 MHz / 2.0 = 800 MIPS`.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "MIPS Calculation", "subtopic": "Calculating MIPS from Clock Rate and CPI", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-004", "question": "Two compilers (Compiler 1 and Compiler 2) compile the exact same application for a `1 GHz` processor (`1000 MHz`).\n\u2022 Compiler 1 emits `10 \u00d7 10\u2079` instructions with an average `CPI = 1.2`.\n\u2022 Compiler 2 emits `8 \u00d7 10\u2079` instructions with an average `CPI = 1.4`.\nWhich compiled binary runs FASTER (shorter execution time), and which achieves a HIGHER MIPS rating?", "options": {"A": "Compiler 2 runs faster (`T = 11.2 s` vs `12.0 s`), even though Compiler 1 has a higher MIPS rating (`833.3 MIPS` vs `714.3 MIPS`)!", "B": "Compiler 1 runs faster and has a higher MIPS rating", "C": "Compiler 2 runs faster and has a higher MIPS rating", "D": "Both take the exact same time"}, "correctAnswer": "A", "explanation": "Compiler 1: `T\u2081 = (10\u00d710\u2079 \u00d7 1.2) / 10\u2079 = 12.0 s`, `MIPS\u2081 = 1000 / 1.2 = 833.3 MIPS`. Compiler 2: `T\u2082 = (8\u00d710\u2079 \u00d7 1.4) / 10\u2079 = 11.2 s` (FASTER!), `MIPS\u2082 = 1000 / 1.4 = 714.3 MIPS` (LOWER!). This proves why MIPS can be a misleading metric when Instruction Count changes!", "moduleCode": "S", "module": "Performance Evaluation", "topic": "MIPS Trap", "subtopic": "Why Higher MIPS Can Mean Slower Execution", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-005", "question": "If Computer A executes a benchmark in `10 seconds` and Computer B executes the same benchmark in `25 seconds`, what is the performance ratio `Performance_A / Performance_B`?", "options": {"A": "Computer A is 2.5 times faster than Computer B (`25 / 10 = 2.5`)", "B": "Computer B is 2.5 times faster than Computer A", "C": "Computer A is 15 times faster than Computer B", "D": "Computer A is 0.4 times faster than Computer B"}, "correctAnswer": "A", "explanation": "Since `Performance = 1 / Execution_Time`, `Perf_A / Perf_B = Time_B / Time_A = 25 / 10 = 2.5`.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Performance Ratio", "subtopic": "Meaning of 'X is n Times Faster than Y'", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-006", "question": "A program takes `12 seconds` to run on Processor P1 (`2 GHz`). A designer wants to build Processor P2 so the same program (same Instruction Count) runs in `8 seconds`. However, increasing the clock rate increases the average `CPI` by `20%` (`CPI\u2082 = 1.2 \u00d7 CPI\u2081`). What clock frequency must Processor P2 have?", "options": {"A": "3.0 GHz", "B": "3.6 GHz", "C": "2.4 GHz", "D": "4.0 GHz"}, "correctAnswer": "B", "explanation": "Since `T = (IC \u00d7 CPI) / f`, we have `T\u2081 / T\u2082 = (CPI\u2081 / CPI\u2082) \u00d7 (f\u2082 / f\u2081)` \u2192 `12 / 8 = (1 / 1.2) \u00d7 (f\u2082 / 2 GHz)` \u2192 `1.5 \u00d7 1.2 = f\u2082 / 2 GHz` \u2192 `f\u2082 = 1.8 \u00d7 2 GHz = 3.6 GHz`!", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Clock Rate Scaling", "subtopic": "Clock Frequency with CPI Penalty", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-007", "question": "In a program, Multiplication instructions account for `20%` of execution time and Floating-Point (FP) instructions account for `50%` of execution time. Team A proposes making Multiply `4\u00d7` faster; Team B proposes making FP `2\u00d7` faster. Using Amdahl's Law, which enhancement gives the higher overall speedup?", "options": {"A": "Team B (FP 2\u00d7 faster gives Speedup = 1.33\u00d7, whereas Multiply 4\u00d7 faster gives Speedup = 1.18\u00d7)", "B": "Team A (Multiply 4\u00d7 faster gives higher speedup)", "C": "Both give the exact same speedup", "D": "Neither improves performance"}, "correctAnswer": "A", "explanation": "Team A: `S_A = 1 / [(1 \u2212 0.20) + 0.20/4] = 1 / [0.80 + 0.05] = 1 / 0.85 = 1.176\u00d7`. Team B: `S_B = 1 / [(1 \u2212 0.50) + 0.50/2] = 1 / [0.50 + 0.25] = 1 / 0.75 = 1.333\u00d7`. Rule: Make the common case fast!", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Instruction Enhancement", "subtopic": "Comparing Two Architectural Enhancements", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Amdahl Law"}, {"id": "COA-S-008", "question": "The dynamic power consumption of a CMOS processor is proportional to `C \u00d7 V\u00b2 \u00d7 f`. If an undervolting/underclocking power-saving mode reduces both the supply voltage `V` and the clock frequency `f` to `80%` (`0.8\u00d7`) of their original values, what is the new dynamic power relative to the original dynamic power?", "options": {"A": "80% (20% reduction)", "B": "64% (36% reduction)", "C": "51.2% (48.8% reduction)", "D": "40% (60% reduction)"}, "correctAnswer": "C", "explanation": "`P_new / P_old = (0.8)\u00b2 \u00d7 (0.8) = 0.64 \u00d7 0.8 = 0.512 = 51.2%` of original power (nearly cutting power consumption in half!).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Power Consumption", "subtopic": "CMOS Dynamic Power Reduction", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-009", "question": "Which statistical mean does the SPEC (Standard Performance Evaluation Corporation) CPU benchmark suite use to summarize normalized execution time ratios across multiple benchmark programs?", "options": {"A": "Arithmetic Mean", "B": "Geometric Mean", "C": "Median", "D": "Mode"}, "correctAnswer": "B", "explanation": "SPEC uses the **Geometric Mean** (`(\u220f R_i)^(1/n)`) of normalized performance ratios because the ratio of Geometric Means of two machines is invariant to the choice of reference machine.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Benchmarking", "subtopic": "SPEC Benchmark Summary Mean", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-010", "question": "What does the supercomputing performance metric 'GFLOPS' stand for?", "options": {"A": "Giga (10\u2079) Floating-Point Operations Per Second", "B": "General File-Level Operating System", "C": "Global Fetch-Load Opcode Speed", "D": "Gigabytes of Flash Local Storage"}, "correctAnswer": "A", "explanation": "FLOPS = Floating-Point Operations Per Second (`MFLOPS = 10\u2076`, `GFLOPS = 10\u2079`, `TFLOPS = 10\u00b9\u00b2`, `PFLOPS = 10\u00b9\u2075`, `EFLOPS = 10\u00b9\u2078` ExaFLOPS).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "FLOPS", "subtopic": "MFLOPS and GFLOPS Definition", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-011", "question": "If a cloud web service adds 10 identical parallel servers behind a load balancer (without changing individual server hardware), how does this affect single-request 'Latency' (Response Time) versus overall system 'Throughput'?", "options": {"A": "Overall system Throughput increases by up to 10\u00d7 (and queueing wait drops), while the unloaded processing Latency of a single request remains unchanged", "B": "Single-request processing Latency drops by 10\u00d7 while Throughput stays constant", "C": "Both Latency and Throughput drop to zero", "D": "Throughput decreases by 10\u00d7"}, "correctAnswer": "A", "explanation": "Replicating parallel servers scales system **Throughput** (requests/sec), whereas reducing single-task unloaded **Latency** requires faster clock rate, lower CPI, or parallelizing the single task itself.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Latency vs Throughput", "subtopic": "Effect of Adding More Parallel Server Nodes", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-012", "question": "What is the primary physical cause of 'Static Power Dissipation' (`P_static = V_dd \u00d7 I_leak`) in modern nanometer-scale CMOS processors even when transistors are not switching?", "options": {"A": "Subthreshold transistor leakage current and gate-oxide tunneling current", "B": "Spinning of the CPU cooling fan", "C": "DMA bus arbitration", "D": "Capacitor charging during 0\u21921 transitions"}, "correctAnswer": "A", "explanation": "Dynamic power comes from charging/discharging load capacitances during switching; Static power comes from transistor leakage currents when idle.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Static vs Dynamic Power", "subtopic": "Cause of Static Power in Deep Submicron CMOS", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-013", "question": "Why is 'Energy' (measured in Joules = Watts \u00d7 Seconds) rather than instantaneous 'Power' (Watts) the true metric that determines battery life in a mobile device for a fixed workload?", "options": {"A": "Because cutting clock rate in half (at constant voltage) halves Power (`0.5 W`), but doubles Execution Time (`2 s`), consuming the EXACT SAME total Energy (`0.5 \u00d7 2 = 1.0 J`)!", "B": "Because Watts and Joules are identical units", "C": "Because batteries store frequency, not energy", "D": "Because slower clocks always drain batteries faster"}, "correctAnswer": "A", "explanation": "`Energy = Power \u00d7 Execution_Time = (\u00bd C V\u00b2 f) \u00d7 (Cycles / f) = \u00bd C V\u00b2 \u00d7 Cycles`. Notice that `f` cancels out! To save dynamic energy per task, you must lower Voltage `V` (or reduce total switched capacitance `C \u00d7 Cycles`).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Power vs Energy", "subtopic": "Power vs Energy Distinction", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-014", "question": "A scientific program executes `5 \u00d7 10\u2078` floating-point operations and `15 \u00d7 10\u2078` integer/control operations in `0.25 seconds`. What is the `MFLOPS` rating of the processor on this program?", "options": {"A": "2,000 MFLOPS", "B": "8,000 MFLOPS", "C": "500 MFLOPS", "D": "1,250 MFLOPS"}, "correctAnswer": "A", "explanation": "`MFLOPS = (Number of Floating-Point Operations) / (Execution_Time \u00d7 10\u2076) = (5 \u00d7 10\u2078) / (0.25 \u00d7 10\u2076) = 500 / 0.25 = 2,000 MFLOPS` (2 GFLOPS). Note that integer operations are excluded from FLOPS!", "moduleCode": "S", "module": "Performance Evaluation", "topic": "MFLOPS Calculation", "subtopic": "Calculating MFLOPS", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-015", "question": "In a program where Branch instructions make up `20%` of all instructions and have `CPI = 3`, while all other `80%` of instructions have `CPI = 1` (so initial `CPI_avg = 1.4`), if a hardware Branch Target Buffer reduces the Branch `CPI` from `3` down to `1`, by what percentage is total execution time reduced?", "options": {"A": "28.57% reduction (from 1.4 cycles/instr down to 1.0 cycles/instr)", "B": "20.00% reduction", "C": "40.00% reduction", "D": "50.00% reduction"}, "correctAnswer": "A", "explanation": "Initial `CPI = 0.8(1) + 0.2(3) = 1.4`. New `CPI = 0.8(1) + 0.2(1) = 1.0`. Percentage reduction in execution time = `[(1.4 \u2212 1.0) / 1.4] \u00d7 100% = (0.4 / 1.4) \u00d7 100% = 28.57%`.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "CPI Reduction", "subtopic": "Eliminating Instructions vs Reducing CPI", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "CPU Performance"}, {"id": "COA-S-016", "question": "Why did early small synthetic benchmarks like 'Dhrystone' and 'Whetstone' become unreliable indicators of real-world processor performance?", "options": {"A": "Because their tiny code and data footprints fit entirely inside the L1 cache (never testing memory hierarchy) and compilers could easily optimize away dead loops built into the synthetic benchmark", "B": "Because they required 1 TB of RAM", "C": "Because they could only run on quantum computers", "D": "Because they took 3 weeks to execute"}, "correctAnswer": "A", "explanation": "Small synthetic loops fit entirely in L1 cache and are susceptible to targeted compiler tricks, leading the industry to adopt full-application suites like SPEC.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Benchmarking", "subtopic": "Synthetic Benchmarks Pitfall", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-017", "question": "In Unix/Linux performance measurement (`time` command), how do 'User CPU Time', 'System CPU Time', and 'Wall-Clock (Elapsed / Real) Time' differ?", "options": {"A": "User CPU Time is cycles spent executing user application code; System CPU Time is cycles spent inside the OS kernel on behalf of the process; Wall-Clock Time is total elapsed real time including disk I/O waits and time slices given to other processes", "B": "They are always equal", "C": "User CPU time includes disk wait time", "D": "System CPU time measures monitor refresh rate"}, "correctAnswer": "A", "explanation": "`Wall-Clock Time = User_CPU_Time + System_CPU_Time + I/O_Wait_Time + Other_Process_Time` (on a single core).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "CPU Time vs Wall-Clock Time", "subtopic": "Elapsed Time vs User CPU Time vs System CPU Time", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-018", "question": "When averaging processing RATES (such as MIPS or MFLOPS) across benchmarks that each execute the **exact same number of operations (instructions or FLOPs)**, which mathematical mean gives the exact true aggregate rate?", "options": {"A": "Harmonic Mean (`n / \u2211(1 / Rate_i)`)", "B": "Arithmetic Mean", "C": "Geometric Mean", "D": "Standard Deviation"}, "correctAnswer": "A", "explanation": "Rate = `Work / Time`. When `Work` is constant across `n` runs, `Total_Rate = (n \u00d7 Work) / \u2211(Work / Rate_i) = n / \u2211(1 / Rate_i)`, which is the **Harmonic Mean**! (Arithmetic Mean is valid for rates only when `Time` is constant across runs).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Harmonic Mean", "subtopic": "When to Use Harmonic Mean for Rates", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-019", "question": "Which metric is used by the Green500 supercomputer ranking to measure energy efficiency?", "options": {"A": "GFLOPS per Watt (billions of floating-point operations per second per Watt of power)", "B": "Megabytes per kilogram", "C": "Clock rate per core", "D": "Cache lines per dollar"}, "correctAnswer": "A", "explanation": "Performance per Watt (`GFLOPS/Watt` or `Instructions/Joule`) measures computational work completed per unit of electrical energy consumed.", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Performance per Watt", "subtopic": "Green500 Metric", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-S-020", "question": "Which two components of the Iron Law (`CPU Time = IC \u00d7 CPI \u00d7 T_clk`) are directly affected by changing the **Compiler Optimization Level** (e.g., `-O0` vs `-O3`) on the same processor?", "options": {"A": "Instruction Count (`IC`) and Average `CPI` (Clock Cycle Time `T_clk` is fixed by the hardware)", "B": "Only Clock Cycle Time (`T_clk`)", "C": "Only the physical size of DRAM", "D": "Compiler optimization has zero effect on IC or CPI"}, "correctAnswer": "A", "explanation": "A compiler cannot change the hardware clock period `T_clk`, but it directly alters the number of instructions emitted (`IC`) and which instruction mix/scheduling is chosen (`CPI`).", "moduleCode": "S", "module": "Performance Evaluation", "topic": "Iron Law Factors", "subtopic": "Impact of Compiler Optimization on Iron Law", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-001", "question": "In a magnetic hard disk drive, the time required to wait until the desired sector rotates to come under the read/write head is known as:", "options": {"A": "Seek time", "B": "Rotational latency (Rotational delay)", "C": "Transfer time", "D": "Access time"}, "correctAnswer": "B", "explanation": "Seek time moves the head radially to the target track; **Rotational latency** is the time spent waiting for the spinning platter to bring the target sector under the read/write head.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Access Time", "subtopic": "Rotational Latency Definition", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2021", "shift": "Shift not verified", "sourceReference": "https://testbook.com/question-answer/the-time-required-to-wait-until-readwrite-head-co--611a369098dbb01d797ce187", "numericalCategory": null}, {"id": "COA-T-002", "question": "What is the Average Rotational Latency (in milliseconds) of a magnetic hard disk drive whose spindle rotates at `10,000 RPM` (Revolutions Per Minute)?", "options": {"A": "6.0 ms", "B": "3.0 ms", "C": "10.0 ms", "D": "1.5 ms"}, "correctAnswer": "B", "explanation": "Time for 1 full revolution = `60 / 10,000 s = 6 ms`. Average Rotational Latency is HALF of a full revolution: `\u00bd \u00d7 6 ms = 3.0 ms` (or `30,000 / 10,000 = 3.0 ms`).", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Access Time", "subtopic": "Average Rotational Latency Numerical", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Disk Access Time"}, {"id": "COA-T-003", "question": "A magnetic disk rotates at `6,000 RPM`, has an average seek time of `8 ms`, and has a data transfer rate of `20 MB/s` (`20 \u00d7 10\u2076 bytes/s`). Ignoring controller overhead, what is the average total time required to read a `40 KB` (`40,000-byte`) block stored contiguously on a track?", "options": {"A": "15.0 ms", "B": "13.0 ms", "C": "20.0 ms", "D": "10.0 ms"}, "correctAnswer": "A", "explanation": "Step 1: Seek Time = `8 ms`. Step 2: Avg Rotational Latency = `30,000 / 6000 = 5 ms`. Step 3: Transfer Time = `40,000 bytes / (20 \u00d7 10\u2076 bytes/s) = 0.002 s = 2 ms`. Step 4: Total Access Time = `8 + 5 + 2 = 15.0 ms`.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Access Time", "subtopic": "Complete Disk Access Time Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Disk Access Time"}, {"id": "COA-T-004", "question": "A magnetic disk pack consists of `4 platters` (with recording on both top and bottom surfaces of each platter), `2,048 tracks per surface`, `256 sectors per track`, and `512 bytes per sector`. What is the total formatted storage capacity of this disk pack in Gigabytes (`1 GB = 2\u00b3\u2070 bytes`)?", "options": {"A": "1 GB", "B": "2 GB", "C": "4 GB", "D": "512 MB"}, "correctAnswer": "B", "explanation": "Surfaces = 4 \u00d7 2 = 8 = 2\u00b3. Tracks/surface = 2048 = 2\u00b9\u00b9. Sectors/track = 256 = 2\u2078. Bytes/sector = 512 = 2\u2079. Total Bytes = 2\u00b3 \u00d7 2\u00b9\u00b9 \u00d7 2\u2078 \u00d7 2\u2079 = 2\u00b3\u00b9 bytes = 2 \u00d7 2\u00b3\u2070 bytes = 2 GB.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Geometry", "subtopic": "Disk Pack Capacity Calculation", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Disk Access Time"}, {"id": "COA-T-005", "question": "In a multi-platter hard disk drive, what does the term 'Cylinder' refer to?", "options": {"A": "The set of all tracks across all recording surfaces that are at the exact same radial distance from the spindle (accessible without moving the read/write head actuator)", "B": "A single 512-byte sector", "C": "The electric motor that spins the disk", "D": "The cache buffer on the disk PCB"}, "correctAnswer": "A", "explanation": "Because all read/write heads are attached to a single comb-like actuator arm assembly, all tracks at the same radius across all surfaces form a Cylinder and can be read sequentially with zero seek time.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Geometry", "subtopic": "Definition of a Cylinder", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-006", "question": "Which RAID level uses block-level data striping to maximize I/O performance across multiple disks, but provides ZERO data redundancy and ZERO fault tolerance?", "options": {"A": "RAID 0", "B": "RAID 1", "C": "RAID 5", "D": "RAID 6"}, "correctAnswer": "A", "explanation": "RAID 0 stripes blocks across N disks without mirroring or parity. If any single disk in a RAID 0 array fails, the entire array's data is lost.", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Fundamentals", "subtopic": "RAID 0 Fault Tolerance Trap", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-007", "question": "A storage server contains `8` identical hard drives of `4 TB` each (`32 TB` total raw capacity). What is the net usable data capacity if the 8 drives are configured as (i) RAID 1 (or RAID 10), (ii) RAID 5, and (iii) RAID 6?", "options": {"A": "(i) RAID 1/10: 16 TB, (ii) RAID 5: 28 TB, (iii) RAID 6: 24 TB", "B": "(i) RAID 1/10: 32 TB, (ii) RAID 5: 28 TB, (iii) RAID 6: 24 TB", "C": "(i) RAID 1/10: 16 TB, (ii) RAID 5: 24 TB, (iii) RAID 6: 28 TB", "D": "(i) RAID 1/10: 8 TB, (ii) RAID 5: 16 TB, (iii) RAID 6: 16 TB"}, "correctAnswer": "A", "explanation": "For `N = 8` disks of `4 TB`: (i) RAID 1/10 = `(N/2) \u00d7 4 TB = 16 TB` (50%); (ii) RAID 5 = `(N \u2212 1) \u00d7 4 TB = 7 \u00d7 4 = 28 TB` (1 disk equivalent for distributed single parity); (iii) RAID 6 = `(N \u2212 2) \u00d7 4 TB = 6 \u00d7 4 = 24 TB` (2 disks equivalent for dual parity).", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Levels", "subtopic": "RAID 1 vs RAID 5 vs RAID 6 Usable Capacity", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": "Disk Access Time"}, {"id": "COA-T-008", "question": "How does RAID 5 overcome the severe write performance bottleneck of RAID 4?", "options": {"A": "RAID 4 stores all parity blocks on a single dedicated Parity Disk (which becomes a bottleneck on every write), whereas RAID 5 distributes the parity blocks evenly across ALL disks in the array", "B": "RAID 5 eliminates parity completely", "C": "RAID 4 uses Hamming code whereas RAID 5 uses mirroring", "D": "RAID 5 requires only 1 disk"}, "correctAnswer": "A", "explanation": "Distributing parity blocks across all disks in RAID 5 allows multiple independent small writes to different stripes to execute in parallel without contending for a single parity drive.", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Levels", "subtopic": "RAID 4 vs RAID 5 Parity Bottleneck", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-009", "question": "In a RAID 5 array, when a single data block `D_old` is updated to `D_new` (a small random write), why does it incur a 'Write Penalty of 4 Disk I/O Operations'?", "options": {"A": "Because the controller must (1) Read `D_old`, (2) Read `P_old`, compute `P_new = P_old \u2295 D_old \u2295 D_new`, and then (3) Write `D_new` and (4) Write `P_new`!", "B": "Because RAID 5 writes every block to 4 mirror disks", "C": "Because RAID 5 uses 4 parity disks", "D": "Because each disk has 4 read heads"}, "correctAnswer": "A", "explanation": "Using the associative property of XOR (`P_new = P_old \u2295 D_old \u2295 D_new`), a small RAID 5 write performs 2 disk reads (`D_old`, `P_old`) and 2 disk writes (`D_new`, `P_new`) = 4 I/O operations.", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Levels", "subtopic": "RAID 5 Small-Write Penalty (4 I/Os)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-010", "question": "Match each RAID level with the MINIMUM number of physical disks required to implement it:\n1. RAID 0 / RAID 1     P. Minimum 4 disks\n2. RAID 5              Q. Minimum 2 disks\n3. RAID 6 / RAID 10    R. Minimum 3 disks", "options": {"A": "1-Q, 2-R, 3-P", "B": "1-R, 2-Q, 3-P", "C": "1-Q, 2-P, 3-R", "D": "1-P, 2-R, 3-Q"}, "correctAnswer": "A", "explanation": "RAID 0 and RAID 1 require at least 2 disks (Q); RAID 3, 4, and 5 require at least 3 disks (R); RAID 6 (N\u22122 dual parity) and RAID 10 (stripe of at least two 2-disk mirrors) require at least 4 disks (P).", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Levels", "subtopic": "Minimum Number of Disks for RAID Levels", "difficulty": "Easy", "questionType": "Match-the-Following", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-011", "question": "Why do NAND Flash Solid-State Drives (SSDs) require an internal microcontroller running a Flash Translation Layer (FTL) to perform 'Wear Leveling' and 'Garbage Collection'?", "options": {"A": "Because NAND Flash pages (e.g., 4\u201316 KB) CANNOT be overwritten in place\u2014an entire Flash Erase Block (e.g., 4\u20138 MB) must be erased before rewriting, and each Flash cell can only endure a finite number of Program-Erase (P/E) cycles!", "B": "Because SSDs have spinning magnetic platters", "C": "Because SSDs are volatile and lose data without refresh", "D": "Because SSDs use UV light to erase sectors"}, "correctAnswer": "A", "explanation": "The FTL remaps logical block addresses (`LBA`) to new physical Flash pages on every write (out-of-place write), spreads erasures evenly across all blocks (`Wear Leveling`), and reclaims stale pages via `Garbage Collection` and OS `TRIM`.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Solid-State Drives (SSD)", "subtopic": "Flash Translation Layer & Wear Leveling", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-012", "question": "A disk read/write head is currently at cylinder `50`. The queue of pending cylinder requests is `82, 170, 43, 140, 24, 16, 190`. Under the SSTF (Shortest Seek Time First) scheduling algorithm, which cylinder is serviced FIRST, and what is the total head movement (in cylinders) to serve all requests?", "options": {"A": "Cylinder 43 is serviced first; Total head movement = 208 cylinders (`50 \u2192 43 \u2192 24 \u2192 16 \u2192 82 \u2192 140 \u2192 170 \u2192 190`)", "B": "Cylinder 82 is serviced first; Total head movement = 642 cylinders", "C": "Cylinder 16 is serviced first; Total head movement = 300 cylinders", "D": "Cylinder 190 is serviced first; Total head movement = 140 cylinders"}, "correctAnswer": "A", "explanation": "From 50, the closest request is 43 (distance 7), then 24, then 16 (`50 \u2212 16 = 34` cylinders left), and then it sweeps right through `82 \u2192 140 \u2192 170 \u2192 190` (`190 \u2212 16 = 174` cylinders right). Total = `34 + 174 = 208` cylinders!", "moduleCode": "T", "module": "Storage and RAID", "topic": "Disk Scheduling", "subtopic": "SSTF vs SCAN (Elevator) vs FCFS", "difficulty": "Moderate", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-013", "question": "Which RAID level stripes data at the bit level and uses a set of extra disks storing Hamming error-correcting code (ECC) bits?", "options": {"A": "RAID 1", "B": "RAID 2", "C": "RAID 4", "D": "RAID 10"}, "correctAnswer": "B", "explanation": "RAID 2 uses bit-level striping with Hamming ECC disks.", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Levels", "subtopic": "RAID 2 Hamming Code Disks", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-014", "question": "Why can a single-layer Blu-Ray disc store `25 GB` compared to `4.7 GB` on a DVD and `700 MB` on a CD-ROM of the exact same 120 mm physical diameter?", "options": {"A": "Because Blu-Ray uses a shorter-wavelength 405 nm blue-violet laser (vs 650 nm red for DVD and 780 nm infrared for CD) and a higher numerical aperture lens, allowing much smaller and more tightly packed pits/tracks!", "B": "Because Blu-Ray discs are 10 times thicker", "C": "Because Blu-Ray uses magnetic heads", "D": "Because Blu-Ray stores data in base 16"}, "correctAnswer": "A", "explanation": "Diffraction limits spot size to `\u221d \u03bb / NA`; shorter laser wavelength (`405 nm` blue-violet) focuses to a much smaller spot, allowing higher areal pit density.", "moduleCode": "T", "module": "Storage and RAID", "topic": "Optical Storage", "subtopic": "CD, DVD, and Blu-Ray Laser Wavelengths", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-T-015", "question": "In a 4-disk RAID 5 stripe, Disk 1 holds `10110011`, Disk 2 holds `01101010`, Disk 3 (failed!) held `D\u2083`, and the Parity block on Disk 4 holds even XOR parity `P = 00010110`. What was the lost byte `D\u2083` on Disk 3?", "options": {"A": "11001111", "B": "01010101", "C": "10110011", "D": "00000000"}, "correctAnswer": "A", "explanation": "Since `P = D\u2081 \u2295 D\u2082 \u2295 D\u2083`, we recover `D\u2083 = D\u2081 \u2295 D\u2082 \u2295 P = 10110011 \u2295 01101010 \u2295 00010110 = 11011001 \u2295 00010110 = 11001111`!", "moduleCode": "T", "module": "Storage and RAID", "topic": "RAID Reconstruction", "subtopic": "XOR Parity Recovery in RAID 5", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-001", "question": "In the Illinois MESI snoopy cache coherence protocol used in multicore processors, what do the four letters M, E, S, and I stand for?", "options": {"A": "Modified, Exclusive, Shared, Invalid", "B": "Memory, Execution, Storage, Interrupt", "C": "Mapped, Erased, Shifted, Indexed", "D": "Master, External, Slave, Internal"}, "correctAnswer": "A", "explanation": "MESI stands for **M**odified (dirty, held only in this cache), **E**xclusive (clean, held only in this cache), **S**hared (clean, may be held in multiple caches), and **I**nvalid (line does not hold valid data).", "moduleCode": "U", "module": "Modern Architecture", "topic": "Cache Coherence", "subtopic": "MESI Protocol States", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "exam": "KVS PGT Computer Science", "year": "2023", "shift": "Shift not verified", "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-002", "question": "Why does the 4-state MESI protocol add the 'Exclusive (E)' state (clean, only copy) to the simpler 3-state MSI (`Modified, Shared, Invalid`) protocol?", "options": {"A": "Because if a core reads a private variable into `E` state and then writes to it next (`Read-then-Modify`), it can silently transition `E \u2192 M` inside its own cache WITHOUT broadcasting an invalidation transaction on the shared memory bus!", "B": "To double the cache block size", "C": "To disable main memory", "D": "To replace the Valid bit"}, "correctAnswer": "A", "explanation": "In a 3-state MSI protocol, a read loads the block as `S` and a subsequent write by the same thread must broadcast an invalidation on the bus even when no other core shares the block! The `E` state eliminates this bus traffic for private variables.", "moduleCode": "U", "module": "Modern Architecture", "topic": "Cache Coherence", "subtopic": "Purpose of Exclusive (E) State in MESI", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-003", "question": "How does a NUMA (Non-Uniform Memory Access) multiprocessor differ from a UMA (Uniform Memory Access) multiprocessor?", "options": {"A": "In NUMA, each processor socket has its own attached Local DRAM controller (fast access) and can also access Remote DRAM attached to other sockets over a high-speed interconnect (slower access); in UMA, all processors have identical access latency to all RAM", "B": "NUMA processors have no cache memory", "C": "UMA allows only 1 processor core", "D": "NUMA uses magnetic tape for main memory"}, "correctAnswer": "A", "explanation": "NUMA scales to many sockets by attaching local memory controllers directly to each CPU socket (`Local access < Remote access`), whereas UMA shares a centralized memory bus/switch (`equal latency`).", "moduleCode": "U", "module": "Modern Architecture", "topic": "UMA vs NUMA", "subtopic": "Non-Uniform Memory Access Architecture", "difficulty": "Moderate", "questionType": "Comparison", "sourceType": "Exam-pattern Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-004", "question": "In distributed and multi-node computer systems, what mechanisms are used to maintain data consistency across nodes that cache or replicate shared state?", "options": {"A": "Coherence / Consistency protocols (such as directory-based/snoopy invalidation, consensus, or distributed locking)", "B": "Disabling all network links", "C": "Using only 4-bit registers", "D": "Clearing the Program Counter"}, "correctAnswer": "A", "explanation": "Maintaining data consistency across nodes with local caches or replicas requires cache coherence / distributed consistency protocols.", "moduleCode": "U", "module": "Modern Architecture", "topic": "Distributed Consistency", "subtopic": "Maintaining Consistency Across Nodes", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Verified PYQ", "exam": "DSSSB TGT Computer Science", "year": "2025", "shift": "13 Sep 2025, Shift 3 (5:00 PM)", "sourceReference": "https://www.utpaper.in/question/in-distributed-systems-what-mechanism-is-used-to-maintain-consistency-across-nod-3380", "numericalCategory": null}, {"id": "COA-U-005", "question": "How does the architectural design philosophy of a Graphics Processing Unit (GPU) differ from a general-purpose Central Processing Unit (CPU)?", "options": {"A": "CPUs are Latency-oriented (few complex out-of-order cores, large caches, sophisticated branch predictors for serial threads), whereas GPUs are Throughput-oriented (thousands of simple SIMD/SIMT ALUs optimized for massive data-parallel workloads)", "B": "GPUs have only 1 ALU and huge branch predictors", "C": "CPUs cannot execute conditional branches", "D": "GPUs cannot perform floating-point multiplication"}, "correctAnswer": "A", "explanation": "CPUs dedicate silicon area to large caches and control/branch speculation to minimize single-thread latency; GPUs dedicate silicon area to thousands of parallel arithmetic lanes to maximize aggregate data throughput.", "moduleCode": "U", "module": "Modern Architecture", "topic": "GPU Architecture", "subtopic": "CPU vs GPU Design Philosophy", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-006", "question": "What is the goal of 'Heterogeneous Multicore Architecture' such as ARM `big.LITTLE` or Intel Hybrid (`P-Cores + E-Cores`)?", "options": {"A": "To combine high-performance wide out-of-order cores (`big / P-Cores`) for heavy foreground tasks with energy-efficient compact cores (`LITTLE / E-Cores`) for background threads on the same die, optimizing Performance per Watt", "B": "To mix vacuum tubes and transistors on the same chip", "C": "To run Windows on one core and DOS on another without an OS", "D": "To eliminate cache memory"}, "correctAnswer": "A", "explanation": "Heterogeneous single-ISA cores share the same instruction set so the OS scheduler can migrate threads dynamically between high-speed P-cores and ultra-low-power E-cores.", "moduleCode": "U", "module": "Modern Architecture", "topic": "Heterogeneous Computing", "subtopic": "ARM big.LITTLE / Hybrid Cores", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-007", "question": "What is a 'System-on-Chip (SoC)' (such as Apple M-series or Qualcomm Snapdragon)?", "options": {"A": "A single integrated circuit die that integrates CPU cores, GPU, Neural Processing Unit (NPU), memory controllers, I/O controllers, and multimedia DSPs onto one chip", "B": "A motherboard with 10 separate socketed CPU chips", "C": "A standalone hard disk controller", "D": "A power supply unit"}, "correctAnswer": "A", "explanation": "An SoC integrates virtually the entire computer system onto a single silicon die (or unified package), minimizing board area, power consumption, and off-chip latency.", "moduleCode": "U", "module": "Modern Architecture", "topic": "System-on-Chip (SoC)", "subtopic": "SoC Integration", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-008", "question": "In hardware-assisted processor virtualization (Intel VT-x / AMD-V), what is the role of 'Extended Page Tables (EPT)' / 'Nested Page Tables'?", "options": {"A": "It allows the MMU hardware to automatically translate `Guest Virtual Address \u2192 Guest Physical Address \u2192 Host Physical Address` in hardware without trapping into the Hypervisor (VMM) on every guest page table walk or TLB miss!", "B": "It disables paging in the Guest OS", "C": "It forces all virtual machines to share a single 64 KB segment", "D": "It replaces the ALU"}, "correctAnswer": "A", "explanation": "Two-dimensional hardware page walking (`EPT` / `NPT`) eliminates costly hypervisor VM-Exits for shadow page table synchronization.", "moduleCode": "U", "module": "Modern Architecture", "topic": "Hardware Virtualization", "subtopic": "Extended / Nested Page Tables (EPT / RVI)", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-009", "question": "Why do AI Hardware Accelerators (such as Google's Tensor Processing Unit `TPU`) use a 2D 'Systolic Array' of Multiply-Accumulate (`MAC`) units for neural network matrix multiplication?", "options": {"A": "Because weights and activations flow rhythmically from neighbor PE to neighbor PE across the 2D grid without reading/writing intermediate partial sums back to the Register File or SRAM on every operation!", "B": "Because systolic arrays only add 1-bit integers", "C": "Because neural networks require magnetic disks", "D": "To increase cache miss rates"}, "correctAnswer": "A", "explanation": "A Systolic Array reuses input operands across adjacent Processing Elements (`PEs`) in a rhythmic wavefront, achieving massive `TOPS/Watt` by eliminating register-file read/write energy.", "moduleCode": "U", "module": "Modern Architecture", "topic": "AI Accelerators", "subtopic": "Systolic Arrays in TPUs / NPUs", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "exam": null, "year": null, "shift": null, "sourceReference": null, "numericalCategory": null}, {"id": "COA-U-010", "question": "In Quantum Computing fundamentals, while `n` classical bits exist in exactly one of `2^n` binary states at any instan
