ng malware that spreads AUTOMATICALLY across networks exploiting vulnerabilities without needing a host file or human click), Trojan Horse (disguises itself as useful legitimate software; does NOT self-replicate; opens backdoors).", "Other Malware: Ransomware (encrypts victim's files and demands cryptocurrency ransom, e.g., WannaCry, Petya, LockBit), Spyware & Keylogger (secretly monitors user activity/keystrokes to steal credentials), Rootkit (hides deep in OS kernel/boot sector to conceal malware from antivirus), Logic Bomb (triggers malicious payload when a specific date/event occurs).", "Phishing vs Pharming: Phishing uses fraudulent emails/messages impersonating banks/services with fake links to trick users into entering credentials. Pharming redirects users from a legitimate URL to a spoofed website WITHOUT requiring a deceptive link click—by poisoning the DNS cache or modifying the local `hosts` file."], "sections": [{"heading": "1. The CIA Triad, Authentication & Malware Classification", "content": "Cybersecurity questions in DSSSB, KVS, and NVS frequently test the behavioral differences between malware types:", "bullets": ["Virus (Vital Information Resources Under Siege): Requires a host program/document (e.g., macro virus in `.docm`/`.xlsm`, boot-sector virus, polymorphic virus) and requires human execution to activate and infect other files.", "Worm (Write Once, Read Many / Self-Replicating Network Malware): Does NOT need a host program and does NOT require user activation; it scans networks for open ports/vulnerabilities and replicates autonomously, consuming network bandwidth (e.g., Morris Worm 1988, ILOVEYOU, Stuxnet, Conficker).", "Trojan Horse: Named after the Greek wooden horse; appears to be a free game or utility to trick the user into installing it. It NEVER self-replicates, but installs backdoors, RATs (Remote Access Trojans), or keyloggers.", "Ransomware, Spyware, Adware & Rootkits: Ransomware locks/encrypts user files (attacks Availability/Confidentiality); Keyloggers record every keystroke to capture passwords/credit cards; Rootkits subvert the OS kernel or BIOS to remain invisible."], "examTrap": "Exam Trap: Question asks 'Which malware replicates itself automatically across a network without needing a host program?' -> Worm. 'Which malware disguises itself as legitimate software and does NOT self-replicate?' -> Trojan Horse."}, {"heading": "2. Cyber Attacks, Firewalls, Encryption & Cyber Hygiene", "content": "Understanding network-level attacks and cryptographic defenses ensures accurate exam responses:", "bullets": ["Phishing, Vishing, Smishing & Pharming: Phishing = deceptive email; Vishing = voice/phone call phishing; Smishing = SMS phishing; Spear-Phishing = targeted phishing at a specific individual/organization; Whaling = spear-phishing targeting C-level executives (CEO/CFO). Pharming corrupts DNS resolution (`hosts` file or DNS server cache poisoning) so typing the real bank URL still lands on an attacker's server.", "Firewall: Can be Hardware, Software, or both. Monitors and filters incoming and outgoing network traffic based on predefined security rules (Packet filtering, Stateful inspection, Proxy/Application gateway). Note: A firewall blocks unauthorized network access but does NOT remove viruses already on a USB drive.", "Encryption & Decryption: Plaintext -> (Encryption via Cipher + Key) -> Ciphertext -> (Decryption) -> Plaintext. Symmetric Encryption uses the SAME secret key for encryption and decryption (AES, DES, 3DES, Blowfish - fast). Asymmetric Encryption uses a pair of keys: PUBLIC key to encrypt and PRIVATE key to decrypt (RSA, ECC, Diffie-Hellman)."], "examTrap": "Exam Trap: Pharming does NOT require the victim to click a malicious email link—it hijacks DNS or the local `hosts` file."}]}, {"code": "O", "id": "MOD-O", "title": "Module O: MS Office Introduction", "category": "MS Office Suite", "targetQuestions": 15, "subtopics": ["Evolution of Microsoft Office Versions: 2003, 2007, 2010, 2013, 2016, 2019, 2021, 2024 & Microsoft 365", "Perpetual Desktop Office vs Subscription Microsoft 365", "Core Office Suite Applications: Word, Excel, PowerPoint, Access, Outlook, OneNote, Publisher, Teams, OneDrive", "The Fluent Ribbon UI Architecture: Title Bar, QAT, Ribbon Tabs, Groups, Dialog Box Launchers, Backstage View, Status Bar", "OpenXML File Formats Transition (2003 Binary vs 2007+ XML Extensions) & Compatibility Mode"], "onePageRevision": ["Major Version Milestones: Office 2003 (last version with traditional drop-down Menus & Toolbars and binary `.doc`, `.xls`, `.ppt` default extensions); Office 2007 (introduced the 'Fluent User Interface' RIBBON, the round 'Office Button' in top-left corner, Quick Access Toolbar, and OpenXML `.docx`, `.xlsx`, `.pptx`, `.accdb` extensions); Office 2010 (replaced the round Office Button with the 'File' tab opening Backstage View); Office 2013 (introduced Cloud OneDrive integration & Flash Fill in Excel); Office 2016/2019/2021/M365 (introduced real-time co-authoring, 'Tell Me What You Want to Do' `Alt+Q`, XLOOKUP, Dynamic Arrays).", "Ribbon Hierarchy: Ribbon -> Tabs (e.g., Home, Insert, Layout) -> Groups (e.g., Clipboard, Font, Paragraph) -> Commands (Buttons/Dropdowns) + Dialog Box Launcher (tiny diagonal arrow icon in the bottom-right corner of a Group). Shortcut to Show/Hide (Collapse/Pin) the Ribbon: `Ctrl + F1`.", "Quick Access Toolbar (QAT): Located by default on the left of the Title Bar; contains **Save, Undo, Redo** by default (regardless of which Ribbon tab is active).", "Contextual Tabs: Hidden tabs that appear dynamically ONLY when a specific object (Table, Picture, Chart, SmartArt, Header/Footer) is selected.", "Compatibility Mode: Appears in the Title Bar when opening an older binary Office 97–2003 file (`.doc`, `.xls`, `.ppt`) in Office 2007 or later; disables newer features until converted via File -> Info -> Convert."], "sections": [{"heading": "1. Microsoft Office Versions & Version-Specific Transitions", "content": "DSSSB and SSC/KVS papers frequently specify an Office version (2007, 2010, 2016, 2019, 2021, or Microsoft 365) in question stems:", "bullets": ["Office 97–2003 Era: Used classic Menu Bar (`File, Edit, View, Insert, Format, Tools, Table, Window, Help`) and binary compound file formats (`.doc`, `.xls`, `.ppt`, `.mdb`). Excel 2003 worksheet grid had only 65,536 rows and 256 columns (Column IV).", "Office 2007 Revolution: Introduced the Ribbon UI (Tabs -> Groups -> Commands), round 'Office Button', Live Preview, SmartArt, Themes, and XML-based compressed file formats (`.docx`, `.xlsx`, `.pptx`, `.accdb`). Expanded Excel grid to 1,048,576 rows and 16,384 columns (Column XFD).", "Office 2010 to 2021 / Microsoft 365: Office 2010 replaced the round Office Button with the `File` tab (Backstage View) and added Sparklines & Slicers in Excel. Office 2013 added Flash Fill (`Ctrl+E`). Office 2019/2021/M365 added `IFS`, `CONCAT`, `TEXTJOIN`, `XLOOKUP`, `FILTER`, `UNIQUE`, `SORT`, and real-time cloud co-authoring via OneDrive/SharePoint.", "Perpetual Office (2019/2021) vs Microsoft 365: Office 2021 is a one-time purchase (perpetual license) for 1 PC/Mac with no feature upgrades, whereas Microsoft 365 (formerly Office 365) is a cloud subscription offering continuous feature updates, 1 TB OneDrive storage, and multi-device installation."], "examTrap": "Exam Trap: The round 'Office Button' existed ONLY in MS Office 2007! Starting from MS Office 2010 onward, it was replaced by the 'File' tab (Backstage View)."}, {"heading": "2. Office Interface Components & File Extensions", "content": "Every Office desktop app shares a common structural anatomy:", "bullets": ["Title Bar: Displays the active filename, application name, Quick Access Toolbar (Save, Undo, Redo), Search/Tell Me bar (`Alt+Q`), and Window control buttons (Minimize, Maximize/Restore, Close).", "Ribbon Tabs, Groups & Dialog Box Launchers: Pressing `Alt` reveals KeyTip badges over every tab and QAT icon. Pressing `Ctrl + F1` toggles collapsing/expanding the Ribbon.", "Status Bar (Bottom): Displays page/slide/cell count, proofing status, View switchers (Read Mode / Print Layout / Web Layout), and the Zoom slider (Word: 10% to 500%; Excel: 10% to 400%; PowerPoint: 10% to 400%).", "OpenXML Extensions: Notice the 4th letter in 2007+ formats: `x` = XML (no macros, e.g., `.docx`, `.xlsx`, `.pptx`), `m` = Macro-enabled (VBA macros allowed, e.g., `.docm`, `.xlsm`, `.pptm`), `t` = Template (e.g., `.dotx`, `.xltx`, `.potx`), `s` = PowerPoint Show (`.ppsx` opens directly in Slide Show)."], "examTrap": "Exam Trap: Memorize Maximum Zoom limits! MS Word = 10% to 500% (Default 100%); MS Excel = 10% to 400% (Default 100%); MS PowerPoint slide canvas = 10% to 400%."}]}, {"code": "P", "id": "MOD-P", "title": "Module P: MS Word – Word Processing", "category": "MS Office Suite", "targetQuestions": 40, "subtopics": ["Word Interface, Views (Read Mode, Print Layout, Web Layout, Outline, Draft) & Zoom (10%–500%)", "Font Formatting: Size Limits (1 to 1638 pt, Dropdown 8 to 72 pt), Effects, Change Case (5 cases), Format Painter", "Paragraph Formatting: Alignments (Ctrl+L/E/R/J), Indents (First-Line, Hanging Ctrl+T, Left Ctrl+M), Line Spacing, Drop Cap", "Page Layout: Margins (Gutter), Orientation, Columns, Page Breaks (Ctrl+Enter) vs Section Breaks (Next Page, Continuous, Even, Odd)", "Insert Tab: Tables, Pictures, Shapes, SmartArt, WordArt, Header/Footer, Page Numbers, Hyperlinks (Ctrl+K), Bookmarks, Cross-References, Symbols & Equations", "References & Review: Table of Contents, Footnotes (Ctrl+Alt+F) vs Endnotes (Ctrl+Alt+D), Citations, Spell Check (F7), Thesaurus (Shift+F7), Word Count (Ctrl+Shift+G), Track Changes (Ctrl+Shift+E)", "Mail Merge Complete 6-Step Workflow (Main Document, Data Source, Merge Fields, Preview, Finish)", "Word File Formats (.doc, .docx, .dotx, .docm, .rtf, .txt, .pdf, .odt)"], "onePageRevision": ["Defaults & Limits in MS Word (2007–M365): Default filename = `Document1.docx`; Default View = Print Layout; Default Font = Calibri 11 pt (Aptos 11 pt in latest M365; Times New Roman 12 pt in Word 2003); Font Size dropdown range = **8 pt to 72 pt**; Manual Font Size entry range = **1 pt to 1638 pt**; Zoom range = **10% to 500%**; Default Margins (2007+) = 1 inch (2.54 cm) on all 4 sides; Default Line Spacing (2007+) = 1.15 (or 1.08 in 2013+) with 8 pt/10 pt space after paragraph.", "Font & Case Shortcuts: Bold (`Ctrl+B`), Italic (`Ctrl+I`), Underline (`Ctrl+U`), Double Underline (`Ctrl+Shift+D`), Word-only Underline (`Ctrl+Shift+W`), Subscript (`Ctrl+=`), Superscript (`Ctrl+Shift++`), Increase/Decrease font by 1 pt (`Ctrl+]` / `Ctrl+[`), Increase/Decrease to next dropdown size (`Ctrl+Shift+>` / `Ctrl+Shift+<`), Change Case cycle (`Shift+F3` cycles UPPERCASE -> lowercase -> Title Case; dialog has 5 options: Sentence case, lowercase, UPPERCASE, Capitalize Each Word, tOGGLE cASE), Clear All Formatting (`Ctrl+Spacebar` or Home -> Font -> Clear All Formatting).", "Paragraph & Indentation: Left (`Ctrl+L`), Center (`Ctrl+E`), Right (`Ctrl+R`), Justify (`Ctrl+J`). Line spacing: Single (`Ctrl+1`), Double (`Ctrl+2`), 1.5 lines (`Ctrl+5`). Hanging Indent (`Ctrl+T` / `Ctrl+Shift+T` to reduce), Left Paragraph Indent (`Ctrl+M` / `Ctrl+Shift+M` to reduce). **Drop Cap** (Insert -> Text group): Default lines to drop = **3**, Maximum lines to drop = **10**, positions = None, Dropped, In Margin.", "Page Setup & Breaks: Gutter Margin = extra space added to the side (Left) or Top margin for bookbinding. Page Break = `Ctrl+Enter`; Column Break = `Ctrl+Shift+Enter`; Line Break (without new paragraph) = `Shift+Enter`. Section Breaks (Layout -> Breaks): **Next Page, Continuous, Even Page, Odd Page** (allows different orientation/margins/headers within the SAME document).", "References & Review: Footnote (bottom of same page: `Ctrl+Alt+F`) vs Endnote (end of document/section: `Ctrl+Alt+D`). Spelling & Grammar (`F7`), Thesaurus (`Shift+F7`), Word Count (`Ctrl+Shift+G`), Track Changes toggle (`Ctrl+Shift+E`), Insert Comment (`Ctrl+Alt+M`).", "Mail Merge (Mailings Tab): Combines a **Main Document** (form letter/email/labels/envelopes) with a **Data Source** (Excel sheet, Access table, Outlook contacts) using **Merge Fields** (`<<Name>>`) to produce personalized documents."], "sections": [{"heading": "1. Word Interface, Document Views, Font & Paragraph Formatting", "content": "MS Word questions in DSSSB TGT CS heavily test exact numeric boundaries, Ribbon group locations, and keyboard shortcuts:", "bullets": ["Five Document Views (View Tab): (1) Read Mode (full-screen book columns optimized for reading); (2) Print Layout (DEFAULT view showing exact margins, headers, footers, and page breaks as printed); (3) Web Layout (shows how document looks as a fluid browser webpage without page breaks); (4) Outline View (displays document structure as collapsible heading levels with Outlining tools); (5) Draft View (hides headers, footers, and graphics for fast text editing).", "Font Group (Home Tab): Font size dropdown lists 8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72 pt. Manually typed font size can be from 1 pt to 1638 pt (in 0.5 pt increments). Format Painter (`Ctrl+Shift+C` copy format, `Ctrl+Shift+V` paste format): single-click applies formatting once; DOUBLE-CLICK locks Format Painter to apply to multiple places until `Esc` is pressed.", "Paragraph Group (Home Tab): Four alignments (`Ctrl+L`, `Ctrl+E`, `Ctrl+R`, `Ctrl+J`). Indents on the horizontal ruler: First Line Indent (top triangle marker—indents only the 1st line of paragraph), Hanging Indent (`Ctrl+T`, bottom-left triangle—keeps 1st line flush left and indents all subsequent lines, used in bibliographies), Left Indent (`Ctrl+M`, bottom square box—moves entire paragraph).", "Drop Cap (Insert Tab -> Text Group): Enlarges the first capital letter of a paragraph. Positions: None, Dropped (within paragraph text), In Margin (inside left margin). Default drop = 3 lines; Range = 1 to 10 lines."], "examTrap": "Exam Trap: Dropdown font size range is 8 to 72 pt, while manual font size range is 1 to 1638 pt. For Drop Cap, Default = 3 lines and Max = 10 lines."}, {"heading": "2. Page Layout, Tables, References, Reviewing & Mail Merge", "content": "Mastering Ribbon tab placements (Home, Insert, Design, Layout, References, Mailings, Review, View) is essential for practical MS Word questions:", "bullets": ["Ribbon Tab Map: `Home` (Clipboard, Font, Paragraph, Styles, Editing); `Insert` (Pages [Cover Page, Blank Page, Page Break], Tables, Illustrations [Pictures, Shapes, Icons, 3D Models, SmartArt, Chart, Screenshot], Links [Link/Hyperlink, Bookmark, Cross-reference], Comments, Header & Footer, Text [Text Box, Quick Parts, WordArt, Drop Cap, Signature Line, Date & Time, Object], Symbols [Equation `Alt+=`, Symbol]); `Design` (Document Formatting/Themes, Page Background [Watermark, Page Color, Page Borders]); `Layout / Page Layout` (Page Setup [Margins, Orientation, Size, Columns, Breaks, Line Numbers, Hyphenation], Paragraph Indents/Spacing, Arrange); `References` (Table of Contents, Footnotes, Citations & Bibliography, Captions, Index, Table of Authorities); `Mailings` (Create [Envelopes, Labels], Start Mail Merge, Write & Insert Fields, Preview Results, Finish); `Review` (Proofing [Spelling & Grammar F7, Thesaurus Shift+F7, Word Count Ctrl+Shift+G], Accessibility, Language, Comments, Tracking [Track Changes Ctrl+Shift+E], Changes, Compare, Protect).", "Tables in MS Word: Minimum table size = 1 row x 1 column. Maximum columns in a Word table = 63 columns; Maximum rows = 32,767 rows. Pressing `Tab` in the very last cell (bottom-right) of a Word table automatically inserts a NEW ROW at the bottom.", "Section Breaks vs Page Breaks: A Page Break (`Ctrl+Enter`) simply pushes text to the next page while keeping the same margins, orientation, and headers. A Section Break (Next Page, Continuous, Even Page, Odd Page) divides the document into independent formatting zones—essential when making ONLY ONE page Landscape inside a Portrait document, or changing from 1-column to 2-column layout mid-page (`Continuous` section break).", "Mail Merge 6-Step Wizard: Step 1: Select Document Type (Letters, E-mail messages, Envelopes, Labels, Directory) -> Step 2: Select Starting Document -> Step 3: Select Recipients (Use existing Excel/Access/CSV list, Outlook Contacts, or Type a new list) -> Step 4: Write your letter & Insert Merge Fields (`<<AddressBlock>>`, `<<GreetingLine>>`) -> Step 5: Preview your letters -> Step 6: Complete the merge (Print or Edit individual letters)."], "examTrap": "Exam Trap: Watermark, Page Color, and Page Borders were under 'Page Layout' in Word 2007/2010, but moved to the 'Design' tab (Page Background group) from Word 2013/2016/2019/2021/M365 onward!"}]}, {"code": "Q", "id": "MOD-Q", "title": "Module Q: MS Excel – Spreadsheet Application", "category": "MS Office Suite", "targetQuestions": 65, "subtopics": ["Workbook, Worksheet, Grid Dimensions (1,048,576 Rows x 16,384 Columns XFD), Name Box & Formula Bar", "Data Types & Default Cell Alignment (Text=Left, Numbers/Dates/Time=Right, Booleans/Errors=Center)", "Formula Syntax, Operators, Precedence Order & Cell References (Relative A1, Absolute $A$1, Mixed $A1 / A$1, Cross-Sheet Sheet1!A1)", "Arithmetic & Statistical Functions: SUM, AVERAGE, MIN, MAX, COUNT, COUNTA, COUNTBLANK, ROUND, ROUNDUP, ROUNDDOWN, INT, MOD, ABS, POWER, SQRT", "Logical Functions: IF, IFS, AND, OR, NOT, IFERROR, IFNA", "Text Functions: LEFT, RIGHT, MID, LEN, TRIM, UPPER, LOWER, PROPER, CONCAT, CONCATENATE, TEXTJOIN, FIND, SEARCH, SUBSTITUTE, REPLACE, EXACT", "Date & Time Functions: TODAY, NOW, DATE, DAY, MONTH, YEAR, HOUR, MINUTE, SECOND, DATEDIF, EOMONTH, NETWORKDAYS", "Lookup, Reference & Dynamic Array Functions: VLOOKUP, HLOOKUP, XLOOKUP, INDEX, MATCH, CHOOSE, OFFSET, INDIRECT, FILTER, SORT, UNIQUE, SEQUENCE", "Data Tools: Sort, Filter, Data Validation, Text to Columns, Flash Fill (Ctrl+E), Remove Duplicates, Subtotal, Consolidate, What-If Analysis (Scenario Manager, Goal Seek, Data Table), PivotTable & Slicers", "Charts, Protection, Error Values (#DIV/0!, #VALUE!, #REF!, #NAME?, #NUM!, #N/A, #NULL!, #####) & File Formats"], "onePageRevision": ["Excel Grid & Defaults (2007–M365): Default filename = `Book1.xlsx`; Default sheets = 1 (`Sheet1` in 2013+; was 3 sheets in 2007/2010); Rows = **1,048,576** (`1` to `1048576`); Columns = **16,384** (`A` to `XFD`); First cell = `A1`, Last cell = `XFD1048576`; Zoom = **10% to 400%** (Default 100%); Max characters in a single cell = **32,767 characters**.", "Default Cell Alignment (Crucial Exam Rule): **Text / Alphanumeric** -> Left-aligned; **Numbers, Dates, Times** -> Right-aligned; **Logical (TRUE/FALSE) & Error values** -> Center-aligned (`1` = TRUE, `0` = FALSE in numeric contexts).", "Operator Precedence (Highest to Lowest): `:` (Range) -> ` ` (Space/Intersection) -> `,` (Union) -> `-` (Unary negation) -> `%` (Percent) -> `^` (Exponentiation) -> `*` and `/` (Multiplication/Division, left-to-right) -> `+` and `-` (Addition/Subtraction) -> `&` (Text Concatenation) -> `=`, `<`, `>`, `<=`, `>=`, `<>` (Comparison).", "Cell References (Toggle key = **F4** while editing formula): `A1` = Relative (both column & row change when copied); `$A$1` = Absolute (neither changes when copied); `$A1` = Mixed (Column A locked, row changes); `A$1` = Mixed (Column changes, Row 1 locked). Cross-sheet reference: `Sheet2!B5` or `'Sales Data'!B5`.", "Function Traps: `COUNT` counts ONLY numeric cells (numbers/dates); `COUNTA` counts all non-empty cells (numbers, text, logicals, errors); `COUNTBLANK` counts empty cells. `ROUND(125.678, 1)` = `125.7`; `ROUND(125.678, -1)` = `130` (rounds to nearest 10 left of decimal!); `ROUND(125.678, -2)` = `100`. `INT(-4.2)` = `-5` (rounds DOWN toward negative infinity), whereas `TRUNC(-4.2)` = `-4`. `MOD(n, d) = n - d*INT(n/d)` -> sign of `MOD` always matches the **divisor `d`**!", "FIND vs SEARCH: `FIND` is **case-sensitive** (no wildcards), `SEARCH` is **case-insensitive** (supports `?` and `*` wildcards). `SUBSTITUTE` replaces matching text string, `REPLACE` replaces by start character position and length.", "Excel Error Values: `#####` (Column too narrow or negative date/time — NOT a formula error!), `#DIV/0!` (Division by zero or empty cell), `#VALUE!` (Wrong argument data type, e.g., `=\"abc\"+5`), `#NAME?` (Misspelled function/range name or unquoted text, e.g., `=SUMA(A1:A5)`), `#REF!` (Invalid/deleted cell reference), `#N/A` (Lookup value not found in VLOOKUP/MATCH), `#NUM!` (Invalid numeric calculation, e.g., `=SQRT(-9)`), `#NULL!` (Invalid intersection of two ranges that do not intersect, using space operator e.g., `=SUM(A1:A5 B1:B5)`)."], "sections": [{"heading": "1. Excel Grid Architecture, Data Entry & Reference Types", "content": "MS Excel is the single highest-weightage MS Office module (65 target MCQs). Every detail of cell addressing, operator precedence, and function edge cases is tested:", "bullets": ["Worksheet & Cell Mechanics: Intersection of a Column (lettered A..Z, AA..AZ, ..., XFD) and a Row (numbered 1..1,048,576) is a Cell. The active cell has a thick dark border with the Fill Handle (small square in bottom-right corner). The Name Box (left of Formula Bar) displays the active cell address (e.g., `B4`) or named range, while the Formula Bar (`fx`) displays the underlying formula rather than the displayed value.", "Entering Special Data & Editing: Every formula MUST begin with an equal sign (`=`). Typing an apostrophe (`'`) before a number or formula (e.g., `'00123` or `'=SUM(A1:A5)`) forces Excel to store it as plain Left-aligned Text. Shortcuts: Edit active cell = `F2`; Insert new line inside same cell (Wrap Text) = `Alt + Enter`; Insert current Date = `Ctrl + ;`; Insert current Time = `Ctrl + Shift + :`; Fill Down = `Ctrl + D`; Fill Right = `Ctrl + R`; Flash Fill = `Ctrl + E`; AutoSum = `Alt + =`.", "Relative, Absolute & Mixed References (`F4` Cycle): Pressing `F4` while the cursor is on `A1` inside the Formula Bar cycles: `A1` -> `$A$1` -> `A$1` -> `$A1` -> `A1`. If cell `C2` contains `=A$1+$B2` and is copied to `D5` (+1 col right, +3 rows down), `A$1` becomes `B$1` (column shifts A->B, row 1 stays locked) and `$B2` becomes `$B5` (column B stays locked, row shifts 2->5), giving `=B$1+$B5`."], "examTrap": "Exam Trap: In Excel, there is NO function named `=AVG()`! The function is spelled out in full as `=AVERAGE()`. Writing `=AVG(A1:A6)` produces the `#NAME?` error (Verified DSSSB TGT CS 2017 PYQ)!"}, {"heading": "2. Deep Dive: Arithmetic, Logical, Text, Date & Lookup Functions", "content": "DSSSB and KVS routinely ask for exact numeric or string outputs of nested Excel formulas:", "bullets": ["COUNT Family Example: Suppose `A1:A5` contains `10`, `\"Hello\"`, `TRUE`, `\"\"` (empty), and `0`. Then: `=COUNT(A1:A5)` -> `2` (counts only `10` and `0`); `=COUNTA(A1:A5)` -> `4` (counts all 4 non-empty cells); `=COUNTBLANK(A1:A5)` -> `1`; `=AVERAGE(A1:A5)` -> `(10+0)/2 = 5` (ignores text, booleans, and blanks!). Note: `AVERAGEA` includes text as 0 and TRUE as 1.", "ROUND, INT & MOD Edge Cases: `ROUND(number, num_digits)`: if `num_digits > 0`, rounds to decimal places; if `num_digits = 0`, rounds to nearest integer; if `num_digits < 0`, rounds to the LEFT of the decimal point (`=ROUND(456.78, -2)` -> `500`, `=ROUND(446.78, -2)` -> `400`). `INT(-8.3)` returns `-9` (largest integer <= -8.3), whereas `ROUNDDOWN(-8.3, 0)` returns `-8` (rounds toward zero). `MOD(-7, 3)`: since `-7 = 3 * (-3) + 2`, `=MOD(-7, 3)` returns `2`.", "Text Functions (1-Indexed!): Excel string positions start at 1 (including spaces!). For `\"DSSSB EXAM\"`: `=LEN(\"DSSSB EXAM\")` -> `10`; `=LEFT(\"DSSSB EXAM\", 5)` -> `\"DSSSB\"`; `=RIGHT(\"DSSSB EXAM\", 4)` -> `\"EXAM\"`; `=MID(\"DSSSB EXAM\", 7, 2)` -> `\"EX\"`; `=PROPER(\"ms office suite\")` -> `\"Ms Office Suite\"`; `=TRIM(\"  Hello   World  \")` -> `\"Hello World\"` (removes leading/trailing spaces and collapses multiple internal spaces to a single space).", "Date Storage & Functions: Excel stores dates as sequential serial integers starting with `1 = January 1, 1900`, and times as decimal fractions of a 24-hour day (`0.5 = 12:00 PM Noon`). `=TODAY()` returns current date (no arguments); `=NOW()` returns current date and time; `=EOMONTH(start_date, months)` returns the last day of the month.", "Lookup Functions: `=VLOOKUP(lookup_value, table_array, col_index_num, [range_lookup])` searches vertically in the FIRST (leftmost) column of `table_array` (`FALSE` or `0` = exact match; `TRUE` or `1` = approximate match on sorted data, default is TRUE!). Limitation: `VLOOKUP` cannot look to the left. `=INDEX(array, row_num, [col_num])` combined with `=MATCH(lookup_value, lookup_array, 0)` or `=XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found])` (Excel 2021/M365) can look in any direction (left, right, up, down) and defaults to exact match!"], "examTrap": "Exam Trap: In `VLOOKUP`, if the 4th argument `[range_lookup]` is omitted, it defaults to `TRUE` (Approximate Match), NOT `FALSE`! In `XLOOKUP` (Excel 2021/M365), the default is Exact Match (`0`)."}, {"heading": "3. Data Analysis Tools, What-If Analysis, PivotTables & Errors", "content": "Excel's Data tab houses powerful analytical tools tested in scenario-based MCQs:", "bullets": ["What-If Analysis (Data Tab -> Forecast Group): Contains 3 tools: (1) Scenario Manager (saves and compares multiple sets of input values, up to 32 changing cells per scenario); (2) Goal Seek (works backward from a desired formula result to find the required single input cell value); (3) Data Table (shows how changing 1 or 2 variables affects formula outcomes across a table). Note: Solver is an Excel Add-in capable of multi-variable optimization with constraints.", "PivotTable & Slicers (Insert Tab): Summarizes, groups, and cross-tabulates large flat tables dynamically via four drop zones: Filters, Columns, Rows, and Values. Slicers (introduced in Excel 2010) provide visual push-button filtering for PivotTables and Excel Tables.", "Excel Reference Operators (3 Types): (1) Colon `:` = Range operator (`A1:A10` includes all cells between A1 and A10); (2) Comma `,` = Union operator (`SUM(A1:A5, C1:C5)` combines two ranges); (3) Space ` ` = Intersection operator (`A1:C5 B2:D6` evaluates only to the overlapping cells `B2:C5`; if they don't overlap, Excel throws `#NULL!`)."], "examTrap": "Exam Trap: The Space operator in an Excel formula is the INTERSECTION operator. If two ranges separated by a space do not overlap (e.g., `=A1:A5 B1:B5`), Excel returns the `#NULL!` error."}]}, {"code": "R", "id": "MOD-R", "title": "Module R: MS PowerPoint – Presentation Software", "category": "MS Office Suite", "targetQuestions": 35, "subtopics": ["PowerPoint Interface, Slide Views (Normal, Outline, Slide Sorter, Notes Page, Reading, Master Views) & Zoom (10%–400%)", "Slides, Placeholders, Slide Layouts vs Slide Master (View Tab)", "Themes, Variants, Slide Size (16:9 Widescreen vs 4:3 Standard) & Background Formatting", "Inserting Objects: Tables, Charts, SmartArt, Shapes, Icons, Audio, Video, Screen Recording, Hyperlinks & Action Buttons", "Slide Transitions (Between Slides) vs Animations (On Objects: Entrance, Emphasis, Exit, Motion Paths)", "Slide Show Delivery: F5 vs Shift+F5, Presenter View, Rehearse Timings, Custom Slide Show, Pen/Laser Shortcuts (B, W, E, Ctrl+P, Ctrl+L)", "Printing Handouts (1, 2, 3, 4, 6, 9 slides per page) & PowerPoint File Formats (.pptx, .ppsx, .potx, .pptm)"], "onePageRevision": ["PowerPoint Defaults (2013–M365): Default filename = `Presentation1.pptx`; Default View = **Normal View**; Default Slide Orientation = **Landscape** (whereas Notes, Handouts, and Outlines default to Portrait!); Default Aspect Ratio = **16:9 Widescreen** (was 4:3 Standard in PowerPoint 2003/2007/2010); Default 1st slide layout = **Title Slide**; Zoom range on slide canvas = **10% to 400%** (Slide Sorter reaches 20%–200%).", "Critical Shortcut Trap: Insert a **New Slide** = **`Ctrl + M`**, whereas Create a **New Presentation** = **`Ctrl + N`**! Duplicate selected slide = `Ctrl + D`.", "PowerPoint Views (View Tab): **Normal View** (3 panes: Thumbnail pane, Slide canvas, Notes pane), **Outline View** (displays only text headings/bullets of slides for rapid content editing), **Slide Sorter View** (displays miniature thumbnails of all slides in a grid—best for reordering slides, deleting slides, and viewing transition timings globally), **Notes Page View** (shows speaker notes below the slide as printed), **Reading View**, and **3 Master Views: Slide Master, Handout Master, Notes Master**.", "Slide Transition vs Animation: **Transition** is the visual visual/motion effect that occurs when moving from **one slide to the next slide** during a show (applied to whole slides). **Animation** is the visual/motion effect applied to **individual objects ON a slide** (text, shapes, pictures, charts). Four categories of Animations: **1. Entrance (Green stars), 2. Emphasis (Yellow stars), 3. Exit (Red stars), 4. Motion Paths (Lines/curves)**.", "Slide Show Shortcuts: Start from Beginning = **`F5`**; Start from Current Slide = **`Shift + F5`**; End Slide Show = **`Esc`**; Black/Unblack screen during show = **`B` or `.` (Period)**; White/Unwhite screen = **`W` or `,` (Comma)**; Change pointer to Pen = `Ctrl + P`; Change pointer to Laser = `Ctrl + L`; Erase on-screen ink = **`E`**; Jump to Slide number `N` = Type **`N` + `Enter`**.", "Handouts Printing: You can print **1, 2, 3, 4, 6, or 9 slides per page** on Handouts (Note: **3 slides per page** automatically includes ruled horizontal lines next to each slide for audience note-taking!)."], "sections": [{"heading": "1. PowerPoint Views, Slide Master vs Layout & Object Insertion", "content": "MS PowerPoint questions focus heavily on choosing the right View for a task, Master views, and keyboard shortcuts:", "bullets": ["Presentation Views vs Master Views (View Tab): Presentation Views include Normal, Outline View, Slide Sorter, Notes Page, and Reading View. Master Views include Slide Master, Handout Master, and Notes Master.", "Slide Master vs Slide Layout: The Slide Master is the top-level root slide in a hierarchy that stores theme fonts, colors, backgrounds, and universal logos/headers across the ENTIRE presentation (if you want your school logo to appear automatically on every slide, place it on the Slide Master!). Subordinate to the Slide Master are Slide Layouts (e.g., Title Slide, Title and Content, Section Header, Two Content, Comparison, Title Only, Blank, Content with Caption, Picture with Caption), which define placeholder arrangements for specific slide types.", "Inserting Media & Action Buttons: Dotted-border boxes on a slide that hold titles, body text, tables, or media are called Placeholders. Action Buttons (Insert -> Shapes -> bottom category) are pre-built interactive shapes (Home, Next, Previous, Beginning, End, Return, Movie, Sound) that trigger hyperlinks, run programs, or play sounds on mouse click or mouse hover (`Mouse Over`)."], "examTrap": "Exam Trap: In PowerPoint, `Ctrl + N` creates a brand-new blank Presentation file, while `Ctrl + M` inserts a New Slide into the current presentation! Never confuse the two."}, {"heading": "2. Transitions, Animations, Timing & Live Slide Show Delivery", "content": "Understanding the distinction between slide-level Transitions and object-level Animations—and their exact Ribbon tabs—is essential:", "bullets": ["Transitions Tab vs Animations Tab: Transitions apply to an entire slide as it enters the screen (Subtle, Exciting, Dynamic Content; includes Sound, Duration, 'Apply To All', and Advance Slide: 'On Mouse Click' or 'After X seconds'). Animations apply to specific objects on a slide via 4 categories: Entrance (Green—controls how an object appears, e.g., Appear, Fade, Fly In, Wipe), Emphasis (Yellow—draws attention to an already-visible object, e.g., Pulse, Spin, Grow/Shrink), Exit (Red—controls how an object leaves the slide, e.g., Disappear, Fly Out), and Motion Paths (moves an object along a line, arc, turn, or custom path).", "Animation Trigger & Timing Options: Animations can start 'On Click', 'With Previous' (plays simultaneously with the prior animation), or 'After Previous' (plays immediately after the prior animation finishes). The Animation Painter (`Alt+Shift+C`) copies animation effects from one object to another (just like Format Painter copies text formatting).", "Rehearse Timings vs Record Slide Show (Slide Show Tab): Rehearse Timings launches a full-screen clock to practice and save the exact time spent on each slide for automatic self-running kiosks. Presenter View displays the current slide, next animation preview, speaker notes, and a timer on the presenter's laptop screen while showing only the clean slide on the external projector (`Alt + F5`).", "File Extensions: `.pptx` (standard presentation), `.ppsx` (PowerPoint Show — double-clicking opens directly in full-screen Slide Show mode rather than Edit mode!), `.potx` (PowerPoint Template), `.pptm` (Macro-enabled Presentation)."], "examTrap": "Exam Trap: Printing Handouts with '3 Slides per page' is the ONLY layout that prints blank ruled lines alongside the slides for audience notes. Also note: valid Handout counts are 1, 2, 3, 4, 6, 9 (5, 7, and 8 do NOT exist)."}]}, {"code": "S", "id": "MOD-S", "title": "Module S: MS Access – Database Management", "category": "MS Office Suite", "targetQuestions": 20, "subtopics": ["MS Access RDBMS Fundamentals: Tables (Relations), Records (Tuples/Rows), Fields (Attributes/Columns)", "Six Core Database Objects: Tables, Queries, Forms, Reports, Macros, Modules", "MS Access Data Types (Short Text, Long Text, Number, AutoNumber, Currency, Yes/No, OLE Object, Hyperlink, Attachment, Calculated)", "Keys & Relationships: Primary Key, Foreign Key, Composite Key, 1:1, 1:M, M:N (Junction Table) & Referential Integrity", "Access Queries (Select, Parameter, Crosstab, Action Queries: Make-Table, Append, Update, Delete) & Access File Formats (.accdb, .mdb)"], "onePageRevision": ["MS Access is Microsoft's Relational Database Management System (RDBMS) included in Office Professional / Microsoft 365 PC editions. Unlike Excel (flat-file spreadsheet), Access stores data in normalized relational tables.", "6 Core Database Objects in Access: **1. Tables** (actually store the raw data in rows/records and columns/fields), **2. Queries** (retrieve, filter, calculate, or modify data across tables using QBE or SQL), **3. Forms** (user-friendly GUI screens for entering/viewing data record-by-record), **4. Reports** (formatted, grouped, print-ready summaries for presentation—read-only!), **5. Macros** (task automation without writing code), **6. Modules** (advanced automation written in VBA - Visual Basic for Applications).", "Access Data Types & Limits: **Short Text** (formerly called 'Text' in Access 2007/2010; max **255 characters**, default field size = 255), **Long Text** (formerly called 'Memo'; up to ~65,535 chars in UI / 1 GB storage), **Number** (Byte, Integer, Long Integer, Single, Double, Decimal), **AutoNumber** (automatically generates unique sequential/random 4-byte Long Integer for each new record—cannot be edited manually), **Yes/No** (1-bit Boolean True/False), **Currency** (fixed-point 8-byte avoiding rounding errors), **Date/Time** (8 bytes), **OLE Object**, **Attachment**, **Calculated**.", "Keys & Referential Integrity: **Primary Key** uniquely identifies each record in a table (cannot be NULL, cannot have duplicates, automatically indexed). **Foreign Key** is a field in a child table referencing the Primary Key of a parent table. **Referential Integrity** prevents orphan records (you cannot add a child record with a non-existent parent ID, nor delete a parent record that has matching child records unless Cascade Delete is enabled).", "File Formats: `.mdb` (Access 2003 and earlier), `.accdb` (Access 2007 and later default format), `.accde` (compiled execute-only format)."], "sections": [{"heading": "1. Access Database Objects, Views & Data Types", "content": "MS Access questions in DSSSB TGT/PGT CS test the exact role of each database object and the storage rules of Access field types:", "bullets": ["Tables (Datasheet View vs Design View): In Datasheet View, you enter and view actual records (rows = Records/Tuples; columns = Fields/Attributes). In Design View, you define Field Names (up to 64 characters, cannot start with a space or include `. ! ` `[ ]`), Data Types, Descriptions, and Field Properties (Field Size, Format, Input Mask, Validation Rule, Validation Text, Default Value, Required, Indexed).", "Short Text vs Long Text: In Access 2013+, 'Text' was renamed to 'Short Text' (1 to 255 characters) and 'Memo' was renamed to 'Long Text' (up to 63,999 characters via keyboard entry). Telephone numbers, PIN codes, and Zip codes should be stored as Short Text (not Number) because they are never used in arithmetic calculations and may have leading zeros or dashes.", "Forms vs Reports: Forms provide an interactive front-end for data entry and editing (bound to tables/queries). Reports format and group data strictly for viewing, printing, or exporting to PDF—you CANNOT edit database records inside a Report."], "examTrap": "Exam Trap: Only TABLES actually store the data in an MS Access database! Queries, Forms, and Reports display or process data stored inside Tables."}, {"heading": "2. Keys, Relationships, Referential Integrity & Queries", "content": "Relational integrity and query classification connect MS Access with core DBMS concepts:", "bullets": ["Relationship Types: (1) One-to-One (1:1 — Primary Key of Table A links to Primary Key/Unique field of Table B); (2) One-to-Many (1:M — most common relational link; Primary Key on the 'One' parent side links to a non-unique Foreign Key on the 'Many' child side); (3) Many-to-Many (M:N — implemented in Access by creating a third intermediate Junction/Linking Table containing Foreign Keys referencing the Primary Keys of both tables).", "Referential Integrity & Cascades: Enforced in the Relationships window. 'Cascade Update Related Fields' automatically updates Foreign Key values if a parent Primary Key changes; 'Cascade Delete Related Records' automatically deletes associated child records when a parent record is deleted.", "Types of Queries in MS Access: (1) Select Query (most common; retrieves and displays matching records without changing underlying data); (2) Parameter Query (prompts the user with a dialog box `[Enter City:]` at runtime); (3) Crosstab Query (pivots data into row and column headings with an aggregate calculation); (4) Four Action Queries (marked with an exclamation mark `!`—they permanently modify database data): Make-Table Query, Append Query (adds rows), Update Query (modifies values), and Delete Query (removes rows)."], "examTrap": "Exam Trap: Select Query does NOT modify data; the four Action Queries that modify data in MS Access are Make-Table, Append, Update, and Delete."}]}, {"code": "T", "id": "MOD-T", "title": "Module T: MS Outlook, OneNote and Other Office Tools", "category": "MS Office Suite", "targetQuestions": 10, "subtopics": ["MS Outlook PIM (Personal Information Manager): Mail, Calendar, Contacts/People, Tasks, Notes", "Outlook Mail Folders, Rules, Signatures, Out of Office & Data Files (.pst vs .ost)", "MS OneNote Digital Notebook Hierarchy: Notebooks -> Section Groups -> Sections -> Pages -> Subpages", "Microsoft 365 Cloud Collaboration: OneDrive, SharePoint, MS Teams, Real-Time Co-Authoring & Sharing Permissions"], "onePageRevision": ["MS Outlook: A Personal Information Manager (PIM) and email client combining Mail, Calendar (meetings/appointments), Contacts (People), Tasks (To-Do list), and Journal/Notes. Send/Receive all folders shortcut = **`F9`** (or `Ctrl+M`). Create new Email in Mail view = `Ctrl+N` (anywhere in Outlook: `Ctrl+Shift+M`); Reply = `Ctrl+R`; Reply All = `Ctrl+Shift+R`; Forward = `Ctrl+F`.", "Outlook Data File Extensions: **`.pst`** (Personal Storage Table — local archive/POP3 data file stored on user PC) vs **`.ost`** (Offline Storage Table — cached local synchronized copy of an Exchange / Microsoft 365 / IMAP mailbox for offline work). Individual saved message = **`.msg`**.", "Appointment vs Meeting in Outlook Calendar: An **Appointment** is an activity scheduled only on your own calendar (does not invite others); a **Meeting** invites other attendees via email and tracks their RSVP responses (Accept, Tentative, Decline).", "MS OneNote Hierarchy: Digital note-taking app organized like a physical 3-ring binder: **Notebook -> Section Group -> Section (tabs across top/side) -> Page -> Subpage**. OneNote saves notes **automatically and continuously** (there is NO manual Save button in OneNote!). File extension = **`.one`** (package = `.onepkg`).", "Microsoft 365 Collaboration: **OneDrive** (personal/work cloud storage; 5 GB free consumer / 1 TB M365 subscription), **SharePoint** (team intranet sites and document libraries), **MS Teams** (chat, video meetings, channels), **Co-authoring** (multiple users editing the same Word/Excel/PowerPoint file simultaneously in real time when stored on OneDrive/SharePoint)."], "sections": [{"heading": "1. MS Outlook Email, Calendar & Storage Architecture", "content": "MS Outlook is tested both for practical workplace email management and its file extensions:", "bullets": ["Outlook Mail Folders & Rules: Incoming mail lands in `Inbox`; outgoing mail waiting to be transmitted while offline sits in `Outbox`; sent messages are archived in `Sent Items`; unfinished emails are saved in `Drafts`; deleted emails move to `Deleted Items` (`Shift+Delete` permanently deletes without going to Deleted Items). Outlook Rules automate actions (e.g., automatically move emails from a specific sender to a designated folder or flag them).", "PST vs OST Files: `.pst` (Personal Storage Table) stores local copies of messages, calendar events, and contacts on the user's hard drive (used with POP3 or local archiving). `.ost` (Offline Storage Table) caches a synchronized copy of a Microsoft Exchange, Microsoft 365, or IMAP server mailbox so users can read and compose emails offline and auto-sync when reconnected.", "Email Signatures & Voting/Tracking: Signatures automatically append contact details/logos to outgoing emails. Read Receipts confirm when a recipient opens an email; Delivery Receipts confirm the mail reached the recipient's server."], "examTrap": "Exam Trap: An outgoing email sits in the 'Outbox' while waiting to be transmitted to the mail server; once transmitted, it moves to 'Sent Items'."}, {"heading": "2. MS OneNote & Microsoft 365 Cloud Collaboration (OneDrive, SharePoint, Teams)", "content": "Modern Office productivity questions cover OneNote's unique auto-save notebook structure and real-time co-authoring:", "bullets": ["MS OneNote: Free-form digital canvas where users can click anywhere on a Page to type text, draw with a stylus, record audio/video, clip screen regions (`Win+Shift+S`), and extract text from pictures via built-in OCR. Hierarchy: Notebook -> Sections -> Pages.", "Co-Authoring Requirements: Real-time co-authoring in Word, Excel, and PowerPoint requires the file to be saved in the cloud (OneDrive, OneDrive for Business, or SharePoint Online) in a modern OpenXML format (`.docx`, `.xlsx`, `.pptx`). Colored presence flags show exactly which paragraph, cell, or slide each collaborator is currently editing."], "examTrap": "Exam Trap: MS OneNote has NO 'Save' button or `Ctrl+S` prompt because it saves every keystroke and ink stroke automatically and immediately."}]}, {"code": "U", "id": "MOD-U", "title": "Module U: Important MS Office Shortcut Keys", "category": "MS Office Suite", "targetQuestions": 20, "subtopics": ["Universal Ctrl+A to Ctrl+Z Shortcuts & App-Specific Differences", "Function Keys F1 to F12 (Alone and with Shift, Ctrl, Alt)", "MS Word Specific Formatting, Alignment, Indentation & Review Shortcuts", "MS Excel Specific Navigation, Selection, Data Entry & Number Formatting Shortcuts", "MS PowerPoint, MS Access, MS Outlook & Windows System Shortcuts", "Ribbon KeyTips (Alt Badges)"], "onePageRevision": ["High-Yield Cross-App Shortcut Traps: **`Ctrl + K`** = Insert Hyperlink (in Word, Excel, PowerPoint, Outlook!). **`Ctrl + H`** = Find & Replace. **`Ctrl + G` or `F5`** = Go To (in Word & Excel; in PowerPoint `F5` starts Slide Show!). **`Ctrl + D`** = Font Dialog Box (or Duplicate shape) in Word | Fill Down in Excel | Duplicate Slide/Object in PowerPoint. **`Ctrl + M`** = Left Indent paragraph in Word | Insert New Slide in PowerPoint. **`Ctrl + T`** = Hanging Indent in Word | Create Excel Table in Excel. **`Ctrl + W` or `Ctrl + F4`** = Close active document/workbook window (whereas **`Alt + F4`** closes the entire application!).", "Function Keys Master List (Word / Excel): **F1** = Help; **F2** = Move text/graphics in Word | **Edit active cell in Excel** | Rename file in Windows Explorer (`Ctrl+F2` = Print Preview); **F3** = Paste AutoText in Word (`Shift+F3` = Change Case) | Paste Defined Name in Excel (`Shift+F3` = Insert Function dialog); **F4** = Repeat last action in Word/Excel | **Cycle Cell Reference `$A$1` in Excel Formula Bar** (`Ctrl+F4` = Close window, `Alt+F4` = Exit app); **F5** = Go To in Word/Excel | **Start Slide Show from Beginning in PowerPoint** (`Shift+F5` = Start from Current Slide in PPT); **F7** = **Spelling & Grammar Check** (`Shift+F7` = **Thesaurus**); **F8** = Extend Selection mode; **F9** = Update selected fields in Word | **Recalculate all formulas in Excel** | Send/Receive in Outlook; **F10** = Toggle Ribbon KeyTips (`Shift+F10` = Right-click Context Menu); **F11** = **Insert New Chart Sheet in Excel** (`Shift+F11` = **Insert New Worksheet in Excel**, `Alt+F11` = **Open VBA Editor** across all Office apps); **F12** = **Save As dialog box** (`Ctrl+F12` = Open dialog, `Shift+F12` = Save).", "Excel Selection & Entry Shortcuts: Select Entire Row = **`Shift + Spacebar`**; Select Entire Column = **`Ctrl + Spacebar`**; Select Entire Worksheet = **`Ctrl + A` or `Ctrl + Shift + Spacebar`**; Insert New Line inside same Excel cell = **`Alt + Enter`**; Insert Current Date = **`Ctrl + ;`**; Insert Current Time = **`Ctrl + Shift + :`**; Copy Value from Cell Above = **`Ctrl + '\"` (`Ctrl + Shift + '`)**; Copy Formula from Cell Above = **`Ctrl + '`**; Toggle Show Formulas vs Values = **`Ctrl + ~` (Ctrl + Grave Accent)**; Switch between open Worksheet tabs = **`Ctrl + Page Down` (next sheet) / `Ctrl + Page Up` (previous sheet)**."], "sections": [{"heading": "1. Complete Function Keys (F1–F12) & Modifier Combinations Matrix", "content": "Function key combinations are tested in almost every DSSSB shift. Study both the bare function key and its `Shift`, `Ctrl`, and `Alt` modifiers:", "bullets": ["F1 Family: `F1` = Open Help pane; `Ctrl + F1` = Collapse / Expand (Show/Hide) the Ribbon; `Alt + F1` = Insert an embedded Chart on the CURRENT worksheet in Excel.", "F2 Family: `F2` = Edit active cell in Excel / Rename selected file or folder in Windows; `Ctrl + F2` = Open Print Preview (Backstage Print view) in Word/Excel/PowerPoint; `Alt + Ctrl + F2` = Open document.", "F3 & F4 Family: `Shift + F3` = Toggle Change Case in MS Word (UPPER -> lower -> Title Case) OR Open 'Insert Function' (`fx`) dialog in MS Excel. `F4` = Cycle Relative/Absolute/Mixed cell references (`$A$1`) while editing an Excel formula OR repeat last command in Word/Excel; `Ctrl + F4` = Close active document/workbook window; `Alt + F4` = Close the active application (or shut down Windows from Desktop).", "F5 to F8 Family: `F5` = Go To dialog (Word/Excel), Start Slide Show from Slide 1 (PowerPoint), Refresh window (Browser/Windows); `Shift + F5` = Start Slide Show from Current Slide (PowerPoint) or jump to last edit location (Word); `F6` = Switch between Ribbon, Document, Task Pane, and Status Bar; `F7` = Spelling & Grammar Check; `Shift + F7` = Thesaurus; `F8` = Turn on Extend Selection mode (press `F8` twice in Word = select word; 3 times = select sentence; 4 times = select paragraph; 5 times = select entire document).", "F9 to F12 Family: `F9` = Update fields (Word), Recalculate all open workbooks (Excel), Send/Receive all mail (Outlook); `Shift + F9` = Calculate active worksheet only (Excel); `F10` = Show Ribbon KeyTip badges (same as `Alt`); `Shift + F10` = Open Context Menu (same as Right-Click); `F11` = Create Chart on a separate Chart Sheet in Excel (Full screen in browsers); `Shift + F11` = Insert a new blank Worksheet in Excel; `Alt + F11` = Open Visual Basic for Applications (VBA) Editor; `F12` = Open 'Save As' dialog directly."], "examTrap": "Exam Trap: In Excel, `Alt + F1` creates an embedded chart on the CURRENT worksheet, whereas `F11` creates a chart on a brand-new separate Chart Sheet (`Chart1`)."}, {"heading": "2. Cross-Application Ctrl+A to Ctrl+Z & Special Shortcuts", "content": "Watch out for letters whose behavior changes across Word, Excel, and PowerPoint:", "bullets": ["Ctrl + D: Opens the Font dialog box in MS Word (`Ctrl+Shift+F` also opens Font dialog); Fills Down the top cell's content/formula into selected cells below in MS Excel; Duplicates the selected slide or object in MS PowerPoint.", "Ctrl + E: Center-aligns paragraph in MS Word and PowerPoint; invokes Flash Fill in MS Excel (2013+).", "Ctrl + M: Indents the paragraph from the left margin in MS Word; Inserts a New Slide in MS PowerPoint.", "Ctrl + T: Creates a Hanging Indent in MS Word; Converts selected range into an Excel Table (with filter headers) in MS Excel.", "Excel Number Formatting Shortcuts (`Ctrl + Shift + Symbol`): `Ctrl + Shift + ~` = General format; `Ctrl + Shift + $` = Currency format (2 decimals); `Ctrl + Shift + %` = Percentage format (0 decimals); `Ctrl + Shift + #` = Date format (`DD-MMM-YY`); `Ctrl + Shift + @` = Time format; `Ctrl + Shift + !` = Number format with comma separator and 2 decimals; `Ctrl + Shift + ^` = Scientific/Exponential format; `Ctrl + 1` = Open 'Format Cells' dialog box; `Ctrl + 5` = Apply/Remove Strikethrough in Excel; `Ctrl + 9` = Hide selected rows; `Ctrl + 0` = Hide selected columns."], "examTrap": "Exam Trap: In MS Word `Ctrl + 5` sets 1.5 Line Spacing, whereas in MS Excel `Ctrl + 5` toggles Strikethrough formatting!"}]}], "comparisonTables": [{"id": "CMP-01", "title": "1. Analog vs Digital vs Hybrid Computers", "category": "Computer Fundamentals", "headers": ["Feature", "Analog Computer", "Digital Computer", "Hybrid Computer"], "rows": [["Signal / Data Type", "Continuous physical quantities (voltage, pressure, temperature)", "Discrete binary digits (0 and 1)", "Both continuous analog inputs and discrete digital processing"], ["Accuracy & Precision", "Limited precision (~99% or 3–4 significant digits)", "Virtually unlimited precision (depends on word size: 32/64-bit)", "High precision via ADC/DAC conversion"], ["Memory & Storage", "Very limited or no digital memory", "Massive primary (RAM) and secondary (SSD/HDD) storage", "Digital memory coupled with real-time analog sensing"], ["Examples", "Speedometer, Seismograph, Slide Rule, Bourdon Gauge", "Desktop PC, Laptop, Smartphone, Enterprise Server", "ICU ECG/Patient Monitor, Petrol Pump Dispenser, Radar Control"]]}, {"id": "CMP-02", "title": "2. Microcomputer vs Minicomputer vs Mainframe vs Supercomputer", "category": "Computer Fundamentals", "headers": ["Parameter", "Microcomputer", "Minicomputer", "Mainframe Computer", "Supercomputer"], "rows": [["Primary Users", "Single user at a time", "4 to ~200 concurrent users", "Thousands of simultaneous terminal users", "Specialized researchers / batch scientific jobs"], ["Core Strength", "Personal productivity & affordability", "Departmental/mid-range server processing", "Massive I/O transaction throughput & reliability (TPS)", "Extreme floating-point calculation speed (FLOPS)"], ["Typical Applications", "Office work, browsing, education, gaming", "Manufacturing control, medium business ERP", "Core banking, railway reservations, census, insurance", "Weather forecasting, nuclear simulation, molecular modeling"], ["Classic Examples", "IBM PC, Apple MacBook, Dell Desktop", "DEC PDP-11, VAX-11, IBM AS/400", "IBM zSeries (z15/z16), Unisys ClearPath", "PARAM 8000, PARAM Siddhi-AI, Frontier, Fugaku, Cray-1"]]}, {"id": "CMP-03", "title": "3. First to Fifth Generation Computers", "category": "Computer Fundamentals", "headers": ["Generation & Era", "Switching Hardware", "Memory / Storage", "Speed & OS", "Languages", "Classic Examples"], "rows": [["1st Gen (1940–1956)", "Vacuum Tubes (Thermionic Valves)", "Magnetic Drums, Mercury Delay Lines, Punched Cards", "Milliseconds (10^-3 s); No OS / Manual plugboards", "Machine Language (Binary 0s & 1s)", "ENIAC, EDVAC, EDSAC, UNIVAC-I, IBM 650/701"], ["2nd Gen (1956–1963)", "Transistors (Bell Labs)", "Magnetic Core Memory, Magnetic Tape & Disks", "Microseconds (10^-6 s); Batch Processing OS", "Assembly Language, FORTRAN, COBOL", "IBM 1401, IBM 7090, CDC 1604, UNIVAC 1108"], ["3rd Gen (1964–1971)", "Integrated Circuits (ICs: SSI & MSI)", "Semiconductor Memory, High-capacity Magnetic Disks", "Nanoseconds (10^-9 s); Multiprogramming & Time-Sharing OS", "BASIC, Pascal, PL/I, C, Algol-68", "IBM System/360, PDP-8, PDP-11, Honeywell 6000"], ["4th Gen (1971–Present)", "Microprocessors (LSI & VLSI)", "High-speed Semiconductor DRAM/SRAM, HDD, SSD, Optical", "Picoseconds (10^-12 s); GUI, Time-Sharing, Network OS", "C, C++, Java, Python, SQL (4GL)", "Intel 4004 PC, IBM PC, Apple II, Cray-1, Cray X-MP"], ["5th Gen (Present & Beyond)", "ULSI / SLSI, Parallel Processing & Quantum Chips", "High-density NVMe SSDs, Optical, Cloud Storage", "Femtoseconds / ExaFLOPS; AI, Parallel & Distributed OS", "Prolog, LISP, Python, R, Julia (5GL / AI)", "IBM Watson, PARAM Siddhi-AI, Frontier, Fugaku"]]}, {"id": "CMP-04", "title": "4. Hardware vs Software", "category": "Computer Fundamentals", "headers": ["Basis", "Computer Hardware", "Computer Software"], "rows": [["Nature", "Physical, tangible electronic and mechanical components", "Logical, intangible set of instructions, programs, and data"], ["Wear & Tear", "Wears out physically over time due to heat, dust, or mechanical failure", "Does not wear out physically, but suffers from bugs and obsolescence"], ["Replacement", "Damaged components must be physically repaired or replaced with new parts", "Corrupted software can be reinstalled from a backup copy"], ["Examples", "CPU, Motherboard, RAM chip, Monitor, Keyboard, Printer, SSD", "Windows 11, Linux, MS Office 365, Google Chrome, Python"]]}, {"id": "CMP-05", "title": "5. System Software vs Application Software", "category": "Computer Fundamentals", "headers": ["Parameter", "System Software", "Application Software"], "rows": [["Primary Purpose", "Manages computer hardware resources and provides an execution platform", "Performs specific tasks for the end-user (word processing, accounting)"], ["Dependency", "Can run independently; mandatory for the computer to boot and operate", "Cannot run without System Software (Operating System) present"], ["Interaction", "Interacts directly with hardware via privileged kernel instructions", "Interacts with hardware indirectly through OS system calls"], ["Examples", "Windows, Linux, macOS, Compiler, Assembler, Device Drivers, BIOS", "MS Word, MS Excel, PowerPoint, Access, VLC Player, Tally, Photoshop"]]}, {"id": "CMP-06", "title": "6. RAM vs ROM", "category": "Computer Fundamentals", "headers": ["Feature", "RAM (Random Access Memory)", "ROM (Read-Only Memory)"], "rows": [["Volatility", "Volatile (loses all data immediately when power is switched off)", "Non-Volatile (retains data permanently even without power)"], ["Read / Write Operations", "Supports rapid both Read and Write operations during normal execution", "Primarily Read-Only during normal operation (written at factory or via special flashing)"], ["Role in Computing", "Stores active OS kernel, running applications, and current user data", "Stores permanent bootstrap firmware (BIOS/UEFI, POST) and embedded controller code"], ["Main Variants", "SRAM (Static RAM), DRAM (Dynamic RAM - SDRAM, DDR4, DDR5)", "MROM, PROM, EPROM, EEPROM, Flash Memory"]]}, {"id": "CMP-07", "title": "7. SRAM vs DRAM", "category": "Computer Fundamentals", "headers": ["Attribute", "SRAM (Static RAM)", "DRAM (Dynamic RAM)"], "rows": [["Internal Cell Circuit", "Uses 4 to 6 transistors forming a bistable flip-flop latch", "Uses 1 transistor + 1 tiny capacitor per bit"], ["Periodic Refreshing", "Does NOT require periodic refreshing (retains bit while powered)", "MUST be refreshed thousands of times per second due to capacitor leakage"], ["Access Speed & Cost", "Ultra-fast (~1–10 ns); expensive per bit; takes more silicon area", "Slower (~50–100 ns); inexpensive per bit; high packing density"], ["Primary Usage", "CPU Cache Memory (L1, L2, L3) and high-speed registers", "System Main Memory (RAM modules: DDR4, DDR5)"]]}, {"id": "CMP-08", "title": "8. PROM vs EPROM vs EEPROM", "category": "Computer Fundamentals", "headers": ["Characteristic", "PROM", "EPROM", "EEPROM"], "rows": [["Full Form", "Programmable Read-Only Memory", "Erasable Programmable Read-Only Memory", "Electrically Erasable Programmable ROM"], ["Reprogrammability", "One-Time Programmable (OTP) — cannot be erased once fuses are blown", "Can be erased and reprogrammed multiple times", "Can be erased and reprogrammed thousands of times"], ["Erasure Mechanism", "None (permanent fuse blow)", "Strong Ultraviolet (UV-C) light shone through a quartz window for 15–20 mins", "Electrical voltage pulses applied directly in-circuit (milliseconds)"], ["Selective Erasure", "Not applicable", "Cannot erase selectively — erases the ENTIRE chip at once", "Can erase and rewrite individual bytes selectively (Flash erases by block)"]]}, {"id": "CMP-09", "title": "9. Primary Memory vs Secondary Memory", "category": "Computer Fundamentals", "headers": ["Parameter", "Primary (Main) Memory", "Secondary (Auxiliary) Storage"], "rows": [["Direct CPU Access", "Directly accessible by the CPU via the System Address and Data Buses", "Not directly accessible by CPU; data must be loaded into RAM via I/O channels first"], ["Volatility", "Mostly Volatile (RAM), except ROM portion", "Strictly Non-Volatile (retains files permanently when powered off)"], ["Speed & Cost per Bit", "Very fast (nanoseconds); high cost per gigabyte", "Slower (milliseconds/microseconds); very low cost per gigabyte"], ["Examples", "RAM (SRAM, DRAM), ROM, Cache Memory", "Hard Disk Drive (HDD), Solid State Drive (SSD), Optical Discs, USB Pen Drive, Magnetic Tape"]]}, {"id": "CMP-10", "title": "10. HDD (Hard Disk Drive) vs SSD (Solid State Drive)", "category": "Computer Fundamentals", "headers": ["Feature", "HDD (Hard Disk Drive)", "SSD (Solid State Drive)"], "rows": [["Storage Medium", "Rotating magnetic platters with mechanical read/write actuator heads", "Non-volatile NAND Flash semiconductor memory chips (no moving parts)"], ["Access Time & Speed", "5–10 ms seek time; ~80–160 MB/s sequential speed", "<0.1 ms access time; 550 MB/s (SATA) to 7,000+ MB/s (NVMe PCIe)"], ["Noise, Heat & Shock", "Produces mechanical spin noise, more heat, vulnerable to drop damage", "Completely silent, cooler, highly resistant to physical shock/vibration"], ["Defragmentation Rule", "Benefits from periodic Disk Defragmentation to reduce head seek time", "Should NEVER be defragmented (zero seek delay; extra writes reduce NAND lifespan; uses TRIM)"]]}, {"id": "CMP-11", "title": "11. OCR vs OMR vs MICR", "category": "Computer Fundamentals", "headers": ["Dimension", "OCR", "OMR", "MICR"], "rows": [["Full Form", "Optical Character Recognition", "Optical Mark Recognition / Reader", "Magnetic Ink Character Recognition"], ["What It Reads", "Printed or handwritten alphanumeric text characters", "Presence/absence of shaded pencil or pen marks in predefined bubbles", "Special characters (E-13B / CMC-7 font) printed with iron-oxide magnetic ink"], ["Working Principle", "Optical scanning + software pattern matching into editable ASCII/Unicode", "Measures light reflectivity differences on pre-printed forms", "Magnetizes ink and senses unique magnetic waveform of each character"], ["Primary Application", "Digitizing printed books, invoices, passports, PDFs into editable text", "Evaluating multiple-choice exam answer sheets (DSSSB/CBSE), surveys", "Processing and clearing bank cheques (9-digit MICR code at bottom of cheque)"]]}, {"id": "CMP-12", "title": "12. Impact Printers vs Non-Impact Printers", "category": "Computer Fundamentals", "headers": ["Criterion", "Impact Printers", "Non-Impact Printers"], "rows": [["Printing Mechanism", "Electromechanical pins/hammers physically strike an ink ribbon against paper", "Forms characters/images without physical contact (laser, ink spray, heat)"], ["Carbon Copy Support", "CAN print multi-part carbon copies in a single pass", "CANNOT print carbon copies (no mechanical strike pressure)"], ["Noise & Speed", "Noisy operation; slower (measured in CPS or LPM)", "Quiet operation; fast (measured in PPM - Pages Per Minute)"], ["Examples", "Dot Matrix Printer (DMP), Daisy Wheel Printer, Line Printers (Drum, Chain, Band)", "Laser Printer, Inkjet Printer, Thermal Printer"]]}, {"id": "CMP-13", "title": "13. CRT vs LCD vs LED vs OLED Displays", "category": "Computer Fundamentals", "headers": ["Attribute", "CRT", "LCD", "LED", "OLED"], "rows": [["Full Form", "Cathode Ray Tube", "Liquid Crystal Display", "Light Emitting Diode (Backlit LCD)", "Organic Light-Emitting Diode"], ["Light Emission Method", "Electron gun fires beam at phosphor-coated vacuum glass tube", "Liquid crystals twist to block/pass light from a CCFL fluorescent backlight", "Liquid crystal panel illuminated by an array of LEDs behind/around the screen", "Self-emissive: each individual organic pixel generates its own light when current flows"], ["Black Levels & Contrast", "Good contrast, bulky & heavy, high power draw", "Moderate contrast (backlight bleed prevents true black)", "Better contrast & thinner than CCFL-LCD, energy efficient", "True black (pixels turn completely OFF) and infinite contrast ratio; ultra-thin"], ["Power & Form Factor", "Highest power consumption; deep heavy cabinet", "Low power; flat panel", "Lower power than standard LCD; slim flat panel", "Lowest power on dark themes; supports curved/foldable screens"]]}, {"id": "CMP-14", "title": "14. Compiler vs Interpreter vs Assembler", "category": "Computer Fundamentals", "headers": ["Parameter", "Compiler", "Interpreter", "Assembler"], "rows": [["Input Language", "High-Level Language (e.g., C, C++, FORTRAN)", "High-Level / Scripting Language (e.g., Python, BASIC, Ruby, JS)", "Low-Level Assembly Language (Mnemonics: MOV, ADD, SUB)"], ["Translation Method", "Translates the ENTIRE source program into object/machine code in one batch", "Translates and immediately executes the program line-by-line (statement by statement)", "Translates assembly mnemonics 1-to-1 into binary machine code"], ["Object Code Generation", "Generates a standalone intermediate Object file (`.obj`/`.o`) and executable", "Does NOT save a standalone object code file; re-translates on each run", "Generates a relocatable object file linked into machine code"], ["Error Reporting", "Displays all syntax errors together after scanning the whole program", "Stops translation immediately at the first encountered error", "Reports assembly syntax and invalid symbol/opcode errors"]]}, {"id": "CMP-15", "title": "15. GUI (Graphical User Interface) vs CLI (Command Line Interface)", "category": "Computer Fundamentals", "headers": ["Feature", "GUI (Graphical User Interface)", "CLI / CUI (Command Line / Character User Interface)"], "rows": [["Interaction Paradigm", "WIMP (Windows, Icons, Menus, Pointer) using mouse and keyboard", "Text-only terminal where user types exact commands and flags via keyboard"], ["Ease of Learning", "Intuitive and beginner-friendly (visual discovery)", "Steep learning curve; requires memorizing exact command syntax"], ["Resource Consumption", "Requires more RAM, GPU, and CPU overhead to render graphics", "Ultra-lightweight; minimal RAM/CPU usage; ideal for remote SSH servers"], ["Examples", "Windows 11 Desktop, macOS Aqua, Ubuntu GNOME, Android", "MS-DOS, Windows Command Prompt (`cmd`), PowerShell, Linux Bash shell"]]}, {"id": "CMP-16", "title": "16. Internet vs Intranet vs Extranet", "category": "Computer Fundamentals", "headers": ["Dimension", "Internet", "Intranet", "Extranet"], "rows": [["Access Scope", "Public global network open to anyone worldwide", "Private internal network restricted strictly to an organization's employees", "Controlled private network shared with authorized external partners/vendors/clients"], ["Ownership & Security", "Decentralized (no single owner); public security risks", "Owned by a single enterprise; protected behind internal firewalls and logins", "Owned by single/partner enterprises; secured via VPN, encryption, and partner logins"], ["Typical Example", "Accessing `wikipedia.org` or `google.com`", "Internal employee HR portal or company leave-management system", "Automobile manufacturer's supplier inventory portal shared with parts vendors"]]}, {"id": "CMP-17", "title": "17. LAN vs MAN vs WAN", "category": "Computer Fundamentals", "headers": ["Parameter", "LAN (Local Area Network)", "MAN (Metropolitan Area Network)", "WAN (Wide Area Network)"], "rows": [["Geographical Span", "Single room, office building, school lab, or campus (~10 m to 2 km)", "Across an entire city or metropolitan town (~5 km to 50 km)", "Across states, countries, continents, or the entire globe (>100 km)"], ["Ownership", "Privately owned by a single home, school, or business", "Owned by a consortium or telecom/cable ISP", "Collective/public/telecom leased carriers (no single private owner for the Internet)"], ["Speed & Propagation Delay", "Highest speed (100 Mbps to 10+ Gbps); lowest delay and lowest error rate", "Moderate-to-high speed; moderate propagation delay", "Variable speed; higher propagation delay (especially over satellite/undersea links)"], ["Technologies & Examples", "Ethernet (IEEE 802.3), Wi-Fi (IEEE 802.11); school computer lab", "Cable TV network, City Metro Fiber ring, IEEE 802.16 (WiMAX)", "The Internet, Banking MPLS/ATM networks, Airline reservation network"]]}, {"id": "CMP-18", "title": "18. Virus vs Worm vs Trojan Horse", "category": "Computer Fundamentals", "headers": ["Attribute", "Computer Virus", "Computer Worm", "Trojan Horse"], "rows": [["Host File Requirement", "REQUIRES a host file/program or boot sector to attach itself to", "Standalone malware; does NOT need a host program", "Standalone program disguised as legitimate software; no host infection"], ["Self-Replication", "Replicates into other files when the infected host is executed", "Self-replicates AUTOMATICALLY across networks without human interaction", "Does NOT self-replicate or infect other files"], ["Primary Harm", "Corrupts/deletes files, modifies boot sectors, slows system", "Consumes network bandwidth and CPU via rapid autonomous propagation", "Opens covert backdoors, steals passwords (keylogging), installs ransomware"], ["Classic Examples", "Brain (1986), Melissa, Jerusalem, Cascade", "Creeper, Morris Worm (1988), ILOVEYOU, Stuxnet, WannaCry (ransomworm)", "Zeus, Emotet, Back Orifice, Fake Antivirus installers"]]}, {"id": "CMP-19", "title": "19. MS Word vs MS Excel vs MS PowerPoint vs MS Access", "category": "MS Office Suite", "headers": ["Feature", "MS Word", "MS Excel", "MS PowerPoint", "MS Access"], "rows": [["Application Category", "Word Processor", "Spreadsheet Application", "Presentation Graphics Software", "Relational Database Management System (RDBMS)"], ["Basic Working File", "Document (`Document1.docx`)", "Workbook (`Book1.xlsx`)", "Presentation (`Presentation1.pptx`)", "Database (`Database1.accdb`)"], ["Core Sub-Unit", "Pages & Paragraphs", "Worksheets, Rows (1,048,576), Columns (16,384) & Cells", "Slides, Placeholders & Slide Masters", "Tables, Queries, Forms, Reports, Macros, Modules"], ["Zoom Range", "10% to 500% (Default 100%)", "10% to 400% (Default 100%)", "10% to 400%", "Datasheet font/layout scaling"]]}, {"id": "CMP-20", "title": "20. DOC vs DOCX (MS Word File Formats)", "category": "MS Office Suite", "headers": ["Parameter", ".DOC", ".DOCX"], "rows": [["Office Versions", "Default in MS Word 97, 2000, XP (2002), and 2003", "Default in MS Word 2007, 2010, 2013, 2016, 2019, 2021, and Microsoft 365"], ["Internal Structure", "Proprietary binary file format", "OpenXML standard (ZIP-compressed archive of XML files)"], ["File Size & Corruption", "Larger file size; more prone to total corruption if binary header is damaged", "Up to 50–75% smaller due to ZIP compression; modular recovery"], ["Macro Security", "Can store VBA macros directly inside `.doc` (security risk)", "Cannot store macros! Macros require the separate `.docm` extension"]]}, {"id": "CMP-21", "title": "21. XLS vs XLSX vs XLSM (MS Excel File Formats)", "category": "MS Office Suite", "headers": ["Parameter", ".XLS", ".XLSX", ".XLSM"], "rows": [["Format Type", "Legacy Binary Workbook (Excel 97–2003)", "OpenXML Workbook (Excel 2007+ Default)", "OpenXML Macro-Enabled Workbook (Excel 2007+)"], ["Max Rows x Columns", "65,536 Rows x 256 Columns (A to IV)", "1,048,576 Rows x 16,384 Columns (A to XFD)", "1,048,576 Rows x 16,384 Columns (A to XFD)"], ["VBA Macro Support", "Allows storing VBA macros directly", "Strictly strips/blocks VBA macros for security", "Specifically designed to store and execute VBA macro code"]]}, {"id": "CMP-22", "title": "22. PPT vs PPTX vs PPSX (MS PowerPoint File Formats)", "category": "MS Office Suite", "headers": ["Parameter", ".PPT", ".PPTX", ".PPSX"], "rows": [["Format Type", "Legacy Binary Presentation (PowerPoint 97–2003)", "OpenXML Presentation (PowerPoint 2007+ Default)", "OpenXML PowerPoint Slide Show (PowerPoint 2007+)"], ["Double-Click Behavior", "Opens in PowerPoint Normal Edit mode (Compatibility Mode in 2007+)", "Opens in PowerPoint Normal Edit mode for editing slides", "Opens DIRECTLY in full-screen Slide Show mode (`.pps` in 2003)"], ["VBA Macros", "Can contain embedded macros", "Cannot contain macros (`.pptm` required for macros)", "Cannot contain macros (`.ppsm` required for macro-enabled show)"]]}, {"id": "CMP-23", "title": "23. Workbook vs Worksheet in MS Excel", "category": "MS Office Suite", "headers": ["Dimension", "Workbook", "Worksheet (Spreadsheet)"], "rows": [["Definition", "The entire Excel file (`.xlsx`) containing one or more worksheets", "A single rectangular grid page of rows and columns inside a workbook"], ["Analogy", "Like a complete physical bound ledger book", "Like an individual page/sheet inside that ledger book"], ["Creation Shortcut", "`Ctrl + N` creates a new Workbook (`Book1`)", "`Shift + F11` inserts a new Worksheet (`Sheet2`) inside the current Workbook"]]}, {"id": "CMP-24", "title": "24. Formula vs Function in MS Excel", "category": "MS Office Suite", "headers": ["Aspect", "Excel Formula", "Excel Function"], "rows": [["Definition", "Any user-written mathematical expression starting with `=` using values, cell addresses, and operators", "A predefined, built-in named routine in Excel that performs a specific calculation on arguments"], ["Syntax Structure", "`=A1+A2+A3` or `=(B2*C2)-D2`", "`=SUM(A1:A3)` or `=VLOOKUP(E2, A2:C10, 3, FALSE)`"], ["Customization", "Constructed freely by the user using arithmetic/comparison operators", "Must follow exact built-in function name and argument order (`fx`)"]]}, {"id": "CMP-25", "title": "25. Relative vs Absolute vs Mixed Cell References in Excel", "category": "MS Office Suite", "headers": ["Reference Type", "Syntax", "Column Behavior When Copied", "Row Behavior When Copied", "Example (Copied 1 Col Right, 2 Rows Down)"], "rows": [["Relative Reference", "`A1`", "Changes relatively", "Changes relatively", "`=A1` becomes `=B3`"], ["Absolute Reference", "`$A$1`", "Locked (Does NOT change)", "Locked (Does NOT change)", "`=$A$1` remains `=$A$1`"], ["Mixed (Column Locked)", "`$A1`", "Locked (Column A stays fixed)", "Changes relatively", "`=$A1` becomes `=$A3`"], ["Mixed (Row Locked)", "`A$1`", "Changes relatively", "Locked (Row 1 stays fixed)", "`=A$1` becomes `=B$1`"]]}, {"id": "CMP-26", "title": "26. COUNT vs COUNTA vs COUNTBLANK vs COUNTIF in Excel", "category": "MS Office Suite", "headers": ["Function", "What It Counts", "Numbers & Dates", "Text & Booleans (TRUE/FALSE)", "Empty Cells"], "rows": [["`=COUNT(range)`", "Cells containing ONLY numeric values (numbers & dates)", "Included", "Ignored (unless typed directly as argument)", "Ignored"], ["`=COUNTA(range)`", "All non-empty cells ('Count All')", "Included", "Included (also includes errors & `\"\"` formula strings)", "Ignored"], ["`=COUNTBLANK(range)`", "Only empty/blank cells in the range", "Ignored", "Ignored (except formulas returning empty string `\"\"`)", "Included"], ["`=COUNTIF(range, criteria)`", "Cells matching a specified condition (e.g., `\">&50\"`)", "Evaluated against criteria", "Evaluated against criteria", "Evaluated if criteria matches blank"]]}, {"id": "CMP-27", "title": "27. VLOOKUP vs HLOOKUP vs XLOOKUP in Excel", "category": "MS Office Suite", "headers": ["Feature", "VLOOKUP", "HLOOKUP", "XLOOKUP (Excel 2021 / M365)"], "rows": [["Search Direction", "Vertical (searches down the FIRST leftmost column of table_array)", "Horizontal (searches across the TOPMOST row of table_array)", "Both Vertical and Horizontal (searches any single row or column)"], ["Lookup Left / Above", "CANNOT look to the left of the lookup column", "CANNOT look above the lookup row", "CAN look left, right, up, or down freely (separate lookup & return arrays)"], ["Default Match Mode", "Approximate Match (`TRUE` / `1`) if 4th argument is omitted", "Approximate Match (`TRUE` / `1`) if 4th argument is omitted", "Exact Match (`0`) by default!"], ["Built-in Not-Found Handler", "No (throws `#N/A` unless wrapped in `IFERROR`/`IFNA`)", "No (throws `#N/A`)", "Yes (4th argument `[if_not_found]` returns custom text directly)"]]}, {"id": "CMP-28", "title": "28. Sort vs Filter in MS Excel", "category": "MS Office Suite", "headers": ["Parameter", "Sorting (Sort)", "Filtering (AutoFilter / Advanced Filter)"], "rows": [["Action on Rows", "Rearranges ALL rows in ascending (A–Z, Smallest to Largest) or descending order", "Temporarily HIDES rows that do not meet criteria while keeping matching rows visible"], ["Row Visibility", "Every row remains visible (only their sequence order changes)", "Non-matching rows are hidden (row numbers turn blue)"], ["Shortcut / Ribbon", "Data Tab -> Sort & Filter (`Alt + D + S`)", "Data Tab -> Filter (`Ctrl + Shift + L` toggles AutoFilter dropdown arrows)"]]}, {"id": "CMP-29", "title": "29. Slide Transition vs Object Animation in MS PowerPoint", "category": "MS Office Suite", "headers": ["Aspect", "Slide Transition", "Object Animation"], "rows": [["Target Element", "Applied to an **entire Slide** as it enters the screen during a presentation", "Applied to **individual objects ON a slide** (text box, shape, picture, chart)"], ["How Many per Target", "A slide can have only ONE Transition effect at a time", "A slide can have MULTIPLE animations, and a single object can have multiple animations (via 'Add Animation')"], ["Ribbon Tab & Categories", "`Transitions` Tab: Subtle, Exciting, Dynamic Content", "`Animations` Tab: Entrance (Green), Emphasis (Yellow), Exit (Red), Motion Paths"]]}, {"id": "CMP-30", "title": "30. Slide Layout vs Slide Master in MS PowerPoint", "category": "MS Office Suite", "headers": ["Feature", "Slide Layout", "Slide Master"], "rows": [["Scope of Control", "Controls placeholder arrangement (Title, Content, Two Content) for an individual slide type", "Top-level template controlling universal fonts, colors, background, and logos across ALL slides"], ["Where Accessed", "`Home` Tab -> Slides group -> `Layout`", "`View` Tab -> Master Views group -> `Slide Master`"], ["Best Used For", "Switching a single slide from 'Title and Content' to 'Comparison' or 'Blank'", "Adding a company/school logo or changing the title font across a 100-slide presentation in one step"]]}, {"id": "CMP-31", "title": "31. Header vs Footer in MS Word / Excel / PowerPoint", "category": "MS Office Suite", "headers": ["Parameter", "Header", "Footer"], "rows": [["Location on Page", "Printed in the **Top Margin** area of every page/section", "Printed in the **Bottom Margin** area of every page/section"], ["Default Margin Offset (Word)", "0.5 inches (1.27 cm) from the top edge of the page", "0.5 inches (1.27 cm) from the bottom edge of the page"], ["PowerPoint Note", "Slides do NOT have a traditional Header (they use Footer / Slide Number); Notes & Handouts have both Header and Footer", "Appears on both Slides (`Insert -> Header & Footer`) and Printed Handouts/Notes"]]}, {"id": "CMP-32", "title": "32. Footnote vs Endnote in MS Word", "category": "MS Office Suite", "headers": ["Dimension", "Footnote", "Endnote"], "rows": [["Placement Location", "Appears at the **bottom of the SAME page** where the reference mark is cited", "Appears together at the **very end of the Document** (or end of the Section)"], ["Default Numbering Format", "Arabic numerals (`1, 2, 3...`)", "Lowercase Roman numerals (`i, ii, iii...`)"], ["Ribbon Tab & Shortcut", "`References` Tab -> Footnotes group -> **`Ctrl + Alt + F`**", "`References` Tab -> Footnotes group -> **`Ctrl + Alt + D`**"]]}, {"id": "CMP-33", "title": "33. CC (Carbon Copy) vs BCC (Blind Carbon Copy) in Email", "category": "Computer Fundamentals", "headers": ["Aspect", "CC (Carbon Copy)", "BCC (Blind Carbon Copy)"], "rows": [["Visibility of Recipients", "Every recipient (`To`, `CC`, and `BCC`) can see the email addresses listed in `CC`", "Recipients in `To` and `CC` CANNOT see anyone listed in `BCC` (nor can BCC recipients see other BCCs)"], ["Reply All Behavior", "Clicking 'Reply All' sends the reply to `To` and `CC` recipients", "BCC recipients do NOT receive 'Reply All' messages sent by To/CC recipients"], ["Primary Use Case", "Keeping colleagues/supervisors transparently informed in the loop", "Protecting privacy of large mailing lists and preventing 'Reply All' storms"]]}], "confusingConcepts": [{"title": "1. Program Counter (PC) vs Instruction Register (IR) vs MAR vs MBR", "trap": "Candidates often pick Program Counter when asked which register holds the instruction currently being decoded.", "rule": "PC holds the address of the NEXT instruction to be fetched. IR holds the CURRENT instruction being decoded. MAR holds the memory address being read/written. MBR (or MDR) holds the data word read from or written to memory."}, {"title": "2. SRAM vs DRAM Volatility & Refreshing", "trap": "Thinking SRAM is non-volatile because it is called 'Static'.", "rule": "BOTH SRAM and DRAM are VOLATILE (both lose data when power turns off). 'Static' means SRAM does not need periodic electrical refreshing while power is ON (used for Cache), whereas 'Dynamic' (DRAM) uses leaky capacitors that must be refreshed thousands of times per second (used for Main RAM)."}, {"title": "3. EPROM vs EEPROM vs Flash Memory", "trap": "Confusing which ROM uses Ultraviolet light versus electrical pulses, and byte-level vs block-level erasure.", "rule": "EPROM uses UV-C light through a quartz window and erases the ENTIRE chip. EEPROM uses electrical voltage and erases byte-by-byte. Flash memory is a high-speed type of EEPROM that erases and writes in multi-KB blocks/sectors."}, {"title": "4. Freeware vs Shareware vs Open-Source (FOSS)", "trap": "Assuming 'Freeware' means op
