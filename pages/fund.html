rd's horizontal ruler: Top triangle = First Line Indent; Bottom-left triangle = Hanging Indent; Bottom square block = Left Paragraph Indent (moves First Line and Hanging markers together).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P33", "moduleCode": "P", "module": "P. MS Word", "topic": "Selection Techniques", "subtopic": "F8 Extend Selection & Sentence Click", "difficulty": "Difficult", "questionType": "MS Word Feature", "sourceType": "Exam-pattern Question", "question": "In MS Word, holding down `Ctrl` and left-clicking anywhere inside a sentence selects that entire sentence. What happens if you press the `F8` function key (Extend Selection mode) four times in succession?", "options": {"A": "Pressing `F8` once turns on Extend mode; 2nd press selects the current Word; 3rd press selects the Sentence; 4th press selects the entire Paragraph (5th press selects the entire Document)", "B": "It closes MS Word and shuts down Windows", "C": "It checks spelling four times", "D": "It zooms the page to 400%"}, "correctAnswer": "A", "explanation": "`F8` activates Extend Selection mode: 2x = Word, 3x = Sentence, 4x = Paragraph, 5x = Entire Document (`Esc` exits Extend mode).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P34", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Captions & Table of Figures", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "Under the `References` tab in MS Word, which feature adds numbered labels (such as `'Figure 1: System Architecture'` or `'Table 2: Results'`) below images or tables so they can be automatically compiled into a 'Table of Figures'?", "options": {"A": "Insert Caption", "B": "Mail Merge", "C": "Drop Cap", "D": "Format Painter"}, "correctAnswer": "A", "explanation": "`References -> Captions -> Insert Caption` attaches sequential labels (`Figure 1`, `Table 1`, `Equation 1`) that feed into `Insert Table of Figures` and `Cross-reference`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P35", "moduleCode": "P", "module": "P. MS Word", "topic": "Mail Merge", "subtopic": "Envelopes and Labels", "difficulty": "Easy", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "Under which Ribbon Tab in MS Word are the 'Envelopes' and 'Labels' creation buttons located?", "options": {"A": "`Mailings` Tab (`Create` group)", "B": "`Review` Tab", "C": "`References` Tab", "D": "`View` Tab"}, "correctAnswer": "A", "explanation": "The `Mailings` tab starts with the `Create` group containing 'Envelopes' and 'Labels', followed by 'Start Mail Merge'.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P36", "moduleCode": "P", "module": "P. MS Word", "topic": "Word File Formats", "subtopic": "Rich Text Format (.rtf)", "difficulty": "Easy", "questionType": "File Extension", "sourceType": "Original Practice Question", "question": "Which text file format supported by MS Word and Windows WordPad preserves basic text formatting (fonts, bold, colors, margins) across different operating systems and word processors without supporting macros?", "options": {"A": "`.txt` (Plain Text)", "B": "`.rtf` (Rich Text Format)", "C": "`.exe` (Executable)", "D": "`.csv` (Comma-Separated Values)"}, "correctAnswer": "B", "explanation": "`.rtf` (Rich Text Format) is a cross-platform document format that retains font styling, paragraph formatting, and images while `.txt` strips all formatting.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P37", "moduleCode": "P", "module": "P. MS Word", "topic": "Page Layout", "subtopic": "Hyphenation", "difficulty": "Easy", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "In MS Word (`Layout -> Page Setup -> Hyphenation`), what is the purpose of enabling Automatic Hyphenation?", "options": {"A": "It automatically splits long words across lines at syllable boundaries using a hyphen (`-`) to eliminate large unsightly gaps in justified or narrow-column text", "B": "It replaces all spaces in the document with hyphens", "C": "It checks spelling errors", "D": "It converts numbers into Roman numerals"}, "correctAnswer": "A", "explanation": "Hyphenation breaks long words at the end of a line with a hyphen so justified text and multi-column layouts look uniform without wide rivers of whitespace.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P38", "moduleCode": "P", "module": "P. MS Word", "topic": "Navigation", "subtopic": "Split Window & Navigation Pane", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Word (`View` tab), which feature divides the current document window horizontally into two independent scrolling panes so you can view and edit two distant parts of the same long document simultaneously?", "options": {"A": "`Split` Window (`Alt + Ctrl + S`)", "B": "`Mail Merge`", "C": "`Restrict Editing`", "D": "`Thesaurus`"}, "correctAnswer": "A", "explanation": "`View -> Split` (or `Ctrl + Alt + S`) splits the active document into two scrollable horizontal panes.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P39", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Protect Document & Restrict Editing", "difficulty": "Easy", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "If you want to lock an MS Word document with a password so nobody can open it without the password, or restrict users to 'Filling in forms' / 'Tracked changes only', which tools do you use?", "options": {"A": "`File -> Info -> Protect Document -> Encrypt with Password`, and `Review -> Protect -> Restrict Editing`", "B": "`Insert -> SmartArt`", "C": "`Home -> Clear All Formatting`", "D": "`View -> Macros`"}, "correctAnswer": "A", "explanation": "Backstage `File -> Info -> Protect Document` provides AES password encryption and 'Mark as Final', while `Review -> Restrict Editing` limits formatting and editing permissions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P40", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "Hyperlink vs Cross-Reference", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "How does an internal 'Cross-reference' (`Insert / References -> Cross-reference`) differ from a static 'Hyperlink' in MS Word?", "options": {"A": "A Cross-reference dynamically updates its displayed text/page number (e.g., `'See Table 3 on page 14'`) when you press `F9` if pages or headings move, whereas a normal Hyperlink has static display text", "B": "A Cross-reference can only open external YouTube videos", "C": "A Hyperlink cannot be clicked with `Ctrl + Click`", "D": "There is no difference"}, "correctAnswer": "A", "explanation": "Cross-references are dynamic Word fields linked to Headings, Bookmarks, Footnotes, or Captions (`Figure 1`, `Table 2`) that automatically recalculate page/item numbers when updated (`F9`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q01", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Invalid AVG Function", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Verified PYQ", "question": "Which of the following is an INVALID formula in MS Excel and will result in a `#NAME?` error?", "options": {"A": "`=SUM(A1:A6)`", "B": "`=AVG(A1:A6)`", "C": "`=AVERAGE(A1:A6)`", "D": "`=MAX(A1:A6)`"}, "correctAnswer": "B", "explanation": "There is NO built-in function named `AVG()` in MS Excel! Calculating the arithmetic mean requires spelling out the full function name `=AVERAGE(A1:A6)`. Typing `=AVG(A1:A6)` produces the `#NAME?` error.", "exam": "DSSSB TGT Computer Science", "year": 2017, "shift": "21 May 2017", "sourceReference": "Scribd / DSSSB TGT CS 2017 Official Paper"}, {"id": "MS-Q02", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Spreadsheet Classification", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Select the correct option to complete the following sentence: 'Microsoft Excel is a ______ application.'", "options": {"A": "Word Processing", "B": "Spreadsheet", "C": "Relational Database Server", "D": "System Firmware"}, "correctAnswer": "B", "explanation": "Microsoft Excel is an electronic Spreadsheet application used for organizing, calculating, analyzing, and charting tabular data.", "exam": "DSSSB PGT / TGT Exam", "year": 2024, "shift": "March 2024", "sourceReference": "Testbook Official PYQ"}, {"id": "MS-Q03", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Absolute Reference Definition", "difficulty": "Easy", "questionType": "Excel Cell Reference", "sourceType": "Verified PYQ", "question": "Which cell reference type in MS Excel remains completely fixed (neither the column letter nor the row number changes) even when the formula is copied or dragged to another cell?", "options": {"A": "Relative Reference (`A1`)", "B": "Absolute Reference (`$A$1`)", "C": "Mixed Reference (`$A1`)", "D": "Circular Reference"}, "correctAnswer": "B", "explanation": "An Absolute Reference locks both the column and the row using two dollar signs (`$A$1`), so copying the cell anywhere leaves `$A$1` unchanged.", "exam": "KVS / NVS TGT ICT", "year": 2024, "shift": "Shift 1", "sourceReference": "Testbook Official PYQ"}, {"id": "MS-Q04", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Rows and Columns Count", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "In MS Excel 2007, 2010, 2016, 2019, 2021, and Microsoft 365, what are the total number of Rows and Columns in a single worksheet, and what is the cell address of the very last cell at the bottom-right corner?", "options": {"A": "1,048,576 Rows and 16,384 Columns; Last cell is `XFD1048576`", "B": "65,536 Rows and 256 Columns; Last cell is `IV65536`", "C": "1,000,000 Rows and 10,000 Columns; Last cell is `ZZZ1000000`", "D": "524,288 Rows and 8,192 Columns; Last cell is `ABC524288`"}, "correctAnswer": "A", "explanation": "Modern Excel (2007+) worksheets contain $2^{20} = 1,048,576$ rows and $2^{14} = 16,384$ columns (`A` through `XFD`), making the bottom-right cell `XFD1048576`. (Excel 2003 had 65,536 rows x 256 columns up to `IV65536`.)", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q05", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Entry and Formatting", "subtopic": "Default Cell Alignments", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Adapted PYQ", "question": "When you type data into an unformatted cell in MS Excel, what is the default horizontal alignment of (1) Text, (2) Numbers/Dates, and (3) Logical values (`TRUE` / `FALSE`) or Error values?", "options": {"A": "Text = Left-aligned; Numbers/Dates = Right-aligned; Logical/Errors = Center-aligned", "B": "Text = Right-aligned; Numbers/Dates = Left-aligned; Logical/Errors = Left-aligned", "C": "All data types are Left-aligned by default", "D": "Text = Center-aligned; Numbers = Right-aligned; Logical = Left-aligned"}, "correctAnswer": "A", "explanation": "By default in Excel: Text aligns to the Left; Numbers, Dates, and Times align to the Right; Boolean values (`TRUE`/`FALSE`) and Error values (`#DIV/0!`, `#N/A`, etc.) align to the Center.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q06", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Mixed Reference Copying", "difficulty": "Difficult", "questionType": "Excel Cell Reference", "sourceType": "Adapted PYQ", "question": "In an MS Excel worksheet, cell `C3` contains the formula `=$A3 + B$2`. If this formula is copied and pasted into cell `E7` (2 columns to the right and 4 rows down), what will the formula in cell `E7` become?", "options": {"A": "`=$A7 + D$2`", "B": "`=$C7 + D$6`", "C": "`=$A3 + B$2`", "D": "`=C7 + D$2`"}, "correctAnswer": "A", "explanation": "Moving from `C3` to `E7` is $+2$ columns (`C -> E`) and $+4$ rows (`3 -> 7`). In `$A3`, Column A is locked (`$A`) and row `3` shifts $+4$ to `7` (`$A7`). In `B$2`, column `B` shifts $+2$ to `D` and Row 2 is locked (`$2`), giving `D$2`. Final formula: `=$A7 + D$2`.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "MS-Q07", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "COUNT vs COUNTA vs COUNTBLANK", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Adapted PYQ", "question": "Suppose cells `A1` to `A5` in MS Excel contain: `A1 = 25`, `A2 = \"Pass\"`, `A3 = TRUE`, `A4 = 0`, and `A5` is completely blank. What are the outputs of `=COUNT(A1:A5)`, `=COUNTA(A1:A5)`, and `=COUNTBLANK(A1:A5)` respectively?", "options": {"A": "`COUNT = 2`, `COUNTA = 4`, `COUNTBLANK = 1`", "B": "`COUNT = 3`, `COUNTA = 5`, `COUNTBLANK = 0`", "C": "`COUNT = 4`, `COUNTA = 4`, `COUNTBLANK = 1`", "D": "`COUNT = 1`, `COUNTA = 3`, `COUNTBLANK = 2`"}, "correctAnswer": "A", "explanation": "`COUNT(A1:A5)` counts ONLY numeric cells (`25` and `0` -> 2). `COUNTA(A1:A5)` counts all non-empty cells (`25`, `\"Pass\"`, `TRUE`, `0` -> 4). `COUNTBLANK(A1:A5)` counts empty cells (`A5` -> 1).", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q08", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "ROUND Negative Digits", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Adapted PYQ", "question": "What is the exact output of the MS Excel formula `=ROUND(1864.75, -2)`?", "options": {"A": "`1864.8`", "B": "`1900`", "C": "`1860`", "D": "`#NUM!`"}, "correctAnswer": "B", "explanation": "When the second argument `num_digits` in `ROUND(number, num_digits)` is negative (`-2`), Excel rounds 2 places to the LEFT of the decimal point (i.e., to the nearest hundred). Since 1864.75 is closer to 1900 than 1800, it returns `1900`.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q09", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "INT vs TRUNC on Negative Numbers", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "What values are returned by the MS Excel formulas `=INT(-6.4)` and `=TRUNC(-6.4)` respectively?", "options": {"A": "`INT(-6.4) = -7` and `TRUNC(-6.4) = -6`", "B": "`INT(-6.4) = -6` and `TRUNC(-6.4) = -6`", "C": "`INT(-6.4) = -6` and `TRUNC(-6.4) = -7`", "D": "`INT(-6.4) = 6` and `TRUNC(-6.4) = -6`"}, "correctAnswer": "A", "explanation": "`INT()` rounds a number DOWN toward negative infinity to the nearest integer less than or equal to the input (`-7 <= -6.4`), whereas `TRUNC()` simply chops off the fractional part toward zero (`-6`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q10", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "MOD Function with Negatives", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "In MS Excel, `MOD(n, d)` is defined as `n - d * INT(n/d)`. What are the outputs of `=MOD(19, 5)` and `=MOD(-7, 3)` respectively?", "options": {"A": "`4` and `2`", "B": "`4` and `-1`", "C": "`3` and `2`", "D": "`4` and `-2`"}, "correctAnswer": "A", "explanation": "`MOD(19, 5)` = remainder of $19 / 5 = 4$. For `MOD(-7, 3)`: `-7 - 3 * INT(-7/3) = -7 - 3 * INT(-2.333) = -7 - 3 * (-3) = -7 + 9 = 2`. (In Excel, `MOD` always takes the sign of the divisor `d`!)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q11", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Operator Precedence Evaluation", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Adapted PYQ", "question": "What value will MS Excel return for the formula `=10 + 2 * 3 ^ 2 - 8 / 4`?", "options": {"A": "`26`", "B": "`106`", "C": "`34`", "D": "`16`"}, "correctAnswer": "A", "explanation": "By Excel operator precedence: 1st Exponentiation `3^2 = 9`; 2nd Multiplication & Division left-to-right `2 * 9 = 18` and `8 / 4 = 2`; 3rd Addition & Subtraction left-to-right `10 + 18 - 2 = 26`.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "MS-Q12", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Error Values", "subtopic": "Identify ##### vs #REF! vs #NAME?", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Adapted PYQ", "question": "Match each MS Excel display/error indicator with its exact cause:\n1. `#####` — (p) Formula divides a number by zero or an empty cell\n2. `#NAME?` — (q) A referenced cell or row/column was deleted\n3. `#REF!` — (r) The column is not wide enough to display the number, or a negative date/time was calculated\n4. `#DIV/0!` — (s) Misspelled function name (e.g., `=SUMA(A1:A5)`) or unquoted text in a formula", "options": {"A": "1-r, 2-s, 3-q, 4-p", "B": "1-s, 2-r, 3-q, 4-p", "C": "1-r, 2-q, 3-s, 4-p", "D": "1-p, 2-s, 3-q, 4-r"}, "correctAnswer": "A", "explanation": "`#####` = Column too narrow or negative date (r); `#NAME?` = Unrecognized function/range name (s); `#REF!` = Deleted cell reference (q); `#DIV/0!` = Division by zero (p).", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q13", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Error Values", "subtopic": "#NULL! Intersection Error", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "In MS Excel, the Space character (` `) between two cell ranges acts as the 'Intersection Operator'. What will the formula `=SUM(A1:A5 B1:B5)` return?", "options": {"A": "`#NULL!` (because Column A and Column B do not intersect/overlap)", "B": "`#VALUE!`", "C": "The sum of all 10 cells in A1:B5", "D": "`0`"}, "correctAnswer": "A", "explanation": "Because `A1:A5` and `B1:B5` share zero overlapping cells, the space intersection operator `A1:A5 B1:B5` evaluates to an empty intersection and returns the `#NULL!` error.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q14", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Error Values", "subtopic": "#VALUE! vs #NUM! vs #N/A", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "What are the results of the three MS Excel formulas: (1) `=\"Hello\" + 10`, (2) `=SQRT(-25)`, and (3) `=VLOOKUP(999, A2:C10, 2, FALSE)` when `999` does not exist in `A2:A10`?", "options": {"A": "(1) `#VALUE!`, (2) `#NUM!`, (3) `#N/A`", "B": "(1) `#NAME?`, (2) `#DIV/0!`, (3) `#REF!`", "C": "(1) `Hello10`, (2) `-5`, (3) `0`", "D": "(1) `#NUM!`, (2) `#VALUE!`, (3) `#NULL!`"}, "correctAnswer": "A", "explanation": "Adding a non-numeric text string `\"Hello\"` with `+` causes `#VALUE!` (wrong operand type); square root of a negative number `=SQRT(-25)` causes `#NUM!` (invalid mathematical domain); and a lookup value missing from the lookup column returns `#N/A` (Value Not Available).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q15", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "FIND vs SEARCH", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "Given cell `A1` contains `\"DSSSB Exam\"`, what do `=FIND(\"e\", A1)` and `=SEARCH(\"e\", A1)` return?", "options": {"A": "`FIND` returns `#VALUE!` (because FIND is case-sensitive), whereas `SEARCH` returns `7` (because SEARCH is case-insensitive)", "B": "Both return `7`", "C": "`FIND` returns `7`, whereas `SEARCH` returns `#VALUE!`", "D": "Both return `#NAME?`"}, "correctAnswer": "A", "explanation": "`FIND` is strictly case-sensitive (so searching for lowercase `\"e\"` in `\"DSSSB Exam\"` fails with `#VALUE!`), while `SEARCH` is case-insensitive and finds `'E'` at position 7 (1-indexed including space).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q16", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "LEFT, RIGHT, MID, LEN", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "If cell `A1` contains the text `\"SPREADSHEET\"`, what is the output of `=MID(A1, 7, 5)` and `=LEN(A1)`?", "options": {"A": "`\"SHEET\"` and `11`", "B": "`\"READS\"` and `10`", "C": "`\"SHEET\"` and `12`", "D": "`\"SPREA\"` and `11`"}, "correctAnswer": "A", "explanation": "In `\"SPREADSHEET\"` (11 letters): Position 7 is `'S'`, and extracting 5 characters from position 7 gives `\"SHEET\"`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q17", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "TRIM and PROPER", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "What is the exact output of the nested MS Excel formula `=PROPER(TRIM(\"   ms   excel   lab   \"))`?", "options": {"A": "`\"Ms Excel Lab\"`", "B": "`\"MS EXCEL LAB\"`", "C": "`\"   Ms   Excel   Lab   \"`", "D": "`\"msexcellab\"`"}, "correctAnswer": "A", "explanation": "`TRIM()` removes leading and trailing spaces and reduces multiple internal spaces to single spaces (`\"ms excel lab\"`), and `PROPER()` capitalizes the first letter of each word (`\"Ms Excel Lab\"`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q18", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "SUBSTITUTE vs REPLACE", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "What are the outputs of `=SUBSTITUTE(\"2024-05-2024\", \"2024\", \"2025\", 2)` and `=REPLACE(\"ABCDEF\", 3, 2, \"99\")` in MS Excel?", "options": {"A": "`\"2024-05-2025\"` and `\"AB99EF\"`", "B": "`\"2025-05-2025\"` and `\"99CDEF\"`", "C": "`\"2025-05-2024\"` and `\"ABCD99\"`", "D": "`#VALUE!` and `#NAME?`"}, "correctAnswer": "A", "explanation": "In `SUBSTITUTE(text, old, new, [instance_num])`, the 4th argument `2` replaces ONLY the 2nd occurrence of `\"2024\"`, giving `\"2024-05-2025\"`. In `REPLACE(\"ABCDEF\", 3, 2, \"99\")`, starting at position 3 (`'C'`), 2 characters (`\"CD\"`) are replaced with `\"99\"`, giving `\"AB99EF\"`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q19", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Nested IF Evaluation", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "If cell `B2 = 72`, what will the formula `=IF(B2>=85, \"Grade A\", IF(B2>=70, \"Grade B\", IF(B2>=50, \"Grade C\", \"Fail\")))` return?", "options": {"A": "`\"Grade A\"`", "B": "`\"Grade B\"`", "C": "`\"Grade C\"`", "D": "`\"Fail\"`"}, "correctAnswer": "B", "explanation": "First test `72 >= 85` is FALSE, so Excel evaluates the `value_if_false` branch: `IF(72>=70, \"Grade B\", ...)`. Since `72 >= 70` is TRUE, it immediately returns `\"Grade B\"`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q20", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "IFS Function (2019+)", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "Introduced in Excel 2019 / Microsoft 365 to simplify nested `IF` statements, how does `=IFS(A1>80, \"High\", A1>50, \"Medium\", TRUE, \"Low\")` behave when `A1 = 85`?", "options": {"A": "It returns `\"High\"` (corresponding to the FIRST condition that evaluates to TRUE)", "B": "It returns both `\"High\"` and `\"Medium\"`", "C": "It returns `\"Low\"`", "D": "It throws a `#VALUE!` error"}, "correctAnswer": "A", "explanation": "`IFS()` tests pairs of `(condition, value)` in left-to-right order and returns the value associated with the VERY FIRST condition that evaluates to `TRUE`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q21", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "SUM with Logical Literal vs Cell", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "In MS Excel, if cell `A1 = 10`, cell `A2 = 20`, and cell `A3 = TRUE`, then `=SUM(A1:A3)` returns `30` (ignoring `TRUE` inside the cell range). However, what does `=SUM(10, 20, TRUE)` return when `TRUE` is passed directly as an inline argument?", "options": {"A": "`31` (because inline logical argument `TRUE` is coerced to `1`, whereas `TRUE` inside a cell range `A1:A3` is ignored)", "B": "`30`", "C": "`#VALUE!`", "D": "`TRUE`"}, "correctAnswer": "A", "explanation": "Crucial Excel Exam Trap: Inside a cell range (`A1:A3`), `SUM`, `AVERAGE`, and `COUNT` ignore logical values (`TRUE`/`FALSE`) and text numbers. When typed directly as inline arguments into `=SUM(10, 20, TRUE)`, Excel coerces `TRUE` to `1` (`FALSE` to `0`), returning $10 + 20 + 1 = 31$!", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q22", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "AVERAGE vs AVERAGEA", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "Suppose cells `A1:A4` contain `10`, `20`, `TRUE`, and `\"Absent\"`. What do `=AVERAGE(A1:A4)` and `=AVERAGEA(A1:A4)` return?", "options": {"A": "`AVERAGE = 15` (computes $(10+20)/2$), whereas `AVERAGEA = 7.75` (includes `TRUE` as `1` and text `\"Absent\"` as `0`, computing $(10+20+1+0)/4 = 7.75$)", "B": "Both return `15`", "C": "Both return `#VALUE!`", "D": "`AVERAGE = 7.75` and `AVERAGEA = 15`"}, "correctAnswer": "A", "explanation": "`AVERAGE` ignores text and logicals (`(10+20)/2 = 15`). `AVERAGEA` ('Average All') evaluates `TRUE` as `1`, `FALSE` as `0`, and any text string as `0` (`(10+20+1+0)/4 = 7.75`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q23", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Lookup Functions VLOOKUP", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Adapted PYQ", "question": "In the formula `=VLOOKUP(105, B2:F50, 4, FALSE)`, which column of the table does Excel search for `105`, which column's value does it return, and what does `FALSE` specify?", "options": {"A": "Searches Column B (the 1st column of `B2:F50`); returns the value from the 4th column of `B2:F50` (Column E); `FALSE` specifies an Exact Match", "B": "Searches Column F; returns Column B; `FALSE` means approximate match", "C": "Searches Row 2; returns Row 4; `FALSE` means case-sensitive", "D": "Searches Column D; returns Column E; `FALSE` sorts the table"}, "correctAnswer": "A", "explanation": "`VLOOKUP` always searches the 1st (leftmost) column of `table_array` (`B2:F50`, i.e., Column B), counts 4 columns across (`B=1, C=2, D=3, E=4`), and `FALSE` (`0`) enforces an Exact Match.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q24", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "XLOOKUP Advantages", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which of the following is TRUE regarding `XLOOKUP()` (available in Excel 2021 and Microsoft 365) compared to traditional `VLOOKUP()`?", "options": {"A": "XLOOKUP can look to the left (or above), defaults to an Exact Match without needing a 4th argument, and includes a built-in `[if_not_found]` argument", "B": "XLOOKUP can only search sorted numbers in Column A", "C": "XLOOKUP requires pressing Ctrl+Shift+Enter", "D": "XLOOKUP was introduced in Excel 2003"}, "correctAnswer": "A", "explanation": "`XLOOKUP(lookup_value, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])` overcomes all major limitations of `VLOOKUP`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q25", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "INDEX and MATCH Combination", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "Given `A2:A5 = {\"Pen\", \"Book\", \"Eraser\", \"Ruler\"}` and `B2:B5 = {20, 150, 10, 30}`, what does `=INDEX(A2:A5, MATCH(MIN(B2:B5), B2:B5, 0))` return?", "options": {"A": "`\"Eraser\"`", "B": "`10`", "C": "`3`", "D": "`\"Book\"`"}, "correctAnswer": "A", "explanation": "Step 1: `MIN(B2:B5)` finds the lowest price = `10`. Step 2: `MATCH(10, B2:B5, 0)` finds the position of `10` in `B2:B5` = `3`. Step 3: `INDEX(A2:A5, 3)` returns the 3rd item in `A2:A5` = `\"Eraser\"`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q26", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Date Serial System", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "How does MS Excel internally store Dates and Times so that users can add or subtract days mathematically (e.g., `=B2 - A2`)?", "options": {"A": "Dates are stored as sequential integer serial numbers starting with `1 = January 1, 1900`, and Times are stored as decimal fractions of a 24-hour day (e.g., `0.5 = 12:00 PM Noon`)", "B": "Dates are stored as ASCII strings that cannot be subtracted", "C": "Dates start from January 1, 2000 as negative numbers", "D": "Times are stored in Roman numerals"}, "correctAnswer": "A", "explanation": "In Windows Excel's 1900 date system, `1` represents `1900-01-01`, and `0.5` represents 12 hours (`12:00 PM`), `0.25` = `6:00 AM`, `0.75` = `6:00 PM`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q27", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "TODAY vs NOW vs Ctrl+;", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "What is the difference between typing `=TODAY()` in an Excel cell and pressing the keyboard shortcut `Ctrl + ;` (Ctrl + Semicolon)?", "options": {"A": "`=TODAY()` is a volatile dynamic formula that updates automatically whenever the workbook is opened/recalculated, whereas `Ctrl + ;` inserts a static snapshot of today's date that does not change tomorrow", "B": "Both insert the current time in hours and minutes", "C": "`Ctrl + ;` deletes the current row", "D": "`=TODAY()` requires passing the current year inside parentheses"}, "correctAnswer": "A", "explanation": "`=TODAY()` (date) and `=NOW()` (date + time) are dynamic volatile functions with zero arguments; `Ctrl + ;` (static date) and `Ctrl + Shift + :` (static time) insert fixed values.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q28", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "EOMONTH and DATEDIF", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "What does the MS Excel formula `=EOMONTH(\"2025-02-10\", 0)` return?", "options": {"A": "`2025-02-28` (the last day of February 2025, since `months = 0` means the same month)", "B": "`2025-02-01`", "C": "`2025-03-10`", "D": "`10`"}, "correctAnswer": "A", "explanation": "`EOMONTH(start_date, months)` returns the serial date of the last day of the month `months` before or after `start_date`. With `0`, it returns the end of February 2025 (`2025-02-28`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q29", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Entry and Formatting", "subtopic": "Force Number as Text Apostrophe", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "If you type a 6-digit postal code or roll number with leading zeros such as `001452` into a General-formatted Excel cell, Excel strips the leading zeros and displays `1452`. Which single character can you type at the very beginning of the entry so Excel keeps `001452` as Left-aligned Text?", "options": {"A": "A single quote / apostrophe (`'001452`)", "B": "An equal sign (`=001452`)", "C": "A dollar sign (`$001452`)", "D": "A hash symbol (`#001452`)"}, "correctAnswer": "A", "explanation": "Prefixing an entry with a single apostrophe (`'`) tells Excel to treat the entry strictly as a text string, preserving leading zeros (`001452`) and displaying a formula as literal text.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q30", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Name Box vs Formula Bar", "difficulty": "Easy", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In the MS Excel interface directly below the Ribbon, what is displayed in the 'Name Box' (on the left) versus the 'Formula Bar' (`fx`, on the right) when cell `D4` containing `=SUM(D1:D3)` is selected?", "options": {"A": "Name Box displays `D4` (the active cell address); Formula Bar displays `=SUM(D1:D3)` (while the cell itself on the grid displays the calculated sum)", "B": "Name Box displays `=SUM(D1:D3)`; Formula Bar displays `D4`", "C": "Both display `Book1.xlsx`", "D": "Name Box displays the sheet tab name `Sheet1`"}, "correctAnswer": "A", "explanation": "The Name Box shows the active cell's address (`D4`) or Named Range; the Formula Bar shows the underlying formula (`=SUM(D1:D3)`), while the cell on the worksheet grid displays the evaluated result.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q31", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Edit Cell & New Line Inside Cell", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Excel, which function key puts the active cell into 'Edit Mode' (placing the cursor at the end of the cell's contents), and which key combination inserts a 'New Line (Line Break)' inside the SAME cell?", "options": {"A": "Edit Mode: `F2`; New line inside same cell: `Alt + Enter`", "B": "Edit Mode: `F5`; New line inside same cell: `Shift + Enter`", "C": "Edit Mode: `F4`; New line inside same cell: `Ctrl + Enter`", "D": "Edit Mode: `F1`; New line inside same cell: `Tab`"}, "correctAnswer": "A", "explanation": "Pressing `F2` activates in-cell editing; pressing `Alt + Enter` wraps text onto a new line within the same Excel cell.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS Official Paper"}, {"id": "MS-Q32", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Ctrl+Enter Multi-Cell Fill", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "Suppose you select a range of 20 empty cells (`B2:E6`) in MS Excel, type `\"Present\"` into the active cell, and press `Ctrl + Enter` instead of `Enter`. What happens?", "options": {"A": "Excel fills ALL 20 selected cells in `B2:E6` simultaneously with the word `\"Present\"`", "B": "Excel inserts a page break", "C": "Excel deletes the selected range", "D": "Excel opens a web browser"}, "correctAnswer": "A", "explanation": "In MS Excel, pressing `Ctrl + Enter` after typing a value or formula enters that content into every cell of the currently selected range at once.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q33", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Cross-Sheet & Cross-Workbook Syntax", "difficulty": "Moderate", "questionType": "Excel Cell Reference", "sourceType": "Exam-pattern Question", "question": "In MS Excel, what is the correct syntax to reference cell `B10` located on another worksheet named `Summary` (and on a worksheet named `Q1 Sales` that contains a space) within the same workbook?", "options": {"A": "`=Summary!B10` and `='Q1 Sales'!B10` (using an exclamation mark `!` between the sheet name and cell address)", "B": "`=Summary:B10` and `=Q1 Sales:B10`", "C": "`=Summary#B10`", "D": "`=Summary->B10`"}, "correctAnswer": "A", "explanation": "Cross-sheet references always separate the worksheet name from the cell coordinate using an exclamation mark (`!`). If the sheet name contains spaces, single quotes `'...'` enclose the sheet name (`'Q1 Sales'!B10`). External workbooks use square brackets: `[Budget.xlsx]Summary!B10`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q34", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Reference Operators (: , Space)", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "MS Excel supports three Reference Operators. What do the Colon (`:`), the Comma (`,`), and the Space (` `) represent in `=SUM(A1:A5, C1:C5)` vs `=SUM(A1:C5 B2:D6)`?", "options": {"A": "Colon (`:`) = Range operator; Comma (`,`) = Union operator; Space (` `) = Intersection operator", "B": "Colon (`:`) = Division; Comma (`,`) = Decimal point; Space (` `) = Concatenation", "C": "Colon (`:`) = Intersection; Comma (`,`) = Range; Space (` `) = Union", "D": "All three mean addition"}, "correctAnswer": "A", "explanation": "In Excel references: `:` (Colon) defines a contiguous range (`A1:A5`); `,` (Comma) is the Union operator combining multiple references; ` ` (Space) is the Intersection operator returning cells common to both ranges (`B2:C5`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q35", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "What-If Analysis Tools", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "Under `Data -> Forecast -> What-If Analysis` in MS Excel, which tool works BACKWARD from a desired formula output (e.g., 'I want my monthly EMI in cell B6 to be exactly ₹15,000') to automatically find the required value of a single input cell (e.g., 'What maximum loan amount in B1 can I borrow')?", "options": {"A": "PivotTable", "B": "Goal Seek", "C": "Flash Fill", "D": "Consolidate"}, "correctAnswer": "B", "explanation": "The 3 What-If Analysis tools are Scenario Manager, Goal Seek, and Data Table. Goal Seek adjusts a single input cell ('By changing cell') until a target formula cell ('Set cell') reaches a specific value ('To value').", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q36", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "Flash Fill Shortcut & Function", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "Introduced in MS Excel 2013, which feature automatically recognizes a pattern in your data entry (such as extracting first names from full names in an adjacent column) and fills the rest of the column when you press `Ctrl + E`?", "options": {"A": "AutoSum", "B": "Flash Fill (`Ctrl + E`)", "C": "Freeze Panes", "D": "Goal Seek"}, "correctAnswer": "B", "explanation": "Flash Fill (`Data -> Flash Fill` or `Ctrl + E`) uses pattern recognition to split, combine, or reformat text columns automatically without writing formulas.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q37", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Freeze Panes Behavior", "difficulty": "Easy", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "If you select cell `B3` in an MS Excel worksheet and click `View -> Freeze Panes -> Freeze Panes`, which rows and columns will be frozen (locked in place while scrolling)?", "options": {"A": "Rows 1 and 2 (above Row 3) AND Column A (to the left of Column B) will be frozen", "B": "Only Row 3 and Column B will be frozen", "C": "The entire worksheet will become read-only", "D": "Only Row 1 will be frozen"}, "correctAnswer": "A", "explanation": "'Freeze Panes' freezes all rows ABOVE the active cell (`Rows 1–2` above `B3`) and all columns TO THE LEFT of the active cell (`Column A` left of `B3`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q38", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "PivotTable Four Drop Areas", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "When building a PivotTable in MS Excel, the 'PivotTable Fields' pane contains four layout drop zones at the bottom. What are the names of these four areas?", "options": {"A": "Filters, Columns, Rows, and Values (`Σ Values`)", "B": "Header, Footer, Left, and Right", "C": "Input, Process, Output, and Storage", "D": "Select, From, Where, and Group By"}, "correctAnswer": "A", "explanation": "The four PivotTable field drop zones are Filters (Report Filter), Columns (Column Labels), Rows (Row Labels), and Σ Values.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q39", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "Slicers in Excel", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In MS Excel (2010 and later), what is a 'Slicer' (`Insert -> Filters -> Slicer`)?", "options": {"A": "A formula that divides text into characters", "B": "A visual on-screen panel of clickable buttons used to filter data in PivotTables and Excel Tables interactively", "C": "A tool that splits a workbook into separate `.csv` files", "D": "A chart type that looks like a sliced pie"}, "correctAnswer": "B", "explanation": "Slicers provide user-friendly, clickable buttons on the worksheet canvas that filter PivotTables, PivotCharts, and Excel Tables and clearly show the current filter state.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q40", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "Text to Columns vs Consolidate", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "You paste a list of full addresses formatted as `'New Delhi, Delhi, 110001'` into Column A of MS Excel and want to split the City, State, and PIN Code into three separate columns (Columns A, B, and C) using the comma `,` as a delimiter. Which `Data` tab tool should you use?", "options": {"A": "Text to Columns", "B": "Remove Duplicates", "C": "Merge & Center", "D": "Wrap Text"}, "correctAnswer": "A", "explanation": "`Data -> Data Tools -> Text to Columns` splits a single column of text into multiple columns based on a Delimiter (comma, tab, space, semicolon) or Fixed Width.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q41", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "DataEntry and Formatting", "subtopic": "Merge & Center Data Loss", "difficulty": "Moderate", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "If cells `A1`, `B1`, and `C1` contain `'Jan'`, `'Feb'`, and `'Mar'` respectively, and you select `A1:C1` and click 'Merge & Center' on the Home tab, what happens to the data?", "options": {"A": "Excel warns you and keeps ONLY the upper-left value (`'Jan'` from `A1`), discarding `'Feb'` and `'Mar'`", "B": "Excel concatenates them into `'Jan Feb Mar'`", "C": "Excel adds them numerically", "D": "Excel creates three new worksheets"}, "correctAnswer": "A", "explanation": "Merging multiple cells that contain data retains ONLY the value in the upper-leftmost cell (`A1`) and deletes the values in all other merged cells.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q42", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Charts and Visualization", "subtopic": "Chart Types & Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Excel, after selecting a data range (`A1:B6`), pressing `Alt + F1` inserts an embedded chart directly on the current worksheet. Which function key inserts the chart on its own dedicated 'Chart Sheet' (`Chart1`)?", "options": {"A": "`F11` (whereas `Shift + F11` inserts a new blank Worksheet)", "B": "`F5`", "C": "`F7`", "D": "`F12`"}, "correctAnswer": "A", "explanation": "Pressing `F11` creates a new separate Chart Sheet for the selected data, while `Alt + F1` embeds the chart on the active worksheet. Pressing `Shift + F11` inserts a new blank Worksheet.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-Q43", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Charts and Visualization", "subtopic": "Choosing Chart Types", "difficulty": "Easy", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the MS Excel Chart type with its ideal data visualization use case:\n1. Line Chart — (p) Showing proportional percentages of a whole (100% total) for a single data series\n2. Pie Chart — (q) Showing continuous trends over time (months, quarters, years)\n3. XY (Scatter) Chart — (r) Comparing discrete values across categories using vertical bars\n4. Column Chart — (s) Plotting pairs of numerical `(X, Y)` coordinates to analyze correlation in scientific/statistical data", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "Line chart = time trends (q); Pie chart = parts of a whole for 1 series (p); XY Scatter = numerical correlation between two variables (s); Column chart = vertical category comparisons (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q44", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Row and Column Selection Shortcuts", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Excel, which keyboard shortcut selects the ENTIRE ROW of the active cell, and which shortcut selects the ENTIRE COLUMN of the active cell?", "options": {"A": "Entire Row: `Shift + Spacebar`; Entire Column: `Ctrl + Spacebar`", "B": "Entire Row: `Ctrl + Spacebar`; Entire Column: `Shift + Spacebar`", "C": "Entire Row: `Alt + R`; Entire Column: `Alt + C`", "D": "Entire Row: `Ctrl + R`; Entire Column: `Ctrl + C`"}, "correctAnswer": "A", "explanation": "In MS Excel: `Shift + Spacebar` selects the entire current row; `Ctrl + Spacebar` selects the entire current column; `Ctrl + Shift + Spacebar` (or `Ctrl + A`) selects the entire worksheet.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS Official Paper"}, {"id": "MS-Q45", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Formula Fundamentals", "subtopic": "Show Formulas Shortcut", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "When auditing an MS Excel worksheet, which keyboard shortcut toggles every cell between showing its calculated result and showing its underlying formula string (e.g., `=SUM(B2:B10)`)?", "options": {"A": "`Ctrl + ~` (Ctrl + Grave Accent / Tilde key, located above Tab)", "B": "`Ctrl + F`", "C": "`Alt + =`", "D": "`Ctrl + Shift + L`"}, "correctAnswer": "A", "explanation": "`Ctrl + ~` (Ctrl + Grave Accent) toggles 'Show Formulas' mode (`Formulas -> Formula Auditing -> Show Formulas`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q46", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Error Values", "subtopic": "Circular Reference", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "If you type the formula `=A1 + A2 + A3` directly inside cell `A3`, MS Excel displays a warning because the formula refers back to its own cell (`A3`). What is this called?", "options": {"A": "A Circular Reference", "B": "An Absolute Reference", "C": "A 3D Reference", "D": "A Mixed Reference"}, "correctAnswer": "A", "explanation": "When a formula refers directly or indirectly to the cell in which the formula itself resides, it creates an endless loop called a Circular Reference.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q47", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "COUNTIF and SUMIF", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "Suppose cells `B2:B6` contain marks `{45, 82, 91, 38, 76}`. What will the formula `=COUNTIF(B2:B6, \">=75\")` return?", "options": {"A": "`3` (since 82, 91, and 76 are >= 75)", "B": "`2`", "C": "`5`", "D": "`249`"}, "correctAnswer": "A", "explanation": "`COUNTIF(range, criteria)` counts how many cells in `B2:B6` satisfy `\">=75\"`. The values `82`, `91`, and `76` match, so it returns `3`. (`=SUMIF(B2:B6, \">=75\")` would sum them to `249`.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q48", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "LARGE and SMALL Functions", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "If range `A1:A5` contains `{15, 40, 10, 55, 25}`, what do `=LARGE(A1:A5, 2)` and `=SMALL(A1:A5, 3)` return?", "options": {"A": "`LARGE(A1:A5, 2) = 40` (2nd largest value) and `SMALL(A1:A5, 3) = 25` (3rd smallest value)", "B": "`55` and `10`", "C": "`2` and `3`", "D": "`#NUM!`"}, "correctAnswer": "A", "explanation": "`LARGE(array, k)` returns the $k$-th largest value (sorted descending: 55, 40 -> 2nd largest is `40`). `SMALL(array, k)` returns the $k$-th smallest value (sorted ascending: 10, 15, 25 -> 3rd smallest is `25`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q49", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "CHOOSE Function", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "What is the output of the MS Excel formula `=CHOOSE(3, \"Gold\", \"Silver\", \"Bronze\", \"Merit\")`?", "options": {"A": "`\"Bronze\"` (returns the 3rd value from the list following `index_num = 3`)", "B": "`\"Silver\"`", "C": "`3`", "D": "`\"Merit\"`"}, "correctAnswer": "A", "explanation": "`CHOOSE(index_num, value1, value2, value3, ...)` uses `index_num` (`3`) to pick and return the 3rd item from the value arguments (`\"Bronze\"`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q50", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "EXACT Function", "difficulty": "Easy", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "In MS Excel, while the comparison formula `=\"excel\" = \"EXCEL\"` returns `TRUE` (case-insensitive), what does the function `=EXACT(\"excel\", \"EXCEL\")` return?", "options": {"A": "`FALSE` (because `EXACT` performs a strict CASE-SENSITIVE comparison of two text strings)", "B": "`TRUE`", "C": "`0`", "D": "`#VALUE!`"}, "correctAnswer": "A", "explanation": "The `=` operator in Excel is case-insensitive for strings, whereas `=EXACT(text1, text2)` is strictly case-sensitive and returns `FALSE` when letter casing differs.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q51", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "CEILING and FLOOR", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "What do the MS Excel formulas `=CEILING(23, 5)` and `=FLOOR(23, 5)` return?", "options": {"A": "`CEILING(23, 5) = 25` (rounds UP to the nearest multiple of 5) and `FLOOR(23, 5) = 20` (rounds DOWN to the nearest multiple of 5)", "B": "`23` and `23`", "C": "`20` and `25`", "D": "`25` and `25`"}, "correctAnswer": "A", "explanation": "`CEILING(number, significance)` rounds `23` UP to the nearest multiple of `5` (`25`); `FLOOR(23, 5)` rounds `23` DOWN to the nearest multiple of `5` (`20`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q52", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "POWER and SQRT", "difficulty": "Easy", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "What is the result of the MS Excel formula `=POWER(2, 4) + SQRT(81)`?", "options": {"A": "`25` (since $2^4 = 16$ and $\\sqrt{81} = 9$, and $16 + 9 = 25$)", "B": "`17`", "C": "`73`", "D": "`#NAME?`"}, "correctAnswer": "A", "explanation": "`POWER(2, 4)` computes $2^4 = 16$, and `SQRT(81)` computes $\\sqrt{81} = 9$. Their sum is $16 + 9 = 25$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q53", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "EVEN and ODD Functions", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "In MS Excel, what do `=EVEN(5)` and `=ODD(4)` return?", "options": {"A": "`EVEN(5) = 6` (rounds away from zero to the next even integer) and `ODD(4) = 5` (rounds away from zero to the next odd integer)", "B": "`EVEN(5) = FALSE` and `ODD(4) = FALSE`", "C": "`EVEN(5) = 4` and `ODD(4) = 3`", "D": "`#VALUE!`"}, "correctAnswer": "A", "explanation": "Do not confuse `EVEN(n)`/`ODD(n)` with `ISEVEN(n)`/`ISODD(n)`! `ISEVEN(5)` returns `FALSE`, whereas `EVEN(5)` rounds `5` up (away from zero) to the nearest even integer `6`, and `ODD(4)` rounds `4` up to the nearest odd integer `5`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q54", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Entry and Formatting", "subtopic": "Conditional Formatting", "difficulty": "Easy", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "A teacher wants cells in the Marks column (`C2:C50`) to automatically turn bright green if the score is `>= 80` and light red if the score is `< 35`, updating dynamically whenever marks are changed. Which `Home` tab feature accomplishes this?", "options": {"A": "Conditional Formatting (`Home -> Styles -> Conditional Formatting`)", "B": "Format Painter", "C": "Sort & Filter", "D": "Find & Select"}, "correctAnswer": "A", "explanation": "Conditional Formatting dynamically applies cell fills, font colors, data bars, color scales, or icon sets based on cell value rules.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q55", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Protection", "subtopic": "Cell Locking & Sheet Protection", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "By default in MS Excel, every cell on a worksheet has its 'Locked' property checked (`Format Cells -> Protection -> Locked`), yet you can freely edit any cell. When does the 'Locked' property actually take effect to prevent editing?", "options": {"A": "Only AFTER you turn on 'Protect Sheet' (`Review -> Protect Sheet`)", "B": "Only when you save the file as `.csv`", "C": "Only when Caps Lock is turned on", "D": "Only when the workbook is printed"}, "correctAnswer": "A", "explanation": "In Excel, all cells are marked 'Locked' by default, but locking has zero effect until you activate `Review -> Protect Sheet`! To allow users to edit specific input cells on a protected sheet, you first uncheck 'Locked' on those input cells and then enable 'Protect Sheet'.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q56", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel File Formats", "subtopic": "Binary Workbook .XLSB & CSV", "difficulty": "Moderate", "questionType": "File Extension", "sourceType": "Original Practice Question", "question": "Which MS Excel file format stores data in a compact binary format (`.xlsb`) for fast loading and saving of massive multi-hundred-megabyte workbooks, and which plain-text format (`.csv`) saves only the active sheet's raw values separated by commas without formulas or formatting?", "options": {"A": "Binary Workbook: `.xlsb`; Plain-text comma-delimited: `.csv`", "B": "Binary Workbook: `.xltx`; Plain-text: `.xlsx`", "C": "Binary Workbook: `.docx`; Plain-text: `.pptx`", "D": "Binary Workbook: `.accdb`; Plain-text: `.pst`"}, "correctAnswer": "A", "explanation": "`.xlsb` is the Excel Binary Workbook format; `.csv` (Comma-Separated Values) saves only plain text values from a single worksheet, stripping all formulas, charts, and cell styling.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q57", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Workbook Views", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which three Workbook Views appear on the `View` tab (and as icons on the right side of the Status Bar) in MS Excel?", "options": {"A": "Normal, Page Layout, and Page Break Preview", "B": "Print Layout, Web Layout, and Draft View", "C": "Normal, Slide Sorter, and Reading View", "D": "Datasheet View, Design View, and SQL View"}, "correctAnswer": "A", "explanation": "MS Excel's three workbook views are: Normal View (default grid), Page Layout View (shows headers, footers, and margins), and Page Break Preview (shows blue dashed/solid page break lines for printing).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q58", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Worksheet Tab Navigation Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In an MS Excel workbook with multiple worksheets (`Sheet1`, `Sheet2`, `Sheet3`), which keyboard shortcuts switch to the NEXT worksheet tab (to the right) and the PREVIOUS worksheet tab (to the left)?", "options": {"A": "Next sheet: `Ctrl + Page Down`; Previous sheet: `Ctrl + Page Up`", "B": "Next sheet: `Alt + Down Arrow`; Previous sheet: `Alt + Up Arrow`", "C": "Next sheet: `Ctrl + Right Arrow`; Previous sheet: `Ctrl + Left Arrow`", "D": "Next sheet: `Shift + Tab`; Previous sheet: `Tab`"}, "correctAnswer": "A", "explanation": "`Ctrl + Page Down` moves to the next worksheet tab in the workbook; `Ctrl + Page Up` moves to the previous worksheet tab.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q59", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Fundamentals", "subtopic": "Jump to Edge of Data Region", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Excel, pressing `Ctrl + Home` always moves the active cell selection to `A1`. What happens if you press `Ctrl + Down Arrow` when starting at the top of a continuous column of 500 numbers (`A1:A500`)?", "options": {"A": "It jumps directly to the last filled cell at the bottom edge of that contiguous data block (`A500`)", "B": "It scrolls down by 1 row to `A2`", "C": "It deletes the column", "D": "It hides row 500"}, "correctAnswer": "A", "explanation": "`Ctrl + Arrow Key` jumps to the last non-empty cell at the edge of the current continuous data region (or to the very last row `1048576` / column `XFD` if cells are blank). Holding `Ctrl + Shift + Arrow Key` selects the entire range to the edge.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q60", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Entry and Formatting", "subtopic": "AutoFill Series", "difficulty": "Easy", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "If you type `'Monday'` (or `'Jan'`) into cell `A1` and drag the small square 'Fill Handle' in the bottom-right corner of cell `A1` down to cell `A7`, what does MS Excel fill into `A2:A7`?", "options": {"A": "`Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday` (via built-in Custom Lists AutoFill)", "B": "`Monday` repeated 7 times", "C": "`#VALUE!` errors", "D": "Numbers 1 to 6"}, "correctAnswer": "A", "explanation": "Excel's AutoFill automatically increments built-in chronological series (Days of the week `Mon..Sun`, Months `Jan..Dec`, Dates, and Quarters `Qtr 1..Qtr 4`). For a single plain number `5`, dragging the Fill Handle copies `5` unless you hold `Ctrl` while dragging (or select two numbers `5, 10` to establish a step pattern).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q61", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Entry and Formatting", "subtopic": "Number Format Shortcuts", "difficulty": "Difficult", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "Match the MS Excel number formatting keyboard shortcut with the format it applies:\n1. `Ctrl + Shift + $` — (p) Percentage format with 0 decimal places (`50%`)\n2. `Ctrl + Shift + %` — (q) Currency format with 2 decimal places\n3. `Ctrl + Shift + #` — (r) General number format (removes specific number formatting)\n4. `Ctrl + Shift + ~` — (s) Date format (`DD-MMM-YY`)", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "`Ctrl+Shift+$` = Currency (q); `Ctrl+Shift+%` = Percentage (p); `Ctrl+Shift+#` = Date (s); `Ctrl+Shift+~` = General format (r); `Ctrl+1` opens the Format Cells dialog.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q62", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "AutoFilter Shortcut", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "Which keyboard shortcut turns AutoFilter drop-down arrows ON or OFF on the header row of a table in MS Excel?", "options": {"A": "`Ctrl + Shift + L`", "B": "`Ctrl + F`", "C": "`Alt + F4`", "D": "`Ctrl + T`"}, "correctAnswer": "A", "explanation": "`Ctrl + Shift + L` toggles Filter drop-down arrows on/off (`Data -> Sort & Filter -> Filter`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q63", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Concatenation Operator &", "difficulty": "Easy", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "If cell `A1` contains `\"New\"` and cell `B1` contains `\"Delhi\"`, what is the output of the formula `=A1 & \" \" & B1`?", "options": {"A": "`\"New Delhi\"`", "B": "`\"NewDelhi\"`", "C": "`#VALUE!`", "D": "`\"A1 B1\"`"}, "correctAnswer": "A", "explanation": "The ampersand (`&`) is Excel's text concatenation operator. Joining `A1`, a space string `\" \"`, and `B1` yields `\"New Delhi\"`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q64", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Excel Protection", "subtopic": "Print Area & Print Titles", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "When printing a 15-page inventory table in MS Excel, you want Row 1 (containing column headings like `'Item ID, Name, Price'`) to automatically repeat at the top of EVERY printed page. Which feature under `Page Layout -> Page Setup` should you configure?", "options": {"A": "`Print Titles` -> 'Rows to repeat at top: `$1:$1`'", "B": "`Freeze Panes` (note: Freeze Panes only affects on-screen scrolling, NOT printed pages!)", "C": "`Merge & Center`", "D": "`Goal Seek`"}, "correctAnswer": "A", "explanation": "Exam Trap: 'Freeze Panes' only keeps rows visible while scrolling on screen. To repeat header rows on every printed page, you must set `Page Layout -> Print Titles -> Rows to repeat at top`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q65", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "Dynamic Array SEQUENCE", "difficulty": "Moderate", "questionType": "Excel Formula-Output", "sourceType": "Original Practice Question", "question": "In Excel 2021 / Microsoft 365, what does the Dynamic Array formula `=SEQUENCE(4, 1, 10, 5)` generate?", "options": {"A": "A vertical column of 4 numbers starting at 10 and stepping by 5: `{10; 15; 20; 25}`", "B": "A single number `200`", "C": "Four zeros `{0; 0; 0; 0}`", "D": "`#NAME?`"}, "correctAnswer": "A", "explanation": "`SEQUENCE(rows, [columns], [start], [step])` generates a sequence of `4` rows by `1` column starting at `10` with a step increment of `5`: `10, 15, 20, 25`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R01", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Inserting Objects", "subtopic": "Insertable Objects on Slide", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Which of the following objects can be inserted into an MS PowerPoint slide?", "options": {"A": "Only plain unformatted text", "B": "Only static bitmap images", "C": "Tables, charts, text, shapes, SmartArt, and multimedia (audio and video)", "D": "Only SQL database triggers"}, "correctAnswer": "C", "explanation": "MS PowerPoint slides support rich content placeholders capable of holding text, tables, charts, SmartArt graphics, 3D models, pictures, icons, audio clips, and video files.", "exam": "DSSSB PGT / TGT Computer Exam", "year": 2024, "shift": "March 2024", "sourceReference": "Testbook Official PYQ"}, {"id": "MS-R02", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slides and Shortcuts", "subtopic": "New Slide vs New Presentation", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS PowerPoint, pressing `Ctrl + N` creates a new blank Presentation file. Which keyboard shortcut inserts a 'New Slide' into the currently open presentation?", "options": {"A": "`Ctrl + M`", "B": "`Ctrl + S`", "C": "`Ctrl + Shift + N`", "D": "`Alt + N`"}, "correctAnswer": "A", "explanation": "Classic PowerPoint exam trap: `Ctrl + M` inserts a New Slide into the current presentation, whereas `Ctrl + N` opens a brand-new Presentation window.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-R03", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Delivery", "subtopic": "Start Slide Show Shortcuts", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS PowerPoint, which key starts the Slide Show from the very FIRST slide (Beginning), and which key combination starts the Slide Show from the CURRENTLY SELECTED slide?", "options": {"A": "From Beginning: `F5`; From Current Slide: `Shift + F5`", "B": "From Beginning: `Shift + F5`; From Current Slide: `F5`", "C": "From Beginning: `Ctrl + F5`; From Current Slide: `Alt + F5`", "D": "From Beginning: `F7`; From Current Slide: `Shift + F7`"}, "correctAnswer": "A", "explanation": "`F5` starts the presentation from Slide 1; `Shift + F5` starts the presentation from the currently active slide; `Alt + F5` starts Presenter View.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS Official Paper"}, {"id": "MS-R04", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Transitions vs Animations", "subtopic": "Core Difference", "difficulty": "Easy", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "What is the fundamental difference between a 'Slide Transition' and an 'Animation' in MS PowerPoint?", "options": {"A": "A Transition is the visual motion effect that occurs when moving from one whole slide to the next slide, whereas an Animation is a visual motion effect applied to individual objects ON a slide (such as text boxes, shapes, or pictures)", "B": "An Animation applies to the entire slide whereas a Transition applies only to bullet points", "C": "A Transition can only be applied to audio files", "D": "There is no difference between Transitions and Animations"}, "correctAnswer": "A", "explanation": "Transitions (`Transitions` tab) control how an entire slide enters the screen during a show; Animations (`Animations` tab) animate individual elements on a slide.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "MS-R05", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Master", "subtopic": "Purpose of Slide Master", "difficulty": "Moderate", "questionType": "PowerPoint Practical", "sourceType": "Adapted PYQ", "question": "You are preparing a 60-slide presentation in MS PowerPoint and want your school's official logo and a consistent title font to appear in the exact same corner of EVERY slide automatically without pasting it 60 times. Which feature under the `View` tab should you edit?", "options": {"A": "Slide Sorter View", "B": "Slide Master (`View -> Master Views -> Slide Master`)", "C": "Notes Page View", "D": "Reading View"}, "correctAnswer": "B", "explanation": "The Slide Master stores global layout, theme fonts, background graphics, and universal headers/logos across all slides in the presentation.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-R06", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Views", "subtopic": "Slide Sorter View", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Adapted PYQ", "question": "Which view in MS PowerPoint displays miniature thumbnails of all slides in a horizontal grid, making it the best view to reorder slides via drag-and-drop, delete multiple slides, or check transition timings across the entire presentation?", "options": {"A": "Outline View", "B": "Slide Sorter View", "C": "Notes Page View", "D": "Slide Show View"}, "correctAnswer": "B", "explanation": "Slide Sorter View shows all slides as small thumbnails in sequence, ideal for reorganizing slide order and reviewing global transition settings.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-R07", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Animations", "subtopic": "Four Categories of Animations", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "In MS PowerPoint's `Animations` tab, object animation effects are organized into which FOUR categories (and star icon colors)?", "options": {"A": "1. Entrance (Green), 2. Emphasis (Yellow), 3. Exit (Red), and 4. Motion Paths", "B": "1. Subtle, 2. Exciting, 3. Dynamic Content, and 4. Static", "C": "1. Fade, 2. Wipe, 3. Push, and 4. Split", "D": "1. Header, 2. Footer, 3. Sidebar, and 4. Body"}, "correctAnswer": "A", "explanation": "Object Animations fall into 4 groups: Entrance (Green—how an object enters the slide), Emphasis (Yellow—draws attention while on screen, e.g., Pulse/Spin), Exit (Red—how an object leaves the slide), and Motion Paths (moves along a path). Note: Subtle, Exciting, and Dynamic Content are the categories of Slide Transitions!", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R08", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Defaults", "subtopic": "Aspect Ratio & Orientation", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "In MS PowerPoint 2013, 2016, 2019, 2021, and Microsoft 365, what is the default Slide Orientation and the default Widescreen Aspect Ratio (which was 4:3 in PowerPoint 2003–2010)?", "options": {"A": "Landscape orientation with a `16:9` Widescreen aspect ratio (and Notes/Handouts default to Portrait)", "B": "Portrait orientation with a `4:3` aspect ratio", "C": "Square orientation with a `1:1` aspect ratio", "D": "Landscape orientation with a `21:9` aspect ratio"}, "correctAnswer": "A", "explanation": "PowerPoint slides default to Landscape orientation. Since PowerPoint 2013+, the default slide size is Widescreen `16:9` (adjustable to Standard `4:3` under `Design -> Slide Size`). Handouts, Notes, and Outlines default to Portrait.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R09", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Printing Handouts", "subtopic": "Valid Slides Per Page & 3-Slide Lines", "difficulty": "Moderate", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "When printing 'Handouts' in MS PowerPoint (`File -> Print -> Settings -> Handouts`), what are the valid numbers of slides per page allowed, and which specific option automatically prints blank horizontal ruled lines beside each slide for audience notes?", "options": {"A": "Valid counts: 1, 2, 3, 4, 6, or 9 slides per page; the `3 Slides` option prints ruled note-taking lines next to each slide", "B": "Valid counts: 1, 3, 5, 7, or 10 slides per page; the `5 Slides` option prints lines", "C": "Valid counts: 2, 4, 8, or 16 slides per page; all options print lines", "D": "Only 1 slide per page is allowed"}, "correctAnswer": "A", "explanation": "PowerPoint Handouts support 1, 2, 3, 4, 6, or 9 slides per page (never 5, 7, or 8). Choosing '3 Slides' per page formats 3 thumbnails on the left with ruled note lines on the right.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R10", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Delivery", "subtopic": "Live Show Keyboard Controls (B, W, E)", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "While delivering a live full-screen Slide Show in MS PowerPoint, what happens when the presenter presses the `'B'` key (or Period `.`), the `'W'` key (or Comma `,`), or the `'E'` key?", "options": {"A": "`B` = Turns screen Black (pauses show); `W` = Turns screen White; `E` = Erases all on-screen ink annotations drawn with the pen", "B": "`B` = Bold text; `W` = Close window; `E` = Exit PowerPoint", "C": "`B` = Back one slide; `W` = Wide screen; `E` = Edit slide", "D": "None of these keys work during a slide show"}, "correctAnswer": "A", "explanation": "During a live Slide Show: `B` (or `.`) toggles a Black screen; `W` (or `,`) toggles a White screen; `Ctrl + P` activates the Pen; `Ctrl + L` activates the Laser Pointer; `E` erases all on-screen ink annotations; `Esc` ends the show.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R11", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint File Formats", "subtopic": ".PPSX vs .PPTX", "difficulty": "Moderate", "questionType": "File Extension", "sourceType": "Original Practice Question", "question": "How does saving a presentation as a 'PowerPoint Show' (`.ppsx` or `.pps`) differ from saving it as a standard PowerPoint Presentation (`.pptx`)?", "options": {"A": "Double-clicking a `.ppsx` file in File Explorer opens it DIRECTLY in full-screen Slide Show mode rather than the Normal editing interface", "B": "A `.ppsx` file contains only audio without slides", "C": "A `.ppsx` file can only be opened in MS Access", "D": "A `.ppsx` file is limited to 1 slide"}, "correctAnswer": "A", "explanation": "`.ppsx` (PowerPoint Show) launches immediately into full-screen Slide Show playback when opened from Windows Explorer, whereas `.pptx` opens in Normal editing view.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R12", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Views", "subtopic": "Outline View Purpose", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "In MS PowerPoint (`View -> Outline View`), what is displayed in the left navigation pane instead of graphical slide thumbnails?", "options": {"A": "Only the slide titles and main body bullet text in a structured hierarchical outline—ideal for rapidly editing text and reorganizing bullet points across slides", "B": "Only speaker notes", "C": "Only animations and audio waveforms", "D": "VBA macro source code"}, "correctAnswer": "A", "explanation": "Outline View strips away graphical backgrounds and shapes in the side pane to display only the textual outline (Slide Titles and bullet hierarchies) of every slide.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R13", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Setup", "subtopic": "Rehearse Timings", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Which feature on the `Slide Show` tab in MS PowerPoint starts a full-screen slide show with an on-screen recording timer so you can practice your speech and automatically save the exact number of seconds spent on each slide for an unattended self-running kiosk?", "options": {"A": "Rehearse Timings", "B": "Slide Master", "C": "Eyedropper", "D": "Smart Lookup"}, "correctAnswer": "A", "explanation": "`Slide Show -> Set Up -> Rehearse Timings` records the duration spent on each slide and saves those timings to adva
