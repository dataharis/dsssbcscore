MODEM' stand for, and what is its exact signal conversion function?", "options": {"A": "Modern Demultiplexer; converts binary into Hexadecimal", "B": "Modulator-Demodulator; Modulates digital signals from a computer into analog signals for transmission over telephone/cable lines, and Demodulates incoming analog signals back into digital", "C": "Memory Address Decoder; expands RAM", "D": "Mobile Data Emulator; blocks spam emails"}, "correctAnswer": "B", "explanation": "Modem = Modulator (Digital -> Analog at sender) + Demodulator (Analog -> Digital at receiver).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L11", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Networking Devices", "subtopic": "Gateway vs Repeater", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Which networking device is required at Layer 1 to regenerate and amplify a weakened (attenuated) signal over a long cable without reading any addresses, and which device acts as a multi-layer 'Protocol Converter' to join two completely dissimilar network architectures?", "options": {"A": "Signal regeneration: Repeater; Dissimilar protocol conversion: Gateway", "B": "Signal regeneration: Gateway; Dissimilar protocol conversion: Repeater", "C": "Signal regeneration: NIC; Dissimilar protocol conversion: Passive Hub", "D": "Both tasks are performed by a coaxial terminator"}, "correctAnswer": "A", "explanation": "A Repeater operates at Layer 1 to combat attenuation by regenerating weak signals; a Gateway operates across all layers as a protocol translator between dissimilar networks.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L12", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Protocols", "subtopic": "FTP vs Telnet vs SSH", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Which protocol is specifically designed for uploading and downloading files between a client and a server over TCP/IP, and why has SSH (Port 22) replaced Telnet (Port 23) for remote command-line login?", "options": {"A": "File transfer: FTP (File Transfer Protocol); SSH encrypts all login credentials and commands whereas Telnet transmits passwords in unencrypted plaintext", "B": "File transfer: SNMP; Telnet is faster than fiber optics", "C": "File transfer: ICMP; SSH only works without a password", "D": "File transfer: POP3; Telnet is used only for printing"}, "correctAnswer": "A", "explanation": "FTP (File Transfer Protocol) handles file transfers; SSH (Secure Shell) provides encrypted remote terminal administration, replacing insecure plaintext Telnet.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L13", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Network Scope", "subtopic": "Intranet vs Extranet", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "A bank maintains a private internal web portal accessible exclusively by its own employees (`Intranet`). When the bank grants controlled, authenticated access to a subset of that private network to external third-party auditors and vendor partners, that shared extension is called an:", "options": {"A": "ARPANET", "B": "Extranet", "C": "PAN", "D": "Localhost"}, "correctAnswer": "B", "explanation": "An Extranet is a private network that uses Internet protocols to securely share part of an organization's Intranet with authorized external suppliers, vendors, or partners.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L14", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "TCP/IP Model", "subtopic": "TCP vs UDP", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "At the Transport Layer of the TCP/IP suite, how does TCP (Transmission Control Protocol) differ from UDP (User Datagram Protocol)?", "options": {"A": "TCP is connection-oriented, reliable, and guarantees ordered delivery with acknowledgments and retransmission, whereas UDP is connectionless, lightweight, and low-latency without delivery guarantees", "B": "UDP is connection-oriented and slower than TCP", "C": "TCP operates at the Physical Layer whereas UDP operates at the Application Layer", "D": "Neither protocol uses port numbers"}, "correctAnswer": "A", "explanation": "TCP provides reliable connection-oriented byte streams (3-way handshake, ACKs, flow/congestion control—used by HTTP, FTP, SMTP); UDP provides fast, low-overhead connectionless datagrams (used by DNS, DHCP, live video/gaming).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L15", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Protocols", "subtopic": "DHCP Discovery", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Which network protocol is used to automatically introduce and configure new computers joining an IP network by dynamically leasing them an IP address, Subnet Mask, and Default Gateway?", "options": {"A": "DHCP (Dynamic Host Configuration Protocol) / BOOTP", "B": "POP3", "C": "FTP", "D": "Telnet"}, "correctAnswer": "A", "explanation": "DHCP (using the DORA process: Discover, Offer, Request, Acknowledge) automatically configures new hosts joining a network with an IP address and network parameters.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 2", "sourceReference": "Testbook / DSSSB TGT CS Official Paper"}, {"id": "CF-M01", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Hyperlinks & Web", "subtopic": "Hyperlink Properties", "difficulty": "Easy", "questionType": "Statement-based", "sourceType": "Verified PYQ", "question": "Select the statement that is INCORRECT regarding Hyperlinks on a webpage:", "options": {"A": "A hyperlink can link to another webpage, a specific section on the same page, or a downloadable file", "B": "There can be ONLY ONE hyperlink on a single webpage", "C": "In HTML, hyperlinks are created using the `<a>` (anchor) tag with the `href` attribute", "D": "When the mouse pointer hovers over a hyperlink, it typically changes into a pointing hand icon"}, "correctAnswer": "B", "explanation": "A single webpage can contain hundreds or thousands of hyperlinks (that is the core concept of hypertext on the World Wide Web). Hence claiming 'There should be only one hyperlink on one webpage' is INCORRECT.", "exam": "DSSSB PGT / TGT Computer Exam", "year": 2024, "shift": "March 2024", "sourceReference": "Testbook DSSSB Official PYQ"}, {"id": "CF-M02", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Browsers vs Search Engines", "subtopic": "Odd One Out", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Adapted PYQ", "question": "Which of the following is a 'Web Search Engine' rather than a 'Web Browser'?", "options": {"A": "Mozilla Firefox", "B": "DuckDuckGo (and Google / Bing)", "C": "Microsoft Edge", "D": "Apple Safari"}, "correctAnswer": "B", "explanation": "Mozilla Firefox, Microsoft Edge, Google Chrome, Apple Safari, Brave, and Opera are client Web Browsers. DuckDuckGo, Google Search, Bing, and Yahoo! are Web Search Engines.", "exam": "KVS TGT / PGT ICT", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS Official Paper"}, {"id": "CF-M03", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Email Protocols", "subtopic": "SMTP vs POP3 vs IMAP", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "When you compose an email and click 'Send', which protocol pushes your outgoing message to the mail server, and which protocol is best suited when you want to read and synchronize your inbox across MULTIPLE devices (phone, laptop, tablet) while keeping messages on the server?", "options": {"A": "Sending: SMTP; Multi-device Server Sync: IMAP (Internet Message Access Protocol)", "B": "Sending: POP3; Multi-device Server Sync: SMTP", "C": "Sending: FTP; Multi-device Server Sync: HTTP", "D": "Sending: SNMP; Multi-device Server Sync: Telnet"}, "correctAnswer": "A", "explanation": "SMTP (Simple Mail Transfer Protocol) sends/relays outgoing email. IMAP (Port 143) keeps emails synchronized on the mail server across multiple devices, whereas traditional POP3 (Port 110) downloads mail to a single local device.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-M04", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Email Fields", "subtopic": "CC vs BCC", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "A teacher sends an exam circular to `student1@school.edu` in the `To` field, puts `principal@school.edu` in the `CC` field, and puts `parent1@gmail.com` and `parent2@gmail.com` in the `BCC` field. Which statement is TRUE?", "options": {"A": "`student1` can see the email addresses of `parent1` and `parent2`", "B": "`parent1` can see `student1` and `principal`, but CANNOT see `parent2` (and neither `student1` nor `principal` can see `parent1` or `parent2`)", "C": "Nobody receives the email unless BCC is left empty", "D": "`principal` cannot see `student1`"}, "correctAnswer": "B", "explanation": "Recipients in `BCC` (Blind Carbon Copy) are invisible to `To`, `CC`, and other `BCC` recipients, whereas `To` and `CC` addresses are visible to everyone.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-M05", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "WWW History", "subtopic": "Pioneers", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the Internet / Web milestone with its pioneer:\n1. World Wide Web (WWW), HTML, HTTP & URL (1989) — (p) Vint Cerf & Bob Kahn\n2. TCP/IP Protocol Suite (1974/1983) — (q) Ray Tomlinson\n3. First Network Email & `@` Symbol (1971) — (r) Tim Berners-Lee (at CERN)\n4. First Packet-Switched Network (1969) — (s) ARPANET (US DoD)", "options": {"A": "1-r, 2-p, 3-q, 4-s", "B": "1-p, 2-r, 3-q, 4-s", "C": "1-r, 2-q, 3-p, 4-s", "D": "1-s, 2-p, 3-q, 4-r"}, "correctAnswer": "A", "explanation": "Tim Berners-Lee invented the WWW (r); Vint Cerf & Bob Kahn designed TCP/IP (p); Ray Tomlinson invented networked email using `@` (q); ARPANET (1969) was the precursor to the Internet (s).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M06", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "URL Anatomy", "subtopic": "URL Components", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In the URL `https://dsssb.delhi.gov.in/home/notifications.html#exam2025`, what do `https`, `.gov.in`, and `#exam2025` represent respectively?", "options": {"A": "Protocol (Scheme), Top-Level / Second-Level Domain (Government of India), and Fragment/Anchor identifier jumping to a specific section on the page", "B": "Browser name, IP address, and Password", "C": "Search engine, File extension, and Port number", "D": "Folder path, Protocol, and Cookie"}, "correctAnswer": "A", "explanation": "`https` is the secure scheme/protocol; `dsssb.delhi.gov.in` is the domain name (`.in` = India ccTLD, `.gov` = government); `#exam2025` is an in-page anchor/fragment identifier.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M07", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Cloud Computing", "subtopic": "IaaS, PaaS, SaaS", "difficulty": "Moderate", "questionType": "Classification", "sourceType": "Exam-pattern Question", "question": "When you use browser-based applications like Gmail, Google Docs, or Microsoft 365 Web apps directly over the Internet without installing or managing servers, operating systems, or runtime patches, which Cloud Computing service model are you using?", "options": {"A": "IaaS (Infrastructure as a Service)", "B": "PaaS (Platform as a Service)", "C": "SaaS (Software as a Service)", "D": "BIOS as a Service"}, "correctAnswer": "C", "explanation": "SaaS (Software as a Service) delivers complete, ready-to-use end-user applications over the web. IaaS provides virtual machines/storage (e.g., AWS EC2), and PaaS provides developer deployment environments (e.g., Google App Engine).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M08", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Digital Payments", "subtopic": "UPI Architecture", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What is the full form of 'UPI' in India's digital payment ecosystem, and which umbrella organization developed it?", "options": {"A": "Unified Payments Interface; developed by NPCI (National Payments Corporation of India)", "B": "Universal Portal for Internet; developed by SEBI", "C": "Unique Payment Identifier; developed by UIDAI", "D": "Unified Protocol for Intranet; developed by C-DAC"}, "correctAnswer": "A", "explanation": "UPI stands for Unified Payments Interface, launched in 2016 by the National Payments Corporation of India (NPCI) for instant 24x7 inter-bank transfers.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M09", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "E-Commerce", "subtopic": "B2B, B2C, C2C, G2C", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the E-Commerce / E-Governance transaction model with its real-world example:\n1. B2B (Business-to-Business) — (p) A citizen downloading a driving license on Parivahan / DigiLocker\n2. B2C (Business-to-Consumer) — (q) An individual selling their used bicycle to another individual on OLX\n3. C2C (Consumer-to-Consumer) — (r) A retail customer buying a book from Amazon\n4. G2C (Government-to-Citizen) — (s) A steel manufacturer supplying bulk steel coils to an automaker via an wholesale portal", "options": {"A": "1-s, 2-r, 3-q, 4-p", "B": "1-r, 2-s, 3-q, 4-p", "C": "1-s, 2-q, 3-r, 4-p", "D": "1-p, 2-r, 3-q, 4-s"}, "correctAnswer": "A", "explanation": "B2B = wholesale manufacturer to automaker (s); B2C = Amazon retail to customer (r); C2C = peer-to-peer resale on OLX/eBay (q); G2C = government portal to citizen (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M10", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Email Attachments", "subtopic": "MIME Protocol", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Original SMTP was designed to transmit only 7-bit ASCII plain text. Which standard extension allows modern email systems to attach and transmit binary files such as images, audio, video, PDFs, and non-English character sets?", "options": {"A": "MIME (Multipurpose Internet Mail Extensions)", "B": "DHCP", "C": "ARP", "D": "BIOS"}, "correctAnswer": "A", "explanation": "MIME (Multipurpose Internet Mail Extensions) encodes non-ASCII text and binary file attachments (images, audio, PDFs, Office docs) so they can be transported across SMTP.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M11", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Digital Signatures", "subtopic": "Private vs Public Key in Signing", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "To create a legally verifiable Digital Signature on an electronic document, which cryptographic key does the SENDER use to sign the document's hash, and which key does the RECEIVER use to verify the signature?", "options": {"A": "Sender signs with Sender's PRIVATE Key; Receiver verifies with Sender's PUBLIC Key", "B": "Sender signs with Receiver's PUBLIC Key; Receiver verifies with Receiver's PRIVATE Key", "C": "Both use the same Wi-Fi password", "D": "Sender signs with Sender's PUBLIC Key; Receiver verifies with Sender's PRIVATE Key"}, "correctAnswer": "A", "explanation": "In a Digital Signature, only the sender possesses their Private Key, so signing with the Sender's Private Key proves authenticity and non-repudiation; anyone with the Sender's Public Key can verify it.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M12", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Search Techniques", "subtopic": "Boolean & Exact Search", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "When searching on Google or Bing, which operator forces the search engine to match an EXACT multi-word phrase in that exact order, and which operator restricts results to a specific domain (e.g., only `.gov.in` websites)?", "options": {"A": "Exact phrase: Double quotation marks `\"DSSSB TGT Computer Science\"`; Domain filter: `site:gov.in`", "B": "Exact phrase: Square brackets `[ ]`; Domain filter: `url=gov.in`", "C": "Exact phrase: Dollar signs `$ $`; Domain filter: `@gov.in`", "D": "Exact phrase: Hashtag `#`; Domain filter: `%gov.in`"}, "correctAnswer": "A", "explanation": "Enclosing words in double quotes `\"...\"` performs an exact-phrase match, `site:domain` restricts results to that domain, `filetype:pdf` filters by file extension, and `-word` excludes a term.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M13", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Web Collaboration", "subtopic": "Wiki vs Blog", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "How does a 'Wiki' (such as Wikipedia) fundamentally differ from a personal 'Blog' (Weblog)?", "options": {"A": "A Blog allows only reverse-chronological posts authored by an individual/small team where readers can at most leave comments, whereas a Wiki allows collaborative community creation and direct editing/revision of interlinked pages by multiple users", "B": "A Wiki cannot be opened in a web browser", "C": "A Blog can only contain binary machine code", "D": "There is no difference between a Wiki and a Blog"}, "correctAnswer": "A", "explanation": "A Blog (Weblog) is an author-driven chronological journal/article feed, while a Wiki is a collaborative knowledge base where authorized users can edit and link pages directly.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M14", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "HTTP vs HTTPS", "subtopic": "TLS/SSL Security", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What does the extra `'S'` in `HTTPS` stand for, and which cryptographic protocol secures the connection between the web browser and the web server?", "options": {"A": "`S` = Secure; secured via TLS / SSL (Transport Layer Security / Secure Sockets Layer)", "B": "`S` = Simple; secured via FTP", "C": "`S` = Serial; secured via Telnet", "D": "`S` = Static; secured via POP3"}, "correctAnswer": "A", "explanation": "HTTPS stands for HyperText Transfer Protocol Secure, which encrypts HTTP traffic over TLS (Transport Layer Security, successor to SSL) on TCP Port 443.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-M15", "moduleCode": "M", "module": "M. Internet and Digital Communication", "topic": "Web Architecture", "subtopic": "Static vs Dynamic Webpage", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "What is the difference between a 'Static Webpage' and a 'Dynamic Webpage'?", "options": {"A": "A Static webpage delivers the exact same pre-written HTML content to every visitor unless the source file is manually edited, whereas a Dynamic webpage generates customized content on-the-fly using server-side/client-side scripts and databases (e.g., live bank balance or personalized dashboard)", "B": "A Static webpage contains moving GIF animations whereas a Dynamic webpage has only black text", "C": "A Static webpage requires no web server", "D": "A Dynamic webpage cannot use HTML"}, "correctAnswer": "A", "explanation": "Static pages serve fixed `.html` files as-is; Dynamic pages construct responses dynamically based on user identity, database queries, or live inputs.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N01", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Virus Definition", "difficulty": "Easy", "questionType": "Riddle / Definition", "sourceType": "Verified PYQ", "question": "'I am a piece of malicious code that is secretly introduced into a system by attaching myself to a legitimate host program or document, and when that program runs, I infect other programs and corrupt files.' Who am I?", "options": {"A": "Firewall", "B": "Computer Virus", "C": "Cookie", "D": "Digital Certificate"}, "correctAnswer": "B", "explanation": "A Computer Virus attaches itself to a legitimate executable or macro-enabled file and spreads when the host program is executed.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022 Shift 1", "sourceReference": "Testbook / NVS TGT ICT Official PYQ"}, {"id": "CF-N02", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Worm vs Virus vs Trojan", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "Which type of malware is a standalone program that does NOT require a host file and self-replicates AUTOMATICALLY across computer networks by exploiting security vulnerabilities, often exhausting network bandwidth?", "options": {"A": "Trojan Horse", "B": "Computer Worm", "C": "Spyware", "D": "Logic Bomb"}, "correctAnswer": "B", "explanation": "Unlike a Virus (which needs a host file) and a Trojan Horse (which never self-replicates), a Computer Worm is a standalone program that propagates autonomously across networks.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-N03", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Cyber Attacks", "subtopic": "Phishing vs Pharming", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "An attacker poisons a DNS server cache (or modifies a victim's local `hosts` file) so that even when the user types the exact, legitimate URL of their bank (`www.mybank.com`) into the address bar without clicking any email link, they are silently redirected to a fake look-alike website. What is this attack called?", "options": {"A": "Phishing", "B": "Pharming", "C": "Shoulder Surfing", "D": "Spamming"}, "correctAnswer": "B", "explanation": "Pharming hijacks domain name resolution (via DNS cache poisoning or `hosts` file tampering) to redirect users to a fraudulent site without needing a deceptive email link click.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-N04", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Information Security", "subtopic": "CIA Triad", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In Information Security, the 'CIA Triad' stands for which three core security objectives?", "options": {"A": "Central Intelligence Agency, Internet, and Antivirus", "B": "Confidentiality, Integrity, and Availability", "C": "Compression, Indexing, and Archiving", "D": "Compilation, Interpretation, and Assembly"}, "correctAnswer": "B", "explanation": "The CIA Triad comprises Confidentiality (preventing unauthorized disclosure), Integrity (preventing unauthorized modification), and Availability (ensuring timely access for authorized users).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N05", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Ransomware", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "Malicious software such as 'WannaCry' or 'LockBit' that infiltrates a computer, encrypts all of the victim's personal documents and databases, and demands payment (often in cryptocurrency) for the decryption key is known as:", "options": {"A": "Adware", "B": "Ransomware", "C": "Freeware", "D": "Cookie"}, "correctAnswer": "B", "explanation": "Ransomware extorts money from victims by encrypting their files or locking their system screen until a ransom is paid.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N06", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Keylogger & Spyware", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which specialized form of Spyware (either software or a tiny hardware plug between keyboard and PC) covertly records every keystroke typed by a user in order to steal passwords, PINs, and credit card numbers?", "options": {"A": "Keylogger (Keystroke Logger)", "B": "Defragmenter", "C": "Packet Filter", "D": "Pop-up Blocker"}, "correctAnswer": "A", "explanation": "A Keylogger secretly captures keystrokes in chronological order to harvest confidential credentials.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N07", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Access Control", "subtopic": "Authentication vs Authorization", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "In cybersecurity access control, what is the exact difference between 'Authentication' and 'Authorization'?", "options": {"A": "Authentication verifies WHO a user is (via password/OTP/biometrics), whereas Authorization determines WHAT resources and permissions (Read/Write/Delete) that authenticated user is allowed to access", "B": "Authorization happens before Authentication", "C": "Authentication encrypts the hard drive whereas Authorization deletes files", "D": "Both terms mean installing an antivirus program"}, "correctAnswer": "A", "explanation": "Authentication validates identity ('Who are you?') first; Authorization enforces access control permissions ('What are you allowed to do?') afterward.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N08", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Access Control", "subtopic": "Multi-Factor Authentication (MFA)", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "Which of the following login scenarios represents true Two-Factor / Multi-Factor Authentication (2FA/MFA) combining two DIFFERENT authentication factor categories?", "options": {"A": "Entering a textual Password AND answering a secret Security Question (both are 'Something you know')", "B": "Entering a Password ('Something you know') AND approving a one-time code on a physical mobile authenticator / scanning a Fingerprint ('Something you have' or 'Something you are')", "C": "Typing the same password twice", "D": "Using a username without a password"}, "correctAnswer": "B", "explanation": "True MFA requires at least two distinct categories among: (1) Something you know (Password/PIN), (2) Something you have (Smart card / Phone OTP token), and (3) Something you are (Fingerprint/Iris biometric).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N09", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Trojan Horse", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which type of malware masquerades as a legitimate, desirable utility or free game to trick the user into installing it, does NOT self-replicate, and secretly opens a backdoor for remote attackers?", "options": {"A": "Trojan Horse", "B": "Network Worm", "C": "Parity Bit", "D": "Bootloader"}, "correctAnswer": "A", "explanation": "A Trojan Horse relies on social engineering deception (looking like useful software) and never self-replicates, instead installing backdoors or spyware.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N10", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Network Attacks", "subtopic": "DoS and DDoS", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "When an attacker uses a 'Botnet' (thousands of compromised 'zombie' computers worldwide) to flood a target government or bank web server with millions of superfluous requests per second so legitimate citizens cannot open the website, which pillar of the CIA triad is attacked and what is this attack called?", "options": {"A": "Attacks Availability; called a DDoS (Distributed Denial of Service) attack", "B": "Attacks Confidentiality; called a Keylogger attack", "C": "Attacks Integrity; called a SQL Query", "D": "Attacks Hardware; called Cold Booting"}, "correctAnswer": "A", "explanation": "A DDoS (Distributed Denial of Service) attack overwhelms server bandwidth and CPU/memory resources from thousands of distributed botnet nodes, directly compromising Availability.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N11", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Defense Mechanisms", "subtopic": "Firewall Limitations", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "Which of the following threats CANNOT be prevented solely by a network Firewall?", "options": {"A": "Unauthorized external connection attempts to blocked TCP ports", "B": "A user plugging an already virus-infected USB pen drive directly into their computer and running an infected file", "C": "Incoming ping floods from untrusted external IP addresses", "D": "Outbound traffic from a blocked application port"}, "correctAnswer": "B", "explanation": "A Firewall inspects and filters network traffic passing between network interfaces; it does NOT scan or disinfect local USB flash drives (which requires an Antivirus / Endpoint Protection tool).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N12", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Malware", "subtopic": "Rootkit & Logic Bomb", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the specialized malware/threat term with its behavior:\n1. Rootkit — (p) Floods inbox with unsolicited commercial bulk emails\n2. Logic Bomb — (q) Hides deep inside the OS kernel/boot sector to conceal malware from antivirus detection\n3. Adware — (r) Remains dormant until triggered by a specific date (e.g., Friday the 13th) or event\n4. Spam — (s) Automatically displays unwanted pop-up advertisements to generate revenue", "options": {"A": "1-q, 2-r, 3-s, 4-p", "B": "1-r, 2-q, 3-s, 4-p", "C": "1-q, 2-s, 3-r, 4-p", "D": "1-p, 2-r, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "Rootkit subverts the OS kernel to hide processes (q); Logic Bomb triggers on a specific date or condition (r); Adware serves unwanted ads (s); Spam is unsolicited bulk messaging (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N13", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Social Engineering", "subtopic": "Vishing, Smishing, Whaling", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the social engineering phishing variant with its medium/target:\n1. Vishing — (p) Phishing conducted via SMS text messages\n2. Smishing — (q) Fraudulent voice phone calls impersonating bank/tech support\n3. Spear-Phishing — (r) Targeted phishing aimed specifically at a C-level executive (CEO/CFO)\n4. Whaling — (s) Customized phishing targeting a specific individual or organization", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "Vishing = Voice phishing (q); Smishing = SMS phishing (p); Spear-phishing = targeted at a specific person/company (s); Whaling = spear-phishing targeting a 'big fish' CEO/CFO (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N14", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Safe Browsing", "subtopic": "Wi-Fi Encryption & VPN", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which wireless security protocol is the modern, most secure standard for home and enterprise Wi-Fi networks (superseding broken WEP and older WPA), and what tool creates an encrypted 'tunnel' when using public Wi-Fi?", "options": {"A": "Wi-Fi security: WPA2 / WPA3; Encrypted tunnel on public Wi-Fi: VPN (Virtual Private Network)", "B": "Wi-Fi security: HTTP; Encrypted tunnel: Telnet", "C": "Wi-Fi security: WEP; Encrypted tunnel: POP3", "D": "Wi-Fi security: FAT32; Encrypted tunnel: HTML"}, "correctAnswer": "A", "explanation": "WPA2 and WPA3 (Wi-Fi Protected Access 2/3 using AES encryption) secure Wi-Fi networks, while a VPN (Virtual Private Network) encrypts all internet traffic over untrusted public Wi-Fi hotspots.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N15", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Cyber Hygiene", "subtopic": "Digital Footprint", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "The trail of data you leave behind while using the Internet—including your social media posts, search history, cookies, IP logs, and online purchases—is known as your:", "options": {"A": "Digital Footprint (Active and Passive)", "B": "BIOS Checksum", "C": "Virtual Memory", "D": "Motherboard Bus"}, "correctAnswer": "A", "explanation": "A Digital Footprint is the permanent or semi-permanent trail of data traces created by a user's online activities (Active = posts you deliberately share; Passive = IP logs and browsing cookies collected in the background).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O01", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Applications", "subtopic": "Word Processor Identification", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "A word processing software best suited for creating, formatting, and editing text documents such as letters, reports, and resumes in the Microsoft Office suite is:", "options": {"A": "MS Excel", "B": "MS Word", "C": "MS PowerPoint", "D": "MS Access"}, "correctAnswer": "B", "explanation": "MS Word is Microsoft's dedicated Word Processing application. MS Excel is a spreadsheet, MS PowerPoint is presentation software, and MS Access is an RDBMS.", "exam": "KVS / NVS TGT ICT", "year": 2023, "shift": "Shift 1", "sourceReference": "Testbook Official PYQ"}, {"id": "MS-O02", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Memory Execution", "subtopic": "Opening Document in RAM", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "question": "While working on a computer, when we open an existing document in MS Office from the hard drive, into which memory is the active working copy temporarily loaded so we can edit it?", "options": {"A": "ROM (Read-Only Memory)", "B": "RAM (Random Access Memory)", "C": "BIOS Flash Chip", "D": "CD-ROM"}, "correctAnswer": "B", "explanation": "Whenever an application or document is opened from secondary storage (HDD/SSD), it is loaded into volatile Primary Memory (RAM) for CPU execution and editing.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "Testbook / KVS PGT Official PYQ"}, {"id": "MS-O03", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Versions", "subtopic": "2007 Ribbon & XML Transition", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "In which version of Microsoft Office did Microsoft first replace the traditional drop-down Menu Bar with the 'Fluent User Interface' RIBBON, the round 'Office Button', and XML-based default file extensions (`.docx`, `.xlsx`, `.pptx`)?", "options": {"A": "MS Office 2003", "B": "MS Office 2007", "C": "MS Office 2010", "D": "MS Office 2016"}, "correctAnswer": "B", "explanation": "MS Office 2007 introduced the Ribbon interface, the round Office Button in the top-left corner, and OpenXML default file extensions (`.docx`, `.xlsx`, `.pptx`, `.accdb`).", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-O04", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Versions", "subtopic": "Backstage View Introduction", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "In which version of Microsoft Office was the round 'Office Button' (from Office 2007) replaced by the rectangular 'File' tab that opens the full-screen 'Backstage View'?", "options": {"A": "MS Office 2003", "B": "MS Office 2010", "C": "MS Office 2019", "D": "MS Office 97"}, "correctAnswer": "B", "explanation": "MS Office 2010 replaced the round Office 2007 button with the 'File' tab, introducing Microsoft's Backstage View for file management, printing, and options.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O05", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Quick Access Toolbar Defaults", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "By default, which three command icons appear on the Quick Access Toolbar (QAT) in the top-left corner of the Title Bar in MS Word, Excel, and PowerPoint (2007–2021)?", "options": {"A": "Cut, Copy, Paste", "B": "Save, Undo, Redo", "C": "New, Open, Print", "D": "Bold, Italic, Underline"}, "correctAnswer": "B", "explanation": "The Quick Access Toolbar (QAT) displays Save, Undo, and Redo by default, remaining visible regardless of which Ribbon tab is active.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "MS-O06", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Ribbon Hierarchy", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Original Practice Question", "question": "What is the correct top-to-bottom structural hierarchy of elements on the MS Office Ribbon?", "options": {"A": "Commands -> Groups -> Tabs -> Ribbon", "B": "Ribbon -> Tabs (e.g., Home, Insert) -> Groups (e.g., Font, Paragraph) -> Commands (Buttons/Controls)", "C": "Groups -> Ribbon -> Tabs -> Status Bar", "D": "Title Bar -> Status Bar -> Groups -> Tabs"}, "correctAnswer": "B", "explanation": "The Ribbon is organized into Tabs; each Tab is divided into logical Groups; and each Group contains individual Commands and an optional Dialog Box Launcher in its bottom-right corner.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O07", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Collapse Ribbon Shortcut", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "Which keyboard shortcut toggles collapsing (hiding) and expanding (pinning) the Ribbon in MS Word, Excel, and PowerPoint so you have more vertical screen space?", "options": {"A": "`Ctrl + F1`", "B": "`Alt + F4`", "C": "`Shift + F3`", "D": "`Ctrl + F12`"}, "correctAnswer": "A", "explanation": "`Ctrl + F1` collapses or expands the Ribbon across MS Office applications.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-O08", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Contextual Tabs", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In MS Office, tabs such as 'Table Design & Layout', 'Picture Format', or 'Chart Design' do NOT appear on the Ribbon until you click on a table, picture, or chart. What are these dynamic tabs called?", "options": {"A": "Permanent System Tabs", "B": "Contextual Tabs", "C": "Backstage Tabs", "D": "Quick Access Tabs"}, "correctAnswer": "B", "explanation": "Contextual Tabs appear dynamically on the Ribbon only when a specific object (table, image, shape, SmartArt, chart, header/footer) is selected.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O09", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "File Formats", "subtopic": "OpenXML 4th Letter Meaning", "difficulty": "Moderate", "questionType": "File Extension", "sourceType": "Exam-pattern Question", "question": "In MS Office 2007 and later OpenXML file extensions, what is the critical difference between `.docx` / `.xlsx` / `.pptx` (ending in `'x'`) and `.docm` / `.xlsm` / `.pptm` (ending in `'m'`)?", "options": {"A": "Files ending in `'x'` are for macOS only, while files ending in `'m'` are for mobile phones", "B": "Files ending in `'x'` are standard XML files that CANNOT store VBA macros for security, whereas files ending in `'m'` are Macro-Enabled files that can store and run VBA macros", "C": "Files ending in `'m'` cannot be saved to a hard drive", "D": "Files ending in `'x'` are limited to 1 page"}, "correctAnswer": "B", "explanation": "In OpenXML extensions, `'x'` denotes standard XML without macros, `'m'` denotes Macro-Enabled (stores VBA code), and `'t'` denotes a Template (`.dotx`, `.xltx`, `.potx`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O10", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Compatibility Mode", "subtopic": "Legacy Binary Files", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "When you open an older MS Word 2003 document (`Report.doc`) inside MS Word 2019 or Microsoft 365, `[Compatibility Mode]` appears in the Title Bar. Why does Word enter Compatibility Mode?", "options": {"A": "Because the computer has run out of RAM", "B": "To preserve the layout of the legacy binary `.doc` format and temporarily disable newer post-2003 features that are unsupported by older versions until you convert the file", "C": "Because the file is infected with a macro virus", "D": "To force the document to print in landscape orientation"}, "correctAnswer": "B", "explanation": "Compatibility Mode ensures backward compatibility with Office 97–2003 (`.doc`, `.xls`, `.ppt`) by disabling newer features unless the user converts the file via `File -> Info -> Convert`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O11", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Versions", "subtopic": "Desktop Office vs Microsoft 365", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "How does 'Microsoft 365' (formerly Office 365) differ from 'Office 2021 Home & Student'?", "options": {"A": "Microsoft 365 is a cloud-connected subscription service offering continuous feature updates, 1 TB OneDrive cloud storage, and multi-device access, whereas Office 2021 is a one-time perpetual license for a single PC/Mac without feature upgrades", "B": "Microsoft 365 only includes MS Paint and Notepad", "C": "Office 2021 requires an active internet connection every 5 minutes to type a letter", "D": "Microsoft 365 cannot open `.docx` files"}, "correctAnswer": "A", "explanation": "Microsoft 365 is a SaaS/subscription offering continuous updates (like XLOOKUP, Dynamic Arrays, Copilot) and OneDrive cloud storage, while Office 2019/2021/2024 are perpetual one-time-purchase releases.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O12", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Clipboard Capacity", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "While the standard Windows system clipboard holds only the most recently copied item (unless Clipboard History is enabled), how many distinct copied items can the built-in 'MS Office Clipboard' task pane store at once?", "options": {"A": "Up to 5 items", "B": "Up to 24 items", "C": "Up to 100 items", "D": "Only 1 item"}, "correctAnswer": "B", "explanation": "The MS Office Clipboard (opened via the dialog launcher in `Home -> Clipboard`) can hold up to 24 individual cut or copied items across Word, Excel, and PowerPoint.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O13", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Interface", "subtopic": "Tell Me / Search Bar", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "Introduced in Office 2016 and enhanced in Office 2019/2021/M365, which keyboard shortcut jumps directly to the 'Tell me what you want to do' / 'Search' box at the top of the window?", "options": {"A": "`Alt + Q`", "B": "`Ctrl + Z`", "C": "`Shift + F7`", "D": "`Alt + F4`"}, "correctAnswer": "A", "explanation": "Pressing `Alt + Q` moves focus directly to the 'Tell me what you want to do' / Microsoft Search bar on the Title Bar.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O14", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Templates", "subtopic": "Purpose of Templates", "difficulty": "Easy", "questionType": "File Extension", "sourceType": "Original Practice Question", "question": "What are the default OpenXML Template file extensions for MS Word, MS Excel, and MS PowerPoint (2007 and later)?", "options": {"A": "`.docx`, `.xlsx`, `.pptx`", "B": "`.dotx` (Word Template), `.xltx` (Excel Template), `.potx` (PowerPoint Template)", "C": "`.txt`, `.csv`, `.ppsx`", "D": "`.docm`, `.xlsm`, `.pptm`"}, "correctAnswer": "B", "explanation": "Templates provide pre-formatted blueprints: `.dotx` for Word, `.xltx` for Excel, and `.potx` for PowerPoint.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-O15", "moduleCode": "O", "module": "O. MS Office Introduction", "topic": "Office Suite", "subtopic": "Publisher & OneDrive", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match each Microsoft Office / 365 application with its primary purpose:\n1. MS Access — (p) Cloud storage and real-time file co-authoring\n2. MS Outlook — (q) Desktop publishing (brochures, flyers, newsletters, postcards)\n3. MS Publisher — (r) Relational Database Management System (RDBMS)\n4. Microsoft OneDrive — (s) Personal Information Manager (Email, Calendar, Contacts, Tasks)", "options": {"A": "1-r, 2-s, 3-q, 4-p", "B": "1-s, 2-r, 3-q, 4-p", "C": "1-r, 2-q, 3-s, 4-p", "D": "1-p, 2-s, 3-q, 4-r"}, "correctAnswer": "A", "explanation": "Access = RDBMS (r); Outlook = Email/PIM (s); Publisher = Desktop publishing for brochures/cards (q); OneDrive = Cloud storage (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P01", "moduleCode": "P", "module": "P. MS Word", "topic": "Paragraph Formatting", "subtopic": "Justify Alignment Shortcut", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Verified PYQ", "question": "Which of the following is the keyboard shortcut to apply 'Justify' paragraph alignment in MS Word?", "options": {"A": "`Ctrl + L`", "B": "`Ctrl + E`", "C": "`Ctrl + R`", "D": "`Ctrl + J`"}, "correctAnswer": "D", "explanation": "In MS Word: `Ctrl + J` = Justify alignment (aligns text evenly along both Left and Right margins); `Ctrl + L` = Left align; `Ctrl + E` = Center align; `Ctrl + R` = Right align.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2021 Official Paper"}, {"id": "MS-P02", "moduleCode": "P", "module": "P. MS Word", "topic": "Paragraph Formatting", "subtopic": "Hanging Indent Ctrl+T", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Verified PYQ", "question": "What is the function of pressing `Ctrl + T` in MS Word?", "options": {"A": "It inserts a new table into the document", "B": "It creates a Hanging Indent (indenting all lines of a paragraph except the first line)", "C": "It opens a new browser tab", "D": "It toggles Track Changes on or off"}, "correctAnswer": "B", "explanation": "In MS Word, `Ctrl + T` creates a Hanging Indent (where the first line remains at the left margin and all subsequent lines move inward). `Ctrl + Shift + T` reduces a hanging indent.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "Testbook / DSSSB TGT CS 2021 Official Paper"}, {"id": "MS-P03", "moduleCode": "P", "module": "P. MS Word", "topic": "Mail Merge", "subtopic": "Mail Merge Terms Match", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Verified PYQ", "question": "Match the MS Word Mail Merge terms with their exact descriptions:\n1. Main Document — (p) A placeholder (such as `<<City>>`) inserted into the document that pulls personalized data\n2. Data Source — (q) The template letter/document containing the common text and graphics sent to all recipients\n3. Merge Field — (r) The structured file (e.g., Excel sheet or Access table) containing recipient names and addresses", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-p, 2-r, 3-q", "D": "1-q, 2-p, 3-r"}, "correctAnswer": "A", "explanation": "In Mail Merge (`Mailings` tab): Main Document holds the common boilerplate text (q); Data Source holds the recipient records table (r); Merge Field (`<<Field>>`) is the placeholder token (p).", "exam": "DSSSB / KVS TGT Exam", "year": 2023, "shift": "Shift 1", "sourceReference": "Testbook Official PYQ"}, {"id": "MS-P04", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Font Size Limits", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Adapted PYQ", "question": "In MS Word (2007–2021/M365), what is the range of font sizes displayed in the standard Font Size drop-down list on the Home tab, and what is the absolute minimum and maximum font size you can set by typing a number manually into the Font Size box?", "options": {"A": "Drop-down: 8 pt to 72 pt; Manual entry: 1 pt to 1638 pt", "B": "Drop-down: 1 pt to 100 pt; Manual entry: 1 pt to 500 pt", "C": "Drop-down: 10 pt to 48 pt; Manual entry: 8 pt to 72 pt", "D": "Drop-down: 6 pt to 96 pt; Manual entry: 1 pt to 409 pt"}, "correctAnswer": "A", "explanation": "The Font Size dropdown list shows sizes from 8 pt to 72 pt, while typing directly into the Font Size box accepts any value from 1 pt to 1638 pt (in 0.5-point increments).", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-P05", "moduleCode": "P", "module": "P. MS Word", "topic": "Word Interface", "subtopic": "Zoom Slider Range", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "What are the minimum, default, and maximum Zoom percentages supported in an MS Word document window?", "options": {"A": "Minimum: 10%, Default: 100%, Maximum: 500%", "B": "Minimum: 10%, Default: 100%, Maximum: 400%", "C": "Minimum: 20%, Default: 100%, Maximum: 200%", "D": "Minimum: 50%, Default: 100%, Maximum: 1000%"}, "correctAnswer": "A", "explanation": "MS Word supports a Zoom range from 10% (minimum) to 500% (maximum), with 100% as the default. (MS Excel and PowerPoint have a maximum zoom of 400%.)", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "MS-P06", "moduleCode": "P", "module": "P. MS Word", "topic": "Paragraph Formatting", "subtopic": "Drop Cap Default & Max", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Adapted PYQ", "question": "When you insert a 'Drop Cap' (`Insert -> Text -> Drop Cap`) in MS Word, how many lines does the large initial capital letter drop by default, and what is the maximum number of lines it can be set to drop?", "options": {"A": "Default: 2 lines; Maximum: 5 lines", "B": "Default: 3 lines; Maximum: 10 lines", "C": "Default: 4 lines; Maximum: 12 lines", "D": "Default: 1 line; Maximum: 8 lines"}, "correctAnswer": "B", "explanation": "In MS Word's Drop Cap feature, the default 'Lines to drop' is 3 lines, and the maximum allowed is 10 lines (minimum is 1). Valid positions are None, Dropped, and In Margin.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-P07", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Subscript & Superscript Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Word, which keyboard shortcuts are used to format selected text as Subscript (e.g., $\\text{H}_2\\text{O}$) and Superscript (e.g., $x^2$) respectively?", "options": {"A": "Subscript: `Ctrl + =`; Superscript: `Ctrl + Shift + +`", "B": "Subscript: `Ctrl + Shift + +`; Superscript: `Ctrl + =`", "C": "Subscript: `Alt + =`; Superscript: `Alt + +`", "D": "Subscript: `Ctrl + [`; Superscript: `Ctrl + ]`"}, "correctAnswer": "A", "explanation": "`Ctrl + =` toggles Subscript, and `Ctrl + Shift + +` (or `Ctrl + Shift + =`) toggles Superscript.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "MS-P08", "moduleCode": "P", "module": "P. MS Word", "topic": "Page Layout", "subtopic": "Gutter Margin", "difficulty": "Easy", "questionType": "MS Word Feature", "sourceType": "Adapted PYQ", "question": "In MS Word's Page Setup dialog box, what is a 'Gutter Margin' and which two Gutter positions are available?", "options": {"A": "Extra space added to the side (Left) or Top margin of a document to ensure text is not hidden when pages are bound into a book; Positions: Left and Top", "B": "A margin added only to the bottom of the page; Positions: Bottom and Right", "C": "The space between two columns in a newspaper layout", "D": "A decorative border around a picture"}, "correctAnswer": "A", "explanation": "A Gutter margin adds extra inner binding allowance so spiral or book binding does not obscure text. In the Page Setup dialog, Gutter Position can be set to 'Left' or 'Top'.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-P09", "moduleCode": "P", "module": "P. MS Word", "topic": "Page Layout", "subtopic": "Page Break vs Section Break", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Exam-pattern Question", "question": "Suppose you have a 10-page Portrait document in MS Word and you want ONLY Page 5 (which contains a wide table) to be in Landscape orientation while Pages 1–4 and 6–10 remain Portrait. Which feature MUST you insert before and after Page 5?", "options": {"A": "Manual Line Breaks (`Shift + Enter`)", "B": "Section Breaks (`Layout -> Breaks -> Next Page`)", "C": "Standard Page Breaks (`Ctrl + Enter`)", "D": "Column Breaks (`Ctrl + Shift + Enter`)"}, "correctAnswer": "B", "explanation": "Page orientation, margins, columns, and headers/footers are section-level properties. Inserting 'Next Page' Section Breaks before and after Page 5 isolates Page 5 into its own section so its orientation can be set to Landscape independently.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P10", "moduleCode": "P", "module": "P. MS Word", "topic": "Page Layout", "subtopic": "Types of Section Breaks", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Exam-pattern Question", "question": "Which of the following are the FOUR valid types of Section Breaks available under `Layout -> Breaks` in MS Word?", "options": {"A": "Next Page, Continuous, Even Page, Odd Page", "B": "Top Page, Bottom Page, Left Page, Right Page", "C": "Portrait Break, Landscape Break, Gutter Break, Margin Break", "D": "Header Break, Footer Break, Footnote Break, Endnote Break"}, "correctAnswer": "A", "explanation": "The four Section Break types in MS Word are: Next Page, Continuous (starts a new section on the exact same page, e.g., switching from 1 column to 2 columns mid-page), Even Page, and Odd Page.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P11", "moduleCode": "P", "module": "P. MS Word", "topic": "Breaks", "subtopic": "Page vs Column vs Line Break Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "Match the MS Word break action with its exact keyboard shortcut:\n1. Insert Page Break — (p) `Shift + Enter`\n2. Insert Column Break — (q) `Ctrl + Enter`\n3. Insert Manual Line Break (within same paragraph) — (r) `Ctrl + Shift + Enter`", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-p, 2-r, 3-q", "D": "1-q, 2-p, 3-r"}, "correctAnswer": "A", "explanation": "Page Break = `Ctrl + Enter` (q); Column Break = `Ctrl + Shift + Enter` (r); Manual Line Break (soft return without starting a new paragraph) = `Shift + Enter` (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P12", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Change Case Options & Shortcut", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Exam-pattern Question", "question": "How many case options appear in the 'Change Case' (`Aa`) drop-down menu on the Home tab in MS Word, and which keyboard shortcut cycles selected text through UPPERCASE, lowercase, and Title Case?", "options": {"A": "5 options (Sentence case, lowercase, UPPERCASE, Capitalize Each Word, tOGGLE cASE); Shortcut: `Shift + F3` (cycles 3 states)", "B": "3 options; Shortcut: `Ctrl + F3`", "C": "4 options; Shortcut: `Alt + F3`", "D": "6 options; Shortcut: `F3`"}, "correctAnswer": "A", "explanation": "The Change Case dropdown (`Home -> Font -> Aa`) lists 5 options: Sentence case., lowercase, UPPERCASE, Capitalize Each Word, and tOGGLE cASE. Pressing `Shift + F3` cycles through 3 states (UPPERCASE -> lowercase -> Capitalize Each Word).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P13", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Footnote vs Endnote Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Word (`References` tab), what are the keyboard shortcuts to insert a 'Footnote' (at the bottom of the current page) and an 'Endnote' (at the end of the document)?", "options": {"A": "Footnote: `Ctrl + Alt + F`; Endnote: `Ctrl + Alt + D`", "B": "Footnote: `Ctrl + F`; Endnote: `Ctrl + D`", "C": "Footnote: `Alt + F`; Endnote: `Alt + E`", "D": "Footnote: `Ctrl + Shift + F`; Endnote: `Ctrl + Shift + D`"}, "correctAnswer": "A", "explanation": "`Ctrl + Alt + F` inserts a Footnote at the bottom of the current page; `Ctrl + Alt + D` inserts an Endnote at the end of the document.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-P14", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Spell Check vs Thesaurus", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "question": "In MS Word, pressing `F7` launches the Spelling & Grammar checker (Editor). What does pressing `Shift + F7` launch?", "options": {"A": "Word Count dialog box", "B": "Thesaurus (to look up synonyms and antonyms of the selected word)", "C": "Print Preview", "D": "Mail Merge Wizard"}, "correctAnswer": "B", "explanation": "`F7` runs Spelling & Grammar check, while `Shift + F7` opens the Thesaurus pane to find synonyms and antonyms.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS Official Paper"}, {"id": "MS-P15", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Wavy Underline Colors", "difficulty": "Easy", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "In MS Word's automatic proofing, what do a wavy RED underline and a wavy BLUE (or double blue / green in older versions) underline beneath text indicate?", "options": {"A": "Red wavy line = Potential Spelling Error; Blue double/wavy line (Green in 2007/2010) = Potential Grammar or Contextual Usage Error", "B": "Red wavy line = Hyperlink; Blue line = Bold text", "C": "Red wavy line = Virus alert; Blue line = Saved text", "D": "Red wavy line = Footnote; Blue line = Bookmark"}, "correctAnswer": "A", "explanation": "MS Word flags misspelled words (words not in its dictionary) with a wavy red underline, and grammar/contextual consistency issues with a double blue underline (or green wavy line in Word 2007/2010).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P16", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Track Changes & Word Count Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "Under the `Review` tab in MS Word, which keyboard shortcut toggles 'Track Changes' on/off, and which shortcut opens the 'Word Count' statistics dialog box?", "options": {"A": "Track Changes: `Ctrl + Shift + E`; Word Count: `Ctrl + Shift + G`", "B": "Track Changes: `Ctrl + T`; Word Count: `Ctrl + W`", "C": "Track Changes: `Alt + T`; Word Count: `Alt + C`", "D": "Track Changes: `Ctrl + E`; Word Count: `Ctrl + G`"}, "correctAnswer": "A", "explanation": "`Ctrl + Shift + E` toggles Track Changes, and `Ctrl + Shift + G` opens the Word Count dialog showing Pages, Words, Characters (no spaces), Characters (with spaces), Paragraphs, and Lines.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P17", "moduleCode": "P", "module": "P. MS Word", "topic": "Word Interface", "subtopic": "Five Document Views", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "Which of the following is the DEFAULT document view in MS Word (showing exact margins, headers, footers, and page breaks), and which view hides headers, footers, and floating graphics so you can focus purely on rapid text editing?", "options": {"A": "Default View: Print Layout; Fast text-only editing view: Draft View", "B": "Default View: Web Layout; Fast view: Slide Sorter", "C": "Default View: Outline View; Fast view: Read Mode", "D": "Default View: Normal View; Fast view: Page Break Preview"}, "correctAnswer": "A", "explanation": "MS Word has 5 views on the `View` tab: Read Mode, Print Layout (Default), Web Layout, Outline, and Draft. (Note: Normal View and Page Break Preview belong to MS Excel/PowerPoint, NOT MS Word!)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P18", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "Table Limits & Tab Key Behavior", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Exam-pattern Question", "question": "What are the minimum and maximum number of Columns allowed when inserting a Table in MS Word, and what happens when you press the `Tab` key while the cursor is in the very last (bottom-right) cell of a Word table?", "options": {"A": "Min: 1 column, Max: 63 columns; pressing `Tab` in the last cell automatically inserts a new row at the bottom of the table", "B": "Min: 2 columns, Max: 256 columns; pressing `Tab` deletes the table", "C": "Min: 1 column, Max: 16,384 columns; pressing `Tab` closes Word", "D": "Min: 1 column, Max: 32 columns; pressing `Tab` merges all cells"}, "correctAnswer": "A", "explanation": "An MS Word table supports 1 to 63 columns (and up to 32,767 rows). Pressing `Tab` inside the bottom-right cell appends a brand-new row to the table.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P19", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Format Painter Double-Click", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "You want to copy the font, color, and size formatting of Heading 1 and apply it to 6 non-adjacent headings scattered throughout an MS Word document without re-clicking the Format Painter button each time. How should you use Format Painter?", "options": {"A": "Single-click the Format Painter icon", "B": "Double-click the Format Painter icon (and press `Esc` when finished)", "C": "Right-click the Format Painter icon and click Delete", "D": "Press `Ctrl + V` six times"}, "correctAnswer": "B", "explanation": "Single-clicking Format Painter applies formatting to one target and turns off; Double-clicking locks Format Painter active so you can paint formatting onto multiple selections until you press `Esc`. Keyboard shortcut: `Ctrl + Shift + C` (copy formatting) and `Ctrl + Shift + V` (paste formatting).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P20", "moduleCode": "P", "module": "P. MS Word", "topic": "Design Tab", "subtopic": "Watermark, Page Color, Page Borders Location", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "In MS Word 2013, 2016, 2019, 2021, and Microsoft 365, under which Ribbon Tab and Group are 'Watermark', 'Page Color', and 'Page Borders' located?", "options": {"A": "`Design` Tab -> `Page Background` Group (note: they were in `Page Layout` in Word 2007/2010)", "B": "`Insert` Tab -> `Pages` Group", "C": "`View` Tab -> `Show` Group", "D": "`References` Tab -> `Captions` Group"}, "correctAnswer": "A", "explanation": "Starting in Word 2013 through M365, Watermark, Page Color, and Page Borders reside on the `Design` tab in the `Page Background` group (in Word 2007/2010 they were on the `Page Layout` tab).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P21", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Automatic Table of Contents", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "To generate an automatic 'Table of Contents' (`References -> Table of Contents`) in MS Word without manually typing page numbers, how must your chapter and section titles be formatted in the document?", "options": {"A": "They must be formatted using built-in Heading Styles (`Heading 1`, `Heading 2`, `Heading 3` from `Home -> Styles`)", "B": "They must be typed in red Comic Sans font", "C": "They must be placed inside footnotes", "D": "They must be enclosed in square brackets `[ ]`"}, "correctAnswer": "A", "explanation": "MS Word builds an automatic Table of Contents by scanning paragraphs formatted with built-in Heading styles (`Heading 1`, `Heading 2`, `Heading 3`) or outline levels.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P22", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "Bookmark vs Cross-Reference", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "In MS Word (`Insert -> Links`), which feature lets you assign a hidden name to a specific location or text selection so you can jump directly to it later via a hyperlink or `Go To`, and what are the rules for its name?", "options": {"A": "Bookmark; must begin with a letter, can contain letters, numbers, and underscores `_`, but CANNOT contain spaces", "B": "Watermark; must begin with a number and contain spaces", "C": "Drop Cap; limited to 3 characters", "D": "SmartArt; must end with `.docx`"}, "correctAnswer": "A", "explanation": "A Bookmark marks a specific place in a document for hyperlinks/cross-references. Bookmark names must start with a letter and cannot contain spaces (use underscores `_` instead).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P23", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Font Size Step Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Word, pressing `Ctrl + Shift + >` increases font size to the next preset value in the Font dropdown (e.g., from 12 pt to 14 pt). Which shortcut increases the font size by exactly `1 point` (e.g., from 12 pt to 13 pt)?", "options": {"A": "`Ctrl + ]` (and `Ctrl + [` decreases by 1 point)", "B": "`Alt + ]`", "C": "`Ctrl + +`", "D": "`Shift + Up Arrow`"}, "correctAnswer": "A", "explanation": "`Ctrl + ]` increases font size by exactly 1 pt; `Ctrl + [` decreases font size by exactly 1 pt.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P24", "moduleCode": "P", "module": "P. MS Word", "topic": "Paragraph Formatting", "subtopic": "Line Spacing Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Word, what do the keyboard shortcuts `Ctrl + 1`, `Ctrl + 2`, and `Ctrl + 5` do to the current paragraph?", "options": {"A": "`Ctrl + 1` = Single-space lines; `Ctrl + 2` = Double-space lines; `Ctrl + 5` = Set 1.5-line spacing", "B": "`Ctrl + 1` = Heading 1; `Ctrl + 2` = Heading 2; `Ctrl + 5` = Heading 5", "C": "`Ctrl + 1` = 1 column; `Ctrl + 2` = 2 columns; `Ctrl + 5` = 5 columns", "D": "`Ctrl + 1` = Zoom 100%; `Ctrl + 2` = Zoom 200%; `Ctrl + 5` = Zoom 500%"}, "correctAnswer": "A", "explanation": "In MS Word: `Ctrl + 1` sets single (1.0) line spacing; `Ctrl + 2` sets double (2.0) line spacing; `Ctrl + 5` sets 1.5 line spacing; `Ctrl + 0` adds/removes 12 pt space before a paragraph.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P25", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Clear Formatting Shortcuts", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In MS Word, which keyboard shortcut strips all character-level font formatting (bold, italic, font size, color) back to the underlying style (`Clear All Formatting`), and which shortcut resets paragraph-level formatting (indents, line spacing, alignment)?", "options": {"A": "Clear character formatting: `Ctrl + Spacebar`; Reset paragraph formatting: `Ctrl + Q`", "B": "Clear character formatting: `Shift + Spacebar`; Reset paragraph formatting: `Ctrl + P`", "C": "Clear character formatting: `Alt + Spacebar`; Reset paragraph formatting: `Ctrl + Z`", "D": "Both use `Ctrl + Backspace`"}, "correctAnswer": "A", "explanation": "`Ctrl + Spacebar` resets character/font formatting to the default style font; `Ctrl + Q` resets paragraph formatting (indents, alignment, spacing).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P26", "moduleCode": "P", "module": "P. MS Word", "topic": "Editing Shortcuts", "subtopic": "Delete Word Left vs Right", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "While typing in MS Word, pressing `Backspace` deletes one character to the left and `Delete` removes one character to the right. Which shortcuts delete an ENTIRE WORD to the left or right of the cursor at once?", "options": {"A": "Delete word to the left: `Ctrl + Backspace`; Delete word to the right: `Ctrl + Delete`", "B": "Delete word to the left: `Shift + Backspace`; Delete word to the right: `Shift + Delete`", "C": "Delete word to the left: `Alt + Backspace`; Delete word to the right: `Alt + Delete`", "D": "Delete word to the left: `Ctrl + Left Arrow`; Delete word to the right: `Ctrl + Right Arrow`"}, "correctAnswer": "A", "explanation": "`Ctrl + Backspace` deletes the entire word immediately to the left of the insertion point; `Ctrl + Delete` deletes the entire word immediately to the right.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P27", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "Header & Footer Options", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "When editing a Header or Footer in MS Word, the 'Header & Footer' contextual tab appears with three checkboxes in the 'Options' group. What is the purpose of checking 'Different First Page' and 'Different Odd & Even Pages'?", "options": {"A": "'Different First Page' suppresses or customizes the header/footer on the cover/first page; 'Different Odd & Even Pages' lets you place book titles on even (left) pages and chapter titles on odd (right) pages", "B": "It deletes all odd-numbered pages from the document", "C": "It prints the document in two columns", "D": "It converts headers into footnotes"}, "correctAnswer": "A", "explanation": "In the Header & Footer contextual tab -> Options group: 'Different First Page' allows a clean cover page without a page number, and 'Different Odd & Even Pages' supports recto-verso book layouts.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P28", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "Insert Equation & Symbol", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Word (`Insert -> Symbols` group), which keyboard shortcut inserts a new mathematical Equation box directly at the cursor?", "options": {"A": "`Alt + =`", "B": "`Ctrl + =`", "C": "`Shift + =`", "D": "`Ctrl + E`"}, "correctAnswer": "A", "explanation": "Pressing `Alt + =` in MS Word opens the built-in Equation Editor box (`Insert -> Equation`). Note that inside MS Excel, `Alt + =` inserts the `=SUM()` AutoSum formula!", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P29", "moduleCode": "P", "module": "P. MS Word", "topic": "Text Formatting", "subtopic": "Special Underlines", "difficulty": "Difficult", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "In MS Word, `Ctrl + U` applies a continuous single underline across words and spaces. Which shortcut applies a 'Double Underline', and which shortcut underlines 'Words Only' (skipping the spaces between words)?", "options": {"A": "Double Underline: `Ctrl + Shift + D`; Words-Only Underline: `Ctrl + Shift + W`", "B": "Double Underline: `Ctrl + D`; Words-Only Underline: `Ctrl + W`", "C": "Double Underline: `Alt + U`; Words-Only Underline: `Shift + U`", "D": "Double Underline: `Ctrl + Alt + U`; Words-Only Underline: `Ctrl + Space`"}, "correctAnswer": "A", "explanation": "`Ctrl + Shift + D` applies a Double Underline, and `Ctrl + Shift + W` underlines only the words (leaving spaces un-underlined).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P30", "moduleCode": "P", "module": "P. MS Word", "topic": "Page Layout", "subtopic": "Default Page Margins & Orientation", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In MS Word 2007 and later (2010, 2016, 2019, 2021, M365), what are the default 'Normal' page margins (Top, Bottom, Left, Right) and the default Page Orientation?", "options": {"A": "1 inch (2.54 cm) on all four sides; Portrait orientation", "B": "1.25 inches Left/Right and 1 inch Top/Bottom; Landscape orientation", "C": "0.5 inches on all four sides; Portrait orientation", "D": "2 inches on all four sides; Landscape orientation"}, "correctAnswer": "A", "explanation": "From Word 2007 onward, the 'Normal' margin preset is 1 inch (2.54 cm) on Top, Bottom, Left, and Right, with Portrait orientation. (Word 2003 used 1 inch Top/Bottom and 1.25 inches Left/Right.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P31", "moduleCode": "P", "module": "P. MS Word", "topic": "Insert Tab", "subtopic": "SmartArt vs WordArt vs Quick Parts", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the MS Word `Insert` tab feature with its description:\n1. SmartArt — (p) Reusable building blocks of content such as AutoText, Document Properties (Author/Title), and Fields\n2. WordArt — (q) Pre-designed process, hierarchy, cycle, and Venn diagrams for visual information\n3. Quick Parts — (r) Decorative stylized text with 3D shadows, reflections, glows, and curved paths", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-p, 2-r, 3-q", "D": "1-q, 2-p, 3-r"}, "correctAnswer": "A", "explanation": "SmartArt creates structural diagrams (Hierarchy, Process, Cycle, Matrix, Pyramid) (q); WordArt creates decorative display text (r); Quick Parts inserts AutoText and document property fields (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P32", "moduleCode": "P", "module": "P. MS Word", "topic": "Word Interface", "subtopic": "Ruler & Indentation Markers", "difficulty": "Moderate", "questionType": "MS Word Feature", "sourceType": "Original Practice Question", "question": "On the Horizontal Ruler in MS Word, what do the top downward-pointing triangle, the bottom upward-pointing triangle on the left, and the small rectangular block beneath it control respectively?", "options": {"A": "Top triangle: First Line Indent; Bottom triangle: Hanging Indent; Bottom rectangle: Left Indent (moves both together)", "B": "Top triangle: Right Margin; Bottom triangle: Top Margin; Rectangle: Tab Stop", "C": "Top triangle: Font Size; Bottom triangle: Line Spacing; Rectangle: Page Break", "D": "They only decorative icons"}, "correctAnswer": "A", "explanation": "On Wo
