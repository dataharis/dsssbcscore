  <!-- EMBEDDED APPLICATION DATASET -->
  <script id="appDataJson" type="application/json">{"modules": [{"code": "A", "id": "MOD-A", "title": "Module A: Introduction to Computers", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Definition & Characteristics of Computers", "Advantages, Limitations & Applications", "Basic Functional Units & Block Diagram (Von Neumann)", "Input-Process-Output (IPO) Cycle", "Data vs Information & Characteristics of Good Information", "Electronic Data Processing (EDP) System", "Hardware, Software, Firmware & Liveware", "Computer Literacy, Terminology & Analog/Digital/Hybrid Intro"], "onePageRevision": ["A computer is a programmable electronic device that accepts raw data (Input), processes it via arithmetic/logical instructions (Process), stores it (Memory), and produces meaningful output (Information).", "Key Characteristics: Speed (MIPS/FLOPS, picoseconds/nanoseconds), Accuracy (GIGO - Garbage In, Garbage Out applies when input is flawed), Diligence (free from fatigue/monotony), Versatility, Storage Capacity, Automation, and Reliability.", "Limitations: Zero IQ (no intrinsic intelligence unless programmed), lack of decision-making/common sense, dependency on power and human instructions.", "IPO Cycle: Input -> Processing (CPU) -> Output -> Storage (Feedback loop). EDP (Electronic Data Processing) automates raw facts into structured decision-ready information.", "Good Information Traits (ACCURATE): Accurate, Complete, Cost-effective, Understandable, Relevant, Accessible, Timely, Easy-to-use.", "Hardware (physical tangible parts), Software (programs/instructions), Firmware (software permanently etched into non-volatile ROM/EEPROM/Flash, e.g., BIOS/UEFI), Liveware/Humanware (users/operators).", "Von Neumann Architecture (1945): Stored-program concept where both data and instructions share a single read-write memory and travel over a common bus (creating the 'Von Neumann bottleneck')."], "sections": [{"heading": "1. Definition, Characteristics & Limitations of Computers", "content": "The term 'Computer' is derived from the Latin word 'Computare', meaning to calculate or programmable machine. Modern digital computers operate on binary digits (0 and 1) and follow the Input-Process-Output-Storage (IPOS) model.", "bullets": ["Speed: Measured in Megahertz (MHz) / Gigahertz (GHz) for clock speed, MIPS (Million Instructions Per Second) for general CPUs, and FLOPS (Floating Point Operations Per Second - GigaFLOPS, TeraFLOPS, PetaFLOPS, ExaFLOPS) for supercomputers. Time units: millisecond (10^-3 s), microsecond (10^-6 s), nanosecond (10^-9 s), picosecond (10^-12 s).", "Accuracy & GIGO: Computers perform calculations with near-100% accuracy using hardware circuits. Errors occur primarily due to faulty human input or buggy code, known as GIGO (Garbage In, Garbage Out).", "Diligence: Unlike humans, a computer never suffers from tiredness, lack of concentration, or boredom; the 10-millionth calculation is as accurate as the first.", "Versatility & Automation: Capable of switching from payroll accounting to media rendering or network routing instantaneously under stored program control.", "Limitations: Zero IQ, no emotional intelligence or heuristic intuition, inability to self-correct faulty logic without explicit exception handling."], "examTrap": "Exam Trap: 'GIGO' relates to the Accuracy characteristic of computers. Also note that CPU clock speed is in Hz (GHz), whereas supercomputer speed is always measured in FLOPS (not MIPS)."}, {"heading": "2. Functional Units & Block Diagram (Von Neumann Model)", "content": "Proposed by John von Neumann in 1945, the standard computer block diagram consists of four core functional units interconnected by the system bus:", "bullets": ["Input Unit: Accepts external user data in human-readable form and converts it into binary coded signals (via input interfaces) for memory/CPU.", "Central Processing Unit (CPU): The brain of the computer containing: (a) Arithmetic Logic Unit (ALU) for arithmetic (+, -, *, /) and bitwise/logical (AND, OR, NOT, XOR, comparisons) operations; (b) Control Unit (CU) which acts as the central nervous system directing timing and control signals using instruction decoders; (c) Registers (high-speed temporary flip-flop storage inside CPU).", "Memory / Storage Unit: Primary Memory (RAM/ROM directly accessible by CPU) holds active instructions and intermediate results; Secondary Storage (HDD/SSD) provides permanent non-volatile archiving.", "Output Unit: Converts binary processed results from primary memory into human-perceivable forms (visual display, hardcopy print, audio)."], "examTrap": "Exam Trap: The Control Unit (CU) does NOT execute data processing itself; it decodes instructions and generates control signals so the ALU and memory perform the actual operations."}, {"heading": "3. Data vs Information, EDP & Firmware", "content": "In Electronic Data Processing (EDP), raw unorganized facts and figures (Data) are validated, sorted, aggregated, and analyzed to yield meaningful context (Information) for decision-making.", "bullets": ["Data: Raw, unprocessed alphanumeric symbols, measurements, or observations (e.g., '98, 85, 72').", "Information: Processed, organized, structured data with context and meaning (e.g., 'Class Average Score = 85%').", "Characteristics of Good Information: Timeliness, Accuracy, Relevance, Completeness, Verifiability, and Conciseness.", "Hardware vs Software vs Firmware: Hardware is physical electronics (ICs, PCB, monitor); Software is logical code (OS, MS Office); Firmware is low-level control software embedded in non-volatile semiconductor memory (ROM/EPROM/EEPROM/Flash) such as BIOS, UEFI, router OS, or washing machine microcontrollers."], "examTrap": "Exam Trap: Firmware is often called 'software for hardware'. It is non-volatile and executes first during power-on (bootstrapping)."}]}, {"code": "B", "id": "MOD-B", "title": "Module B: History and Generations of Computers", "category": "Computer Fundamentals", "targetQuestions": 20, "subtopics": ["Early Calculating Devices (Abacus to Hollerith)", "Electromechanical & Early Electronic Computers (Mark I, ENIAC, EDVAC, EDSAC, UNIVAC)", "Pioneers: Babbage, Ada Lovelace, Alan Turing, John von Neumann", "First Generation (1940–1956): Vacuum Tubes", "Second Generation (1956–1963): Transistors", "Third Generation (1964–1971): Integrated Circuits (ICs)", "Fourth Generation (1971–Present): Microprocessors (VLSI)", "Fifth Generation (Present & Beyond): ULSI, AI & Quantum Computing"], "onePageRevision": ["Abacus (~3000 BC, China/Mesopotamia): First mechanical counting device using beads on rods (addition/subtraction).", "Napier's Bones (1617, John Napier): Ivory rods for multiplication/division; introduced logarithms & decimal point.", "Pascaline (1642, Blaise Pascal): First mechanical adding machine (gears/wheels; only addition & subtraction).", "Stepped Reckoner / Leibniz Wheel (1673, Gottfried Wilhelm Leibniz): Added multiplication, division, and square roots using fluted drums.", "Jacquard Loom (1801, Joseph Marie Jacquard): First use of punched cards to control textile weaving patterns.", "Charles Babbage ('Father of the Computer'): Difference Engine (1822, steam-powered polynomial evaluator) & Analytical Engine (1837, first general-purpose mechanical computer design with 'Mill' [ALU], 'Store' [Memory], input/output punched cards).", "Lady Ada Lovelace: Wrote the first algorithm (Bernoulli numbers) for the Analytical Engine; 'World's First Computer Programmer'.", "Herman Hollerith (1890): Electromechanical punched-card Tabulating Machine for US Census; founded Tabulating Machine Co. -> became IBM (1924).", "Alan Turing ('Father of Modern Computer Science & AI'): Proposed Universal Turing Machine (1936), cracked Enigma (Bombe), and devised the Turing Test (1950).", "ENIAC (1945, Eckert & Mauchly): First general-purpose electronic digital computer (decimal, 18,000 vacuum tubes, no stored program initially). EDVAC (Von Neumann stored-program design). EDSAC (1949, Maurice Wilkes - first operational stored-program computer). UNIVAC-I (1951 - first commercial computer).", "5 Generations: 1st = Vacuum Tubes + Magnetic Drums + Machine Lang; 2nd = Transistors + Magnetic Core + Assembly/FORTRAN/COBOL; 3rd = ICs (SSI/MSI, Kilby & Noyce) + Semiconductor RAM + OS/Multiprogramming; 4th = Microprocessor (VLSI, Intel 4004 by Ted Hoff 1971) + GUI/LAN; 5th = ULSI + AI/Parallel Processing."], "sections": [{"heading": "1. Early Mechanical & Electromechanical Milestones", "content": "Understanding the chronological evolution of computing hardware and pioneers is a staple of DSSSB, KVS, and NVS exams.", "bullets": ["Abacus (c. 3000 BC): Wooden frame divided into Heaven (upper deck, value 5) and Earth (lower deck, value 1) beads.", "Napier's Bones (1617): Invented by Scottish mathematician John Napier using 9 bone/ivory strips inscribed with multiplication tables (rabdology).", "Slide Rule (1622): Invented by William Oughtred based on Napier's logarithms for rapid analog multiplication and trigonometry.", "Pascaline / Arithmetic Machine (1642): Invented by French mathematician Blaise Pascal at age 19 to help his tax-collector father; used interlocking cogwheels (carry mechanism).", "Leibniz Calculator / Stepped Reckoner (1673): German mathematician Gottfried Leibniz extended Pascal's design to perform all four basic arithmetic operations (+, -, *, /); Leibniz also formalized the modern binary number system.", "Charles Babbage's Engines: Difference Engine (1822) computed mathematical/astronomical tables using finite differences; Analytical Engine (1837) introduced the exact blueprint of modern computers: 'Store' (Memory), 'Mill' (ALU), Control barrel, and Punched Card I/O.", "Ada Augusta Lovelace (1843): Translated Luigi Menabrea's paper on the Analytical Engine and appended Note G containing an algorithm to compute Bernoulli numbers—earning her the title 'First Computer Programmer'. The defense language 'Ada' is named after her.", "Hollerith Tabulating Machine (1890): Herman Hollerith used electrical contacts through holes in punched cards to process the 1890 US Census in 1/8th the expected time. His company merged into Computing-Tabulating-Recording (CTR) in 1911 and was renamed IBM (International Business Machines) in 1924 by Thomas J. Watson."], "examTrap": "Exam Trap: EDSAC (1949, Maurice Wilkes) was the first computer to ACTUALLY RUN a stored program, even though EDVAC was designed earlier by Von Neumann, Eckert, and Mauchly (EDVAC became operational in 1951)."}, {"heading": "2. Early Electronic Computers (1937–1951)", "content": "The transition from mechanical relays to electronic vacuum tubes marked the birth of modern digital computing:", "bullets": ["ABC (Atanasoff-Berry Computer, 1939–42): Built by John Vincent Atanasoff and Clifford Berry; first special-purpose electronic digital computer (used binary and regenerative capacitor drum memory to solve linear equations, not programmable).", "Harvard Mark I (ASCC, 1944): Designed by Howard Aiken with IBM; giant electromechanical relay computer (50 feet long). Grace Hopper worked on Mark I/II and popularized the term 'debugging' after removing a real moth from a relay.", "Colossus (1943, Tommy Flowers, UK): Special-purpose electronic computer built at Bletchley Park to break German Lorenz ciphers.", "ENIAC (Electronic Numerical Integrator and Computer, 1945): Built by J. Presper Eckert and John Mauchly at Univ. of Pennsylvania for US Army ballistic trajectory tables. Used ~18,000 vacuum tubes, weighed 30 tons, operated in decimal (not binary), and had to be rewired with plugboards.", "EDVAC (Electronic Discrete Variable Automatic Computer): Proposed in Von Neumann's 1945 'First Draft of a Report on the EDVAC'; introduced binary arithmetic and the Stored-Program Concept.", "EDSAC (Electronic Delay Storage Automatic Calculator, May 1949): Built by Maurice Wilkes at Cambridge University using mercury delay lines; first practical operational stored-program computer.", "UNIVAC I (Universal Automatic Computer I, 1951): Built by Eckert and Mauchly; first commercially available general-purpose electronic computer (delivered to US Census Bureau in 1951; famous for predicting Eisenhower's 1952 election victory)."], "examTrap": "Exam Trap: Memorize the full forms of ENIAC, EDVAC, EDSAC, and UNIVAC—DSSSB frequently swaps 'Discrete' (EDVAC) with 'Delay' (EDSAC) or 'Numerical' (ENIAC)."}, {"heading": "3. The Five Generations of Computers", "content": "Computer generations are classified primarily by the fundamental switching circuit technology used inside the processor:", "bullets": ["First Generation (1940–1956) — Vacuum Tubes (Thermionic Valves): Invented by Lee De Forest / John Ambrose Fleming. Memory: Magnetic drums & delay lines. I/O: Punched cards & paper tape. Speed: Milliseconds (10^-3 s). Languages: Machine language (0s and 1s). Examples: ENIAC, EDVAC, EDSAC, UNIVAC-I, IBM 650, IBM 701.", "Second Generation (1956–1963) — Transistors: Invented at Bell Labs (1947) by John Bardeen, Walter Brattain, and William Shockley using semiconductor materials (Silicon/Germanium). Memory: Magnetic core memory (ferrite rings) & magnetic tapes/disks. Speed: Microseconds (10^-6 s). Languages: Assembly language & early HLLs (FORTRAN, COBOL), Batch processing. Examples: IBM 1401, IBM 7090, IBM 1620, CDC 1604, CDC 3600, UNIVAC 1108, Honeywell 400.", "Third Generation (1964–1971) — Integrated Circuits (ICs - SSI & MSI): Invented independently by Jack Kilby (Texas Instruments, 1958) and Robert Noyce (Fairchild, 1959) on silicon chips. SSI (10–100 transistors/chip) and MSI (100–1000 transistors/chip). Speed: Nanoseconds (10^-9 s). Features: Time-sharing & multiprogramming OS, keyboards & monitors replaced punched cards, BASIC/Pascal/C. Examples: IBM System/360, PDP-8, PDP-11, ICL 2900, Honeywell 6000, TDC-316.", "Fourth Generation (1971–Present) — Microprocessors (LSI & VLSI): Large Scale Integration (thousands of transistors) and Very Large Scale Integration (hundreds of thousands to millions of transistors on a single silicon chip). First commercial microprocessor: Intel 4004 (4-bit, 1971, designed by Ted Hoff, Federico Faggin, Masatoshi Shima). Speed: Picoseconds (10^-12 s). Features: Personal Computers (PCs), GUI OS (Windows/macOS), LAN/WAN/Internet, SQL/OOP. Examples: Intel 4004/8080/x86 PCs, Apple II, IBM PC (1981), Cray-1, Cray X-MP.", "Fifth Generation (Present & Beyond) — ULSI (Ultra Large Scale Integration) & SLSI + Artificial Intelligence: Tens of millions to billions of transistors per chip, parallel processing, superconductors, natural language processing (NLP), expert systems, robotics, neural networks, and quantum computing (qubits). Languages: Prolog, LISP, Python, R, Julia. Examples: IBM Watson, PARAM Siddhi-AI, Frontier, Fugaku, modern AI workstations."], "examTrap": "Exam Trap: Cray-1 is a Supercomputer belonging to the Fourth Generation (VLSI/LSI era), while PDP-8 and IBM 360 belong to the Third Generation (IC era)."}]}, {"code": "C", "id": "MOD-C", "title": "Module C: Classification of Computers", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Classification by Data Handling: Analog, Digital, Hybrid", "Classification by Size & Capacity: Micro, Mini, Mainframe, Supercomputer", "Workstations, Servers & Embedded Computers", "Personal Computers: Desktop, Laptop, Tablet, Smartphone, Wearable", "General-Purpose vs Special-Purpose Computers", "Distributed vs Parallel Computing Fundamentals (Flynn's Taxonomy & Indian Supercomputers)"], "onePageRevision": ["By Data Handling: Analog (continuous physical quantities like voltage/pressure/temp; e.g., speedometer, seismograph, analog thermometer), Digital (discrete binary 0/1 digits; high accuracy; e.g., PCs, calculators), Hybrid (combines analog front-end sensors with digital processing; e.g., ICU ECG/patient monitoring machines, petrol pump dispensers, radar/flight simulators).", "By Size (Smallest to Largest): Embedded -> Microcomputer (PC/Laptop) -> Workstation -> Minicomputer (Mid-range server) -> Mainframe -> Supercomputer.", "Mainframe vs Supercomputer: Mainframes (e.g., IBM zSeries) optimize high-volume I/O throughput and support thousands of concurrent terminals (banking, railways, insurance); Supercomputers (e.g., Frontier, Fugaku, PARAM) optimize raw floating-point calculation speed (FLOPS) on a single complex scientific problem (weather forecasting, nuclear simulation, molecular modeling).", "Indian Supercomputing: C-DAC (established 1988, Pune) developed PARAM 8000 (1991, India's first supercomputer, led by Dr. Vijay Bhatkar). Other Indian supercomputers: ANUPAM (BARC), PACE (DRDO/ANURAG), SAGA-220 (ISRO), EKA (CRL Tata), Pratyush & Mihir (IITM/NCMRWF), PARAM Siddhi-AI, AIRAWAT (C-DAC Pune), PARAM Rudra.", "Flynn's Taxonomy (1966) of Parallel Processing: SISD (Single Instruction Single Data - uniprocessor), SIMD (Single Instruction Multiple Data - vector/GPU array processors), MISD (Multiple Instruction Single Data - rare/fault-tolerant pipeline), MIMD (Multiple Instruction Multiple Data - modern multicore/clusters/supercomputers)."], "sections": [{"heading": "1. Classification Based on Data Representation (Analog, Digital, Hybrid)", "content": "Computers process physical or discrete signals in three distinct paradigms:", "bullets": ["Analog Computers: Measure continuous physical variables (electrical voltage, fluid pressure, mechanical rotation, temperature). They operate in real time without quantizing values into binary digits, offering high speed for differential equations but limited precision (typically 3–4 digits). Examples: Planimeter, Slide Rule, mechanical speedometer, Bourdon pressure gauge, operational amplifier integrators.", "Digital Computers: Operate on discrete discontinuous data represented in binary (0 and 1). Capable of arbitrary precision by increasing word length (32-bit, 64-bit), reprogrammable, and versatile. Examples: Desktop PCs, smartphones, enterprise servers.", "Hybrid Computers: Combine the real-time continuous sensing of analog components with the storage, logic, and numerical precision of digital processors via ADC (Analog-to-Digital Converter) and DAC (Digital-to-Analog Converter) bridges. Examples: Hospital ICU ECG/EEG patient monitors, automated fuel dispensers, air traffic radar controllers, industrial chemical plant controllers."], "examTrap": "Exam Trap: An ICU ECG machine or automated petrol pump is the classic DSSSB/KVS example of a Hybrid Computer because sensors read continuous analog signals (heartbeat voltage / fluid flow) and convert them to digital numbers on screen."}, {"heading": "2. Classification Based on Size, Capacity & Purpose", "content": "From single-chip microcontrollers to exascale clusters, computers scale across six major tiers:", "bullets": ["Embedded Computers: Special-purpose microcontrollers/SoCs built inside a larger device with fixed firmware stored in ROM/Flash (e.g., ABS brakes, microwave ovens, smart washing machines, pacemakers, digital watches).", "Microcomputers (Personal Computers): Single-user systems built around a single microprocessor chip. Includes Desktops, Laptops/Notebooks, Ultrabooks, Tablets, PDAs, Smartphones, and Wearable devices.", "Workstations: High-end single-user computers with Xeon/Threadripper CPUs, ECC (Error-Correcting Code) RAM, and professional GPUs designed for CAD/CAM, 3D animation, GIS, and scientific visualization.", "Minicomputers (Mid-range Servers): Multi-user systems supporting 4 to ~200 simultaneous users via time-sharing, positioned between microcomputers and mainframes. Examples: DEC PDP-11, VAX-11, IBM AS/400.", "Mainframe Computers: Enterprise-grade, fault-tolerant giants capable of handling millions of transactions per second (TPS) and thousands of simultaneous dumb terminals. Used by banks, airlines (reservation systems), census bureaus, and telecoms. Examples: IBM System z (z15/z16), Unisys ClearPath, Hitachi Z800.", "Supercomputers: The fastest, most expensive systems utilizing thousands of parallel CPU/GPU nodes to solve compute-intensive problems (quantum mechanics, climate modeling, aerodynamics, cryptanalysis). World's first commercial supercomputer: CDC 6600 (1964, designed by Seymour Cray, 'Father of Supercomputing') followed by Cray-1 (1976). Modern Exascale leaders: El Capitan, Frontier (ORNL, USA), Aurora, Fugaku (Japan)."], "examTrap": "Exam Trap: Seymour Cray is the 'Father of Supercomputing' (worldwide), whereas Dr. Vijay Pandurang Bhatkar is the 'Father of Indian Supercomputing' (architect of PARAM 8000 in 1991 at C-DAC Pune)."}]}, {"code": "D", "id": "MOD-D", "title": "Module D: Computer Hardware and Components", "category": "Computer Fundamentals", "targetQuestions": 20, "subtopics": ["CPU Internals: ALU, Control Unit (CU) & Special Purpose Registers", "Instruction Cycle: Fetch-Decode-Execute-Store & Pipelining", "System Bus Architecture: Data Bus, Address Bus, Control Bus", "Motherboard, Chipsets (Northbridge/Southbridge), Ports & Expansion Slots", "Power Supply (SMPS, UPS), GPU, Sound Card & NIC", "BIOS, UEFI, CMOS, POST & Booting Process (Cold vs Warm Boot)"], "onePageRevision": ["CPU Special Registers: PC (Program Counter / Instruction Pointer - holds address of NEXT instruction to be fetched), IR (Instruction Register - holds CURRENT instruction being decoded), MAR (Memory Address Register - holds memory address to read/write), MBR/MDR (Memory Buffer/Data Register - holds data read from or written to memory), AC (Accumulator - holds intermediate ALU results), PSW/Flag Register (holds status flags: Zero, Carry, Sign, Overflow, Parity).", "Instruction Cycle (Machine Cycle): 1. Fetch (PC -> MAR -> Memory -> MBR -> IR; PC increments) -> 2. Decode (CU decodes opcode in IR) -> 3. Execute (ALU/Memory performs operation) -> 4. Store/Write-back.", "System Buses: Address Bus is UNIDIRECTIONAL (CPU -> Memory/IO; width 'n' bits determines max addressable memory = 2^n locations); Data Bus is BIDIRECTIONAL (CPU <-> Memory/IO; width determines word size fetched per cycle, e.g., 64-bit); Control Bus is BIDIRECTIONAL (carries Read/Write, Interrupt, Clock, Bus Grant signals).", "DMA (Direct Memory Access): DMA Controller (e.g., Intel 8237/8257) transfers blocks of data directly between high-speed I/O devices and Main Memory WITHOUT continuous CPU intervention (Cycle Stealing / Burst mode).", "BIOS vs UEFI: BIOS (16-bit real mode, MBR partitioning, max 2 TB disk, max 4 primary partitions, text UI) vs UEFI (32/64-bit, GPT partitioning, >9 ZB disk, 128 partitions, Secure Boot, mouse/GUI support).", "CMOS & POST: CMOS RAM stores date, time, and hardware boot settings powered by a CR2032 lithium coin battery. POST (Power-On Self-Test) is a diagnostic routine run by BIOS/UEFI immediately on power-up to verify RAM, keyboard, GPU, and storage.", "Booting: Cold Booting (Hard boot - turning on computer from completely powered-off state via power button) vs Warm Booting (Soft boot - restarting an already powered-on system via Ctrl+Alt+Del or Restart menu without cutting power)."], "sections": [{"heading": "1. CPU Architecture, Registers & Instruction Cycle", "content": "Inside the Central Processing Unit, high-speed flip-flop circuits called Registers store active operands and addresses during the Fetch-Decode-Execute cycle:", "bullets": ["Program Counter (PC): Contains the memory address of the NEXT instruction to be fetched. As soon as an instruction is fetched, PC automatically increments to point to the next sequential instruction (unless a JUMP/BRANCH modifies it).", "Instruction Register (IR): Holds the opcode and operand specifiers of the CURRENT instruction being decoded by the Control Unit.", "Memory Address Register (MAR): Connects directly to the Address Bus; holds the specific memory location address to be accessed for reading or writing.", "Memory Buffer Register (MBR) / Memory Data Register (MDR): Connects to the Data Bus; holds the actual data word just fetched from memory or waiting to be written to memory.", "Accumulator (AC): Primary working register of the ALU that stores one operand before execution and receives the immediate arithmetic/logical result.", "Fetch-Decode-Execute Cycle: (T1) PC -> MAR; (T2) Memory[MAR] -> MBR, and PC = PC + 1; (T3) MBR -> IR (Fetch complete, known as Fetch Cycle); (T4) CU decodes opcode in IR and fetches effective address of operands; (T5) ALU executes operation (Execute Cycle) and writes back result."], "examTrap": "Exam Trap: DSSSB & KVS repeatedly ask: 'Which register holds the address of the NEXT instruction to be executed?' -> Answer: Program Counter (PC). 'Which register holds the CURRENT instruction being executed?' -> Answer: Instruction Register (IR)."}, {"heading": "2. System Bus Architecture & Address Line Calculations", "content": "A System Bus is a set of parallel copper traces on the motherboard connecting the CPU, Main Memory, and I/O controllers:", "bullets": ["Address Bus (Unidirectional): Carries memory or I/O addresses from the CPU outward. If an address bus has k lines, it can uniquely address 2^k memory locations. Example (Verified DSSSB TGT CS PYQ): A 2K x 16 memory chip has 2K = 2 x 2^10 = 2^11 locations, so it requires 11 address lines and 16 input/output data lines.", "Data Bus (Bidirectional): Transfers actual instructions and data between CPU, memory, and I/O modules. Its width (8, 16, 32, 64 bits) defines the data path width and directly affects system throughput.", "Control Bus (Bidirectional): Carries command and timing signals (Memory Read, Memory Write, I/O Read, I/O Write, IRQ Interrupt Request, INTA Interrupt Acknowledge, Bus Request BR, Bus Grant BG, System Clock, Reset)."], "examTrap": "Exam Trap: For an M x N memory unit (where M = number of words = 2^k, and N = bits per word), Address lines = k = log2(M), and Data lines = N. Total bits = M * N."}, {"heading": "3. Motherboard, Ports, SMPS, BIOS, UEFI, CMOS & Booting", "content": "The motherboard (main PCB) integrates power regulation, chipsets, expansion buses, and firmware:", "bullets": ["Ports & Connectors: USB (Universal Serial Bus - Type-A, Type-B, Type-C, hot-swappable, up to 127 devices), HDMI (High-Definition Multimedia Interface - carries uncompressed high-quality digital video + multi-channel audio over a single cable), DisplayPort, VGA (15-pin DE-15 analog video only), Ethernet RJ-45 (8P8C connector for twisted-pair LAN), RJ-11 (4/6-pin telephone modem), PS/2 (6-pin mini-DIN: Purple for Keyboard, Green for Mouse), SATA (Serial ATA for HDDs/SSDs), PCIe (PCI Express x1/x4/x8/x16 high-speed serial expansion slots for GPUs and NVMe SSDs).", "SMPS (Switched-Mode Power Supply): Converts external 220V/110V AC mains power into regulated low-voltage DC power (+3.3V, +5V, +12V, -12V) required by motherboard, CPU, and drives.", "BIOS, CMOS & UEFI: BIOS (Basic Input/Output System) is firmware stored on a non-volatile Flash ROM chip on the motherboard. CMOS (Complementary Metal-Oxide-Semiconductor) stores user-configurable BIOS settings and the Real-Time Clock (RTC), kept alive by a coin battery. UEFI (Unified Extensible Firmware Interface) replaces legacy BIOS with GPT support (>2 TB disks) and Secure Boot (blocks rootkits/unsigned bootloaders).", "Booting Sequence: 1. Power On (SMPS sends 'Power Good' signal) -> 2. CPU resets and jumps to BIOS/UEFI ROM address -> 3. POST (Power-On Self-Test) checks hardware -> 4. BIOS/UEFI reads MBR (Master Boot Record, sector 0) or EFI System Partition -> 5. Bootloader (Windows Boot Manager / GRUB) loads OS Kernel into RAM -> 6. OS initializes device drivers and login shell."], "examTrap": "Exam Trap: BIOS is stored in ROM/Flash (non-volatile even if the CMOS battery dies), whereas CMOS RAM holds the *configuration settings and clock* (which reset to factory defaults if the CR2032 battery fails)."}]}, {"code": "E", "id": "MOD-E", "title": "Module E: Input Devices", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Keyboard (QWERTY, Toggle Keys, Modifier Keys, Function Keys)", "Pointing Devices: Mouse, Trackball, Touchpad, Joystick, Light Pen, Stylus/Digitizer", "Optical & Direct Data Entry: Scanner, OCR, OMR, MICR, Barcode, QR Code", "Audio, Video & Biometric Input: Microphone, Webcam, Fingerprint, Iris, Smart Card, RFID, Sensors"], "onePageRevision": ["Keyboard Keys: Standard desktop keyboard has 101–104 keys. Modifier/Combination Keys: Shift, Ctrl, Alt (do nothing alone; modify other keys). Toggle Keys: Caps Lock, Num Lock, Scroll Lock, Insert (switch between two states ON/OFF). Navigation Keys: Arrow keys, Home, End, Page Up, Page Down.", "Pointing Devices: Mouse (invented by Douglas Engelbart in 1963/64; mechanical ball, optical LED, laser), Trackball (upside-down mouse where ball stays stationary in socket; used in CAD/sonar/air-traffic), Joystick (pivoting stick tracking X-Y angles for gaming/aircraft), Light Pen (photosensitive wand detecting CRT electron beam refresh), Graphics Tablet / Digitizer (converts hand-drawn stylus strokes into digital coordinates).", "MICR (Magnetic Ink Character Recognition): Reads characters printed with iron-oxide magnetic ink on the bottom of bank cheques (E-13B or CMC-7 font). A 9-digit MICR code in India has: First 3 digits = City (aligned with PIN), Next 3 digits = Bank code, Last 3 digits = Branch code.", "OMR (Optical Mark Recognition / Reader): Detects the presence or absence of dark pencil/pen marks in predefined bubbles on objective exam sheets (DSSSB/CBSE OMR sheets) and surveys using reflected light.", "OCR (Optical Character Recognition): Scans printed or handwritten text images and converts them into editable, searchable ASCII/Unicode machine text.", "Barcode vs QR Code: 1D Barcode (Universal Product Code - UPC, vertical parallel lines representing 12/13 digits read by laser/LED) vs 2D QR Code (Quick Response Code, invented by Denso Wave in 1994, matrix of black/white squares storing URLs/UPI IDs up to ~4,296 alphanumeric chars with Reed-Solomon error correction)."], "sections": [{"heading": "1. Keyboard & Pointing Devices", "content": "Input devices translate human actions or physical phenomena into digital binary codes:", "bullets": ["Keyboard Classification: Alphanumeric keys (A–Z, 0–9), Function keys (F1–F12 along top row), Modifier keys (Ctrl, Alt, Shift, Windows/Command key), Toggle keys (Caps Lock, Num Lock, Scroll Lock, Insert), Cursor/Navigation keys (Arrows, Home, End, PgUp, PgDn), and Special purpose keys (Esc, Print Screen, Pause/Break, Tab, Backspace, Enter/Return). QWERTY layout was designed by Christopher Latham Sholes (1868).", "Mouse & Trackball: Invented by Douglas Engelbart at Stanford Research Institute (1964). Actions: Left-click (select), Double-click (open/execute; selects a word in MS Word), Triple-click (selects an entire paragraph in MS Word), Right-click (opens context menu), Drag-and-drop. A Trackball remains stationary on the desk while the user rolls an exposed ball with fingers/thumb.", "Touchscreen & Digitizer: Note that a Touchscreen is a dual Input/Output (I/O) device (capacitive, resistive, or infrared overlay over a display), whereas a Graphics Tablet (Digitizer) with a stylus is a pure Input device used by digital artists and architects."], "examTrap": "Exam Trap: Shift, Ctrl, and Alt are Modifier (or Combination) keys, NEVER Toggle keys. Caps Lock, Num Lock, and Scroll Lock are Toggle keys."}, {"heading": "2. Source Data Automation: OCR vs OMR vs MICR, Barcode & RFID", "content": "Direct-entry scanning devices eliminate manual transcription errors in banking, retail, and examinations:", "bullets": ["MICR (Magnetic Ink Character Recognition): Used exclusively in banking to process cheques rapidly and securely. Even if someone stamps or writes over the MICR band with normal dye ink, the magnetic reader still reads the iron-oxide ink accurately. Indian 9-digit MICR format: [3-digit City][3-digit Bank][3-digit Branch].", "OMR (Optical Mark Reader): Shines a light beam onto pre-printed forms and measures low reflectivity where a dark bubble has been shaded. Used for multiple-choice answer sheets, lotteries, and census forms.", "OCR (Optical Character Recognition): Combines an optical flatbed/handheld scanner with pattern-recognition software to turn scanned pages of books, passports, or invoices into editable Word/text strings.", "BCR (Barcode Reader) & QR Scanner: Barcodes use varying widths and spacings of parallel lines (UPC/EAN). QR (Quick Response) codes store data both horizontally and vertically in a 2D matrix with three corner finder squares.", "RFID (Radio Frequency Identification) & Biometrics: RFID uses electromagnetic fields to read transponder tags without line-of-sight (e.g., FASTag highway tolls, library books, cattle/asset tracking). Biometric input sensors capture physiological/behavioral traits (Fingerprint capacitive/optical scanner, Iris pattern scanner, Facial geometry, Voiceprint)."], "examTrap": "Exam Trap: Unlike Barcodes/QR codes, RFID does NOT require direct line-of-sight between the reader and the tag; FASTag works on Radio Frequency Identification (RFID)."}]}, {"code": "F", "id": "MOD-F", "title": "Module F: Output Devices", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Monitors & Display Technologies: CRT, LCD, LED, OLED, Plasma", "Display Metrics: Pixel, Resolution, Refresh Rate, Dot Pitch, Aspect Ratio", "Printers: Impact (Dot Matrix, Daisy Wheel, Line/Chain/Drum) vs Non-Impact (Inkjet, Laser, Thermal)", "Printer Metrics (CPS, LPM, PPM, DPI) & Plotters, Projectors, Speakers, Braille Devices"], "onePageRevision": ["Soft Copy vs Hard Copy: Monitors, Projectors, and Speakers produce transient Soft Copy output; Printers and Plotters produce permanent tangible Hard Copy output.", "Display Technologies: CRT (Cathode Ray Tube - vacuum tube, electron gun, phosphor screen, bulky, high power), LCD (Liquid Crystal Display - uses polarizing filters + CCFL/LED backlight), LED (LCD panel backlit by Light Emitting Diodes), OLED (Organic LED - each pixel emits its own light without backlight; true blacks, infinite contrast), Plasma (ionized gas cells emitting UV to excite phosphors).", "Display Metrics: Pixel (Picture Element - smallest addressable point on screen), Resolution (horizontal x vertical pixels, e.g., 1920x1080 Full HD), Dot Pitch / Pixel Pitch (diagonal distance in mm between two like-colored phosphor dots/pixels - SMALLER dot pitch = SHARPER image, typically <0.28 mm), Refresh Rate (Hz - frames redrawn per second, e.g., 60Hz/120Hz), Aspect Ratio (width:height ratio, e.g., 4:3, 16:9, 16:10).", "Impact Printers (strike ribbon against paper; noisy; CAN print carbon multi-part copies): Dot Matrix (character printer, 9 or 24 pins, speed in CPS), Daisy Wheel (letter-quality character printer, cannot print graphics), Line Printers (Drum, Chain, Band printers - print whole line at once, speed in LPM).", "Non-Impact Printers (no physical strike; quiet; CANNOT print carbon copies): Inkjet (sprays microscopic liquid ink droplets via thermal/piezoelectric nozzles), Laser (uses photosensitive selenium/OPC drum, laser beam, electrostatic charge, dry powdered TONER, and heated fuser rollers; page printer, speed in PPM), Thermal (heats thermochromic wax/paper; used in ATM receipts & POS machines).", "Plotters: Vector hardcopy output device using pens/inkjets to draw continuous architectural blueprints, engineering CAD maps, and circuit diagrams (Drum plotter, Flatbed plotter)."], "sections": [{"heading": "1. Visual Display Units (Monitors) & Display Parameters", "content": "Monitors render digital frame-buffer bitmaps into visible light patterns:", "bullets": ["CRT (Cathode Ray Tube): Uses heated cathode electron guns that fire beams across a phosphor-coated screen steered by magnetic deflection yokes. Interlaced vs Non-interlaced scanning.", "Flat-Panel Displays: LCD (Liquid Crystal Display) blocks or passes light from a backlight using twisted nematic/IPS liquid crystals; LED monitors are LCDs illuminated by LED backlights; OLED (Organic Light-Emitting Diode) and AMOLED require no backlight because organic carbon films glow directly when current is applied.", "Key Display Specifications: (1) Pixel = 'Picture Element', the atomic dot of a raster image; (2) Resolution = total pixel grid (VGA = 640x480, HD = 1280x720, FHD = 1920x1080, 4K UHD = 3840x2160); (3) Dot Pitch = distance in millimeters between adjacent pixels of the same color—a smaller dot pitch yields higher sharpness; (4) Refresh Rate = vertical scan frequency in Hertz (Hz); (5) Aspect Ratio = proportional ratio of width to height (standard widescreen is 16:9)."], "examTrap": "Exam Trap: A LOWER dot pitch (e.g., 0.22 mm vs 0.35 mm) means pixels are packed closer together, resulting in a SHARPER image."}, {"heading": "2. Printers (Impact vs Non-Impact) & Plotters", "content": "Printers are classified by whether the print mechanism physically strikes an ink ribbon against paper (Impact) or forms images without mechanical impact (Non-Impact), and by print granularity (Character, Line, Page):", "bullets": ["Dot Matrix Printer (DMP): Impact Character Printer. Uses a print head with 9, 18, or 24 pins striking an inked ribbon to form characters and basic dot-graphics. Speed measured in CPS (Characters Per Second). Still used for railway tickets and multi-part carbon invoices.", "Daisy Wheel Printer: Impact Character Printer resembling a petal wheel. Produces crisp letter-quality text (like a typewriter) but CANNOT print graphics or change fonts without swapping the wheel.", "Line Printers (Drum, Chain, Band): High-speed Impact Printers that print an entire line of text at once; speed measured in LPM (Lines Per Minute, 300–3000 LPM).", "Inkjet Printer: Non-Impact Character/Line Printer that propels tiny droplets of liquid ink (CMYK: Cyan, Magenta, Yellow, Black/Key) onto paper via thermal bubble or piezoelectric crystals.", "Laser Printer: Non-Impact Page Printer. Uses a laser beam to draw an electrostatic latent image on a rotating photoreceptor drum, attracts dry charged powder called TONER, transfers it to paper, and permanently melts it using a heated Fuser assembly. Speed measured in PPM (Pages Per Minute, 20–100+ PPM); resolution in DPI (Dots Per Inch, 600–2400 DPI).", "Thermal Printer & Plotter: Thermal printers use chemically treated heat-sensitive paper (ATM/POS slips). Plotters (Drum & Flatbed) produce large-format continuous vector graphics for CAD/CAM, GIS maps, and architectural blueprints."], "examTrap": "Exam Trap: In CMYK color printing, 'K' stands for Key (Black), NOT Krypton or Potassium! Also remember: Laser printers use dry TONER cartridge + Fuser drum; Inkjet printers use liquid INK cartridges."}]}, {"code": "G", "id": "MOD-G", "title": "Module G: Computer Memory and Storage", "category": "Computer Fundamentals", "targetQuestions": 25, "subtopics": ["Memory Hierarchy: Registers -> L1/L2/L3 Cache -> RAM -> SSD/HDD -> Tape", "Volatile Primary Memory: SRAM vs DRAM", "Non-Volatile Primary Memory: ROM, PROM, EPROM, EEPROM, Flash", "Cache Locality of Reference, Hit Ratio & Virtual Memory (Paging/Swapping)", "Secondary Storage: Magnetic (HDD, Tape, Floppy), Optical (CD, DVD, Blu-ray), Solid State (SSD, NVMe, USB, SD)", "Memory Units & Conversions: Bit, Nibble, Byte, KB/KiB to YB/YiB"], "onePageRevision": ["Memory Hierarchy (Fastest/Smallest/Costliest per bit -> Slowest/Largest/Cheapest per bit): CPU Registers (<1 ns) -> L1 Cache (~1–2 ns) -> L2 Cache (~3–10 ns) -> L3 Cache (~10–20 ns) -> Main Memory DRAM (~50–100 ns) -> NVMe/SSD (~0.05–0.1 ms) -> Magnetic HDD (~5–10 ms) -> Optical Disc / Magnetic Tape (seconds).", "SRAM vs DRAM: SRAM (Static RAM) uses 6-transistor flip-flops, NO periodic refreshing needed, very fast, expensive, low density -> used for CPU Cache Memory. DRAM (Dynamic RAM) uses 1 transistor + 1 leaky capacitor per bit, MUST be refreshed thousands of times per second, slower, cheaper, high density -> used for Main Memory (DDR4/DDR5 RAM).", "ROM Family (Non-Volatile): MROM (Mask ROM - factory hardwired), PROM (Programmable ROM - one-time programmable by burning fuses; WORM), EPROM (Erasable PROM - erased by exposing quartz window to Ultraviolet [UV] light for 15–20 mins), EEPROM (Electrically Erasable PROM - erased byte-by-byte electrically in milliseconds), Flash Memory (block-level EEPROM used in BIOS, USB drives, SSDs, SD cards).", "Virtual Memory: OS memory-management technique using a portion of secondary storage (pagefile.sys / swap space) to give programs the illusion of a contiguous RAM space larger than physical RAM. Excessive swapping causes 'Thrashing'.", "Optical Storage Lasers & Capacities: CD (700 MB, 780 nm Infrared laser), DVD (4.7 GB single-layer / 8.5 GB dual-layer, 650 nm Red laser), Blu-ray Disc (25 GB single-layer / 50 GB dual-layer, 405 nm Blue-violet laser).", "Memory Unit Powers of 2: 1 Bit = 0 or 1; 1 Nibble = 4 Bits; 1 Byte (Octet) = 8 Bits; 1 KB (KiB) = 2^10 = 1024 Bytes; 1 MB = 2^20 B; 1 GB = 2^30 B; 1 TB = 2^40 B; 1 PB = 2^50 B; 1 EB = 2^60 B; 1 ZB = 2^70 B; 1 YB = 2^80 B."], "sections": [{"heading": "1. Memory Hierarchy, Cache Memory, SRAM & DRAM", "content": "Because ultra-fast flip-flop memory is expensive, computer architects organize memory in a pyramid balancing Access Time, Capacity, and Cost per Bit:", "bullets": ["CPU Registers: Located inside the CPU core itself; fastest access (<1 ns), smallest capacity (bytes).", "Cache Memory (L1, L2, L3): Built from SRAM (Static RAM). Acts as a high-speed buffer between the fast CPU and relatively slow Main Memory (DRAM), operating on the Principle of Locality of Reference (Temporal & Spatial locality). L1 is smallest/fastest (split into L1i instruction and L1d data cache inside each core); L2 is per-core; L3 is shared across cores.", "SRAM (Static Random Access Memory): Stores bits in bistable latch/flip-flop circuits (4 to 6 transistors per bit). Retains data as long as power is supplied without needing refresh cycles. Used for Cache and CPU registers.", "DRAM (Dynamic Random Access Memory): Stores each bit as an electrical charge in a tiny capacitor paired with one MOSFET transistor. Because capacitors leak charge, DRAM requires periodic refresh circuits every few milliseconds. Synchronous DRAM (SDRAM, DDR, DDR2, DDR3, DDR4, DDR5) synchronizes with the system bus clock."], "examTrap": "Exam Trap: Both SRAM and DRAM are VOLATILE (lose data when power is turned off). The difference is that DRAM needs periodic refreshing even WHILE power is ON, whereas SRAM does not."}, {"heading": "2. Read-Only Memory (ROM) Variants & Virtual Memory", "content": "Non-volatile semiconductor memories retain bootstrap code and firmware without power:", "bullets": ["ROM / MROM: Mask-programmed at the semiconductor fab; cannot be altered.", "PROM (Programmable ROM): Shipped blank; user programs it ONCE using a special PROM programmer that blows microscopic nichrome/polysilicon fuses (OTP - One-Time Programmable).", "EPROM (Erasable Programmable ROM): Identified by a transparent fused-quartz window on top of the IC package. Erased entirely by shining strong Ultraviolet (UV-C) light onto the silicon die.", "EEPROM (Electrically Erasable Programmable ROM): Can be erased and reprogrammed selectively byte-by-byte in-circuit using electrical voltage pulses without removing the chip.", "Flash Memory: A high-density derivative of EEPROM (invented by Fujio Masuoka at Toshiba) that erases and writes data in multi-kilobyte blocks/sectors rather than byte-by-byte, making it much faster for USB drives, memory cards, and SSDs.", "Virtual Memory: Implemented via Demand Paging or Segmentation with a hardware MMU (Memory Management Unit) and TLB (Translation Lookaside Buffer). Maps virtual addresses to physical RAM frames and swaps inactive pages to disk."], "examTrap": "Exam Trap: EPROM uses Ultraviolet (UV) light and erases the ENTIRE chip at once; EEPROM uses electrical pulses and can erase individual bytes."}, {"heading": "3. Secondary Storage Media & Exact Binary Unit Conversions", "content": "Secondary (Auxiliary) memory is non-volatile, high-capacity storage not directly addressed by the CPU's instruction pointer:", "bullets": ["Hard Disk Drive (HDD): Magnetic storage consisting of aluminum/glass platters coated with ferromagnetic material, spinning at 5400, 7200, or 15000 RPM. Data is organized into concentric circles called TRACKS, which are subdivided into angular wedges called SECTORS. The set of identical track numbers across all platter surfaces forms a CYLINDER. Access time = Seek Time (arm moves to track) + Rotational Latency (sector rotates under head) + Transfer Time.", "Solid State Drive (SSD): Uses NAND Flash memory ICs with no moving mechanical parts—zero seek time, silent, shock-resistant, and 5x–70x faster than HDDs (SATA III up to 600 MB/s; PCIe NVMe M.2 up to 7,000+ MB/s).", "Optical Discs (Pit & Land reflectivity): CD-ROM / CD-R (WORM) / CD-RW (~700 MB, 780 nm laser); DVD (Digital Versatile Disc, 4.7 GB SL / 8.5 GB DL / 17 GB Double-sided DL, 650 nm red laser); Blu-ray Disc (BD, 25 GB SL / 50 GB DL, 405 nm blue-violet laser).", "Magnetic Tape: Sequential-access storage medium (plastic ribbon coated with iron oxide); slowest random access, used for archival cold backups. Floppy Disk (3.5-inch capacity = 1.44 MB; 5.25-inch = 1.2 MB).", "Exact Binary Powers Table: 1 KB = 2^10 B = 1,024 B | 1 MB = 2^20 B | 1 GB = 2^30 B | 1 TB = 2^40 B | 1 PB (Petabyte) = 2^50 B | 1 EB (Exabyte) = 2^60 B | 1 ZB (Zettabyte) = 2^70 B | 1 YB (Yottabyte) = 2^80 B. Note: 1 GB = 2^30 Bytes = 2^33 Bits (since 1 Byte = 2^3 Bits)."], "examTrap": "Exam Trap: Pay close attention to Bits vs Bytes in exponent questions! For example, 4 GB in bits = 2^2 * 2^30 Bytes = 2^32 * 2^3 Bits = 2^35 Bits."}]}, {"code": "H", "id": "MOD-H", "title": "Module H: Data Representation and Number System Fundamentals", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Positional Number Systems: Binary (Base-2), Octal (Base-8), Decimal (Base-10), Hexadecimal (Base-16)", "Base Conversions (Integer & Fractional) & Shortcut 3-bit / 4-bit Grouping", "Signed Representation: Sign-Magnitude, 1's Complement, 2's Complement Ranges", "Binary-Coded Decimal (BCD), Excess-3 & Gray Code Fundamentals", "Character Encoding: ASCII (7-bit/8-bit), EBCDIC (8-bit), ISCII, Unicode (UTF-8/UTF-16/UTF-32)", "Floating-Point Basics (IEEE 754) & Error Detection (Even/Odd Parity Bit, Checksum, Hamming)"], "onePageRevision": ["Radix / Base (r): Valid digits range from 0 to (r - 1). Binary (r=2: 0,1), Octal (r=8: 0–7), Decimal (r=10: 0–9), Hexadecimal (r=16: 0–9, A=10, B=11, C=12, D=13, E=14, F=15).", "Conversion Shortcuts: 1 Octal digit = 3 Binary bits (4-2-1 weights); 1 Hexadecimal digit = 4 Binary bits (8-4-2-1 weights). Decimal to Base-r: divide integer part repeatedly by r (read remainders bottom-up) and multiply fractional part repeatedly by r (read carries top-down).", "2's Complement (Standard signed integer format): 1's complement = invert all bits (0<->1); 2's complement = 1's complement + 1. Range of n-bit 2's complement = -(2^(n-1)) to +(2^(n-1) - 1). For 8-bit: -128 to +127. Unlike 1's complement and Sign-Magnitude, 2's complement has only ONE representation of zero.", "BCD (8421 Binary-Coded Decimal): Encodes each decimal digit (0–9) into its own 4-bit nibble. Combinations 1010 (10) to 1111 (15) are INVALID in BCD (add 6 = 0110 to correct).", "Character Codes: Standard ASCII = 7-bit (2^7 = 128 characters; 'A'=65 [41H], 'a'=97 [61H], '0'=48 [30H], Space=32 [20H]); Extended ASCII = 8-bit (256 chars); EBCDIC = 8-bit (256 chars, used in IBM mainframes); Unicode = universal variable/fixed encoding (UTF-8 uses 1 to 4 bytes, backward-compatible with ASCII; UTF-16 uses 2 or 4 bytes; UTF-32 uses 4 bytes).", "Error Detection: Parity Bit adds 1 extra bit so total number of 1s is Even (Even Parity) or Odd (Odd Parity); detects single-bit (odd number of) errors, cannot correct errors or detect 2-bit flips. Checksum sums data words using 1's complement arithmetic (used in TCP/UDP/IPv4)."], "sections": [{"heading": "1. Positional Number Systems & Rapid Base Conversions", "content": "Every number in base r has positional weights of r^n ... r^2, r^1, r^0 . r^-1, r^-2:", "bullets": ["Decimal to Binary/Octal/Hex: For integer part, use successive division by target base (2, 8, or 16) and read remainders from MSB (bottom) to LSB (top). For fractional part (e.g., 0.625), multiply by 2 repeatedly: 0.625 * 2 = 1.25 (int 1), 0.25 * 2 = 0.50 (int 0), 0.50 * 2 = 1.00 (int 1) -> (0.101)2.", "Binary <-> Octal <-> Hexadecimal: Group binary bits in sets of 3 from the radix point outward for Octal, or sets of 4 for Hexadecimal. Example: (101110.011)2 = (56.3)8; (10111011)2 = (1011 1011)2 = (BB)16 = 11*16 + 11 = 187.", "BCD (Binary Coded Decimal): Represents each decimal digit separately with 4 bits. Example: (49)10 in pure binary is (110001)2 (6 bits), whereas in BCD it is 0100 1001 (8 bits)."], "examTrap": "Exam Trap: In ASCII, 'A' is 65, 'a' is 97, and '0' is 48. Notice that 'a' - 'A' = 32 (only the 6th bit flips!)."}, {"heading": "2. Signed Numbers, Character Encodings & Parity Error Detection", "content": "Modern CPUs represent negative integers using 2's complement and floating-point reals using IEEE 754:", "bullets": ["Sign-Magnitude & 1's Complement: Both have an n-bit range of -(2^(n-1) - 1) to +(2^(n-1) - 1) and suffer from two representations of zero (+0 and -0).", "2's Complement: Obtained by inverting all bits and adding 1 to the LSB (or keeping all bits from the right up to and including the first '1' unchanged, then inverting all remaining bits to the left). Range for n bits: -2^(n-1) to +(2^(n-1) - 1). For n=8 bits: -128 to +127.", "IEEE 754 Floating Point: Single Precision (32-bit) = 1 Sign bit + 8 Biased Exponent bits (bias 127) + 23 Mantissa/Fraction bits. Double Precision (64-bit) = 1 Sign bit + 11 Exponent bits (bias 1023) + 52 Mantissa bits.", "Parity Bit & Checksum: For data 1011001 (four 1s): Even parity bit = 0 (keeps total 1s = 4, even); Odd parity bit = 1 (makes total 1s = 5, odd). Parity detects any odd number of bit errors (1, 3, 5...) but fails if 2 bits flip simultaneously."], "examTrap": "Exam Trap: Standard ASCII is strictly 7-bit (128 characters, 0 to 127), whereas Extended ASCII and EBCDIC are 8-bit (256 characters)."}]}, {"code": "I", "id": "MOD-I", "title": "Module I: Computer Software", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["System Software vs Application Software vs Utility Software", "Operating Systems, Device Drivers & Firmware", "Language Translators: Assembler, Compiler, Interpreter", "Program Execution Pipeline: Source Code -> Object Code -> Linker -> Loader -> Executable", "Software Licensing Models: Open-Source (FOSS), Proprietary, Freeware, Shareware, Public-Domain, Freemium"], "onePageRevision": ["System Software: Manages hardware resources and provides a platform for application software. Includes Operating Systems (Windows, Linux, macOS), Language Translators (Assembler, Compiler, Interpreter), Linkers, Loaders, and Device Drivers.", "Utility Software: System maintenance and optimization tools—Antivirus, Disk Defragmenter, Disk Cleanup, Backup utilities, File Compression (WinZip, 7-Zip, WinRAR), Disk Partitioning.", "Application Software: Solves end-user tasks. General-purpose (MS Word, Excel, PowerPoint, Chrome, VLC) vs Special-purpose/Bespoke (Hospital Management, Railway Reservation, Tally ERP, Payroll).", "Translators: Assembler (Assembly language mnemonics -> Machine code), Compiler (translates ENTIRE High-Level Language program into object code at once; reports all syntax errors together; fast execution; e.g., C, C++), Interpreter (translates and executes HLL statement-by-statement line-by-line; stops at first error; no separate object file saved; e.g., Python, Ruby, JavaScript/BASIC).", "Linker vs Loader: Linker combines one or more compiler-generated Object files (.obj/.o) with library routines (e.g., stdio/math) to produce a single executable file (.exe). Loader (part of OS) loads the executable file from disk into Primary Memory (RAM) and assigns physical addresses for execution.", "Software Licenses: Open-Source / FOSS (Source code freely available to view, modify, redistribute; e.g., Linux, LibreOffice, Python, Firefox, Apache, VLC), Proprietary/Closed-Source (owned by vendor, source code secret; e.g., Windows, MS Office, Adobe Photoshop), Freeware (free to use at $0 cost, but source code is CLOSED; e.g., Adobe Acrobat Reader, Skype, Google Chrome), Shareware (free for a trial period/limited features, requires payment afterward; e.g., WinRAR), Public Domain (zero copyright restrictions)."], "sections": [{"heading": "1. System, Utility & Application Software Hierarchy", "content": "Software is the intangible collection of instructions, data, and documentation that tells hardware what to do:", "bullets": ["System Software: Operates close to hardware. Without system software (specifically the OS), a computer is non-functional hardware. Includes OS kernel, BIOS/UEFI firmware, Device Drivers (translators between OS and specific peripherals like printers or GPUs), and Language Processors.", "Utility Software: Often bundled with the OS or installed separately to maintain health, security, and storage efficiency. Key examples: Disk Defragmenter (rearranges fragmented HDD sectors into contiguous blocks to reduce seek time), Disk Cleanup, Antivirus, File Archivers (ZIP/RAR).", "Application Software: Runs on top of the OS. Horizontal/General-purpose suites (Microsoft Office, LibreOffice) serve broad audiences; Vertical/Custom software targets specific industries (Core Banking, HIS)."], "examTrap": "Exam Trap: Disk Defragmenter, Antivirus, and File Compression tools (WinZip/7-Zip) are classified as Utility Software (a subset of System/Service software), NOT Application Software. Also note: SSDs should NOT be defragmented (they use TRIM instead) because SSDs have zero mechanical seek delay and extra writes wear out NAND cells."}, {"heading": "2. Translators, Linker, Loader & Licensing Models", "content": "Understanding the compilation toolchain and licensing distinctions prevents common exam mistakes:", "bullets": ["Build Pipeline: Source Code (.c / .py) -> Preprocessor -> Compiler/Assembler -> Object Code (.obj / .o) -> Linker (links static/dynamic libraries .lib/.dll) -> Executable Code (.exe) -> Loader (loads into RAM for CPU execution).", "Java & Python Hybrid Execution: Java compiles source (.java) into platform-independent Bytecode (.class), which is then interpreted or JIT-compiled (Just-In-Time) by the JVM (Java Virtual Machine).", "Freeware vs Open-Source (FOSS): Freeware is free of monetary cost (gratis) but proprietary—you CANNOT view or modify its source code (e.g., Adobe Reader, Zoom client). Open-Source Software provides open access to source code under licenses like GPL, MIT, or Apache (e.g., Linux kernel, LibreOffice, GIMP, Audacity, Mozilla Firefox)."], "examTrap": "Exam Trap: Every Open-Source software is typically free to download, MUST NOT be confused with Freeware: Freeware has CLOSED source code, whereas Open-Source has OPEN modifiable source code."}]}, {"code": "J", "id": "MOD-J", "title": "Module J: Operating System Fundamentals", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Core Functions of an OS: Process, Memory, File, Device & Security Management", "Types of OS: Batch, Multiprogramming, Multitasking, Time-Sharing, Multiprocessing, RTOS, Distributed, Network", "User Interfaces: CLI/CUI vs GUI & Kernel vs Shell", "Desktop & Mobile OS Fundamentals: Windows, Linux/UNIX, macOS, Android, iOS", "File Systems (FAT32, NTFS, exFAT, ext4) & Directories"], "onePageRevision": ["Operating System (OS): Resource manager and interface between User/Applications and Computer Hardware. Core piece is the Kernel (loaded into RAM at boot and remains resident).", "OS Types: Batch OS (groups similar jobs offline without user interaction; CPU idle during I/O), Multiprogramming (keeps multiple jobs in RAM simultaneously; switches CPU to another job when current job waits for I/O to maximize CPU utilization), Multitasking / Time-Sharing (logical extension of multiprogramming using rapid CPU time-slices/quanta so multiple interactive users/apps feel simultaneous response), Multiprocessing (uses 2 or more physical CPUs/cores in parallel - SMP/AMP).", "RTOS (Real-Time OS): Guarantees processing within strict time deadlines. Hard RTOS (missing a deadline is catastrophic: missile guidance, airbag control, pacemaker) vs Soft RTOS (occasional slight delay is tolerable: live video streaming, online gaming).", "Spooling (Simultaneous Peripheral Operations On-Line): Buffers slow I/O jobs (like print jobs) on disk queue so CPU can continue working without waiting for the printer.", "File Systems: Windows uses NTFS (New Technology File System - supports journaling, file-level encryption EFS, permissions ACL, files >4GB), FAT32 (max single file size = 4 GB), exFAT (for flash drives >32GB). Linux uses ext3/ext4, XFS, Btrfs. macOS uses APFS (Apple File System)."], "sections": [{"heading": "1. Core Functions & Classification of Operating Systems", "content": "An Operating System acts as a government and resource allocator for CPU cycles, RAM frames, disk blocks, and I/O devices:", "bullets": ["Five Core Management Functions: (1) Process Management (creation, scheduling via FCFS/SJF/Round-Robin/Priority, synchronization, deadlock handling); (2) Memory Management (allocation, paging, segmentation, virtual memory); (3) File Management (directories, access permissions, FAT/NTFS/inode tracking); (4) Device/I/O Management (buffering, caching, spooling, device drivers); (5) Security & Protection (authentication, access control lists, kernel-mode vs user-mode ring protection).", "Multiprogramming vs Multitasking vs Multiprocessing: Multiprogramming keeps multiple programs in main memory on a SINGLE CPU and switches only when the active job blocks for I/O (non-preemptive wait minimization). Multitasking (Time-Sharing) preemptively switches the CPU among jobs every few milliseconds (time quantum) to minimize response time. Multiprocessing uses MULTIPLE physical CPUs/cores executing threads simultaneously.", "Real-Time Operating Systems (RTOS): Deterministic response times (e.g., VxWorks, FreeRTOS, QNX, RTLinux)."], "examTrap": "Exam Trap: Multiprogramming maximizes CPU Utilization; Time-Sharing (Multitasking) minimizes Response Time; Batch processing maximizes Throughput for non-interactive jobs."}, {"heading": "2. CLI vs GUI, Kernel vs Shell & File Systems", "content": "The OS architecture separates low-level hardware privilege from user interaction:", "bullets": ["Kernel vs Shell: The Kernel is the core privileged component of the OS that interacts directly with hardware (manages CPU, memory, and I/O). The Shell (command interpreter) is the outer layer that takes user commands via CLI (Command Prompt `cmd.exe`, PowerShell, Bash `sh`) or GUI (Windows Explorer, GNOME, Aqua) and invokes system calls.", "Desktop & Mobile OS: UNIX (developed in 1969 by Ken Thompson and Dennis Ritchie at Bell Labs, rewritten in C), Linux (open-source kernel created by Linus Torvalds in 1991), Windows (Microsoft, NT kernel), macOS (Apple, Darwin/XNU UNIX-based), Android (Google/Open Handset Alliance, based on modified Linux kernel), iOS (Apple, XNU kernel).", "File System Limits: FAT32 cannot store any single file larger than 4 GB and partition creation in Windows GUI is capped at 32 GB. NTFS is the default modern Windows file system supporting ACL security, BitLocker/EFS encryption, shadow copies, and journaling."], "examTrap": "Exam Trap: Android is built on top of the Linux Kernel! Also remember: Ken Thompson and Dennis Ritchie developed UNIX (and C language) at Bell Labs, while Linus Torvalds created the Linux kernel in 1991."}]}, {"code": "K", "id": "MOD-K", "title": "Module K: Computer Languages and Programming Fundamentals", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Five Generations of Programming Languages (1GL to 5GL)", "Low-Level (Machine & Assembly) vs High-Level Languages", "Source Code, Object Code, Bytecode & Translators", "Syntax vs Semantics & Types of Errors (Syntax, Runtime, Logical)", "Algorithm, Flowchart Symbols & Pseudocode", "Programming Paradigms: Procedural, OOP (Encapsulation, Inheritance, Polymorphism, Abstraction), Scripting & Markup (HTML)"], "onePageRevision": ["5 Generations of Languages: 1GL = Machine Language (Binary 0s/1s, directly executed by CPU, hardware-dependent, zero translation needed); 2GL = Assembly Language (Mnemonics like ADD, MOV, SUB; hardware-dependent; translated by Assembler); 3GL = Procedural/OOP High-Level Languages (C, C++, Java, FORTRAN, COBOL, Pascal; portable; translated by Compiler/Interpreter); 4GL = Non-procedural/Declarative domain languages (SQL, MATLAB, R, Focus, Report Generators - specify WHAT to do, not HOW); 5GL = AI/Constraint/Logic languages (Prolog, LISP, Mercury, OPS5).", "Historical HLL Milestones: FORTRAN (Formula Translation, 1957, John Backus at IBM - first widely used HLL, scientific computing), LISP (List Processing, 1958, John McCarthy - AI language), COBOL (Common Business-Oriented Language, 1959, Grace Hopper / CODASYL - business data processing), BASIC (1964, Kemeny & Kurtz), C (1972, Dennis Ritchie), C++ (1979/83, Bjarne Stroustrup), Python (1991, Guido van Rossum), Java (1995, James Gosling at Sun Microsystems).", "Flowchart Standard ANSI Symbols: Oval/Rounded Rectangle (Terminal: Start/Stop), Parallelogram (Input/Output), Rectangle (Process/Arithmetic assignment), Diamond (Decision/Condition with Yes/No branches), Circle (On-page Connector), Pentagon (Off-page Connector), Arrows (Flowlines).", "OOP 4 Pillars: Encapsulation (binding data + methods together & data hiding), Abstraction (showing essential interface while hiding implementation complexity), Inheritance (IS-A relationship; derived class reuses base class properties), Polymorphism (one interface, multiple forms - compile-time overloading & runtime overriding)."], "sections": [{"heading": "1. Generations of Programming Languages (1GL to 5GL)", "content": "Programming languages evolved from hardware-specific binary bit patterns to natural declarative and AI specifications:", "bullets": ["1GL (Machine Language): Consists of binary opcodes and addresses (0s and 1s). Executes at maximum hardware speed with NO translator required, but is machine-dependent and error-prone to write.", "2GL (Assembly Language): Replaces binary opcodes with symbolic mnemonics (e.g., `MOV AL, 61h`, `ADD AX, BX`). Still machine-dependent (x86 assembly differs from ARM assembly) and requires an Assembler.", "3GL (High-Level Languages): English-like, machine-independent (portable) procedural and object-oriented languages requiring a Compiler or Interpreter (FORTRAN, ALGOL, COBOL, BASIC, C, C++, Java, C#, Python).", "4GL (Fourth-Generation Languages): Declarative database query and report languages where the programmer specifies *what* result is needed rather than step-by-step control loops (e.g., SQL `SELECT * FROM Students WHERE Marks > 80;`).", "5GL (Fifth-Generation Languages): Rule-based and logic programming languages designed for Artificial Intelligence, theorem proving, and expert systems (Prolog, LISP, Mercury)."], "examTrap": "Exam Trap: SQL is the classic exam answer for a 4th Generation Language (4GL), while Prolog and LISP are the classic answers for 5GL / AI languages."}, {"heading": "2. Algorithms, Flowcharts, Errors & Paradigms", "content": "Before writing code, problem-solving relies on finite step-by-step logic (Algorithms), graphical representations (Flowcharts), or structured English (Pseudocode):", "bullets": ["Characteristics of a Valid Algorithm: Input (0 or more), Output (at least 1), Definiteness (every step unambiguous), Finiteness (must terminate after a finite number of steps), Effectiveness (feasible basic operations).", "Flowchart Shapes: Oval = Start/End; Parallelogram = Read/Print (I/O); Rectangle = Calculation/Assignment; Diamond = Conditional Branch (`if/else` or loop test).", "Syntax vs Semantics vs Logical Errors: Syntax represents the grammatical rules of a language (`missing semicolon` caught by compiler); Semantics refers to the meaning/validity of operations; Logical errors compile and run without crashing but produce wrong output (e.g., using `+` instead of `*` in an average formula).", "Markup vs Scripting vs Compiled Languages: HTML (HyperText Markup Language, created by Tim Berners-Lee) and XML are Markup languages (they structure/present data using tags and lack general arithmetic/Turing-complete control logic), NOT programming languages."], "examTrap": "Exam Trap: A Diamond symbol in a flowchart ALWAYS represents a Decision (Condition/Branching) with 1 entry and at least 2 exit paths (True/False), whereas a Parallelogram represents Input/Output."}]}, {"code": "L", "id": "MOD-L", "title": "Module L: Computer Network and Internet Fundamentals", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Network Types by Geography: PAN, LAN, CAN, MAN, WAN", "Intranet vs Extranet vs Internet", "Network Topologies: Bus, Star, Ring, Mesh, Tree, Hybrid (Links & Fault Tolerance)", "Networking Devices: Repeater, Hub, Bridge, Switch, Router, Gateway, Modem, NIC (with OSI Layers)", "Addressing & Naming: MAC Address (48-bit Hex) vs IPv4 (32-bit) vs IPv6 (128-bit) & DNS", "Core TCP/IP Protocols & Port Numbers: HTTP, HTTPS, FTP, SMTP, POP3, IMAP, DHCP, Telnet, SSH"], "onePageRevision": ["Network Types by Range: PAN (Personal Area Network, ~10m, Bluetooth/USB/Infrared), LAN (Local Area Network, building/campus, ~10m–2km, Ethernet IEEE 802.3 / Wi-Fi IEEE 802.11), MAN (Metropolitan Area Network, city-wide ~5–50km, Cable TV / Metro Ethernet), WAN (Wide Area Network, country/continent/global, Internet, leased lines/satellites).", "Topologies: Bus (single backbone coaxial cable with terminators; 1 backbone failure stops entire network), Star (all nodes connect to central Hub/Switch; easy troubleshooting; fails only if central switch dies), Ring (unidirectional/bidirectional closed loop using tokens), Full Mesh (every node connected to every other node; for N nodes, number of bidirectional links = N(N-1)/2 and I/O ports per node = N-1; highest reliability & cost), Tree (hierarchical Star-of-Stars).", "Networking Devices & OSI Layers: Layer 1 (Physical): Repeater (regenerates weak attenuated signal), Hub (multiport repeater; broadcasts to all ports; single collision domain), Passive Modem (Modulator-Demodulator: Digital <-> Analog). Layer 2 (Data Link): NIC (has burned-in 48-bit MAC address), Bridge (connects 2 LAN segments using MAC), Switch (multiport bridge; unicasts frames using MAC table; each port is its own collision domain). Layer 3 (Network): Router (routes packets across different networks using IP addresses; breaks broadcast domains). All Layers / Protocol Converter: Gateway (connects dissimilar network architectures).", "MAC vs IP Address: MAC (Media Access Control) = 48-bit (6 bytes, 12 Hex digits, e.g., `00:1A:2B:3C:4D:5E`), physical/hardware address at Layer 2. IPv4 = 32-bit (4 octets in dotted decimal, e.g., `192.168.1.1`; Classes A, B, C, D, E; loopback `127.0.0.1`), logical address at Layer 3. IPv6 = 128-bit (16 bytes, 8 groups of 4 Hex digits separated by colons).", "Standard Port Numbers: FTP (20 Data, 21 Control), SSH (22), Telnet (23), SMTP (25 - send email), DNS (53 - domain name -> IP), DHCP (67/68 - dynamic IP assignment), HTTP (80), POP3 (110 - download email), IMAP (143 - sync email on server), HTTPS (443)."], "sections": [{"heading": "1. Network Categories, Topologies & Link Formulas", "content": "Networks enable resource sharing, distributed reliability, and communication across physical or wireless media:", "bullets": ["PAN, LAN, MAN, WAN: Bluetooth piconet is a Wireless PAN (WPAN). Ethernet (IEEE 802.3) and Wi-Fi (IEEE 802.11) form LANs. City-wide cable television or municipal fiber networks form MANs. The global Internet and banking MPLS networks are WANs.", "Intranet vs Extranet vs Internet: Intranet is a private TCP/IP network accessible ONLY to an organization's internal employees behind a firewall. Extranet extends controlled parts of an Intranet to authorized external partners, vendors, or suppliers. The Internet is the public global network of networks.", "Mesh Topology Formula: In a fully connected Mesh topology with N nodes: Each node requires (N - 1) I/O ports, and the total number of dedicated duplex links = N(N - 1) / 2. For example, for N = 6 computers, total cables = 6 * 5 / 2 = 15 cables."], "examTrap": "Exam Trap: Always check whether a Mesh question asks for 'total cables/links' -> N(N-1)/2, or 'ports per device' -> (N-1)."}, {"heading": "2. Networking Hardware (OSI Mapping), Addressing & Protocols", "content": "Matching each networking device to its OSI layer and addressing scheme is one of the highest-frequency topics in DSSSB TGT CS:", "bullets": ["Hub vs Switch vs Router: A Hub (Layer 1) blindly broadcasts incoming bits out of every port (shared collision domain). A Switch (Layer 2) inspects the 48-bit destination MAC address in the frame header and forwards the frame only to the target port (separate collision domain per port, single broadcast domain). A Router (Layer 3) inspects the 32-bit/128-bit IP address in the packet header to route traffic between different networks/subnets (separates broadcast domains).", "IPv4 Classes & Special Addresses: Class A (0.0.0.0 to 127.255.255.255; default mask 255.0.0.0), Class B (128.0.0.0 to 191.255.255.255; mask 255.255.0.0), Class C (192.0.0.0 to 223.255.255.255; mask 255.255.255.0), Class D (224–239, Multicast), Class E (240–255, Experimental). `127.0.0.1` is the localhost Loopback address used for NIC self-testing.", "Email & Web Protocols: SMTP (Simple Mail Transfer Protocol) is a PUSH protocol used to send/relay outgoing emails between client and mail servers; POP3 (Post Office Protocol v3, port 110) downloads emails to a single local device (traditionally deleting from server); IMAP (Internet Message Access Protocol, port 143) synchronizes emails and folders across multiple devices directly on the server. DNS (Domain Name System, port 53) is the 'phonebook of the Internet' translating human domain names (`dsssb.delhi.gov.in`) into IP addresses."], "examTrap": "Exam Trap: SMTP is used for SENDING/PUSHING mail (Client -> Server and Server -> Server), whereas POP3 and IMAP are used for RECEIVING/RETRIEVING mail (Server -> Client)."}]}, {"code": "M", "id": "MOD-M", "title": "Module M: Internet, Web and Digital Communication", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["Evolution of the Internet (ARPANET, TCP/IP, NSFNET) & World Wide Web (WWW)", "Web Browsers, Search Engines & Advanced Search Techniques", "URL Anatomy, Hyperlinks, HTTP/HTTPS & HTML Fundamentals", "Email Architecture: To, CC, BCC, Attachments, MIME & Netiquette", "Digital Communication, E-Commerce (B2B/B2C/C2C/G2C), E-Governance, UPI/Digital Payments & Cloud Models (IaaS/PaaS/SaaS)"], "onePageRevision": ["Internet vs WWW: The Internet (originated from ARPANET in 1969, US DoD; adopted TCP/IP by Vint Cerf & Bob Kahn on Jan 1, 1983) is the global hardware infrastructure of interconnected networks. The World Wide Web (invented by Tim Berners-Lee at CERN in 1989/1990) is a software service of interlinked hypertext documents accessed OVER the Internet via HTTP/HTTPS.", "Web Browser vs Search Engine: Web Browser (client application software installed on user device to render HTML/web pages: Google Chrome, Mozilla Firefox, Microsoft Edge, Apple Safari, Opera, Brave, Mosaic/Netscape). Search Engine (web-based service using crawlers/spiders, indexer, and ranking algorithms to search the web: Google, Bing, DuckDuckGo, Yahoo!, Baidu, Yandex, AltaVista).", "URL Anatomy: `https://www.exam.gov.in:443/results/2025/merit.pdf?roll=102#top` -> Scheme/Protocol (`https`), Subdomain (`www`), Domain Name (`exam.gov.in`), TLD (`.in` ccTLD / `.gov` sTLD), Port (`443`), Path (`/results/2025/merit.pdf`), Query String (`?roll=102`), Fragment/Anchor (`#top`).", "Email History & Fields: Ray Tomlinson sent the first network email in 1971 and introduced the `@` symbol separating `username@domain`. CC (Carbon Copy - all recipients see who else received the email) vs BCC (Blind Carbon Copy - recipients in BCC are hidden from To and CC recipients). MIME (Multipurpose Internet Mail Extensions) allows sending non-ASCII attachments (audio, video, images, PDFs) over email.", "Digital Payments & Cloud Models: UPI (Unified Payments Interface, launched by NPCI in 2016 - instant 24x7 real-time mobile bank transfers using VPA). Cloud Service Models: IaaS (Infrastructure as a Service - virtual machines/storage, e.g., AWS EC2), PaaS (Platform as a Service - runtime/dev environment, e.g., Google App Engine, Heroku), SaaS (Software as a Service - ready-to-use browser apps, e.g., Microsoft 365, Google Docs, Gmail, Dropbox)."], "sections": [{"heading": "1. Internet History, WWW, Browsers, Search Engines & URLs", "content": "Distinguishing the underlying network infrastructure (Internet) from hypertext web services (WWW) and client software (Browsers) vs web crawlers (Search Engines) is critical:", "bullets": ["ARPANET to WWW: ARPANET (Advanced Research Projects Agency Network, 1969) was the first packet-switched network. Vint Cerf and Bob Kahn developed TCP/IP (1974/1983). Tim Berners-Lee invented the World Wide Web (1989) along with the three foundational web technologies: HTML, URI/URL, and HTTP, plus the first browser/editor 'WorldWideWeb' (later renamed Nexus). Marc Andreessen co-created Mosaic (1993), the first popular graphical browser.", "Search Engine Operations & Operators: Search engines operate in 3 stages: Web Crawling (spiders/bots), Indexing, and Ranking/Retrieval. Search operators: `\"exact phrase\"`, `site:gov.in`, `filetype:pdf`, `-exclude`.", "Cookies & Bookmarks: HTTP Cookies are small text files stored by a website on the user's browser to maintain session state (login cart, preferences). Incognito/Private mode prevents saving local browsing history and persistent cookies after closing the window, though the ISP and visited website can still see traffic."], "examTrap": "Exam Trap: 'WorldWideWeb' (no spaces, 1990) was the first web browser; 'Mosaic' (1993) was the first widely popular GRAPHICAL web browser; 'Archie' (1990) is considered the first Internet search engine (for FTP files)."}, {"heading": "2. Email Mechanics (To, CC, BCC), Digital Signatures, UPI & Cloud", "content": "Electronic communication, e-governance, and cloud computing underpin modern digital literacy:", "bullets": ["Email Addressing & Fields: Format is `local-part@domain-name`. To = primary recipient(s); CC (Carbon Copy) = secondary recipients visible to everyone on the thread; BCC (Blind Carbon Copy) = recipients whose email addresses are concealed from To/CC recipients and from other BCC recipients.", "Digital Signature vs Digital Certificate: A Digital Signature uses Asymmetric (Public-Key) Cryptography and cryptographic hashing: the sender hashes the message and encrypts the hash with their PRIVATE key; anyone can verify authenticity and integrity using the sender's PUBLIC key. A Digital Certificate (X.509) is issued by a trusted Certification Authority (CA) binding an entity's identity to their public key.", "E-Commerce & Digital India Payments: B2B (Alibaba/IndiaMART), B2C (Amazon/Flipkart), C2C (OLX/eBay), G2C (UMANG, DigiLocker, Parivahan). UPI (Unified Payments Interface) is developed by NPCI (National Payments Corporation of India) enabling instant bank-to-bank transfer via IMPS rails."], "examTrap": "Exam Trap: In creating a Digital Signature, the sender signs with their PRIVATE Key and the receiver verifies with the sender's PUBLIC Key (the exact opposite of confidential message encryption!)."}]}, {"code": "N", "id": "MOD-N", "title": "Module N: Computer Security and Cyber Safety", "category": "Computer Fundamentals", "targetQuestions": 15, "subtopics": ["CIA Triad: Confidentiality, Integrity, Availability + Authentication, Authorization & Non-Repudiation", "Malware Taxonomy: Virus, Worm, Trojan Horse, Ransomware, Spyware, Adware, Rootkit, Keylogger, Logic Bomb", "Social Engineering & Network Attacks: Phishing, Spear-Phishing, Vishing, Smishing, Pharming, Spoofing, DoS/DDoS, Man-in-the-Middle", "Defense Mechanisms: Firewall, Antivirus, IDS/IPS, Encryption/Decryption (Symmetric vs Asymmetric), MFA, VPN, Backup & Cyber Hygiene"], "onePageRevision": ["CIA Triad of Information Security: Confidentiality (only authorized users can read data; enforced via Encryption/Access Control), Integrity (data is accurate and untampered in transit/rest; enforced via Hashing SHA-256/MD5 & Digital Signatures), Availability (systems/data are accessible when needed by authorized users; attacked by DoS/DDoS and protected by Redundancy/Backups).", "Authentication vs Authorization: Authentication verifies 'WHO you are' (Something you know: Password/PIN; Something you have: OTP token/Smart card; Something you are: Biometrics). Authorization determines 'WHAT you are allowed to do' (Read/Write/Admin permissions) AFTER authentication.", "Virus vs Worm vs Trojan Horse: Virus (attaches itself to a legitimate host file/boot sector and requires human action to run and spread; 'Creeper' was first network worm/virus on ARPANET, 'Brain' 1986 was first MS-DOS PC boot-sector virus), Worm (standalone self-replicati
