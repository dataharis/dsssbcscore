        }
      } catch (e) {
        state = Object.assign({}, defaultState);

    // Utility: Escape HTML safely
    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Format inline code ticks `...` nicely
    function formatRichText(str) {
      if (!str) return '';
      let s = esc(str);
      s = s.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-blue-700 dark:text-blue-300 font-mono text-[0.85em] border border-slate-200 dark:border-slate-700">$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong class="font-semibold text-slate-900 dark:text-white">$1</strong>');
      s = s.replace(/\n/g, '<br/>');
      return s;
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(box._t);
      box._t = setTimeout(() => box.classList.add('hidden'), 2600);
    }

    // Compute overall stats
    function getStats() {
      const totalQ = QUESTIONS.length;
      const attemptedIds = Object.keys(state.attempts);
      const attempted = attemptedIds.length;
      let correct = 0;
      let incorrect = 0;
      attemptedIds.forEach(id => {
        if (state.attempts[id] && state.attempts[id].correct) correct++;
        else incorrect++;
      });
      const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
      const completedMods = Object.keys(state.completedModules).filter(k => state.completedModules[k]).length;
      const bookmarksCount = Object.keys(state.bookmarks).filter(k => state.bookmarks[k]).length;
      const reviewCount = Object.keys(state.markedForReview).filter(k => state.markedForReview[k]).length;

      // Module-wise stats
      const modStats = {};
      DATA.modules.forEach(m => {
        modStats[m.code] = { code: m.code, title: m.title, total: 0, attempted: 0, correct: 0, incorrect: 0, accuracy: 0 };
      });
      QUESTIONS.forEach(q => {
        const ms = modStats[q.moduleCode];
        if (ms) {
          ms.total++;
          const att = state.attempts[q.id];
          if (att) {
            ms.attempted++;
            if (att.correct) ms.correct++;
            else ms.incorrect++;
          }
        }
      });
      Object.values(modStats).forEach(ms => {
        ms.accuracy = ms.attempted > 0 ? Math.round((ms.correct / ms.attempted) * 100) : 0;
      });

      return { totalQ, attempted, correct, incorrect, remaining: totalQ - attempted, accuracy, completedMods, bookmarksCount, reviewCount, modStats };
    }

      const pill = document.getElementById('sidebarProgressPill');
      if (pill) pill.textContent = `${s.completedMods}/21 Mods`;
      const attCount = document.getElementById('sideAttemptedCount');
      if (attCount) attCount.textContent = `${s.attempted} / ${s.totalQ}`;
      const bar = document.getElementById('sideProgressBar');
      if (bar) bar.style.width = `${Math.min(100, Math.round((s.attempted / s.totalQ) * 100))}%`;
      const bCount = document.getElementById('sideBookmarkCount');
      if (bCount) bCount.textContent = String(s.bookmarksCount);

    // Practice Weak Topics Helper
    function startWeakTopicsPractice() {
      const s = getStats();
      const weakMods = Object.values(s.modStats)
        .sort((a, b) => {
          if (a.attempted === 0 && b.attempted === 0) return 0;
          if (a.attempted === 0) return 1;
          if (b.attempted === 0) return -1;
          return a.accuracy - b.accuracy;
        })
        .slice(0, 5)
        .map(m => m.code);

      const pool = QUESTIONS.filter(q => {
        const att = state.attempts[q.id];
        if (att && !att.correct) return true; // Prioritize wrong answers
        return weakMods.includes(q.moduleCode) && !att;
      });
      practiceSession.moduleCode = 'WEAK';
      practiceSession.list = (pool.length >= 10 ? pool : QUESTIONS.slice(0, 25)).slice(0, 25);
      practiceSession.currentIndex = 0;
      navigateTo('topic-practice');
      showToast(`Loaded ${practiceSession.list.length} questions from weak/unattempted areas!`);
    }

    function updateNumVisualizer() {
      const inp = document.getElementById('numVisInput');
      const grid = document.getElementById('numVisOutputGrid');
      if (!inp || !grid) return;
      let val = parseInt(inp.value, 10);
      if (isNaN(val)) val = 0;
      const absVal = Math.abs(val);
      const binStr = val >= 0 ? absVal.toString(2) : 'N/A (See 2s Comp)';
      const octStr = val >= 0 ? absVal.toString(8) : '-' + absVal.toString(8);
      const hexStr = val >= 0 ? absVal.toString(16).toUpperCase() : '-' + absVal.toString(16).toUpperCase();

      // 8421 BCD
      const bcdStr = val >= 0
        ? String(val).split('').map(d => parseInt(d, 10).toString(2).padStart(4, '0')).join(' ')
        : 'Unsigned only';

      // 8-bit 1's and 2's complement
      let onesComp = 'Out of 8-bit range (-128..127)';
      let twosComp = 'Out of 8-bit range (-128..127)';
      if (val >= -128 && val <= 127) {
        if (val >= 0) {
          onesComp = val.toString(2).padStart(8, '0');
          twosComp = onesComp;
        } else {
          const posBin = Math.min(127, absVal).toString(2).padStart(8, '0');
          if (val === -128) {
            onesComp = 'N/A (-127 min)';
            twosComp = '10000000';
          } else {
            onesComp = posBin.split('').map(b => b === '0' ? '1' : '0').join('');
            twosComp = ((256 + val) & 0xFF).toString(2).padStart(8, '0');
          }
        }
      }

      // Parity count on positive binary
      const onesCount = absVal.toString(2).split('').filter(b => b === '1').length;
      const evenParityBit = (onesCount % 2 === 0) ? '0' : '1';
      const oddParityBit = (onesCount % 2 === 0) ? '1' : '0';
      const asciiChar = (val >= 32 && val <= 126) ? `'${String.fromCharCode(val)}'` : (val >= 0 && val < 32 ? 'Control Char' : 'Non-ASCII');

      grid.innerHTML = `
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
          <div class="text-slate-400 text-[11px]">Binary (Base-2)</div>
          <div class="text-sm font-bold text-blue-600 dark:text-blue-400 mt-1">(${binStr})2</div>
        </div>
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
          <div class="text-slate-400 text-[11px]">Octal (Base-8) &amp; Hex (Base-16)</div>
          <div class="text-sm font-bold text-indigo-600 dark:text-indigo-400 mt-1">(${octStr})8  |  (${hexStr})16</div>
        </div>
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
          <div class="text-slate-400 text-[11px]">8421 BCD (4 bits/digit)</div>
          <div class="text-sm font-bold text-emerald-600 dark:text-emerald-400 mt-1">${bcdStr}</div>
        </div>
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
          <div class="text-slate-400 text-[11px]">8-Bit 1's &amp; 2's Complement</div>
          <div class="text-xs font-bold text-amber-600 dark:text-amber-400 mt-1">1's: ${onesComp}<br/>2's: ${twosComp}</div>
        </div>
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 sm:col-span-2">
          <div class="text-slate-400 text-[11px]">Parity Bits (Count of 1s in |${val}| = ${onesCount})</div>
          <div class="text-xs font-bold text-purple-600 dark:text-purple-400 mt-1">Even Parity Bit = ${evenParityBit}  |  Odd Parity Bit = ${oddParityBit}</div>
        </div>
        <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 sm:col-span-2">
          <div class="text-slate-400 text-[11px]">7-Bit ASCII Character Mapping</div>
          <div class="text-sm font-bold text-rose-600 dark:text-rose-400 mt-1">ASCII(${val}) = ${esc(asciiChar)}</div>
        </div>
      `;
    }

    function bindCompFundamentalsEvents() {
      const pracBtn = document.getElementById('cfPracticeAllBtn');
      if (pracBtn) {
        pracBtn.addEventListener('click', () => {

      document.querySelectorAll('.cf-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {

          renderActiveView();

      });

      // Architecture FDE steps
      const fdeSteps = {
        '1': { text: '<strong>Stage T1 (Address Fetch):</strong> Program Counter (<code>PC</code>) places the address of the next instruction into <code>MAR</code> (<code>MAR &larr; PC</code>) and puts it on the Unidirectional Address Bus.', activeId: 'regMAR' },
        '2': { text: '<strong>Stage T2 (Memory Read &amp; PC Increment):</strong> Primary Memory reads the instruction word at <code>M[MAR]</code> onto the Bidirectional Data Bus into <code>MBR</code>, while <code>PC</code> increments (<code>PC &larr; PC + 1</code>) to point to the next instruction.', activeId: 'regMBR' },
        '3': { text: '<strong>Stage T3 (Instruction Load):</strong> The fetched word in <code>MBR</code> is transferred into the Instruction Register (<code>IR &larr; MBR</code>). The Fetch Cycle is now complete.', activeId: 'regIR' },
        '4': { text: '<strong>Stage T4 (Instruction Decode):</strong> The Control Unit (<code>CU</code>) decodes the operation code (opcode) inside <code>IR</code> and calculates effective operand addresses.', activeId: 'archCU' },

      // Address/Data lines calculator
      const calcChip = () => {
        const wSel = document.getElementById('chipWordsSelect');
        const bSel = document.getElementById('chipBitsSelect');
        const out = document.getElementById('chipCalcOutput');
        if (!wSel || !bSel || !out) return;
        const addrLines = parseInt(wSel.value, 10);
        const dataLines = parseInt(bSel.value, 10);
        const words = Math.pow(2, addrLines);
        const totalBits = words * dataLines;
        const totalBytes = totalBits / 8;
        const kb = totalBytes >= 1024 ? `${(totalBytes/1024).toLocaleString()} KB` : `${totalBytes} Bytes`;
        out.innerHTML = `Result: Address Lines = <strong>${addrLines}</strong> (Unidirectional) | Data I/O Lines = <strong>${dataLines}</strong> (Bidirectional) | Total Capacity = <strong>${totalBits.toLocaleString()} bits (${kb})</strong>`;
      };
      const wSel = document.getElementById('chipWordsSelect');
      const bSel = document.getElementById('chipBitsSelect');
      if (wSel) wSel.addEventListener('change', calcChip);
      if (bSel) bSel.addEventListener('change', calcChip);

      // Cache calculator
      const calcCache = () => {
        const tcEl = document.getElementById('cacheTcInput');
        const tmEl = document.getElementById('cacheTmInput');
        const hEl = document.getElementById('cacheHitInput');
        const out = document.getElementById('cacheCalcResult');
        if (!tcEl || !tmEl || !hEl || !out) return;
        const tc = Math.max(0.1, parseFloat(tcEl.value) || 4);
        const tm = Math.max(1, parseFloat(tmEl.value) || 80);
        const h = Math.min(100, Math.max(0, parseFloat(hEl.value) || 90)) / 100;
        const sim = h * tc + (1 - h) * tm;
        const hier = tc + (1 - h) * tm;
        out.innerHTML = `Simultaneous Lookup: T_avg = ${h.toFixed(2)} &times; ${tc} + ${(1-h).toFixed(2)} &times; ${tm} = <strong>${sim.toFixed(2)} ns</strong><br/>Hierarchical Lookup: T_avg = ${tc} + ${(1-h).toFixed(2)} &times; ${tm} = <strong>${hier.toFixed(2)} ns</strong> (${(tm/hier).toFixed(1)}&times; faster than raw DRAM!)`;
      };

    function updateRefVisualizer() {
      const tSel = document.getElementById('refTypeSelect');
      const cSel = document.getElementById('refColDelta');
      const rSel = document.getElementById('refRowDelta');

      if (!tSel || !cSel || !rSel || !out) return;
      const type = tSel.value;
      const dc = parseInt(cSel.value, 10);
      const dr = parseInt(rSel.value, 10);
      const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      const targetCell = `${cols[2 + dc]}${3 + dr}`;
      let srcFormula = '=B2';
      let resFormula = '';
      let exp = '';

      if (type === 'rel') {
        srcFormula = '=B2';
        resFormula = `=${cols[1 + dc]}${2 + dr}`;
        exp = `Relative Reference: Column B shifts +${dc} to ${cols[1+dc]}, and Row 2 shifts +${dr} to ${2+dr}.`;
      } else if (type === 'abs') {
        srcFormula = '=$B$2';
        resFormula = '=$B$2';
        exp = `Absolute Reference: Both Column ($B) and Row ($2) are locked with '$', so nothing changes!`;
      } else if (type === 'mixCol') {
        srcFormula = '=$B2';
        resFormula = `=$B${2 + dr}`;
        exp = `Mixed (Column Locked): Column $B stays fixed, while Row 2 shifts +${dr} to ${2+dr}.`;
      } else if (type === 'mixRow') {
        srcFormula = '=B$2';
        resFormula = `=${cols[1 + dc]}$2`;
        exp = `Mixed (Row Locked): Column B shifts +${dc} to ${cols[1+dc]}, while Row $2 stays fixed.`;
      } else {
        srcFormula = '=$A3 + B$2';
        resFormula = `=$A${3 + dr} + ${cols[1 + dc]}$2`;
        exp = `Combo Mixed Reference: In $A3, Column A is locked and Row 3 shifts +${dr} to ${3+dr} ($A${3+dr}). In B$2, Column B shifts +${dc} to ${cols[1+dc]} and Row 2 is locked (${cols[1+dc]}$2).`;
      }

      out.innerHTML = `
        <div>📌 <strong>Formula in C3:</strong> <code class="px-2 py-0.5 rounded bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100">${srcFormula}</code> &nbsp;&rarr;&nbsp; Copied to <strong>${targetCell}</strong> (+${dc} Col, +${dr} Row) &nbsp;&rarr;&nbsp; <strong>New Formula in ${targetCell}:</strong> <code class="px-2.5 py-0.5 rounded bg-emerald-600 text-white font-bold">${resFormula}</code></div>
        <div class="text-slate-600 dark:text-slate-300 font-sans pt-1">💡 ${esc(exp)}</div>
      `;
    }

    function evaluateEducationalFormula(raw) {
      const f = (raw || '').trim();
      if (!f.startsWith('=')) return { res: f, note: 'Entered as literal text/number (does not start with =).' };
      const upper = f.toUpperCase().replace(/\s+/g, ' ');
      if (upper.startsWith('=AVG(')) return { res: '#NAME?', note: 'Trap caught! There is NO =AVG() function in Excel. Use =AVERAGE().' };
      // Match against our 36 pre-computed lab formulas
      const matchLab = DATA.excelLabFormulas.find(item => item.formula.toUpperCase() === f.toUpperCase());
      if (matchLab) return { res: matchLab.result, note: matchLab.explanation };

      // Built-in parser for common expressions
      try {
        const body = f.slice(1).trim();
        const uBody = body.toUpperCase();
        if (uBody === 'SUM(C2:C6)') return { res: '385', note: '85 + 92 + 78 + 64 + 66 = 385' };
        if (uBody === 'SUM(D2:D6)') return { res: '64000', note: '15000 + 15000 + 12000 + 12000 + 10000 = 64000' };
        if (uBody === 'AVERAGE(D2:D6)') return { res: '12800', note: '64000 / 5 = 12800' };
        const roundM = body.match(/^ROUND\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+)\s*\)$/i);
        if (roundM) {
          const n = parseFloat(roundM[1]), d = parseInt(roundM[2], 10);
          const factor = Math.pow(10, d);
          const r = Math.round(n * factor) / factor;
          return { res: String(r), note: `Rounded ${n} to ${d} digits -> ${r}` };
        }
        const intM = body.match(/^INT\(\s*(-?\d+(?:\.\d+)?)\s*\)$/i);
        if (intM) {
          const n = parseFloat(intM[1]);
          return { res: String(Math.floor(n)), note: `INT rounds down toward -Infinity: Math.floor(${n}) = ${Math.floor(n)}` };
        }
        const modM = body.match(/^MOD\(\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\)$/i);
        if (modM) {
          const n = parseFloat(modM[1]), d = parseFloat(modM[2]);
          if (d === 0) return { res: '#DIV/0!', note: 'Division by zero in MOD returns #DIV/0!' };
          const r = n - d * Math.floor(n / d);
          return { res: String(r), note: `n - d*INT(n/d) = ${r}` };
        }
        const lenM = body.match(/^LEN\(\s*"([^"]*)"\s*\)$/i);
        if (lenM) return { res: String(lenM[1].length), note: `Character count including spaces = ${lenM[1].length}` };
        // Simple arithmetic expression
        if (/^[\d\s+\-*/^().]+$/.test(body)) {
          const jsExpr = body.replace(/\^/g, '**');
          const val = Function('"use strict"; return (' + jsExpr + ');')();
          if (!isFinite(val)) return { res: '#DIV/0!', note: 'Division by zero!' };
          return { res: String(val), note: 'Evaluated using Excel operator precedence (^ then *,/ then +,-).' };
        }
      } catch (e) {}
      return { res: 'Select any of the 36 functions above or enter =ROUND(n,d), =INT(n), =MOD(n,d), =LEN("text")', note: 'Educational simulator tip' };
    }

        if (!opts.includes(cand)) opts.push(cand);
        step += 5;

      // Deterministic shuffle based on currentIdx
      const rotated = opts.slice(shortcutQuizState.currentIdx % 4).concat(opts.slice(0, shortcutQuizState.currentIdx % 4));

                if (shortcutQuizState.answered !== null) {

    function buildPracticeList() {
      let pool = QUESTIONS.slice();
      if (practiceSession.moduleCode && practiceSession.moduleCode !== 'ALL' && practiceSession.moduleCode !== 'WEAK') {
        pool = pool.filter(q => q.moduleCode === practiceSession.moduleCode);
      }
      if (practiceSession.topic && practiceSession.topic !== 'ALL') {
        pool = pool.filter(q => q.topic === practiceSession.topic);
      }
      if (practiceSession.difficulty && practiceSession.difficulty !== 'ALL') {
        pool = pool.filter(q => q.difficulty === practiceSession.difficulty);
      }
      if (practiceSession.sourceType && practiceSession.sourceType !== 'ALL') {
        pool = pool.filter(q => q.sourceType === practiceSession.sourceType);
      }
      if (practiceSession.count !== 'ALL') {
        const limit = parseInt(practiceSession.count, 10) || 20;
        pool = pool.slice(0, limit);
      }
      practiceSession.list = pool;
      practiceSession.currentIndex = 0;
    }

    function renderPYQBank() {
      let filtered = QUESTIONS.filter(q => {
        if (pyqFilter.sourceType === 'VerifiedAndAdapted') {
          if (q.sourceType !== 'Verified PYQ' && q.sourceType !== 'Adapted PYQ') return false;
        } else if (pyqFilter.sourceType !== 'ALL') {
          if (q.sourceType !== pyqFilter.sourceType) return false;
        }
        if (pyqFilter.exam !== 'ALL') {
          if (!q.exam || !q.exam.toLowerCase().includes(pyqFilter.exam.toLowerCase())) return false;
        }
        if (pyqFilter.year !== 'ALL') {
          if (String(q.year) !== pyqFilter.year) return false;
        }
        if (pyqFilter.moduleCode !== 'ALL') {
          if (q.moduleCode !== pyqFilter.moduleCode) return false;
        }
        if (pyqFilter.difficulty !== 'ALL') {
          if (q.difficulty !== pyqFilter.difficulty) return false;
        }
        if (pyqFilter.search) {
          const s = pyqFilter.search.toLowerCase();
          const hay = `${q.question} ${q.explanation} ${q.topic} ${q.subtopic} ${q.exam || ''}`.toLowerCase();
          if (!hay.includes(s)) return false;
        }
        return true;
      });

      const pageSize = 15;
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      const currPage = Math.min(Math.max(1, pyqFilter.page), totalPages);
      const slice = filtered.slice((currPage - 1) * pageSize, currPage * pageSize);

    // VIEW 13: MOCK TESTS SUITE (26 SECTIONAL & FULL-LENGTH CBT TESTS)

    function startMockTest(testId) {
      const testObj = DATA.mockTests.find(t => t.id === testId);
      if (!testObj) return;
      clearInterval(activeMock.timerId);
      const qList = testObj.questionIds.map(id => Q_MAP[id]).filter(Boolean);
      activeMock = {
        running: true,
        submitted: false,
        testObj,
        questions: qList,
        currentIndex: 0,
        responses: {},
        reviewFlags: {},
        visited: { [qList[0].id]: true },
        remainingSec: testObj.durationMins * 60,
        timerId: null
      };
      activeMock.timerId = setInterval(() => {
        if (!activeMock.running || activeMock.submitted) {
          clearInterval(activeMock.timerId);
          return;
        }
        activeMock.remainingSec--;
        const timerEl = document.getElementById('mockTimerDisplay');
        if (timerEl) {
          const m = Math.floor(activeMock.remainingSec / 60);
          const s = activeMock.remainingSec % 60;
          timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        if (activeMock.remainingSec <= 0) {
          clearInterval(activeMock.timerId);
          submitMockTestFinal();
        }
      }, 1000);
      renderActiveView();
    }

    function submitMockTestFinal() {
      clearInterval(activeMock.timerId);
      activeMock.running = false;
      activeMock.submitted = true;
      let correct = 0, wrong = 0, unattempted = 0;
      activeMock.questions.forEach(q => {
        const sel = activeMock.responses[q.id];
        if (!sel) unattempted++;
        else if (sel === q.correctAnswer) {
          correct++;
          state.attempts[q.id] = { selected: sel, correct: true, timestamp: Date.now() };
        } else {
          wrong++;
          state.attempts[q.id] = { selected: sel, correct: false, timestamp: Date.now() };
        }
      });
      const total = activeMock.questions.length;
      const acc = (correct + wrong) > 0 ? Math.round((correct / (correct + wrong)) * 100) : 0;
      const timeUsed = (activeMock.testObj.durationMins * 60) - Math.max(0, activeMock.remainingSec);

      state.mockHistory.unshift({
        testId: activeMock.testObj.id,
        title: activeMock.testObj.title,
        score: correct,
        total,
        correct,
        wrong,
        unattempted,
        accuracy: acc,
        timeTakenSec: timeUsed,
        date: new Date().toISOString().slice(0, 10)
      });
      saveState();
      renderActiveView();
      showToast(`Mock Test Submitted! Score: ${correct}/${total} (${acc}% Accuracy)`);
    }

              { label: 'Cancel', className: 'px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200' },
              {
                label: 'Confirm Reset All Progress',
                className: 'px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white hover:bg-rose-700',
                onClick: () => {
                  const keepDark = state.darkMode;
                  state = Object.assign({}, defaultState, { darkMode: keepDark, completedModules: {}, attempts: {}, bookmarks: {}, markedForReview: {}, mockHistory: [] });
                  saveState();
                  renderActiveView();
                  showToast('All study progress has been reset.');
                }
              }
            ]
          );
        });
      }
    }

    // =========================================================================
    // GLOBAL SEARCH ENGINE (QUESTIONS, NOTES, FORMULAS, SHORTCUTS, EXTENSIONS)
    // =========================================================================
    let currentSearchQuery = '';
    function executeGlobalSearch(query) {
      const q = (query || '').trim();
      if (!q) {
        showToast('Enter a search term first!');
        return;
      }
      currentSearchQuery = q;
      state.activeView = 'search-results';
      renderSidebar();
      renderActiveView();
    }

    function renderSearchResults() {
      const q = currentSearchQuery.toLowerCase();
      const matchedQs = QUESTIONS.filter(item =>
        `${item.id} ${item.question} ${item.explanation} ${item.topic} ${item.subtopic} ${item.module}`.toLowerCase().includes(q)
      ).slice(0, 25);

      const matchedDefs = DATA.definitions.filter(d =>
        `${d.term} ${d.definition}`.toLowerCase().includes(q)
      );

      const matchedShortcuts = DATA.shortcutsCollection.filter(s =>
        `${s.key} ${s.app} ${s.action} ${s.note}`.toLowerCase().includes(q)
      );

      const matchedFormulas = DATA.excelFormulasSheet.filter(f =>
        `${f.name} ${f.syntax} ${f.purpose} ${f.example}`.toLowerCase().includes(q)
      );

      const matchedExts = DATA.fileExtensionsSheet.filter(x =>
        `${x.ext} ${x.category} ${x.app} ${x.details}`.toLowerCase().includes(q)
      );

      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Global Search Results for "${esc(currentSearchQuery)}"</h2>
              <p class="text-xs text-slate-500">Found ${matchedQs.length} MCQs, ${matchedDefs.length} definitions, ${matchedShortcuts.length} shortcuts, ${matchedFormulas.length} Excel functions, and ${matchedExts.length} file extensions.</p>
            </div>
            <button type="button" id="closeSearchBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-xs font-bold">&larr; Back to Dashboard</button>
          </div>

          ${matchedShortcuts.length ? `
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2">
              <h3 class="text-sm font-bold text-blue-600">⌨️ Matching Shortcut Keys (${matchedShortcuts.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                ${matchedShortcuts.map(s => `<div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800"><strong>${esc(s.key)}</strong> (${esc(s.app)}): ${formatRichText(s.action)}</div>`).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedFormulas.length ? `
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2">
              <h3 class="text-sm font-bold text-emerald-600">📗 Matching Excel Functions (${matchedFormulas.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                ${matchedFormulas.map(f => `<div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800"><strong>${esc(f.syntax)}</strong>: ${formatRichText(f.purpose)} (<code>${esc(f.example)}</code>)</div>`).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedDefs.length ? `
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2">
              <h3 class="text-sm font-bold text-indigo-600">📖 Matching Definitions (${matchedDefs.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                ${matchedDefs.map(d => `<div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800"><strong>${esc(d.term)}:</strong> ${formatRichText(d.definition)}</div>`).join('')}
              </div>
            </div>
          ` : ''}

          ${matchedExts.length ? `
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-4 space-y-2">
              <h3 class="text-sm font-bold text-purple-600">📁 Matching File Extensions (${matchedExts.length})</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs">
                ${matchedExts.map(x => `<div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800"><strong>${esc(x.ext)}</strong> (${esc(x.app)}): ${formatRichText(x.details)}</div>`).join('')}
              </div>
            </div>
          ` : ''}

          <div class="space-y-4">
            <h3 class="text-base font-bold">🎯 Matching Questions (${matchedQs.length})</h3>
            ${matchedQs.length ? matchedQs.map((item, i) => renderQuestionCard(item, `Match #${i + 1}`)).join('') : `<div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border text-xs text-slate-500">No MCQs matched "${esc(currentSearchQuery)}".</div>`}
          </div>
        </div>
      `;
    }

    document.getElementById('globalSearchBtn').addEventListener('click', () => {
      executeGlobalSearch(document.getElementById('globalSearchInput').value);
    });
    document.getElementById('globalSearchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeGlobalSearch(document.getElementById('globalSearchInput').value);
    });
    document.getElementById('mobileSearchBtn').addEventListener('click', () => {
      executeGlobalSearch(document.getElementById('mobileSearchInput').value);
    });

    // Main View Router
    function renderActiveView() {
      const container = document.getElementById('viewContent');
      const v = state.activeView;
      if (v === 'dashboard') {
        container.innerHTML = renderDashboard();
        bindDashboardEvents();
      } else if (v === 'syllabus') {
        container.innerHTML = renderSyllabus();
        bindSyllabusEvents();
      } else if (v === 'study-notes') {
        container.innerHTML = renderStudyNotes();
        bindStudyNotesEvents();
      } else if (v === 'comp-fundamentals') {
        container.innerHTML = renderCompFundamentals();
        bindCompFundamentalsEvents();
      } else if (v === 'ms-word') {
        container.innerHTML = renderMSWord();
        bindMSWordEvents();
      } else if (v === 'ms-excel') {
        container.innerHTML = renderMSExcel();
        bindMSExcelEvents();
      } else if (v === 'excel-lab') {
        container.innerHTML = renderExcelLab();
        bindExcelLabEvents();
      } else if (v === 'ms-powerpoint') {
        container.innerHTML = renderMSPowerPoint();
        bindMSPowerPointEvents();
      } else if (v === 'ms-access') {
        container.innerHTML = renderMSAccess();
        bindMSAccessEvents();
      } else if (v === 'shortcuts') {
        container.innerHTML = renderShortcuts();
        bindShortcutsEvents();
      } else if (v === 'topic-practice') {
        container.innerHTML = renderTopicPractice();
        bindTopicPracticeEvents();
      } else if (v === 'pyq-bank') {
        container.innerHTML = renderPYQBank();
        bindPYQBankEvents();
      } else if (v === 'mock-tests') {
        container.innerHTML = renderMockTests();
        bindMockTestsEvents();
      } else if (v === 'comparisons') {
        container.innerHTML = renderComparisons();
        bindComparisonsEvents();
      } else if (v === 'revision') {
        container.innerHTML = renderRevision();
        bindRevisionEvents();
      } else if (v === 'bookmarks') {
        container.innerHTML = renderBookmarks();
        bindBookmarksEvents();
      } else if (v === 'performance') {
        container.innerHTML = renderPerformance();
        bindPerformanceEvents();
      } else if (v === 'search-results') {
        container.innerHTML = renderSearchResults();
        const cBtn = document.getElementById('closeSearchBtn');
        if (cBtn) cBtn.addEventListener('click', () => navigateTo('dashboard'));
      } else {
        container.innerHTML = renderDashboard();
        bindDashboardEvents();
      }
      updateHeaderAndSidebarStats();
    }

    // Boot Application
    loadState();
    applyTheme();
    buildPracticeList();
    renderSidebar();
    renderActiveView();

  })();
  </script>
</body>
</html>
