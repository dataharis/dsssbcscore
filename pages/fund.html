ce", "C": "Adele Goldberg", "D": "Joan Clarke"}, "correctAnswer": "B", "explanation": "Lady Ada Lovelace wrote Note G (1843) detailing a step-by-step algorithm to compute Bernoulli numbers on the Analytical Engine. Grace Hopper (Option A) developed the first compiler (A-0) and led COBOL.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B05", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Electronic Computers", "subtopic": "EDSAC vs EDVAC vs ENIAC", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "Although ENIAC (1945) was the first general-purpose electronic digital computer and EDVAC proposed the stored-program design, which computer built by Maurice Wilkes at Cambridge University in May 1949 became the FIRST operational stored-program electronic computer?", "options": {"A": "UNIVAC-I", "B": "EDSAC (Electronic Delay Storage Automatic Calculator)", "C": "IBM 701", "D": "Harvard Mark I"}, "correctAnswer": "B", "explanation": "EDSAC (built by Maurice Wilkes and his team in May 1949 using mercury delay lines) ran the first practical stored program in history, two years before EDVAC became fully operational in 1951.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B06", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Calculating Devices", "subtopic": "Jacquard and Hollerith", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the historical computing pioneers with their key contributions:\n1. John Napier — (p) Punched Card Census Tabulator (1890)\n2. Joseph Marie Jacquard — (q) Ivory rods ('Bones') & Logarithms (1617)\n3. Herman Hollerith — (r) Automated Loom controlled by punched cards (1801)\n4. Howard Aiken — (s) Electromechanical Harvard Mark I (1944)", "options": {"A": "1-q, 2-r, 3-p, 4-s", "B": "1-r, 2-q, 3-p, 4-s", "C": "1-q, 2-p, 3-r, 4-s", "D": "1-s, 2-r, 3-p, 4-q"}, "correctAnswer": "A", "explanation": "John Napier invented Napier's Bones (1617); Jacquard invented the punched-card textile loom (1801); Herman Hollerith built the 1890 US Census Tabulating Machine (which led to IBM); Howard Aiken designed Harvard Mark I (1944).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B07", "moduleCode": "B", "module": "B. History and Generations", "topic": "Generations", "subtopic": "Switching Technologies", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Adapted PYQ", "question": "What is the correct chronological order of hardware switching technologies from the First Generation to the Fifth Generation of computers?", "options": {"A": "Transistors -> Vacuum Tubes -> ICs -> VLSI Microprocessors -> ULSI", "B": "Vacuum Tubes -> Transistors -> Integrated Circuits (ICs) -> VLSI Microprocessors -> ULSI / AI", "C": "Vacuum Tubes -> ICs -> Transistors -> Microprocessors -> Quantum", "D": "Relays -> Transistors -> Vacuum Tubes -> VLSI -> ULSI"}, "correctAnswer": "B", "explanation": "1st Gen = Vacuum Tubes; 2nd Gen = Transistors; 3rd Gen = Integrated Circuits (SSI/MSI); 4th Gen = LSI/VLSI Microprocessors; 5th Gen = ULSI/SLSI & AI.", "exam": "NVS TGT Computer Science / ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS TGT Official Paper"}, {"id": "CF-B08", "moduleCode": "B", "module": "B. History and Generations", "topic": "Second Generation", "subtopic": "Transistor & Memory", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In Second-Generation computers (1956–1963), Vacuum Tubes were replaced by Transistors (invented at Bell Labs by Bardeen, Brattain, and Shockley). What was the primary technology used for Main Memory in Second-Generation computers?", "options": {"A": "Mercury Acoustic Delay Lines", "B": "Magnetic Core Memory (ferrite rings)", "C": "DDR4 SDRAM chips", "D": "Optical Blu-ray Discs"}, "correctAnswer": "B", "explanation": "Second-generation computers (such as IBM 1401 and IBM 7090) used Magnetic Core Memory (tiny magnetized ferrite rings threaded on wire grids) for primary memory and magnetic tapes/disks for secondary storage.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B09", "moduleCode": "B", "module": "B. History and Generations", "topic": "Third Generation", "subtopic": "Integrated Circuits", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Who independently co-invented the Integrated Circuit (IC) in 1958–1959, paving the way for Third-Generation computers such as the IBM System/360 and PDP-8?", "options": {"A": "J. Presper Eckert and John Mauchly", "B": "Jack Kilby and Robert Noyce", "C": "Ted Hoff and Federico Faggin", "D": "Ken Thompson and Dennis Ritchie"}, "correctAnswer": "B", "explanation": "Jack Kilby (at Texas Instruments, germanium IC, 1958) and Robert Noyce (at Fairchild Semiconductor, planar silicon IC, 1959) independently invented the Integrated Circuit.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B10", "moduleCode": "B", "module": "B. History and Generations", "topic": "Fourth Generation", "subtopic": "First Microprocessor", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "Which chip released in 1971 (designed by Ted Hoff, Federico Faggin, and Masatoshi Shima) was the world's first commercially available single-chip Microprocessor, ushering in the Fourth Generation of computers?", "options": {"A": "Intel 8086", "B": "Intel 4004 (4-bit)", "C": "Motorola 68000", "D": "AMD Athlon"}, "correctAnswer": "B", "explanation": "The Intel 4004 (released November 1971) was a 4-bit CPU containing 2,300 transistors on a single silicon chip and was the first commercial microprocessor.", "exam": "DSSSB TGT Computer Science", "year": 2017, "shift": "21 May 2017", "sourceReference": "DSSSB TGT CS 2017 Official Paper"}, {"id": "CF-B11", "moduleCode": "B", "module": "B. History and Generations", "topic": "Pioneers", "subtopic": "Alan Turing", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Alan Turing is celebrated as the 'Father of Theoretical Computer Science and Artificial Intelligence'. Which theoretical model did he introduce in his 1936 paper 'On Computable Numbers' that defines the mathematical limits of mechanical computation?", "options": {"A": "The Von Neumann Bus Model", "B": "The Universal Turing Machine", "C": "Boolean Logic Gates", "D": "The OSI 7-Layer Reference Model"}, "correctAnswer": "B", "explanation": "Alan Turing formalized the concept of algorithm and computation in 1936 with the Universal Turing Machine, and later proposed the 'Turing Test' (Imitation Game) in 1950 to evaluate machine intelligence.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B12", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Electronic Computers", "subtopic": "UNIVAC-I", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which computer built by J. Presper Eckert and John Mauchly and delivered to the US Census Bureau in 1951 was the world's first commercially produced electronic digital computer?", "options": {"A": "ENIAC", "B": "UNIVAC-I (Universal Automatic Computer I)", "C": "ABC (Atanasoff-Berry Computer)", "D": "Colossus"}, "correctAnswer": "B", "explanation": "UNIVAC-I (1951) was the first commercial electronic computer produced for business and administrative use. ENIAC (1945) was built for military research, and ABC (1942) was a non-programmable linear equation solver.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B13", "moduleCode": "B", "module": "B. History and Generations", "topic": "Generations", "subtopic": "Machine Examples", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match the following classic computer models with their correct Computer Generation:\n1. ENIAC & UNIVAC-I — (p) Third Generation\n2. IBM 1401 & CDC 1604 — (q) Fourth Generation\n3. IBM System/360 & PDP-11 — (r) First Generation\n4. Cray-1 & Apple II — (s) Second Generation", "options": {"A": "1-r, 2-s, 3-p, 4-q", "B": "1-s, 2-r, 3-p, 4-q", "C": "1-r, 2-p, 3-s, 4-q", "D": "1-r, 2-s, 3-q, 4-p"}, "correctAnswer": "A", "explanation": "ENIAC/UNIVAC-I = 1st Gen (r); IBM 1401/CDC 1604 = 2nd Gen (s); IBM System/360 & PDP-11 = 3rd Gen (p); Cray-1 & Apple II = 4th Gen (q).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B14", "moduleCode": "B", "module": "B. History and Generations", "topic": "Generations", "subtopic": "IC Integration Scales", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "What is the correct expansion of VLSI and ULSI used in Fourth and Fifth Generation microprocessors?", "options": {"A": "Virtual Large System Integration & Universal Logic System Integration", "B": "Very Large Scale Integration & Ultra Large Scale Integration", "C": "Variable Logic Semiconductor IC & Unified Large Scale IC", "D": "Volatile Large Scale Interface & Ultra Linear System Interface"}, "correctAnswer": "B", "explanation": "VLSI stands for Very Large Scale Integration (4th Generation) and ULSI stands for Ultra Large Scale Integration (5th Generation, millions to billions of transistors per chip).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B15", "moduleCode": "B", "module": "B. History and Generations", "topic": "Third Generation", "subtopic": "Operating System Evolution", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "During which generation of computers were Multiprogramming, Time-Sharing operating systems, and keyboards/monitors first introduced to replace punched cards and batch-only processing?", "options": {"A": "First Generation", "B": "Second Generation", "C": "Third Generation", "D": "Fifth Generation"}, "correctAnswer": "C", "explanation": "Third-generation computers (1964–1971, IC era) introduced Multiprogramming and Time-Sharing operating systems along with interactive keyboard and monitor terminals.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B16", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Electronic Computers", "subtopic": "ENIAC Number System", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Original Practice Question", "question": "Which of the following statements regarding the ENIAC (Electronic Numerical Integrator and Computer) is TRUE?", "options": {"A": "It used 18,000 silicon microprocessors and ran Windows", "B": "It used decimal (base-10) ring counters rather than binary arithmetic and had to be reprogrammed manually by rewiring plugboards and switches", "C": "It was designed by Charles Babbage in 1837", "D": "It used magnetic core memory and COBOL"}, "correctAnswer": "B", "explanation": "Unlike EDVAC (which used binary and stored programs), ENIAC used 10-position decimal ring counters (~18,000 vacuum tubes) and required days of manual cable plugboard rewiring to switch programs.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B17", "moduleCode": "B", "module": "B. History and Generations", "topic": "Generations", "subtopic": "Execution Speed Progression", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "How did typical instruction execution time progress from the First Generation to the Fourth Generation of computers?", "options": {"A": "Milliseconds (1st) -> Microseconds (2nd) -> Nanoseconds (3rd) -> Picoseconds (4th)", "B": "Seconds (1st) -> Milliseconds (2nd) -> Microseconds (3rd) -> Nanoseconds (4th)", "C": "Microseconds (1st) -> Nanoseconds (2nd) -> Picoseconds (3rd) -> Femtoseconds (4th)", "D": "Nanoseconds (1st) -> Microseconds (2nd) -> Milliseconds (3rd) -> Seconds (4th)"}, "correctAnswer": "A", "explanation": "Standard textbook progression: 1st Gen = Milliseconds (10^-3 s), 2nd Gen = Microseconds (10^-6 s), 3rd Gen = Nanoseconds (10^-9 s), 4th Gen = Picoseconds (10^-12 s).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B18", "moduleCode": "B", "module": "B. History and Generations", "topic": "Fifth Generation", "subtopic": "Japan ICOT & AI", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Fifth-Generation Computing (initially spearheaded by Japan's FGCS project in 1982) focuses primarily on which combination of technologies?", "options": {"A": "Vacuum tubes and magnetic drum memory", "B": "ULSI hardware, massive parallel processing, logic programming (Prolog/LISP), Natural Language Processing (NLP), and Artificial Intelligence", "C": "Replacing semiconductor RAM with punched paper tape", "D": "Batch processing using assembly mnemonics"}, "correctAnswer": "B", "explanation": "Fifth-generation systems combine ULSI silicon, multi-core/GPU parallel processing, knowledge-based expert systems, NLP, and AI.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B19", "moduleCode": "B", "module": "B. History and Generations", "topic": "Pioneers", "subtopic": "Grace Hopper", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Rear Admiral Dr. Grace Murray Hopper is renowned in computer history for inventing the first Compiler (A-0 system) and spearheading the development of which business-oriented programming language?", "options": {"A": "FORTRAN", "B": "COBOL (Common Business-Oriented Language)", "C": "C++", "D": "Java"}, "correctAnswer": "B", "explanation": "Grace Hopper developed the first compiler (1952) and her FLOW-MATIC language formed the foundation of COBOL (1959). John Backus led the creation of FORTRAN (1957).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B20", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Electronic Computers", "subtopic": "Atanasoff-Berry Computer", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Built between 1939 and 1942 in Iowa, which special-purpose machine was the first to use binary digits and electronic vacuum-tube switching, though it was neither general-purpose nor programmable?", "options": {"A": "UNIVAC-I", "B": "ABC (Atanasoff-Berry Computer)", "C": "EDSAC", "D": "IBM 650"}, "correctAnswer": "B", "explanation": "The Atanasoff-Berry Computer (ABC) was built to solve systems of simultaneous linear equations using binary arithmetic and regenerative capacitor drum memory.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C01", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Data Handling", "subtopic": "Hybrid Computers", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "An Intensive Care Unit (ICU) ECG patient monitoring machine in a hospital measures continuous analog electrical heart signals and displays heart rate and blood pressure as digital numbers on a screen. Which type of computer is this?", "options": {"A": "Pure Analog Computer", "B": "Hybrid Computer", "C": "Mainframe Computer", "D": "General-Purpose Microcomputer"}, "correctAnswer": "B", "explanation": "An ICU patient monitor is the classic example of a Hybrid Computer: its sensors capture continuous analog physiological signals (voltage/pressure) and convert them via ADC into discrete digital values for processing and display.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-C02", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Size and Capacity", "subtopic": "Size Ordering", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Adapted PYQ", "question": "Arrange the following classes of digital computers in ascending order of their physical size, processing capacity, and cost (from smallest to largest):", "options": {"A": "Microcomputer -> Minicomputer -> Mainframe -> Supercomputer", "B": "Minicomputer -> Microcomputer -> Mainframe -> Supercomputer", "C": "Microcomputer -> Mainframe -> Minicomputer -> Supercomputer", "D": "Supercomputer -> Mainframe -> Minicomputer -> Microcomputer"}, "correctAnswer": "A", "explanation": "From smallest to largest capacity: Microcomputer (PC/Laptop) < Minicomputer (mid-range server) < Mainframe < Supercomputer.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-C03", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Supercomputers", "subtopic": "Indian Supercomputing", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Which was India's first indigenous Supercomputer developed in 1991 by C-DAC (Centre for Development of Advanced Computing), Pune under the leadership of Dr. Vijay Pandurang Bhatkar?", "options": {"A": "ANUPAM", "B": "PARAM 8000", "C": "SAGA-220", "D": "PRATYUSH"}, "correctAnswer": "B", "explanation": "PARAM 8000 (unveiled in 1991 by C-DAC Pune) was India's first indigenous supercomputer. ANUPAM was developed by BARC, and SAGA-220 by ISRO.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 3", "sourceReference": "DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-C04", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Supercomputers", "subtopic": "World Pioneers", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Who is globally known as the 'Father of Supercomputing' for designing the landmark CDC 6600 (1964) and Cray-1 (1976) supercomputers?", "options": {"A": "Seymour Cray", "B": "John Backus", "C": "Vint Cerf", "D": "Gordon Moore"}, "correctAnswer": "A", "explanation": "American electrical engineer Seymour Cray designed the CDC 6600 and founded Cray Research (building the Cray-1 vector supercomputer), earning the title 'Father of Supercomputing'.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C05", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Size and Capacity", "subtopic": "Mainframe vs Supercomputer", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "What is the primary architectural and operational distinction between a Mainframe Computer and a Supercomputer?", "options": {"A": "Mainframes are portable battery-powered devices whereas Supercomputers are single-chip microcontrollers", "B": "Mainframes optimize massive concurrent I/O transaction throughput for thousands of simultaneous users (e.g., banking/railways), whereas Supercomputers channel parallel floating-point power into solving a single complex scientific computation", "C": "Supercomputers cannot use parallel processing whereas Mainframes only run MS-DOS", "D": "Mainframes are analog computers whereas Supercomputers are hybrid computers"}, "correctAnswer": "B", "explanation": "Mainframes (like IBM zSeries) excel at high-reliability enterprise transaction processing (millions of I/O operations per second for thousands of users), while Supercomputers focus on peak FLOPS for compute-intensive simulations (climate, nuclear, astrophysics).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C06", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Special-Purpose", "subtopic": "Embedded Computers", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "A microcontroller built inside an automobile's Anti-lock Braking System (ABS), a microwave oven, or a digital pacemaker—programmed to perform a dedicated task with real-time constraints—is classified as:", "options": {"A": "An Embedded Computer (Special-Purpose Computer)", "B": "A General-Purpose Mainframe", "C": "A Minicomputer", "D": "A Hybrid Supercomputer"}, "correctAnswer": "A", "explanation": "Embedded systems are special-purpose microcontrollers integrated inside larger mechanical or electrical products to execute dedicated real-time control functions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C07", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Parallel Computing", "subtopic": "Flynn's Taxonomy", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "According to Michael Flynn's 1966 taxonomy of computer architectures, modern multi-core processors, distributed clusters, and supercomputers that execute different instruction streams simultaneously on different data sets belong to which category?", "options": {"A": "SISD (Single Instruction, Single Data)", "B": "SIMD (Single Instruction, Multiple Data)", "C": "MISD (Multiple Instruction, Single Data)", "D": "MIMD (Multiple Instruction, Multiple Data)"}, "correctAnswer": "D", "explanation": "In Flynn's taxonomy: SISD = traditional uniprocessor; SIMD = vector/GPU array processing the same instruction on many data elements; MIMD = multicore CPUs and parallel clusters executing independent instructions on independent data simultaneously.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C08", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Supercomputers", "subtopic": "Indian Institutions Match", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match the Indian Supercomputer series with the organization that developed it:\n1. PARAM Series — (p) BARC (Bhabha Atomic Research Centre)\n2. ANUPAM Series — (q) C-DAC (Centre for Development of Advanced Computing)\n3. PACE Series — (r) ISRO (Vikram Sarabhai Space Centre)\n4. SAGA-220 — (s) ANURAG (DRDO)", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-q, 4-s"}, "correctAnswer": "A", "explanation": "PARAM = C-DAC (q); ANUPAM = BARC Mumbai (p); PACE (Processor for Aerodynamic Computation and Evaluation) = DRDO's ANURAG lab Hyderabad (s); SAGA-220 = ISRO (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C09", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Workstations", "subtopic": "Workstation vs PC", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which feature typically distinguishes a professional Engineering Workstation from a standard home Desktop Personal Computer?", "options": {"A": "Workstations use vacuum tubes instead of microprocessors", "B": "Workstations feature server-grade CPUs (e.g., Xeon/Threadripper), Error-Correcting Code (ECC) RAM, and certified professional GPUs for CAD/3D rendering", "C": "Workstations cannot connect to a Local Area Network", "D": "Workstations operate only on analog voltages"}, "correctAnswer": "B", "explanation": "Workstations are high-performance single-user computers engineered for CAD/CAM, 3D animation, and data science, utilizing ECC RAM (to prevent single-bit memory corruption) and workstation GPUs.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C10", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Data Handling", "subtopic": "Analog Computers", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which of the following devices operates purely on the principles of an Analog Computer by measuring continuous physical rotation or pressure?", "options": {"A": "Digital Wristwatch", "B": "Mechanical Automobile Speedometer and Bourdon Pressure Gauge", "C": "Desktop Calculator", "D": "Smart Television"}, "correctAnswer": "B", "explanation": "A mechanical speedometer and Bourdon pressure gauge respond continuously to physical shaft rotation or fluid pressure without converting data into binary digits.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C11", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Size and Capacity", "subtopic": "Minicomputers", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which of the following historical systems introduced by Digital Equipment Corporation (DEC) in the 1960s and 1970s is a classic example of a Minicomputer?", "options": {"A": "PDP-11 and VAX-11", "B": "Cray X-MP", "C": "PARAM Siddhi-AI", "D": "Apple iPad"}, "correctAnswer": "A", "explanation": "DEC's PDP-8, PDP-11, and VAX-11 (along with IBM AS/400) are the textbook examples of Minicomputers (mid-range multi-user systems).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C12", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Distributed Computing", "subtopic": "Cluster vs Grid", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In distributed and parallel computing, what is the primary difference between Homogeneous Cluster Computing and Heterogeneous Grid Computing?", "options": {"A": "Cluster computing connects tightly coupled, identical/homogeneous server nodes on a fast local network acting as a single system, whereas Grid computing pools loosely coupled, geographically dispersed heterogeneous computers across different administrative domains", "B": "Cluster computing uses only analog computers whereas Grid computing uses only smartphones", "C": "Grid computing cannot use the internet", "D": "Cluster computing is limited to 2 computers maximum"}, "correctAnswer": "A", "explanation": "A Beowulf/HPC Cluster links homogeneous nodes in a single data center via high-speed interconnects (InfiniBand/LAN), while a Computing Grid federates geographically distributed, heterogeneous machines over a WAN.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C13", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Personal Computers", "subtopic": "Form Factors", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which portable personal computer form factor relies primarily on a capacitive touchscreen for input, lacks a permanently attached physical keyboard, and runs mobile operating systems like iPadOS or Android?", "options": {"A": "Tower Workstation", "B": "Tablet Computer", "C": "Rack-Mount Server", "D": "Mainframe Terminal"}, "correctAnswer": "B", "explanation": "Tablet computers integrate a flat touchscreen display, battery, and mobile SoC into a single slate chassis without a permanent physical hinge keyboard.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C14", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Parallel Computing", "subtopic": "SIMD Applications", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Modern Graphics Processing Units (GPUs) apply the exact same shader or matrix instruction simultaneously across thousands of pixel or tensor data elements. In Flynn's taxonomy, this is an example of:", "options": {"A": "SISD", "B": "SIMD (Single Instruction, Multiple Data)", "C": "MISD", "D": "Serial Processing"}, "correctAnswer": "B", "explanation": "Applying a single instruction simultaneously to an array of multiple data points (such as brightening 2 million pixels or vector addition) is the definition of SIMD.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-C15", "moduleCode": "C", "module": "C. Classification of Computers", "topic": "Purpose", "subtopic": "General vs Special Purpose", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Why is a desktop computer running Windows or Linux classified as a 'General-Purpose Computer'?", "options": {"A": "Because it is free of cost", "B": "Because it can store and execute diverse programs (word processing, accounting, coding, media editing) simply by loading different software into RAM", "C": "Because it can only solve one fixed differential equation", "D": "Because it has no operating system"}, "correctAnswer": "B", "explanation": "General-purpose computers follow the universal Turing/stored-program model, allowing them to perform virtually any information-processing task by switching software.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D01", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "System Bus & Memory", "subtopic": "DMA Controller", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "______ is used to transfer data directly between an I/O device and Main Memory (RAM) without continuous intervention of the CPU.", "options": {"A": "Program Counter", "B": "DMA Controller (Direct Memory Access)", "C": "Arithmetic Logic Unit", "D": "Accumulator"}, "correctAnswer": "B", "explanation": "A DMA (Direct Memory Access) Controller takes over the system buses temporarily to transfer large blocks of data directly between high-speed I/O devices (like disk drives) and Main Memory without routing every byte through the CPU.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2021 Official Paper"}, {"id": "CF-D02", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Registers", "subtopic": "Program Counter", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "In a microprocessor's Central Processing Unit (CPU), the contents of the Program Counter (PC) register always indicate:", "options": {"A": "The time elapsed since program execution began", "B": "The total number of programs currently stored on the hard disk", "C": "The memory address of the NEXT instruction to be fetched and executed", "D": "The final arithmetic result of the previous ALU operation"}, "correctAnswer": "C", "explanation": "The Program Counter (PC), also called the Instruction Pointer (IP) in x86, holds the memory address of the NEXT instruction to be fetched from main memory.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS 2018 Official Paper"}, {"id": "CF-D03", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Registers", "subtopic": "Instruction Register", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "While the Program Counter (PC) holds the address of the next instruction, which CPU register holds the actual machine instruction that is CURRENTLY being decoded and executed by the Control Unit?", "options": {"A": "Memory Address Register (MAR)", "B": "Instruction Register (IR)", "C": "Stack Pointer (SP)", "D": "Status Flag Register"}, "correctAnswer": "B", "explanation": "Once an instruction word is fetched from memory into the MBR/MDR, it is transferred to the Instruction Register (IR), where the Control Unit decodes its opcode and addressing mode.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-D04", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "System Bus", "subtopic": "Unidirectional vs Bidirectional", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "Which of the following statements correctly describes the directionality of the Address Bus and the Data Bus in a microprocessor system?", "options": {"A": "Both Address Bus and Data Bus are unidirectional", "B": "The Address Bus is unidirectional (CPU to Memory/IO), whereas the Data Bus is bidirectional", "C": "The Address Bus is bidirectional, whereas the Data Bus is unidirectional", "D": "Both Address Bus and Data Bus carry only clock signals"}, "correctAnswer": "B", "explanation": "The CPU places target addresses onto the Address Bus (Unidirectional: CPU -> Memory/IO), while data travels both ways (Read and Write) across the Data Bus (Bidirectional).", "exam": "DSSSB PGT Computer Science", "year": 2021, "shift": "July 2021", "sourceReference": "DSSSB PGT CS Official Paper"}, {"id": "CF-D05", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Instruction Cycle", "subtopic": "Fetch-Decode-Execute", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Exam-pattern Question", "question": "During the Fetch phase of the CPU Instruction Cycle, what is the exact sequence of register micro-operations to bring an instruction from Main Memory into the Instruction Register?", "options": {"A": "PC -> MAR, then Memory[MAR] -> MBR (and PC = PC + 1), then MBR -> IR", "B": "IR -> MAR, then MBR -> PC, then Memory -> ALU", "C": "MAR -> PC, then ALU -> IR, then MBR -> Memory", "D": "AC -> MBR, then MBR -> MAR, then MAR -> PC"}, "correctAnswer": "A", "explanation": "Step 1: Address in PC is copied to MAR (`MAR <- PC`). Step 2: Memory word at MAR is read into MBR (`MBR <- M[MAR]`) while PC increments (`PC <- PC + 1`). Step 3: Instruction is loaded into IR (`IR <- MBR`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D06", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Ports and Connectors", "subtopic": "HDMI Port", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Verified PYQ", "question": "Which of the following ports on a PC or laptop is most suitable for transmitting uncompressed, high-definition digital video AND multi-channel digital audio simultaneously over a single cable to an external monitor or projector?", "options": {"A": "VGA (15-pin D-Sub) Port", "B": "HDMI (High-Definition Multimedia Interface) Port", "C": "PS/2 Port", "D": "RJ-45 Ethernet Port"}, "correctAnswer": "B", "explanation": "HDMI (High-Definition Multimedia Interface) carries both high-definition digital video and multi-channel audio over a single cable. VGA (Option A) carries analog video only (no audio).", "exam": "NVS TGT / PGT ICT", "year": 2024, "shift": "Shift 1", "sourceReference": "Testbook NVS/KVS Official PYQ"}, {"id": "CF-D07", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Booting Process", "subtopic": "POST", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "Immediately when a computer is switched on, the BIOS/UEFI firmware runs an automated diagnostic routine to verify that RAM, keyboard, display adapter, and storage controllers are functioning properly. What is this routine called?", "options": {"A": "Defragmentation", "B": "POST (Power-On Self-Test)", "C": "Spooling", "D": "Paging"}, "correctAnswer": "B", "explanation": "POST stands for Power-On Self-Test. If a critical hardware fault (such as missing RAM) is detected during POST, the motherboard emits diagnostic beep codes.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-D08", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "BIOS and CMOS", "subtopic": "CMOS Battery Failure", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "If a desktop computer constantly resets its system Date and Time back to a default past year every time it is unplugged from wall power, which motherboard component has most likely failed?", "options": {"A": "The SMPS 12V cooling fan", "B": "The CR2032 Lithium Coin Battery powering the volatile CMOS RAM and Real-Time Clock", "C": "The CPU L1 Cache SRAM", "D": "The SATA data cable connected to the SSD"}, "correctAnswer": "B", "explanation": "The CMOS RAM chip and Real-Time Clock (RTC) keep running when the PC is turned off by drawing micro-amps from a 3V CR2032 lithium coin battery on the motherboard. When this battery dies, date/time and custom BIOS settings reset.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D09", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "BIOS vs UEFI", "subtopic": "Modern Firmware", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "Modern motherboards have replaced legacy 16-bit BIOS with UEFI (Unified Extensible Firmware Interface). Which of the following is a major advantage of UEFI with GPT (GUID Partition Table) over legacy BIOS with MBR?", "options": {"A": "UEFI supports bootable disks larger than 2 TB, up to 128 primary partitions, and 'Secure Boot' against bootkit malware", "B": "UEFI limits hard disk size to 512 MB", "C": "UEFI requires punched cards to boot the operating system", "D": "UEFI operates only in 8-bit mode without mouse support"}, "correctAnswer": "A", "explanation": "Legacy BIOS + MBR is limited to 2 TB max disk size and 4 primary partitions. UEFI + GPT supports disks >9.4 Zettabytes, up to 128 primary partitions on Windows, GUI/mouse navigation, and cryptographic Secure Boot.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D10", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Power Supply", "subtopic": "SMPS Function", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What is the primary function of the SMPS (Switched-Mode Power Supply) unit mounted inside a desktop computer cabinet?", "options": {"A": "To convert low-voltage DC battery power into 230V AC power during a blackout", "B": "To convert external 230V/110V AC mains power into regulated low-voltage DC power (+3.3V, +5V, +12V) required by internal computer components", "C": "To cool the microprocessor using liquid nitrogen", "D": "To amplify Wi-Fi signals for the network card"}, "correctAnswer": "B", "explanation": "SMPS converts high-voltage Alternating Current (AC) from the wall outlet into tightly regulated Direct Current (DC) voltages (+3.3V, +5V, +12V) for the motherboard, CPU, and drives. (An inverter/UPS converts DC battery to AC during a power cut.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D11", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Booting Process", "subtopic": "Cold vs Warm Boot", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Restarting a computer that is already powered on by pressing `Ctrl + Alt + Del` or clicking 'Restart' in the Operating System (without turning off the physical power switch) is known as:", "options": {"A": "Cold Booting (Hard Boot)", "B": "Warm Booting (Soft Boot)", "C": "Hibernation", "D": "Thrashing"}, "correctAnswer": "B", "explanation": "Warm Booting (Soft Boot) restarts a running system without cutting power to hardware, often skipping full power-up hardware initialization. Cold Booting starts the machine from a completely powered-off state.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D12", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Registers", "subtopic": "MAR and MBR", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match each CPU register with its exact hardware role:\n1. MAR (Memory Address Register) — (p) Holds status bits like Zero, Carry, Sign, Overflow\n2. MBR / MDR (Memory Buffer Register) — (q) Holds the address of the memory location to be read/written\n3. Accumulator (AC) — (r) Holds the data word just read from or waiting to be written to memory\n4. Flag / PSW Register — (s) Holds intermediate operands and results of ALU operations", "options": {"A": "1-q, 2-r, 3-s, 4-p", "B": "1-r, 2-q, 3-s, 4-p", "C": "1-q, 2-s, 3-r, 4-p", "D": "1-p, 2-r, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "MAR connects to the Address Bus (q); MBR/MDR connects to the Data Bus (r); Accumulator is the ALU working register (s); Flag/Program Status Word (PSW) holds condition flags (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D13", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Motherboard", "subtopic": "Expansion Slots", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which high-speed serial expansion slot standard on modern motherboards (available in x1, x4, x8, and x16 lane configurations) is used to connect dedicated Graphics Cards (GPUs) and M.2 NVMe SSDs?", "options": {"A": "ISA (Industry Standard Architecture)", "B": "PCIe (Peripheral Component Interconnect Express)", "C": "AGP (Accelerated Graphics Port)", "D": "Centronics Parallel Port"}, "correctAnswer": "B", "explanation": "PCIe (PCI Express) is the high-speed point-to-point serial expansion bus on modern motherboards. Graphics cards typically use a PCIe x16 slot, and NVMe SSDs typically use 4 PCIe lanes (x4).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D14", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Ports and Connectors", "subtopic": "Port Identification", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the hardware port/connector with its standard usage:\n1. RJ-45 (8-pin) — (p) Legacy 6-pin circular keyboard/mouse port\n2. RJ-11 (4/6-pin) — (q) Twisted-pair Ethernet LAN cable connector\n3. PS/2 Mini-DIN — (r) Telephone landline / DSL modem line\n4. SATA — (s) Internal connection for Hard Disks and Optical Drives", "options": {"A": "1-q, 2-r, 3-p, 4-s", "B": "1-r, 2-q, 3-p, 4-s", "C": "1-q, 2-p, 3-r, 4-s", "D": "1-s, 2-r, 3-p, 4-q"}, "correctAnswer": "A", "explanation": "RJ-45 is the 8-pin Ethernet LAN connector (q); RJ-11 is the 4/6-pin telephone line connector (r); PS/2 is the legacy 6-pin keyboard (purple) / mouse (green) port (p); SATA connects internal storage drives (s).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D15", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Clock", "subtopic": "Clock Speed Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "If a microprocessor has a clock frequency of 2.5 GHz, what is the duration (clock cycle time $T = 1/f$) of a single clock pulse?", "options": {"A": "0.4 nanoseconds (400 picoseconds)", "B": "2.5 nanoseconds", "C": "4 milliseconds", "D": "0.25 microseconds"}, "correctAnswer": "A", "explanation": "Clock period $T = 1 / f = 1 / (2.5 \\times 10^9\\text{ Hz}) = 0.4 \\times 10^{-9}\\text{ seconds} = 0.4\\text{ nanoseconds} = 400\\text{ picoseconds}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D16", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "System Bus", "subtopic": "Max Addressable Memory", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "A microprocessor has a 24-bit unidirectional Address Bus and a 16-bit bidirectional Data Bus. If the memory is byte-addressable, what is the maximum primary memory capacity this CPU can directly address?", "options": {"A": "16 MB", "B": "24 MB", "C": "64 KB", "D": "4 GB"}, "correctAnswer": "A", "explanation": "With a 24-bit address bus on a byte-addressable system, maximum addressable locations $= 2^{24}\\text{ Bytes} = 2^4 \\times 2^{20}\\text{ Bytes} = 16\\text{ MB}$. (Note: A 32-bit address bus addresses $2^{32}\\text{ B} = 4\\text{ GB}$.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D17", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Peripherals", "subtopic": "NIC Card", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which hardware expansion card or onboard controller provides a computer with a unique 48-bit physical MAC address and allows it to connect to an Ethernet or Wi-Fi network?", "options": {"A": "Sound Blaster Card", "B": "NIC (Network Interface Card / Controller)", "C": "Video Capture Card", "D": "CMOS Chip"}, "correctAnswer": "B", "explanation": "A Network Interface Card (NIC) implements OSI Layer 1 and Layer 2 functionality and carries a factory-assigned 48-bit MAC (Media Access Control) address.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D18", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Motherboard", "subtopic": "Northbridge and Southbridge", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In traditional motherboard chipset architectures, why were RAM and the high-speed Graphics slot connected to the Northbridge rather than the Southbridge?", "options": {"A": "Because Northbridge sat directly adjacent to the CPU via the Front Side Bus (FSB) to handle ultra-high-bandwidth memory and video transfers, while Southbridge handled slower I/O (USB, SATA, Audio, BIOS)", "B": "Because Southbridge could only process analog audio", "C": "Because Northbridge was powered by the CMOS coin battery", "D": "Because Southbridge had no copper traces"}, "correctAnswer": "A", "explanation": "The Northbridge (Memory Controller Hub, now integrated directly inside modern CPUs) handled high-speed CPU-to-RAM and CPU-to-PCIe GPU traffic, while the Southbridge (I/O Controller Hub) managed slower peripherals.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D19", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Ports and Connectors", "subtopic": "USB Standard", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which of the following statements about USB (Universal Serial Bus) is TRUE?", "options": {"A": "It is a parallel port that requires rebooting the PC every time a device is plugged in", "B": "It is a plug-and-play, hot-swappable serial interface that can daisy-chain up to 127 devices on a single host controller", "C": "It cannot supply DC electrical power to connected peripherals", "D": "Type-C USB connectors can only be plugged in one orientation"}, "correctAnswer": "B", "explanation": "USB is a hot-swappable, plug-and-play serial bus supporting up to 127 devices (using 7-bit addressing: $2^7 - 1 = 127$) and carries both data and DC power. USB Type-C is fully reversible.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D20", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "Power Supply", "subtopic": "UPS Role", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which external hardware device contains a rechargeable battery and inverter to provide immediate backup power and surge protection when mains electricity fails, preventing unsaved data in volatile RAM from being lost?", "options": {"A": "SMPS", "B": "UPS (Uninterruptible Power Supply)", "C": "Step-down Transformer", "D": "Voltage Divider"}, "correctAnswer": "B", "explanation": "An Uninterruptible Power Supply (UPS) provides instantaneous battery backup power when AC mains fail, giving the user time to save files in RAM and shut down the OS cleanly.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E01", "moduleCode": "E", "module": "E. Input Devices", "topic": "Keyboard", "subtopic": "Toggle vs Modifier Keys", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Verified PYQ", "question": "Which of the following groups contains ONLY 'Toggle Keys' on a standard computer keyboard?", "options": {"A": "Shift, Ctrl, Alt", "B": "Caps Lock, Num Lock, Scroll Lock", "C": "F1, F5, F12", "D": "Tab, Enter, Backspace"}, "correctAnswer": "B", "explanation": "Toggle keys switch a feature between two states (ON and OFF) each time they are pressed: Caps Lock, Num Lock, Scroll Lock, and Insert. Shift, Ctrl, and Alt (Option A) are Modifier/Combination keys.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 3", "sourceReference": "DSSSB TGT CS 2021 Official Paper"}, {"id": "CF-E02", "moduleCode": "E", "module": "E. Input Devices", "topic": "Direct Data Entry", "subtopic": "MICR Cheque Code", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "A 9-digit MICR (Magnetic Ink Character Recognition) code printed at the bottom of an Indian bank cheque uses iron-oxide ink. What do the middle three digits (digits 4, 5, and 6) of this 9-digit MICR code represent?", "options": {"A": "City Code", "B": "Bank Code", "C": "Branch Code", "D": "Account Holder's Age"}, "correctAnswer": "B", "explanation": "In the 9-digit Indian MICR code: First 3 digits = City Code (aligned with PIN prefix); Middle 3 digits = Bank Code; Last 3 digits = Bank Branch Code.", "exam": "KVS TGT / PGT Computer Literacy", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS Official Paper"}, {"id": "CF-E03", "moduleCode": "E", "module": "E. Input Devices", "topic": "Direct Data Entry", "subtopic": "OMR vs OCR vs MICR", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "Which optical input device is specifically used by examination boards to automatically evaluate objective multiple-choice answer sheets where candidates shade dark pencil/pen bubbles?", "options": {"A": "MICR (Magnetic Ink Character Reader)", "B": "OMR (Optical Mark Recognition / Reader)", "C": "OCR (Optical Character Recognition)", "D": "Plotter"}, "correctAnswer": "B", "explanation": "OMR (Optical Mark Recognition) detects the presence or absence of dark marks in predefined bubble positions by measuring reflected light intensity.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-E04", "moduleCode": "E", "module": "E. Input Devices", "topic": "Direct Data Entry", "subtopic": "OCR Technology", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "If you scan a printed page from a textbook and want to convert the scanned image of text into an editable MS Word document so you can edit the words, which technology is required?", "options": {"A": "OMR", "B": "OCR (Optical Character Recognition)", "C": "MICR", "D": "Barcode Reader"}, "correctAnswer": "B", "explanation": "OCR (Optical Character Recognition) analyzes the shapes of scanned printed or handwritten characters and translates them into editable ASCII/Unicode text codes.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E05", "moduleCode": "E", "module": "E. Input Devices", "topic": "Pointing Devices", "subtopic": "Trackball vs Mouse", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Which pointing input device functions like an 'upside-down mechanical mouse' where the base housing remains completely stationary on the desk while the user rotates an exposed ball with their thumb or fingers?", "options": {"A": "Joystick", "B": "Trackball", "C": "Light Pen", "D": "Optical Scanner"}, "correctAnswer": "B", "explanation": "A Trackball keeps its body stationary while the user rolls a socketed ball directly, making it ideal for compact workspaces, air-traffic consoles, and CAD workstations.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E06", "moduleCode": "E", "module": "E. Input Devices", "topic": "Pointing Devices", "subtopic": "Mouse Actions in Word", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Exam-pattern Question", "question": "When using a computer mouse inside an MS Word document, double-clicking the left mouse button on a word selects that single word. What happens if you rapidly TRIPLE-CLICK the left mouse button on a word?", "options": {"A": "It deletes the word", "B": "It selects the entire paragraph containing that word", "C": "It closes MS Word", "D": "It opens the Print dialog box"}, "correctAnswer": "B", "explanation": "In MS Word: Double-click selects a word; Triple-click inside text selects the entire paragraph; Ctrl + Single-click selects a single sentence.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E07", "moduleCode": "E", "module": "E. Input Devices", "topic": "Wireless Identification", "subtopic": "RFID vs Barcode", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Why are RFID (Radio Frequency Identification) tags used in highway electronic toll collection (FASTag) instead of standard optical Barcodes?", "options": {"A": "RFID tags are painted with magnetic iron-oxide ink", "B": "RFID uses electromagnetic radio waves that can be read rapidly from a distance WITHOUT requiring direct optical line-of-sight", "C": "Barcodes can store 10 GB of video data whereas RFID cannot", "D": "RFID requires the car to stop and insert a smart card into a slot"}, "correctAnswer": "B", "explanation": "Unlike optical Barcodes and QR codes, RFID readers communicate via radio waves, reading tags through windshields at highway speeds without needing line-of-sight alignment.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E08", "moduleCode": "E", "module": "E. Input Devices", "topic": "Pointing Devices", "subtopic": "Graphics Tablet / Digitizer", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which input device consists of a flat pressure-sensitive pad and a pen-like Stylus used by digital illustrators, animators, and architects to draw freehand vector sketches into a computer?", "options": {"A": "Graphics Tablet (Digitizer)", "B": "Drum Plotter", "C": "Daisy Wheel", "D": "OMR Scanner"}, "correctAnswer": "A", "explanation": "A Graphics Tablet (or Digitizer) captures the precise X-Y coordinates and pressure/tilt levels of a stylus to convert hand-drawn strokes into digital art.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E09", "moduleCode": "E", "module": "E. Input Devices", "topic": "Optical Scanners", "subtopic": "QR Code", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What does 'QR' stand for in a 2D QR Code commonly scanned for UPI payments and URLs?", "options": {"A": "Quantum Reader", "B": "Quick Response", "C": "Quad Resolution", "D": "Query Register"}, "correctAnswer": "B", "explanation": "Invented in 1994 by Masahiro Hara at Denso Wave (Japan), QR stands for 'Quick Response' Code—a two-dimensional matrix barcode with three corner finder patterns.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E10", "moduleCode": "E", "module": "E. Input Devices", "topic": "Keyboard", "subtopic": "Modifier Keys", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Keys such as `Shift`, `Ctrl`, and `Alt` normally perform no action when pressed by themselves, but alter the function of other keys when held down together. What are these keys called?", "options": {"A": "Toggle Keys", "B": "Modifier (or Combination) Keys", "C": "Navigation Keys", "D": "Function Keys"}, "correctAnswer": "B", "explanation": "Shift, Ctrl, and Alt are called Modifier (or Combination) keys because they modify the input code of another key pressed simultaneously.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E11", "moduleCode": "E", "module": "E. Input Devices", "topic": "Audio Input", "subtopic": "Microphone & ADC", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "When a user speaks into a Microphone connected to a computer's sound card, how are the acoustic sound waves processed so the CPU can store them?", "options": {"A": "The sound card's DAC converts digital bits into analog sound", "B": "The microphone converts acoustic pressure waves into analog electrical signals, which the sound card's ADC (Analog-to-Digital Converter) samples and quantizes into binary data", "C": "The OCR engine converts voice directly into magnetic ink", "D": "The ALU amplifies the analog voltage without binary conversion"}, "correctAnswer": "B", "explanation": "A microphone is an acoustic-to-electric transducer (analog signal); the sound card's ADC (Analog-to-Digital Converter) samples the analog waveform (e.g., at 44.1 kHz) into digital binary numbers.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E12", "moduleCode": "E", "module": "E. Input Devices", "topic": "Pointing Devices", "subtopic": "Light Pen & Joystick", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the following input devices with their primary domain of application:\n1. Joystick — (p) Reading bank cheques\n2. Light Pen — (q) Flight simulators and gaming control\n3. MICR Reader — (r) Pointing/selecting directly on a CRT screen via photocell\n4. Biometric Iris Scanner — (s) High-security Aadhaar identity authentication", "options": {"A": "1-q, 2-r, 3-p, 4-s", "B": "1-r, 2-q, 3-p, 4-s", "C": "1-q, 2-p, 3-r, 4-s", "D": "1-s, 2-r, 3-p, 4-q"}, "correctAnswer": "A", "explanation": "Joystick = flight simulators/gaming (q); Light Pen = photosensitive wand used on CRT screens (r); MICR = bank cheques (p); Iris Scanner = biometric authentication (s).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E13", "moduleCode": "E", "module": "E. Input Devices", "topic": "Dual I/O Devices", "subtopic": "Touchscreen", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "Which of the following peripheral devices serves simultaneously as BOTH an Input Device and an Output Device?", "options": {"A": "Optical Mouse", "B": "Capacitive Touchscreen Display", "C": "Flatbed Scanner", "D": "Laser Printer"}, "correctAnswer": "B", "explanation": "A Touchscreen combines a visual display panel (Output) with a touch-sensitive capacitive/resistive layer (Input), making it a combined Input/Output (I/O) device. (Modems, Network cards, and Headsets with mic are also I/O devices.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E14", "moduleCode": "E", "module": "E. Input Devices", "topic": "Pioneers", "subtopic": "Mouse Inventor", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Who invented the computer Mouse in the early 1960s at the Stanford Research Institute (originally crafted with a wooden shell and two perpendicular metal wheels)?", "options": {"A": "Douglas Engelbart", "B": "Christopher Latham Sholes", "C": "Tim Berners-Lee", "D": "Seymour Cray"}, "correctAnswer": "A", "explanation": "Douglas Engelbart invented the computer mouse (assisted by Bill English) in 1963–64 and demonstrated it in 'The Mother of All Demos' in 1968. Christopher Latham Sholes (Option B) invented the QWERTY keyboard layout.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-E15", "moduleCode": "E", "module": "E. Input Devices", "topic": "Biometric Devices", "subtopic": "Physiological vs Behavioral", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Biometric input sensors authenticate users based on unique human traits. Which of the following is a 'Behavioral' biometric trait rather than a static 'Physiological' trait?", "options": {"A": "Fingerprint ridge pattern", "B": "Keystroke dynamics (typing rhythm) and Gait/Signature dynamics", "C": "Iris pattern", "D": "Facial geometry"}, "correctAnswer": "B", "explanation": "Fingerprint, Iris, Retina, DNA, and Facial geometry are Physiological biometrics; Keystroke dynamics, Voice cadence, Signature pressure/speed, and Walking gait are Behavioral biometrics.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F01", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Impact vs Non-Impact", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Verified PYQ", "question": "Which of the following printers is an example of a 'Non-Impact Printer'?", "options": {"A": "Dot Matrix Printer", "B": "Daisy Wheel Printer", "C": "Laser Printer", "D": "Drum Line Printer"}, "correctAnswer": "C", "explanation": "Laser, Inkjet, and Thermal printers are Non-Impact printers because they form images without physically striking an ink ribbon against paper. Dot Matrix, Daisy Wheel, Drum, and Chain printers are Impact printers.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-F02", "moduleCode": "F", "module": "F. Output Devices", "topic": "Display Metrics", "subtopic": "Dot Pitch", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "On a computer monitor, what is 'Dot Pitch' (or Pixel Pitch), and how does it affect display image quality?", "options": {"A": "The number of frames redrawn per second; higher dot pitch reduces flicker", "B": "The diagonal distance in millimeters between two like-colored phosphor dots/pixels; a SMALLER dot pitch produces a sharper, clearer image", "C": "The ratio of screen width to screen height; a larger dot pitch means widescreen", "D": "The power consumed in watts per hour"}, "correctAnswer": "B", "explanation": "Dot pitch measures the distance in millimeters (e.g., 0.24 mm) between adjacent pixels of the same color. Closer pixels (smaller dot pitch) reduce visible grain and yield a sharper image.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-F03", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Laser Printer Mechanism", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Which of the following correctly describes the consumable material and bonding process used inside a Laser Printer?", "options": {"A": "Liquid vegetable dye sprayed through heated nozzles", "B": "Dry electrostatically charged powder called TONER attracted to a photosensitive drum and permanently melted onto paper by heated Fuser rollers", "C": "A 24-pin print head striking a fabric ink ribbon", "D": "Wax-coated thermochromic paper turning black under a heated pin"}, "correctAnswer": "B", "explanation": "Laser printers are Non-Impact Page Printers that use a laser beam, a photoreceptor drum, dry powdered Toner, and a heated Fuser unit.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F04", "moduleCode": "F", "module": "F. Output Devices", "topic": "Plotters", "subtopic": "Vector CAD Output", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "Which specialized hardcopy output device uses robotic pens or wide-format heads to draw continuous, high-precision vector lines for architectural blueprints, circuit board layouts, and GIS maps?", "options": {"A": "Daisy Wheel Printer", "B": "Plotter (Drum or Flatbed Plotter)", "C": "Thermal POS Printer", "D": "Braille Embosser"}, "correctAnswer": "B", "explanation": "Plotters (Drum and Flatbed) are specialized vector graphics output devices used in CAD/CAM, civil engineering, and architecture to print large continuous blueprints.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-F05", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Printer Speed Units", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match each type of printer with its standard unit of printing speed:\n1. Character Printer (Dot Matrix / Daisy Wheel) — (p) LPM (Lines Per Minute)\n2. Line Printer (Chain / Drum Printer) — (q) PPM (Pages Per Minute)\n3. Page Printer (Laser Printer) — (r) CPS (Characters Per Second)\n4. Printer Spatial Resolution — (s) DPI (Dots Per Inch)", "options": {"A": "1-r, 2-p, 3-q, 4-s", "B": "1-p, 2-r, 3-q, 4-s", "C": "1-r, 2-q, 3-p, 4-s", "D": "1-q, 2-p, 3-r, 4-s"}, "correctAnswer": "A", "explanation": "Character printers are measured in CPS (r); Line printers in LPM (p); Page printers in PPM (q); and print resolution in DPI (s).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F06", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Carbon Copies & Daisy Wheel", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Original Practice Question", "question": "Which of the following statements about Impact Printers (such as Daisy Wheel and Dot Matrix printers) is TRUE?", "options": {"A": "Daisy Wheel printers can print high-resolution color photographs", "B": "Impact printers are the ONLY class of printers capable of printing multi-part carbon copies in a single pass, because their pins/petals physically strike the paper", "C": "Dot Matrix printers use dry toner powder and a fuser drum", "D": "Impact printers are completely silent during operation"}, "correctAnswer": "B", "explanation": "Because Impact printers physically strike the ribbon and paper, the mechanical pressure transfers impressions through carbon-interleaved multi-part stationery (e.g., railway tickets and bank receipts). Daisy wheel printers cannot print graphics at all.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F07", "moduleCode": "F", "module": "F. Output Devices", "topic": "Monitors", "subtopic": "OLED vs LCD/LED", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Why can an OLED (Organic Light-Emitting Diode) display achieve 'true black' levels and a much higher contrast ratio than a conventional LCD or LED-backlit monitor?", "options": {"A": "Because OLED uses a 500-watt halogen bulb behind the screen", "B": "Because each individual pixel in an OLED panel is self-emissive (requires no backlight) and turns completely OFF when displaying black", "C": "Because OLED uses a cathode ray vacuum tube", "D": "Because OLED has a lower resolution than CRT"}, "correctAnswer": "B", "explanation": "LCD and LED-backlit monitors rely on a backlight that always leaks slightly through liquid crystals, whereas OLED pixels generate their own light and switch to zero current for pure black.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F08", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "CMYK Color Model", "difficulty": "Easy", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "Color Inkjet and Laser printers use the subtractive CMYK ink/toner model. What do the four letters in 'CMYK' stand for?", "options": {"A": "Cyan, Magenta, Yellow, Key (Black)", "B": "Cobalt, Maroon, Yellow, Krypton", "C": "Cyan, Mauve, Yellow, Potassium", "D": "Crimson, Magenta, Yellow, Khaki"}, "correctAnswer": "A", "explanation": "CMYK stands for Cyan, Magenta, Yellow, and Key (Black—used because mixing C+M+Y inks yields a muddy dark brown rather than crisp black text, and 'B' was avoided so as not to confuse with Blue).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F09", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Thermal Printer", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "Which non-impact printer requires NO ink ribbon, ink cartridge, or toner powder, and instead selectively heats chemically treated thermochromic paper—making it the standard choice for ATM receipts and Point-of-Sale (POS) billing machines?", "options": {"A": "Daisy Wheel Printer", "B": "Direct Thermal Printer", "C": "Chain Printer", "D": "Inkjet Printer"}, "correctAnswer": "B", "explanation": "Direct Thermal Printers use a heated thermal printhead that darkens heat-sensitive (thermochromic) paper where contact occurs—ideal for fast, quiet ATM and credit-card POS receipts.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F10", "moduleCode": "F", "module": "F. Output Devices", "topic": "Display Metrics", "subtopic": "Resolution & Aspect Ratio", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Original Practice Question", "question": "A standard Full HD (1080p) computer monitor has a resolution of $1920 \\times 1080$ pixels. What is its simplified Aspect Ratio, and roughly how many total pixels (Megapixels) does the screen contain?", "options": {"A": "16:9 aspect ratio; ~2.07 Megapixels (2,073,600 pixels)", "B": "4:3 aspect ratio; ~1.02 Megapixels", "C": "21:9 aspect ratio; ~8.29 Megapixels", "D": "1:1 aspect ratio; ~500,000 pixels"}, "correctAnswer": "A", "explanation": "$1920 / 120 = 16$ and $1080 / 120 = 9$, so the aspect ratio is 16:9. Total pixels $= 1920 \\times 1080 = 2,073,600 \\approx 2.07\\text{ Megapixels}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F11", "moduleCode": "F", "module": "F. Output Devices", "topic": "Display Metrics", "subtopic": "Refresh Rate", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "The number of times per second that a display monitor redraws the entire screen image from top to bottom is called its Refresh Rate. In which unit is Refresh Rate measured?", "options": {"A": "Dots Per Inch (DPI)", "B": "Hertz (Hz)", "C": "Lumens", "D": "Decibels (dB)"}, "correctAnswer": "B", "explanation": "Refresh rate is measured in Hertz (Hz), where 60 Hz means the display refreshes 60 frames per second (144 Hz = 144 times per second). Projector brightness is measured in ANSI Lumens.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F12", "moduleCode": "F", "module": "F. Output Devices", "topic": "Accessibility Output", "subtopic": "Braille Embosser & Refreshable Braille", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which specialized output device assists visually impaired users by raising mechanical pins through a flat surface or punching tactile raised dot patterns onto heavy paper?", "options": {"A": "Optical Mark Reader", "B": "Refreshable Braille Display / Braille Embosser", "C": "Light Pen", "D": "Digitizer Tablet"}, "correctAnswer": "B", "explanation": "A Refreshable Braille Display (electro-mechanical tactile pins) and a Braille Embosser (impact tactile printer) provide accessible output for visually impaired users.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F13", "moduleCode": "F", "module": "F. Output Devices", "topic": "Soft vs Hard Copy", "subtopic": "Classification", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which of the following pairs produces ONLY 'Soft Copy' output?", "options": {"A": "Laser Printer and Flatbed Plotter", "B": "LED Monitor and Multimedia Audio Speaker", "C": "Dot Matrix Printer and Microfiche", "D": "Thermal Printer and Inkjet Printer"}, "correctAnswer": "B", "explanation": "Monitors, Projectors, and Speakers produce intangible/transient Soft Copy output, whereas Printers and Plotters produce permanent physical Hard Copy output.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F14", "moduleCode": "F", "module": "F. Output Devices", "topic": "Printers", "subtopic": "Line Printers", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Drum Printers, Chain Printers, and Band Printers belong to which high-speed category of impact printers used in legacy mainframe data centers?", "options": {"A": "Character Printers", "B": "Line Printers (printing an entire line of text at a time, measured in LPM)", "C": "Non-Impact Page Printers", "D": "3D Extrusion Printers"}, "correctAnswer": "B", "explanation": "Drum, Chain, and Band printers are high-speed Impact Line Printers whose speeds are measured in LPM (Lines Per Minute).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-F15", "moduleCode": "F", "module": "F. Output Devices", "topic": "Audio Output", "subtopic": "Sound Card DAC", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "To play a digital `.mp3` or `.wav` music file through analog headphones or speakers, which circuit on the computer's audio interface converts binary audio samples into continuous electrical audio signals?", "options": {"A": "ADC (Analog-to-Digital Converter)", "B": "DAC (Digital-to-Analog Converter)", "C": "Modulator", "D": "BIOS POST"}, "correctAnswer": "B", "explanation": "A DAC (Digital-to-Analog Converter) converts stored binary digital audio samples into continuous analog voltage waveforms that drive speaker cones.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G01", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Addressing", "subtopic": "Address & Data Lines", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Verified PYQ", "question": "How many address lines and input-output data lines are needed in a $2\\text{K} \\times 16$ memory unit?", "options": {"A": "10 address lines and 8 data lines", "B": "11 address lines and 16 data lines", "C": "12 address lines and 16 data lines", "D": "11 address lines and 8 data lines"}, "correctAnswer": "B", "explanation": "A $2\\text{K} \\times 16$ memory chip has $2\\text{K} = 2 \\times 1024 = 2^1 \\times 2^{10} = 2^{11} = 2048$ memory words, requiring $11$ address lines. Since each word holds $16$ bits, it requires $16$ input/output data lines.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-G02", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Primary Memory", "subtopic": "Virtual Memory Purpose", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Verified PYQ", "question": "What is the main purpose of 'Virtual Memory' in a modern computer operating system?", "options": {"A": "To permanently replace the CPU's Arithmetic Logic Unit", "B": "To allow the system to execute programs larger than physical RAM by using a portion of secondary storage (disk swap/pagefile) as an extension of main memory", "C": "To make volatile SRAM non-volatile without a battery", "D": "To increase the physical screen resolution of the monitor"}, "correctAnswer": "B", "explanation": "Virtual Memory uses demand paging/swapping on secondary storage (HDD/SSD) to give running processes a logical address space larger than physical RAM.", "exam": "DSSSB TGT Computer Science", "year": 2025, "shift": "12 Sept 2025 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2025 Official Paper"}, {"id": "CF-G03", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Primary Memory", "subtopic": "Cache Memory SRAM", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "Which semiconductor memory technology is used to construct CPU Cache Memory (L1, L2, L3) because of its ultra-fast access time and because it does not require periodic refreshing?", "options": {"A": "DRAM (Dynamic RAM)", "B": "SRAM (Static RAM)", "C": "EPROM", "D": "Magnetic Core Memory"}, "correctAnswer": "B", "explanation": "SRAM uses 4–6 transistor flip-flop latches that do not require periodic refresh cycles, making it much faster than capacitor-based DRAM and ideal for CPU Cache.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-G04", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Hierarchy", "subtopic": "Speed Ordering", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Adapted PYQ", "question": "Arrange the following memory types in descending order of their access speed (from FASTEST to SLOWEST):\n1. Main Memory (DRAM)\n2. CPU Registers\n3. Hard Disk Drive (HDD)\n4. Cache Memory (SRAM)", "options": {"A": "2 -> 4 -> 1 -> 3", "B": "4 -> 2 -> 1 -> 3", "C": "2 -> 1 -> 4 -> 3", "D": "3 -> 1 -> 4 -> 2"}, "correctAnswer": "A", "explanation": "Fastest to slowest: CPU Registers (<1 ns) > Cache Memory (SRAM, 1–15 ns) > Main Memory (DRAM, 50–100 ns) > Secondary Storage (HDD, 5–10 ms). Thus 2 -> 4 -> 1 -> 3.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-G05", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "ROM Variants", "subtopic": "EPROM vs EEPROM", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "How are the contents of an EPROM (Erasable Programmable Read-Only Memory) chip erased so that it can be reprogrammed?", "options": {"A": "By applying a 5V electrical pulse to a single byte in-circuit", "B": "By exposing the chip's transparent quartz window to strong Ultraviolet (UV) light for 15–20 minutes", "C": "By immersing the chip in distilled water", "D": "By running the Windows Disk Cleanup utility"}, "correctAnswer": "B", "explanation": "EPROM chips have a fused-quartz window through which Ultraviolet (UV-C) light is shone to discharge floating gates, erasing the entire chip. EEPROM uses electrical pulses.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-G06", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Primary Memory", "subtopic": "DRAM Capacitor Refresh", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-patt
