ern Question", "question": "Why does Dynamic RAM (DRAM) require periodic refreshing thousands of times per second even while the computer is continuously connected to power?", "options": {"A": "Because DRAM stores each bit using six transistors that overheat", "B": "Because DRAM stores each bit as an electrical charge in a microscopic capacitor that naturally leaks charge over a few milliseconds", "C": "Because DRAM is a magnetic storage medium", "D": "Because DRAM is non-volatile ROM"}, "correctAnswer": "B", "explanation": "Each DRAM cell consists of 1 MOSFET transistor and 1 tiny capacitor. Because capacitors leak charge, a refresh circuit must read and rewrite every row every few milliseconds.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G07", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Units", "subtopic": "Binary Powers Conversion", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "How many Bits are present in 4 Gigabytes (4 GB) of memory according to standard binary computer convention ($1\\text{ KB} = 2^{10}\\text{ Bytes}$)?", "options": {"A": "2^32 bits", "B": "2^35 bits", "C": "2^30 bits", "D": "2^40 bits"}, "correctAnswer": "B", "explanation": "$4\\text{ GB} = 2^2 \\times 2^{30}\\text{ Bytes} = 2^{32}\\text{ Bytes}$. Since $1\\text{ Byte} = 8\\text{ bits} = 2^3\\text{ bits}$, total bits $= 2^{32} \\times 2^3 = 2^{35}\\text{ bits}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G08", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Units", "subtopic": "Unit Hierarchy", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Original Practice Question", "question": "Which of the following shows the correct ascending order of large storage units from Terabyte (TB) upward?", "options": {"A": "TB -> PB (Petabyte) -> EB (Exabyte) -> ZB (Zettabyte) -> YB (Yottabyte)", "B": "TB -> EB -> PB -> ZB -> YB", "C": "TB -> PB -> ZB -> EB -> YB", "D": "TB -> YB -> ZB -> EB -> PB"}, "correctAnswer": "A", "explanation": "Each step increases by $1024$ ($2^{10}$): Terabyte ($2^{40}$) < Petabyte ($2^{50}$) < Exabyte ($2^{60}$) < Zettabyte ($2^{70}$) < Yottabyte ($2^{80}$).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G09", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Optical Storage", "subtopic": "Blu-ray Laser & Capacity", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "Why is a Blu-ray Disc (BD) able to store 25 GB (single-layer) or 50 GB (dual-layer) on the exact same 12 cm physical disc diameter as a 700 MB CD or 4.7 GB DVD?", "options": {"A": "Blu-ray uses a shorter-wavelength 405 nm Blue-Violet laser, allowing much smaller pits and tighter track pitch than the 650 nm Red laser (DVD) or 780 nm Infrared laser (CD)", "B": "Blu-ray discs are 10 times thicker than CDs", "C": "Blu-ray uses magnetic iron-oxide coatings on both sides", "D": "Blu-ray stores data in analog waves"}, "correctAnswer": "A", "explanation": "CD uses a 780 nm infrared laser (700 MB); DVD uses a 650 nm red laser (4.7 GB); Blu-ray uses a 405 nm blue-violet laser, focusing a much smaller spot to pack 25 GB per layer.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G10", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Secondary Storage", "subtopic": "Hard Disk Geometry", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "On a magnetic Hard Disk Drive (HDD), platters are divided into concentric circles called ______, which are further subdivided into angular pie-shaped wedges called ______.", "options": {"A": "Sectors; Tracks", "B": "Tracks; Sectors", "C": "Cylinders; Clusters", "D": "Pages; Frames"}, "correctAnswer": "B", "explanation": "Concentric rings on a disk platter are called Tracks, and each track is divided into arc segments called Sectors (typically 512 bytes or 4 KB each).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G11", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Secondary Storage", "subtopic": "HDD Access Time", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In a magnetic Hard Disk Drive, the time taken by the mechanical read/write actuator arm to move radially and position the head over the target concentric Track is known as:", "options": {"A": "Rotational Latency", "B": "Seek Time", "C": "Transfer Time", "D": "Refresh Rate"}, "correctAnswer": "B", "explanation": "Seek Time is the time required to move the read/write head arm to the correct Track. Rotational Latency is the time waiting for the target Sector to spin under the head.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G12", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Cache Memory", "subtopic": "Hit Ratio Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "Suppose a CPU has an L1 Cache with an access time of $2\\text{ ns}$ and Main Memory (DRAM) with an access time of $50\\text{ ns}$. If the Cache Hit Ratio is $90\\%$ ($0.90$) and a cache miss requires accessing both cache and main memory ($2 + 50 = 52\\text{ ns}$), what is the Effective (Average) Memory Access Time ($T_{avg}$)?", "options": {"A": "7.0 ns", "B": "26.0 ns", "C": "5.0 ns", "D": "45.2 ns"}, "correctAnswer": "A", "explanation": "$T_{avg} = h \\times t_{cache} + (1 - h) \\times (t_{cache} + t_{mem}) = t_{cache} + (1 - h) \\times t_{mem} = 2 + 0.10 \\times 50 = 2 + 5 = 7.0\\text{ ns}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G13", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Cache Memory", "subtopic": "Locality of Reference", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Cache memory achieves high hit ratios (often >90%) because programs tend to reuse the same instructions/variables inside loops and access adjacent array elements sequentially. What is this foundational principle called?", "options": {"A": "Principle of Locality of Reference (Temporal and Spatial Locality)", "B": "GIGO Principle", "C": "Flynn's Principle", "D": "FIFO Replacement Anomaly"}, "correctAnswer": "A", "explanation": "Temporal Locality means recently accessed items are likely to be accessed again soon (loops/counters); Spatial Locality means items stored near recently accessed addresses are likely to be needed next (arrays/sequential instructions).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G14", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Virtual Memory", "subtopic": "Thrashing", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "When a computer's physical RAM is severely overcommitted and the Operating System spends almost all its time swapping pages back and forth between RAM and the hard disk rather than executing user instructions, this condition is called:", "options": {"A": "Spooling", "B": "Thrashing", "C": "Overclocking", "D": "Pipelining"}, "correctAnswer": "B", "explanation": "Thrashing occurs when high page-fault rates cause continuous disk paging I/O, collapsing CPU utilization.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G15", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Secondary Storage", "subtopic": "Sequential vs Direct Access", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Original Practice Question", "question": "Which of the following storage media is strictly a 'Sequential Access Storage Device' (SASD), requiring the drive to wind through all preceding records to reach a specific record in the middle?", "options": {"A": "Solid State Drive (SSD)", "B": "Magnetic Tape Cassette / Reel", "C": "Hard Disk Drive (HDD)", "D": "USB Flash Pen Drive"}, "correctAnswer": "B", "explanation": "Magnetic Tape is a sequential-access medium (like an audio cassette), whereas HDDs, SSDs, Optical Discs, and Flash drives allow Random / Direct Access.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G16", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Flash Memory", "subtopic": "Flash vs EEPROM", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Flash Memory (used in USB pen drives, SD cards, and SSDs) is a non-volatile semiconductor memory derived from which member of the ROM family, and how does it improve write speed?", "options": {"A": "Derived from MROM; requires factory laser etching", "B": "Derived from EEPROM; erases and writes data in multi-kilobyte blocks/pages rather than one byte at a time", "C": "Derived from EPROM; uses internal UV lamps", "D": "Derived from SRAM; requires a coin battery"}, "correctAnswer": "B", "explanation": "Flash memory is a block-erasable type of EEPROM (Electrically Erasable Programmable ROM). Erasing entire blocks at once makes it orders of magnitude faster and denser than byte-wise EEPROM.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G17", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Optical Storage", "subtopic": "WORM Media", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which optical disc format is classified as WORM ('Write Once, Read Many'), meaning data can be burned onto the disc once by a user and read indefinitely, but cannot be erased or rewritten?", "options": {"A": "CD-ROM", "B": "CD-R / DVD-R", "C": "CD-RW / DVD-RW", "D": "RAM Disk"}, "correctAnswer": "B", "explanation": "CD-R (Compact Disc Recordable) and DVD-R are WORM media. CD-ROM is factory-pressed read-only, while CD-RW (ReWritable) can be erased and rewritten multiple times.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G18", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Units", "subtopic": "Nibble and Byte", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "question": "How many Nibbles are there in 16 Bytes of computer memory?", "options": {"A": "8 Nibbles", "B": "16 Nibbles", "C": "32 Nibbles", "D": "64 Nibbles"}, "correctAnswer": "C", "explanation": "Since $1\\text{ Byte} = 8\\text{ bits}$ and $1\\text{ Nibble} = 4\\text{ bits}$, $1\\text{ Byte} = 2\\text{ Nibbles}$. Therefore, $16\\text{ Bytes} = 16 \\times 2 = 32\\text{ Nibbles}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G19", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Addressing", "subtopic": "Chip Count Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "How many $128 \\times 8$ RAM chips are required to construct a memory bank of capacity $2048\\text{ Bytes}$ ($2\\text{K} \\times 8$)?", "options": {"A": "8 chips", "B": "16 chips", "C": "32 chips", "D": "4 chips"}, "correctAnswer": "B", "explanation": "Target capacity $= 2048 \\times 8$ bits; single chip capacity $= 128 \\times 8$ bits. Number of chips $= (2048 \\times 8) / (128 \\times 8) = 2048 / 128 = 16$ chips.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G20", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Primary Memory", "subtopic": "Volatile vs Non-Volatile", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Original Practice Question", "question": "Which of the following lists contains ONLY Non-Volatile memory/storage technologies?", "options": {"A": "SRAM, DRAM, CPU Registers", "B": "ROM, EEPROM, Flash Memory, Solid State Drive (SSD)", "C": "L1 Cache, DDR5 SDRAM, Virtual RAM", "D": "DRAM, CMOS without battery, Cache"}, "correctAnswer": "B", "explanation": "ROM, PROM, EPROM, EEPROM, Flash Memory, SSD, HDD, and Optical Discs are all Non-Volatile (retain data when power is turned off). SRAM, DRAM, Cache, and CPU Registers are Volatile.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G21", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Secondary Storage", "subtopic": "Floppy Disk Capacity", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What was the standard formatted storage capacity of a classic 3.5-inch High-Density (HD) micro-floppy diskette?", "options": {"A": "1.44 MB", "B": "700 MB", "C": "4.7 GB", "D": "360 KB"}, "correctAnswer": "A", "explanation": "A standard 3.5-inch HD floppy disk holds 1.44 MB (80 tracks, 18 sectors/track, 2 sides, 512 bytes/sector).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G22", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Secondary Storage", "subtopic": "SSD Interfaces", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Why do modern M.2 NVMe (Non-Volatile Memory Express) SSDs achieve sequential read speeds of 3,500 to 7,000+ MB/s compared to ~550 MB/s on older 2.5-inch SSDs?", "options": {"A": "Because NVMe SSDs communicate directly over high-speed PCIe lanes rather than the legacy SATA III bus bottleneck", "B": "Because NVMe SSDs spin at 15,000 RPM", "C": "Because NVMe SSDs use volatile SRAM", "D": "Because NVMe SSDs compress every file into a `.zip` archive"}, "correctAnswer": "A", "explanation": "Legacy SATA III caps bandwidth at 6 Gbps (~600 MB/s practical), whereas NVMe connects directly to the CPU over PCIe x4 lanes.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G23", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "ROM Variants", "subtopic": "PROM Fuse Programming", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which member of the ROM family is manufactured blank with microscopic fuses intact and can be programmed ONLY ONCE by a user using a special hardware programmer that irreversibly blows selected fuses?", "options": {"A": "Mask ROM", "B": "PROM (Programmable Read-Only Memory)", "C": "EPROM", "D": "EEPROM"}, "correctAnswer": "B", "explanation": "PROM is One-Time Programmable (OTP) non-volatile memory programmed once after manufacturing by burning internal fuses.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G24", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Memory Units", "subtopic": "SI vs IEC Binary Prefixes", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Why does a newly purchased 1 Terabyte (1 TB) Hard Disk Drive typically report around 931 GB of available capacity in Windows File Explorer?", "options": {"A": "Because 69 GB is occupied by the motherboard BIOS", "B": "Because storage manufacturers define $1\\text{ TB}$ in decimal SI units ($10^{12} = 1,000,000,000,000$ bytes), whereas Windows calculates capacity in binary powers ($2^{40} = 1,099,511,627,776$ bytes per TiB/GB)", "C": "Because magnetic platters shrink in cold weather", "D": "Because NTFS deletes 7% of every disk"}, "correctAnswer": "B", "explanation": "$10^{12}\\text{ bytes} / 2^{30}\\text{ bytes per GiB} = 1,000,000,000,000 / 1,073,741,824 \\approx 931.32\\text{ GiB}$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-G25", "moduleCode": "G", "module": "G. Memory and Storage", "topic": "Virtual Memory", "subtopic": "MMU and TLB", "difficulty": "Difficult", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "Which hardware component inside the CPU translates logical (virtual) addresses generated by a program into physical RAM frame addresses during runtime, assisted by a fast associative cache called the TLB (Translation Lookaside Buffer)?", "options": {"A": "ALU", "B": "MMU (Memory Management Unit)", "C": "SMPS", "D": "DMA Controller"}, "correctAnswer": "B", "explanation": "The MMU (Memory Management Unit) performs hardware virtual-to-physical address translation using page tables and caches recent translations in the TLB.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H01", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Conversions", "subtopic": "Hexadecimal to Binary/Decimal", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Adapted PYQ", "question": "What is the 8-bit binary and decimal equivalent of the Hexadecimal number `(B5)16`?", "options": {"A": "Binary: `10110101`, Decimal: `181`", "B": "Binary: `10100101`, Decimal: `165`", "C": "Binary: `11000101`, Decimal: `197`", "D": "Binary: `10110110`, Decimal: `182`"}, "correctAnswer": "A", "explanation": "In Hexadecimal, `B` = 11 (`1011` in 4-bit binary) and `5` = 5 (`0101` in 4-bit binary). Combining them gives `(10110101)2`. In decimal: $11 \\times 16^1 + 5 \\times 16^0 = 176 + 5 = 181$.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-H02", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Conversions", "subtopic": "Fractional Decimal to Binary", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Adapted PYQ", "question": "Convert the fractional decimal number `(13.625)10` into its exact Binary equivalent:", "options": {"A": "`(1101.101)2`", "B": "`(1101.110)2`", "C": "`(1011.101)2`", "D": "`(1110.011)2`"}, "correctAnswer": "A", "explanation": "Integer part: $13 = 8 + 4 + 0 + 1 = (1101)_2$. Fractional part: $0.625 \\times 2 = 1.25$ (1), $0.25 \\times 2 = 0.50$ (0), $0.50 \\times 2 = 1.00$ (1) $\\Rightarrow (.101)_2$. Result $= (1101.101)_2$.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-H03", "moduleCode": "H", "module": "H. Data Representation", "topic": "Signed Representation", "subtopic": "2's Complement Range", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Verified PYQ", "question": "What is the exact range of signed decimal integers that can be represented using 8-bit 2's Complement representation?", "options": {"A": "`-127` to `+127`", "B": "`-128` to `+127`", "C": "`0` to `255`", "D": "`-256` to `+255`"}, "correctAnswer": "B", "explanation": "For an $n$-bit 2's complement system, the range is $-2^{n-1}$ to $+(2^{n-1} - 1)$. For $n = 8$: $-2^7$ to $+(2^7 - 1) = -128$ to $+127$.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-H04", "moduleCode": "H", "module": "H. Data Representation", "topic": "Signed Representation", "subtopic": "2's Complement Calculation", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "How is the negative integer `-25` represented in 8-bit 2's Complement binary notation?", "options": {"A": "`11100111`", "B": "`11100110`", "C": "`10011001`", "D": "`00011001`"}, "correctAnswer": "A", "explanation": "Step 1: $+25$ in 8-bit binary $= 00011001$. Step 2: 1's complement (invert bits) $= 11100110$. Step 3: Add 1 for 2's complement $= 11100111$ ($-128 + 64 + 32 + 4 + 2 + 1 = -25$).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H05", "moduleCode": "H", "module": "H. Data Representation", "topic": "Character Encoding", "subtopic": "ASCII Values", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Adapted PYQ", "question": "In standard 7-bit ASCII encoding, if the decimal ASCII code of uppercase `'A'` is `65` and lowercase `'a'` is `97`, what are the decimal ASCII codes of uppercase `'J'` and the digit character `'5'`?", "options": {"A": "`'J' = 74` and `'5' = 53`", "B": "`'J' = 75` and `'5' = 55`", "C": "`'J' = 73` and `'5' = 48`", "D": "`'J' = 106` and `'5' = 5`"}, "correctAnswer": "A", "explanation": "Since `'A'` is the 1st letter at 65, the 10th letter `'J'` $= 65 + (10 - 1) = 74$. Digits start at `'0' = 48`, so `'5' = 48 + 5 = 53$.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-H06", "moduleCode": "H", "module": "H. Data Representation", "topic": "BCD Code", "subtopic": "8421 BCD vs Pure Binary", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "How many bits are required to represent the decimal number `95` in 8421 BCD (Binary-Coded Decimal), and what is its BCD bit pattern?", "options": {"A": "8 bits: `1001 0101`", "B": "7 bits: `1011111`", "C": "4 bits: `1001`", "D": "16 bits: `00001001 00000101`"}, "correctAnswer": "A", "explanation": "In 8421 BCD, each decimal digit is encoded separately using 4 bits (1 nibble): `9` = `1001` and `5` = `0101`, giving the 8-bit BCD code `1001 0101`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H07", "moduleCode": "H", "module": "H. Data Representation", "topic": "BCD Code", "subtopic": "Invalid BCD States", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Out of the 16 possible 4-bit binary combinations (`0000` to `1111`), which 6 combinations are INVALID (unused) in standard 8421 BCD?", "options": {"A": "`0000` to `0101` (0 to 5)", "B": "`1010` to `1111` (Decimal 10 to 15, i.e., Hex A to F)", "C": "`0100` to `1001` (4 to 9)", "D": "All 16 combinations are valid in BCD"}, "correctAnswer": "B", "explanation": "8421 BCD represents only single decimal digits `0` (`0000`) through `9` (`1001`). The six 4-bit patterns from `1010` (10) to `1111` (15) are invalid in BCD.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H08", "moduleCode": "H", "module": "H. Data Representation", "topic": "Character Encoding", "subtopic": "ASCII vs EBCDIC vs Unicode", "difficulty": "Easy", "questionType": "Comparison", "sourceType": "Original Practice Question", "question": "How many distinct characters can be encoded using standard 7-bit ASCII compared to IBM's 8-bit EBCDIC?", "options": {"A": "7-bit ASCII = 128 characters (2^7); 8-bit EBCDIC = 256 characters (2^8)", "B": "7-bit ASCII = 70 characters; 8-bit EBCDIC = 80 characters", "C": "7-bit ASCII = 256 characters; 8-bit EBCDIC = 512 characters", "D": "Both encode 65,536 characters"}, "correctAnswer": "A", "explanation": "With $n$ bits, $2^n$ distinct bit patterns exist: 7-bit ASCII encodes $2^7 = 128$ characters (0–127), while 8-bit Extended ASCII and EBCDIC encode $2^8 = 256$ characters.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H09", "moduleCode": "H", "module": "H. Data Representation", "topic": "Character Encoding", "subtopic": "UTF-8 Unicode", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which variable-width Unicode character encoding is dominant on the World Wide Web (used by >98% of websites) because it uses 1 to 4 bytes per character and is 100% backward-compatible with 7-bit ASCII?", "options": {"A": "EBCDIC", "B": "UTF-8", "C": "UTF-32", "D": "BCD"}, "correctAnswer": "B", "explanation": "UTF-8 (8-bit Unicode Transformation Format) encodes standard ASCII characters in a single byte (identical to ASCII) and uses 2, 3, or 4 bytes for international scripts (including Devanagari/Hindi) and emojis.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H10", "moduleCode": "H", "module": "H. Data Representation", "topic": "Error Detection", "subtopic": "Even and Odd Parity", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "A 7-bit ASCII character `1011001` is to be transmitted over a communication link with a 1-bit Even Parity bit appended as the 8th bit. What should the value of the Even Parity bit be?", "options": {"A": "`0` (because the data already contains four 1s, which is an even number)", "B": "`1` (to make the total number of 1s equal to five)", "C": "`2`", "D": "Cannot be determined"}, "correctAnswer": "A", "explanation": "Data `1011001` has four `1`s. Since 4 is already even, Even Parity appends `0` so the total number of `1`s remains even (4). For Odd Parity, it would append `1`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H11", "moduleCode": "H", "module": "H. Data Representation", "topic": "Error Detection", "subtopic": "Checksum in TCP/IP", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Which error-detection mechanism is built into the TCP/IP and UDP transport headers, computed by adding 16-bit words using 1's complement arithmetic?", "options": {"A": "Parity Bit", "B": "Checksum", "C": "VLOOKUP", "D": "Defragmentation"}, "correctAnswer": "B", "explanation": "TCP, UDP, and IPv4 headers use a 16-bit 1's complement Checksum to detect corrupted packets during network transmission.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS Official Paper"}, {"id": "CF-H12", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Conversions", "subtopic": "Octal to Hexadecimal", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Original Practice Question", "question": "Convert the Octal number `(754)8` directly into its Hexadecimal equivalent:", "options": {"A": "`(1EC)16`", "B": "`(2FA)16`", "C": "`(754)16`", "D": "`(1DC)16`"}, "correctAnswer": "A", "explanation": "Convert Octal `(754)8` to 3-bit binary: `7=111`, `5=101`, `4=100` -> `111101100`. Regroup into 4-bit nibbles from the right: `0001 1110 1100` -> `1`, `14 (E)`, `12 (C)` = `(1EC)16`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H13", "moduleCode": "H", "module": "H. Data Representation", "topic": "Binary Arithmetic", "subtopic": "Binary Addition", "difficulty": "Easy", "questionType": "Numerical", "sourceType": "Original Practice Question", "question": "What is the binary sum of `(1011)2 + (0111)2`?", "options": {"A": "`(10010)2`", "B": "`(11110)2`", "C": "`(10000)2`", "D": "`(10100)2`"}, "correctAnswer": "A", "explanation": "`(1011)2` is $11_{10}$ and `(0111)2` is $7_{10}$. Their sum is $11 + 7 = 18_{10} = 16 + 2 = (10010)_2$.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H14", "moduleCode": "H", "module": "H. Data Representation", "topic": "Floating-Point", "subtopic": "IEEE 754 Single Precision", "difficulty": "Difficult", "questionType": "Direct Factual", "sourceType": "Exam-pattern Question", "question": "In the IEEE 754 Single-Precision (32-bit) floating-point standard, how are the 32 bits partitioned among the Sign bit, Biased Exponent, and Mantissa (Fraction)?", "options": {"A": "1 Sign bit, 8 Exponent bits (bias 127), 23 Mantissa bits", "B": "1 Sign bit, 11 Exponent bits (bias 1023), 20 Mantissa bits", "C": "2 Sign bits, 10 Exponent bits, 20 Mantissa bits", "D": "8 Sign bits, 8 Exponent bits, 16 Mantissa bits"}, "correctAnswer": "A", "explanation": "IEEE 754 32-bit Single Precision uses 1 Sign bit + 8 Biased Exponent bits (bias 127) + 23 Fraction/Mantissa bits. (64-bit Double Precision uses 1 + 11 + 52 bits.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H15", "moduleCode": "H", "module": "H. Data Representation", "topic": "Radix Validation", "subtopic": "Valid Octal Number", "difficulty": "Easy", "questionType": "Exam-trap", "sourceType": "Original Practice Question", "question": "Which of the following numbers is NOT a valid Octal (Base-8) number?", "options": {"A": "`(742)8`", "B": "`(107)8`", "C": "`(682)8`", "D": "`(555)8`"}, "correctAnswer": "C", "explanation": "In Base-8 (Octal), valid digits range only from `0` to `7` ($r - 1 = 7$). Since `(682)` contains the digit `8`, it cannot be a valid Octal number.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I01", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Classification", "subtopic": "Identify Non-OS", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Verified PYQ", "question": "Which of the following is NOT an Operating System?", "options": {"A": "UNIX", "B": "Windows", "C": "Android", "D": "MS Office"}, "correctAnswer": "D", "explanation": "UNIX, Windows, and Android are Operating Systems (System Software). MS Office is an Application Software suite (productivity package).", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023 Part B", "sourceReference": "Scribd / KVS PGT CS Official Paper"}, {"id": "CF-I02", "moduleCode": "I", "module": "I. Computer Software", "topic": "Language Translators", "subtopic": "Compiler vs Interpreter", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "Which language processor translates and executes a High-Level Language program statement-by-statement (line by line) at runtime without saving a standalone intermediate object code file?", "options": {"A": "Assembler", "B": "Compiler", "C": "Interpreter", "D": "Linker"}, "correctAnswer": "C", "explanation": "An Interpreter translates and immediately executes source code line-by-line and stops at the first encountered error, unlike a Compiler which translates the entire program into object code at once.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-I03", "moduleCode": "I", "module": "I. Computer Software", "topic": "Build Toolchain", "subtopic": "Linker vs Loader", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "In the program compilation and execution lifecycle, what is the exact role of a 'Linker' as opposed to a 'Loader'?", "options": {"A": "A Linker combines one or more compiler-generated Object files (`.obj`) with library routines into a single executable file (`.exe`), whereas a Loader copies the executable file from disk into Primary Memory (RAM) for execution", "B": "A Linker translates assembly code into machine code, whereas a Loader connects the PC to the Internet", "C": "A Linker deletes viruses, whereas a Loader compresses files", "D": "Both Linker and Loader are spreadsheet functions in MS Excel"}, "correctAnswer": "A", "explanation": "Compiler -> Object Code -> Linker (resolves external symbol references across object modules & libraries to build an executable) -> Loader (loads executable into RAM).", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-I04", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Licensing", "subtopic": "Open Source vs Freeware", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "What is the fundamental legal and technical difference between 'Open-Source Software (FOSS)' (e.g., Linux, LibreOffice) and 'Freeware' (e.g., Adobe Acrobat Reader, Skype)?", "options": {"A": "Freeware costs thousands of dollars whereas Open-Source is a hardware chip", "B": "Both are typically free of monetary cost, but Open-Source Software provides public access to view, modify, and redistribute the underlying source code, whereas Freeware is proprietary with closed source code", "C": "Freeware expires after 7 days whereas Open-Source expires after 30 days", "D": "Open-Source cannot run on microprocessors"}, "correctAnswer": "B", "explanation": "Freeware is free in price ($0) but closed-source (proprietary). Open-Source Software (FOSS) makes the source code openly available under licenses such as GPL, MIT, or Apache.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I05", "moduleCode": "I", "module": "I. Computer Software", "topic": "Utility Software", "subtopic": "Disk Defragmenter & Antivirus", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Original Practice Question", "question": "Antivirus scanners, Disk Defragmenters, Disk Cleanup tools, Backup managers, and File Compression programs (WinZip / 7-Zip) are categorized as:", "options": {"A": "Utility Software", "B": "Database Management Systems", "C": "Firmware", "D": "Presentation Graphics Software"}, "correctAnswer": "A", "explanation": "Utility software consists of service programs designed to analyze, configure, optimize, secure, and maintain a computer system.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I06", "moduleCode": "I", "module": "I. Computer Software", "topic": "System Software", "subtopic": "Device Drivers", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "When you connect a new printer, graphics card, or scanner to a computer, which specialized system software acts as a translator between the Operating System and that specific hardware peripheral?", "options": {"A": "Device Driver", "B": "Word Processor", "C": "Assembler", "D": "Spreadsheet"}, "correctAnswer": "A", "explanation": "A Device Driver is a kernel/system software module that translates generic OS input/output calls into hardware-specific register commands for a particular device.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I07", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Licensing", "subtopic": "Shareware", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "Software distributed free of charge on a 'try-before-you-buy' trial basis—where users can evaluate it for a limited period (e.g., 30 days) after which payment is required for continued or full use (such as WinRAR)—is called:", "options": {"A": "Public-Domain Software", "B": "Shareware", "C": "Firmware", "D": "Open-Source Kernel"}, "correctAnswer": "B", "explanation": "Shareware is proprietary commercial software provided initially as a free trial (time-limited or feature-limited) to encourage purchase.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I08", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Licensing", "subtopic": "Identify FOSS Group", "difficulty": "Moderate", "questionType": "Classification", "sourceType": "Exam-pattern Question", "question": "Which of the following groups consists ENTIRELY of Open-Source Software (FOSS)?", "options": {"A": "Linux, LibreOffice, Mozilla Firefox, Python, VLC Media Player", "B": "Windows 11, MS Office 2021, Adobe Photoshop, CorelDRAW", "C": "macOS, iOS, Safari, Final Cut Pro", "D": "MS Excel, Oracle Database, WinRAR, AutoCAD"}, "correctAnswer": "A", "explanation": "Linux, LibreOffice, Mozilla Firefox, Python, Apache, GIMP, Audacity, and VLC are all well-known Free and Open-Source Software (FOSS) projects.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I09", "moduleCode": "I", "module": "I. Computer Software", "topic": "Language Translators", "subtopic": "Assembler Function", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What is the exact input and output of an Assembler?", "options": {"A": "Input: High-Level C code -> Output: Python script", "B": "Input: Assembly Language program (mnemonics) -> Output: Relocatable Machine/Object Code", "C": "Input: Machine Code -> Output: Flowchart", "D": "Input: SQL Query -> Output: HTML Table"}, "correctAnswer": "B", "explanation": "An Assembler translates low-level Assembly language programs (symbolic mnemonics like `MOV`, `ADD`, `SUB`) into binary machine/object code.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I10", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Updates", "subtopic": "Patch vs Service Pack", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In software maintenance terminology, what is the difference between a 'Hotfix / Patch' and a 'Service Pack / Feature Update'?", "options": {"A": "A Patch/Hotfix is a small, targeted software update released quickly to fix a specific bug or security vulnerability, whereas a Service Pack bundles many cumulative patches, stability fixes, and minor enhancements into a single major release", "B": "A Patch deletes the operating system whereas a Service Pack formats the hard drive", "C": "A Patch is hardware whereas a Service Pack is firmware", "D": "There is no difference"}, "correctAnswer": "A", "explanation": "Patches (or hotfixes) address immediate security flaws or specific bugs; Service Packs aggregate all prior patches and system updates into one tested package.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I11", "moduleCode": "I", "module": "I. Computer Software", "topic": "Application Software", "subtopic": "Bespoke / Custom Software", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Software developed specifically for a single organization's unique workflow—such as Indian Railways' CRIS passenger reservation system or a custom hospital ERP—is known as:", "options": {"A": "COTS (Commercial Off-The-Shelf) Horizontal Software", "B": "Tailor-made / Bespoke (Custom / Vertical) Application Software", "C": "System Utility Software", "D": "Motherboard Firmware"}, "correctAnswer": "B", "explanation": "Bespoke (or custom/tailor-made) software is engineered for a specific client's requirements, unlike off-the-shelf horizontal packages like MS Word.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I12", "moduleCode": "I", "module": "I. Computer Software", "topic": "Software Licensing", "subtopic": "Public Domain", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "Software whose copyright has been explicitly waived (e.g., via CC0) or has expired—meaning anyone can use, modify, or sell it with zero ownership restrictions—is called:", "options": {"A": "Proprietary Software", "B": "Public-Domain Software", "C": "Shareware", "D": "Nagware"}, "correctAnswer": "B", "explanation": "Public-domain software has no copyright restrictions at all and belongs to the public at large (e.g., SQLite is dedicated to the public domain).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I13", "moduleCode": "I", "module": "I. Computer Software", "topic": "Application Delivery", "subtopic": "Web Apps vs Desktop Apps", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "What is the primary architectural difference between a native Desktop Application (e.g., installed MS Word 2021) and a Web Application (e.g., Google Docs or Word for the Web)?", "options": {"A": "Desktop applications run directly inside a web browser without installation, whereas Web applications must be compiled from punched cards", "B": "Desktop applications are installed locally on the user's OS and execute primarily on local hardware, whereas Web applications run inside a web browser and rely on remote web/cloud servers", "C": "Web applications cannot use the keyboard", "D": "Desktop applications cannot save files to a hard disk"}, "correctAnswer": "B", "explanation": "Web applications are accessed via HTTP/HTTPS inside a browser (SaaS) with cloud storage/compute, while native desktop apps are installed directly on the local OS.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I14", "moduleCode": "I", "module": "I. Computer Software", "topic": "Build Toolchain", "subtopic": "Java Bytecode & JVM", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Why is the Java programming language often described as both a compiled AND an interpreted language ('Write Once, Run Anywhere')?", "options": {"A": "Because the `javac` compiler first translates `.java` source code into platform-independent Bytecode (`.class`), which is then interpreted and JIT-compiled at runtime by the JVM (Java Virtual Machine) on any OS", "B": "Because Java requires an Assembler and a Punched Card reader", "C": "Because Java code is written directly in binary 0s and 1s", "D": "Because Java only runs inside MS Excel"}, "correctAnswer": "A", "explanation": "Java source code is compiled into intermediate Bytecode (`.class`), and the target machine's JVM interprets/JIT-compiles that bytecode into native machine instructions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-I15", "moduleCode": "I", "module": "I. Computer Software", "topic": "Utility Software", "subtopic": "File Compression", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Why do file archiver utilities like WinZip and 7-Zip use 'Lossless Compression' rather than 'Lossy Compression' when compressing executable programs and Word/Excel documents?", "options": {"A": "Because losing even a single bit in an executable program or financial spreadsheet would corrupt the file, so Lossless Compression reconstructs the exact bit-for-bit original upon extraction", "B": "Because Lossless Compression deletes 50% of the words in a document", "C": "Because Lossy Compression makes files larger", "D": "Because `.zip` files can only store audio"}, "correctAnswer": "A", "explanation": "Text, code, spreadsheets, and databases require 100% bit-identical restoration (Lossless compression: ZIP, 7Z, PNG), whereas images/audio/video can tolerate imperceptible perceptual approximations (Lossy: JPEG, MP3, MP4).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J01", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Memory Management", "subtopic": "Main Function", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "question": "Which of the following is a primary function of the Memory Management module of an Operating System?", "options": {"A": "Designing the motherboard PCB layout", "B": "Keeping track of which parts of primary memory (RAM) are currently in use, allocating memory to processes when needed, and deallocating it when they terminate", "C": "Converting AC power into DC power", "D": "Translating high-level C++ code into object code"}, "correctAnswer": "B", "explanation": "The OS Memory Manager tracks free and allocated RAM frames, manages virtual memory paging/segmentation, protects process address spaces, and allocates/deallocates memory.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS Official Paper"}, {"id": "CF-J02", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS Types", "subtopic": "Multiprogramming vs Multiprocessing", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "What is the exact distinction between a 'Multiprogramming Operating System' and a 'Multiprocessing Operating System'?", "options": {"A": "Multiprogramming keeps multiple jobs in RAM on a single CPU and switches jobs when one waits for I/O, whereas Multiprocessing utilizes two or more physical CPUs/cores executing instructions simultaneously in parallel", "B": "Multiprogramming requires at least 16 CPUs, whereas Multiprocessing uses only 1 CPU", "C": "Multiprogramming does not use RAM", "D": "Both terms mean running only a single DOS program at a time"}, "correctAnswer": "A", "explanation": "Multiprogramming maximizes single-CPU utilization by overlapping one job's CPU burst with another job's I/O wait; Multiprocessing uses multiple physical CPUs/cores simultaneously.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-J03", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS Types", "subtopic": "Real-Time OS (RTOS)", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Adapted PYQ", "question": "Which type of Operating System is mandatory for safety-critical systems such as aircraft fly-by-wire control, missile guidance, automobile airbag deployment, and medical pacemakers, where processing MUST complete within strict deterministic time deadlines?", "options": {"A": "Batch Operating System", "B": "Hard Real-Time Operating System (Hard RTOS)", "C": "Time-Sharing Desktop OS", "D": "Single-User MS-DOS"}, "correctAnswer": "B", "explanation": "A Hard RTOS guarantees that critical tasks complete within strict microsecond/millisecond deadlines; missing a deadline constitutes total system failure.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-J04", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS Architecture", "subtopic": "Kernel vs Shell", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In UNIX, Linux, and Windows operating system architecture, how do the 'Kernel' and the 'Shell' differ?", "options": {"A": "The Kernel is the outer user interface, while the Shell is the motherboard power supply", "B": "The Kernel is the privileged core of the OS that interacts directly with hardware in kernel mode, while the Shell is the outer command interpreter (CLI or GUI) that accepts user commands and makes system calls to the Kernel", "C": "The Shell manages CPU interrupts directly without a Kernel", "D": "Only MS-DOS has a Kernel"}, "correctAnswer": "B", "explanation": "Hardware <-> Kernel (privileged core managing CPU, RAM, devices) <-> System Calls <-> Shell (Bash/PowerShell/GUI Explorer) <-> User.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J05", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS Types", "subtopic": "Time-Sharing / Multitasking", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In a Time-Sharing (Multitasking) Operating System, the short fixed interval of CPU time (typically 10 to 100 milliseconds) allocated to each active process in a Round-Robin cycle is called a:", "options": {"A": "Seek Time", "B": "Time Slice (or Time Quantum)", "C": "Baud Rate", "D": "Refresh Cycle"}, "correctAnswer": "B", "explanation": "Time-sharing systems rapidly multiplex the CPU among active processes by giving each process a short 'Time Slice' or 'Time Quantum' before preempting it via a timer interrupt.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J06", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Device Management", "subtopic": "Spooling", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Adapted PYQ", "question": "When you click 'Print' on 5 different documents in MS Word, the Operating System rapidly writes all 5 print jobs to a temporary disk buffer queue so you can keep working in Word while the slow printer prints them one by one in the background. What is this OS mechanism called?", "options": {"A": "Thrashing", "B": "SPOOLing (Simultaneous Peripheral Operations On-Line)", "C": "Deadlocking", "D": "Formatting"}, "correctAnswer": "B", "explanation": "Spooling buffers slow I/O device jobs (especially print jobs) onto secondary storage queues so the fast CPU is not held up waiting for mechanical printer speed.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-J07", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "File Systems", "subtopic": "NTFS vs FAT32", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "Which file system is the default for modern Windows installations (Windows 10/11) and supports files larger than 4 GB, journaling recovery, file-level permissions (ACLs), and BitLocker/EFS encryption—unlike legacy FAT32?", "options": {"A": "NTFS (New Technology File System)", "B": "FAT16", "C": "ext4", "D": "HFS+"}, "correctAnswer": "A", "explanation": "NTFS is the standard Windows file system. FAT32 has a strict maximum single-file size limit of 4 GB ($2^{32} - 1$ bytes) and lacks journaling and file-level security permissions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J08", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS History", "subtopic": "Linux and UNIX Creators", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the Operating System with its primary creator(s) / developer:\n1. UNIX (1969, Bell Labs) — (p) Linus Torvalds (1991)\n2. Linux Kernel — (q) Ken Thompson and Dennis Ritchie\n3. MS-DOS / Windows — (r) Apple Inc.\n4. macOS / iOS — (s) Microsoft Corporation", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "Ken Thompson and Dennis Ritchie created UNIX at Bell Labs (q); Linus Torvalds created the open-source Linux kernel in 1991 (p); Microsoft developed MS-DOS/Windows (s); Apple developed macOS/iOS (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J09", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Mobile OS", "subtopic": "Android Kernel", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Google's Android mobile operating system is built on top of a modified version of which open-source operating system kernel?", "options": {"A": "Windows NT Kernel", "B": "Linux Kernel", "C": "MS-DOS 6.22", "D": "IBM OS/360"}, "correctAnswer": "B", "explanation": "Android is built on top of the Long-Term Support (LTS) Linux Kernel.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J10", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Process Management", "subtopic": "Context Switching", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "When the OS CPU Scheduler preempts a currently running process to give the CPU to another ready process, it saves the current process's registers and Program Counter into its PCB (Process Control Block) and loads the saved state of the new process. What is this operation called?", "options": {"A": "Context Switch", "B": "Disk Formatting", "C": "Mail Merge", "D": "BIOS Flashing"}, "correctAnswer": "A", "explanation": "Saving the CPU state of the outgoing process to its PCB and restoring the PCB state of the incoming process is called a Context Switch.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J11", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Directories", "subtopic": "Absolute vs Relative Path", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In a hierarchical directory tree, what is the difference between an 'Absolute Path' and a 'Relative Path'?", "options": {"A": "An Absolute Path starts from the topmost Root directory (e.g., `C:\\Users\\Admin\\file.txt` or `/home/user/file.txt`), whereas a Relative Path specifies the location starting from the current working directory", "B": "An Absolute Path uses dollar signs `$C$1` in Excel", "C": "A Relative Path can only be used on floppy disks", "D": "Both paths must start with `https://`"}, "correctAnswer": "A", "explanation": "An Absolute Path gives the complete path from the root directory (`\\` or `/`), while a Relative Path is evaluated relative to the current working directory (`.` and `..`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J12", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Windows Fundamentals", "subtopic": "Task Manager & Safe Mode", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In Microsoft Windows, which direct keyboard shortcut opens the 'Task Manager' immediately (without going through the Ctrl+Alt+Del lock screen) to monitor CPU/RAM usage or terminate a frozen application?", "options": {"A": "`Ctrl + Shift + Esc`", "B": "`Alt + F4`", "C": "`Win + E`", "D": "`Ctrl + F1`"}, "correctAnswer": "A", "explanation": "`Ctrl + Shift + Esc` launches Windows Task Manager directly.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J13", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Windows Fundamentals", "subtopic": "Recycle Bin Bypass", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "When deleting a file or folder in Windows File Explorer, pressing `Delete` moves it to the Recycle Bin. Which key combination permanently deletes the selected item immediately WITHOUT sending it to the Recycle Bin?", "options": {"A": "`Ctrl + Delete`", "B": "`Shift + Delete`", "C": "`Alt + Delete`", "D": "`Win + Delete`"}, "correctAnswer": "B", "explanation": "`Shift + Delete` bypasses the Recycle Bin and permanently removes the file entry from the file system.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J14", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "OS Types", "subtopic": "Batch OS", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In early Second-Generation computing, jobs with similar requirements were collected offline on punched cards/magnetic tape and executed sequentially by the computer without any direct user interaction during execution. This OS model is called:", "options": {"A": "Batch Operating System", "B": "Interactive GUI Operating System", "C": "Hard Real-Time Operating System", "D": "Peer-to-Peer Mobile OS"}, "correctAnswer": "A", "explanation": "Batch Operating Systems group similar non-interactive jobs into batches to reduce setup overhead.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-J15", "moduleCode": "J", "module": "J. Operating System Fundamentals", "topic": "Linux Fundamentals", "subtopic": "Root & Case Sensitivity", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In Linux and UNIX operating systems, what is the name of the top-level superuser (administrator) account, and howis the root directory denoted?", "options": {"A": "Superuser = `root`; Root directory = `/` (forward slash)", "B": "Superuser = `guest`; Root directory = `C:\\`", "C": "Superuser = `system32`; Root directory = `#`", "D": "Superuser = `bios`; Root directory = `@`"}, "correctAnswer": "A", "explanation": "In UNIX/Linux, the administrative superuser account is `root`, and the filesystem hierarchy starts at `/` (forward slash). Also note that Linux filenames are strictly case-sensitive (`File.txt` and `file.txt` are two different files).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K01", "moduleCode": "K", "module": "K. Computer Languages", "topic": "High-Level Languages", "subtopic": "Features of HLL", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Verified PYQ", "question": "Which of the following is a key feature of High-Level Programming Languages (such as C, Java, and Python) compared to Machine and Assembly languages?", "options": {"A": "They are directly executed by the CPU without any compiler or interpreter", "B": "They are machine-independent (portable across hardware architectures), easier for humans to read/debug, and use English-like keywords and mathematical notation", "C": "They require the programmer to manually wire vacuum tube plugboards", "D": "They can only run on First-Generation computers"}, "correctAnswer": "B", "explanation": "High-Level Languages (3GLs) abstract away hardware register specifics, providing portability across CPUs and human-readable syntax.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2021 Official Paper"}, {"id": "CF-K02", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Language Generations", "subtopic": "1GL to 5GL Classification", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Adapted PYQ", "question": "Match each Generation of Programming Language with its representative example:\n1. First Generation (1GL) — (p) SQL (Structured Query Language)\n2. Second Generation (2GL) — (q) Prolog and Mercury (AI / Logic)\n3. Third Generation (3GL) — (r) Binary Machine Code (0s and 1s)\n4. Fourth Generation (4GL) — (s) x86 Assembly Language (`MOV, ADD`)\n5. Fifth Generation (5GL) — (t) C, C++, Java, FORTRAN", "options": {"A": "1-r, 2-s, 3-t, 4-p, 5-q", "B": "1-s, 2-r, 3-t, 4-p, 5-q", "C": "1-r, 2-s, 3-p, 4-t, 5-q", "D": "1-r, 2-t, 3-s, 4-q, 5-p"}, "correctAnswer": "A", "explanation": "1GL = Machine code (r); 2GL = Assembly language (s); 3GL = Procedural/OOP HLLs like C/Java/FORTRAN (t); 4GL = Non-procedural declarative query languages like SQL (p); 5GL = AI/constraint logic languages like Prolog (q).", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-K03", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Flowcharts", "subtopic": "Flowchart Symbols", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "In standard ANSI program flowcharts, which geometric shape is used to represent a 'Decision' (conditional branching such as `if-else` or loop condition) vs 'Input/Output'?", "options": {"A": "Decision = Diamond; Input/Output = Parallelogram", "B": "Decision = Rectangle; Input/Output = Oval", "C": "Decision = Parallelogram; Input/Output = Diamond", "D": "Decision = Circle; Input/Output = Triangle"}, "correctAnswer": "A", "explanation": "Standard Flowchart Symbols: Oval = Start/Stop (Terminal); Parallelogram = Input/Output; Rectangle = Process/Calculation; Diamond = Decision/Condition; Circle = On-page Connector.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "CF-K04", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Program Errors", "subtopic": "Syntax vs Logical vs Runtime", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "A student writes a program to calculate the average of three numbers as `avg = a + b + c / 3;` instead of `(a + b + c) / 3;`. The program compiles without any error messages and runs to completion, but prints an incorrect mathematical answer. What type of error is this?", "options": {"A": "Syntax Error", "B": "Logical Error (Semantic Flaw)", "C": "Linker Missing Library Error", "D": "Hardware Parity Error"}, "correctAnswer": "B", "explanation": "Because `a + b + c / 3;` obeys all grammatical rules of the language, the compiler reports zero Syntax Errors; however, due to operator precedence (`c/3` evaluated first), the algorithm logic is flawed—this is a Logical Error.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K05", "moduleCode": "K", "module": "K. Computer Languages", "topic": "OOP Concepts", "subtopic": "Four Pillars of OOP", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Adapted PYQ", "question": "In Object-Oriented Programming (C++, Java, Python), wrapping data (attributes) and the functions (methods) that operate on that data together into a single unit (`class`) while restricting direct outside access to private fields is called:", "options": {"A": "Polymorphism", "B": "Encapsulation", "C": "Multiple Inheritance", "D": "Dynamic Loading"}, "correctAnswer": "B", "explanation": "Encapsulation binds data and methods into a single class capsule and supports data hiding (access modifiers like `private`).", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-K06", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Language History", "subtopic": "Language Creators", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match the programming language with its original creator / lead designer:\n1. C Language (1972) — (p) Guido van Rossum\n2. C++ Language (1979/83) — (q) James Gosling\n3. Python (1991) — (r) Dennis Ritchie\n4. Java (1995) — (s) Bjarne Stroustrup", "options": {"A": "1-r, 2-s, 3-p, 4-q", "B": "1-s, 2-r, 3-p, 4-q", "C": "1-r, 2-p, 3-s, 4-q", "D": "1-q, 2-s, 3-p, 4-r"}, "correctAnswer": "A", "explanation": "Dennis Ritchie created C at Bell Labs (r); Bjarne Stroustrup created C++ ('C with Classes') (s); Guido van Rossum created Python (p); James Gosling created Java at Sun Microsystems (q).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K07", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Algorithms", "subtopic": "Algorithm Properties", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Every valid computer Algorithm must satisfy the property of 'Finiteness'. What does 'Finiteness' mean for an algorithm?", "options": {"A": "The algorithm must be written in fewer than 10 lines of code", "B": "The algorithm must always terminate after executing a finite number of steps for all valid inputs (it must never enter an infinite loop)", "C": "The algorithm can only use integer numbers between 0 and 9", "D": "The algorithm must run without electricity"}, "correctAnswer": "B", "explanation": "Finiteness requires that an algorithm halts after a finite number of well-defined steps rather than looping infinitely.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K08", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Markup vs Programming", "subtopic": "HTML Classification", "difficulty": "Easy", "questionType": "Exam-trap", "sourceType": "Original Practice Question", "question": "Why is HTML (HyperText Markup Language) classified as a 'Markup Language' rather than a full 'Programming Language'?", "options": {"A": "Because HTML is used only on First-Generation computers", "B": "Because HTML uses structural tags (like `<h1>`, `<p>`, `<table>`) to describe document layout and hypertext links, and lacks native conditional branching (`if/else`), loops, or general arithmetic computation", "C": "Because HTML is compiled into `.exe` files by an Assembler", "D": "Because HTML can only be read by an OMR scanner"}, "correctAnswer": "B", "explanation": "HTML defines document structure and presentation using markup tags; client-side logic and interactivity on web pages are provided by a scripting/programming language like JavaScript.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K09", "moduleCode": "K", "module": "K. Computer Languages", "topic": "HTML Fundamentals", "subtopic": "Core HTML Tags", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In HTML, which tag is used to create a clickable Hyperlink (`<a>`), which attribute specifies the target URL, and which heading tag produces the LARGEST heading text?", "options": {"A": "Tag: `<a>`, Attribute: `href`, Largest Heading: `<h1>`", "B": "Tag: `<link>`, Attribute: `src`, Largest Heading: `<h6>`", "C": "Tag: `<url>`, Attribute: `href`, Largest Heading: `<h6>`", "D": "Tag: `<href>`, Attribute: `url`, Largest Heading: `<h0>`"}, "correctAnswer": "A", "explanation": "In HTML: `<a href=\"https://...\">Text</a>` creates a hyperlink (Anchor tag with Hypertext Reference attribute). Headings run from `<h1>` (largest, most important) down to `<h6>` (smallest).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K10", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Code Types", "subtopic": "Source vs Object Code", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "Human-readable program statements written by a software developer in a language like C or Java are called ______, whereas the machine-level binary translation generated by a compiler is called ______.", "options": {"A": "Object Code; Source Code", "B": "Source Code; Object Code", "C": "Bytecode; Pseudocode", "D": "Firmware; Liveware"}, "correctAnswer": "B", "explanation": "Source Code is written by the programmer; Object Code is the translated machine-level output produced by a Compiler or Assembler.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K11", "moduleCode": "K", "module": "K. Computer Languages", "topic": "OOP Concepts", "subtopic": "Inheritance & Polymorphism", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In Object-Oriented Programming, when a subclass (`SavingsAccount`) acquires the properties and behaviors of a parent superclass (`BankAccount`), this mechanism is called ______, and when a single function/method name behaves differently based on input parameters or object type, it is called ______.", "options": {"A": "Inheritance; Polymorphism", "B": "Polymorphism; Encapsulation", "C": "Compilation; Interpretation", "D": "Paging; Segmentation"}, "correctAnswer": "A", "explanation": "Inheritance models an 'IS-A' relationship enabling code reuse; Polymorphism ('many forms') allows method overloading (compile-time) and method overriding (runtime).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K12", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Pseudocode", "subtopic": "Purpose of Pseudocode", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "What is 'Pseudocode' in software design?", "options": {"A": "Encrypted binary malware hidden in a boot sector", "B": "An informal, language-independent, structured English notation used by programmers to plan an algorithm's logic before writing actual syntax-strict source code", "C": "A broken C program with syntax errors", "D": "The machine code stored in BIOS ROM"}, "correctAnswer": "B", "explanation": "Pseudocode expresses algorithmic control structures (`IF-THEN-ELSE`, `WHILE`, `FOR`) in plain human-readable steps without tying the design to any specific programming language's syntax.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K13", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Historical Languages", "subtopic": "FORTRAN and LISP", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Developed in 1957 by John Backus's team at IBM, which language was the first widely used High-Level Language designed for scientific and numerical computation, and which 1958 language created by John McCarthy became the premier language for early Artificial Intelligence?", "options": {"A": "Scientific: FORTRAN (Formula Translation); AI: LISP (List Processing)", "B": "Scientific: COBOL; AI: HTML", "C": "Scientific: BASIC; AI: SQL", "D": "Scientific: Pascal; AI: Assembly"}, "correctAnswer": "A", "explanation": "FORTRAN (1957, John Backus) pioneered scientific HLL computing, and LISP (1958, John McCarthy—who also coined the term 'Artificial Intelligence') pioneered symbolic AI programming.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K14", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Program Errors", "subtopic": "Runtime Error", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "A program compiles cleanly with zero syntax errors, starts running, asks the user for two integers, and crashes abruptly when the user enters `0` as the divisor (`Division by Zero`). This is an example of a:", "options": {"A": "Compile-Time Syntax Error", "B": "Runtime Error (Exception)", "C": "Lexical Error", "D": "BIOS POST Error"}, "correctAnswer": "B", "explanation": "Errors that occur during program execution due to invalid operations (division by zero, null pointer dereference, file not found, out-of-bounds array index) are Runtime Errors (Exceptions).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-K15", "moduleCode": "K", "module": "K. Computer Languages", "topic": "Programming Paradigms", "subtopic": "Procedural vs Declarative", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "How does a 'Declarative (Non-Procedural)' language like SQL differ from an 'Imperative / Procedural' language like C?", "options": {"A": "In SQL you specify WHAT result set you want without coding the step-by-step loop to fetch it, whereas in C you write explicit step-by-step procedures detailing HOW to iterate and manipulate memory", "B": "SQL can only run on analog computers", "C": "C has no variables or loops", "D": "SQL is a 1st-Generation binary language"}, "correctAnswer": "A", "explanation": "Procedural languages (3GL: C, Pascal, FORTRAN) specify *how* to compute step-by-step; Declarative languages (4GL: SQL) specify *what* data is desired and let the query optimizer decide how to retrieve it.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L01", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Network Topologies", "subtopic": "Mesh Links Formula", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Verified PYQ", "question": "In a fully connected Mesh network topology consisting of `8` computer nodes, how many dedicated bidirectional point-to-point physical links (cables) are required in total, and how many I/O ports does each computer need?", "options": {"A": "28 links in total; 7 I/O ports per node", "B": "64 links in total; 8 I/O ports per node", "C": "56 links in total; 7 I/O ports per node", "D": "16 links in total; 4 I/O ports per node"}, "correctAnswer": "A", "explanation": "For $N = 8$ nodes in a full duplex Mesh: Total links $= N(N - 1) / 2 = 8 \\times 7 / 2 = 28$ links. Each node connects to the other $(N - 1) = 7$ nodes, requiring $7$ I/O ports.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-L02", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Protocols", "subtopic": "Multimedia RTP Protocol", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Which application/transport-level protocol (typically running over UDP) is commonly used for basic real-time multimedia content transmission (such as live audio and video streaming/VoIP) over the Internet?", "options": {"A": "SMTP", "B": "RTP (Real-Time Transport Protocol)", "C": "POP3", "D": "ARP"}, "correctAnswer": "B", "explanation": "RTP (Real-Time Transport Protocol), paired with RTCP, provides end-to-end delivery services for real-time audio and video over UDP.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-L03", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Networking Devices", "subtopic": "Hub vs Switch vs Router", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "Match the networking device with the exact OSI model layer at which it operates and the address it uses:\n1. Hub & Repeater — (p) Layer 3 (Network Layer); uses logical IP addresses\n2. Switch & Bridge — (q) Layer 1 (Physical Layer); regenerates/broadcasts raw bits with no addressing\n3. Router — (r) Layer 2 (Data Link Layer); filters and forwards frames using 48-bit MAC addresses", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-q, 2-p, 3-r", "D": "1-p, 2-r, 3-q"}, "correctAnswer": "A", "explanation": "Repeaters and Hubs operate at Layer 1 (Physical) on raw electrical/optical bits (q); Bridges and Switches operate at Layer 2 (Data Link) using 48-bit MAC tables (r); Routers operate at Layer 3 (Network) using IP routing tables (p).", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-L04", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Addressing", "subtopic": "MAC vs IPv4 vs IPv6 Length", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "What are the exact bit lengths of a physical MAC Address, a logical IPv4 Address, and a logical IPv6 Address?", "options": {"A": "MAC = 48 bits (6 bytes); IPv4 = 32 bits (4 bytes); IPv6 = 128 bits (16 bytes)", "B": "MAC = 32 bits; IPv4 = 64 bits; IPv6 = 128 bits", "C": "MAC = 64 bits; IPv4 = 32 bits; IPv6 = 256 bits", "D": "MAC = 16 bits; IPv4 = 32 bits; IPv6 = 64 bits"}, "correctAnswer": "A", "explanation": "MAC address = 48 bits (6 bytes written as 12 Hex digits, e.g., `00:1A:2B:3C:4D:5E`); IPv4 = 32 bits (4 octets in dotted decimal); IPv6 = 128 bits (8 groups of 4 Hex digits).", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "CF-L05", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Protocols", "subtopic": "DNS Role", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which TCP/IP application-layer service (operating on Port 53) acts as the 'phonebook of the Internet' by translating human-friendly domain names (like `www.delhi.gov.in`) into machine-routable IP addresses?", "options": {"A": "DHCP", "B": "DNS (Domain Name System)", "C": "FTP", "D": "SMTP"}, "correctAnswer": "B", "explanation": "DNS (Domain Name System) resolves domain names into IP addresses. DHCP (Dynamic Host Configuration Protocol) dynamically assigns IP addresses to hosts joining a network.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L06", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Network Types", "subtopic": "PAN, LAN, MAN, WAN", "difficulty": "Easy", "questionType": "Classification", "sourceType": "Original Practice Question", "question": "Connecting your wireless Bluetooth earbuds and smartwatch to your smartphone within a range of a few meters forms which type of computer network?", "options": {"A": "WAN (Wide Area Network)", "B": "PAN / WPAN (Personal Area Network)", "C": "MAN (Metropolitan Area Network)", "D": "Extranet"}, "correctAnswer": "B", "explanation": "A Personal Area Network (PAN / WPAN) interconnects personal devices within an individual's immediate workspace (~10 meters) using Bluetooth or USB.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L07", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Network Topologies", "subtopic": "Star vs Bus Topology", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In which network topology is every computer connected via its own dedicated cable to a central Switch or Hub, such that if one computer's cable breaks, only that single computer loses connectivity while the rest of the network continues operating normally?", "options": {"A": "Bus Topology", "B": "Star Topology", "C": "Unidirectional Ring Topology", "D": "Daisy-Chain Topology"}, "correctAnswer": "B", "explanation": "In a Star Topology, each node has an independent link to the central switch; a single cable fault isolates only that node (though failure of the central switch brings down the star). In a Bus topology, a break in the main coaxial backbone halts the entire network.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L08", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Protocols & Ports", "subtopic": "Standard Port Numbers", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match the standard TCP/IP network protocol with its default well-known Port Number:\n1. HTTP — (p) Port 443\n2. HTTPS (SSL/TLS) — (q) Port 80\n3. FTP (Control) & SSH — (r) Port 25 (SMTP) & Port 110 (POP3)\n4. Email SMTP & POP3 — (s) Port 21 (FTP) & Port 22 (SSH)", "options": {"A": "1-q, 2-p, 3-s, 4-r", "B": "1-p, 2-q, 3-s, 4-r", "C": "1-q, 2-s, 3-p, 4-r", "D": "1-r, 2-p, 3-s, 4-q"}, "correctAnswer": "A", "explanation": "HTTP = Port 80 (q); HTTPS = Port 443 (p); FTP Control = Port 21 (Data = 20) & SSH = Port 22 (s); SMTP = Port 25 & POP3 = Port 110 (IMAP = 143) (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L09", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Addressing", "subtopic": "IPv4 Classes & Loopback", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "To which IPv4 address class does the IP address `192.168.10.25` belong, and which special IPv4 address (`127.0.0.1`) is reserved for local NIC Loopback testing?", "options": {"A": "Class C (192–223); Loopback is `127.0.0.1`", "B": "Class A (0–127); Loopback is `192.168.0.1`", "C": "Class B (128–191); Loopback is `255.255.255.0`", "D": "Class D (Multicast); Loopback is `0.0.0.0`"}, "correctAnswer": "A", "explanation": "IPv4 first octet ranges: Class A = 0–127 (`127.0.0.1` is localhost Loopback), Class B = 128–191, Class C = 192–223 (`192.168.x.x` is Class C private IP), Class D = 224–239 (Multicast), Class E = 240–255.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L10", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Networking Devices", "subtopic": "Modem Function", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What does the term '
