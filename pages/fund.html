en source code.", "rule": "Freeware is free in price ($0) like Adobe Reader or Skype, but its source code is CLOSED/proprietary. Open-Source Software (Linux, LibreOffice, Python) grants open access to view and modify the source code. Shareware is 'try before you buy' (free trial, then paid, e.g., WinRAR)."}, {"title": "5. Multiprogramming vs Multitasking vs Multiprocessing", "trap": "Treating Multiprogramming and Multiprocessing as synonyms.", "rule": "Multiprogramming and Multitasking run on a SINGLE CPU (Multiprogramming switches when a job waits for I/O; Multitasking/Time-sharing switches rapidly via time-quanta). Multiprocessing requires TWO OR MORE physical CPUs/cores executing instructions simultaneously in parallel."}, {"title": "6. Virus vs Worm vs Trojan Horse", "trap": "Thinking Trojans self-replicate or that Worms need a host file.", "rule": "Virus = needs a host file + human action to spread. Worm = standalone, self-replicates automatically over networks without a host file. Trojan = disguises as useful software, NEVER self-replicates, opens backdoors."}, {"title": "7. Phishing vs Pharming", "trap": "Calling any fake bank website attack 'Phishing'.", "rule": "Phishing lures victims into clicking a deceptive link in an email/SMS. Pharming redirects users to a fake website EVEN WHEN they type the correct URL, by poisoning DNS or modifying the local `hosts` file."}, {"title": "8. MS Word Font Size: 8–72 pt vs 1–1638 pt & Zoom 10%–500%", "trap": "Selecting 72 pt as the absolute maximum font size in MS Word.", "rule": "8 pt to 72 pt is ONLY the range shown in the Font Size dropdown list. By typing directly into the Font Size box, MS Word supports 1 pt to 1638 pt! Also remember: Word max zoom is 500%, whereas Excel and PowerPoint max zoom is 400%."}, {"title": "9. Ctrl+M and Ctrl+D across Word, Excel, and PowerPoint", "trap": "Pressing `Ctrl+N` to insert a new slide in PowerPoint or thinking `Ctrl+D` always does the same thing.", "rule": "In PowerPoint: `Ctrl+M` inserts a New Slide (`Ctrl+N` creates a new Presentation file), and `Ctrl+D` duplicates a slide/object. In Word: `Ctrl+M` increases Left Paragraph Indent (`Ctrl+T` is Hanging Indent) and `Ctrl+D` opens the Font dialog box. In Excel: `Ctrl+D` performs Fill Down."}, {"title": "10. Excel `=AVERAGE()` vs `=AVG()`, and `ROUND(n, -1)` vs `INT(-4.2)`", "trap": "Marking `=AVG(A1:A5)` as valid, or forgetting how negative `num_digits` in `ROUND` works.", "rule": "There is NO `=AVG()` function in Excel (it returns `#NAME?`); the correct function is `=AVERAGE()`. In `ROUND(146.8, -1)`, negative `-1` rounds to the nearest 10 (`150`) and `-2` rounds to the nearest 100 (`100`). And `INT(-4.2)` rounds DOWN to `-5`, whereas `TRUNC(-4.2)` gives `-4`."}, {"title": "11. FIND() vs SEARCH() and SUBSTITUTE() vs REPLACE() in Excel", "trap": "Swapping which text search function is case-sensitive.", "rule": "`FIND` is CASE-SENSITIVE (`=FIND(\"A\", \"apple\")` -> `#VALUE!`) and does not allow wildcards. `SEARCH` is CASE-INSENSITIVE (`=SEARCH(\"A\", \"apple\")` -> `1`) and allows `*` and `?` wildcards. `SUBSTITUTE` replaces matching text content, while `REPLACE` replaces by numeric position (`start_num`, `num_chars`)."}, {"title": "12. Footnote (`Ctrl+Alt+F`) vs Endnote (`Ctrl+Alt+D`) vs Header/Footer", "trap": "Confusing Footnotes with Footers.", "rule": "A Footer repeats in the bottom margin of EVERY page in a section (e.g., page numbers). A Footnote (`Ctrl+Alt+F`) appears only at the bottom of the specific page where a citation number `1` was inserted; an Endnote (`Ctrl+Alt+D`) appears at the very end of the document."}], "definitions": [{"term": "Accumulator (AC)", "module": "D", "definition": "A special-purpose CPU register inside the ALU that holds one operand before arithmetic/logical execution and stores the immediate result."}, {"term": "Active Cell", "module": "Q", "definition": "The currently selected cell in an MS Excel worksheet, outlined by a thick dark border with a Fill Handle in the bottom-right corner; its address appears in the Name Box."}, {"term": "Algorithm", "module": "K", "definition": "A finite, unambiguous, step-by-step procedure designed to solve a specific computational problem and terminate with a valid output."}, {"term": "ALU (Arithmetic Logic Unit)", "module": "D", "definition": "The digital circuit inside the CPU that executes all arithmetic (+, -, *, /) and bitwise/logical (AND, OR, NOT, XOR, comparison) operations."}, {"term": "ASCII", "module": "H", "definition": "American Standard Code for Information Interchange; a 7-bit character encoding standard representing 128 characters (0–127), with Extended ASCII using 8 bits (256 characters)."}, {"term": "Assembler", "module": "I", "definition": "A system software language translator that converts low-level Assembly Language mnemonics (e.g., MOV, ADD) into binary Machine Code."}, {"term": "AutoNumber", "module": "S", "definition": "An MS Access data type that automatically generates a unique sequential or random Long Integer (4 bytes) for each new record added to a table; commonly used as a Primary Key."}, {"term": "Backstage View", "module": "O", "definition": "Introduced in MS Office 2010 (replacing the 2007 round Office Button), accessed via the 'File' tab to manage file-level metadata, saving, printing, exporting, and protection."}, {"term": "BCD (Binary-Coded Decimal)", "module": "H", "definition": "A digital encoding scheme in which each decimal digit (0 to 9) is represented by its own 4-bit binary nibble (8421 code); bit patterns 1010 to 1111 are unused/invalid."}, {"term": "BIOS (Basic Input/Output System)", "module": "D", "definition": "Firmware permanently stored in a non-volatile Flash/ROM chip on the motherboard that runs POST at power-on and initializes the bootloader."}, {"term": "Bit & Nibble", "module": "G", "definition": "A Bit (Binary Digit: 0 or 1) is the smallest unit of data in a computer; a Nibble is a group of 4 bits (half a byte, equal to 1 Hexadecimal digit)."}, {"term": "Booting (Cold vs Warm)", "module": "D", "definition": "The process of loading the Operating System kernel into RAM. Cold booting starts from a powered-off state; Warm booting restarts an already powered-on computer."}, {"term": "Cache Memory", "module": "G", "definition": "Ultra-fast volatile SRAM located between the CPU and Main Memory (DRAM) in L1, L2, and L3 levels to store frequently accessed instructions and data."}, {"term": "Cell Reference (Relative, Absolute, Mixed)", "module": "Q", "definition": "The coordinate of an Excel cell (Column letter + Row number). `A1` is Relative, `$A$1` is Absolute, and `$A1` / `A$1` are Mixed references; toggled using `F4`."}, {"term": "CIA Triad", "module": "N", "definition": "The three foundational pillars of information security: Confidentiality (privacy), Integrity (accuracy/anti-tampering), and Availability (reliable access)."}, {"term": "CMOS", "module": "D", "definition": "Complementary Metal-Oxide-Semiconductor memory chip powered by a CR2032 coin battery on the motherboard that stores BIOS setup configurations and the system Real-Time Clock."}, {"term": "Compiler", "module": "I", "definition": "A language translator that scans and converts an entire High-Level Language program into machine/object code in a single batch, reporting all syntax errors together."}, {"term": "Control Unit (CU)", "module": "D", "definition": "The CPU component that acts as the central nervous system—fetching instructions, decoding opcodes, and generating timing and control signals for ALU, registers, and I/O."}, {"term": "Cookie", "module": "M", "definition": "A small piece of text data sent by a web server and stored by the user's web browser to remember stateful session logins, cart items, and user preferences."}, {"term": "Data Validation", "module": "Q", "definition": "An MS Excel feature (`Data -> Data Validation`) that restricts the type or range of values a user can enter into a cell (e.g., whole numbers between 1 and 100, or a dropdown list)."}, {"term": "Deadlock", "module": "J", "definition": "An operating system state where two or more processes are blocked indefinitely because each is holding a resource and waiting for another resource held by another process in the same cycle."}, {"term": "Defragmentation", "module": "I", "definition": "A disk utility process on magnetic Hard Disk Drives (HDDs) that consolidates scattered file fragments into contiguous sectors to reduce mechanical head seek time."}, {"term": "DHCP", "module": "L", "definition": "Dynamic Host Configuration Protocol (UDP ports 67/68); automatically assigns IP addresses, subnet masks, default gateways, and DNS server addresses to devices joining a network."}, {"term": "Digital Signature", "module": "M", "definition": "A cryptographic mechanism using the sender's Private Key to sign a message hash and the sender's Public Key for verification—guaranteeing Authentication, Integrity, and Non-Repudiation."}, {"term": "DMA (Direct Memory Access)", "module": "D", "definition": "A hardware mechanism where a DMA Controller transfers bulk data directly between high-speed I/O devices and Main Memory (RAM) without burdening the CPU."}, {"term": "DNS (Domain Name System)", "module": "L", "definition": "The distributed internet directory service (Port 53) that translates human-readable domain names (e.g., `dsssb.delhi.gov.in`) into numerical IP addresses."}, {"term": "Dot Pitch", "module": "F", "definition": "The diagonal distance in millimeters between two adjacent pixels/phosphor dots of the same color on a display monitor; a smaller dot pitch produces a sharper image."}, {"term": "DPI (Dots Per Inch)", "module": "F", "definition": "The standard metric of printer spatial resolution indicating how many individual ink/toner dots a printer can place within a linear one-inch span."}, {"term": "Drop Cap", "module": "P", "definition": "An MS Word typography feature (`Insert -> Drop Cap`) that formats the initial capital letter of a paragraph in a large font dropped across multiple lines (default 3, max 10)."}, {"term": "EBCDIC", "module": "H", "definition": "Extended Binary Coded Decimal Interchange Code; an 8-bit character encoding scheme (256 characters) developed by IBM for Mainframe computers."}, {"term": "EEPROM & Flash", "module": "G", "definition": "Electrically Erasable Programmable ROM that can be erased and rewritten using electrical pulses; Flash memory is a block-erased variant used in SSDs and USB drives."}, {"term": "Encryption & Decryption", "module": "N", "definition": "Encryption transforms readable Plaintext into unreadable Ciphertext using an algorithm and key; Decryption reverses Ciphertext back into Plaintext."}, {"term": "Firewall", "module": "N", "definition": "A network security device or software that monitors and filters incoming and outgoing network packets based on predefined security rules, acting as a barrier between trusted and untrusted networks."}, {"term": "Firmware", "module": "A", "definition": "Low-level control software permanently embedded into non-volatile hardware memory (ROM, EPROM, EEPROM, or Flash), such as a motherboard BIOS/UEFI or router OS."}, {"term": "Flash Fill", "module": "Q", "definition": "Introduced in MS Excel 2013 (`Ctrl + E`); automatically detects patterns in user data entry (like splitting or combining first/last names) and fills the remaining column without formulas."}, {"term": "FLOPS", "module": "A", "definition": "Floating-Point Operations Per Second; the standard performance benchmark for supercomputers (GigaFLOPS, TeraFLOPS, PetaFLOPS, ExaFLOPS)."}, {"term": "Footnote vs Endnote", "module": "P", "definition": "In MS Word (`References` tab), a Footnote (`Ctrl+Alt+F`) places citation notes at the bottom of the current page, whereas an Endnote (`Ctrl+Alt+D`) places them at the end of the document."}, {"term": "Foreign Key", "module": "S", "definition": "A field (or set of fields) in one relational table that refers to the Primary Key of another table, establishing a link between the two tables."}, {"term": "Format Painter", "module": "P", "definition": "An MS Office tool (`Home -> Clipboard`, `Ctrl+Shift+C` / `Ctrl+Shift+V`) that copies visual formatting from selected text/cells and applies it to another selection (double-click to apply multiple times)."}, {"term": "Freeze Panes", "module": "Q", "definition": "An MS Excel feature (`View -> Freeze Panes`) that locks specific top rows and/or left columns in place so headers remain visible while scrolling through a large worksheet."}, {"term": "Gateway", "module": "L", "definition": "A network node operating across all OSI layers that connects two networks using completely different protocols or architectures (protocol converter)."}, {"term": "Goal Seek", "module": "Q", "definition": "An MS Excel What-If Analysis tool (`Data -> What-If Analysis -> Goal Seek`) that calculates the exact single input value needed to achieve a known target result in a formula."}, {"term": "Gutter Margin", "module": "P", "definition": "Extra blank margin space added to the Left (side) or Top margin in MS Word (`Layout -> Margins -> Custom Margins`) to ensure text is not obscured when pages are bound into a book."}, {"term": "Hanging Indent", "module": "P", "definition": "A paragraph indentation style in MS Word (`Ctrl + T`) where the first line stays flush with the left margin while all subsequent lines of the paragraph are indented inward."}, {"term": "Instruction Register (IR)", "module": "D", "definition": "A CPU register inside the Control Unit that stores the machine instruction currently being decoded and executed."}, {"term": "Interpreter", "module": "I", "definition": "A language translator that converts and executes High-Level Language source code statement-by-statement at runtime, halting immediately at the first error."}, {"term": "IP Address (IPv4 & IPv6)", "module": "L", "definition": "A logical Layer-3 network address assigned to each host on a TCP/IP network: IPv4 is 32-bit dotted decimal (4 bytes); IPv6 is 128-bit hexadecimal (16 bytes)."}, {"term": "Kernel", "module": "J", "definition": "The core privileged program of an Operating System that stays resident in RAM and directly manages CPU scheduling, memory allocation, file systems, and hardware interrupts."}, {"term": "Linker & Loader", "module": "I", "definition": "A Linker combines compiled object files and library routines into a single executable file; a Loader is the OS component that copies the executable from disk into RAM to run."}, {"term": "MAC Address", "module": "L", "definition": "Media Access Control address; a globally unique 48-bit (6-byte, 12-hex-digit) hardware/physical address permanently burned into a Network Interface Card (NIC) operating at OSI Layer 2."}, {"term": "Mail Merge", "module": "P", "definition": "An MS Word feature (`Mailings` tab) that merges a template Main Document with a structured Data Source (Excel/Access/CSV) to batch-generate personalized letters, emails, envelopes, or labels."}, {"term": "MICR", "module": "E", "definition": "Magnetic Ink Character Recognition; a banking input technology that reads the 9-digit routing/clearing code printed with iron-oxide magnetic ink at the bottom of cheques."}, {"term": "Modem", "module": "L", "definition": "Modulator-Demodulator; a peripheral device that converts digital computer signals into analog carrier signals for transmission over telephone/cable lines (Modulation) and back to digital (Demodulation)."}, {"term": "Name Box", "module": "Q", "definition": "The box located to the left of the Formula Bar in MS Excel that displays the cell reference of the active cell (e.g., `A1`) or the name of a selected Named Range."}, {"term": "Parity Bit", "module": "H", "definition": "An extra redundant bit appended to binary data to make the total count of 1-bits always Even (Even Parity) or Odd (Odd Parity) for detecting single-bit transmission errors."}, {"term": "Pharming", "module": "N", "definition": "A cyberattack that redirects victims from a legitimate website URL to a fraudulent spoofed site by poisoning a DNS server or corrupting the victim's local `hosts` file."}, {"term": "Phishing", "module": "N", "definition": "A social engineering attack using fraudulent emails or messages impersonating trusted institutions to trick victims into clicking malicious links and revealing passwords or banking details."}, {"term": "PivotTable", "module": "Q", "definition": "An interactive MS Excel data summarization tool (`Insert -> PivotTable`) that dynamically groups, filters, counts, sums, or averages large flat tables across Rows, Columns, Values, and Filters."}, {"term": "POST (Power-On Self-Test)", "module": "D", "definition": "An automated hardware diagnostic test run by BIOS/UEFI firmware immediately when a computer is turned on to check RAM, keyboard, display, and disk controllers before booting."}, {"term": "Primary Key", "module": "S", "definition": "A field (or combination of fields) in an MS Access / RDBMS table that uniquely identifies every record; it can NEVER contain NULL values or duplicate values."}, {"term": "Program Counter (PC)", "module": "D", "definition": "A special-purpose CPU register that always holds the memory address of the NEXT instruction to be fetched from main memory."}, {"term": "Referential Integrity", "module": "S", "definition": "A relational database rule in MS Access ensuring that every Foreign Key value in a child table matches an existing Primary Key value in the parent table, preventing orphan records."}, {"term": "Section Break", "module": "P", "definition": "An MS Word layout marker (`Layout -> Breaks`: Next Page, Continuous, Even Page, Odd Page) that splits a document into independent sections with separate margins, orientations, columns, or headers."}, {"term": "Slide Master", "module": "R", "definition": "The top slide in MS PowerPoint's hierarchy (`View -> Slide Master`) that stores global theme fonts, colors, background graphics, and placeholder positioning for the entire presentation."}, {"term": "Slide Sorter View", "module": "R", "definition": "An MS PowerPoint view (`View -> Slide Sorter`) that displays miniature thumbnails of all slides in a grid, ideal for rearranging slide sequence, deleting slides, and reviewing transition timings."}, {"term": "SMPS", "module": "D", "definition": "Switched-Mode Power Supply; the internal power unit in a desktop cabinet that converts external AC mains power into regulated low-voltage DC power (+3.3V, +5V, +12V) for computer components."}, {"term": "Spooling", "module": "J", "definition": "Simultaneous Peripheral Operations On-Line; an OS buffering mechanism that places slow I/O jobs (such as documents sent to a printer) into a disk queue so the CPU can continue processing without waiting."}, {"term": "Thrashing", "module": "G", "definition": "A severe performance degradation in Virtual Memory systems where the OS spends more time swapping pages back and forth between RAM and disk than executing actual CPU instructions."}, {"term": "Track Changes", "module": "P", "definition": "An MS Word review mode (`Review -> Track Changes`, `Ctrl+Shift+E`) that records every insertion, deletion, and formatting edit made to a document so reviewers can Accept or Reject changes."}, {"term": "Unicode", "module": "H", "definition": "A universal character encoding standard (UTF-8, UTF-16, UTF-32) maintained by the Unicode Consortium capable of representing over 1.1 million characters across all world languages and emojis."}, {"term": "Virtual Memory", "module": "G", "definition": "An OS memory-management technique that uses disk space (swap/pagefile) as an extension of physical RAM so large or multiple programs can run even when they exceed physical RAM capacity."}], "memoryUnitsSheet": [{"unit": "1 Bit (b)", "binaryValue": "0 or 1 (Single Binary Digit)", "decimalApprox": "Smallest atomic unit of data", "examNote": "Implemented by a single flip-flop or capacitor charge"}, {"unit": "1 Nibble", "binaryValue": "4 Bits (2^2 Bits)", "decimalApprox": "1 Hexadecimal Digit (0–F)", "examNote": "2 Nibbles = 1 Byte"}, {"unit": "1 Byte (B) / Octet", "binaryValue": "8 Bits (2^3 Bits)", "decimalApprox": "1 ASCII Character", "examNote": "Basic addressable unit of modern computer memory"}, {"unit": "1 Kilobyte (KB / KiB)", "binaryValue": "1,024 Bytes = 2^10 Bytes = 2^13 Bits", "decimalApprox": "10^3 Bytes (1,000 B in SI)", "examNote": "IEC standard calls 1,024 B a Kibibyte (KiB)"}, {"unit": "1 Megabyte (MB / MiB)", "binaryValue": "1,024 KB = 2^20 Bytes = 2^23 Bits", "decimalApprox": "10^6 Bytes (~1 Million B)", "examNote": "1,048,576 Bytes"}, {"unit": "1 Gigabyte (GB / GiB)", "binaryValue": "1,024 MB = 2^30 Bytes = 2^33 Bits", "decimalApprox": "10^9 Bytes (~1 Billion B)", "examNote": "1,073,741,824 Bytes (Standard RAM sizing unit)"}, {"unit": "1 Terabyte (TB / TiB)", "binaryValue": "1,024 GB = 2^40 Bytes = 2^43 Bits", "decimalApprox": "10^12 Bytes (~1 Trillion B)", "examNote": "Standard modern HDD/SSD capacity unit"}, {"unit": "1 Petabyte (PB / PiB)", "binaryValue": "1,024 TB = 2^50 Bytes = 2^53 Bits", "decimalApprox": "10^15 Bytes (Quadrillion B)", "examNote": "Data center / supercomputer storage scale"}, {"unit": "1 Exabyte (EB / EiB)", "binaryValue": "1,024 PB = 2^60 Bytes = 2^63 Bits", "decimalApprox": "10^18 Bytes (Quintillion B)", "examNote": "64-bit address bus (`2^64` B) addresses 16 Exabytes"}, {"unit": "1 Zettabyte (ZB / ZiB)", "binaryValue": "1,024 EB = 2^70 Bytes = 2^73 Bits", "decimalApprox": "10^21 Bytes (Sextillion B)", "examNote": "Global annual internet traffic scale"}, {"unit": "1 Yottabyte (YB / YiB)", "binaryValue": "1,024 ZB = 2^80 Bytes = 2^83 Bits", "decimalApprox": "10^24 Bytes (Septillion B)", "examNote": "Mnemonic order: K -> M -> G -> T -> P -> E -> Z -> Y"}], "shortcutsCollection": [{"key": "Ctrl + A", "app": "Universal / All Apps", "action": "Select All content in active document, worksheet, or slide", "note": "In Excel, pressing inside a data table selects current region first, then entire sheet"}, {"key": "Ctrl + B", "app": "Universal / Office", "action": "Toggle Bold formatting on selected text/cells", "note": "Also `Ctrl + 2` in MS Excel toggles Bold"}, {"key": "Ctrl + C", "app": "Universal / All Apps", "action": "Copy selected text, cells, or objects to Clipboard", "note": "Office Clipboard can hold up to 24 items!"}, {"key": "Ctrl + D", "app": "Word / Excel / PPT", "action": "Word: Open Font Dialog | Excel: Fill Down | PowerPoint: Duplicate Slide/Object", "note": "High-frequency DSSSB trap—behavior differs across all 3 apps!"}, {"key": "Ctrl + E", "app": "Word / Excel / PPT", "action": "Word & PPT: Center Align Text | Excel (2013+): Flash Fill", "note": "Remember: Center align in Word is Ctrl+E, NOT Ctrl+C!"}, {"key": "Ctrl + F", "app": "Universal / Outlook", "action": "Open Find box / Navigation search | Outlook: Forward Email", "note": "Searches text within document/sheet"}, {"key": "Ctrl + G (or F5)", "app": "Word / Excel", "action": "Open 'Go To' tab in Find & Replace dialog (jump to page/line/cell)", "note": "In PowerPoint, `Ctrl+G` groups selected shapes!"}, {"key": "Ctrl + H", "app": "Word / Excel / PPT", "action": "Open 'Find and Replace' dialog box directly on the Replace tab", "note": "In web browsers, Ctrl+H opens Browsing History"}, {"key": "Ctrl + I", "app": "Universal / Office", "action": "Toggle Italic formatting on selected text/cells", "note": "Also `Ctrl + 3` in MS Excel toggles Italic"}, {"key": "Ctrl + J", "app": "MS Word / PowerPoint", "action": "Justify paragraph alignment (aligns text evenly along both Left and Right margins)", "note": "Verified DSSSB TGT CS 2021 PYQ"}, {"key": "Ctrl + K", "app": "Word / Excel / PPT / Outlook", "action": "Insert or Edit a Hyperlink", "note": "Universal across all MS Office applications"}, {"key": "Ctrl + L", "app": "Word / PPT / Excel", "action": "Word & PPT: Left Align paragraph | Excel: Create Table (same as Ctrl+T)", "note": "Default text alignment in Word"}, {"key": "Ctrl + M", "app": "MS Word vs PowerPoint", "action": "Word: Increase Left Paragraph Indent | PowerPoint: Insert a NEW SLIDE", "note": "Decrease Left Indent in Word is `Ctrl + Shift + M`"}, {"key": "Ctrl + N", "app": "Word / Excel / PPT", "action": "Create a brand-new blank Document (`DocumentN`), Workbook (`BookN`), or Presentation", "note": "Never confuse `Ctrl+N` (New Presentation) with `Ctrl+M` (New Slide) in PPT"}, {"key": "Ctrl + O", "app": "Universal / Office", "action": "Open an existing file (Backstage Open screen or `Ctrl+F12` dialog)", "note": "Works in all Office apps"}, {"key": "Ctrl + P", "app": "Universal / PPT Show", "action": "Open Print screen (`Ctrl+F2`) | During PPT Slide Show: Switch pointer to Annotation Pen", "note": "In PPT Show, `Ctrl+L` switches pointer to Laser Pointer"}, {"key": "Ctrl + Q", "app": "MS Word", "action": "Remove all paragraph formatting (resets indents/alignment to Normal style)", "note": "Compare with `Ctrl + Spacebar` which clears character/font formatting"}, {"key": "Ctrl + R", "app": "Word / Excel / Outlook", "action": "Word & PPT: Right Align paragraph | Excel: Fill Right | Outlook: Reply to Sender", "note": "`Ctrl + Shift + R` in Outlook = Reply All"}, {"key": "Ctrl + S (or Shift+F12)", "app": "Universal / Office", "action": "Save the active document, workbook, or presentation", "note": "`F12` opens 'Save As' dialog directly"}, {"key": "Ctrl + T", "app": "MS Word vs MS Excel", "action": "Word: Create a Hanging Indent | Excel: Create an Excel Table (`Ctrl+L`)", "note": "Verified DSSSB TGT CS 2021 PYQ (`Ctrl+Shift+T` reduces hanging indent)"}, {"key": "Ctrl + U", "app": "Universal / Office", "action": "Toggle single Underline on selected text/cells", "note": "Also `Ctrl + 4` in MS Excel toggles Underline"}, {"key": "Ctrl + V (or Shift+Insert)", "app": "Universal / Office", "action": "Paste cut or copied content from Clipboard", "note": "`Ctrl + Alt + V` opens Paste Special dialog"}, {"key": "Ctrl + W (or Ctrl+F4)", "app": "Universal / Office", "action": "Close the currently active document/workbook window without exiting the app", "note": "`Alt + F4` exits the entire application"}, {"key": "Ctrl + X (or Shift+Delete)", "app": "Universal / Office", "action": "Cut selected text, cells, or objects to Clipboard", "note": "In Windows Explorer, `Shift+Delete` permanently deletes a file bypassing Recycle Bin"}, {"key": "Ctrl + Y (or F4)", "app": "Universal / Office", "action": "Redo the last undone action, or Repeat the last command", "note": "Works alongside `Ctrl + Z`"}, {"key": "Ctrl + Z (or Alt+Backspace)", "app": "Universal / Office", "action": "Undo the last action performed", "note": "Essential editing shortcut"}, {"key": "Ctrl + =", "app": "MS Word", "action": "Toggle Subscript formatting (e.g., H2O)", "note": "In Excel, `Alt + =` inserts AutoSum (`=SUM()`)"}, {"key": "Ctrl + Shift + +", "app": "MS Word / Excel", "action": "Word: Toggle Superscript (e.g., x^2) | Excel: Insert new cells/rows/columns dialog", "note": "In Excel, `Ctrl + -` (Minus) deletes cells/rows/columns"}, {"key": "Ctrl + ] and Ctrl + [", "app": "MS Word", "action": "Increase (`Ctrl+]`) or Decrease (`Ctrl+[`) font size by exactly 1 point", "note": "`Ctrl+Shift+>` and `Ctrl+Shift+<` step through dropdown sizes"}, {"key": "Ctrl + 1 / 2 / 5", "app": "MS Word vs MS Excel", "action": "Word: Single (1), Double (2), or 1.5 (5) Line Spacing | Excel: Format Cells (1), Bold (2), Strikethrough (5)", "note": "Classic Word vs Excel shortcut contrast"}, {"key": "Ctrl + Enter", "app": "MS Word / MS Excel", "action": "Word: Insert Page Break | Excel: Fill ALL selected cells simultaneously with the current entry", "note": "`Ctrl + Shift + Enter` in Word = Column Break; in legacy Excel = Array Formula `{}`"}, {"key": "Shift + Enter / Alt + Enter", "app": "MS Word vs MS Excel", "action": "Word (`Shift+Enter`): Manual Line Break without new paragraph | Excel (`Alt+Enter`): New line inside SAME cell", "note": "Very frequently tested in MS Excel practical MCQs"}, {"key": "Ctrl + ; and Ctrl + Shift + :", "app": "MS Excel", "action": "`Ctrl + ;` inserts static Current Date | `Ctrl + Shift + :` inserts static Current Time", "note": "Unlike `=TODAY()` and `=NOW()`, these keyboard shortcuts insert static values"}, {"key": "Shift + Spacebar / Ctrl + Spacebar", "app": "MS Excel / MS Word", "action": "Excel: `Shift+Space` = Select Entire Row; `Ctrl+Space` = Select Entire Column | Word: `Ctrl+Space` = Clear Font Formatting", "note": "Pressing both (`Ctrl+Shift+Space`) in Excel selects the entire worksheet"}, {"key": "Ctrl + ~ (Grave Accent)", "app": "MS Excel", "action": "Toggle between displaying Formula strings (`=SUM(A1:A5)`) and Formula Results in all cells", "note": "Also available under `Formulas -> Show Formulas`"}, {"key": "F1 to F12 (Key Highlights)", "app": "MS Office Suite", "action": "F1: Help | F2: Edit Cell (Excel) | Shift+F3: Change Case (Word)/Insert Function (Excel) | F4: Lock `$A$1` | F5: Slide Show (PPT)/Go To | F7: Spell Check | Shift+F7: Thesaurus | F9: Recalculate | F11: New Chart Sheet | Shift+F11: New Worksheet | Alt+F11: VBA | F12: Save As", "note": "Master all 12 function keys for guaranteed marks"}, {"key": "Win + L / Win + D / Win + E / Win + R", "app": "Windows OS", "action": "`Win+L`: Lock PC | `Win+D`: Show/Hide Desktop | `Win+E`: Open File Explorer | `Win+R`: Open Run dialog | `Win+V`: Clipboard History", "note": "`Ctrl + Shift + Esc` opens Windows Task Manager directly!"}], "excelFormulasSheet": [{"name": "SUM", "category": "Arithmetic & Statistical", "syntax": "=SUM(number1, [number2], ...)", "version": "All Versions", "purpose": "Adds all numbers in a range of cells, ignoring text and logical values inside ranges.", "example": "=SUM(10, 20, 30) -> 60; if A1:A3 = {15, \"Hi\", 25}, =SUM(A1:A3) -> 40"}, {"name": "AVERAGE", "category": "Arithmetic & Statistical", "syntax": "=AVERAGE(number1, [number2], ...)", "version": "All Versions", "purpose": "Returns the arithmetic mean of numeric arguments (ignores text, booleans, and empty cells). Note: =AVG() does NOT exist!", "example": "If A1:A4 = {10, 20, 30, \"\"}, =AVERAGE(A1:A4) -> (10+20+30)/3 = 20"}, {"name": "COUNT", "category": "Arithmetic & Statistical", "syntax": "=COUNT(value1, [value2], ...)", "version": "All Versions", "purpose": "Counts the number of cells in a range that contain ONLY numbers (including dates/times).", "example": "If A1:A5 = {12, \"Text\", TRUE, 0, \"\"}, =COUNT(A1:A5) -> 2"}, {"name": "COUNTA", "category": "Arithmetic & Statistical", "syntax": "=COUNTA(value1, [value2], ...)", "version": "All Versions", "purpose": "Counts the number of cells in a range that are NOT empty (numbers, text, booleans, errors).", "example": "If A1:A5 = {12, \"Text\", TRUE, 0, \"\"}, =COUNTA(A1:A5) -> 4"}, {"name": "COUNTBLANK", "category": "Arithmetic & Statistical", "syntax": "=COUNTBLANK(range)", "version": "All Versions", "purpose": "Counts the number of empty (blank) cells in a specified range.", "example": "If A1:A5 has 3 filled cells and 2 empty cells, =COUNTBLANK(A1:A5) -> 2"}, {"name": "MAX & MIN", "category": "Arithmetic & Statistical", "syntax": "=MAX(number1, ...) / =MIN(number1, ...)", "version": "All Versions", "purpose": "Returns the largest (`MAX`) or smallest (`MIN`) numeric value in a set of values, ignoring text and logicals in ranges.", "example": "=MAX(14, 89, 42, -5) -> 89 | =MIN(14, 89, 42, -5) -> -5"}, {"name": "ROUND", "category": "Arithmetic & Statistical", "syntax": "=ROUND(number, num_digits)", "version": "All Versions", "purpose": "Rounds a number to a specified number of digits (`>0` decimals, `0` nearest integer, `<0` left of decimal point).", "example": "=ROUND(278.56, 1) -> 278.6 | =ROUND(278.56, -1) -> 280 | =ROUND(278.56, -2) -> 300"}, {"name": "ROUNDUP & ROUNDDOWN", "category": "Arithmetic & Statistical", "syntax": "=ROUNDUP(number, num_digits) / =ROUNDDOWN(number, num_digits)", "version": "All Versions", "purpose": "`ROUNDUP` always rounds away from zero; `ROUNDDOWN` always rounds toward zero.", "example": "=ROUNDUP(3.11, 1) -> 3.2 | =ROUNDDOWN(3.99, 0) -> 3"}, {"name": "INT & TRUNC", "category": "Arithmetic & Statistical", "syntax": "=INT(number) / =TRUNC(number, [num_digits])", "version": "All Versions", "purpose": "`INT` rounds a number DOWN to the nearest integer (`<= number`); `TRUNC` simply removes the fractional part.", "example": "=INT(8.9) -> 8 | =INT(-8.2) -> -9 (Trap!) | =TRUNC(-8.2) -> -8"}, {"name": "MOD", "category": "Arithmetic & Statistical", "syntax": "=MOD(number, divisor)", "version": "All Versions", "purpose": "Returns the remainder after `number` is divided by `divisor`. Formula: `n - d*INT(n/d)`. Result has same sign as `divisor`.", "example": "=MOD(17, 5) -> 2 | =MOD(-7, 3) -> 2 | =MOD(7, 0) -> #DIV/0!"}, {"name": "ABS, POWER & SQRT", "category": "Arithmetic & Statistical", "syntax": "=ABS(x) / =POWER(base, exp) / =SQRT(x)", "version": "All Versions", "purpose": "`ABS` returns absolute non-negative value; `POWER` raises base to exponent; `SQRT` returns positive square root (`x < 0` throws `#NUM!`).", "example": "=ABS(-45) -> 45 | =POWER(2, 5) -> 32 | =SQRT(144) -> 12"}, {"name": "IF", "category": "Logical", "syntax": "=IF(logical_test, [value_if_true], [value_if_false])", "version": "All Versions", "purpose": "Evaluates a condition and returns one value if TRUE and another if FALSE.", "example": "=IF(85>=40, \"Pass\", \"Fail\") -> \"Pass\""}, {"name": "IFS", "category": "Logical", "syntax": "=IFS(test1, val1, [test2, val2], ...)", "version": "Excel 2019 / 2021 / M365", "purpose": "Checks multiple conditions sequentially and returns the value corresponding to the FIRST TRUE condition (replaces deeply nested IFs).", "example": "=IFS(A1>=90, \"A\", A1>=75, \"B\", TRUE, \"C\")"}, {"name": "AND, OR & NOT", "category": "Logical", "syntax": "=AND(logical1, ...) / =OR(logical1, ...) / =NOT(logical)", "version": "All Versions", "purpose": "`AND` returns TRUE only if ALL arguments are TRUE; `OR` returns TRUE if AT LEAST ONE argument is TRUE; `NOT` reverses TRUE/FALSE.", "example": "=AND(5>2, 10<20) -> TRUE | =OR(5>10, 2=2) -> TRUE | =NOT(5>2) -> FALSE"}, {"name": "IFERROR & IFNA", "category": "Logical", "syntax": "=IFERROR(value, value_if_error) / =IFNA(value, value_if_na)", "version": "Excel 2007+ (IFERROR) / 2013+ (IFNA)", "purpose": "`IFERROR` catches ANY error (`#N/A`, `#DIV/0!`, `#VALUE!`, `#REF!`, `#NAME?`, `#NUM!`, `#NULL!`) and returns a fallback value; `IFNA` catches only `#N/A`.", "example": "=IFERROR(10/0, 0) -> 0"}, {"name": "LEFT, RIGHT & MID", "category": "Text", "syntax": "=LEFT(text, [num_chars]) / =RIGHT(text, [num_chars]) / =MID(text, start_num, num_chars)", "version": "All Versions", "purpose": "Extracts substring characters from the start (`LEFT`), end (`RIGHT`), or middle (`MID`, 1-indexed) of a text string.", "example": "=LEFT(\"COMPUTER\", 4) -> \"COMP\" | =RIGHT(\"COMPUTER\", 3) -> \"TER\" | =MID(\"COMPUTER\", 4, 3) -> \"PUT\""}, {"name": "LEN & TRIM", "category": "Text", "syntax": "=LEN(text) / =TRIM(text)", "version": "All Versions", "purpose": "`LEN` counts total characters including spaces; `TRIM` removes leading/trailing spaces and reduces multiple internal spaces to a single space.", "example": "=LEN(\"MS WORD\") -> 7 | =LEN(TRIM(\"  MS   WORD  \")) -> 7"}, {"name": "UPPER, LOWER & PROPER", "category": "Text", "syntax": "=UPPER(text) / =LOWER(text) / =PROPER(text)", "version": "All Versions", "purpose": "Converts text to ALL CAPS (`UPPER`), all lowercase (`LOWER`), or Title Case where the first letter of each word is capitalized (`PROPER`).", "example": "=PROPER(\"dsssb tgt computer science\") -> \"Dsssb Tgt Computer Science\""}, {"name": "CONCAT, CONCATENATE & TEXTJOIN", "category": "Text", "syntax": "=CONCAT(text1, ...) / =TEXTJOIN(delimiter, ignore_empty, text1, ...)", "version": "CONCAT/TEXTJOIN: 2019/2021/M365", "purpose": "Joins multiple text strings. `CONCAT` supports ranges (unlike legacy `CONCATENATE`); `TEXTJOIN` inserts a delimiter between items and can ignore blanks.", "example": "=TEXTJOIN(\"-\", TRUE, \"DSSSB\", \"\", \"2025\") -> \"DSSSB-2025\""}, {"name": "FIND vs SEARCH", "category": "Text", "syntax": "=FIND(find_text, within_text, [start_num]) / =SEARCH(find_text, within_text, [start_num])", "version": "All Versions", "purpose": "Returns 1-based starting position of a substring. `FIND` is CASE-SENSITIVE (no wildcards); `SEARCH` is CASE-INSENSITIVE (allows `?` and `*`).", "example": "=FIND(\"S\", \"DSSSB\") -> 2 | =FIND(\"s\", \"DSSSB\") -> #VALUE! | =SEARCH(\"s\", \"DSSSB\") -> 2"}, {"name": "SUBSTITUTE vs REPLACE", "category": "Text", "syntax": "=SUBSTITUTE(text, old_text, new_text, [instance_num]) / =REPLACE(old_text, start_num, num_chars, new_text)", "version": "All Versions", "purpose": "`SUBSTITUTE` replaces specific matching text; `REPLACE` replaces characters by numeric start position and length.", "example": "=SUBSTITUTE(\"2024-2024\", \"2024\", \"2025\", 2) -> \"2024-2025\" | =REPLACE(\"ABCDEF\", 3, 2, \"99\") -> \"AB99EF\""}, {"name": "TODAY & NOW", "category": "Date & Time", "syntax": "=TODAY() / =NOW()", "version": "All Versions", "purpose": "Volatile functions taking ZERO arguments: `TODAY()` returns current system date; `NOW()` returns current system date and time.", "example": "=YEAR(TODAY()) -> Current Year"}, {"name": "DATE, DAY, MONTH & YEAR", "category": "Date & Time", "syntax": "=DATE(year, month, day) / =DAY(serial) / =MONTH(serial) / =YEAR(serial)", "version": "All Versions", "purpose": "Constructs a valid Excel serial date (`DATE`) or extracts the day (`1–31`), month (`1–12`), or 4-digit year from a date.", "example": "=MONTH(DATE(2025, 9, 12)) -> 9"}, {"name": "DATEDIF & EOMONTH", "category": "Date & Time", "syntax": "=DATEDIF(start_date, end_date, unit) / =EOMONTH(start_date, months)", "version": "All Versions", "purpose": "`DATEDIF` calculates difference between two dates in `\"Y\"`, `\"M\"`, or `\"D\"`; `EOMONTH` returns the last calendar day of the month `N` months away.", "example": "=EOMONTH(\"2025-02-10\", 0) -> 2025-02-28"}, {"name": "VLOOKUP & HLOOKUP", "category": "Lookup & Reference", "syntax": "=VLOOKUP(lookup_val, table_array, col_index_num, [range_lookup])", "version": "All Versions", "purpose": "Searches for `lookup_val` in the 1st column (`VLOOKUP`) or 1st row (`HLOOKUP`) and returns a value from the specified column/row index (`FALSE`/`0` = exact match).", "example": "=VLOOKUP(102, A2:D10, 3, FALSE) -> Returns value from 3rd column of A2:D10"}, {"name": "INDEX & MATCH", "category": "Lookup & Reference", "syntax": "=INDEX(array, row_num, [col_num]) / =MATCH(lookup_val, lookup_array, [match_type])", "version": "All Versions", "purpose": "`INDEX` returns the value at a given row/column intersection; `MATCH` returns the relative numeric position (`1, 2, 3...`) of an item in a range (`0` = exact match).", "example": "=INDEX(A2:A10, MATCH(500, B2:B10, 0)) -> Looks left seamlessly!"}, {"name": "XLOOKUP", "category": "Lookup & Reference", "syntax": "=XLOOKUP(lookup_val, lookup_array, return_array, [if_not_found], [match_mode], [search_mode])", "version": "Excel 2021 / Microsoft 365", "purpose": "Modern replacement for VLOOKUP/HLOOKUP/INDEX-MATCH; looks in any direction and defaults to Exact Match (`0`).", "example": "=XLOOKUP(E2, B2:B50, A2:A50, \"Not Found\")"}, {"name": "FILTER, UNIQUE & SORT", "category": "Dynamic Array (M365 / 2021)", "syntax": "=FILTER(array, include, [if_empty]) / =UNIQUE(array) / =SORT(array, [sort_index], [sort_order])", "version": "Excel 2021 / Microsoft 365", "purpose": "Dynamic array functions that automatically 'spill' results into neighboring cells to filter rows, extract unique values, or sort ranges dynamically.", "example": "=UNIQUE(B2:B20) -> Spills list of distinct values"}], "fileExtensionsSheet": [{"ext": ".docx / .doc", "category": "MS Word Documents", "app": "Microsoft Word", "details": "`.docx` = Word 2007+ OpenXML Document (No Macros); `.doc` = Word 97–2003 Binary Document"}, {"ext": ".dotx / .dot / .docm", "category": "MS Word Templates & Macros", "app": "Microsoft Word", "details": "`.dotx` = Word 2007+ Template; `.dot` = Word 97–2003 Template; `.docm` = Word Macro-Enabled Document"}, {"ext": ".rtf / .txt / .odt", "category": "Text & Cross-Platform Docs", "app": "WordPad / Notepad / LibreOffice Writer", "details": "`.rtf` = Rich Text Format; `.txt` = Unformatted Plain Text; `.odt` = OpenDocument Text"}, {"ext": ".xlsx / .xls", "category": "MS Excel Spreadsheets", "app": "Microsoft Excel", "details": "`.xlsx` = Excel 2007+ OpenXML Workbook (No Macros); `.xls` = Excel 97–2003 Binary Workbook"}, {"ext": ".xlsm / .xlsb / .xltx", "category": "MS Excel Macros, Binary & Templates", "app": "Microsoft Excel", "details": "`.xlsm` = Macro-Enabled Workbook; `.xlsb` = Binary Workbook (fast loading for huge files); `.xltx` = Excel 2007+ Template; `.xlam` = Excel Add-in"}, {"ext": ".csv / .ods", "category": "Data & Open Spreadsheets", "app": "Excel / Calc / Databases", "details": "`.csv` = Comma-Separated Values (plain text tabular data); `.ods` = OpenDocument Spreadsheet"}, {"ext": ".pptx / .ppt", "category": "MS PowerPoint Presentations", "app": "Microsoft PowerPoint", "details": "`.pptx` = PowerPoint 2007+ OpenXML Presentation; `.ppt` = PowerPoint 97–2003 Binary Presentation"}, {"ext": ".ppsx / .potx / .pptm", "category": "PowerPoint Show, Template & Macro", "app": "Microsoft PowerPoint", "details": "`.ppsx` = Slide Show (opens directly in full-screen presentation mode!); `.potx` = Template; `.pptm` = Macro-Enabled Presentation"}, {"ext": ".accdb / .mdb / .accde", "category": "MS Access Databases", "app": "Microsoft Access", "details": "`.accdb` = Access 2007+ Database; `.mdb` = Access 97–2003 Database; `.accde` = Execute-only compiled database"}, {"ext": ".pst / .ost / .msg / .one", "category": "Outlook & OneNote", "app": "MS Outlook & MS OneNote", "details": "`.pst` = Personal Storage Table; `.ost` = Offline Storage Table; `.msg` = Single Outlook Email; `.one` = OneNote Section"}, {"ext": ".pdf / .html / .xml / .json", "category": "Portable & Web Formats", "app": "Acrobat / Web Browsers", "details": "`.pdf` = Portable Document Format (Adobe); `.html` = HyperText Markup Language; `.xml` = Extensible Markup Language; `.json` = JavaScript Object Notation"}, {"ext": ".jpg / .png / .gif / .svg / .bmp", "category": "Image & Vector Graphics", "app": "Graphics & Web", "details": "`.jpg/.jpeg` = Lossy photo compression (Joint Photographic Experts Group); `.png` = Lossless Portable Network Graphics with transparency; `.gif` = 8-bit 256-color animated Graphics Interchange Format; `.svg` = Scalable Vector Graphics; `.bmp` = Uncompressed Windows Bitmap"}, {"ext": ".mp3 / .wav / .aac / .flac / .mid", "category": "Audio Formats", "app": "Media Players", "details": "`.mp3` = MPEG-1 Audio Layer 3 (lossy); `.wav` = Uncompressed Waveform Audio; `.mid/.midi` = Musical Instrument Digital Interface"}, {"ext": ".mp4 / .avi / .mkv / .mov / .wmv", "category": "Video Formats", "app": "Video Players", "details": "`.mp4` = MPEG-4 Part 14 multimedia container; `.avi` = Audio Video Interleave (Microsoft); `.mov` = Apple QuickTime"}, {"ext": ".zip / .rar / .7z / .tar / .gz", "category": "Compressed Archives", "app": "WinZip / WinRAR / 7-Zip", "details": "Lossless archive compression formats bundling multiple files/folders"}, {"ext": ".exe / .bat / .msi / .dll / .sys / .ini", "category": "Executable & System Files", "app": "Windows OS", "details": "`.exe` = Executable program; `.bat` = Batch script; `.dll` = Dynamic Link Library; `.sys` = System driver/kernel file; `.ini` = Initialization configuration file"}], "lastMinuteHighYield": ["1. First General-Purpose Mechanical Computer Blueprint: **Analytical Engine (1837)** by **Charles Babbage**; First Programmer: **Lady Ada Lovelace**.", "2. First General-Purpose Electronic Digital Computer: **ENIAC (1945)** by Eckert & Mauchly; First Operational Stored-Program Computer: **EDSAC (1949)** by Maurice Wilkes; First Commercial Computer: **UNIVAC-I (1951)**.", "3. First Commercial Microprocessor: **Intel 4004** (4-bit, 1971, Ted Hoff); World's First Supercomputer: **CDC 6600 / Cray-1** (Seymour Cray); India's First Supercomputer: **PARAM 8000** (1991, C-DAC Pune, Dr. Vijay Bhatkar).", "4. Address & Data Lines Formula: For a memory chip of capacity **$2^k \\times N$**, Address Lines = **$k$** (unidirectional) and Data Lines = **$N$** (bidirectional). Example: $2\\text{K} \\times 16 = 2^{11} \\times 16 \\Rightarrow$ **11 address lines, 16 data lines**.", "5. CPU Registers: **Program Counter (PC)** = address of NEXT instruction; **Instruction Register (IR)** = CURRENT instruction being decoded; **MAR** = address to read/write; **MBR/MDR** = data read/written.", "6. Cache Memory is made of **SRAM** (fast, flip-flops, no refresh needed); Main RAM is made of **DRAM** (capacitors, needs periodic refresh). Both are **Volatile**.", "7. **EPROM** is erased using **Ultraviolet (UV) light** (entire chip); **EEPROM** is erased using **Electrical signals** (byte-by-byte); **Flash** is erased in **blocks**.", "8. Optical Disc Lasers: **CD** = 700 MB (780 nm Infrared); **DVD** = 4.7 GB SL / 8.5 GB DL (650 nm Red); **Blu-ray** = 25 GB SL / 50 GB DL (405 nm Blue-violet).", "9. **MICR** reads 9-digit iron-oxide magnetic ink codes on bank cheques (`[3 City][3 Bank][3 Branch]`); **OMR** reads shaded exam bubbles; **OCR** converts scanned text into editable ASCII/Unicode.", "10. **Impact Printers** (Dot Matrix, Daisy Wheel, Drum, Chain) strike a ribbon and CAN print carbon copies; **Non-Impact Printers** (Laser, Inkjet, Thermal) are quiet and CANNOT print carbon copies.", "11. **Virus** needs a host file & user action; **Worm** self-replicates automatically over networks without a host file; **Trojan Horse** disguises as useful software and NEVER self-replicates.", "12. **Phishing** tricks users via fake email links; **Pharming** poisons DNS or the `hosts` file to redirect users without clicking a link.", "13. MS Word Limits: Dropdown Font Size = **8 to 72 pt**; Manual Font Size = **1 to 1638 pt**; Zoom = **10% to 500%**; Drop Cap default = **3 lines**, max = **10 lines**; Max table columns = **63**.", "14. MS Word Shortcuts: Justify = `Ctrl+J`; Center = `Ctrl+E`; Hanging Indent = `Ctrl+T`; Left Indent = `Ctrl+M`; Footnote = `Ctrl+Alt+F`; Endnote = `Ctrl+Alt+D`; Track Changes = `Ctrl+Shift+E`; Spell Check = `F7`; Thesaurus = `Shift+F7`; Change Case = `Shift+F3`; Page Break = `Ctrl+Enter`; Column Break = `Ctrl+Shift+Enter`; Line Break = `Shift+Enter`.", "15. MS Excel Grid (2007+): **1,048,576 Rows** (`1` to `1048576`) and **16,384 Columns** (`A` to `XFD`); Zoom = **10% to 400%**; Default Alignment: **Text = Left, Numbers/Dates = Right, Logical/Errors = Center**.", "16. MS Excel Function Traps: There is NO `=AVG()` function (throws `#NAME?`, use `=AVERAGE()`); `COUNT` counts only numbers; `COUNTA` counts all non-empty cells; `ROUND(275.4, -1)` = `280`; `INT(-4.2)` = `-5`; `FIND` is case-sensitive, `SEARCH` is case-insensitive.", "17. MS Excel Shortcuts: Edit cell = `F2`; Lock `$A$1` = `F4`; New line inside cell = `Alt+Enter`; Current Date = `Ctrl+;`; Current Time = `Ctrl+Shift+:`; Select Row = `Shift+Space`; Select Column = `Ctrl+Space`; Flash Fill = `Ctrl+E`; AutoSum = `Alt+=`; Show Formulas = `Ctrl+~`; New Chart Sheet = `F11`; New Worksheet = `Shift+F11`.", "18. MS PowerPoint Traps: New Slide = **`Ctrl+M`** (New Presentation = `Ctrl+N`); Start Show from Beginning = **`F5`**; Start Show from Current Slide = **`Shift+F5`**; Zoom = **10% to 400%**; Handouts per page = **1, 2, 3, 4, 6, 9** (`3` prints note lines); `.ppsx` opens directly in Slide Show mode.", "19. MS Access: 6 Objects = **Tables, Queries, Forms, Reports, Macros, Modules** (only Tables store data); Short Text max = **255 chars**; Primary Key = Unique + NOT NULL; Action Queries = **Make-Table, Append, Update, Delete**.", "20. MS Outlook & OneNote: `.pst` (Personal Storage Table) vs `.ost` (Offline Storage Table); Send/Receive = `F9`; OneNote hierarchy = **Notebook -> Section -> Page** (auto-saves continuously with NO Save button)."], "excelLabFormulas": [{"id": "F-01", "func": "SUM", "category": "Arithmetic & Statistical", "formula": "=SUM(C2:C6)", "result": "385", "explanation": "Adds all numeric Marks in cells C2 through C6: 85 + 92 + 78 + 64 + 66 = 385.", "trap": "SUM ignores text and boolean values inside a range (e.g., if C4 had 'Absent', it would simply add the remaining numbers).", "quizQ": "If cells A1:A4 contain 10, 20, \"NA\", and 30, what does =SUM(A1:A4) return?", "quizAns": "60"}, {"id": "F-02", "func": "AVERAGE", "category": "Arithmetic & Statistical", "formula": "=AVERAGE(C2:C6)", "result": "77", "explanation": "Computes the arithmetic mean of C2:C6: (85 + 92 + 78 + 64 + 66) / 5 = 385 / 5 = 77.", "trap": "Writing =AVG(C2:C6) returns #NAME?! Also, empty cells and text cells are excluded from the denominator.", "quizQ": "If A1=10, A2=20, A3 is empty, and A4=30, what is =AVERAGE(A1:A4)?", "quizAns": "20"}, {"id": "F-03", "func": "COUNT", "category": "Arithmetic & Statistical", "formula": "=COUNT(A2:E6)", "result": "15", "explanation": "Counts ONLY numeric cells (including Dates) in the 5x5 range A2:E6: Columns A (Roll No: 5), C (Marks: 5), and D (Fee Paid: 5) are numeric = 15 cells.", "trap": "COUNT ignores text strings (Column B Names) and Boolean/Text status.", "quizQ": "In a range of 6 cells containing {100, \"Pass\", TRUE, 0, \"\", -5}, what does =COUNT() return?", "quizAns": "3"}, {"id": "F-04", "func": "COUNTA", "category": "Arithmetic & Statistical", "formula": "=COUNTA(B2:B6)", "result": "5", "explanation": "Counts all non-empty cells in B2:B6 (Aarav, Diya, Kabir, Meera, Rohan) = 5.", "trap": "COUNTA counts numbers, text, booleans, error values, and even formulas returning an empty string \"\".", "quizQ": "If 8 out of 10 cells in A1:A10 contain text or numbers and 2 are completely blank, what is =COUNTA(A1:A10)?", "quizAns": "8"}, {"id": "F-05", "func": "COUNTBLANK", "category": "Arithmetic & Statistical", "formula": "=COUNTBLANK(E2:E6)", "result": "1", "explanation": "Counts empty cells in the Scholarship Status range E2:E6 (Row 5 'Meera' has an empty cell in E5) = 1.", "trap": "Cells containing 0 (zero) or a space character \" \" are NOT blank and are not counted by COUNTBLANK.", "quizQ": "If cell B1 contains the number 0, is it counted by =COUNTBLANK(B1)?", "quizAns": "No (0)"}, {"id": "F-06", "func": "MAX", "category": "Arithmetic & Statistical", "formula": "=MAX(C2:C6)", "result": "92", "explanation": "Finds the highest numeric score in C2:C6 {85, 92, 78, 64, 66} -> 92 (Diya).", "trap": "MAX ignores text and logical values inside a cell range.", "quizQ": "What is the output of =MAX(-15, -4, -29, -8)?", "quizAns": "-4"}, {"id": "F-07", "func": "MIN", "category": "Arithmetic & Statistical", "formula": "=MIN(C2:C6)", "result": "64", "explanation": "Finds the lowest numeric score in C2:C6 {85, 92, 78, 64, 66} -> 64 (Meera).", "trap": "If a cell contains 0, MIN will return 0 if all other numbers are positive; empty cells are ignored.", "quizQ": "What is the output of =MIN(12, 5, 0, 8)?", "quizAns": "0"}, {"id": "F-08", "func": "IF", "category": "Logical", "formula": "=IF(C2>=80, \"Distinction\", \"Merit\")", "result": "Distinction", "explanation": "Since C2 (85) >= 80 is TRUE, IF returns the 2nd argument \"Distinction\".", "trap": "Text literals inside Excel formulas must always be enclosed in double quotes (\"Distinction\"), otherwise Excel returns #NAME?.", "quizQ": "If C5=64, what does =IF(C5>=75, \"A\", IF(C5>=60, \"B\", \"C\")) return?", "quizAns": "B"}, {"id": "F-09", "func": "AND", "category": "Logical", "formula": "=AND(C2>=80, D2>=15000)", "result": "TRUE", "explanation": "Evaluates whether BOTH C2 (85)>=80 AND D2 (15000)>=15000 are true. Both hold, so it returns TRUE.", "trap": "If even one condition inside AND() is FALSE, the entire AND() returns FALSE.", "quizQ": "What does =AND(10>5, 4=4, 3>8) return?", "quizAns": "FALSE"}, {"id": "F-10", "func": "OR", "category": "Logical", "formula": "=OR(C5>=80, D5>=12000)", "result": "TRUE", "explanation": "For Row 5 (Meera), C5=64 (>=80 is FALSE), but D5=12000 (>=12000 is TRUE). Since at least one condition is TRUE, OR returns TRUE.", "trap": "OR returns FALSE only when EVERY single condition is FALSE.", "quizQ": "What does =OR(2>5, 10<3, 7=7) return?", "quizAns": "TRUE"}, {"id": "F-11", "func": "NOT", "category": "Logical", "formula": "=NOT(C4>=80)", "result": "TRUE", "explanation": "In Row 4 (Kabir), C4 is 78. C4>=80 evaluates to FALSE, and NOT(FALSE) reverses it to TRUE.", "trap": "NOT takes only a single logical argument; passing multiple arguments causes an error.", "quizQ": "What is the output of =NOT(100>50)?", "quizAns": "FALSE"}, {"id": "F-12", "func": "IFERROR", "category": "Logical", "formula": "=IFERROR(C2/0, \"Invalid Division\")", "result": "Invalid Division", "explanation": "Since C2/0 causes a #DIV/0! error, IFERROR intercepts it and outputs the fallback string \"Invalid Division\".", "trap": "If the first expression has no error (e.g., =IFERROR(85/5, 0)), IFERROR simply returns the normal result 17.", "quizQ": "What does =IFERROR(20/4, \"Error\") return?", "quizAns": "5"}, {"id": "F-13", "func": "ROUND", "category": "Arithmetic & Statistical", "formula": "=ROUND(146.78, -1)", "result": "150", "explanation": "When num_digits is negative (-1), ROUND rounds 1 position to the LEFT of the decimal point (nearest 10): 146.78 -> 150.", "trap": "ROUND(146.78, -2) rounds to the nearest 100 (100), whereas ROUND(156.78, -2) gives 200.", "quizQ": "What is the output of =ROUND(567.89, -2)?", "quizAns": "600"}, {"id": "F-14", "func": "LEFT", "category": "Text", "formula": "=LEFT(B2, 3)", "result": "Aar", "explanation": "Extracts the first 3 characters from the left of cell B2 (\"Aarav Sharma\") -> \"Aar\".", "trap": "If num_chars is omitted (e.g., =LEFT(B2)), it defaults to 1 and returns \"A\".", "quizQ": "What does =LEFT(\"DSSSB\", 2) return?", "quizAns": "DS"}, {"id": "F-15", "func": "RIGHT", "category": "Text", "formula": "=RIGHT(B2, 6)", "result": "Sharma", "explanation": "Extracts the last 6 characters from the right end of cell B2 (\"Aarav Sharma\") -> \"Sharma\".", "trap": "Trailing spaces count as characters if the cell text was not trimmed!", "quizQ": "What does =RIGHT(\"COMPUTER\", 4) return?", "quizAns": "UTER"}, {"id": "F-16", "func": "MID", "category": "Text", "formula": "=MID(B3, 6, 5)", "result": "Verma", "explanation": "Starting at character position 6 of B3 (\"Diya Verma\"), extracts 5 characters -> \"Verma\".", "trap": "Excel character indexing starts at 1 (NOT 0), and spaces count as characters!", "quizQ": "What does =MID(\"MS EXCEL\", 4, 3) return?", "quizAns": "EXC"}, {"id": "F-17", "func": "LEN", "category": "Text", "formula": "=LEN(B2)", "result": "12", "explanation": "Counts total characters in \"Aarav Sharma\" (5 + 1 space + 6 = 12).", "trap": "Every space and punctuation mark is counted by LEN.", "quizQ": "What is =LEN(\"TGT CS\")?", "quizAns": "6"}, {"id": "F-18", "func": "CONCAT", "category": "Text", "formula": "=CONCAT(LEFT(B2,5), \"-\", A2)", "result": "Aarav-101", "explanation": "Joins \"Aarav\", \"-\", and Roll No \"101\" into a single text string \"Aarav-101\".", "trap": "You can also concatenate in Excel using the ampersand `&` operator: `=LEFT(B2,5)&\"-\"&A2`.", "quizQ": "What does =\"DSSSB\"&\" \"&2025 return?", "quizAns": "DSSSB 2025"}, {"id": "F-19", "func": "TRIM", "category": "Text", "formula": "=TRIM(\"  DSSSB   TGT  \")", "result": "DSSSB TGT", "explanation": "Strips all leading and trailing spaces and collapses multiple consecutive internal spaces down to a single space.", "trap": "TRIM does not remove single spaces between words—it keeps exactly one space between words.", "quizQ": "What is =LEN(TRIM(\"   INDIA   \"))?", "quizAns": "5"}, {"id": "F-20", "func": "UPPER", "category": "Text", "formula": "=UPPER(B3)", "result": "DIYA VERMA", "explanation": "Converts all letters in cell B3 (\"Diya Verma\") to uppercase.", "trap": "Numbers and symbols in the string remain unchanged.", "quizQ": "What does =UPPER(\"ms word 365\") return?", "quizAns": "MS WORD 365"}, {"id": "F-21", "func": "LOWER", "category": "Text", "formula": "=LOWER(B4)", "result": "kabir singh", "explanation": "Converts all letters in cell B4 (\"Kabir Singh\") to lowercase.", "trap": "Useful for normalizing email addresses before comparison.", "quizQ": "What does =LOWER(\"RAM & ROM\") return?", "quizAns": "ram & rom"}, {"id": "F-22", "func": "PROPER", "category": "Text", "formula": "=PROPER(\"computer science exam\")", "result": "Computer Science Exam", "explanation": "Capitalizes the first letter of each word and converts all remaining letters in each word to lowercase.", "trap": "PROPER also capitalizes any letter that immediately follows a non-letter character (like a hyphen or apostrophe).", "quizQ": "What does =PROPER(\"dELHI sUBORDINATE bOARD\") return?", "quizAns": "Delhi Subordinate Board"}, {"id": "F-23", "func": "TODAY", "category": "Date & Time", "formula": "=TODAY()", "result": "2026-11-12", "explanation": "Returns the current system date dynamically with empty parentheses `()`. Updates whenever the workbook recalculates.", "trap": "Never pass arguments inside TODAY(); writing =TODAY(1) causes a formula syntax error. For a static date shortcut, press Ctrl + ;.", "quizQ": "How many arguments does the =TODAY() function accept?", "quizAns": "0"}, {"id": "F-24", "func": "NOW", "category": "Date & Time", "formula": "=NOW()", "result": "2026-11-12 19:51", "explanation": "Returns both the current system date and current system time as a serial number. Takes zero arguments.", "trap": "Like TODAY(), NOW() is volatile and recalculates on every worksheet calculation (`F9`).", "quizQ": "Which function returns both current Date and Time in Excel?", "quizAns": "NOW()"}, {"id": "F-25", "func": "DATE", "category": "Date & Time", "formula": "=DATE(2025, 9, 12)", "result": "2025-09-12", "explanation": "Constructs a valid Excel date serial value from (year, month, day) arguments.", "trap": "Argument order is strictly (Year, Month, Day) regardless of your regional display format.", "quizQ": "In =DATE(2025, 11, 24), what does the second argument 11 represent?", "quizAns": "Month (November)"}, {"id": "F-26", "func": "YEAR", "category": "Date & Time", "formula": "=YEAR(DATE(2025, 9, 12))", "result": "2025", "explanation": "Extracts the 4-digit year integer (1900–9999) from an Excel date.", "trap": "Returns a 4-digit integer.", "quizQ": "What is =YEAR(\"2023-06-25\")?", "quizAns": "2023"}, {"id": "F-27", "func": "MONTH", "category": "Date & Time", "formula": "=MONTH(DATE(2025, 9, 12))", "result": "9", "explanation": "Extracts the month as an integer from 1 (January) to 12 (December).", "trap": "Returns a number (9), not the text name \"September\".", "quizQ": "What is =MONTH(DATE(2025, 12, 25))?", "quizAns": "12"}, {"id": "F-28", "func": "DAY", "category": "Date & Time", "formula": "=DAY(DATE(2025, 9, 12))", "result": "12", "explanation": "Extracts the day of the month as an integer from 1 to 31.", "trap": "Do not confuse DAY() with DAYS(end_date, start_date) which counts days between two dates.", "quizQ": "What is =DAY(DATE(2025, 8, 15))?", "quizAns": "15"}, {"id": "F-29", "func": "VLOOKUP", "category": "Lookup & Reference", "formula": "=VLOOKUP(103, A2:E6, 2, FALSE)", "result": "Kabir Singh", "explanation": "Searches vertically for Roll No 103 in the 1st column (A2:A6) and returns the corresponding value from Column 2 (Name) -> \"Kabir Singh\".", "trap": "Always specify FALSE (or 0) as the 4th argument for an exact match; omitting it defaults to TRUE (approximate match)!", "quizQ": "In =VLOOKUP(102, A2:E6, 3, FALSE), what does 103/102 lookup return from column 3 (Marks)?", "quizAns": "92"}, {"id": "F-30", "func": "HLOOKUP", "category": "Lookup & Reference", "formula": "=HLOOKUP(\"Marks\", A1:E6, 3, FALSE)", "result": "92", "explanation": "Searches horizontally across the header row A1:E1 for \"Marks\" and returns the value from the 3rd row of the table (Row 3, Diya) -> 92.", "trap": "Row 1 of the table_array is the header row itself, so row_index_num=3 corresponds to the 2nd student record (Row 3).", "quizQ": "What does the 'H' in HLOOKUP stand for?", "quizAns": "Horizontal"}, {"id": "F-31", "func": "INDEX", "category": "Lookup & Reference", "formula": "=INDEX(B2:C6, 4, 2)", "result": "64", "explanation": "In the range B2:C6, returns the value at the intersection of Row 4 (Meera Nair) and Column 2 (Marks) -> 64.", "trap": "Row and column numbers in INDEX are relative to the selected range B2:C6, not the worksheet row numbers.", "quizQ": "In =INDEX(B2:B6, 2), which student name is returned?", "quizAns": "Diya Verma"}, {"id": "F-32", "func": "MATCH", "category": "Lookup & Reference", "formula": "=MATCH(\"Kabir Singh\", B2:B6, 0)", "result": "3", "explanation": "Finds the relative position of \"Kabir Singh\" inside B2:B6 with exact match (0) -> 3rd item in the list.", "trap": "MATCH returns the numeric position (3), NOT the cell address (B4) or value!", "quizQ": "What does =MATCH(92, C2:C6, 0) return for C2:C6 = {85, 92, 78, 64, 66}?", "quizAns": "2"}, {"id": "F-33", "func": "XLOOKUP", "category": "Lookup & Reference", "formula": "=XLOOKUP(92, C2:C6, B2:B6, \"Not Found\")", "result": "Diya Verma", "explanation": "Looks up Marks = 92 in C2:C6 and returns the matching student name from B2:B6 (to the LEFT!) -> \"Diya Verma\".", "trap": "XLOOKUP is available in Excel 2021 and Microsoft 365 (not in Excel 2007–2016) and defaults to Exact Match.", "quizQ": "Can XLOOKUP look to the left of the lookup column (unlike VLOOKUP)?", "quizAns": "Yes"}, {"id": "F-34", "func": "FILTER", "category": "Dynamic Array (M365 / 2021)", "formula": "=FILTER(B2:B6, C2:C6>=80)", "result": "Aarav Sharma, Diya Verma", "explanation": "Dynamically filters student names in B2:B6 where Marks (C2:C6) >= 80, spilling both matching names.", "trap": "Microsoft 365 / Excel 2021 Dynamic Array function; if cells below the formula are blocked, it throws a #SPILL! error.", "quizQ": "Which error occurs in M365 if a dynamic array formula's output range is blocked by existing data?", "quizAns": "#SPILL!"}, {"id": "F-35", "func": "UNIQUE", "category": "Dynamic Array (M365 / 2021)", "formula": "=UNIQUE(E2:E6)", "result": "Merit, Full, (Blank)", "explanation": "Extracts distinct unique values from the Scholarship column E2:E6, removing duplicates automatically.", "trap": "Available in Excel 2021 and Microsoft 365.", "quizQ": "If A1:A4 contains {\"Pen\", \"Book\", \"Pen\", \"Pencil\"}, how many items does =UNIQUE(A1:A4) return?", "quizAns": "3"}, {"id": "F-36", "func": "SORT", "category": "Dynamic Array (M365 / 2021)", "formula": "=SORT(C2:C6, 1, -1)", "result": "92, 85, 78, 66, 64", "explanation": "Dynamically sorts Marks C2:C6 in descending order (`sort_order = -1`; `1` is ascending).", "trap": "In SORT(), sort_order = 1 means Ascending (default), and -1 means Descending.", "quizQ": "In =SORT(array, 1, -1), what does -1 specify?", "quizAns": "Descending order"}], "questions": [{"id": "CF-A01", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Computer Characteristics", "subtopic": "GIGO Principle", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "In computer terminology, the acronym 'GIGO' (Garbage In, Garbage Out) is most directly associated with which characteristic of a computer system?", "options": {"A": "Versatility", "B": "Accuracy", "C": "Diligence", "D": "Automation"}, "correctAnswer": "B", "explanation": "GIGO (Garbage In, Garbage Out) relates to Accuracy: computer hardware executes calculations error-free, so incorrect output is almost always the result of flawed or inaccurate human input. (Options A, C, D refer to multi-tasking capability, freedom from fatigue, and automatic execution respectively.)", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper Archive"}, {"id": "CF-A02", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Functional Units", "subtopic": "Von Neumann Architecture", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Verified PYQ", "question": "Which revolutionary concept introduced by John von Neumann in 1945 allowed both program instructions and data to be stored together in the same read-write primary memory?", "options": {"A": "Harvard Separate Bus Architecture", "B": "Stored-Program Concept", "C": "Time-Sharing Multiprogramming", "D": "pipelined RISC Execution"}, "correctAnswer": "B", "explanation": "John von Neumann's 1945 EDVAC report introduced the Stored-Program Concept, storing both instructions and data in a single unified main memory accessed over a shared system bus. Harvard architecture (Option A) keeps instruction and data memories physically separate.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 2", "sourceReference": "DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-A03", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Computer Characteristics", "subtopic": "Diligence", "difficulty": "Easy", "questionType": "Definition-based", "sourceType": "Original Practice Question", "question": "A computer can perform millions of calculations with the exact same speed and precision on the ten-millionth operation as on the first, without suffering from fatigue or lack of concentration. This characteristic is known as:", "options": {"A": "Versatility", "B": "Diligence", "C": "Reliability", "D": "Adaptability"}, "correctAnswer": "B", "explanation": "Diligence is the capacity of a computer to perform repetitive tasks tirelessly for hours or days without fatigue, boredom, or degradation in accuracy.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A04", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Data and Information", "subtopic": "EDP Pipeline", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In an Electronic Data Processing (EDP) cycle, what is the correct logical sequence of transforming raw facts into actionable knowledge?", "options": {"A": "Information -> Data -> Processing -> Output", "B": "Data -> Processing -> Information -> Knowledge", "C": "Processing -> Data -> Output -> Storage", "D": "Input -> Knowledge -> Data -> Information"}, "correctAnswer": "B", "explanation": "Raw unorganized facts (Data) are fed into the CPU for manipulation (Processing) to yield meaningful structured output (Information), which when applied to decision-making forms Knowledge.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A05", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Hardware, Software and Firmware", "subtopic": "Firmware", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Adapted PYQ", "question": "Programs permanently etched into non-volatile semiconductor memory chips (such as ROM, EPROM, or Flash) during manufacturing to control hardware initialization are called:", "options": {"A": "Liveware", "B": "Firmware", "C": "Shareware", "D": "Middleware"}, "correctAnswer": "B", "explanation": "Firmware (e.g., BIOS/UEFI, router OS, embedded washing machine code) is software permanently programmed into non-volatile read-only memory. Liveware (A) refers to human users.", "exam": "KVS PGT Computer Science", "year": 2018, "shift": "23 Dec 2018", "sourceReference": "KVS PGT CS 2018 Official Paper"}, {"id": "CF-A06", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Functional Units", "subtopic": "Control Unit vs ALU", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Which functional unit of a computer acts as the 'central nervous system' by interpreting program instructions and generating timing and control signals for all other units without actually processing data itself?", "options": {"A": "Arithmetic Logic Unit (ALU)", "B": "Control Unit (CU)", "C": "Memory Buffer Register (MBR)", "D": "Input/Output Interface"}, "correctAnswer": "B", "explanation": "The Control Unit (CU) decodes instructions and directs the flow of data via timing and control signals across the CPU, memory, and I/O, while the ALU performs the actual arithmetic and bitwise logic.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A07", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Speed Metrics", "subtopic": "Time Units", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Exam-pattern Question", "question": "Arrange the following instruction execution time units in ascending order from the shortest duration to the longest duration:\n1. Microsecond\n2. Picosecond\n3. Nanosecond\n4. Millisecond", "options": {"A": "2 -> 3 -> 1 -> 4", "B": "3 -> 2 -> 1 -> 4", "C": "2 -> 1 -> 3 -> 4", "D": "4 -> 1 -> 3 -> 2"}, "correctAnswer": "A", "explanation": "Picosecond = 10^-12 s < Nanosecond = 10^-9 s < Microsecond = 10^-6 s < Millisecond = 10^-3 s. Thus the ascending order is 2 -> 3 -> 1 -> 4.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A08", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Computer Terminology", "subtopic": "MIPS and FLOPS", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "While general-purpose microprocessor instruction throughput is commonly measured in MIPS, the computational speed of modern Supercomputers is measured in:", "options": {"A": "Baud Rate", "B": "FLOPS (Floating-Point Operations Per Second)", "C": "DPI (Dots Per Inch)", "D": "PPM (Pages Per Minute)"}, "correctAnswer": "B", "explanation": "Supercomputers execute scientific simulations dominated by floating-point arithmetic, so their speed is measured in GigaFLOPS, TeraFLOPS, PetaFLOPS, or ExaFLOPS.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A09", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Good Information", "subtopic": "Characteristics of Information", "difficulty": "Easy", "questionType": "Statement-based", "sourceType": "Original Practice Question", "question": "Which of the following is NOT a desirable characteristic of good management information produced by a computer system?", "options": {"A": "Timeliness and Relevance", "B": "Accuracy and Completeness", "C": "High Redundancy and Ambiguity", "D": "Verifiability and Accessibility"}, "correctAnswer": "C", "explanation": "Good information must be accurate, timely, relevant, complete, concise, and verifiable. High redundancy and ambiguity degrade information quality.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A10", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Block Diagram", "subtopic": "Von Neumann Bottleneck", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "What is referred to as the 'Von Neumann Bottleneck' in classical computer architecture?", "options": {"A": "The inability of the ALU to perform floating-point division", "B": "The limited data transfer rate over the shared single bus between the CPU and Main Memory for both instructions and data", "C": "The thermal throttling of vacuum tubes in first-generation machines", "D": "The 4 GB file size limit of the FAT32 file system"}, "correctAnswer": "B", "explanation": "Because instructions and data share the same memory and bus in Von Neumann architecture, the CPU cannot fetch an instruction and read/write data at the exact same instant, creating a throughput bottleneck.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A11", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Components", "subtopic": "Liveware", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In a complete computer system environment, the human programmers, system administrators, and end-users who operate the system are collectively termed:", "options": {"A": "Firmware", "B": "Skinware / Liveware (Humanware)", "C": "Freeware", "D": "Groupware"}, "correctAnswer": "B", "explanation": "Liveware (or Humanware) refers to the human personnel operating and programming computer hardware and software.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A12", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "IPO Cycle", "subtopic": "Feedback Loop", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In the extended Input-Process-Output-Storage (IPOS) cycle, why is Primary Memory directly connected to the CPU rather than Secondary Storage?", "options": {"A": "Secondary storage is volatile and loses data during processing", "B": "CPU registers and ALU require nanosecond-level random access to active instructions and operands, which mechanical/flash secondary storage cannot match directly", "C": "Primary memory can store infinite data permanently without power", "D": "Secondary storage only accepts analog signals"}, "correctAnswer": "B", "explanation": "The CPU operates at GHz clock speeds (nanoseconds) and can only address fast byte-addressable Primary Memory (RAM/ROM) directly over the memory bus.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A13", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Limitations", "subtopic": "Zero IQ", "difficulty": "Easy", "questionType": "Assertion and Reason", "sourceType": "Original Practice Question", "question": "Assertion (A): A standard computer cannot make autonomous intuitive moral decisions outside its programmed algorithms and training data.\nReason (R): A computer possesses zero intrinsic Intelligence Quotient (IQ) and relies on deterministic or statistical instructions.", "options": {"A": "Both (A) and (R) are true, and (R) is the correct explanation of (A)", "B": "Both (A) and (R) are true, but (R) is not the correct explanation of (A)", "C": "(A) is true, but (R) is false", "D": "(A) is false, but (R) is true"}, "correctAnswer": "A", "explanation": "Computers have zero natural IQ and execute only what their algorithms/models specify, making (R) the exact reason for (A).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A14", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Applications", "subtopic": "CAD and CAM", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "In engineering and architectural applications of computers, what do the acronyms CAD and CAM stand for?", "options": {"A": "Computer Aided Design and Computer Aided Manufacturing", "B": "Control Address Data and Control Access Memory", "C": "Central Algorithmic Design and Central Array Module", "D": "Computer Automated Debugging and Computer Assisted Maintenance"}, "correctAnswer": "A", "explanation": "CAD stands for Computer-Aided Design and CAM stands for Computer-Aided Manufacturing.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-A15", "moduleCode": "A", "module": "A. Introduction to Computers", "topic": "Terminology", "subtopic": "Dumb Terminal", "difficulty": "Moderate", "questionType": "Definition-based", "sourceType": "Exam-pattern Question", "question": "What is a 'Dumb Terminal' in a multi-user mainframe computing environment?", "options": {"A": "A standalone workstation with dual GPUs and local SSD storage", "B": "A display monitor and keyboard unit that has no independent CPU or local disk storage for processing and relies entirely on the host mainframe", "C": "A computer infected by a boot-sector virus", "D": "An analog computer that cannot process binary numbers"}, "correctAnswer": "B", "explanation": "A dumb terminal consists only of an input device (keyboard) and display screen (monitor) with a serial network interface, delegating all computation and storage to a central mainframe/server.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-B01", "moduleCode": "B", "module": "B. History and Generations", "topic": "First Generation", "subtopic": "Programming Language", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Verified PYQ", "question": "Programming of first-generation computers was primarily done in which of the following languages?\nI. Machine Language\nII. High-Level Language", "options": {"A": "Only I", "B": "Only II", "C": "Both I and II", "D": "Neither I nor II"}, "correctAnswer": "A", "explanation": "First-generation computers (1940–1956, e.g., ENIAC, UNIVAC-I) were programmed directly in binary Machine Language (0s and 1s). High-level languages like FORTRAN and COBOL emerged in the late 1950s (Second Generation).", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "25 June 2023 Shift 1", "sourceReference": "Testbook / DSSSB TGT CS 2023 Official Paper"}, {"id": "CF-B02", "moduleCode": "B", "module": "B. History and Generations", "topic": "Early Calculating Devices", "subtopic": "Pascaline vs Stepped Reckoner", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Adapted PYQ", "question": "Blaise Pascal's mechanical calculator 'Pascaline' (1642) could perform only addition and subtraction. Who invented the 'Stepped Reckoner' in 1673 using fluted drums to extend mechanical calculation to multiplication and division?", "options": {"A": "John Napier", "B": "Gottfried Wilhelm von Leibniz", "C": "Joseph Marie Jacquard", "D": "Herman Hollerith"}, "correctAnswer": "B", "explanation": "German mathematician Gottfried Wilhelm Leibniz invented the Stepped Reckoner (Leibniz Wheel) in 1673, which could add, subtract, multiply, divide, and extract square roots.", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "CF-B03", "moduleCode": "B", "module": "B. History and Generations", "topic": "Pioneers", "subtopic": "Charles Babbage", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "Which 19th-century mechanical machine designed by Charles Babbage in 1837 introduced the architecture of a 'Mill' (ALU), 'Store' (Memory), Control unit, and Punched Card input/output?", "options": {"A": "Difference Engine", "B": "Analytical Engine", "C": "Tabulating Machine", "D": "Harvard Mark I"}, "correctAnswer": "B", "explanation": "Charles Babbage's Analytical Engine (1837) was the first general-purpose mechanical computer blueprint containing a 'Mill' (processor/ALU) and a 'Store' (memory). His earlier Difference Engine (1822) only evaluated polynomials.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS 2021 Official Paper"}, {"id": "CF-B04", "moduleCode": "B", "module": "B. History and Generations", "topic": "Pioneers", "subtopic": "Ada Lovelace", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Who is universally recognized as the 'World's First Computer Programmer' for authoring an algorithm to calculate Bernoulli numbers on Charles Babbage's Analytical Engine?", "options": {"A": "Grace Hopper", "B": "Lady Ada Augusta Lovela
