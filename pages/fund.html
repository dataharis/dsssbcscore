nce slides automatically.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R14", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Setup", "subtopic": "Presenter View", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "When a laptop is connected to an external classroom projector, which `Slide Show` feature allows the teacher to see their private Speaker Notes, an elapsed-time clock, and a preview of the next slide on their laptop screen while students see ONLY the clean slide on the projector?", "options": {"A": "Presenter View (`Alt + F5` to test on a single monitor)", "B": "Slide Sorter View", "C": "Draft View", "D": "Handout Master"}, "correctAnswer": "A", "explanation": "Presenter View separates the dual-monitor output so the speaker sees notes, timers, and upcoming animations on their console while the audience sees only the slide show.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R15", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Setup", "subtopic": "Custom Slide Show", "difficulty": "Moderate", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Suppose you have a master deck of 50 slides, and you want to present only Slides 1–10 to the Management team and Slides 1, 2, and 11–30 to the Engineering team without creating and maintaining two separate `.pptx` files. Which feature under the `Slide Show` tab allows this?", "options": {"A": "Custom Slide Show (`Slide Show -> Start Slide Show -> Custom Slide Show`)", "B": "Duplicate Slide (`Ctrl + D`)", "C": "Merge Shapes", "D": "Convert to Word"}, "correctAnswer": "A", "explanation": "Custom Slide Show lets you define multiple named subsets and custom slide sequences inside a single `.pptx` file.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R16", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Inserting Objects", "subtopic": "Action Buttons", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Pre-built interactive shapes in MS PowerPoint (`Insert -> Shapes -> Action Buttons` at the bottom of the Shapes gallery) with icons for Home, Next, Previous, Return, Movie, or Sound that trigger a hyperlink or macro on `Mouse Click` or `Mouse Over` are called:", "options": {"A": "Action Buttons", "B": "Sparklines", "C": "Slicers", "D": "Pivot Buttons"}, "correctAnswer": "A", "explanation": "Action Buttons are ready-made navigation shapes that open the 'Action Settings' dialog (`Mouse Click` / `Mouse Over`) to jump to slides, open URLs, run programs, or play sounds.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R17", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Animations", "subtopic": "Animation Start Options", "difficulty": "Moderate", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "In MS PowerPoint's `Animations -> Timing` group, which three 'Start' trigger options determine when an object animation begins playing?", "options": {"A": "`On Click`, `With Previous`, and `After Previous`", "B": "`Before Slide`, `During Slide`, and `After Show`", "C": "`Fast`, `Medium`, and `Slow`", "D": "`Left`, `Center`, and `Right`"}, "correctAnswer": "A", "explanation": "Every animation can be set to start `On Click` (waits for mouse/key press), `With Previous` (plays simultaneously with the prior animation), or `After Previous` (starts automatically as soon as the prior animation finishes).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R18", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Animations", "subtopic": "Multiple Animations on One Object", "difficulty": "Moderate", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "If a shape on a PowerPoint slide already has a 'Fly In' Entrance animation, and you want that SAME shape to also 'Spin' and then 'Fade Out' later on the same slide, what happens if you simply click a new animation in the main gallery versus clicking 'Add Animation' (`Advanced Animation` group)?", "options": {"A": "Clicking the main gallery REPLACES the existing animation, whereas clicking 'Add Animation' appends a 2nd and 3rd animation to the same object", "B": "A shape can only ever have 1 animation in PowerPoint", "C": "Clicking 'Add Animation' duplicates the slide", "D": "Both buttons delete the existing animation"}, "correctAnswer": "A", "explanation": "Selecting an effect from the main Animation gallery overwrites the object's current animation. To stack multiple animations (e.g., Entrance + Emphasis + Exit) on a single object, you must click `Add Animation`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R19", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Animations", "subtopic": "Animation Painter", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Just as 'Format Painter' copies text formatting, which tool on the `Animations` tab (`Alt + Shift + C`) copies all animation effects, triggers, and timings from one object and applies them to another object?", "options": {"A": "Animation Painter", "B": "Eyedropper", "C": "Slide Master", "D": "Morph Transition"}, "correctAnswer": "A", "explanation": "Animation Painter (`Animations -> Advanced Animation -> Animation Painter`) copies the complete animation sequence from one object to another.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R20", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Interface", "subtopic": "Zoom Limits & Placeholders", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What are the dotted-border containers on a PowerPoint slide layout that hold titles, bullet text, charts, or pictures called, and what is the maximum Zoom percentage on the PowerPoint slide canvas?", "options": {"A": "Containers: Placeholders; Maximum Zoom: 400% (Range: 10% to 400%)", "B": "Containers: Frames; Maximum Zoom: 500%", "C": "Containers: Cells; Maximum Zoom: 200%", "D": "Containers: Bookmarks; Maximum Zoom: 100%"}, "correctAnswer": "A", "explanation": "Dotted boxes on slide layouts are called Placeholders, and PowerPoint's zoom slider ranges from 10% to 400%.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R21", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Views", "subtopic": "Three Master Views", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which three 'Master Views' are available under the `View` tab in MS PowerPoint?", "options": {"A": "Slide Master, Handout Master, and Notes Master", "B": "Normal Master, Outline Master, and Web Master", "C": "Table Master, Chart Master, and Picture Master", "D": "Header Master, Footer Master, and Margin Master"}, "correctAnswer": "A", "explanation": "The `Master Views` group on PowerPoint's `View` tab contains exactly three masters: Slide Master, Handout Master (controls printed handout layout), and Notes Master (controls printed speaker notes layout).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R22", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Design & Formatting", "subtopic": "Eyedropper Tool", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Introduced in PowerPoint 2013, which tool in the Shape Fill / Font Color menu lets you click any pixel on your slide or inside a photograph to sample and apply that exact RGB color?", "options": {"A": "Eyedropper", "B": "Format Painter", "C": "SmartArt", "D": "Morph"}, "correctAnswer": "A", "explanation": "The Eyedropper tool samples the exact RGB hex color from any image or object on screen and applies it to text, shapes, or outlines.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R23", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Transitions", "subtopic": "Morph Transition", "difficulty": "Moderate", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Introduced in PowerPoint 2019 and Microsoft 365, which Slide Transition smoothly animates the movement, resizing, and color change of shared objects between two consecutive slides?", "options": {"A": "Morph Transition", "B": "Cut Transition", "C": "Flash Transition", "D": "Dissolve Transition"}, "correctAnswer": "A", "explanation": "The Morph transition (`Transitions -> Morph`) automatically interpolates smooth movement and scaling when an object is duplicated across two consecutive slides.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R24", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slides and Shortcuts", "subtopic": "Duplicate & Group Shapes Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS PowerPoint, which keyboard shortcut duplicates a selected slide or shape immediately (`Duplicate`), and which shortcuts Group and Ungroup multiple selected shapes?", "options": {"A": "Duplicate: `Ctrl + D`; Group: `Ctrl + G`; Ungroup: `Ctrl + Shift + G`", "B": "Duplicate: `Ctrl + C`; Group: `Ctrl + U`; Ungroup: `Ctrl + B`", "C": "Duplicate: `Ctrl + M`; Group: `Alt + G`; Ungroup: `Alt + U`", "D": "Duplicate: `F4`; Group: `F5`; Ungroup: `F6`"}, "correctAnswer": "A", "explanation": "`Ctrl + D` duplicates the selected slide or object; `Ctrl + G` groups multiple selected shapes into a single unit; `Ctrl + Shift + G` ungroups them.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R25", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Inserting Objects", "subtopic": "Header & Footer on Slides", "difficulty": "Moderate", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "When you click `Insert -> Header & Footer` in MS PowerPoint, the dialog box has two tabs: 'Slide' and 'Notes and Handouts'. Which element is present on 'Notes and Handouts' but is NOT available on the 'Slide' tab?", "options": {"A": "A 'Header' checkbox (Slides only have Date and Time, Slide Number, and Footer—they do NOT have a Header option, whereas Notes and Handouts have both Header and Footer!)", "B": "Slide Number", "C": "Date and Time", "D": "Apply to All button"}, "correctAnswer": "A", "explanation": "Important PowerPoint Exam Trap: In the `Header & Footer` dialog, the `Slide` tab contains Date and Time, Slide Number, Footer, and 'Don't show on title slide'—there is NO 'Header' field for slides! The `Notes and Handouts` tab has both Header and Footer.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R26", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Layouts", "subtopic": "Default First Slide vs Second Slide Layout", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "When you create a brand-new blank presentation in MS PowerPoint (`Ctrl + N`), the very first slide uses the `'Title Slide'` layout by default. If you then press `Ctrl + M` to insert a 2nd slide, which layout is applied to the 2nd slide by default?", "options": {"A": "`Title and Content` layout", "B": "`Blank` layout", "C": "`Comparison` layout", "D": "`Picture with Caption` layout"}, "correctAnswer": "A", "explanation": "Slide 1 defaults to the `Title Slide` layout (Title + Subtitle placeholders), while pressing `Ctrl + M` after Slide 1 inserts a new slide using the `Title and Content` layout by default.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R27", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Inserting Objects", "subtopic": "Screen Recording & Cameo", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Under the `Insert` tab (in the `Media` group) of MS PowerPoint 2016/2019/2021/M365, which built-in tool lets you capture a video recording of any selected area of your computer screen along with microphone audio and embed it directly onto a slide?", "options": {"A": "Screen Recording", "B": "Screenshot", "C": "Photo Album", "D": "Action Button"}, "correctAnswer": "A", "explanation": "`Insert -> Media -> Screen Recording` (alongside Video and Audio) records desktop screen activity and audio directly into the presentation.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R28", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Delivery", "subtopic": "Jump to Specific Slide Number", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "While running a full-screen Slide Show in MS PowerPoint, how can the presenter jump directly to Slide number `15` using the keyboard?", "options": {"A": "Type `15` and press `Enter`", "B": "Press `F15`", "C": "Press `Ctrl + 15`", "D": "Press `Alt + Page Down` 15 times"}, "correctAnswer": "A", "explanation": "During an active Slide Show, typing any slide number (e.g., `15`) and pressing `Enter` jumps directly to that slide.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R29", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Show Setup", "subtopic": "Hide Slide Feature", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "If you want to keep a backup reference slide inside your PowerPoint file for Q&A but prevent it from appearing during the normal sequential Slide Show (`F5`), which option should you right-click on the slide thumbnail and select?", "options": {"A": "`Hide Slide` (also on `Slide Show -> Set Up -> Hide Slide`)", "B": "`Delete Slide`", "C": "`Reset Slide`", "D": "`Format Background`"}, "correctAnswer": "A", "explanation": "`Hide Slide` puts a diagonal slash through the slide number in the thumbnail pane; the slide remains in the file for editing but is skipped during the live Slide Show unless explicitly navigated to.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R30", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Exporting Presentations", "subtopic": "Export to MP4 Video or PDF", "difficulty": "Easy", "questionType": "PowerPoint Practical", "sourceType": "Original Practice Question", "question": "Which menu path in MS PowerPoint (2013–M365) allows you to convert an entire presentation—complete with recorded timings, animations, transitions, and voice narration—into a standalone `.mp4` video file or a `.pdf` document?", "options": {"A": "`File -> Export -> Create a Video` (or `Create PDF/XPS Document`)", "B": "`View -> Slide Master`", "C": "`Design -> Variants`", "D": "`Review -> Compare`"}, "correctAnswer": "A", "explanation": "Backstage `File -> Export` provides 'Create PDF/XPS Document', 'Create a Video' (`.mp4` or `.wmv`), 'Create an Animated GIF', 'Package Presentation for CD', and 'Create Handouts' (in MS Word).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R31", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Inserting Objects", "subtopic": "Photo Album Feature", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Under the `Insert -> Images` group in MS PowerPoint, which feature automatically builds a brand-new presentation deck from a folder of selected photographs (placing 1, 2, or 4 pictures per slide with optional captions and frames)?", "options": {"A": "Photo Album (`Insert -> Photo Album`)", "B": "SmartArt", "C": "WordArt", "D": "Symbol"}, "correctAnswer": "A", "explanation": "`Insert -> Images -> Photo Album` batch-imports multiple image files into a dedicated presentation with customizable frames and captions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R32", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Slide Layouts", "subtopic": "Nine Standard Slide Layouts", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "How many standard built-in Slide Layouts are included in the default Office Theme of MS PowerPoint (such as Title Slide, Title and Content, Section Header, Two Content, Comparison, Title Only, Blank, Content with Caption, Picture with Caption)?", "options": {"A": "9 standard layouts", "B": "2 standard layouts", "C": "25 standard layouts", "D": "100 standard layouts"}, "correctAnswer": "A", "explanation": "The standard Office theme in MS PowerPoint provides 9 built-in slide layouts.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R33", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Design Tab", "subtopic": "Themes vs Templates", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In MS PowerPoint, what is the difference between a 'Theme' (`.thmx`) and a 'Template' (`.potx`)?", "options": {"A": "A Theme defines a coordinated set of colors, fonts, and visual effects, whereas a Template (`.potx`) includes the Theme PLUS pre-built sample slides, custom slide layouts, boilerplate text, and content prompts for a specific purpose", "B": "A Template only changes the font size of page numbers", "C": "A Theme deletes all slides in a presentation", "D": "They are identical file formats"}, "correctAnswer": "A", "explanation": "A Theme (`.thmx`) provides visual styling (Theme Colors, Theme Fonts, Theme Effects), while a Template (`.potx`) is a complete blueprint containing both a Theme and pre-designed slides/content layouts.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R34", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "Outline Manipulation", "subtopic": "Promote and Demote Bullet Levels", "difficulty": "Easy", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "While typing a multi-level bulleted list inside a PowerPoint content placeholder (or Word), pressing `Tab` at the start of a bullet line demotes it one level inward (sub-bullet). Which key combination promotes the bullet level back outward by one level?", "options": {"A": "`Shift + Tab`", "B": "`Ctrl + Tab`", "C": "`Alt + Tab`", "D": "`Ctrl + Enter`"}, "correctAnswer": "A", "explanation": "`Tab` increases list indent (demotes to sub-bullet), and `Shift + Tab` decreases list indent (promotes to higher-level bullet).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-R35", "moduleCode": "R", "module": "R. MS PowerPoint", "topic": "PowerPoint Views", "subtopic": "Reading View", "difficulty": "Easy", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "Which MS PowerPoint view runs the presentation with transitions and animations inside a resizable window (retaining the Title Bar and Status Bar) rather than taking over the entire screen like Slide Show view?", "options": {"A": "Reading View", "B": "Slide Sorter View", "C": "Outline View", "D": "Handout Master View"}, "correctAnswer": "A", "explanation": "Reading View plays the presentation with full animations and transitions inside a standard desktop window so you can easily switch to other windows on the taskbar.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S01", "moduleCode": "S", "module": "S. MS Access", "topic": "Database Objects", "subtopic": "Six Core Access Objects", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "Out of the six core database objects in MS Access (Tables, Queries, Forms, Reports, Macros, and Modules), which object is the ONLY one that physically stores the actual records and data?", "options": {"A": "Queries", "B": "Tables", "C": "Forms", "D": "Reports"}, "correctAnswer": "B", "explanation": "In MS Access, only Tables physically store data rows (records) and columns (fields). Queries retrieve/manipulate table data, Forms provide data-entry screens, and Reports format data for printing.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 2", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-S02", "moduleCode": "S", "module": "S. MS Access", "topic": "Keys and Integrity", "subtopic": "Primary Key Properties", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "Which of the following pairs of constraints is strictly enforced on a 'Primary Key' field in an MS Access table?", "options": {"A": "It must be Unique (no duplicates) AND it can NEVER contain a `NULL` (empty) value", "B": "It can contain duplicate values as long as they are numbers", "C": "It must always be of `Long Text` (Memo) data type", "D": "A table can have up to 10 Primary Keys"}, "correctAnswer": "A", "explanation": "Entity Integrity requires that a Primary Key uniquely identifies every tuple/record in a table: it cannot have duplicate values and cannot be NULL. (A table can have at most ONE Primary Key, though that Primary Key may be a Composite Key spanning multiple fields.)", "exam": "KVS PGT Computer Science", "year": 2023, "shift": "Feb 2023", "sourceReference": "KVS PGT CS Official Paper"}, {"id": "MS-S03", "moduleCode": "S", "module": "S. MS Access", "topic": "Data Types", "subtopic": "Short Text Character Limit", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Adapted PYQ", "question": "In MS Access, what is the maximum number of characters that can be stored in a field of data type `'Short Text'` (called `'Text'` in Access 2007/2010)?", "options": {"A": "64 characters", "B": "255 characters", "C": "1,024 characters", "D": "65,535 characters"}, "correctAnswer": "B", "explanation": "The `Short Text` (or `Text`) data type in MS Access holds up to 255 characters (default Field Size = 255). For longer paragraphs up to ~65,535 characters in UI, `Long Text` (formerly `Memo`) is used.", "exam": "DSSSB TGT Computer Science", "year": 2023, "shift": "24 June 2023 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-S04", "moduleCode": "S", "module": "S. MS Access", "topic": "File Formats", "subtopic": "Access File Extensions", "difficulty": "Easy", "questionType": "File Extension", "sourceType": "Adapted PYQ", "question": "What was the default database file extension in MS Access 2003 and earlier, and what is the default database file extension in MS Access 2007, 2010, 2016, 2019, 2021, and Microsoft 365?", "options": {"A": "Access 2003: `.mdb`; Access 2007+: `.accdb`", "B": "Access 2003: `.dbf`; Access 2007+: `.xlsx`", "C": "Access 2003: `.sql`; Access 2007+: `.dbx`", "D": "Access 2003: `.doc`; Access 2007+: `.docx`"}, "correctAnswer": "A", "explanation": "`.mdb` (Microsoft Database) was the legacy Jet format through Access 2003; `.accdb` (Access Database) is the default ACE format from Access 2007 onward.", "exam": "NVS TGT ICT", "year": 2022, "shift": "Nov 2022", "sourceReference": "NVS Official Paper"}, {"id": "MS-S05", "moduleCode": "S", "module": "S. MS Access", "topic": "Database Fundamentals", "subtopic": "RDBMS Terminology Mapping", "difficulty": "Easy", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the MS Access table term with its formal Relational Database (RDBMS) equivalent:\n1. Table — (p) Attribute / Domain\n2. Record (Row) — (q) Relation\n3. Field (Column) — (r) Tuple", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-p, 2-r, 3-q", "D": "1-q, 2-p, 3-r"}, "correctAnswer": "A", "explanation": "In relational model terminology (E.F. Codd): a Table is a Relation (q); a Row/Record is a Tuple (r); and a Column/Field is an Attribute (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S06", "moduleCode": "S", "module": "S. MS Access", "topic": "Data Types", "subtopic": "AutoNumber Field", "difficulty": "Easy", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "Which MS Access data type automatically generates a unique, sequential (incrementing by 1) or random 4-byte integer whenever a new record is added, cannot be manually edited by a user, and is ideal for surrogate Primary Keys?", "options": {"A": "AutoNumber", "B": "Currency", "C": "Calculated", "D": "OLE Object"}, "correctAnswer": "A", "explanation": "An AutoNumber field automatically assigns a unique number to every new record and never reuses deleted numbers.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S07", "moduleCode": "S", "module": "S. MS Access", "topic": "Data Types", "subtopic": "Best Data Type for Phone/PIN Code", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Exam-pattern Question", "question": "When designing a `Students` table in MS Access, which data type is recommended for storing a 10-digit Mobile Phone Number or a 6-digit Postal PIN Code (which may contain leading zeros, spaces, `+91`, or hyphens and are never added or multiplied mathematically)?", "options": {"A": "Short Text", "B": "AutoNumber", "C": "Currency", "D": "Yes/No"}, "correctAnswer": "A", "explanation": "Phone numbers, PIN/Zip codes, and Aadhaar/ID codes should be stored as `Short Text` (with an Input Mask) rather than `Number`, because `Number` strips leading zeros and does not allow `+` or `-` formatting characters.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S08", "moduleCode": "S", "module": "S. MS Access", "topic": "Table Views", "subtopic": "Datasheet View vs Design View", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In MS Access, which view of a Table is used to define Field Names, select Data Types, set a Primary Key, and configure Field Properties (like `Validation Rule` and `Input Mask`), versus the view used to enter and browse actual data records?", "options": {"A": "Structure & data types: Design View; Enter & browse records: Datasheet View", "B": "Structure: Datasheet View; Enter records: Print Preview", "C": "Structure: SQL View; Enter records: Report View", "D": "Structure: Slide Master; Enter records: Normal View"}, "correctAnswer": "A", "explanation": "Design View defines the schema (field names, data types, keys, properties); Datasheet View displays the tabular grid of records for data entry.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S09", "moduleCode": "S", "module": "S. MS Access", "topic": "Relationships", "subtopic": "Referential Integrity & Cascades", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In MS Access, when 'Enforce Referential Integrity' is checked on a One-to-Many relationship between `Departments` (Parent) and `Employees` (Child), what is prevented?", "options": {"A": "It prevents users from entering an Employee record with a `DeptID` that does not exist in the `Departments` table (preventing orphan records), and prevents deleting a Department that still has assigned Employees (unless Cascade Delete is enabled)", "B": "It prevents adding more than 10 employees to the database", "C": "It encrypts the database with a password", "D": "It converts all tables into Excel spreadsheets"}, "correctAnswer": "A", "explanation": "Referential Integrity ensures Foreign Key values in the child table always match a valid Primary Key in the parent table.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S10", "moduleCode": "S", "module": "S. MS Access", "topic": "Relationships", "subtopic": "Many-to-Many Junction Table", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "How is a 'Many-to-Many (M:N)' relationship (for example, between `Students` and `Courses`, where each student takes multiple courses and each course has multiple students) implemented in MS Access?", "options": {"A": "By creating a third intermediate 'Junction (Linking) Table' (e.g., `Enrollments`) that contains Foreign Keys referencing the Primary Keys of both `Students` and `Courses` (forming two 1:M relationships)", "B": "By connecting two Memo fields directly", "C": "MS Access does not support more than one table", "D": "By using a Delete Query"}, "correctAnswer": "A", "explanation": "Relational databases resolve a Many-to-Many (M:N) relationship into two One-to-Many (1:M) relationships linked through a third Junction/Associative table.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S11", "moduleCode": "S", "module": "S. MS Access", "topic": "Queries", "subtopic": "Select vs Action Queries", "difficulty": "Moderate", "questionType": "Classification", "sourceType": "Exam-pattern Question", "question": "Which of the following lists the FOUR 'Action Queries' in MS Access that permanently modify, add, delete, or create table data (as opposed to a read-only `Select Query`)?", "options": {"A": "Make-Table Query, Append Query, Update Query, and Delete Query", "B": "Select Query, Parameter Query, Crosstab Query, and Find Duplicates Query", "C": "Form Query, Report Query, Macro Query, and Module Query", "D": "Sort Query, Filter Query, Print Query, and Zoom Query"}, "correctAnswer": "A", "explanation": "The 4 Action Queries in MS Access are Make-Table (`SELECT INTO`), Append (`INSERT INTO`), Update (`UPDATE SET`), and Delete (`DELETE FROM`).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S12", "moduleCode": "S", "module": "S. MS Access", "topic": "Queries", "subtopic": "Parameter Query", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "In MS Access Query Design View, if you type `[Enter Department Name:]` inside the `Criteria:` row of the `Department` field, the query pops up an interactive dialog box asking the user to type a department name every time the query is run. What is this type of query called?", "options": {"A": "Parameter Query", "B": "Delete Query", "C": "Crosstab Query", "D": "Append Query"}, "correctAnswer": "A", "explanation": "Enclosing a prompt inside square brackets `[...]` in the Criteria row creates a Parameter Query that prompts the user for filter input at runtime.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S13", "moduleCode": "S", "module": "S. MS Access", "topic": "Database Objects", "subtopic": "Forms vs Reports", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "What is the primary functional difference between a 'Form' and a 'Report' in MS Access?", "options": {"A": "A Form is an interactive screen interface designed for entering, editing, and navigating records one at a time, whereas a Report is a read-only formatted layout designed for grouping, summarizing, and printing/exporting data", "B": "A Report allows deleting records whereas a Form is read-only", "C": "Forms can only be printed on plotters", "D": "Reports store the raw database tables"}, "correctAnswer": "A", "explanation": "Forms are interactive data-entry and editing screens; Reports are read-only presentation outputs optimized for grouping, totaling, and printing.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S14", "moduleCode": "S", "module": "S. MS Access", "topic": "Database Objects", "subtopic": "Macros vs Modules", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In MS Access automation, how does a 'Macro' object differ from a 'Module' object?", "options": {"A": "A Macro automates tasks by selecting predefined actions from a drop-down builder without writing code, whereas a Module contains custom programming procedures and functions written in VBA (Visual Basic for Applications)", "B": "A Macro is hardware whereas a Module is a printer", "C": "A Module cannot use variables or loops", "D": "Only Excel has Macros"}, "correctAnswer": "A", "explanation": "In Access, Macros use a declarative point-and-click action list, while Modules hold full VBA code procedures.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S15", "moduleCode": "S", "module": "S. MS Access", "topic": "Field Properties", "subtopic": "Validation Rule vs Input Mask", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "In MS Access Table Design View, what is the difference between the `'Input Mask'` property and the `'Validation Rule'` property?", "options": {"A": "An Input Mask controls the character-by-character pattern/template as data is typed (e.g., `(000) 000-0000`), whereas a Validation Rule tests whether the entered value satisfies a logical condition (e.g., `>= 18 And <= 65`) and displays `Validation Text` if violated", "B": "Validation Rule formats phone dashes, while Input Mask checks if age > 18", "C": "Both properties delete the table", "D": "Input Mask is only used in PowerPoint"}, "correctAnswer": "A", "explanation": "Input Mask enforces a literal template pattern during keystroke entry (`0` = required digit, `L` = required letter); Validation Rule evaluates a boolean expression before committing the field/record.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S16", "moduleCode": "S", "module": "S. MS Access", "topic": "Data Types", "subtopic": "OLE Object vs Attachment vs Hyperlink", "difficulty": "Moderate", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the MS Access Data Type with its storage purpose:\n1. Currency — (p) Stores 1-bit Boolean values (`True/False`, `Yes/No`, `On/Off`)\n2. Yes/No — (q) Stores clickable web URLs or email addresses (`mailto:`)\n3. Attachment — (r) Fixed-point 8-byte numeric type (up to 4 decimal places) that prevents floating-point rounding errors in financial calculations\n4. Hyperlink — (s) Modern Access 2007+ data type that stores multiple binary files (photos, PDFs, Word docs) compressed efficiently inside a single record", "options": {"A": "1-r, 2-p, 3-s, 4-q", "B": "1-p, 2-r, 3-s, 4-q", "C": "1-r, 2-s, 3-p, 4-q", "D": "1-q, 2-p, 3-s, 4-r"}, "correctAnswer": "A", "explanation": "Currency = fixed-point financial numbers (r); Yes/No = 1-bit boolean (p); Attachment = stores multiple compressed files per record in `.accdb` (s); Hyperlink = clickable URLs (q).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S17", "moduleCode": "S", "module": "S. MS Access", "topic": "Table Design", "subtopic": "Field Name Rules", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "What is the maximum length of a Field Name in an MS Access table, and which characters are FORBIDDEN inside an Access Field Name?", "options": {"A": "Max 64 characters; cannot start with a leading space and cannot contain a period (`.`), exclamation mark (`!`), square brackets (`[ ]`), or grave accent (`` ` ``)", "B": "Max 8 characters; cannot contain letters", "C": "Max 255 characters; must start with `$`", "D": "Max 10 characters; cannot contain numbers"}, "correctAnswer": "A", "explanation": "Access field names (and object names) can be up to 64 characters long, cannot begin with a space, and cannot include `. ! [ ]` or `` ` ``.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S18", "moduleCode": "S", "module": "S. MS Access", "topic": "Queries", "subtopic": "Wildcards in Access Queries", "difficulty": "Difficult", "questionType": "Exam-trap", "sourceType": "Exam-pattern Question", "question": "In MS Access Query Design View (standard Jet/ACE `Like` operator), which wildcard character matches 'any sequence of zero or more characters', and which character matches 'any single character'?", "options": {"A": "Asterisk (`*`) matches zero or more characters (e.g., `Like \"S*\"`), and Question Mark (`?`) matches any single character (e.g., `Like \"B?ll\"`, and `#` matches any single digit)", "B": "Dollar (`$`) and At (`@`)", "C": "Ampersand (`&`) and Caret (`^`)", "D": "Semicolon (`;`) and Colon (`:`)"}, "correctAnswer": "A", "explanation": "In MS Access QBE queries (as in Excel `SEARCH`/`COUNTIF`): `*` matches any number of characters, `?` matches any single character, and `#` matches any single numeric digit (0–9).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S19", "moduleCode": "S", "module": "S. MS Access", "topic": "SQL in Access", "subtopic": "Basic SQL Clauses Order", "difficulty": "Moderate", "questionType": "Sequence/Order-based", "sourceType": "Original Practice Question", "question": "When viewing a Select Query in MS Access 'SQL View', what is the valid syntactic order of clauses in an SQL `SELECT` statement?", "options": {"A": "`SELECT -> FROM -> WHERE -> GROUP BY -> HAVING -> ORDER BY`", "B": "`FROM -> SELECT -> ORDER BY -> WHERE -> GROUP BY`", "C": "`WHERE -> SELECT -> FROM -> HAVING`", "D": "`ORDER BY -> GROUP BY -> WHERE -> SELECT`"}, "correctAnswer": "A", "explanation": "The standard SQL clause order is `SELECT [columns] FROM [table] WHERE [row_condition] GROUP BY [group_cols] HAVING [group_condition] ORDER BY [sort_cols];`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-S20", "moduleCode": "S", "module": "S. MS Access", "topic": "Database Utilities", "subtopic": "Compact and Repair Database", "difficulty": "Moderate", "questionType": "Direct Factual", "sourceType": "Original Practice Question", "question": "As records and temporary objects are repeatedly added and deleted in an MS Access `.accdb` file, the file size bloats due to unused fragmented space. Which built-in utility under `File -> Info` (or `Database Tools`) reclaims wasted space and fixes minor file corruption?", "options": {"A": "Compact and Repair Database", "B": "Mail Merge", "C": "Flash Fill", "D": "Track Changes"}, "correctAnswer": "A", "explanation": "'Compact and Repair Database' defragments the `.accdb` file, shrinks its disk size by reclaiming space from deleted records, resets AutoNumber counters if tables are empty, and repairs corrupted indexes.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T01", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "PST vs OST Data Files", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "MS Outlook uses two primary local data file extensions: `.pst` and `.ost`. What do `PST` and `OST` stand for, and how do they differ?", "options": {"A": "`PST` = Personal Storage Table (local archive/POP3 storage file); `OST` = Offline Storage Table (cached synchronized copy of an Exchange / Microsoft 365 / IMAP server mailbox for offline work)", "B": "`PST` = PowerPoint Slide Template; `OST` = Open Spreadsheet Table", "C": "`PST` = Public System Text; `OST` = Online System Tool", "D": "Both are audio file formats"}, "correctAnswer": "A", "explanation": "In MS Outlook: `.pst` (Personal Storage Table) stores local folders/archives on the user's PC, while `.ost` (Offline Storage Table) caches a local replica of a server mailbox so users can work offline and sync automatically.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T02", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "Outbox vs Sent Items", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Adapted PYQ", "question": "When you click 'Send' on an email in MS Outlook while your laptop is temporarily disconnected from the Internet, in which folder does the message stay queued until internet connectivity is restored and transmission completes?", "options": {"A": "Inbox", "B": "Outbox (and once transmitted, it moves to 'Sent Items')", "C": "Drafts", "D": "Junk Email"}, "correctAnswer": "B", "explanation": "Unfinished emails saved without clicking Send stay in `Drafts`. Once you click Send, the message sits in `Outbox` until transmitted to the mail server, after which it moves to `Sent Items`.", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "07 Aug 2021 Shift 3", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-T03", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "Appointment vs Meeting", "difficulty": "Moderate", "questionType": "Difference-based", "sourceType": "Original Practice Question", "question": "In the MS Outlook Calendar module, what is the exact difference between scheduling an 'Appointment' and scheduling a 'Meeting'?", "options": {"A": "An Appointment blocks time only on your own personal calendar without inviting anyone else, whereas a Meeting includes other attendees to whom Outlook sends email invitations with Accept/Tentative/Decline RSVP tracking", "B": "A Meeting cannot have a start time or end time", "C": "An Appointment automatically formats the hard drive", "D": "There is no difference"}, "correctAnswer": "A", "explanation": "An Appointment is a personal calendar entry involving only yourself; adding even one invitee converts it into a Meeting that sends calendar invitations via email.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T04", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS OneNote", "subtopic": "OneNote Hierarchy & Auto-Save", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "How is content hierarchically organized inside Microsoft OneNote, and why is there NO 'Save' button on the OneNote interface?", "options": {"A": "Hierarchy: `Notebook -> Sections (Tabs) -> Pages (and Subpages)`; OneNote saves every change automatically and continuously in real time", "B": "Hierarchy: `Workbook -> Worksheets -> Cells`; OneNote cannot save files", "C": "Hierarchy: `Database -> Tables -> Queries`; OneNote requires pressing F12 every minute", "D": "Hierarchy: `Presentation -> Slides -> Placeholders`"}, "correctAnswer": "A", "explanation": "MS OneNote (`.one` file extension) mimics a tabbed physical ring binder (`Notebook -> Sections -> Pages`) and automatically saves notes continuously as you type or draw.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T05", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "Send/Receive & Reply Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Outlook, which function key triggers 'Send/Receive All Folders' immediately, and what is the difference between pressing `Ctrl + R` and `Ctrl + Shift + R` on an incoming email?", "options": {"A": "`F9` = Send/Receive All; `Ctrl + R` = Reply to Sender only; `Ctrl + Shift + R` = Reply All (replies to Sender and all To/CC recipients)", "B": "`F5` = Send/Receive; `Ctrl + R` = Delete; `Ctrl + Shift + R` = Forward", "C": "`F7` = Send/Receive; `Ctrl + R` = Print; `Ctrl + Shift + R` = Close", "D": "`F12` = Send/Receive; `Ctrl + R` = Archive"}, "correctAnswer": "A", "explanation": "In Outlook: `F9` (or `Ctrl + M`) initiates Send/Receive All; `Ctrl + R` replies only to the sender; `Ctrl + Shift + R` replies to all recipients (`Reply All`); `Ctrl + F` forwards the email.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T06", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "Microsoft 365 Collaboration", "subtopic": "Real-Time Co-Authoring", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "In Microsoft 365, when three teachers simultaneously open and edit the same MS Word document or Excel workbook stored on OneDrive or SharePoint Online, seeing each other's live cursor flags in real time, what is this feature called?", "options": {"A": "Co-authoring (Real-time Collaboration)", "B": "Mail Merge", "C": "Compatibility Mode", "D": "Cold Booting"}, "correctAnswer": "A", "explanation": "Co-authoring allows multiple users to edit the same cloud-hosted `.docx`, `.xlsx`, or `.pptx` file concurrently in real time.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T07", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "Microsoft 365 Collaboration", "subtopic": "OneDrive vs SharePoint vs Teams", "difficulty": "Moderate", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match each Microsoft 365 collaboration tool with its core role:\n1. Microsoft OneDrive — (p) Enterprise team communication hub for persistent chat channels, audio/video meetings, and app integration\n2. Microsoft SharePoint — (q) Individual personal/work cloud file storage and multi-device sync\n3. Microsoft Teams — (r) Web-based organizational intranet sites, shared document libraries, and enterprise workflows", "options": {"A": "1-q, 2-r, 3-p", "B": "1-r, 2-q, 3-p", "C": "1-p, 2-r, 3-q", "D": "1-q, 2-p, 3-r"}, "correctAnswer": "A", "explanation": "OneDrive provides personal cloud storage (q); SharePoint powers organizational intranet sites and team document libraries (r); Teams provides chat, channels, and video conferencing (p).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T08", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "Outlook Rules & Out of Office", "difficulty": "Moderate", "questionType": "Application-based", "sourceType": "Original Practice Question", "question": "Which MS Outlook feature allows you to automatically move incoming emails from a specific sender into a designated folder, flag them, or play a sound as soon as they arrive?", "options": {"A": "Outlook Rules (`Home -> Rules -> Create Rule`)", "B": "Thesaurus", "C": "PivotTable", "D": "Slide Master"}, "correctAnswer": "A", "explanation": "Outlook Rules evaluate incoming or outgoing messages against user-defined conditions (sender, subject keywords, importance) and automatically execute actions (move to folder, categorize, forward).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T09", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "Sharing Permissions", "subtopic": "Can Edit vs Can View", "difficulty": "Moderate", "questionType": "Conceptual", "sourceType": "Original Practice Question", "question": "When sharing a file from OneDrive or MS Word/Excel/PowerPoint via a Share link, which permission setting allows recipients to read the document on screen but prevents them from modifying, downloading, or printing it?", "options": {"A": "`Can view` (with 'Block download' enabled)", "B": "`Can edit`", "C": "`Full Control Administrator`", "D": "`Co-authoring Owner`"}, "correctAnswer": "A", "explanation": "Sharing links in OneDrive/Microsoft 365 support 'Can edit' (read/write co-authoring) and 'Can view' (read-only, with an optional 'Block download' toggle).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-T10", "moduleCode": "T", "module": "T. Outlook and Other Tools", "topic": "MS Outlook", "subtopic": "Saved Single Email Extension", "difficulty": "Moderate", "questionType": "File Extension", "sourceType": "Original Practice Question", "question": "When you drag a single email message out of MS Outlook and save it onto your Windows Desktop, what is its default file extension?", "options": {"A": "`.msg` (Outlook Item Message format)", "B": "`.xlsx`", "C": "`.accdb`", "D": "`.exe`"}, "correctAnswer": "A", "explanation": "Individual Outlook messages saved to the Windows file system use the `.msg` extension (or `.eml` in standard RFC-822 mail clients).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U01", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Universal Office Shortcuts", "subtopic": "Insert Hyperlink Ctrl+K", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Verified PYQ", "question": "Which keyboard shortcut is used across MS Word, MS Excel, MS PowerPoint, and MS Outlook to open the 'Insert Hyperlink' dialog box?", "options": {"A": "`Ctrl + H`", "B": "`Ctrl + K`", "C": "`Ctrl + L`", "D": "`Ctrl + M`"}, "correctAnswer": "B", "explanation": "`Ctrl + K` is the universal shortcut to insert or edit a Hyperlink across all Microsoft Office applications. (`Ctrl + H` opens Find and Replace.)", "exam": "DSSSB TGT Computer Science", "year": 2021, "shift": "01 Aug 2021 Shift 1", "sourceReference": "DSSSB TGT CS Official Paper"}, {"id": "MS-U02", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Function Keys", "subtopic": "Save As F12 vs Print Preview Ctrl+F2", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Adapted PYQ", "q e active cell (without copying its formula)?", "options": {"A": "`Ctrl + Shift + \"` (Ctrl + Quote) copies the Value from the cell above, while `Ctrl + '` (Ctrl + Apostrophe) copies the unadjusted Formula from the cell above", "B": "`Ctrl + Z`", "C": "`Alt + Enter`", "D": "`Ctrl + Spacebar`"}, "correctAnswer": "A", "explanation": "In MS Excel: `Ctrl + \"` (`Ctrl + Shift + '`) copies the evaluated Value from the cell above; `Ctrl + '` copies the exact formula text from the cell above.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U07", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Excel Shortcuts", "subtopic": "Hide and Unhide Rows & Columns", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "In MS Excel, which keyboard shortcut hides the selected Row(s), and which keyboard shortcut hides the selected Column(s)?", "options": {"A": "Hide Row(s): `Ctrl + 9`; Hide Column(s): `Ctrl + 0`", "B": "Hide Row(s): `Ctrl + 1`; Hide Column(s): `Ctrl + 2`", "C": "Hide Row(s): `Alt + R`; Hide Column(s): `Alt + C`", "D": "Hide Row(s): `F9`; Hide Column(s): `F10`"}, "correctAnswer": "A", "explanation": "`Ctrl + 9` hides selected rows (`Ctrl + Shift + (` unhides rows), and `Ctrl + 0` hides selected columns (`Ctrl + Shift + )` unhides columns).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U08", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Excel Shortcuts", "subtopic": "Format Cells & Strikethrough", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Excel, what do the shortcuts `Ctrl + 1` and `Ctrl + 5` do?", "options": {"A": "`Ctrl + 1` opens the 'Format Cells' dialog box; `Ctrl + 5` applies or removes Strikethrough formatting (`Ctrl + 2` = Bold, `Ctrl + 3` = Italic, `Ctrl + 4` = Underline)", "B": "`Ctrl + 1` sets single line spacing; `Ctrl + 5` sets 1.5 line ab?", "options": {"A": "Called 'KeyTips'; pressing `Alt, N` opens the `Insert` tab (`Alt, H` = Home, `Alt, P` = Layout/Page Layout, `Alt, F` = File)", "B": "Called 'Bookmarks'; pressing `Alt, I`", "C": "Called 'Macros'; pressing `Alt, Z`", "D": "Called 'Slicers'; pressing `Alt, X`"}, "correctAnswer": "A", "explanation": "Ribbon keyboard badges are called KeyTips: `Alt + F` = File, `Alt + H` = Home, `Alt + N` = Insert, `Alt + P` = Page Layout / Layout, `Alt + M` = Formulas (Excel) / Mailings (Word), `Alt + A` = Data (Excel), `Alt + R` = Review, `Alt + W` = View.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U16", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Windows Shortcuts", "subtopic": "Windows Logo Key Combinations", "difficulty": "Moderate", "questionType": "Match-the-following", "sourceType": "Original Practice Question", "question": "Match the Windows OS shortcut key with its action:\n1. `Win + L` — (p) Open Windows File Explorer\n2. `Win + D` — (q) Lock the computer screen immediately\n3. `Win + E` — (r) Open the 'Run' command dialog box\n4. `Win + R` — (s) Show / Hide the Desktop (minimize/restore all open windows)", "options": {"A": "1-q, 2-s, 3-p, 4-r", "B": "1-s, 2-q, 3-p, 4-r", "C": "1-q, 2-p, 3-s, 4-r", "D": "1-r, 2-s, 3-p, 4-q"}, "correctAnswer": "A", "explanation": "`Win + L` = Lock PC (q); `Win + D` = Show/Hide Desktop (`Win + M` minimizes all) (s); `Win + E` = File Explorer (p); `Win + R` = Run dialog (r).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U17", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Windows Shortcuts", "subtopic": "Clipboard History & Screenshot", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In Windows 10 and Windows 11, which shortcut opens the 'Windows Clipboard History' panel (showing multiple previously copied items), and which shortcut launches the rectangular 'Snipping Tool' overlay?", "options": {"A": "Clipboard History: `Win + V`; Snipping Tool overlay: `Win + Shift + S`", "B": "Clipboard History: `Ctrl + V`; Snipping Tool: `Ctrl + S`", "C": "Clipboard History: `Alt + V`; Snipping Tool: `Alt + S`", "D": "Clipboard History: `Win + C`; Snipping Tool: `Win + P`"}, "correctAnswer": "A", "explanation": "`Win + V` opens Windows Clipboard History, and `Win + Shift + S` dims the screen to capture a rectangular, freeform, window, or full-screen snip.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U18", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Word Navigation", "subtopic": "Ctrl+Home vs Ctrl+End", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In an MS Word document of 80 pages, pressing `Home` moves the cursor to the beginning of the current line. What do `Ctrl + Home` and `Ctrl + End` do?", "options": {"A": "`Ctrl + Home` jumps to the very beginning of the document (Page 1, Line 1); `Ctrl + End` jumps to the very end of the document", "B": "`Ctrl + Home` closes Word; `Ctrl + End` shuts down the PC", "C": "`Ctrl + Home` moves to the top of the current page; `Ctrl + End` moves to the bottom of the current page", "D": "Both select the current paragraph"}, "correctAnswer": "A", "explanation": "`Home` / `End` move to the start/end of the current line; `Ctrl + Home` / `Ctrl + End` jump to the very beginning or very end of the entire document (or worksheet in Excel).", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U19", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Excel Shortcuts", "subtopic": "AutoSum & Insert Function", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "In MS Excel, which keyboard shortcut automatically inserts the `=SUM()` AutoSum formula for the adjacent column or row of numbers?", "options": {"A": "`Alt + =`", "B": "`Ctrl + =`", "C": "`Shift + =`", "D": "`Ctrl + S`"}, "correctAnswer": "A", "explanation": "Pressing `Alt + =` in MS Excel inserts the `=SUM(...)` AutoSum formula automatically. (In MS Word, `Alt + =` opens the Equation Editor.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D21", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Architecture", "subtopic": "Pipelining Hazard", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "In a pipelined microprocessor executing multiple instructions in overlapped stages (Fetch, Decode, Execute, Write-back), what happens when an instruction depends on the result of an immediately preceding instruction that has not yet finished its Write-back stage?", "options": {"A": "A Data Hazard (RAW - Read After Write) occurs, requiring pipeline forwarding/bypassing or a pipeline stall (bubble)", "B": "The CMOS battery explodes", "C": "The monitor resolution drops to 640x480", "D": "The hard disk formats itself"}, "correctAnswer": "A", "explanation": "A Read-After-Write (RAW) data dependency in an instruction pipeline causes a Data Hazard, resolved via operand forwarding or inserting stall cycles.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-D22", "moduleCode": "D", "module": "D. Hardware and Components", "topic": "CPU Architecture", "subtopic": "RISC vs CISC", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "How does a RISC (Reduced Instruction Set Computer, e.g., ARM) processor architecture differ from a CISC (Complex Instruction Set Computer, e.g., x86) architecture?", "options": {"A": "RISC uses a small set of fixed-length instructions executing in a single clock cycle with a load/store register-to-register model and a large number of general-purpose registers, whereas CISC uses variable-length multi-cycle complex instructions that can access memory directly", "B": "RISC has no registers and uses vacuum tubes", "C": "CISC cannot run operating systems", "D": "RISC instructions take 50 clock cycles each"}, "correctAnswer": "A", "explanation": "RISC emphasizes fixed-length instructions, single-cycle pipelined execution, and load-store architecture (only LOAD and STORE access memory), whereas CISC provides rich variable-length instructions.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H16", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Systems", "subtopic": "Gray Code Unit Distance", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Why is 'Gray Code' (Reflected Binary Code) called a 'Unit Distance Code' and widely used in rotary shaft encoders and Karnaugh maps (K-Maps)?", "options": {"A": "Because any two successive (adjacent) code words in Gray Code differ in ONLY ONE bit position, preventing transient switching glitches", "B": "Because Gray Code uses base-16 digits", "C": "Because Gray Code is a weighted code with weights 8-4-2-1", "D": "Because Gray Code requires 32 bits per decimal digit"}, "correctAnswer": "A", "explanation": "Gray Code is an unweighted cyclic code in which consecutive values differ by exactly 1 bit (Hamming distance = 1). Binary-to-Gray conversion: G_n = B_n, and G_i = B_{i+1} XOR B_i.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H17", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Systems", "subtopic": "Binary to Gray Conversion", "difficulty": "Difficult", "questionType": "Numerical", "sourceType": "Exam-pattern Question", "question": "What is the 4-bit Gray Code equivalent of the binary number `(1011)2`?", "options": {"A": "`1110`", "B": "`1011`", "C": "`0100`", "D": "`1101`"}, "correctAnswer": "A", "explanation": "To convert Binary `b3 b2 b1 b0 = 1 0 1 1` to Gray `g3 g2 g1 g0`: `g3 = b3 = 1`; `g2 = 1 XOR 0 = 1`; `g1 = 0 XOR 1 = 1`; `g0 = 1 XOR 1 = 0`. Result = `1110`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-H18", "moduleCode": "H", "module": "H. Data Representation", "topic": "Number Systems", "subtopic": "Excess-3 Self-Complementing Code", "difficulty": "Difficult", "questionType": "Conceptual", "sourceType": "Exam-pattern Question", "question": "Why is the 'Excess-3 (XS-3)' BCD code (obtained by adding `3` or `0011` to each 8421 BCD digit) known as a 'Self-Complementing Code'?", "options": {"A": "Because the 1's complement (bitwise inversion) of the Excess-3 code of any decimal digit automatically yields the Excess-3 code of that digit's 9's complement", "B": "Because it requires no electricity", "C": "Because it uses 16 bits per digit", "D": "Because it only represents negative numbers"}, "correctAnswer": "A", "explanation": "In Excess-3 (and 2421 code), inverting all 4 bits of a digit's code gives the exact Excess-3 representation of (9 - d), simplifying decimal subtraction hardware.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L16", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "OSI Model", "subtopic": "OSI 7 Layers Order & PDUs", "difficulty": "Difficult", "questionType": "Match-the-following", "sourceType": "Exam-pattern Question", "question": "Match the OSI Reference Model Layer with its corresponding Protocol Data Unit (PDU):\n1. Layer 1 (Physical Layer) — (p) Frame\n2. Layer 2 (Data Link Layer) — (q) Packet (or Datagram)\n3. Layer 3 (Network Layer) — (r) Segment (TCP) / Datagram (UDP)\n4. Layer 4 (Transport Layer) — (s) Raw Bit Stream", "options": {"A": "1-s, 2-p, 3-q, 4-r", "B": "1-p, 2-s, 3-q, 4-r", "C": "1-s, 2-q, 3-p, 4-r", "D": "1-r, 2-p, 3-q, 4-s"}, "correctAnswer": "A", "explanation": "OSI Layer PDUs from bottom up: Layer 1 Physical = Bits (s); Layer 2 Data Link = Frame (p); Layer 3 Network = Packet (q); Layer 4 Transport = Segment/Datagram (r); Layers 5–7 = Data/Message.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-L17", "moduleCode": "L", "module": "L. Network Fundamentals", "topic": "Addressing", "subtopic": "ARP vs RARP Protocol", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "In TCP/IP networking, DNS translates a Domain Name into an IP address. Which protocol translates a known 32-bit logical IPv4 Address into its corresponding 48-bit physical MAC Address on a local network?", "options": {"A": "ARP (Address Resolution Protocol)", "B": "RARP (Reverse ARP)", "C": "ICMP", "D": "SNMP"}, "correctAnswer": "A", "explanation": "ARP (Address Resolution Protocol) resolves a known IP address to an unknown physical MAC address via a local broadcast request. RARP / DHCP does the reverse.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "CF-N16", "moduleCode": "N", "module": "N. Cyber Safety", "topic": "Cryptography", "subtopic": "Symmetric vs Asymmetric Algorithms", "difficulty": "Difficult", "questionType": "Classification", "sourceType": "Exam-pattern Question", "question": "Which of the following correctly classifies cryptographic algorithms into 'Symmetric-Key (Secret-Key)' and 'Asymmetric-Key (Public-Key)' ciphers?", "options": {"A": "Symmetric: AES, DES, 3DES, Blowfish | Asymmetric: RSA, Diffie-Hellman, ECC (Elliptic Curve Cryptography)", "B": "Symmetric: RSA, ECC | Asymmetric: AES, DES", "C": "Symmetric: SHA-256, MD5 | Asymmetric: CRC-32", "D": "All encryption algorithms use only a single public key"}, "correctAnswer": "A", "explanation": "AES, DES, 3DES, Blowfish, and RC4 are Symmetric-key block/stream ciphers (same key encrypts and decrypts). RSA, Diffie-Hellman, ElGamal, and ECC are Asymmetric public-key algorithms. (SHA-256 and MD5 are one-way cryptographic hash functions.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P41", "moduleCode": "P", "module": "P. MS Word", "topic": "Mail Merge", "subtopic": "Alt+Shift+D and Alt+Shift+T Fields", "difficulty": "Difficult", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "In MS Word, which keyboard shortcuts insert a dynamic 'Date Field' and a dynamic 'Time Field' into a document or header?", "options": {"A": "Insert Date field: `Alt + Shift + D`; Insert Time field: `Alt + Shift + T` (and `Alt + Shift + P` inserts the Page Number field!)", "B": "Insert Date: `Ctrl + ;`; Insert Time: `Ctrl + Shift + :`", "C": "Insert Date: `F5`; Insert Time: `F6`", "D": "Insert Date: `Ctrl + D`; Insert Time: `Ctrl + T`"}, "correctAnswer": "A", "explanation": "Exam Trap: `Ctrl + ;` and `Ctrl + Shift + :` are MS EXCEL shortcuts! In MS WORD, `Alt + Shift + D` inserts the Date field, `Alt + Shift + T` inserts the Time field, and `Alt + Shift + P` inserts the Page Number field.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-P42", "moduleCode": "P", "module": "P. MS Word", "topic": "References and Reviewing", "subtopic": "Mark Entry Index & TOC Shortcuts", "difficulty": "Difficult", "questionType": "Shortcut-key", "sourceType": "Exam-pattern Question", "question": "In MS Word (`References` tab), what do the keyboard shortcuts `Alt + Shift + O`, `Alt + Shift + X`, and `Alt + Shift + I` mark in a document?", "options": {"A": "`Alt + Shift + O` = Mark Table of Contents Entry; `Alt + Shift + X` = Mark Index Entry; `Alt + Shift + I` = Mark Citation (Table of Authorities)", "B": "`Alt + Shift + O` = Open file; `Alt + Shift + X` = Cut; `Alt + Shift + I` = Italic", "C": "They change paragraph alignment", "D": "They insert shapes"}, "correctAnswer": "A", "explanation": "Advanced Word Reference shortcuts: `Alt + Shift + O` marks a TOC entry, `Alt + Shift + X` marks an Index entry, and `Alt + Shift + I` marks a legal citation for a Table of Authorities.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q66", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "OFFSET Function Output", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "In MS Excel, the function `=OFFSET(reference, rows, cols, [height], [width])` returns a reference shifted from a starting cell. If cell `A1 = 10` and you evaluate `=OFFSET(B2, 3, 2)`, which cell's value is returned?", "options": {"A": "Cell `D5` (starting at `B2`, moving 3 rows down to Row `2+3=5` and 2 columns right from Column `B` (`2+2=4`) to Column `D`)", "B": "Cell `B2`", "C": "Cell `C3`", "D": "Cell `E4`"}, "correctAnswer": "A", "explanation": "Starting at `B2` (Row 2, Col 2): moving `+3` rows reaches Row `5`, and moving `+2` columns right (`B -> C -> D`) reaches Column `D`, returning cell `D5`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q67", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "INDIRECT Function Evaluation", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "In MS Excel, if cell `A1` contains the text string `'B5'`, and cell `B5` contains the number `250`, what does the formula `=INDIRECT(A1) * 2` return?", "options": {"A": "`500` (because `INDIRECT(A1)` reads the text string `'B5'` inside `A1` and evaluates it as a live cell reference to `B5`, which holds `250`, and 250 * 2 = 500)", "B": "`#VALUE!`", "C": "`'B5B5'`", "D": "`2`"}, "correctAnswer": "A", "explanation": "`INDIRECT(ref_text)` converts a text string representing a cell address (`'B5'`) into an actual live cell reference (`B5`), returning `250 * 2 = 500`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q68", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "ROMAN and ARABIC Functions", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "What do the MS Excel functions `=ROMAN(49)` and `=ARABIC('L')` return?", "options": {"A": "`'XLIX'` and `50`", "B": "`'IL'` and `100`", "C": "`49` and `'50'`", "D": "`#NAME?`"}, "correctAnswer": "A", "explanation": "`=ROMAN(49)` converts the integer 49 into classic Roman numerals `'XLIX'` (40 + 9), and `=ARABIC('L')` (introduced in Excel 2013) converts the Roman numeral string `'L'` back to the number `50`.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q69", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Important Excel Functions", "subtopic": "BASE and DECIMAL Functions", "difficulty": "Difficult", "questionType": "Excel Formula-Output", "sourceType": "Exam-pattern Question", "question": "In MS Excel (2013+), what do the number-system conversion functions `=BASE(15, 2, 8)` and `=DECIMAL('FF', 16)` return?", "options": {"A": "`'00001111'` (15 in Base-2 padded to 8 characters) and `255` (`FF` in Base-16 converted to Decimal)", "B": "`'1111'` and `16`", "C": "`#NUM!` and `#VALUE!`", "D": "`2` and `16`"}, "correctAnswer": "A", "explanation": "`BASE(number, radix, [min_length])` converts `15` into binary (`radix=2`) padded to `8` digits (`'00001111'`). `DECIMAL('FF', 16)` converts Hex `FF` into decimal `255`. (Excel also has `DEC2BIN`, `BIN2DEC`, `DEC2HEX`, `HEX2DEC`.)", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-Q70", "moduleCode": "Q", "module": "Q. MS Excel", "topic": "Data Management", "subtopic": "Solver vs Goal Seek", "difficulty": "Difficult", "questionType": "Difference-based", "sourceType": "Exam-pattern Question", "question": "How does the MS Excel 'Solver' Add-in (`Data -> Analyze -> Solver`) go beyond the capabilities of 'Goal Seek'?", "options": {"A": "Goal Seek can vary only ONE input cell with no constraints to hit an exact target value, whereas Solver can optimize (Maximize, Minimize, or hit a Target) an objective cell by adjusting MULTIPLE variable cells simultaneously (up to 200) subject to multiple linear/non-linear inequality constraints", "B": "Solver can only format cell borders", "C": "Goal Seek can vary 500 cells whereas Solver varies only 1 cell", "D": "Solver is used only for spell checking"}, "correctAnswer": "A", "explanation": "Goal Seek is a single-variable root finder; Solver is a multi-variable linear/non-linear optimization add-in supporting Maximize/Minimize and explicit boundary constraints.", "exam": null, "year": null, "shift": null, "sourceReference": null}, {"id": "MS-U20", "moduleCode": "U", "module": "U. Shortcut Keys", "topic": "Access Shortcuts", "subtopic": "MS Access Specific Shortcuts", "difficulty": "Moderate", "questionType": "Shortcut-key", "sourceType": "Original Practice Question", "question": "While entering records in an MS Access Table Datasheet View or Form View, which keyboard shortcut inserts a brand-new blank record, and which shortcut copies the value from the same field in the previous record?", "options": {"A": "New Record: `Ctrl + +` (Ctrl + Plus); Copy value from previous record: `Ctrl + '` (Ctrl + Apostrophe)", "B": "New Record: `Ctrl + N`; Copy previous: `Ctrl + M`", "C": "New Record: `F5`; Copy previous: `F12`", "D": "New Record: `Alt + F4`; Copy previous: `Ctrl + W`"}, "correctAnswer": "A", "explanation": "In MS Access Datasheet/Form view: `Ctrl + +` jumps to a new blank record (`Ctrl + -` deletes the current record), and `Ctrl + '` duplicates the field value from the preceding record.", "exam": null, "year": null, "shift": null, "sourceReference": null}], "practicalBank": [{"id": "PRAC-W1", "app": "MS Word", "scenario": "Personalized Circulars for 250 Parents", "question": "A school coordinator has an Excel file (`Parents.xlsx`) containing 250 parent names, addresses, and student roll numbers, and wants to generate 250 personalized invitation letters in MS Word automatically. Which feature and Ribbon tab should be used?", "answer": "Mail Merge (`Mailings` Tab -> `Start Mail Merge` -> `Select Recipients` -> `Use an Existing List` -> `Insert Merge Field` -> `Finish & Merge`).", "keyTakeaway": "Mail Merge combines a Main Document (Word template) with a Data Source (Excel/Access/CSV) using `<<Merge Fields>>`."}, {"id": "PRAC-W2", "app": "MS Word", "scenario": "Landscape Table on Page 4 of a Portrait Report", "question": "In a 12-page Portrait project report, Page 4 contains a 14-column financial table that only fits in Landscape orientation. If you simply click `Layout -> Orientation -> Landscape`, all 12 pages turn Landscape. How do you make ONLY Page 4 Landscape?", "answer": "Place the cursor at the end of Page 3 and insert a `Next Page` Section Break (`Layout -> Breaks -> Next Page`), then place the cursor at the end of Page 4 and insert another `Next Page` Section Break. Finally, click inside Page 4 and set Orientation to `Landscape`.", "keyTakeaway": "Page orientation, margins, and headers/footers are section-level attributes controlled by Section Breaks."}, {"id": "PRAC-W3", "app": "MS Word", "scenario": "Collaborative Editing & Auditing Modifications", "question": "An editor is reviewing a policy draft and needs every insertion, deletion, and formatting change to be visibly recorded with the author's name so the committee can later Accept or Reject each change individually. Which feature and shortcut should be enabled?", "answer": "Enable `Track Changes` under `Review -> Tracking -> Track Changes` (or press `Ctrl + Shift + E`). Use `Accept` / `Reject` in the Changes group to finalize.", "keyTakeaway": "Track Changes (`Ctrl+Shift+E`) logs all edits as markup without permanently overwriting original text until accepted."}, {"id": "PRAC-W4", "app": "MS Word", "scenario": "Automated Table of Contents & Dynamic Page Updates", "question": "After writing a 50-page manual, the author wants an automatic Table of Contents on Page 2 that updates page numbers with a single keystroke when paragraphs are added. How is this achieved?", "answer": "Apply built-in `Heading 1`, `Heading 2`, and `Heading 3` styles (`Home -> Styles`) to all chapter/section titles, then click `References -> Table of Contents -> Automatic Table 1`. Press `F9` ('Update Table') whenever pages change.", "keyTakeaway": "Automatic TOC relies on Heading styles (`Heading 1–3`) and updates via `F9`."}, {"id": "PRAC-E1", "app": "MS Excel", "scenario": "Mixed Cell Reference Matrix Copy", "question": "Cell `B2` contains `100`, `C2` contains `200`, and `D1` contains tax rate `0.18`. You write `=B2 * $D$1` in cell `B3` and copy it across to `C3`. What formula appears in `C3` and what is its output?", "answer": "Formula in `C3` becomes `=C2 * $D$1` (because `B2` is relative and shifts to `C2`, while `$D$1` is absolute and stays locked). Output = `200 * 0.18 = 36`.", "keyTakeaway": "Lock constant tax/commission rates with `$D$1` (`F4`) so relative row/column data can multiply against the fixed cell."}, {"id": "PRAC-E2", "app": "MS Excel", "scenario": "COUNT vs COUNTA vs AVERAGE on Mixed Attendance Sheet", "question": "In range `C2:C7`, student test scores are recorded as: `80`, `90`, `\"Absent\"`, `70`, `\"Exempt\"`, and `60`. What do `=COUNT(C2:C7)`, `=COUNTA(C2:C7)`, and `=AVERAGE(C2:C7)` return?", "answer": "`COUNT(C2:C7) = 4` (counts only numeric scores 80, 90, 70, 60); `COUNTA(C2:C7) = 6` (counts all 6 non-empty cells); `AVERAGE(C2:C7) = (80+90+70+60)/4 = 75` (ignores text cells in both numerator and denominator!).", "keyTakeaway": "Text strings like `\"Absent\"` are ignored by `COUNT` and `AVERAGE`; if a student scored `0`, enter `0` rather than text if they should be included in the class average."}, {"id": "PRAC-E3", "app": "MS Excel", "scenario": "Preventing #DIV/0! and #N/A in Dashboard Reports", "question": "A sales sheet calculates Profit Margin as `=(Revenue - Cost)/Revenue`, which displays ugly `#DIV/0!` when Revenue is `0`. How do you display `'0%'` or `'Pending'` cleanly instead of `#DIV/0!`?", "answer": "Wrap the formula inside `IFERROR`: `=IFERROR((B2-C2)/B2, 0)` or `=IFERROR((B2-C2)/B2, \"Pending\")`.", "keyTakeaway": "`IFERROR(value, value_if_error)` catches `#DIV/0!`, `#N/A`, `#VALUE!`, `#REF!`, `#NAME?`, `#NUM!`, and `#NULL!`."}, {"id": "PRAC-E4", "app": "MS Excel", "scenario": "Restricting Marks Entry to 0–100 Whole Numbers", "question": "To prevent teachers from accidentally typing marks greater than 100 or negative numbers into cells `D2:D100`, which Excel tool should be configured?", "answer": "Select `D2:D100` -> `Data` Tab -> `Data Tools` -> `Data Validation` -> Set 'Allow:' to `Whole number`, 'Data:' to `between`, 'Minimum:' `0`, and 'Maximum:' `100` (and configure an Error Alert).", "keyTakeaway": "Data Validation restricts input values at the moment of data entry; Conditional Formatting only highlights values visually after entry."}, {"id": "PRAC-P1", "app": "MS PowerPoint", "scenario": "Global Branding & Removing Footer from Title Slide", "question": "You need to place an institute watermark and footer on all slides except the Title Slide, and change every slide's heading font from Calibri to Georgia in one action. How do you do this?", "answer": "Open `View -> Slide Master`, select the topmost Master slide to place the logo and change the Master Title font to Georgia. In `Insert -> Header & Footer`, check `'Don't show on title slide'`.", "keyTakeaway": "Edits on the top Slide Master cascade to all subordinate Slide Layouts; checking 'Don't show on title slide' keeps Slide 1 clean."}, {"id": "PRAC-P2", "app": "MS PowerPoint", "scenario": "Self-Running Exhibition Kiosk Presentation", "question": "A presentation at a science fair must loop continuously on a monitor without human clicks, advancing slides automatically at pre-recorded intervals and preventing viewers from accidentally advancing slides with a mouse click. How do you configure this?", "answer": "1. Record timings via `Slide Show -> Rehearse Timings`. 2. Open `Slide Show -> Set Up Slide Show` and select `'Browsed at a kiosk (full screen)'` (which automatically checks `'Loop continuously until Esc'` and disables manual mouse clicks).", "keyTakeaway": "'Browsed at a kiosk (full screen)' in Set Up Slide Show creates a locked, continuous loop ideal for public displays."}, {"id": "PRAC-A1", "app": "MS Access", "scenario": "Relational Schema & Preventing Orphan Fee Records", "question": "A school database has a `Students` table (`AdmissionNo` as Primary Key) and a `FeePayments` table (`ReceiptNo` as Primary Key, `AdmissionNo` as Foreign Key). How do you ensure a clerk can never enter a fee payment for a non-existent `AdmissionNo`?", "answer": "Open `Database Tools -> Relationships`, drag `AdmissionNo` from `Students` to `AdmissionNo` in `FeePayments` to create a One-to-Many (1:M) relationship, and check `'Enforce Referential Integrity'`.", "keyTakeaway": "Enforcing Referential Integrity on a Primary Key -> Foreign Key link guarantees zero orphan child records."}, {"id": "PRAC-A2", "app": "MS Access", "scenario": "Batch Updating Fee Structure by 10%", "question": "You want to increase the `TuitionFee` field by 10% for all courses in the `'Computer Science'` department inside an MS Access table in one operation. Which Query type is required?", "answer": "Create an `Update Query` (an Action Query): set `Criteria` under Department to `\"Computer Science\"` and set the `Update To:` row under `TuitionFee` to `[TuitionFee]*1.10`, then click `Run (!)`.", "keyTakeaway": "Update Queries modify existing records in bulk; Append Queries add new rows; Delete Queries remove rows."}], "mockTests": [{"id": "MT-01", "title": "Mock Test 1: Introduction & History of Computers (Modules A & B)", "category": "Sectional - Computer Fundamentals", "durationMins": 25, "questionIds": ["CF-A01", "CF-A02", "CF-A03", "CF-A04", "CF-A05", "CF-A06", "CF-A07", "CF-A08", "CF-A0
