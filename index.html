<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSSSB TGT Computer Science - Paper 2 Topics</title>
    <style>
        /* CSS Variables for Light/Dark Theming */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #2d3748;
            --header-color: #1a202c;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --card-text: #4a5568;
            --card-hover-bg: #ebf8ff;
            --card-hover-border: #63b3ed;
            --toggle-bg: #edf2f7;
            --toggle-text: #2d3748;
            --success-color: #48bb78;
            --success-bg: #f0fff4;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --header-color: #f8fafc;
            --card-bg: #1e293b;
            --card-border: #334155;
            --card-text: #cbd5e1;
            --card-hover-bg: #2d3748;
            --card-hover-border: #4a5568;
            --toggle-bg: #334155;
            --toggle-text: #f8fafc;
            --success-color: #38a169;
            --success-bg: #1c4532;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--header-color);
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
        }

        #theme-toggle {
            background-color: var(--toggle-bg);
            color: var(--toggle-text);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        #theme-toggle:hover {
            transform: scale(1.05);
        }

        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Topic Cards */
        .topic-card {
            background-color: var(--card-bg);
            color: var(--card-text);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 1.4;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
        }

        .topic-card:hover, .topic-card:focus-within {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--card-hover-border);
            background-color: var(--card-hover-bg);
        }

        /* The link wrapper inside the card */
        .topic-content {
            display: flex;
            align-items: center;
            flex: 1;
            text-decoration: none;
            color: inherit;
            outline: none;
        }

        .topic-num {
            background-color: var(--toggle-bg);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 0.85rem;
            transition: background-color 0.3s;
        }

        /* Completed State */
        .topic-card.completed {
            background-color: var(--success-bg);
            border-color: var(--success-color);
            opacity: 0.85;
        }

        .topic-card.completed .topic-title {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .topic-card.completed .topic-num {
            background-color: var(--success-color);
            color: white;
        }

        /* Check button */
        .check-btn {
            background: none;
            border: 2px solid var(--card-border);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: transparent;
            transition: all 0.2s ease;
            margin-left: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .check-btn:hover {
            border-color: var(--success-color);
        }

        .topic-card.completed .check-btn {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
        }

        @media (max-width: 600px) {
            .header-container {
                justify-content: center;
                text-align: center;
            }
            .grid-container {
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>DSSSB TGT Computer Science</h1>
        <button id="theme-toggle">
            <span id="theme-icon">🌙</span> 
            <span id="theme-text">Dark Mode</span>
        </button>
    </div>

    <div class="grid-container" id="topics-container">
        <!-- JS will populate cards here -->
    </div>

    <script>
        // ADD YOUR LINKS HERE: Replace "https://example.com" with the actual URLs you want to navigate to.
        const topics = [
            { title: "Operating System & Linux Commands", url: "https://example.com/os-linux" },
            { title: "Computer Network", url: "https://example.com/computer-network" },
            { title: "Number Systems, Boolean Alg & Digital Elec", url: "https://example.com/digital-logic" },
            { title: "DBMS, ER Modelling & SQL Queries", url: "https://example.com/dbms" },
            { title: "Programming in 'C'", url: "https://example.com/c-programming" },
            { title: "C++, OOPs and Java", url: "https://example.com/oops-java" },
            { title: "Data Structure and Algorithms", url: "https://example.com/dsa" },
            { title: "Software Engineering", url: "https://example.com/software-engineering" },
            { title: "Computer Fundamentals & MS Office", url: "https://example.com/fundamentals" },
            { title: "Computer Organisation & Architecture", url: "https://example.com/coa" },
            { title: "Cyber Security, Cryptography & Cyber Laws", url: "https://example.com/cyber-security" },
            { title: "Web Technologies", url: "https://example.com/web-tech" },
            { title: "Computer Graphics, Multimedia & Mobile Computing", url: "https://example.com/graphics" },
            { title: "MIS, DSS, Expert Systems, KM & Commerce", url: "https://example.com/mis-dss" },
            { title: "Engineering Maths", url: "https://example.com/maths" },
            { title: "Physics", url: "https://example.com/physics" }
        ];

        const container = document.getElementById('topics-container');
        let completedTopics = JSON.parse(localStorage.getItem('completedTopics')) || [];

        // Generate Cards
        topics.forEach((topic, index) => {
            const topicId = `topic-${index + 1}`;
            const num = (index + 1).toString().padStart(2, '0');
            const isCompleted = completedTopics.includes(topicId);
            
            const card = document.createElement('div');
            card.className = `topic-card ${isCompleted ? 'completed' : ''}`;
            card.dataset.id = topicId;
            
            // Note: target="_blank" opens the link in a new tab. Remove it if you want it to open in the same tab.
            card.innerHTML = `
                <a href="${topic.url}" target="_blank" class="topic-content">
                    <span class="topic-num">${num}</span> 
                    <span class="topic-title">${topic.title}</span>
                </a>
                <button class="check-btn" aria-label="Mark as completed" title="Mark as completed">✔</button>
            `;

            // Toggle Completion on Checkmark Click ONLY
            const checkBtn = card.querySelector('.check-btn');
            checkBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevents the link from triggering
                e.preventDefault(); 
                
                card.classList.toggle('completed');
                
                if (card.classList.contains('completed')) {
                    if (!completedTopics.includes(topicId)) completedTopics.push(topicId);
                } else {
                    completedTopics = completedTopics.filter(id => id !== topicId);
                }
                
                localStorage.setItem('completedTopics', JSON.stringify(completedTopics));
            });

            container.appendChild(card);
        });

        // Theme Toggle Logic
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateToggleUI('dark');
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            updateToggleUI(targetTheme);
        });

        function updateToggleUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }
    </script>
</body>
</html>
