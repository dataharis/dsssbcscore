<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSSSB TGT Computer Science - Syllabus Tracker</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Premium Theming */
        :root {
            /* Light Theme */
            --bg-gradient: linear-gradient(135deg, #f6f8fb 0%, #e9edf3 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --card-hover-bg: #f8fafc;
            --accent-color: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.2);
            --success-color: #10b981; /* Emerald */
            --success-glow: rgba(16, 185, 129, 0.2);
            --success-bg: #f0fdf4;
            --toggle-bg: #e2e8f0;
            --toggle-text: #475569;
            --shadow-sm: 0 2px 4px rgba(149, 157, 165, 0.1);
            --shadow-md: 0 8px 24px rgba(149, 157, 165, 0.15);
            --shadow-hover: 0 14px 28px rgba(99, 102, 241, 0.15);
            --border-color: rgba(226, 232, 240, 0.8);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --card-hover-bg: #27354f;
            --accent-color: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.15);
            --success-color: #34d399;
            --success-glow: rgba(52, 211, 153, 0.15);
            --success-bg: rgba(16, 185, 129, 0.1);
            --toggle-bg: #334155;
            --toggle-text: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 14px 28px rgba(0, 0, 0, 0.5);
            --border-color: rgba(51, 65, 85, 0.8);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header Section */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-text h1 {
            margin: 0 0 8px 0;
            font-size: clamp(1.75rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-text p {
            margin: 0;
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-wrapper {
            margin-top: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.4s ease;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .progress-track {
            height: 10px;
            background: var(--toggle-bg);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--success-color);
            width: 0%;
            border-radius: 20px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Theme Toggle Button */
        #theme-toggle {
            background-color: var(--card-bg);
            color: var(--toggle-text);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            font-family: inherit;
        }

        #theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: var(--accent-color);
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Cards */
        .topic-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            
            /* Animation properties */
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s ease forwards;
        }

        /* Left highlight accent */
        .topic-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent-color);
        }

        .topic-card:hover::before {
            opacity: 1;
        }

        .topic-content {
            display: flex;
            align-items: center;
            flex: 1;
            text-decoration: none;
            color: inherit;
            outline: none;
            gap: 16px;
        }

        .topic-num {
            background-color: var(--toggle-bg);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .topic-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        /* Completed State */
        .topic-card.completed {
            background-color: var(--success-bg);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 20px var(--success-glow);
        }

        .topic-card.completed::before {
            background-color: var(--success-color);
            opacity: 1;
        }

        .topic-card.completed .topic-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .topic-card.completed .topic-num {
            background-color: var(--success-color);
            color: white;
        }

        /* Custom Check Button */
        .check-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-left: 15px;
            flex-shrink: 0;
            color: transparent;
        }

        .check-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .check-btn:hover {
            border-color: var(--success-color);
            transform: scale(1.1);
        }

        .topic-card.completed .check-btn {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: white;
            box-shadow: 0 4px 12px var(--success-glow);
        }

        /* Entrance Animation Keyframes */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 24px;
            }
            #theme-toggle {
                align-self: flex-start;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-container">
            <div class="header-text">
                <h1>DSSSB TGT Computer Science</h1>
                <p>Paper 2 Syllabus Tracker</p>
                
                <div class="progress-wrapper">
                    <div class="progress-header">
                        <span>Course Progress</span>
                        <span id="progress-text">0/16 Completed</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>
                </div>
            </div>

            <button id="theme-toggle">
                <span id="theme-icon">🌙</span> 
                <span id="theme-text">Dark Mode</span>
            </button>
        </div>

        <div class="grid-container" id="topics-container">
            <!-- JS will populate cards here -->
        </div>
    </div>

    <script>
        const topics = [
            { title: "Operating System & Linux Commands", url: "pages/os.html" },
            { title: "Computer Network", url: "pages/cn.html" },
            { title: "Number Systems, Boolean Alg & Digital Elec", url: "pages/ns.html" },
            { title: "DBMS, ER Modelling & SQL Queries", url: "pages/dbms.html" },
            { title: "Programming in 'C'", url: "pages/c.html" },
            { title: "C++, OOPs and Java", url: "pages/java.html" },
            { title: "Data Structure and Algorithms", url: "pages/dsa.html" },
            { title: "Software Engineering", url: "pages/se.html" },
            { title: "Computer Fundamentals & MS Office", url: "pages/fund.html" },
            { title: "Computer Organisation & Architecture", url: "pages/coa.html" },
            { title: "Cyber Security, Cryptography & Cyber Laws", url: "pages/cyber.html" },
            { title: "Web Technologies", url: "pages/web.html" },
            { title: "Computer Graphics, Multimedia & Mobile Computing", url: "pages/graphics.html" },
            { title: "MIS, DSS, Expert Systems, KM & Commerce", url: "pages/comm.html" },
            { title: "Engineering Maths", url: "pages/math.html" },
            { title: "Physics", url: "pages/physics.html" }
        ];

        const container = document.getElementById('topics-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        let completedTopics = JSON.parse(localStorage.getItem('completedTopics')) || [];

        // Update Progress Bar
        function updateProgress() {
            const total = topics.length;
            const completed = completedTopics.length;
            const percentage = (completed / total) * 100;
            
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${completed}/${total} Completed (${Math.round(percentage)}%)`;
        }

        // Generate Cards
        topics.forEach((topic, index) => {
            const topicId = `topic-${index + 1}`;
            const num = (index + 1).toString().padStart(2, '0');
            const isCompleted = completedTopics.includes(topicId);
            
            const card = document.createElement('div');
            card.className = `topic-card ${isCompleted ? 'completed' : ''}`;
            card.dataset.id = topicId;
            
            // Add staggered animation delay
            card.style.animationDelay = `${index * 0.05}s`;
            
            // SVG Checkmark included inside the button
            card.innerHTML = `
                <a href="${topic.url}" class="topic-content">
                    <span class="topic-num">${num}</span> 
                    <span class="topic-title">${topic.title}</span>
                </a>
                <button class="check-btn" aria-label="Mark as completed" title="Mark as completed">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            `;

            // Toggle Completion Logic
            const checkBtn = card.querySelector('.check-btn');
            checkBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                e.preventDefault(); 
                
                card.classList.toggle('completed');
                
                if (card.classList.contains('completed')) {
                    if (!completedTopics.includes(topicId)) completedTopics.push(topicId);
                } else {
                    completedTopics = completedTopics.filter(id => id !== topicId);
                }
                
                localStorage.setItem('completedTopics', JSON.stringify(completedTopics));
                updateProgress();
            });

            container.appendChild(card);
        });

        // Initial Progress Call
        updateProgress();

        // Theme Toggle Logic
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateToggleUI('dark');
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme);
            updateToggleUI(targetTheme);
        });

        function updateToggleUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }
    </script>
</body>
</html>
