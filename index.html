<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSSSB TGT Computer Science - Paper 2 Topics</title>
    <style>
        /* CSS Variables for Light/Dark Theming */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #2d3748;
            --header-color: #1a202c;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --card-text: #4a5568;
            --card-hover-bg: #4299e1;
            --card-hover-text: #ffffff;
            --toggle-bg: #edf2f7;
            --toggle-text: #2d3748;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --header-color: #f8fafc;
            --card-bg: #1e293b;
            --card-border: #334155;
            --card-text: #cbd5e1;
            --card-hover-bg: #3b82f6;
            --card-hover-text: #ffffff;
            --toggle-bg: #334155;
            --toggle-text: #f8fafc;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
        }

        /* Base Styles */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header Layout */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--header-color);
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem); /* Responsive typography */
        }

        /* Toggle Button */
        #theme-toggle {
            background-color: var(--toggle-bg);
            color: var(--toggle-text);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        #theme-toggle:hover {
            transform: scale(1.05);
        }

        /* Responsive Grid */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            /* Auto-fit ensures it drops to fewer columns on small screens */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Topic Buttons */
        .topic-btn {
            background-color: var(--card-bg);
            color: var(--card-text);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
        }

        .topic-btn:hover {
            background-color: var(--card-hover-bg);
            color: var(--card-hover-text);
            border-color: var(--card-hover-bg);
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        /* Badge/Numbering style within the button */
        .topic-num {
            background-color: var(--toggle-bg);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 0.85rem;
            transition: background-color 0.3s;
        }

        .topic-btn:hover .topic-num {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            .header-container {
                justify-content: center;
                text-align: center;
            }
            .grid-container {
                gap: 15px;
            }
            .topic-btn {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>DSSSB TGT Computer Science</h1>
        <button id="theme-toggle">
            <span id="theme-icon">🌙</span> 
            <span id="theme-text">Dark Mode</span>
        </button>
    </div>

    <div class="grid-container">
        <button class="topic-btn"><span class="topic-num">01</span> Operating System & Linux Commands</button>
        <button class="topic-btn"><span class="topic-num">02</span> Computer Network</button>
        <button class="topic-btn"><span class="topic-num">03</span> Number Systems, Boolean Alg & Digital Elec</button>
        <button class="topic-btn"><span class="topic-num">04</span> DBMS, ER Modelling & SQL Queries</button>
        <button class="topic-btn"><span class="topic-num">05</span> Programming in 'C'</button>
        <button class="topic-btn"><span class="topic-num">06</span> C++, OOPs and Java</button>
        <button class="topic-btn"><span class="topic-num">07</span> Data Structure and Algorithms</button>
        <button class="topic-btn"><span class="topic-num">08</span> Software Engineering</button>
        <button class="topic-btn"><span class="topic-num">09</span> Computer Fundamentals & MS Office</button>
        <button class="topic-btn"><span class="topic-num">10</span> Computer Organisation & Architecture</button>
        <button class="topic-btn"><span class="topic-num">11</span> Cyber Security, Cryptography & Cyber Laws</button>
        <button class="topic-btn"><span class="topic-num">12</span> Web Technologies</button>
        <button class="topic-btn"><span class="topic-num">13</span> Computer Graphics, Multimedia & Mobile Computing</button>
        <button class="topic-btn"><span class="topic-num">14</span> MIS, DSS, Expert Systems, KM & Commerce</button>
        <button class="topic-btn"><span class="topic-num">15</span> Engineering Maths</button>
        <button class="topic-btn"><span class="topic-num">16</span> Physics</button>
    </div>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        
        // Check for saved user preference in localStorage
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            updateToggleUI('dark');
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('theme', targetTheme); // Save preference
            
            updateToggleUI(targetTheme);
        });

        function updateToggleUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light Mode';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark Mode';
            }
        }
    </script>
</body>
</html>
